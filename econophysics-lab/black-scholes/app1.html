/* =====================  COMPARE ALL METHODS  ===================== */
function compareAllMethods(params){
  const {S0,K,r,sigma,T,nS,nT} = params;
  const exact = bsCall(S0,K,r,sigma,T);
  const dS = (S0*3)/nS, Smax = nS*dS;

  function thomas(a,b,c,d){
    const n=b.length, cp=new Array(n), dp=new Array(n);
    cp[0]=c[0]/b[0]; dp[0]=d[0]/b[0];
    for (let i=1;i<n;i++){ const m=b[i]-a[i]*cp[i-1]; cp[i]=c[i]/m; dp[i]=(d[i]-a[i]*dp[i-1])/m; }
    const x=new Array(n); x[n-1]=dp[n-1];
    for (let i=n-2;i>=0;i--) x[i]=dp[i]-cp[i]*x[i+1];
    return x;
  }
  function priceAt(V,dSg){ const i=Math.round(S0/dSg); return V[i]; }

  // Explicit FD
  function explicit(){
    const dtStable = 0.9/(sigma*sigma*nS*nS);
    const steps = Math.max(20, Math.ceil(T/dtStable)), dt=T/steps;
    let V = Array.from({length:nS+1},(_,i)=>Math.max(i*dS-K,0));
    for (let s=0;s<steps;s++){
      const Vn = V.slice();
      for (let i=1;i<nS;i++){
        const a=0.5*dt*(sigma*sigma*i*i - r*i), b=1-dt*(sigma*sigma*i*i+r), c=0.5*dt*(sigma*sigma*i*i+r*i);
        Vn[i]=a*V[i-1]+b*V[i]+c*V[i+1];
      }
      Vn[0]=0; Vn[nS]=Smax-K*Math.exp(-r*(s+1)*dt);
      V=Vn;
    }
    return priceAt(V,dS);
  }

  // Implicit FD
  function implicit(){
    const dt=T/nT, n=nS-1;
    let V = Array.from({length:nS+1},(_,i)=>Math.max(i*dS-K,0));
    const a=new Array(n),b=new Array(n),c=new Array(n);
    for (let k=0;k<n;k++){ const i=k+1;
      a[k]=-0.5*dt*(sigma*sigma*i*i-r*i); b[k]=1+dt*(sigma*sigma*i*i+r); c[k]=-0.5*dt*(sigma*sigma*i*i+r*i);
    }
    for (let s=0;s<nT;s++){
      const bdN=Smax-K*Math.exp(-r*(s+1)*dt);
      const d=new Array(n);
      for (let k=0;k<n;k++){ d[k]=V[k+1]; if (k===n-1) d[k]-=c[k]*bdN; }
      V=[0,...thomas(a,b,c,d),bdN];
    }
    return priceAt(V,dS);
  }

  // Crank–Nicolson
  function crankNicolson(){
    const dt=T/nT, n=nS-1;
    let V = Array.from({length:nS+1},(_,i)=>Math.max(i*dS-K,0));
    const aL=new Array(n),bL=new Array(n),cL=new Array(n),aR=new Array(n),bR=new Array(n),cR=new Array(n);
    for (let k=0;k<n;k++){ const i=k+1;
      const al=0.25*dt*(sigma*sigma*i*i-r*i), be=-0.5*dt*(sigma*sigma*i*i+r), ga=0.25*dt*(sigma*sigma*i*i+r*i);
      aL[k]=-al; bL[k]=1-be; cL[k]=-ga; aR[k]=al; bR[k]=1+be; cR[k]=ga;
    }
    for (let s=0;s<nT;s++){
      const bdN=Smax-K*Math.exp(-r*(s+1)*dt);
      const d=new Array(n);
      for (let k=0;k<n;k++) d[k]=aR[k]*(k===0?0:V[k])+bR[k]*V[k+1]+cR[k]*(k===n-1?bdN:V[k+2]);
      V=[0,...thomas(aL,bL,cL,d),bdN];
    }
    return priceAt(V,dS);
  }

  // Finite Volume (explicit, conservative flux form)
  function finiteVolume(){
    const dt=0.4/(sigma*sigma*nS*nS), steps=Math.max(30,Math.ceil(T/dt)), dtA=T/steps;
    let V = Array.from({length:nS},(_,i)=>Math.max((i+0.5)*dS-K,0));
    for (let s=0;s<steps;s++){
      const Vn=V.slice();
      for (let i=1;i<nS-1;i++){
        const Sc=(i+0.5)*dS;
        const diff=sigma*sigma*Sc*Sc*(V[i+1]-2*V[i]+V[i-1])/(dS*dS);
        const drift=r*Sc*(V[i+1]-V[i-1])/(2*dS);
        Vn[i]=V[i]+dtA*(0.5*diff+drift-r*V[i]);
      }
      Vn[0]=0; Vn[nS-1]=Smax-K*Math.exp(-r*(s+1)*dtA);
      V=Vn;
    }
    return V[Math.round(S0/dS)];
  }

  // Finite Element (linear hats, backward Euler)
  function finiteElement(){
    const dt=T/nT, n=nS-1, h=dS;
    let V = Array.from({length:nS+1},(_,i)=>Math.max(i*dS-K,0));
    const a=new Array(n),b=new Array(n),c=new Array(n);
    for (let k=0;k<n;k++){ const i=k+1, Si=i*dS;
      const stiff=sigma*sigma*Si*Si/(h*h), conv=r*Si/(2*h);
      a[k]=-dt*(0.5*stiff-conv); b[k]=1+dt*(stiff+r); c[k]=-dt*(0.5*stiff+conv);
    }
    for (let s=0;s<nT;s++){
      const bdN=Smax-K*Math.exp(-r*(s+1)*dt);
      const d=new Array(n);
      for (let k=0;k<n;k++){ d[k]=V[k+1]; if (k===n-1) d[k]-=c[k]*bdN; }
      V=[0,...thomas(a,b,c,d),bdN];
    }
    return priceAt(V,dS);
  }

  // Monte Carlo
  function monteCarlo(N){
    function z(){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
      return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
    let sum=0, sumSq=0;
    for (let p=0;p<N;p++){
      const ST = S0*Math.exp((r-0.5*sigma*sigma)*T + sigma*Math.sqrt(T)*z());
      const pay = Math.max(ST-K,0);
      sum+=pay; sumSq+=pay*pay;
    }
    const mean=sum/N, price=mean*Math.exp(-r*T);
    const variance=(sumSq/N - mean*mean);
    const stderr = Math.sqrt(variance/N)*Math.exp(-r*T);
    return { price, stderr };
  }

  // Binomial (CRR)
  function binomial(n){
    const dt=T/n, u=Math.exp(sigma*Math.sqrt(dt)), d=1/u, p=(Math.exp(r*dt)-d)/(u-d), disc=Math.exp(-r*dt);
    let V = Array.from({length:n+1},(_,i)=>Math.max(S0*Math.pow(u,n-i)*Math.pow(d,i)-K,0));
    for (let s=n-1;s>=0;s--){
      const Vn=new Array(s+1);
      for (let i=0;i<=s;i++) Vn[i]=disc*(p*V[i]+(1-p)*V[i+1]);
      V=Vn;
    }
    return V[0];
  }

  // Trinomial (Boyle)
  function trinomial(n){
    const dt=T/n, dx=sigma*Math.sqrt(3*dt), nu=r-0.5*sigma*sigma;
    const pu=0.5*((sigma*sigma*dt+nu*nu*dt*dt)/(dx*dx)+nu*dt/dx);
    const pd=0.5*((sigma*sigma*dt+nu*nu*dt*dt)/(dx*dx)-nu*dt/dx);
    const pm=1-pu-pd, disc=Math.exp(-r*dt);
    let V=[]; for (let j=-n;j<=n;j++) V.push(Math.max(S0*Math.exp(j*dx)-K,0));
    for (let s=n-1;s>=0;s--){
      const Vn=new Array(2*s+1);
      for (let i=0;i<Vn.length;i++) Vn[i]=disc*(pu*V[i+2]+pm*V[i+1]+pd*V[i]);
      V=Vn;
    }
    return V[0];
  }

  const mc = monteCarlo(5000);
  return {
    exact,
    rows: [
      ['Explicit FD',       explicit()],
      ['Implicit FD',       implicit()],
      ['Crank–Nicolson',    crankNicolson()],
      ['Finite Volume',     finiteVolume()],
      ['Finite Element',    finiteElement()],
      ['Monte Carlo',       mc.price, mc.stderr],
      ['Binomial Tree',     binomial(nT)],
      ['Trinomial Tree',    trinomial(nT)]
    ]
  };
}

function comparisonPanel(root){
  const S=root.querySelector('#cmpS'), K=root.querySelector('#cmpK'), r=root.querySelector('#cmpR'),
        sig=root.querySelector('#cmpSig'), T=root.querySelector('#cmpT'), steps=root.querySelector('#cmpSteps');
  const body = root.querySelector('#cmpBody');
  const canvas = root.querySelector('#cmpCanvas');

  function draw(rows, exact){
    const { ctx, w, h } = sizeCanvas(canvas);
    ctx.clearRect(0,0,w,h);
    const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2');
    const vals = rows.map(r=>r[1]);
    const lo = Math.min(exact,...vals)*0.97, hi = Math.max(exact,...vals)*1.03;
    function toY(v){ return h - ((v-lo)/(hi-lo))*h*0.85 - h*0.08; }
    ctx.strokeStyle=border; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(0,toY(exact)); ctx.lineTo(w,toY(exact)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=getCss('--text-dim'); ctx.font='11px monospace';
    ctx.fillText('exact = '+exact.toFixed(4), 8, toY(exact)-6);
    const bw = w/rows.length;
    rows.forEach(([name,val],i) => {
      const x = i*bw + bw*0.2, bwid = bw*0.6;
      const y = toY(val);
      ctx.fillStyle = Math.abs(val-exact) < 0.01*exact ? accent : accent2;
      ctx.fillRect(x, Math.min(y,toY(exact)), bwid, Math.abs(y-toY(exact)) || 2);
      ctx.save();
      ctx.translate(x+bwid/2, h-4);
      ctx.rotate(-Math.PI/5);
      ctx.fillStyle = getCss('--text-muted'); ctx.font='10px monospace'; ctx.textAlign='right';
      ctx.fillText(name, 0, 0);
      ctx.restore();
    });
  }

  function run(){
    const params = {
      S0:parseFloat(S.value), K:parseFloat(K.value), r:parseFloat(r.value)/100,
      sigma:parseFloat(sig.value)/100, T:parseFloat(T.value),
      nS:parseInt(steps.value,10), nT:parseInt(steps.value,10)
    };
    const { exact, rows } = compareAllMethods(params);
    draw(rows, exact);
    body.innerHTML = rows.map(([name,val,se]) => {
      const err = Math.abs(val-exact);
      return `<tr style="border-top:1px solid var(--border-soft);">
        <td style="padding:8px 10px;">${name}</td>
        <td style="padding:8px 10px;" class="mono">$${val.toFixed(4)}</td>
        <td style="padding:8px 10px;" class="mono">$${err.toFixed(4)}${se?(' ± '+(2*se).toFixed(4)+' (MC 95% CI)'):''}</td>
      </tr>`;
    }).join('') + `<tr style="border-top:2px solid var(--border);">
        <td style="padding:8px 10px; font-weight:600;">Exact (Black–Scholes)</td>
        <td style="padding:8px 10px;" class="mono">$${exact.toFixed(4)}</td><td></td></tr>`;
  }
  [S,K,r,sig,T,steps].forEach(el => el.oninput = run);
  window.addEventListener('resize', run);
  run();
}

        bdN = S_max - K*np.exp(-r*(step+1)*dt)
        d = aR*np.r_[0, V[1:-2]] + bR*V[1:-1] + cR*np.r_[V[2:-1], bdN]
        interior = solve_banded((1,1), ab, d)
        V = np.concatenate(([0.0], interior, [bdN]))

    return np.interp(S0, S, V)

def finite_volume(S0, K, r, sigma, T, n_cells=60, S_max=None):
    S_max = S_max or 3*K
    dS = S_max/n_cells
    Sc = (np.arange(n_cells) + 0.5)*dS          # cell-center prices
    V = np.maximum(Sc - K, 0.0)                 # cell averages

    dt = 0.4/(sigma**2 * n_cells**2)
    n_T = max(30, int(np.ceil(T/dt)))
    dt = T/n_T

    for step in range(n_T):
        diff = sigma**2 * Sc[1:-1]**2 * (V[2:] - 2*V[1:-1] + V[:-2]) / dS**2
        drift = r * Sc[1:-1] * (V[2:] - V[:-2]) / (2*dS)
        V_new = V.copy()
        V_new[1:-1] = V[1:-1] + dt*(0.5*diff + drift - r*V[1:-1])
        V_new[0] = 0.0
        V_new[-1] = S_max - K*np.exp(-r*(step+1)*dt)
        V = V_new

    return np.interp(S0, Sc, V)

# ---- Example: run it ----

finite_element: `import numpy as np
from scipy.linalg import solve_banded

def finite_element(S0, K, r, sigma, T, n_elem=30, n_T=40, S_max=None):
    """Linear ('hat') basis functions, backward-Euler in time."""
    S_max = S_max or 3*K
    h, dt = S_max/n_elem, T/n_T
    S = np.linspace(0, S_max, n_elem+1)
    V = np.maximum(S - K, 0.0)

    i = np.arange(1, n_elem)
    Si = i*h
    stiff = sigma**2 * Si**2 / h**2
    conv = r * Si / (2*h)
    a = -dt*(0.5*stiff - conv)
    b = 1 + dt*(stiff + r)
    c = -dt*(0.5*stiff + conv)
    ab = np.zeros((3, n_elem-1))
    ab[0,1:], ab[1,:], ab[2,:-1] = c[:-1], b, a[1:]

    for step in range(n_T):
        bdN = S_max - K*np.exp(-r*(step+1)*dt)
        d = V[1:-1].copy()
        d[-1] -= c[-1]*bdN
        interior = solve_banded((1,1), ab, d)
        V = np.concatenate(([0.0], interior, [bdN]))

    return np.interp(S0, S, V)

# ---- Example: run it ----

def monte_carlo(S0, K, r, sigma, T, n_paths=100_000, seed=None):
    rng = np.random.default_rng(seed)
    Z = rng.standard_normal(n_paths)
    ST = S0 * np.exp((r - 0.5*sigma**2)*T + sigma*np.sqrt(T)*Z)
    payoff = np.maximum(ST - K, 0.0)

    price = np.exp(-r*T) * payoff.mean()
    stderr = np.exp(-r*T) * payoff.std(ddof=1) / np.sqrt(n_paths)
    return price, stderr          # price ± 2*stderr is the ~95% CI

def binomial_crr(S0, K, r, sigma, T, n=200):
    dt = T/n
    u = np.exp(sigma*np.sqrt(dt))
    d = 1/u
    p = (np.exp(r*dt) - d) / (u - d)
    disc = np.exp(-r*dt)

    j = np.arange(n+1)
    S_T = S0 * u**(n-j) * d**j
    V = np.maximum(S_T - K, 0.0)

    for step in range(n, 0, -1):
        V = disc * (p*V[:-1] + (1-p)*V[1:])
    return V[0]

def trinomial_boyle(S0, K, r, sigma, T, n=200):
    dt = T/n
    dx = sigma*np.sqrt(3*dt)
    nu = r - 0.5*sigma**2
    pu = 0.5*((sigma**2*dt + nu**2*dt**2)/dx**2 + nu*dt/dx)
    pd = 0.5*((sigma**2*dt + nu**2*dt**2)/dx**2 - nu*dt/dx)
    pm = 1 - pu - pd
    disc = np.exp(-r*dt)

    j = np.arange(-n, n+1)
    S_T = S0*np.exp(j*dx)
    V = np.maximum(S_T - K, 0.0)

    for step in range(n, 0, -1):
        V = disc * (pu*V[2:] + pm*V[1:-1] + pd*V[:-2])
    return V[0]

# ---- Example: run it ----

/* ============================================================================
   MODULE: OPTION PRICING CALCULATOR  (Tab 07 — BUILT)
   Six live sliders (S, K, σ, r, q, T) drive: call/put price, all core Greeks,
   and four linked visualizations — price evolution (time decay), payoff
   diagram, terminal probability distribution, and sensitivity plots.
   Every element on the page redraws on every slider input — no "calculate"
   button.
   ============================================================================ */
(function(){

  function erf(x){
    const sign = x < 0 ? -1 : 1; x = Math.abs(x);
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const t = 1/(1+p*x);
    const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
    return sign*y;
  }
  function N(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
  function phi(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function sizeCanvas(canvas){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
    canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(canvas.width/r.width, canvas.height/r.height);
    return { ctx, w:r.width, h:r.height };
  }

  /* ---- Core pricing model, with continuous dividend yield q ---- */
  function d1d2(S,K,r,q,sigma,T){
    const d1 = (Math.log(S/K) + (r - q + 0.5*sigma*sigma)*T) / (sigma*Math.sqrt(T));
    const d2 = d1 - sigma*Math.sqrt(T);
    return [d1,d2];
  }
  function callPrice(S,K,r,q,sigma,T){
    if (T<=1e-8) return Math.max(S-K,0);
    const [d1,d2] = d1d2(S,K,r,q,sigma,T);
    return S*Math.exp(-q*T)*N(d1) - K*Math.exp(-r*T)*N(d2);
  }
  function putPrice(S,K,r,q,sigma,T){
    if (T<=1e-8) return Math.max(K-S,0);
    const [d1,d2] = d1d2(S,K,r,q,sigma,T);
    return K*Math.exp(-r*T)*N(-d2) - S*Math.exp(-q*T)*N(-d1);
  }
  function greeks(S,K,r,q,sigma,T){
    const Tc = Math.max(T,1e-6);
    const [d1,d2] = d1d2(S,K,r,q,sigma,Tc);
    const eqT = Math.exp(-q*Tc), erT = Math.exp(-r*Tc);
    return {
      callDelta: eqT*N(d1),
      putDelta: -eqT*N(-d1),
      gamma: eqT*phi(d1)/(S*sigma*Math.sqrt(Tc)),
      vega: S*eqT*phi(d1)*Math.sqrt(Tc)/100,
      callTheta: (-S*eqT*phi(d1)*sigma/(2*Math.sqrt(Tc)) - r*K*erT*N(d2) + q*S*eqT*N(d1))/365,
      putTheta: (-S*eqT*phi(d1)*sigma/(2*Math.sqrt(Tc)) + r*K*erT*N(-d2) - q*S*eqT*N(-d1))/365,
      callRho: K*Tc*erT*N(d2)/100,
      putRho: -K*Tc*erT*N(-d2)/100,
      d1, d2
    };
  }

  /* ---- Shared state, read by every panel on redraw ---- */
  let P = { S:100, K:100, sigma:0.25, r:0.03, q:0.01, T:1.0 };
  const REDRAWERS = [];
  function redrawAll(){ REDRAWERS.forEach(fn => fn()); }

  /* ========================= CONTROL PANEL ========================= */
  function controlPanel(root){
    const ids = ['S','K','Sig','R','Q','T'];
    const sl = {}, vl = {};
    ids.forEach(id => { sl[id]=root.querySelector('#calc'+id); vl[id]=root.querySelector('#calc'+id+'Val'); });

    function sync(){
      P.S = parseFloat(sl.S.value);
      P.K = parseFloat(sl.K.value);
      P.sigma = parseFloat(sl.Sig.value)/100;
      P.r = parseFloat(sl.R.value)/100;
      P.q = parseFloat(sl.Q.value)/100;
      P.T = parseFloat(sl.T.value);

      vl.S.textContent = P.S.toFixed(0);
      vl.K.textContent = P.K.toFixed(0);
      vl.Sig.textContent = (P.sigma*100).toFixed(1)+'%';
      vl.R.textContent = (P.r*100).toFixed(2)+'%';
      vl.Q.textContent = (P.q*100).toFixed(2)+'%';
      vl.T.textContent = P.T.toFixed(2)+' yr';

      redrawAll();
    }
    ids.forEach(id => sl[id].oninput = sync);
    sync();
  }

  /* ========================= RESULTS PANEL (price + Greeks) ========================= */
  function resultsPanel(root){
    const out = {
      call: root.querySelector('#outCallPrice'),
      put: root.querySelector('#outPutPrice'),
      d1: root.querySelector('#outD1'), d2: root.querySelector('#outD2'),

      const g = greeks(P.S,P.K,P.r,P.q,P.sigma,P.T);
      out.call.textContent = '$'+c.toFixed(3);
      out.put.textContent = '$'+p.toFixed(3);

      out.cDelta.textContent = g.callDelta.toFixed(4);
      out.pDelta.textContent = g.putDelta.toFixed(4);

      out.vega.textContent = g.vega.toFixed(4);
      out.cTheta.textContent = g.callTheta.toFixed(4);
      out.pTheta.textContent = g.putTheta.toFixed(4);
      out.cRho.textContent = g.callRho.toFixed(4);
      out.pRho.textContent = g.putRho.toFixed(4);
    }
    REDRAWERS.push(draw);
  }

  /* ========================= DISPLAY 1: PRICE EVOLUTION (time decay) ========================= */
  function priceEvolutionPanel(root){
    const canvas = root.querySelector('#evoCanvas');
    function draw(){
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2'), textDim=getCss('--text-dim');

      const Tmax = Math.max(P.T, 0.02);
      const N_PTS = 100;
      const callPts=[], putPts=[];
      for (let i=0;i<=N_PTS;i++){
        const t = Tmax*(1 - i/N_PTS); // from Tmax down to 0
        callPts.push([Tmax-t, callPrice(P.S,P.K,P.r,P.q,P.sigma,t)]);
        putPts.push([Tmax-t, putPrice(P.S,P.K,P.r,P.q,P.sigma,t)]);
      }
      const allV = callPts.concat(putPts).map(p=>p[1]);
      const vlo = Math.min(0,...allV), vhi = Math.max(...allV)*1.08 || 1;
      function toX(elapsed){ return (elapsed/Tmax)*w; }
      function toY(v){ return h - ((v-vlo)/(vhi-vlo))*h*0.9 - h*0.05; }

      ctx.strokeStyle=border; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,toY(0)); ctx.lineTo(w,toY(0)); ctx.stroke();

      function plot(pts,color){
        ctx.beginPath();
        pts.forEach(([x,v],i) => { const px=toX(x), py=toY(v); i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); });

      [[curCall,accent],[curPut,accent2]].forEach(([v,color]) => {

      });

      ctx.fillStyle=textDim; ctx.font='11px monospace';

  }

  /* ========================= DISPLAY 2: PAYOFF DIAGRAM ========================= */
  function payoffPanel(root){
    const canvas = root.querySelector('#payoffCanvas');
    function draw(){
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2'), textDim=getCss('--text-dim');

      const Smin = P.K*0.4, Smax = P.K*1.8;
      const N_PTS=140;
      const payoffCall=[], payoffPut=[], valCall=[], valPut=[];
      for (let i=0;i<=N_PTS;i++){
        const S = Smin + (i/N_PTS)*(Smax-Smin);
        payoffCall.push([S, Math.max(S-P.K,0)]);
        payoffPut.push([S, Math.max(P.K-S,0)]);
        valCall.push([S, callPrice(S,P.K,P.r,P.q,P.sigma,P.T)]);
        valPut.push([S, putPrice(S,P.K,P.r,P.q,P.sigma,P.T)]);
      }
      const allV = payoffCall.concat(payoffPut,valCall,valPut).map(p=>p[1]);
      const vhi = Math.max(...allV)*1.08 || 1;
      function toX(S){ return ((S-Smin)/(Smax-Smin))*w; }
      function toY(v){ return h - (v/vhi)*h*0.9 - h*0.04; }

      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(toX(P.K),0); ctx.lineTo(toX(P.K),h); ctx.stroke();
      ctx.setLineDash([]);

      function plot(pts,color,alpha,width,dashed){
        ctx.beginPath();

        if (dashed) ctx.setLineDash([5,4]);

        ctx.setLineDash([]); ctx.globalAlpha=1;
      }
      plot(payoffCall, accent, 0.35, 1.4, true);
      plot(payoffPut, accent2, 0.35, 1.4, true);
      plot(valCall, accent, 1, 2.2, false);
      plot(valPut, accent2, 1, 2.2, false);

      // current stock price marker
      ctx.strokeStyle=getCss('--text-muted'); ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.moveTo(toX(P.S),0); ctx.lineTo(toX(P.S),h); ctx.stroke(); ctx.setLineDash([]);

      ctx.fillStyle=textDim; ctx.font='11px monospace';
      ctx.fillText('K', toX(P.K)-5, h-4);

    REDRAWERS.push(draw);

  /* ========================= DISPLAY 3: PROBABILITY DISTRIBUTION ========================= */
  function distributionPanel(root){
    const canvas = root.querySelector('#distCanvas');
    function draw(){
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2'), textDim=getCss('--text-dim');
      const Tc = Math.max(P.T, 0.01);

      // risk-neutral lognormal density of S_T
      const mu = Math.log(P.S) + (P.r - P.q - 0.5*P.sigma*P.sigma)*Tc;
      const sd = P.sigma*Math.sqrt(Tc);
      function density(S){
        if (S<=0) return 0;
        const z = (Math.log(S)-mu)/sd;
        return phi(z)/(S*sd);
      }
      const Smin = Math.max(1, P.S*Math.exp(-4*sd)), Smax = P.S*Math.exp(4*sd);
      const N_PTS=160;
      const pts=[];
      for (let i=0;i<=N_PTS;i++){
        const S = Smin+(i/N_PTS)*(Smax-Smin);
        pts.push([S, density(S)]);
      }
      const dmax = Math.max(...pts.map(p=>p[1]))*1.1 || 1;
      function toX(S){ return ((S-Smin)/(Smax-Smin))*w; }
      function toY(d){ return h - (d/dmax)*h*0.9 - h*0.04; }

      // shade ITM region (S > K) in accent, OTM (S < K) in accent2 — for a call
      function shade(condFn, color){
        ctx.beginPath();
        ctx.moveTo(toX(Smin), toY(0));
        pts.forEach(([S,d]) => { if (condFn(S)) ctx.lineTo(toX(S), toY(d)); else ctx.lineTo(toX(S), toY(0)); });
        ctx.lineTo(toX(Smax), toY(0));
        ctx.closePath();
        ctx.fillStyle=color; ctx.globalAlpha=0.22; ctx.fill(); ctx.globalAlpha=1;
      }
      shade(S => S > P.K, accent);
      shade(S => S <= P.K, accent2);

      // outline curve
      ctx.beginPath();
      pts.forEach(([S,d],i) => { const x=toX(S), y=toY(d); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle = getCss('--text'); ctx.lineWidth=1.6; ctx.stroke();

      // K and S0 markers
      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(toX(P.K),0); ctx.lineTo(toX(P.K),h); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=textDim; ctx.font='11px monospace';
      ctx.fillText('K', toX(P.K)-5, h-4);
      ctx.fillText('S₀', toX(P.S)-8, 14);

      const [d1,d2] = d1d2(P.S,P.K,P.r,P.q,P.sigma,Tc);
      ctx.fillStyle=accent;
      ctx.fillText('P(Sₜ > K) = N(d₂) = '+N(d2).toFixed(4), 8, h-4);
    }
    REDRAWERS.push(draw);
  }

  /* ========================= DISPLAY 4: SENSITIVITY PLOTS (small multiples) ========================= */
  function sensitivityPanel(root){
    const configs = [
      { canvas: root.querySelector('#sensSCanvas'), label:'vs. Stock price (S)',
        range:() => [P.K*0.4, P.K*1.8],
        fn:(x)=>[callPrice(x,P.K,P.r,P.q,P.sigma,P.T), putPrice(x,P.K,P.r,P.q,P.sigma,P.T)],
        current:()=>P.S },
      { canvas: root.querySelector('#sensSigCanvas'), label:'vs. Volatility (σ)',
        range:() => [0.02, 1.0],
        fn:(x)=>[callPrice(P.S,P.K,P.r,P.q,x,P.T), putPrice(P.S,P.K,P.r,P.q,x,P.T)],
        current:()=>P.sigma },

/* ============================================================================
   MODULE: VOLATILITY  (Tab 08 — BUILT)
   Historical vs. implied vs. local vs. stochastic volatility, the smile/skew,
   and an interactive pseudo-3D volatility surface. All simulations are
   schematic (for building intuition), not fitted to real market data.
   ============================================================================ */
(function(){

  function erf(x){
    const sign = x < 0 ? -1 : 1; x = Math.abs(x);
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const t = 1/(1+p*x);
    const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
    return sign*y;
  }
  function N(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
  function phi(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function sizeCanvas(canvas){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
    canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(canvas.width/r.width, canvas.height/r.height);
    return { ctx, w:r.width, h:r.height };
  }
  function randNormal(){
    let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }

  function d1d2(S,K,r,sigma,T){
    const d1=(Math.log(S/K)+(r+0.5*sigma*sigma)*T)/(sigma*Math.sqrt(T));
    return [d1, d1-sigma*Math.sqrt(T)];
  }
  function bsCall(S,K,r,sigma,T){
    if (T<=1e-8) return Math.max(S-K,0);
    const [d1,d2]=d1d2(S,K,r,sigma,T);
    return S*N(d1)-K*Math.exp(-r*T)*N(d2);
  }
  function bsVega(S,K,r,sigma,T){
    const [d1]=d1d2(S,K,r,sigma,T);
    return S*phi(d1)*Math.sqrt(T);
  }
  /* Implied volatility via Newton–Raphson with bisection fallback */
  function impliedVol(price,S,K,r,T){
    let sigma = 0.3;
    for (let i=0;i<50;i++){
      const diff = bsCall(S,K,r,sigma,T) - price;
      const vega = bsVega(S,K,r,sigma,T);
      if (Math.abs(diff) < 1e-6) break;
      if (vega < 1e-8) break;
      sigma -= diff/vega;
      if (sigma <= 0.001) sigma = 0.001;
      if (sigma > 5) sigma = 5;
    }
    return sigma;
  }

  /* ---- Ambient hero: a volatility surface wireframe, gently rotating ---- */
  function heroCanvas(canvas){
    const ctx = canvas.getContext('2d');
    let raf, angle = 0.6;
    function size(){
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
      canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(canvas.width/r.width, canvas.height/r.height);
    }
    size();
    window.addEventListener('resize', size);
    function ivAt(m,t){ return 0.18 + 0.09*m*m + 0.06*Math.exp(-2*t); } // m: log-moneyness, t: maturity
    function step(){
      const w = canvas.getBoundingClientRect().width, h = canvas.getBoundingClientRect().height;
      angle += 0.003;
      ctx.clearRect(0,0,w,h);
      const accent = getCss('--accent');
      const nK=14, nT=8;
      const cosA=Math.cos(angle*0.3), sinA=Math.sin(angle*0.3);
      function project(i,j,v){
        const x = (i-nK/2)*1.0, y=(j-nT/2)*1.4;
        const iso_x = (x*cosA - y*sinA);
        const iso_y = (x*sinA + y*cosA)*0.5 - v*40;
        return [w/2 + iso_x*(w/(nK*2)), h*0.75 + iso_y*0.9];
      }
      ctx.strokeStyle = accent; ctx.globalAlpha = 0.35; ctx.lineWidth=1;
      for (let j=0;j<nT;j++){
        ctx.beginPath();
        for (let i=0;i<nK;i++){
          const m=(i/(nK-1)-0.5)*2, t=0.2+j*0.35;
          const [x,y]=project(i,j,ivAt(m,t));
          i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha=1;
      raf = requestAnimationFrame(step);
    }
    step();
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else step(); });
  }

  /* ========================= 8.1 HISTORICAL VOLATILITY ========================= */
  function historicalVolDemo(root){
    const canvas = root.querySelector('#histCanvas');
    const windowSlider = root.querySelector('#histWindow');
    const windowVal = root.querySelector('#histWindowVal');
    const regenBtn = root.querySelector('#histRegen');
    let series = null;

    function genSeries(){
      const n = 500; const prices=[100]; let vol = 0.15;
      for (let i=0;i<n;i++){
        // regime-switching volatility: occasional jumps in vol level (clustering)
        if (Math.random() < 0.01) vol = 0.12 + Math.random()*0.45;
        const dt = 1/252;
        const ret = (0.05-0.5*vol*vol)*dt + vol*Math.sqrt(dt)*randNormal();
        prices.push(prices[prices.length-1]*Math.exp(ret));
      }
      return prices;
    }

    function rollingVol(prices, win){
      const logrets = [];
      for (let i=1;i<prices.length;i++) logrets.push(Math.log(prices[i]/prices[i-1]));
      const out = [];
      for (let i=win;i<=logrets.length;i++){
        const slice = logrets.slice(i-win,i);
        const mean = slice.reduce((a,b)=>a+b,0)/win;
        const varr = slice.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(win-1);
        out.push(Math.sqrt(varr*252));
      }
      return out;
    }

    function draw(){
      if (!series) series = genSeries();
      const win = parseInt(windowSlider.value,10);
      windowVal.textContent = win + ' days';
      const vols = rollingVol(series, win);

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2');
      const h1 = h*0.5, h2 = h*0.5;

      // top: price series
      const pmin=Math.min(...series), pmax=Math.max(...series);
      ctx.beginPath();
      series.forEach((p,i) => {
        const x=(i/(series.length-1))*w, y=h1 - ((p-pmin)/(pmax-pmin))*h1*0.9 - h1*0.05;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.strokeStyle=accent2; ctx.lineWidth=1.4; ctx.stroke();

      // divider
      ctx.strokeStyle=border; ctx.beginPath(); ctx.moveTo(0,h1); ctx.lineTo(w,h1); ctx.stroke();

      // bottom: rolling annualized vol
      const vmax = Math.max(...vols)*1.15 || 1;
      ctx.beginPath();
      vols.forEach((v,i) => {
        const x = ((i+win)/(series.length-1))*w, y = h1 + h2 - (v/vmax)*h2*0.85 - h2*0.05;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.stroke();

      ctx.fillStyle = getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('price', 6, 12);
      ctx.fillText(win+'-day rolling annualized volatility', 6, h1+14);
    }
    windowSlider.oninput = draw;
    regenBtn.onclick = () => { series = null; draw(); };
    window.addEventListener('resize', draw);
    draw();
  }

  /* ========================= 8.2 IMPLIED VOLATILITY ========================= */
  function impliedVolDemo(root){
    const canvas = root.querySelector('#ivCanvas');
    const priceSlider = root.querySelector('#ivPrice');
    const priceVal = root.querySelector('#ivPriceVal');
    const out = root.querySelector('#ivOut');
    const S=100, K=100, r=0.03, T=1;

    function draw(){
      const price = parseFloat(priceSlider.value);

      out.innerHTML = `Implied volatility: <strong style="color:var(--accent);">${(iv*100).toFixed(2)}%</strong> — the σ that makes the Black–Scholes formula output exactly this market price.`;

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2');

      const prices = sigmas.map(s => bsCall(S,K,r,s,T));
      const pmin=Math.min(...prices), pmax=Math.max(...prices);
      function toX(s){ return (s/1.2)*w; }
      function toY(p){ return h - ((p-pmin)/(pmax-pmin))*h*0.85 - h*0.08; }

      ctx.beginPath();
      sigmas.forEach((s,i) => { const x=toX(s), y=toY(prices[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=accent2; ctx.lineWidth=2; ctx.stroke();

      // horizontal line at target price, vertical at solved sigma
      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(0,toY(price)); ctx.lineTo(w,toY(price)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(toX(iv),0); ctx.lineTo(toX(iv),h); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(toX(iv),toY(price),5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('σ →', w-24, h-4);
      ctx.fillText('price (this curve = the pricing formula, inverted)', 6, 12);
    }
    priceSlider.oninput = draw;
    window.addEventListener('resize', draw);
    draw();
  }

  /* ========================= 8.3 LOCAL VOLATILITY (Dupire, schematic) ========================= */
  function localVolDemo(root){
    const canvas = root.querySelector('#localVolCanvas');
    const skewSlider = root.querySelector('#localSkew');
    const skewVal = root.querySelector('#localSkewVal');
    const S=100, T=1;

    // schematic implied-vol smile as a function of strike
    function impliedSmile(K, skew){
      const m = Math.log(K/S);
      return 0.20 - skew*m + 0.10*m*m;
    }
    // Dupire-style local vol is steeper than the implied smile that generates it (schematic 2x amplification, illustrative only)
    function localVolFromSmile(K, skew){
      const iv = impliedSmile(K, skew);
      const m = Math.log(K/S);
      return Math.max(0.05, iv - skew*m); // schematic: local vol skew ≈ 2x implied vol skew
    }

    function draw(){
      const skew = parseFloat(skewSlider.value);
      skewVal.textContent = skew.toFixed(2);
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2');

      const Ks = []; for (let k=60;k<=150;k+=1) Ks.push(k);
      const ivs = Ks.map(k=>impliedSmile(k,skew));
      const lvs = Ks.map(k=>localVolFromSmile(k,skew));
      const allV = ivs.concat(lvs);
      const vmin=Math.min(...allV)*0.9, vmax=Math.max(...allV)*1.1;
      function toX(k){ return ((k-60)/90)*w; }
      function toY(v){ return h - ((v-vmin)/(vmax-vmin))*h*0.85 - h*0.08; }

      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(toX(S),0); ctx.lineTo(toX(S),h); ctx.stroke(); ctx.setLineDash([]);

      function plot(vals,color){
        ctx.beginPath();
        Ks.forEach((k,i) => { const x=toX(k), y=toY(vals[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
        ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.stroke();
      }
      plot(ivs, accent);
      plot(lvs, accent2);

      ctx.fillStyle=getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('K', toX(S)-4, h-4);
      ctx.fillStyle=accent; ctx.fillText('● Implied vol (market-observed)', 8, 14);
      ctx.fillStyle=accent2; ctx.fillText('● Local vol (Dupire, derived)', 8, 30);
    }
    skewSlider.oninput = draw;
    window.addEventListener('resize', draw);
    draw();
  }

  /* ========================= 8.4 STOCHASTIC VOLATILITY (Heston-style CIR, schematic) ========================= */
  function stochasticVolDemo(root){
    const canvas = root.querySelector('#svCanvas');
    const kappaSlider = root.querySelector('#svKappa');
    const xiSlider = root.querySelector('#svXi');
    const kappaVal = root.querySelector('#svKappaVal');
    const xiVal = root.querySelector('#svXiVal');
    const regenBtn = root.querySelector('#svRegen');

    function simulate(kappa, xi){
      const n=252, dt=1/252, theta=0.04, v0=0.04;
      let v = v0; const path=[Math.sqrt(v)];
      const priceRets=[0]; let logP=0;
      for (let i=0;i<n;i++){
        const dW1 = randNormal()*Math.sqrt(dt), dW2 = randNormal()*Math.sqrt(dt);
        v = Math.max(0, v + kappa*(theta-v)*dt + xi*Math.sqrt(v)*dW1); // CIR variance process
        logP += -0.5*v*dt + Math.sqrt(v)*dW2;
        path.push(Math.sqrt(v));
        priceRets.push(Math.exp(logP)*100);
      }
      return { path, priceRets };
    }

    let data = null;
    function draw(){
      const kappa = parseFloat(kappaSlider.value), xi = parseFloat(xiSlider.value);
      kappaVal.textContent = kappa.toFixed(1);
      xiVal.textContent = xi.toFixed(2);
      if (!data) data = simulate(kappa,xi);

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2');

      const pmin=Math.min(...data.priceRets), pmax=Math.max(...data.priceRets);
      ctx.beginPath();
      data.priceRets.forEach((p,i) => { const x=(i/(data.priceRets.length-1))*w, y=h1-((p-pmin)/(pmax-pmin))*h1*0.85-h1*0.05; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=accent2; ctx.lineWidth=1.4; ctx.stroke();

      ctx.strokeStyle=border; ctx.beginPath(); ctx.moveTo(0,h1); ctx.lineTo(w,h1); ctx.stroke();

      const vmax = Math.max(...data.path)*1.15;
      ctx.beginPath();
      data.path.forEach((v,i) => { const x=(i/(data.path.length-1))*w, y=h1+h2-(v/vmax)*h2*0.85-h2*0.05; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.stroke();

      ctx.fillStyle=getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('simulated price path', 6, 12);
      ctx.fillText('instantaneous volatility √v(t) — itself a random process', 6, h1+14);
    }
    function regen(){ data=null; draw(); }

  /* ========================= 8.5 VOLATILITY SMILE / SKEW ========================= */
  function smileSkewDemo(root){
    const canvas = root.querySelector('#smileCanvas');
    const atmSlider = root.querySelector('#smileAtm');
    const skewSlider = root.querySelector('#smileSkew');
    const curvSlider = root.querySelector('#smileCurv');
    const atmVal = root.querySelector('#smileAtmVal');
    const skewVal = root.querySelector('#smileSkewVal');
    const curvVal = root.querySelector('#smileCurvVal');
    const assetButtons = root.querySelectorAll('.asset-btn');
    const S = 100;
    let assetType = 'equity';

    const PRESETS = {
      equity: { atm:0.22, skew:0.09, curv:0.10 },   // downward-sloping skew ("smirk")
      fx:     { atm:0.12, skew:0.00, curv:0.14 }    // symmetric smile
    };

    function applyPreset(type){
      assetType = type;
      const p = PRESETS[type];
      atmSlider.value = p.atm; skewSlider.value = p.skew; curvSlider.value = p.curv;
      assetButtons.forEach(b => b.classList.toggle('active', b.dataset.asset===type));
      draw();
    }

    function draw(){
      const atm=parseFloat(atmSlider.value), skew=parseFloat(skewSlider.value), curv=parseFloat(curvSlider.value);
      atmVal.textContent=(atm*100).toFixed(1)+'%'; skewVal.textContent=skew.toFixed(2); curvVal.textContent=curv.toFixed(2);

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent');

      const Ks=[]; for (let k=60;k<=150;k+=1) Ks.push(k);
      function iv(k){ const m=Math.log(k/S); return Math.max(0.02, atm - skew*m + curv*m*m); }
      const ivs = Ks.map(iv);
      const vmin=Math.min(...ivs)*0.9, vmax=Math.max(...ivs)*1.1;
      function toX(k){ return ((k-60)/90)*w; }
      function toY(v){ return h - ((v-vmin)/(vmax-vmin))*h*0.85 - h*0.08; }

      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(toX(S),0); ctx.lineTo(toX(S),h); ctx.stroke(); ctx.setLineDash([]);

      ctx.beginPath();
      Ks.forEach((k,i) => { const x=toX(k), y=toY(ivs[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=accent; ctx.lineWidth=2.4; ctx.stroke();

      ctx.fillStyle=getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('ATM (K=S)', toX(S)-30, h-4);
      ctx.fillText('K (strike) →', w-90, h-4);
      ctx.fillText('implied vol', 6, 12);
    }
    [atmSlider,skewSlider,curvSlider].forEach(s => s.oninput = draw);
    assetButtons.forEach(b => b.onclick = () => applyPreset(b.dataset.asset));
    window.addEventListener('resize', draw);
    applyPreset('equity');
  }

  /* ========================= 8.6 VOLATILITY SURFACE (pseudo-3D) ========================= */
  function surfacePlotDemo(root){
    const canvas = root.querySelector('#surfaceCanvas');
    const rotSlider = root.querySelector('#surfRot');
    const skewSlider = root.querySelector('#surfSkew');
    const termSlider = root.querySelector('#surfTerm');
    const rotVal = root.querySelector('#surfRotVal');
    const skewVal = root.querySelector('#surfSkewVal');
    const termVal = root.querySelector('#surfTermVal');
    const S=100;
    const nK=18, nT=12;

    function ivAt(K,T,skew,termSlope){
      const m = Math.log(K/S);
      const atmT = 0.15 + termSlope*(1-Math.exp(-2*T)); // term structure: rises/falls toward long maturities
      return Math.max(0.03, atmT - skew*m + 0.08*m*m);
    }

    function draw(){
      const rot = parseFloat(rotSlider.value), skew=parseFloat(skewSlider.value), term=parseFloat(termSlider.value);
      rotVal.textContent = rot.toFixed(0)+'°'; skewVal.textContent=skew.toFixed(2); termVal.textContent=term.toFixed(2);

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const accent=getCss('--accent'), accent2=getCss('--accent-2'), border=getCss('--border-soft');
      const angle = rot*Math.PI/180;
      const cosA=Math.cos(angle), sinA=Math.sin(angle);

      const grid=[];
      for (let j=0;j<nT;j++){
        grid[j]=[];
        for (let i=0;i<nK;i++){
          const K = S*0.5 + (i/(nK-1))*S*1.2;
          const T = 0.1 + (j/(nT-1))*2.9;
          grid[j][i] = { K, T, iv: ivAt(K,T,skew,term) };
        }
      }
      function project(i,j,v){
        const x=(i-nK/2)*1.0, y=(j-nT/2)*1.3;
        const isoX = x*cosA - y*sinA;
        const isoY = (x*sinA + y*cosA)*0.5 - v*160;
        return [w/2 + isoX*(w/(nK*1.7)), h*0.78 + isoY*0.8];
      }

      // draw far-to-near for a simple painter's-algorithm depth order
      const order = []; for (let j=0;j<nT;j++) order.push(j);
      order.forEach(j => {
        ctx.beginPath();
        for (let i=0;i<nK;i++){
          const [x,y] = project(i,j,grid[j][i].iv);
          i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
        ctx.strokeStyle = accent; ctx.globalAlpha=0.7; ctx.lineWidth=1.3; ctx.stroke();
      });
      for (let i=0;i<nK;i++){
        ctx.beginPath();
        for (let j=0;j<nT;j++){
          const [x,y] = project(i,j,grid[j][i].iv);
          j===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
        ctx.strokeStyle = accent2; ctx.globalAlpha=0.35; ctx.lineWidth=1; ctx.stroke();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle=getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('strike K →', w-70, h-6);
      ctx.fillText('↗ maturity T', 8, h-6);
      ctx.fillText('height = implied vol', 8, 14);
    }
    [rotSlider,skewSlider,termSlider].forEach(s => s.oninput = draw);
    window.addEventListener('resize', draw);
    draw();
  }

  function payoffSVG({ lines, xLabel, yLabel, note }){

      </svg>`;

  /* Flow diagram: boxes left-to-right connected by arrows, for processes/participants */
  function flowSVG(steps){
    const W=560, H=140, n=steps.length, bw=Math.min(120, (W-40)/n - 14);
    const gap = (W-40-bw*n)/(n-1 || 1);
    let boxes='', arrows='';
    steps.forEach((s,i) => {
      const x = 20 + i*(bw+gap), y = H/2-26;
      boxes += `
        <rect x="${x}" y="${y}" width="${bw}" height="52" rx="9" fill="var(--accent-dim)" stroke="var(--accent)" stroke-width="1.3"/>
        <text x="${x+bw/2}" y="${y+22}" fill="var(--text)" font-size="11.5" font-family="sans-serif" text-anchor="middle" font-weight="600">${s.title}</text>
        <text x="${x+bw/2}" y="${y+38}" fill="var(--text-muted)" font-size="9.5" font-family="sans-serif" text-anchor="middle">${s.sub||''}</text>`;
      if (i<n-1){
        const x2 = x+bw, x3 = x2+gap;
        arrows += `<line x1="${x2+4}" y1="${H/2}" x2="${x3-8}" y2="${H/2}" stroke="var(--text-dim)" stroke-width="1.6" marker-end="url(#arrowhead9)"/>`;
      }
    });
    return `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-height:150px;">
        <defs><marker id="arrowhead9" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="var(--text-dim)"/></marker></defs>
        ${boxes}${arrows}

  }

  function structureSVG(layers){
    const W=480, H=160, pad=16, lh=(H-2*pad)/layers.length;
    let rows='';
    layers.forEach((l,i) => {
      const y = pad + i*lh;
      rows += `
        <rect x="${pad}" y="${y+3}" width="${W-2*pad}" height="${lh-6}" rx="6" fill="${l.color||'var(--accent-dim)'}" stroke="var(--border)" stroke-width="1"/>
        <text x="${pad+14}" y="${y+lh/2+4}" fill="var(--text)" font-size="12" font-family="sans-serif" font-weight="600">${l.label}</text>
        <text x="${W-pad-14}" y="${y+lh/2+4}" fill="var(--text-muted)" font-size="10.5" font-family="monospace" text-anchor="end">${l.tag||''}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-height:180px;">${rows}</svg>`;
  }

    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
    canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(canvas.width/r.width, canvas.height/r.height);
    return { ctx, w:r.width, h:r.height };
  }
  function randNormal(){
    let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }
  function randPoisson(lambda){
    const L = Math.exp(-lambda); let k=0, p=1;
    do { k++; p *= Math.random(); } while (p > L);
    return k-1;
  }

    { id:'heston', name:'Heston Stochastic Volatility Model', fixes:'Letting volatility be its own random process',
      theory:'Introduced in Tab 08, Section 8.4: adds a second stochastic differential equation for the variance \\(v_t\\) itself, typically mean-reverting (CIR-style) and correlated with the stock\'s own Brownian motion — capturing the empirically observed "leverage effect" and volatility clustering that local volatility cannot.',

    { id:'sabr', name:'SABR Model', fixes:'Modeling the forward-rate smile with a tractable formula',

    { id:'levy', name:'Lévy Processes (General Class)', fixes:'The broad mathematical family behind jump models',
      theory:'Variance Gamma, Merton\'s jump-diffusion, and several other models are all specific examples of the broader mathematical family of <strong>Lévy processes</strong> — processes with stationary, independent increments, of which Brownian motion itself is the special "no jumps" case. The Lévy–Khintchine formula characterizes any such process by a drift, a diffusion (Brownian) part, and a jump-measure describing jump frequency and size.',

  /* ========================= INTERACTIVE 1: JUMP-DIFFUSION PATH SIMULATOR ========================= */
  function jumpDiffusionDemo(root){
    const canvas = root.querySelector('#jdCanvas');
    const lambdaSlider = root.querySelector('#jdLambda');
    const jumpSigSlider = root.querySelector('#jdJumpSig');
    const lambdaVal = root.querySelector('#jdLambdaVal');
    const jumpSigVal = root.querySelector('#jdJumpSigVal');
    const regenBtn = root.querySelector('#jdRegen');
    const S0=100, mu=0.05, sigma=0.2, T=1, n=252;

    function simulate(lambda, jumpSig){
      const dt=T/n;
      let S=S0; const path=[S]; const jumpTimes=[];
      for (let i=0;i<n;i++){
        const diffusion = (mu - 0.5*sigma*sigma)*dt + sigma*Math.sqrt(dt)*randNormal();
        const nJumps = randPoisson(lambda*dt);
        let jumpComponent = 0;
        if (nJumps>0){
          for (let j=0;j<nJumps;j++) jumpComponent += (jumpSig*randNormal() - 0.5*jumpSig*jumpSig);
          jumpTimes.push(i);
        }
        S = S*Math.exp(diffusion + jumpComponent);
        path.push(S);
      }
      return { path, jumpTimes };
    }

    function draw(){
      const lambda = parseFloat(lambdaSlider.value), jumpSig = parseFloat(jumpSigSlider.value);
      lambdaVal.textContent = lambda.toFixed(1)+' /yr';
      jumpSigVal.textContent = (jumpSig*100).toFixed(0)+'%';
      const { path, jumpTimes } = simulate(lambda, jumpSig);

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), down=getCss('--accent-down');
      const lo=Math.min(...path)*0.95, hi=Math.max(...path)*1.05;
      function toX(i){ return (i/(path.length-1))*w; }
      function toY(v){ return h - ((v-lo)/(hi-lo))*h*0.9 - h*0.05; }

      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(0,toY(S0)); ctx.lineTo(w,toY(S0)); ctx.stroke(); ctx.setLineDash([]);

      ctx.beginPath();
      path.forEach((v,i) => { const x=toX(i), y=toY(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=accent; ctx.lineWidth=1.8; ctx.stroke();

      jumpTimes.forEach(i => {
        ctx.fillStyle=down;
        ctx.beginPath(); ctx.arc(toX(i), toY(path[i+1]), 4, 0, Math.PI*2); ctx.fill();
      });

      ctx.fillStyle=getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('red dots = jump events · '+jumpTimes.length+' jumps this path', 8, 14);
    }
    lambdaSlider.oninput = draw;
    jumpSigSlider.oninput = draw;
    regenBtn.onclick = draw;
    window.addEventListener('resize', draw);
    draw();
  }

  /* ========================= INTERACTIVE 2: BARRIER KNOCK-OUT VISUALIZER ========================= */
  function barrierDemo(root){
    const canvas = root.querySelector('#barrierCanvas');
    const barrierSlider = root.querySelector('#barrierLevel');
    const barrierVal = root.querySelector('#barrierLevelVal');
    const regenBtn = root.querySelector('#barrierRegen');
    const priceOut = root.querySelector('#barrierPriceOut');
    const S0=100, K=100, r=0.03, sigma=0.3, T=1, n=252;

    function erf(x){
      const sign = x < 0 ? -1 : 1; x = Math.abs(x);
      const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
      const t = 1/(1+p*x);
      const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
      return sign*y;
    }
    function Ncdf(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
    function bsCall(S,K,r,sigma,T){
      const d1=(Math.log(S/K)+(r+0.5*sigma*sigma)*T)/(sigma*Math.sqrt(T));
      const d2=d1-sigma*Math.sqrt(T);
      return S*Ncdf(d1)-K*Math.exp(-r*T)*Ncdf(d2);
    }
    function downAndOutCall(S,K,B,r,sigma,T){
      if (B>=S) return 0;
      const vanilla = bsCall(S,K,r,sigma,T);
      const pow = 2*r/(sigma*sigma) - 1;
      const reflected = bsCall((B*B)/S, K, r, sigma, T);
      return vanilla - Math.pow(B/S, pow) * reflected;
    }

    function simulate(B){
      const dt=T/n;
      let S=S0; const path=[S]; let knocked=false, knockIdx=-1;
      for (let i=0;i<n;i++){
        S = S*Math.exp((r-0.5*sigma*sigma)*dt + sigma*Math.sqrt(dt)*randNormal());
        path.push(S);
        if (!knocked && S<=B){ knocked=true; knockIdx=i+1; }
      }
      return { path, knocked, knockIdx };
    }

    let cached = null;
    function draw(){
      const B = parseFloat(barrierSlider.value);
      barrierVal.textContent = B.toFixed(0);
      if (!cached) cached = simulate(B);
      const { path, knocked, knockIdx } = cached;

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), down=getCss('--accent-down');
      const lo=Math.min(...path,B)*0.95, hi=Math.max(...path)*1.05;
      function toX(i){ return (i/(path.length-1))*w; }
      function toY(v){ return h - ((v-lo)/(hi-lo))*h*0.88 - h*0.06; }

      ctx.strokeStyle=down; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(0,toY(B)); ctx.lineTo(w,toY(B)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=down; ctx.font='10.5px monospace'; ctx.fillText('barrier B = '+B.toFixed(0), 6, toY(B)-6);

      const stopIdx = knocked ? knockIdx : path.length-1;
      ctx.beginPath();
      for (let i=0;i<=stopIdx;i++){ const x=toX(i), y=toY(path[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.stroke();

      if (knocked){
        ctx.strokeStyle=border; ctx.setLineDash([2,3]);
        ctx.beginPath();
        for (let i=stopIdx;i<path.length;i++){ const x=toX(i), y=toY(path[i]); i===stopIdx?ctx.moveTo(x,y):ctx.lineTo(x,y); }
        ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle=down;
        ctx.beginPath(); ctx.arc(toX(knockIdx), toY(path[knockIdx]), 5, 0, Math.PI*2); ctx.fill();
      }

      const price = downAndOutCall(S0,K,B,r,sigma,T);
      const vanilla = bsCall(S0,K,r,sigma,T);
      priceOut.innerHTML = knocked
        ? `<span style="color:var(--accent-down);">Knocked out</span> at step ${knockIdx} — option expired worthless. Down-and-out call price (closed form): $${price.toFixed(3)} vs. vanilla call $${vanilla.toFixed(3)}.`
        : `Path survived — option remains active to expiry. Down-and-out call price (closed form): $${price.toFixed(3)} vs. vanilla call $${vanilla.toFixed(3)}.`;
    }
    barrierSlider.oninput = () => { cached=null; draw(); };
    regenBtn.onclick = () => { cached=null; draw(); };
    window.addEventListener('resize', draw);
    draw();
  }

(function(){

  function erf(x){
    const sign = x < 0 ? -1 : 1; x = Math.abs(x);
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const t = 1/(1+p*x);
    const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
    return sign*y;
  }
  function N(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
  function phi(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function sizeCanvas(canvas){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
    canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(canvas.width/r.width, canvas.height/r.height);
    return { ctx, w:r.width, h:r.height };
  }
  function randNormal(){
    let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }
  /* Student-t random variate: Z / sqrt(chi-sq_df / df), used for the fat-tail demo */
  function randT(df){
    const z = randNormal();
    let chisq = 0;
    for (let i=0;i<df;i++){ const zi = randNormal(); chisq += zi*zi; }
    return z / Math.sqrt(chisq/df);
  }

  function d1d2(S,K,r,sigma,T){
    const d1=(Math.log(S/K)+(r+0.5*sigma*sigma)*T)/(sigma*Math.sqrt(T));
    return [d1, d1-sigma*Math.sqrt(T)];
  }
  function bsCall(S,K,r,sigma,T){
    if (T<=1e-8) return Math.max(S-K,0);
    const [d1,d2]=d1d2(S,K,r,sigma,T);
    return S*N(d1)-K*Math.exp(-r*T)*N(d2);
  }
  function bsPut(S,K,r,sigma,T){
    if (T<=1e-8) return Math.max(K-S,0);
    const [d1,d2]=d1d2(S,K,r,sigma,T);
    return K*Math.exp(-r*T)*N(-d2)-S*N(-d1);
  }
  function bsDelta(S,K,r,sigma,T){
    const [d1] = d1d2(S,K,r,sigma,Math.max(T,1e-6));
    return N(d1);
  }

  /* ---- Ambient hero: a smooth GBM path suddenly cracked by a crash ---- */
  function heroCanvas(canvas){
    const ctx = canvas.getContext('2d');
    let raf, hist=[100], crashed=false, tphase=0;
    function size(){
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
      canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(canvas.width/r.width, canvas.height/r.height);
    }
    size();
    window.addEventListener('resize', size);
    function step(){
      const w=canvas.getBoundingClientRect().width, h=canvas.getBoundingClientRect().height;
      tphase++;
      const dt=1/252;
      let ret = 0.04*dt + 0.18*Math.sqrt(dt)*randNormal();
      if (!crashed && tphase>140 && Math.random()<0.01){ ret = -0.22; crashed=true; }
      let next = hist[hist.length-1]*Math.exp(ret);
      hist.push(next);
      if (hist.length>220){ hist.shift(); if (crashed && tphase>250){ crashed=false; tphase=0; } }
      ctx.clearRect(0,0,w,h);
      const accent=getCss('--accent'), down=getCss('--accent-down');
      const lo=Math.min(...hist)*0.95, hi=Math.max(...hist)*1.05;
      ctx.beginPath();
      hist.forEach((v,i) => {
        const x=(i/219)*w, y=h-((v-lo)/(hi-lo))*h;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.strokeStyle = crashed ? down : accent;
      ctx.globalAlpha=0.55; ctx.lineWidth=1.5; ctx.stroke(); ctx.globalAlpha=1;
      raf = requestAnimationFrame(step);
    }
    step();
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else step(); });
  }

  /* ========================= 11.2 VOLATILITY SMILE MISMATCH ========================= */
  function smileMismatchDemo(root){
    const canvas = root.querySelector('#smileMismatchCanvas');
    const toggleBtn = root.querySelector('#smileMismatchToggle');
    const S=100;
    let showSmile = true;

    function marketIV(K){ const m=Math.log(K/S); return Math.max(0.05, 0.20 - 0.10*m + 0.14*m*m); }

    function draw(){
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), down=getCss('--accent-down'), textDim=getCss('--text-dim');
      const Ks=[]; for (let k=60;k<=145;k+=1) Ks.push(k);
      const ivs = Ks.map(k=>marketIV(k));
      const atm = marketIV(S);
      const vmin=Math.min(...ivs,atm)*0.9, vmax=Math.max(...ivs,atm)*1.1;
      function toX(k){ return ((k-60)/85)*w; }
      function toY(v){ return h - ((v-vmin)/(vmax-vmin))*h*0.85 - h*0.08; }

      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(toX(S),0); ctx.lineTo(toX(S),h); ctx.stroke(); ctx.setLineDash([]);

      // Black–Scholes assumption: one flat line at every strike
      ctx.beginPath(); ctx.moveTo(0, toY(atm)); ctx.lineTo(w, toY(atm));
      ctx.strokeStyle = down; ctx.lineWidth=2; ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]);

      if (showSmile){
        ctx.beginPath();
        Ks.forEach((k,i) => { const x=toX(k), y=toY(ivs[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
        ctx.strokeStyle=accent; ctx.lineWidth=2.4; ctx.stroke();
      }

      ctx.fillStyle=down; ctx.font='11px monospace';
      ctx.fillText('Black–Scholes assumption: σ constant across K', 8, 16);
      if (showSmile){ ctx.fillStyle=accent; ctx.fillText('Market-observed implied vol (smile/skew)', 8, 32); }
      ctx.fillStyle=textDim; ctx.fillText('K', toX(S)-4, h-4);
    }
    toggleBtn.onclick = () => { showSmile = !showSmile; toggleBtn.textContent = showSmile ? '👁 Hide market smile' : '👁 Show market smile'; draw(); };
    window.addEventListener('resize', draw);
    draw();
  }

  /* ========================= 11.3 DISCRETE HEDGING & TRANSACTION COSTS ========================= */
  function hedgingCostDemo(root){
    const canvas = root.querySelector('#hedgeCanvas');
    const nSlider = root.querySelector('#hedgeN');
    const costSlider = root.querySelector('#hedgeCost');
    const nVal = root.querySelector('#hedgeNVal');
    const costVal = root.querySelector('#hedgeCostVal');
    const runBtn = root.querySelector('#hedgeRun');
    const statsOut = root.querySelector('#hedgeStats');
    const S0=100, K=100, r=0.03, sigma=0.25, T=1, M=250;

    function simulateOnePath(nRebal, costBps){
      const dt = T/nRebal;
      let S = S0;
      let optionShortPayoffPV; // computed at end
      let shares = bsDelta(S0,K,r,sigma,T);
      let cash = bsCall(S0,K,r,sigma,T) - shares*S0; // sell the option, buy initial hedge
      let totalCost = Math.abs(shares)*S0*costBps/10000;
      for (let i=1;i<=nRebal;i++){
        const tRemain = T - i*dt;
        S = S*Math.exp((r-0.5*sigma*sigma)*dt + sigma*Math.sqrt(dt)*randNormal());
        cash *= Math.exp(r*dt);
        const newDelta = tRemain>1e-6 ? bsDelta(S,K,r,sigma,tRemain) : (S>K?1:0);
        const tradeAmt = Math.abs(newDelta-shares)*S;
        totalCost += tradeAmt*costBps/10000;
        cash -= (newDelta-shares)*S;
        shares = newDelta;
      }
      const portfolioValue = shares*S + cash - totalCost;
      const payoff = Math.max(S-K,0);
      return portfolioValue - payoff; // hedging P&L error (0 in a frictionless, continuous world)
    }

    function draw(){
      const nRebal = parseInt(nSlider.value,10);
      const costBps = parseFloat(costSlider.value);
      nVal.textContent = nRebal;
      costVal.textContent = costBps.toFixed(0)+' bps';

      const errors = [];
      for (let i=0;i<M;i++) errors.push(simulateOnePath(nRebal, costBps));
      const mean = errors.reduce((a,b)=>a+b,0)/M;
      const sd = Math.sqrt(errors.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(M-1));

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), down=getCss('--accent-down');

      const nBins=28;
      const lo=Math.min(...errors), hi=Math.max(...errors);
      const range = Math.max(hi-lo, 0.01);
      const bins = new Array(nBins).fill(0);
      errors.forEach(e => { let idx=Math.floor(((e-lo)/range)*nBins); idx=Math.max(0,Math.min(nBins-1,idx)); bins[idx]++; });
      const maxCount = Math.max(...bins);
      const bw = w/nBins;

      bins.forEach((c,i) => {
        const barH = (c/maxCount)*h*0.85;
        ctx.fillStyle = (lo+(i+0.5)/nBins*range) < 0 ? down : accent;
        ctx.globalAlpha=0.75;
        ctx.fillRect(i*bw+1, h-barH, bw-2, barH);
      });
      ctx.globalAlpha=1;

      // zero line
      const zeroX = ((0-lo)/range)*w;
      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(zeroX,0); ctx.lineTo(zeroX,h); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('0 (frictionless BS ideal)', zeroX+4, 14);

      statsOut.innerHTML = `Mean hedging P&L: <strong class="mono" style="color:${mean<0?down:accent}">$${mean.toFixed(3)}</strong> &nbsp;·&nbsp; Std dev: <strong class="mono">$${sd.toFixed(3)}</strong> across ${M} simulated paths.
        <br>Fewer rebalances → larger tracking-error variance (right side of the tradeoff). More rebalances → tracking error shrinks toward zero, but cumulative transaction costs pull the mean further negative — the two forces Black–Scholes' "continuous trading, no transaction costs" assumption simply assumes away.`;
    }
    nSlider.oninput = draw;
    costSlider.oninput = draw;
    runBtn.onclick = draw;
    window.addEventListener('resize', draw);
    draw();
  }

  /* ========================= 11.4 FAT TAILS VS. LOGNORMAL ========================= */
  function fatTailsDemo(root){
    const canvas = root.querySelector('#fatTailCanvas');
    const dfSlider = root.querySelector('#fatTailDf');
    const dfVal = root.querySelector('#fatTailDfVal');
    const statsOut = root.querySelector('#fatTailStats');
    const regenBtn = root.querySelector('#fatTailRegen');
    const N_SAMPLES = 6000;

    function kurtosis(samples){
      const mean = samples.reduce((a,b)=>a+b,0)/samples.length;
      const m2 = samples.reduce((a,b)=>a+(b-mean)**2,0)/samples.length;
      const m4 = samples.reduce((a,b)=>a+(b-mean)**4,0)/samples.length;
      return m4/(m2*m2) - 3; // excess kurtosis; 0 for a true normal
    }

    let normalSamples=null, tSamples=null;
    function regenerate(df){
      normalSamples = Array.from({length:N_SAMPLES}, () => randNormal());
      const raw = Array.from({length:N_SAMPLES}, () => randT(df));
      // rescale t-samples to unit variance so both curves are compared on equal footing
      const rawSd = Math.sqrt(raw.reduce((a,b)=>a+b*b,0)/raw.length);
      tSamples = raw.map(x => x/rawSd);
    }

    function draw(){
      const df = parseInt(dfSlider.value,10);
      dfVal.textContent = df;
      if (!normalSamples) regenerate(df);

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), down=getCss('--accent-down');

      const lo=-5, hi=5, nBins=50;
      function histOf(samples){
        const bins = new Array(nBins).fill(0);
        samples.forEach(x => { let idx=Math.floor(((x-lo)/(hi-lo))*nBins); if (idx>=0&&idx<nBins) bins[idx]++; });
        return bins.map(c => c/samples.length/((hi-lo)/nBins));
      }
      const normHist = histOf(normalSamples), tHist = histOf(tSamples);
      const dmax = Math.max(...normHist,...tHist)*1.05;
      function toX(i){ return (i/nBins)*w; }
      function toY(d){ return h - (d/dmax)*h*0.92; }

      ctx.globalAlpha=0.55;
      for (let i=0;i<nBins;i++){
        ctx.fillStyle=accent;
        ctx.fillRect(toX(i), toY(normHist[i]), w/nBins-1, h-toY(normHist[i]));
      }
      ctx.globalAlpha=1;
      ctx.beginPath();
      for (let i=0;i<nBins;i++){ const x=toX(i)+w/nBins/2, y=toY(tHist[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.strokeStyle=down; ctx.lineWidth=2.4; ctx.stroke();

      ctx.fillStyle=accent; ctx.font='10.5px monospace';
      ctx.fillText('Lognormal-implied (normal log-returns)', 8, 16);
      ctx.fillStyle=down; ctx.fillText('Fat-tailed alternative (Student-t, df='+df+')', 8, 32);

      const kurt = kurtosis(tSamples);

  /* ========================= 11.5 MARKET CRASH & REALIZED VOL SPIKE ========================= */
  function crashDemo(root){
    const canvas = root.querySelector('#crashCanvas');
    const magSlider = root.querySelector('#crashMag');
    const magVal = root.querySelector('#crashMagVal');
    const regenBtn = root.querySelector('#crashRegen');
    const S0=100, mu=0.06, sigma=0.16, T=1, n=252;

    function simulate(crashMag){
      const dt=T/n;
      let S=S0; const path=[S];
      const crashDay = 100 + Math.floor(Math.random()*60);
      for (let i=0;i<n;i++){
        let ret = (mu-0.5*sigma*sigma)*dt + sigma*Math.sqrt(dt)*randNormal();
        if (i===crashDay) ret += Math.log(1-crashMag);
        S = S*Math.exp(ret);
        path.push(S);
      }
      return { path, crashDay };
    }
    function rollingVol(path, win){
      const rets = []; for (let i=1;i<path.length;i++) rets.push(Math.log(path[i]/path[i-1]));
      const out = [];
      for (let i=0;i<rets.length;i++){
        const start = Math.max(0,i-win+1);
        const slice = rets.slice(start,i+1);
        const m = slice.reduce((a,b)=>a+b,0)/slice.length;
        const v = slice.reduce((a,b)=>a+(b-m)*(b-m),0)/Math.max(1,slice.length-1);
        out.push(Math.sqrt(v*252));
      }
      return out;
    }

    let cached=null;
    function draw(){
      const mag = parseFloat(magSlider.value);
      magVal.textContent = (mag*100).toFixed(0)+'%';
      if (!cached) cached = simulate(mag);
      const { path } = cached;
      const vols = rollingVol(path, 20);

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), down=getCss('--accent-down');
      const h1=h*0.55, h2=h*0.45;

      const pmin=Math.min(...path), pmax=Math.max(...path);
      ctx.beginPath();
      path.forEach((p,i) => { const x=(i/(path.length-1))*w, y=h1-((p-pmin)/(pmax-pmin))*h1*0.88-h1*0.06; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=accent; ctx.lineWidth=1.6; ctx.stroke();

      ctx.strokeStyle=border; ctx.beginPath(); ctx.moveTo(0,h1); ctx.lineTo(w,h1); ctx.stroke();

      // assumed constant vol reference line
      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      const constY = h1+h2-(sigma/Math.max(...vols,sigma*1.2))*h2*0.85-h2*0.05;
      ctx.beginPath(); ctx.moveTo(0,constY); ctx.lineTo(w,constY); ctx.stroke(); ctx.setLineDash([]);

      const vmax = Math.max(...vols,sigma)*1.15;
      ctx.beginPath();
      vols.forEach((v,i) => { const x=(i/(vols.length-1))*w, y=h1+h2-(v/vmax)*h2*0.85-h2*0.05; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=down; ctx.lineWidth=2; ctx.stroke();

      ctx.fillStyle=getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('simulated price path (single-day crash inserted)', 6, 12);
      ctx.fillText('20-day realized annualized volatility — dashed = assumed constant σ='+(sigma*100).toFixed(0)+'%', 6, h1+14);
    }
    magSlider.oninput = () => { cached=null; draw(); };
    regenBtn.onclick = () => { cached=null; draw(); };
    window.addEventListener('resize', draw);
    draw();
  }

  /* ========================= 11.6 VOLATILITY CLUSTERING ========================= */
  function clusteringDemo(root){
    const canvas = root.querySelector('#clusterCanvas');
    const persistSlider = root.querySelector('#clusterPersist');
    const persistVal = root.querySelector('#clusterPersistVal');
    const regenBtn = root.querySelector('#clusterRegen');

    // Simple GARCH(1,1)-style variance recursion: v_t = omega + alpha*eps^2 + beta*v_{t-1}
    function simulate(beta){
      const n=500, omega=0.00001, alpha=0.08;
      let v = omega/(1-alpha-beta);
      const vols=[Math.sqrt(v*252)];
      for (let i=0;i<n;i++){
        const eps = Math.sqrt(v)*randNormal();
        v = omega + alpha*eps*eps + beta*v;
        vols.push(Math.sqrt(v*252));
      }
      return vols;
    }

    let cached=null;
    function draw(){
      const beta = parseFloat(persistSlider.value);
      persistVal.textContent = beta.toFixed(2);
      if (!cached) cached = simulate(beta);
      const vols = cached;

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent');
      const constLevel = vols.reduce((a,b)=>a+b,0)/vols.length;
      const vmax = Math.max(...vols)*1.1;
      function toY(v){ return h-(v/vmax)*h*0.88-h*0.06; }

      ctx.strokeStyle=border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(0,toY(constLevel)); ctx.lineTo(w,toY(constLevel)); ctx.stroke(); ctx.setLineDash([]);

      ctx.beginPath();
      vols.forEach((v,i) => { const x=(i/(vols.length-1))*w, y=toY(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=accent; ctx.lineWidth=1.8; ctx.stroke();

      ctx.fillStyle=getCss('--text-dim'); ctx.font='10.5px monospace';
      ctx.fillText('dashed = flat σ Black–Scholes assumes · solid = clustered, self-reinforcing volatility', 6, 14);
    }
    persistSlider.oninput = () => { cached=null; draw(); };
    regenBtn.onclick = () => { cached=null; draw(); };
    window.addEventListener('resize', draw);
    draw();
  }

  /* ========================= 11.7 LIQUIDITY & MARKET IMPACT ========================= */
  function liquidityDemo(root){
    const canvas = root.querySelector('#liqCanvas');
    const sizeSlider = root.querySelector('#liqSize');
    const stressToggle = root.querySelector('#liqStressToggle');
    const sizeVal = root.querySelector('#liqSizeVal');
    const out = root.querySelector('#liqOut');
    let stressed = false;

    // Schematic square-root market-impact model: impact = k * sqrt(orderSize/ADV) * spread-scaling
    function impact(orderSize, stress){
      const ADV = 2_000_000; // shares/day, illustrative
      const baseSpreadBps = stress ? 18 : 4;
      const k = stress ? 55 : 25;
      const impactBps = k*Math.sqrt(orderSize/ADV);
      return { baseSpreadBps, impactBps, totalBps: baseSpreadBps/2 + impactBps };
    }

    function draw(){
      const size = parseInt(sizeSlider.value,10);
      sizeVal.textContent = size.toLocaleString()+' shares';

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), down=getCss('--accent-down');

      const sizes = []; for (let s=1000;s<=1_000_000;s+=5000) sizes.push(s);
      const calmCosts = sizes.map(s=>impact(s,false).totalBps);
      const stressCosts = sizes.map(s=>impact(s,true).totalBps);
      const cmax = Math.max(...calmCosts,...stressCosts)*1.1;
      function toX(s){ return (s/1_000_000)*w; }
      function toY(c){ return h-(c/cmax)*h*0.88-h*0.06; }

      function plot(costs,color){
        ctx.beginPath();
        sizes.forEach((s,i) => { const x=toX(s), y=toY(costs[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
        ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
      }
      plot(calmCosts, accent);
      plot(stressCosts, down);

      const marker = toX(size);
      ctx.strokeStyle=border; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(marker,0); ctx.lineTo(marker,h); ctx.stroke(); ctx.setLineDash([]);

      ctx.fillStyle=accent; ctx.font='10.5px monospace';
      ctx.fillText('Normal market depth', 8, 16);
      ctx.fillStyle=down; ctx.fillText('Stressed / thin market', 8, 32);

      const result = impact(size, stressed);
      out.innerHTML = `At ${size.toLocaleString()} shares in a <strong>${stressed?'stressed':'normal'}</strong> market: effective round-trip cost ≈ <strong class="mono" style="color:${stressed?'var(--accent-down)':'var(--accent)'}">${result.totalBps.toFixed(1)} bps</strong>. Black–Scholes assumes this is always exactly zero, regardless of order size or market conditions.`;
    }
    sizeSlider.oninput = draw;
    stressToggle.onclick = () => { stressed = !stressed; stressToggle.classList.toggle('active', stressed); draw(); };
    window.addEventListener('resize', draw);
    draw();
  }

  function modelRiskDemo(root){
    const canvas = root.querySelector('#modelRiskCanvas');
    const moneynessSlider = root.querySelector('#mrMoneyness');
    const jumpProbSlider = root.querySelector('#mrJumpProb');
    const moneynessVal = root.querySelector('#mrMoneynessVal');
    const jumpProbVal = root.querySelector('#mrJumpProbVal');
    const tableBody = root.querySelector('#mrTableBody');
    const S0=100, r=0.03, sigmaBase=0.2, T=0.25;

    // Three schematic "house views" for a deep OTM put: plain BS, BS with crash-adjusted vol, and a simple jump-risk loading
    function computePrices(K, jumpProb){
      const bs = bsPut(S0,K,r,sigmaBase,T);
      const crashVolSigma = sigmaBase*1.6; // market smile prices OTM puts with higher implied vol
      const bsSmileAdj = bsPut(S0,K,r,crashVolSigma,T);
      const jumpSize = 0.25; // schematic 25% crash if the jump fires
      const jumpDownS = S0*(1-jumpSize);
      const noJumpPrice = bsPut(S0,K,r,sigmaBase,T);
      const jumpPrice = bsPut(jumpDownS,K,r,sigmaBase,T);
      const jumpLoaded = (1-jumpProb)*noJumpPrice + jumpProb*jumpPrice;
      return { bs, bsSmileAdj, jumpLoaded };
    }

    function draw(){
      const m = parseFloat(moneynessSlider.value);
      const jp = parseFloat(jumpProbSlider.value);
      const K = S0*m;
      moneynessVal.textContent = (m*100).toFixed(0)+'% of spot (K='+K.toFixed(0)+')';
      jumpProbVal.textContent = (jp*100).toFixed(1)+'%';

      const { bs, bsSmileAdj, jumpLoaded } = computePrices(K, jp);
      const rows = [
        ['Plain Black–Scholes (σ=20%)', bs],
        ['Smile-adjusted vol (σ=32%)', bsSmileAdj],
        ['Jump-risk-loaded', jumpLoaded]
      ];

      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const accent=getCss('--accent'), accent2=getCss('--accent-2'), down=getCss('--accent-down');
      const colors=[accent,accent2,down];
      const vmax = Math.max(...rows.map(r=>r[1]))*1.25 || 1;
      const bw = w/rows.length;
      rows.forEach(([name,val],i) => {
        const barH = (val/vmax)*h*0.8;
        ctx.fillStyle = colors[i]; ctx.globalAlpha=0.85;
        ctx.fillRect(i*bw+bw*0.15, h-barH, bw*0.7, barH);
        ctx.globalAlpha=1;
        ctx.fillStyle=getCss('--text'); ctx.font='11px monospace'; ctx.textAlign='center';
        ctx.fillText('$'+val.toFixed(3), i*bw+bw*0.5, h-barH-6);
      });
      ctx.textAlign='left';

      tableBody.innerHTML = rows.map(([name,val],i) => {
        const spread = ((val-bs)/bs*100);
        return `<tr style="border-top:1px solid var(--border-soft);">
          <td style="padding:8px 10px;">${name}</td>
          <td style="padding:8px 10px;" class="mono">$${val.toFixed(4)}</td>
          <td style="padding:8px 10px;" class="mono">${i===0?'—':(spread>=0?'+':'')+spread.toFixed(1)+'%'}</td>
        </tr>`;
      }).join('');
    }
    moneynessSlider.oninput = draw;
    jumpProbSlider.oninput = draw;
    window.addEventListener('resize', draw);
    draw();
  }
