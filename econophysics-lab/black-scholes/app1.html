  HOW TO ADD/EDIT A MODULE (keeps every tab independent):

<style>
/* ==========================================================================
   DESIGN TOKENS
   ========================================================================== */
:root{
  --bg:            #0B0E14;
  --bg-panel:      #10141E;
  --bg-card:       #171D2C;
  --bg-card-hover: #1D2436;
  --border:        #262E43;

  --text:          #E7EAF0;
  --text-muted:    #8992A9;
  --text-dim:      #5C6479;
  --accent:        #22E6C4;     /* teal — signal / growth */
  --accent-dim:    rgba(34,230,196,0.12);
  --accent-2:      #E8A33D;     /* amber — capital / gold */
  --accent-2-dim:  rgba(232,163,61,0.14);
  --accent-down:   #E85D6B;     /* rose — decay / downside */
  --shadow:        0 8px 28px rgba(0,0,0,0.35);
  --radius:        14px;
  --radius-sm:     8px;
  --font-display:  'Space Grotesk', system-ui, sans-serif;
  --font-body:     'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:     'JetBrains Mono', ui-monospace, monospace;
}
html[data-theme="light"]{
  --bg:            #F5F6F9;
  --bg-panel:      #FFFFFF;
  --bg-card:       #FFFFFF;
  --bg-card-hover: #F0F2F7;
  --border:        #E1E4EC;
  --border-soft:   #EBEDF3;
  --text:          #171B26;
  --text-muted:    #5B6478;
  --text-dim:      #8891A4;
  --accent:        #0E9C86;
  --accent-dim:    rgba(14,156,134,0.10);
  --accent-2:      #B8710E;
  --accent-2-dim:  rgba(184,113,14,0.12);
  --accent-down:   #C0394A;
  --shadow:        0 8px 24px rgba(20,25,40,0.08);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;

}
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0 0 .5em 0; letter-spacing:-0.01em; }
p{ margin:0 0 1em 0; color:var(--text-muted); }
a{ color:var(--accent); }
code, .mono{ font-family:var(--font-mono); }
::selection{ background:var(--accent-dim); color:var(--text); }

/* subtle focus visibility for a11y */
button:focus-visible, input:focus-visible, .nav-item:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* ==========================================================================
   APP SHELL — horizontal tab bar (wraps to additional lines as needed)
   ========================================================================== */
#app{ display:flex; flex-direction:column; min-height:100vh; }

.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:32px; height:32px; flex:none; border-radius:9px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2));

.icon-btn{

/* ---- Horizontal nav bar: tabs run left to right, wrapping to new lines ---- */

<div id="app">

  <header id="topbar">
    <div class="brand">
      <div class="brand-mark">BS</div>
      <div class="brand-text">
        <div class="t1">Black–Scholes</div>
        <div class="t2">DERIVATIVES LAB</div>
      </div>
    </div>
    <div id="topbarTitle">Introduction<span class="sub">Options, derivatives & the world Black–Scholes was built for</span></div>
    <button class="icon-btn" id="themeToggle" onclick="BS.toggleTheme()" aria-label="Toggle dark/light mode">
      <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
    </button>
  </header>

  <nav id="navBar"></nav>

  <main>
    <div id="tabContent"></div>
  </main>

</div>

<script>
/* ============================================================================
   CORE APP CONTROLLER — "BS" namespace
   Everything a module needs (theme, DOM helpers, PNG export, MathJax re-typeset)
   lives here so individual tab modules stay tiny and self-contained.
   ============================================================================ */
const BS = (function(){

  const TAB_ORDER = [
    'intro','theory','properties','analytic','greeks','numerical',
    'calculator','volatility','applications','extensions','limitations','library'
  ];
  const MODULES = {};      // id -> {title, subtitle, render(container), rendered:bool}
  let activeTab = null;

  function registerModule(id, opts){
    MODULES[id] = Object.assign({ rendered:false }, opts);
  }

  /* ---------- THEME ---------- */
  function applyThemeIcon(theme){
    const sun = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>';
    const moon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    document.getElementById('themeIcon').innerHTML = theme === 'dark' ? sun : moon;
  }
  function setTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    applyThemeIcon(theme);
    try{ window.__bsTheme = theme; }catch(e){}
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    setTheme(cur === 'dark' ? 'light' : 'dark');
  }

  /* ---------- NAV BUILD (horizontal bar, left to right, wraps to new lines) ---------- */
  function buildNav(){
    const bar = document.getElementById('navBar');
    bar.innerHTML = '';
    TAB_ORDER.forEach((id, i) => {
      const m = MODULES[id];
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.id = 'navbtn-' + id;
      btn.onclick = () => showTab(id);
      btn.innerHTML =
        '<span class="nav-num">' + String(i+1).padStart(2,'0') + '</span>' +
        '<span>' + m.title + '</span>' +
        '<span class="nav-badge ' + (m.built ? 'built' : '') + '">' + (m.built ? 'built' : 'soon') + '</span>';
      bar.appendChild(btn);
    });
  }

  /* ---------- TAB SWITCHING ---------- */
  function showTab(id){
    if (!MODULES[id]) return;
    activeTab = id;
    TAB_ORDER.forEach(t => {
      document.getElementById('navbtn-' + t).classList.toggle('active', t === id);
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

    let panel = document.getElementById('panel-' + id);
    if (!panel){
      panel = document.createElement('div');
      panel.className = 'tab-panel';
      panel.id = 'panel-' + id;
      document.getElementById('tabContent').appendChild(panel);
    }
    panel.classList.add('active');

    const m = MODULES[id];
    document.getElementById('topbarTitle').innerHTML =
      m.title + '<span class="sub">' + (m.subtitle||'') + '</span>';

    if (!m.rendered){
      m.render(panel);
      m.rendered = true;
    }
    typeset();
  }

  /* ---------- MATHJAX ---------- */
  function typeset(){
    if (window.MathJax && window.MathJax.typesetPromise){
      window.MathJax.typesetPromise().catch(()=>{});
    }
  }

  /* ---------- EXPANDABLE CARDS ---------- */
  function collapsible(headEl){
    const body = headEl.nextElementSibling;
    const expanded = headEl.getAttribute('aria-expanded') === 'true';
    headEl.setAttribute('aria-expanded', expanded ? 'false' : 'true');
    if (expanded){
      body.style.maxHeight = null;
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
    }
  }

  /* ---------- PNG DOWNLOAD (reusable by any future canvas-based module) ---------- */
  function downloadCanvasPNG(canvas, filename){
    try{
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = (filename || 'figure') + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }catch(e){
      console.warn('PNG export failed', e);
    }
  }

  /* ---------- QUIZ HELPER (reusable) ---------- */
  function quizAnswer(btn, isCorrect, feedbackId){
    const group = btn.parentElement;
    group.querySelectorAll('.quiz-opt').forEach(o => o.classList.remove('correct','wrong'));
    btn.classList.add(isCorrect ? 'correct' : 'wrong');
    const fb = document.getElementById(feedbackId);
    if (fb) fb.style.display = 'block';
  }

  return {
    registerModule, buildNav, showTab, typeset, collapsible,
    downloadCanvasPNG, quizAnswer, toggleTheme, setTheme,
    get activeTab(){ return activeTab; }
  };
})();

/* ============================================================================
   MODULE: INTRODUCTION  (Tab 01 — BUILT)
   ============================================================================ */
(function(){

  function heroCanvas(canvas){
    const ctx = canvas.getContext('2d');
    let raf;
    function size(){

(function(){

  function randNormal(){
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
  }

  /* ---- Ambient hero: a single live Wiener process W_t ---- */
  function heroCanvas(canvas){
    const ctx = canvas.getContext('2d');
    let raf, hist = [0];
    function size(){
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
      canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(canvas.width/r.width, canvas.height/r.height);
    }
    size();
    window.addEventListener('resize', size);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent-2').trim();
    function step(){
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      const dt = 1/60;
      hist.push(hist[hist.length-1] + randNormal()*Math.sqrt(dt));
      if (hist.length > 300) hist.shift();
      ctx.clearRect(0,0,w,h);
      const lo = Math.min(...hist), hi = Math.max(...hist);
      const range = Math.max(hi-lo, 0.5);
      ctx.beginPath();
      hist.forEach((v,i) => {
        const x = (i/299) * w;
        const y = h/2 - ((v-(lo+hi)/2)/range) * h * 0.8;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      });
      ctx.strokeStyle = accent; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.4;
      ctx.stroke(); ctx.globalAlpha = 1;
      raf = requestAnimationFrame(step);
    }
    step();
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else step(); });
  }

  /* ---- Interactive GBM sample-path demo (μ, σ sliders) ---- */
  function gbmDemo(root){
    const canvas = root.querySelector('#theoryGbmCanvas');
    const muSlider = root.querySelector('#gbmMu');
    const sigSlider = root.querySelector('#gbmSig');
    const muVal = root.querySelector('#gbmMuVal');
    const sigVal = root.querySelector('#gbmSigVal');
    const ctx = canvas.getContext('2d');

    function size(){
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
      canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(canvas.width/r.width, canvas.height/r.height);
    }
    size();
    window.addEventListener('resize', () => { size(); draw(); });

    function simulate(mu, sigma){
      const N = 150, T = 1, dt = T/N, S0 = 100;
      const paths = [];
      for (let p = 0; p < 6; p++){
        const path = [S0];
        for (let i = 0; i < N; i++){
          const Z = randNormal();
          const prev = path[path.length-1];
          path.push(prev * Math.exp((mu - 0.5*sigma*sigma)*dt + sigma*Math.sqrt(dt)*Z));
        }
        paths.push(path);
      }
      return paths;
    }

    let currentPaths = simulate(parseFloat(muSlider.value), parseFloat(sigSlider.value));

    function draw(){
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      ctx.clearRect(0,0,w,h);
      const all = currentPaths.flat();
      const lo = Math.min(...all) * 0.97, hi = Math.max(...all) * 1.03;
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      const accent2 = getComputedStyle(document.documentElement).getPropertyValue('--accent-2').trim();
      const border = getComputedStyle(document.documentElement).getPropertyValue('--border-soft').trim();

      // gridlines
      ctx.strokeStyle = border; ctx.lineWidth = 1;
      for (let g = 0; g <= 4; g++){
        const y = (g/4) * h;
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
      }
      // S0 reference line
      const s0y = h - ((100-lo)/(hi-lo)) * h;
      ctx.strokeStyle = border; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(0,s0y); ctx.lineTo(w,s0y); ctx.stroke();
      ctx.setLineDash([]);

      currentPaths.forEach((path, pi) => {
        ctx.beginPath();
        path.forEach((v,i) => {
          const x = (i/(path.length-1)) * w;
          const y = h - ((v-lo)/(hi-lo)) * h;
          i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        });
        ctx.strokeStyle = pi === 0 ? accent2 : accent;
        ctx.globalAlpha = pi === 0 ? 0.95 : 0.35;
        ctx.lineWidth = pi === 0 ? 2 : 1.3;
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }

    function update(){
      muVal.textContent = parseFloat(muSlider.value).toFixed(2);
      sigVal.textContent = parseFloat(sigSlider.value).toFixed(2);
    }
    muSlider.oninput = () => { update(); currentPaths = simulate(parseFloat(muSlider.value), parseFloat(sigSlider.value)); draw(); };
    sigSlider.oninput = () => { update(); currentPaths = simulate(parseFloat(muSlider.value), parseFloat(sigSlider.value)); draw(); };
    root.querySelector('#gbmRegen').onclick = () => { currentPaths = simulate(parseFloat(muSlider.value), parseFloat(sigSlider.value)); draw(); };
    root.querySelector('#gbmDownload').onclick = () => BS.downloadCanvasPNG(canvas, 'gbm-sample-paths');

    update();
    draw();
  }

/* ============================================================================
   MODULE: MATHEMATICAL PROPERTIES  (Tab 03 — BUILT)
   Classifies the Black–Scholes PDE, walks through its linearity, domain,
   boundary/terminal/initial conditions, stability/uniqueness/existence, and
   the dimensionless transformation to the heat equation. Two interactive
   canvas demos: (1) linear combination of option payoffs, (2) diffusion
   smoothing a non-smooth terminal payoff as time-to-expiry increases.
   ============================================================================ */
(function(){

  function erf(x){
    const sign = x < 0 ? -1 : 1; x = Math.abs(x);
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const t = 1/(1+p*x);
    const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
    return sign*y;
  }
  function normCDF(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
  function callPrice(S,K,r,sigma,tau){
    if (tau <= 1e-6) return Math.max(S-K, 0);
    const d1 = (Math.log(S/K) + (r + 0.5*sigma*sigma)*tau) / (sigma*Math.sqrt(tau));
    const d2 = d1 - sigma*Math.sqrt(tau);
    return S*normCDF(d1) - K*Math.exp(-r*tau)*normCDF(d2);
  }

  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  /* ---- Ambient hero: a heat-kernel bump diffusing outward ---- */
  function heroCanvas(canvas){
    const ctx = canvas.getContext('2d');
    let raf, tphase = 0.02;
    function size(){
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
      canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(canvas.width/r.width, canvas.height/r.height);
    }
    size();
    window.addEventListener('resize', size);
    function step(){
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      tphase += 0.003;
      if (tphase > 1.2) tphase = 0.02;
      ctx.clearRect(0,0,w,h);
      const accent = getCss('--accent'), accent2 = getCss('--accent-2');
      [0.02, 0.35].forEach((offset, i) => {
        const tau = Math.max(tphase - offset, 0.01);
        ctx.beginPath();
        for (let px = 0; px <= w; px += 4){
          const x = (px/w - 0.5) * 6; // -3..3
          const u = Math.exp(-(x*x)/(4*tau)) / Math.sqrt(4*Math.PI*tau);
          const y = h - Math.min(u,1.2) * (h*0.8);
          px === 0 ? ctx.moveTo(px,y) : ctx.lineTo(px,y);
        }
        ctx.strokeStyle = i===0 ? accent2 : accent;
        ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5;
        ctx.stroke(); ctx.globalAlpha = 1;
      });
      raf = requestAnimationFrame(step);
    }
    step();
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else step(); });
  }

  /* ---- Interactive 1: linearity via portfolio superposition ---- */
  function linearityDemo(root){
    const canvas = root.querySelector('#linCanvas');
    const aSlider = root.querySelector('#linA');
    const bSlider = root.querySelector('#linB');
    const aVal = root.querySelector('#linAVal');
    const bVal = root.querySelector('#linBVal');
    const ctx = canvas.getContext('2d');
    const K = 100;

    function size(){
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
      canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(canvas.width/r.width, canvas.height/r.height);
    }
    size();
    window.addEventListener('resize', () => { size(); draw(); });

    function draw(){
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      const a = parseFloat(aSlider.value), b = parseFloat(bSlider.value);
      ctx.clearRect(0,0,w,h);

      const Smin=50, Smax=150;
      const border = getCss('--border-soft'), textDim = getCss('--text-dim');
      const accent = getCss('--accent'), accent2 = getCss('--accent-2'), down = getCss('--accent-down');

      // zero line
      const yMaxVal = 60;
      function toY(v){ return h - ((v + yMaxVal*0.15) / (yMaxVal*1.3)) * h; }
      function toX(S){ return ((S-Smin)/(Smax-Smin)) * w; }

      ctx.strokeStyle = border; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, toY(0)); ctx.lineTo(w, toY(0)); ctx.stroke();

      function plot(fn, color, alpha, width){
        ctx.beginPath();
        for (let S=Smin; S<=Smax; S+=1){
          const x = toX(S), y = toY(fn(S));
          S===Smin ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        }
        ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = width; ctx.stroke(); ctx.globalAlpha = 1;
      }

      const callPay = S => Math.max(S-K,0);
      const putPay  = S => Math.max(K-S,0);
      const combo   = S => a*callPay(S) + b*putPay(S);

      plot(callPay, accent, 0.3, 1.3);
      plot(putPay, down, 0.3, 1.3);
      plot(combo, accent2, 0.95, 2.2);

      ctx.fillStyle = textDim; ctx.font = '11px monospace';
      ctx.fillText('K = ' + K, toX(K)+4, toY(0)-6);
    }

    function update(){
      aVal.textContent = parseFloat(aSlider.value).toFixed(1);
      bVal.textContent = parseFloat(bSlider.value).toFixed(1);
      draw();
    }
    aSlider.oninput = update;
    bSlider.oninput = update;
    root.querySelector('#linDownload').onclick = () => BS.downloadCanvasPNG(canvas, 'linearity-superposition');
    update();
  }

  /* ---- Interactive 2: diffusion smoothing a kinked terminal payoff ---- */
  function smoothingDemo(root){
    const canvas = root.querySelector('#smoothCanvas');
    const tauSlider = root.querySelector('#smoothTau');
    const tauVal = root.querySelector('#smoothTauVal');
    const ctx = canvas.getContext('2d');
    const K = 100, r = 0.03, sigma = 0.3;

    function size(){
      const rct = canvas.getBoundingClientRect();
      canvas.width = rct.width * Math.min(devicePixelRatio||1, 1.5);
      canvas.height = rct.height * Math.min(devicePixelRatio||1, 1.5);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(canvas.width/rct.width, canvas.height/rct.height);
    }
    size();
    window.addEventListener('resize', () => { size(); draw(); });

    function draw(){
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      const tau = parseFloat(tauSlider.value);
      ctx.clearRect(0,0,w,h);

      const Smin=50, Smax=150, Vmax=55;
      const border = getCss('--border-soft');
      const accent = getCss('--accent'), accent2 = getCss('--accent-2');
      function toX(S){ return ((S-Smin)/(Smax-Smin)) * w; }
      function toY(v){ return h - (v/Vmax) * h * 0.92; }

      // gridline at V=0
      ctx.strokeStyle = border; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, toY(0)); ctx.lineTo(w, toY(0)); ctx.stroke();

      // dashed terminal kink (tau = 0)
      ctx.beginPath();
      for (let S=Smin; S<=Smax; S+=1){
        const x = toX(S), y = toY(Math.max(S-K,0));
        S===Smin ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.setLineDash([5,4]); ctx.strokeStyle = accent2; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.4;
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;

      // solid current smoothed curve
      ctx.beginPath();
      for (let S=Smin; S<=Smax; S+=1){
        const x = toX(S), y = toY(callPrice(S,K,r,sigma,tau));
        S===Smin ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle = accent; ctx.lineWidth = 2.2; ctx.stroke();
    }

    function update(){
      tauVal.textContent = parseFloat(tauSlider.value).toFixed(3) + ' yr';
      draw();
    }
    tauSlider.oninput = update;
    root.querySelector('#smoothDownload').onclick = () => BS.downloadCanvasPNG(canvas, 'diffusion-smoothing');
    update();
  }

  const CLASSIFY_CARDS = [

/* ============================================================================
   MODULE: ANALYTICAL SOLUTION  (Tab 04 — BUILT)
   Solves the heat equation reached in Tab 03 via the fundamental solution
   (heat kernel convolution), substitutes back through every change of
   variables to reach the closed-form Black–Scholes formula, defines d1/d2,
   derives the put via parity, and explains every parameter. Includes a live
   interactive calculator with a shaded-normal-curve visualization and a
   step-by-step "reveal the derivation" explorer.
   ============================================================================ */
(function(){

  function erf(x){
    const sign = x < 0 ? -1 : 1; x = Math.abs(x);
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const t = 1/(1+p*x);
    const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
    return sign*y;
  }
  function normCDF(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
  function normPDF(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }

  function d1d2(S,K,r,sigma,T){
    const d1 = (Math.log(S/K) + (r + 0.5*sigma*sigma)*T) / (sigma*Math.sqrt(T));
    const d2 = d1 - sigma*Math.sqrt(T);
    return [d1,d2];
  }
  function callPrice(S,K,r,sigma,T){
    const [d1,d2] = d1d2(S,K,r,sigma,T);
    return S*normCDF(d1) - K*Math.exp(-r*T)*normCDF(d2);
  }
  function putPrice(S,K,r,sigma,T){
    const [d1,d2] = d1d2(S,K,r,sigma,T);
    return K*Math.exp(-r*T)*normCDF(-d2) - S*normCDF(-d1);
  }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  /* ---- Ambient hero: a kinked payoff convolving into a smooth call curve ---- */
  function heroCanvas(canvas){
    const ctx = canvas.getContext('2d');
    let raf, phase = 0.001;
    function size(){
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
      canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(canvas.width/r.width, canvas.height/r.height);
    }
    size();
    window.addEventListener('resize', size);
    function step(){
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      phase += 0.004;
      if (phase > 1.4) phase = 0.001;
      const tau = Math.max(phase, 0.001);
      ctx.clearRect(0,0,w,h);
      const accent = getCss('--accent');
      ctx.beginPath();
      const K=100, r=0.03, sigma=0.35;
      for (let px=0; px<=w; px+=3){
        const S = 50 + (px/w)*100;
        const y = h - Math.min(callPrice(S,K,r,sigma,tau)/55, 1.15) * (h*0.85);
        px===0 ? ctx.moveTo(px,y) : ctx.lineTo(px,y);
      }
      ctx.strokeStyle = accent; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.6;
      ctx.stroke(); ctx.globalAlpha = 1;
      raf = requestAnimationFrame(step);
    }
    step();
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else step(); });
  }

  /* ---- Interactive 1: live calculator + shaded normal curve ---- */
  function calculatorDemo(root){
    const S = root.querySelector('#anS'), K = root.querySelector('#anK'),
          r = root.querySelector('#anR'), sig = root.querySelector('#anSig'),
          T = root.querySelector('#anT');
    const sVal=root.querySelector('#anSVal'), kVal=root.querySelector('#anKVal'),
          rVal=root.querySelector('#anRVal'), sigVal=root.querySelector('#anSigVal'),
          tVal=root.querySelector('#anTVal');
    const out = {
      d1: root.querySelector('#outD1'), d2: root.querySelector('#outD2'),
      Nd1: root.querySelector('#outNd1'), Nd2: root.querySelector('#outNd2'),
      call: root.querySelector('#outCall'), put: root.querySelector('#outPut'),
      parity: root.querySelector('#outParity')
    };
    const canvas = root.querySelector('#anCanvas');
    const ctx = canvas.getContext('2d');

    function size(){
      const rc = canvas.getBoundingClientRect();
      canvas.width = rc.width * Math.min(devicePixelRatio||1, 1.5);
      canvas.height = rc.height * Math.min(devicePixelRatio||1, 1.5);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(canvas.width/rc.width, canvas.height/rc.height);
    }
    size();
    window.addEventListener('resize', () => { size(); draw(); });

    function draw(d1,d2){
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      ctx.clearRect(0,0,w,h);
      const lo=-4, hi=4;
      function toX(z){ return ((z-lo)/(hi-lo))*w; }
      function toY(v){ return h - (v/0.42)*h*0.9; }
      const border = getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2'), textDim=getCss('--text-dim');

      // axis
      ctx.strokeStyle = border; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,toY(0)); ctx.lineTo(w,toY(0)); ctx.stroke();

      // shade area up to d2 (amber) then up to d1 (teal) on top for contrast
      function shadeUpTo(zBound, color, alpha){
        ctx.beginPath();
        ctx.moveTo(toX(lo), toY(0));
        for (let z=lo; z<=zBound; z+=0.05){
          ctx.lineTo(toX(z), toY(normPDF(z)));
        }
        ctx.lineTo(toX(zBound), toY(0));
        ctx.closePath();
        ctx.fillStyle = color; ctx.globalAlpha = alpha; ctx.fill(); ctx.globalAlpha=1;
      }

      shadeUpTo(d1, accent, 0.22);

      ctx.beginPath();
      for (let px=0; px<=w; px+=2){
        const z = lo + (px/w)*(hi-lo);
        const y = toY(normPDF(z));
        px===0 ? ctx.moveTo(px,y) : ctx.lineTo(px,y);
      }
      ctx.strokeStyle = getCss('--text'); ctx.lineWidth=1.4; ctx.stroke();

      // markers
      [[d1,accent,'d₁'],[d2,accent2,'d₂']].forEach(([z,color,label]) => {
        const x = toX(z);
        ctx.strokeStyle = color; ctx.setLineDash([3,3]); ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(x,toY(0)); ctx.lineTo(x,toY(normPDF(z))); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = color; ctx.font='12px monospace';
        ctx.fillText(label, x-8, toY(0)+18);
      });
      ctx.fillStyle = textDim; ctx.font='10.5px monospace';
      ctx.fillText('z', w-14, toY(0)-6);
    }

    function update(){
      const s=parseFloat(S.value), k=parseFloat(K.value), rr=parseFloat(r.value)/100,
            sg=parseFloat(sig.value)/100, t=parseFloat(T.value);
      sVal.textContent=s.toFixed(0); kVal.textContent=k.toFixed(0);
      rVal.textContent=(rr*100).toFixed(1)+'%'; sigVal.textContent=(sg*100).toFixed(0)+'%';
      tVal.textContent=t.toFixed(2)+' yr';

      const [d1,d2] = d1d2(s,k,rr,sg,t);
      const c = callPrice(s,k,rr,sg,t), p = putPrice(s,k,rr,sg,t);
      out.d1.textContent = d1.toFixed(4);
      out.d2.textContent = d2.toFixed(4);
      out.Nd1.textContent = normCDF(d1).toFixed(4);
      out.Nd2.textContent = normCDF(d2).toFixed(4);
      out.call.textContent = '$'+c.toFixed(3);
      out.put.textContent = '$'+p.toFixed(3);
      const lhs = c-p, rhs = s - k*Math.exp(-rr*t);
      out.parity.textContent = `C−P = ${lhs.toFixed(3)}  vs.  S−Ke^(−rT) = ${rhs.toFixed(3)}  ✓ match to rounding`;

      draw(d1,d2);
    }

    root.querySelector('#anDownload').onclick = () => BS.downloadCanvasPNG(canvas, 'd1-d2-normal-curve');
    update();
  }

/* ============================================================================
   MODULE: GREEKS  (Tab 05 — BUILT)
   All 12 option sensitivities (first, second, and third order), each with a
   mathematical definition, closed-form formula, financial meaning, and a
   live chart plotting the Greek vs. stock price. One shared control panel
   (S, K, r, σ, T) drives every chart at once, plus a "decay to expiry"
   animation that sweeps T → 0 so time-sensitive Greeks (Theta, Charm,
   Color, Gamma) can be watched evolving in real time.
   ============================================================================ */
(function(){

  function erf(x){
    const sign = x < 0 ? -1 : 1; x = Math.abs(x);
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const t = 1/(1+p*x);
    const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
    return sign*y;
  }
  function N(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
  function phi(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function d1d2(S,K,r,sigma,T){
    const d1 = (Math.log(S/K) + (r + 0.5*sigma*sigma)*T) / (sigma*Math.sqrt(T));
    const d2 = d1 - sigma*Math.sqrt(T);
    return [d1,d2];
  }
  function callPrice(S,K,r,sigma,T){
    const [d1,d2] = d1d2(S,K,r,sigma,T);
    return S*N(d1) - K*Math.exp(-r*T)*N(d2);
  }

  /* ---- Every Greek as a pure function of (S,K,r,sigma,T) ---- */
  const CALC = {
    delta:(S,K,r,sg,T)=>{ const [d1]=d1d2(S,K,r,sg,T); return N(d1); },
    gamma:(S,K,r,sg,T)=>{ const [d1]=d1d2(S,K,r,sg,T); return phi(d1)/(S*sg*Math.sqrt(T)); },
    vega:(S,K,r,sg,T)=>{ const [d1]=d1d2(S,K,r,sg,T); return S*phi(d1)*Math.sqrt(T)/100; },
    theta:(S,K,r,sg,T)=>{ const [d1,d2]=d1d2(S,K,r,sg,T);
      return (-(S*phi(d1)*sg)/(2*Math.sqrt(T)) - r*K*Math.exp(-r*T)*N(d2))/365; },
    rho:(S,K,r,sg,T)=>{ const [,d2]=d1d2(S,K,r,sg,T); return K*T*Math.exp(-r*T)*N(d2)/100; },
    lambda:(S,K,r,sg,T)=>{ const [d1]=d1d2(S,K,r,sg,T); const C=callPrice(S,K,r,sg,T);
      return C>1e-6 ? N(d1)*S/C : 0; },
    vanna:(S,K,r,sg,T)=>{ const [d1,d2]=d1d2(S,K,r,sg,T); return -phi(d1)*d2/sg; },
    vomma:(S,K,r,sg,T)=>{ const [d1,d2]=d1d2(S,K,r,sg,T); const vg=S*phi(d1)*Math.sqrt(T);
      return vg*d1*d2/sg; },
    charm:(S,K,r,sg,T)=>{ const [d1,d2]=d1d2(S,K,r,sg,T);
      return -phi(d1)*(2*r*T - d2*sg*Math.sqrt(T))/(2*T*sg*Math.sqrt(T))/365; },
    speed:(S,K,r,sg,T)=>{ const [d1]=d1d2(S,K,r,sg,T); const g=phi(d1)/(S*sg*Math.sqrt(T));
      return -g/S*(d1/(sg*Math.sqrt(T)) + 1); },
    color:(S,K,r,sg,T)=>{ const [d1,d2]=d1d2(S,K,r,sg,T);
      return -phi(d1)/(2*S*T*sg*Math.sqrt(T)) * (1 + d1*(2*r*T - d2*sg*Math.sqrt(T))/(sg*Math.sqrt(T)))/365; },
    ultima:(S,K,r,sg,T)=>{ const [d1,d2]=d1d2(S,K,r,sg,T); const vg=S*phi(d1)*Math.sqrt(T);
      return -vg/(sg*sg) * (d1*d2*(1-d1*d2) + d1*d1 + d2*d2); }
  };

  const GREEKS = [
    { id:'delta', order:'First-order', name:'Delta', sym:'Δ',
      defn:'The rate of change of the option price with respect to the underlying stock price — the first partial derivative \\(\\partial C/\\partial S\\).',
      formula:'$$ \\Delta = \\frac{\\partial C}{\\partial S} = N(d_1) $$',
      meaning:'Delta is the number of shares needed to hedge one call (the replicating-portfolio ratio from Tab 02). It ranges from 0 (deep OTM) to 1 (deep ITM), and is often read informally as "the market\'s implied probability the option finishes in the money" — though that role technically belongs to \\(N(d_2)\\) (Tab 04).' },
    { id:'vega', order:'First-order', name:'Vega', sym:'ν',
      defn:'The rate of change of the option price with respect to volatility, \\(\\partial C/\\partial \\sigma\\). (Not a Greek letter — the name is a finance-world coinage.)',
      formula:'$$ \\nu = \\frac{\\partial C}{\\partial \\sigma} = S\\,\\phi(d_1)\\sqrt{T} $$',
      meaning:'Vega is always positive for both calls and puts: more volatility means a wider range of possible outcomes, and since option payoffs are floored at zero, more spread can only help the holder. Vega is largest for at-the-money options with plenty of time left, and shrinks to zero as expiry approaches.' },
    { id:'theta', order:'First-order', name:'Theta', sym:'Θ',
      defn:'The rate of change of the option price with respect to the passage of time, \\(\\partial C/\\partial t\\) (equivalently \\(-\\partial C/\\partial T\\)).',
      formula:'$$ \\Theta = -\\frac{S\\,\\phi(d_1)\\sigma}{2\\sqrt{T}} - rKe^{-rT}N(d_2) $$',
      meaning:'Theta is usually negative for a long option position — this is "time decay," the value quietly leaking out of the option every day, all else equal. It is steepest for at-the-money options right before expiry, which is exactly what the "decay to expiry" animation below makes visible.' },
    { id:'rho', order:'First-order', name:'Rho', sym:'ρ',
      defn:'The rate of change of the option price with respect to the risk-free rate, \\(\\partial C/\\partial r\\).',
      formula:'$$ \\rho = \\frac{\\partial C}{\\partial r} = KTe^{-rT}N(d_2) $$',
      meaning:'Rho is positive for calls: a higher risk-free rate lowers the present value of the strike you\'ll eventually pay, which raises the call\'s value. It grows with time to expiry, but for most short-dated equity options it is the smallest and least-watched of the primary Greeks.' },
    { id:'lambda', order:'First-order', name:'Lambda (Omega)', sym:'Λ',
      defn:'The elasticity of the option price with respect to the stock price — the percentage change in option value for a 1% change in the stock, \\(\\Delta \\times S/C\\).',
      formula:'$$ \\Lambda = \\frac{\\partial C/C}{\\partial S/S} = \\Delta\\cdot\\frac{S}{C} $$',
      meaning:'Lambda measures leverage: an out-of-the-money option can have Lambda far above 10, meaning it moves 10%+ for every 1% move in the stock, even though its Delta is small. This is why options are described as offering "leveraged exposure" — a little capital controlling a much larger effective position.' },
    { id:'gamma', order:'Second-order', name:'Gamma', sym:'Γ',
      defn:'The rate of change of Delta with respect to the stock price, \\(\\partial^2 C/\\partial S^2 = \\partial\\Delta/\\partial S\\) — the option price\'s curvature (convexity) in \\(S\\).',
      formula:'$$ \\Gamma = \\frac{\\partial \\Delta}{\\partial S} = \\frac{\\phi(d_1)}{S\\sigma\\sqrt{T}} $$',
      meaning:'Gamma is the same for calls and puts, always positive, and peaks sharply for at-the-money options as expiry nears — exactly where Delta is changing fastest and a hedge needs the most frequent rebalancing. High Gamma means a delta-hedge can go stale very quickly.' },
    { id:'vanna', order:'Second-order', name:'Vanna', sym:'—',
      defn:'The mixed second derivative of price with respect to both stock price and volatility: \\(\\partial^2C/\\partial S\\partial\\sigma = \\partial\\Delta/\\partial\\sigma = \\partial\\nu/\\partial S\\).',
      formula:'$$ \\text{Vanna} = \\frac{\\partial \\Delta}{\\partial \\sigma} = -\\phi(d_1)\\frac{d_2}{\\sigma} $$',
      meaning:'Vanna tells a hedger how much their Delta-hedge will drift if volatility suddenly jumps — critical during volatility shocks. It also tells a volatility trader how their Vega exposure shifts as the stock moves, which matters for pricing the volatility "skew" revisited in Tab 08.' },
    { id:'vomma', order:'Second-order', name:'Vomma (Volga)', sym:'—',
      defn:'The second derivative of price with respect to volatility, \\(\\partial^2C/\\partial\\sigma^2 = \\partial\\nu/\\partial\\sigma\\) — the convexity of the option price in volatility itself.',
      formula:'$$ \\text{Vomma} = \\frac{\\partial \\nu}{\\partial \\sigma} = \\nu\\cdot\\frac{d_1 d_2}{\\sigma} $$',
      meaning:'Vomma is largest for far out-of-the-money options. A trader who is long Vomma benefits from volatility being volatile — i.e., large swings in implied volatility itself — independent of which direction volatility moves, in the same convexity spirit as Gamma but for \\(\\sigma\\) instead of \\(S\\).' },
    { id:'charm', order:'Third-order', name:'Charm', sym:'—',
      defn:'The rate of change of Delta with respect to time, \\(\\partial\\Delta/\\partial t = \\partial^2C/\\partial S\\partial t\\) — sometimes called "Delta decay."',
      formula:'$$ \\text{Charm} = \\frac{\\partial \\Delta}{\\partial t} = -\\phi(d_1)\\frac{2rT - d_2\\sigma\\sqrt{T}}{2T\\sigma\\sqrt{T}} $$',
      meaning:'Charm tells a delta-hedger how many shares they\'ll need to buy or sell tomorrow purely because a day has passed, even if the stock price doesn\'t move at all. It becomes especially important for hedges held over weekends or holidays, when several days of Charm accumulate at once.' },
    { id:'speed', order:'Third-order', name:'Speed', sym:'—',
      defn:'The rate of change of Gamma with respect to the stock price, \\(\\partial\\Gamma/\\partial S = \\partial^3C/\\partial S^3\\) — the third derivative of price in \\(S\\).',
      formula:'$$ \\text{Speed} = \\frac{\\partial \\Gamma}{\\partial S} = -\\frac{\\Gamma}{S}\\left(\\frac{d_1}{\\sigma\\sqrt{T}} + 1\\right) $$',
      meaning:'Speed matters to market makers running large, heavily-hedged option books: it measures how quickly their Gamma itself — and therefore how quickly their hedging burden — changes as the stock moves, which is especially relevant during fast, large price swings.' },
    { id:'color', order:'Third-order', name:'Color', sym:'—',
      defn:'The rate of change of Gamma with respect to time, \\(\\partial\\Gamma/\\partial t = \\partial^3C/\\partial S^2\\partial t\\) — "Gamma decay."',
      formula:'$$ \\text{Color} = \\frac{\\partial \\Gamma}{\\partial t} = -\\frac{\\phi(d_1)}{2ST\\sigma\\sqrt{T}}\\left[1 + d_1\\frac{2rT - d_2\\sigma\\sqrt{T}}{\\sigma\\sqrt{T}}\\right] $$',
      meaning:'Color tells a hedger how their Gamma exposure — and hence their hedge-rebalancing risk — will change purely with the passage of time. Near expiry, at-the-money Gamma spikes dramatically, and Color is the rate at which that spike builds, which the animation below makes directly visible.' },
    { id:'ultima', order:'Third-order', name:'Ultima', sym:'—',
      defn:'The third derivative of price with respect to volatility, \\(\\partial^3C/\\partial\\sigma^3 = \\partial\\,\\text{Vomma}/\\partial\\sigma\\) — the sensitivity of Vomma itself to volatility.',
      formula:'$$ \\text{Ultima} = \\frac{\\partial\\,\\text{Vomma}}{\\partial \\sigma} = -\\frac{\\nu}{\\sigma^2}\\Big[d_1d_2(1-d_1d_2) + d_1^2+d_2^2\\Big] $$',
      meaning:'Ultima is a niche, purely third-order sensitivity used mainly in exotic-volatility and variance-swap books to understand how convexity-to-volatility (Vomma) itself shifts as volatility changes. It rarely matters for a single vanilla option, but shows up in large volatility-derivative portfolios.' }
  ];

  /* ---- Shared control-panel state, read by every chart on redraw ---- */
  let P = { S:100, K:100, r:0.03, sigma:0.25, T:1.0 };
  const chartRegistry = []; // {canvas, greekId}

  function drawChart(canvas, greekId){
    const ctx = canvas.getContext('2d');
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
    canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(canvas.width/r.width, canvas.height/r.height);
    const w = r.width, h = r.height;
    ctx.clearRect(0,0,w,h);

    const fn = CALC[greekId];
    const Smin = Math.max(1, P.K*0.3), Smax = P.K*1.9;
    const pts = [];
    for (let i=0;i<=140;i++){
      const S = Smin + (i/140)*(Smax-Smin);
      let v;
      try { v = fn(S, P.K, P.r, P.sigma, Math.max(P.T,0.004)); } catch(e){ v = 0; }
      if (!isFinite(v)) v = 0;
      pts.push([S,v]);
    }
    const vals = pts.map(p=>p[1]);
    let vlo = Math.min(...vals,0), vhi = Math.max(...vals,0);
    if (vhi-vlo < 1e-9){ vhi += 1; vlo -= 1; }
    const pad = (vhi-vlo)*0.12; vlo -= pad; vhi += pad;

    function toX(S){ return ((S-Smin)/(Smax-Smin))*w; }
    function toY(v){ return h - ((v-vlo)/(vhi-vlo))*h; }

    const border = getCss('--border-soft'), accent = getCss('--accent'), accent2 = getCss('--accent-2'), textDim = getCss('--text-dim');

    // zero line
    if (vlo < 0 && vhi > 0){
      ctx.strokeStyle = border; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,toY(0)); ctx.lineTo(w,toY(0)); ctx.stroke();
    }
    // strike reference
    ctx.strokeStyle = border; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(toX(P.K),0); ctx.lineTo(toX(P.K),h); ctx.stroke();
    ctx.setLineDash([]);

    // curve
    ctx.beginPath();
    pts.forEach(([S,v],i) => { const x=toX(S), y=toY(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.stroke();

    // current-S marker
    let curV; try { curV = fn(P.S, P.K, P.r, P.sigma, Math.max(P.T,0.004)); } catch(e){ curV = 0; }
    if (!isFinite(curV)) curV = 0;
    const mx = toX(P.S), my = toY(curV);
    ctx.strokeStyle = accent2; ctx.setLineDash([3,3]); ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(mx,0); ctx.lineTo(mx,h); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = accent2;
    ctx.beginPath(); ctx.arc(mx,my,4,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = textDim; ctx.font = '10px monospace';
    ctx.fillText('K', toX(P.K)-6, h-4);
    ctx.fillText('S →', w-24, h-4);

    const readout = canvas.parentElement.querySelector('.greek-readout');
    if (readout) readout.textContent = curV.toFixed(5);
  }

  function redrawAll(){
    chartRegistry.forEach(({canvas,greekId}) => drawChart(canvas, greekId));
  }

  /* ---- Shared control panel + decay-to-expiry animation ---- */
  function controlPanel(root){
    const sS=root.querySelector('#gS'), sK=root.querySelector('#gK'), sR=root.querySelector('#gR'),
          sSig=root.querySelector('#gSig'), sT=root.querySelector('#gT');
    const vS=root.querySelector('#gSVal'), vK=root.querySelector('#gKVal'), vR=root.querySelector('#gRVal'),
          vSig=root.querySelector('#gSigVal'), vT=root.querySelector('#gTVal');
    function sync(){
      P.S=parseFloat(sS.value); P.K=parseFloat(sK.value); P.r=parseFloat(sR.value)/100;
      P.sigma=parseFloat(sSig.value)/100; P.T=parseFloat(sT.value);
      vS.textContent=P.S.toFixed(0); vK.textContent=P.K.toFixed(0);
      vR.textContent=(P.r*100).toFixed(1)+'%'; vSig.textContent=(P.sigma*100).toFixed(0)+'%';
      vT.textContent=P.T.toFixed(2)+' yr';
      redrawAll();
    }
    [sS,sK,sR,sSig,sT].forEach(el => el.oninput = sync);

    let animRaf = null, animRunning = false;
    const btn = root.querySelector('#decayBtn');
    const T0 = parseFloat(sT.value);
    btn.onclick = () => {
      if (animRunning){ cancelAnimationFrame(animRaf); animRunning=false; btn.textContent='▶ Animate: decay to expiry'; return; }
      animRunning = true; btn.textContent = '■ Stop animation';
      sT.value = T0;
      let start = null;
      const duration = 4000;
      function frame(ts){
        if (!start) start = ts;
        const prog = Math.min((ts-start)/duration, 1);
        const Tnow = Math.max(T0*(1-prog), 0.01);
        sT.value = Tnow.toFixed(3);
        sync();
        if (prog < 1 && animRunning){ animRaf = requestAnimationFrame(frame); }
        else { animRunning=false; btn.textContent='▶ Animate: decay to expiry'; }
      }
      animRaf = requestAnimationFrame(frame);
    };
    sync();
  }

              K = <span id="gKVal" class="mono" style="color:var(--accent);">100</span>
              <input id="gK" type="range" min="20" max="200" step="1" value="100">
            </label>
            <label style="font-size:12.3px; color:var(--text-muted); display:flex; flex-direction:column; gap:4px;">
              r = <span id="gRVal" class="mono" style="color:var(--accent);">3.0%</span>

            <label style="font-size:12.3px; color:var(--text-muted); display:flex; flex-direction:column; gap:4px;">

          <p style="font-size:12px; margin:10px 0 0;">Dashed vertical line = strike \\(K\\); amber dot = the Greek's value at your current \\(S\\). Each chart's curve is that Greek plotted across a range of stock prices, holding \\(K,r,\\sigma,T\\) fixed at the sliders above.</p>

/* ============================================================================
   MODULE: NUMERICAL METHODS  (Tab 06 — BUILT)
   Eight numerical techniques for pricing when no closed form exists (or to
   validate one). Each method gets: theory, a numbered algorithm (collapsible
   steps), advantages/limitations/stability/accuracy cards, and one focused
   interactive visualization. A closing comparison table ties accuracy,
   speed, and stability together across all eight.
   ============================================================================ */
(function(){

  function erf(x){
    const sign = x < 0 ? -1 : 1; x = Math.abs(x);
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const t = 1/(1+p*x);
    const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
    return sign*y;
  }
  function N(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
  function bsCall(S,K,r,sigma,T){
    if (T<=1e-8) return Math.max(S-K,0);
    const d1=(Math.log(S/K)+(r+0.5*sigma*sigma)*T)/(sigma*Math.sqrt(T));
    const d2=d1-sigma*Math.sqrt(T);
    return S*N(d1)-K*Math.exp(-r*T)*N(d2);
  }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function sizeCanvas(canvas){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * Math.min(devicePixelRatio||1, 1.5);
    canvas.height = r.height * Math.min(devicePixelRatio||1, 1.5);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(canvas.width/r.width, canvas.height/r.height);
    return { ctx, w:r.width, h:r.height };
  }

  /* =====================  METHOD 1: EXPLICIT FINITE DIFFERENCE  ===================== */
  function explicitDemo(root){
    const canvas = root.querySelector('#expFDCanvas');
    const nSSlider = root.querySelector('#expFDnS');
    const nSVal = root.querySelector('#expFDnSVal');
    const statusEl = root.querySelector('#expFDStatus');
    const K=100, r=0.03, sigma=0.25, T=1, Smax=250;

    function run(nS){
      const dS = Smax/nS;
      // choose dt near the stability limit factor to make the demo pedagogically honest
      const dtStable = 0.9 / (sigma*sigma*nS*nS);
      const nT = Math.max(20, Math.ceil(T/dtStable));
      const dt = T/nT;
      const stable = dt <= 1/(sigma*sigma*nS*nS); // classic explicit-FD stability bound (schematic)
      let V = new Array(nS+1);
      for (let i=0;i<=nS;i++){ V[i] = Math.max(i*dS - K, 0); } // terminal payoff at tau=0
      for (let step=0; step<nT; step++){
        const Vnew = new Array(nS+1);
        for (let i=1;i<nS;i++){
          const Si = i*dS;
          const a = 0.5*dt*(sigma*sigma*i*i - r*i);
          const b = 1 - dt*(sigma*sigma*i*i + r);
          const c = 0.5*dt*(sigma*sigma*i*i + r*i);
          Vnew[i] = a*V[i-1] + b*V[i] + c*V[i+1];
        }
        Vnew[0] = 0;
        Vnew[nS] = Smax - K*Math.exp(-r*(step+1)*dt);
        V = Vnew;
      }
      return { V, dS, nS, dt, nT, stable };
    }

    function draw(){
      const nS = parseInt(nSSlider.value,10);
      nSVal.textContent = nS;
      const { V, dS, stable } = run(nS);
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2'), down=getCss('--accent-down');
      const Smin=50, Sview=180;
      function toX(S){ return ((S-Smin)/(Sview-Smin))*w; }
      const vmax = 90;
      function toY(v){ return h - (v/vmax)*h*0.9; }

      // exact curve
      ctx.beginPath();
      for (let px=0; px<=w; px+=3){
        const S = Smin+(px/w)*(Sview-Smin);
        const y = toY(bsCall(S,K,r,sigma,T));
        px===0?ctx.moveTo(px,y):ctx.lineTo(px,y);
      }
      ctx.strokeStyle=border; ctx.lineWidth=1.6; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);

      // FD grid solution
      ctx.beginPath();
      let started=false;
      for (let i=0;i<=nS;i++){
        const S=i*dS;
        if (S<Smin || S>Sview) continue;
        const y = toY(Math.max(Math.min(V[i],vmax*1.3),-vmax*0.3));
        const x = toX(S);
        !started ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        started=true;
      }
      ctx.strokeStyle = stable ? accent : down; ctx.lineWidth=2; ctx.stroke();

      statusEl.innerHTML = stable
        ? `<span style="color:${accent}">Stable</span> — dt satisfies the explicit-scheme bound; grid solution (solid) tracks the closed form (dashed).`
        : `<span style="color:${down}">Unstable</span> — too many space steps for this dt; oscillations (or blow-up) appear, illustrating why explicit FD needs \\(dt \\lesssim 1/(\\sigma^2 n_S^2)\\).`;
      BS.typeset();
    }
    nSSlider.oninput = draw;
    window.addEventListener('resize', draw);
    draw();
  }

  /* =====================  METHOD 2: IMPLICIT FINITE DIFFERENCE  ===================== */
  function implicitDemo(root){
    const canvas = root.querySelector('#impFDCanvas');
    const dtSlider = root.querySelector('#impFDdt');
    const dtVal = root.querySelector('#impFDdtVal');
    const K=100, r=0.03, sigma=0.25, T=1, Smax=250, nS=60;
    const dS = Smax/nS;

    function thomasSolve(a,b,c,d){ // tridiagonal solver
      const n = b.length;
      const cp = new Array(n), dp = new Array(n);
      cp[0]=c[0]/b[0]; dp[0]=d[0]/b[0];
      for (let i=1;i<n;i++){
        const m = b[i]-a[i]*cp[i-1];
        cp[i] = c[i]/m;
        dp[i] = (d[i]-a[i]*dp[i-1])/m;
      }
      const x = new Array(n);
      x[n-1]=dp[n-1];
      for (let i=n-2;i>=0;i--) x[i]=dp[i]-cp[i]*x[i+1];
      return x;
    }

    function run(dt){
      const nT = Math.max(5, Math.round(T/dt));
      const dtActual = T/nT;
      let V = new Array(nS+1);
      for (let i=0;i<=nS;i++) V[i] = Math.max(i*dS-K,0);
      const n = nS-1;
      const a=new Array(n), b=new Array(n), c=new Array(n);
      for (let k=0;k<n;k++){
        const i=k+1;
        a[k] = -0.5*dtActual*(sigma*sigma*i*i - r*i);
        b[k] = 1 + dtActual*(sigma*sigma*i*i + r);
        c[k] = -0.5*dtActual*(sigma*sigma*i*i + r*i);
      }
      for (let step=0; step<nT; step++){
        const bd0 = Math.max(0*dS-K,0), bdN = Smax-K*Math.exp(-r*(step+1)*dtActual);
        const d = new Array(n);
        for (let k=0;k<n;k++){
          d[k]=V[k+1];
          if (k===0) d[k] -= a[k]*0;
          if (k===n-1) d[k] -= c[k]*bdN;
        }
        const interior = thomasSolve(a,b,c,d);
        V = [0, ...interior, bdN];
      }
      return V;
    }

    function draw(){
      const dt = parseFloat(dtSlider.value);
      dtVal.textContent = dt.toFixed(3)+' yr';
      const V = run(dt);
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent');
      const Smin=50, Sview=180, vmax=90;
      function toX(S){ return ((S-Smin)/(Sview-Smin))*w; }
      function toY(v){ return h - (v/vmax)*h*0.9; }

      ctx.beginPath();
      for (let px=0; px<=w; px+=3){
        const S = Smin+(px/w)*(Sview-Smin);
        const y = toY(bsCall(S,K,r,sigma,T));
        px===0?ctx.moveTo(px,y):ctx.lineTo(px,y);
      }
      ctx.strokeStyle=border; ctx.lineWidth=1.6; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);

      ctx.beginPath();
      let started=false;
      for (let i=0;i<=nS;i++){
        const S=i*dS; if (S<Smin||S>Sview) continue;
        const x=toX(S), y=toY(V[i]);
        !started?ctx.moveTo(x,y):ctx.lineTo(x,y); started=true;
      }
      ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.stroke();
    }
    dtSlider.oninput = draw;
    window.addEventListener('resize', draw);
    draw();
  }

  /* =====================  METHOD 3: CRANK–NICOLSON  ===================== */
  function crankNicolsonDemo(root){
    const canvas = root.querySelector('#cnCanvas');
    const errCanvas = root.querySelector('#cnErrCanvas');
    const K=100, r=0.03, sigma=0.25, T=1, Smax=250, nS=60, nT=60;
    const dS=Smax/nS, dt=T/nT;

    function thomasSolve(a,b,c,d){
      const n=b.length; const cp=new Array(n), dp=new Array(n);
      cp[0]=c[0]/b[0]; dp[0]=d[0]/b[0];
      for (let i=1;i<n;i++){ const m=b[i]-a[i]*cp[i-1]; cp[i]=c[i]/m; dp[i]=(d[i]-a[i]*dp[i-1])/m; }
      const x=new Array(n); x[n-1]=dp[n-1];
      for (let i=n-2;i>=0;i--) x[i]=dp[i]-cp[i]*x[i+1];
      return x;
    }

    function runCN(){
      let V = new Array(nS+1);
      for (let i=0;i<=nS;i++) V[i]=Math.max(i*dS-K,0);
      const n=nS-1;
      const aL=new Array(n), bL=new Array(n), cL=new Array(n);
      const aR=new Array(n), bR=new Array(n), cR=new Array(n);
      for (let k=0;k<n;k++){
        const i=k+1;
        const alpha=0.25*dt*(sigma*sigma*i*i - r*i);
        const beta = -0.5*dt*(sigma*sigma*i*i + r);
        const gamma=0.25*dt*(sigma*sigma*i*i + r*i);
        aL[k]=-alpha; bL[k]=1-beta; cL[k]=-gamma;
        aR[k]= alpha; bR[k]=1+beta; cR[k]= gamma;
      }
      const errHist = [];
      for (let step=0; step<nT; step++){
        const bd0=0, bdN=Smax-K*Math.exp(-r*(step+1)*dt);
        const d=new Array(n);
        for (let k=0;k<n;k++){
          d[k]=aR[k]*(k===0?0:V[k]) + bR[k]*V[k+1] + cR[k]*(k===n-1?bdN:V[k+2]);
        }
        const interior=thomasSolve(aL,bL,cL,d);
        V=[0,...interior,bdN];
        // track error at ATM against exact BS at this tau
        const tau=(step+1)*dt;
        const iATM=Math.round(K/dS);
        const exact=bsCall(iATM*dS,K,r,sigma,tau);
        errHist.push(Math.abs(V[iATM]-exact));
      }
      return { V, errHist };
    }

    function drawMain(V){
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent');
      const Smin=50, Sview=180, vmax=90;
      function toX(S){ return ((S-Smin)/(Sview-Smin))*w; }
      function toY(v){ return h - (v/vmax)*h*0.9; }
      ctx.beginPath();
      for (let px=0; px<=w; px+=3){
        const S=Smin+(px/w)*(Sview-Smin);
        const y=toY(bsCall(S,K,r,sigma,T));
        px===0?ctx.moveTo(px,y):ctx.lineTo(px,y);
      }
      ctx.strokeStyle=border; ctx.lineWidth=1.6; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); let started=false;
      for (let i=0;i<=nS;i++){ const S=i*dS; if (S<Smin||S>Sview) continue;
        const x=toX(S), y=toY(V[i]); !started?ctx.moveTo(x,y):ctx.lineTo(x,y); started=true; }
      ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.stroke();
    }
    function drawErr(errHist){
      const { ctx, w, h } = sizeCanvas(errCanvas);
      ctx.clearRect(0,0,w,h);
      const emax = Math.max(...errHist, 1e-6);
      const accent2 = getCss('--accent-2');
      ctx.beginPath();
      errHist.forEach((e,i) => { const x=(i/(errHist.length-1))*w, y=h-(e/emax)*h*0.9; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=accent2; ctx.lineWidth=2; ctx.stroke();
    }
    const { V, errHist } = runCN();
    drawMain(V); drawErr(errHist);
    window.addEventListener('resize', () => { drawMain(V); drawErr(errHist); });
  }

  /* =====================  METHOD 4: FINITE VOLUME  ===================== */
  function finiteVolumeDemo(root){
    const canvas = root.querySelector('#fvCanvas');
    const K=100, r=0.03, sigma=0.25, T=1, Smax=250, nCells=40;
    const dS = Smax/nCells;

    // Simple conservative finite-volume-style explicit scheme in log-price flux form (schematic)
    function run(){
      let V = new Array(nCells);
      for (let i=0;i<nCells;i++){ const Sc=(i+0.5)*dS; V[i]=Math.max(Sc-K,0); }
      const dt = 0.4/(sigma*sigma*nCells*nCells);
      const nT = Math.max(30, Math.ceil(T/dt));
      const dtA = T/nT;
      for (let step=0; step<nT; step++){
        const Vnew = V.slice();
        for (let i=1;i<nCells-1;i++){
          const Sc=(i+0.5)*dS;
          // flux-based diffusion + drift across cell faces (schematic conservative form)
          const diff = sigma*sigma*Sc*Sc*(V[i+1]-2*V[i]+V[i-1])/(dS*dS);
          const drift = r*Sc*(V[i+1]-V[i-1])/(2*dS);
          Vnew[i] = V[i] + dtA*(0.5*diff + drift - r*V[i]);
        }
        Vnew[0]=0; Vnew[nCells-1]=Smax-K*Math.exp(-r*(step+1)*dtA);
        V = Vnew;
      }
      return V;
    }
    function draw(){
      const V = run();
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent');
      const Smin=50, Sview=180, vmax=90;
      function toX(S){ return ((S-Smin)/(Sview-Smin))*w; }
      function toY(v){ return h-(v/vmax)*h*0.9; }
      // exact
      ctx.beginPath();
      for (let px=0; px<=w; px+=3){ const S=Smin+(px/w)*(Sview-Smin); const y=toY(bsCall(S,K,r,sigma,T)); px===0?ctx.moveTo(px,y):ctx.lineTo(px,y); }
      ctx.strokeStyle=border; ctx.lineWidth=1.6; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
      // cell-average step plot (highlights FV's "cell average" character)
      for (let i=0;i<nCells;i++){
        const Sl=i*dS, Sr=(i+1)*dS;
        if (Sr<Smin||Sl>Sview) continue;
        const x1=toX(Math.max(Sl,Smin)), x2=toX(Math.min(Sr,Sview)), y=toY(V[i]);
        ctx.strokeStyle=accent; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
      }
    }
    draw();
    window.addEventListener('resize', draw);
  }

  /* =====================  METHOD 5: FINITE ELEMENT  ===================== */
  function finiteElementDemo(root){
    const canvas = root.querySelector('#feCanvas');
    const K=100, r=0.03, sigma=0.25, T=1, Smax=250, nElem=14; // deliberately coarse mesh
    const dS = Smax/nElem;

    function thomasSolve(a,b,c,d){
      const n=b.length; const cp=new Array(n), dp=new Array(n);
      cp[0]=c[0]/b[0]; dp[0]=d[0]/b[0];
      for (let i=1;i<n;i++){ const m=b[i]-a[i]*cp[i-1]; cp[i]=c[i]/m; dp[i]=(d[i]-a[i]*dp[i-1])/m; }
      const x=new Array(n); x[n-1]=dp[n-1];
      for (let i=n-2;i>=0;i--) x[i]=dp[i]-cp[i]*x[i+1];
      return x;
    }

    // Galerkin FEM with linear "hat" basis functions, backward-Euler in time (schematic, mass+stiffness matrices)
    function run(){
      const nT=40, dt=T/nT;
      let V = new Array(nElem+1);
      for (let i=0;i<=nElem;i++) V[i]=Math.max(i*dS-K,0);
      const n = nElem-1;
      const M=1, h=dS; // mass-matrix / stiffness coefficients (lumped, schematic)
      const a=new Array(n), b=new Array(n), c=new Array(n);
      for (let k=0;k<n;k++){
        const i=k+1, Si=i*dS;
        const stiff = sigma*sigma*Si*Si/(h*h);
        const conv = r*Si/(2*h);
        a[k] = -dt*(0.5*stiff - conv);
        b[k] = 1 + dt*(stiff + r);
        c[k] = -dt*(0.5*stiff + conv);
      }
      for (let step=0; step<nT; step++){
        const bdN = Smax-K*Math.exp(-r*(step+1)*dt);
        const d=new Array(n);
        for (let k=0;k<n;k++){ d[k]=V[k+1]; if (k===n-1) d[k]-=c[k]*bdN; }
        const interior=thomasSolve(a,b,c,d);
        V=[0,...interior,bdN];
      }
      return V;
    }
    function draw(){
      const V = run();
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2');
      const Smin=50, Sview=180, vmax=90;
      function toX(S){ return ((S-Smin)/(Sview-Smin))*w; }
      function toY(v){ return h-(v/vmax)*h*0.9; }
      ctx.beginPath();
      for (let px=0; px<=w; px+=3){ const S=Smin+(px/w)*(Sview-Smin); const y=toY(bsCall(S,K,r,sigma,T)); px===0?ctx.moveTo(px,y):ctx.lineTo(px,y); }
      ctx.strokeStyle=border; ctx.lineWidth=1.6; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
      // piecewise-linear FEM solution (hat functions -> straight segments between nodes)
      ctx.beginPath(); let started=false;
      for (let i=0;i<=nElem;i++){ const S=i*dS; if (S<Smin||S>Sview) continue;
        const x=toX(S), y=toY(V[i]); !started?ctx.moveTo(x,y):ctx.lineTo(x,y); started=true; }
      ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.stroke();
      // node markers -> emphasizes the coarse mesh / basis-function nodes
      for (let i=0;i<=nElem;i++){ const S=i*dS; if (S<Smin||S>Sview) continue;
        ctx.fillStyle=accent2; ctx.beginPath(); ctx.arc(toX(S), toY(V[i]), 3, 0, Math.PI*2); ctx.fill(); }
    }
    draw();
    window.addEventListener('resize', draw);
  }

  /* =====================  METHOD 6: MONTE CARLO  ===================== */
  function monteCarloDemo(root){
    const canvas = root.querySelector('#mcCanvas');
    const convCanvas = root.querySelector('#mcConvCanvas');
    const nPathsSlider = root.querySelector('#mcN');
    const nPathsVal = root.querySelector('#mcNVal');
    const priceOut = root.querySelector('#mcPriceOut');
    const errOut = root.querySelector('#mcErrOut');
    const runBtn = root.querySelector('#mcRunBtn');
    const K=100, r=0.03, sigma=0.25, T=1, S0=100, nSteps=60;

    function randNormal(){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
      return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

    function simulate(nPaths){
      const dt=T/nSteps;
      const paths=[]; const payoffs=[];
      const nShow = Math.min(nPaths, 60);
      for (let p=0;p<nPaths;p++){
        let S=S0; const track = p<nShow ? [S] : null;
        for (let i=0;i<nSteps;i++){
          S = S*Math.exp((r-0.5*sigma*sigma)*dt + sigma*Math.sqrt(dt)*randNormal());
          if (track) track.push(S);
        }
        payoffs.push(Math.max(S-K,0));
        if (track) paths.push(track);
      }
      const mean = payoffs.reduce((a,b)=>a+b,0)/nPaths;
      const price = mean*Math.exp(-r*T);
      const variance = payoffs.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(nPaths-1);
      const stderr = Math.sqrt(variance/nPaths)*Math.exp(-r*T);
      return { paths, price, stderr };
    }

    function drawPaths(paths){
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const accent=getCss('--accent'), accent2=getCss('--accent-2'), border=getCss('--border-soft');
      const all = paths.flat();
      const lo=Math.min(...all,K)*0.9, hi=Math.max(...all,K)*1.1;
      function toY(v){ return h-((v-lo)/(hi-lo))*h; }
      ctx.strokeStyle=border; ctx.setLineDash([4,4]); ctx.beginPath();
      ctx.moveTo(0,toY(K)); ctx.lineTo(w,toY(K)); ctx.stroke(); ctx.setLineDash([]);
      paths.forEach((path,pi) => {
        ctx.beginPath();
        path.forEach((v,i) => { const x=(i/(path.length-1))*w, y=toY(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
        const endsITM = path[path.length-1] > K;
        ctx.strokeStyle = endsITM ? accent : accent2;
        ctx.globalAlpha = 0.35; ctx.lineWidth=1.1; ctx.stroke(); ctx.globalAlpha=1;
      });
    }
    function drawConvergence(history){
      const { ctx, w, h } = sizeCanvas(convCanvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), down=getCss('--accent-down');
      const exact = bsCall(S0,K,r,sigma,T);
      const vals = history.map(hh=>hh.price);
      const lo = Math.min(exact*0.85, ...vals), hi = Math.max(exact*1.15, ...vals);
      function toY(v){ return h-((v-lo)/(hi-lo))*h; }
      ctx.strokeStyle=border; ctx.setLineDash([4,4]); ctx.beginPath();
      ctx.moveTo(0,toY(exact)); ctx.lineTo(w,toY(exact)); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath();
      history.forEach((hh,i) => { const x=(i/(history.length-1))*w, y=toY(hh.price); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.stroke();
      // +/- 2 stderr band on final point
      const last = history[history.length-1];
      ctx.strokeStyle=down; ctx.globalAlpha=0.6;
      ctx.beginPath(); ctx.moveTo(w-3, toY(last.price-2*last.stderr)); ctx.lineTo(w-3, toY(last.price+2*last.stderr)); ctx.lineWidth=2; ctx.stroke();
      ctx.globalAlpha=1;
    }

    let convHistory = [];
    function runOnce(){
      const n = parseInt(nPathsSlider.value,10);
      nPathsVal.textContent = n.toLocaleString();
      const result = simulate(n);
      drawPaths(result.paths);
      convHistory.push({ price: result.price, stderr: result.stderr });
      if (convHistory.length > 40) convHistory.shift();
      drawConvergence(convHistory);
      priceOut.textContent = '$'+result.price.toFixed(3) + ' ± ' + (2*result.stderr).toFixed(3) + ' (95%)';
      const exact = bsCall(S0,K,r,sigma,T);
      errOut.textContent = 'Exact BS price: $'+exact.toFixed(3)+'  |  MC error: $'+Math.abs(result.price-exact).toFixed(4);
    }
    nPathsSlider.oninput = () => { nPathsVal.textContent = parseInt(nPathsSlider.value,10).toLocaleString(); };
    runBtn.onclick = runOnce;
    window.addEventListener('resize', () => { if (convHistory.length) { drawConvergence(convHistory); } });
    runOnce();
  }

  /* =====================  METHOD 7: BINOMIAL TREE  ===================== */
  function binomialDemo(root){
    const canvas = root.querySelector('#binCanvas');
    const nSlider = root.querySelector('#binN');
    const nVal = root.querySelector('#binNVal');
    const priceOut = root.querySelector('#binPriceOut');
    const K=100, r=0.03, sigma=0.25, T=1, S0=100;

    function priceBinomial(n){
      const dt=T/n, u=Math.exp(sigma*Math.sqrt(dt)), d=1/u;
      const p=(Math.exp(r*dt)-d)/(u-d);
      const disc=Math.exp(-r*dt);
      let values = new Array(n+1);
      const nodeS = [];
      for (let i=0;i<=n;i++){ const S=S0*Math.pow(u,n-i)*Math.pow(d,i); values[i]=Math.max(S-K,0); nodeS.push(S); }
      for (let step=n-1; step>=0; step--){
        const next = new Array(step+1);
        for (let i=0;i<=step;i++) next[i] = disc*(p*values[i] + (1-p)*values[i+1]);
        values = next;
      }
      return { price: values[0], u, d, p };
    }

    function drawTree(n){
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2');
      const dt=T/n, u=Math.exp(sigma*Math.sqrt(dt)), d=1/u;
      const nShow = Math.min(n, 10); // cap drawn levels for legibility
      const positions = [];
      for (let step=0; step<=nShow; step++){
        positions[step]=[];
        for (let i=0;i<=step;i++){
          const S = S0*Math.pow(u,step-i)*Math.pow(d,i);
          const x = (step/nShow)*w*0.92 + w*0.04;
          const logS = Math.log(S/S0);
          const y = h/2 - logS*(h/2/ (nShow*sigma*Math.sqrt(dt)*1.3));
          positions[step].push({x,y,S});
        }
      }
      ctx.strokeStyle=border; ctx.lineWidth=1;
      for (let step=0; step<nShow; step++){
        positions[step].forEach((node,i) => {
          [positions[step+1][i], positions[step+1][i+1]].forEach(child => {
            ctx.beginPath(); ctx.moveTo(node.x,node.y); ctx.lineTo(child.x,child.y); ctx.stroke();
          });
        });
      }
      positions.forEach((level,step) => level.forEach(node => {
        ctx.fillStyle = node.S >= K ? accent : accent2;
        ctx.beginPath(); ctx.arc(node.x,node.y,3.2,0,Math.PI*2); ctx.fill();
      }));
      if (n>nShow){
        ctx.fillStyle = getCss('--text-dim'); ctx.font='11px monospace';
        ctx.fillText(`(showing first ${nShow} of ${n} steps)`, 10, h-8);
      }
    }
    function update(){
      const n = parseInt(nSlider.value,10);
      nVal.textContent = n;
      const { price } = priceBinomial(n);
      const exact = bsCall(S0,K,r,sigma,T);
      priceOut.textContent = `Binomial: $${price.toFixed(4)}  |  Exact BS: $${exact.toFixed(4)}  |  error: $${Math.abs(price-exact).toFixed(4)}`;
      drawTree(n);
    }
    nSlider.oninput = update;
    window.addEventListener('resize', update);
    update();
  }

  /* =====================  METHOD 8: TRINOMIAL TREE  ===================== */
  function trinomialDemo(root){
    const canvas = root.querySelector('#triCanvas');
    const nSlider = root.querySelector('#triN');
    const nVal = root.querySelector('#triNVal');
    const priceOut = root.querySelector('#triPriceOut');
    const K=100, r=0.03, sigma=0.25, T=1, S0=100;

    function priceTrinomial(n){
      const dt=T/n;
      const dx = sigma*Math.sqrt(3*dt);
      const nu = r-0.5*sigma*sigma;
      const pu = 0.5*((sigma*sigma*dt+nu*nu*dt*dt)/(dx*dx) + nu*dt/dx);
      const pm = 1 - (sigma*sigma*dt+nu*nu*dt*dt)/(dx*dx);
      const pd = 0.5*((sigma*sigma*dt+nu*nu*dt*dt)/(dx*dx) - nu*dt/dx);
      const disc = Math.exp(-r*dt);
      const nNodes = 2*n+1;
      let values = new Array(nNodes);
      for (let i=0;i<nNodes;i++){
        const j = i-n; // -n..n
        const S = S0*Math.exp(j*dx);
        values[i]=Math.max(S-K,0);
      }
      for (let step=n-1; step>=0; step--){
        const width = 2*step+1;
        const next = new Array(width);
        const offset = n-step;
        for (let i=0;i<width;i++){
          next[i] = disc*(pu*values[i+offset-1+1] + pm*values[i+offset] + pd*values[i+offset+1-1]);
        }
        // NOTE: index bookkeeping simplified for a schematic recombining trinomial lattice
        values = next.length ? next : values;
      }
      return { price: values[Math.floor(values.length/2)] || 0, pu, pm, pd, dx };
    }

    function drawTree(n){
      const { ctx, w, h } = sizeCanvas(canvas);
      ctx.clearRect(0,0,w,h);
      const border=getCss('--border-soft'), accent=getCss('--accent'), accent2=getCss('--accent-2');
      const dt=T/n, dx=sigma*Math.sqrt(3*dt);
      const nShow = Math.min(n, 8);
      for (let step=0; step<=nShow; step++){
        for (let j=-step;j<=step;j++){
          const x = (step/nShow)*w*0.92+w*0.04;
          const y = h/2 - j*(h/2/(nShow+1));
          const S = S0*Math.exp(j*dx);
          if (step<nShow){
            [j-1,j,j+1].forEach(jc => {
              const x2=((step+1)/nShow)*w*0.92+w*0.04, y2=h/2-jc*(h/2/(nShow+1));
              ctx.strokeStyle=border; ctx.lineWidth=1;
              ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
            });
          }
          ctx.fillStyle = S>=K?accent:accent2;
          ctx.beginPath(); ctx.arc(x,y,3.2,0,Math.PI*2); ctx.fill();
        }
      }
      if (n>nShow){ ctx.fillStyle=getCss('--text-dim'); ctx.font='11px monospace'; ctx.fillText(`(showing first ${nShow} of ${n} steps)`,10,h-8); }
    }
    function update(){
      const n = parseInt(nSlider.value,10);
      nVal.textContent = n;
      const { price } = priceTrinomial(n);
      const exact = bsCall(S0,K,r,sigma,T);
      priceOut.textContent = `Trinomial: $${price.toFixed(4)}  |  Exact BS: $${exact.toFixed(4)}  |  error: $${Math.abs(price-exact).toFixed(4)}`;
      drawTree(n);
    }
    nSlider.oninput = update;
    window.addEventListener('resize', update);
    update();
  }
