  /* ========================= RENDER HELPERS ========================= */
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function catMeta(id){ return CATEGORIES.find(c => c.id===id); }

  function buildEquationCard(eq){
    const div = document.createElement('div');
    div.className = 'card eq-lib-card';
    div.dataset.id = eq.id;
    div.dataset.category = eq.category;
    div.dataset.haystack = (
      eq.name + ' ' + catMeta(eq.category).label + ' ' + eq.interpretation + ' ' +
      eq.related.join(' ') + ' ' + eq.vars.map(v=>v[1]).join(' ') + ' ' + (eq.tab||'')
    ).toLowerCase();
    div.style.marginBottom = '12px';

    const varsHtml = eq.vars.map(([sym,def]) =>
      `<div style="display:flex; gap:8px; font-size:12.5px; padding:3px 0;">
        <span class="mono" style="color:var(--accent); min-width:52px;">\\(${sym}\\)</span>
        <span style="color:var(--text-muted);">${def}</span>
      </div>`).join('');

    const relatedHtml = eq.related.map(r => `<span class="pill">${r}</span>`).join('');

    div.innerHTML = `
      <div style="display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px;">
        <h3 style="margin-bottom:0;">${eq.name}</h3>
        <span class="pill mono" style="margin-left:auto; color:var(--accent-2);">${catMeta(eq.category).icon} ${catMeta(eq.category).label}</span>
      </div>
      <div class="eq">${eq.expr}</div>
      <p style="font-size:12.3px; color:var(--text-dim); margin-bottom:6px; font-family:var(--font-mono);">Variables</p>
      <div style="margin-bottom:12px;">${varsHtml}</div>
      <p><strong>Interpretation —</strong> ${eq.interpretation}</p>
      <div class="pill-row" style="margin-top:10px;">${relatedHtml}</div>
      <div style="font-size:11px; color:var(--text-dim); font-family:var(--font-mono); margin-top:10px;">↳ ${eq.tab}</div>
    `;
    return div;
  }

  /* ========================= SEARCH / FILTER LOGIC ========================= */
  let activeCategory = 'all';
  let activeQuery = '';

  function applyFilter(root){
    const cards = root.querySelectorAll('.eq-lib-card');
    let visibleCount = 0;
    const q = activeQuery.trim().toLowerCase();
    cards.forEach(card => {
      const catMatch = activeCategory==='all' || card.dataset.category===activeCategory;
      const qMatch = !q || card.dataset.haystack.includes(q);
      const show = catMatch && qMatch;
      card.style.display = show ? '' : 'none';
      if (show) visibleCount++;
    });

    // hide category section headers with zero visible children
    root.querySelectorAll('.eq-lib-section').forEach(sec => {
      const anyVisible = Array.from(sec.querySelectorAll('.eq-lib-card')).some(c => c.style.display !== 'none');
      sec.style.display = anyVisible ? '' : 'none';
    });

    const countEl = root.querySelector('#eqLibCount');
    if (countEl) countEl.textContent = visibleCount + ' of ' + EQUATIONS.length + ' equations';

    const emptyEl = root.querySelector('#eqLibEmpty');
    if (emptyEl) emptyEl.style.display = visibleCount===0 ? 'block' : 'none';
  }

  function buildCategoryPills(root){
    const bar = root.querySelector('#eqLibCatPills');
    const allBtn = document.createElement('button');
    allBtn.className = 'download-btn asset-btn active';
    allBtn.textContent = '★ All categories';
    allBtn.dataset.cat = 'all';
    bar.appendChild(allBtn);

    CATEGORIES.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'download-btn asset-btn';
      btn.textContent = cat.icon + ' ' + cat.label;
      btn.dataset.cat = cat.id;
      bar.appendChild(btn);
    });

    bar.querySelectorAll('.asset-btn').forEach(btn => {
      btn.onclick = () => {
        activeCategory = btn.dataset.cat;
        bar.querySelectorAll('.asset-btn').forEach(b => b.classList.toggle('active', b===btn));
        applyFilter(root);
      };
    });
  }

  /* ========================= RENDER ========================= */
  function render(root){
    root.innerHTML = `
      <div class="hero">
        <div class="hero-inner">
          <div class="eyebrow">Module 12 · Equation Library</div>
          <h1>Every equation in this lab, in one searchable place</h1>
          <p class="lede">${EQUATIONS.length} equations across ${CATEGORIES.length} categories — each with
          its mathematical expression, variable definitions, financial interpretation, and links to related
          concepts and the tab where it's derived or used. Filter by category or search by name, meaning,
          or related term.</p>
        </div>
      </div>

      <div class="section">
        <div class="card" style="padding:16px 18px; position:sticky; top:130px; z-index:5;">
          <input id="eqLibSearch" type="text" placeholder="Search equations — e.g. 'delta', 'heat kernel', 'risk-neutral', 'vega'..."
            style="width:100%; padding:10px 14px; border-radius:20px; border:1px solid var(--border);
            background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:13.5px; margin-bottom:12px;">
          <div class="pill-row" id="eqLibCatPills"></div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
            <span id="eqLibCount" class="mono" style="font-size:12px; color:var(--text-dim);"></span>
            <button class="download-btn" id="eqLibClear">✕ Clear filters</button>
          </div>
        </div>
      </div>

      <div class="section" id="eqLibResults"></div>

      <div class="card" id="eqLibEmpty" style="display:none; text-align:center; padding:40px;">
        <h3>No equations match your search</h3>
        <p>Try a broader term, or clear filters to see the full library.</p>
      </div>
    `;

    const resultsContainer = root.querySelector('#eqLibResults');

    CATEGORIES.forEach(cat => {
      const eqsInCat = EQUATIONS.filter(e => e.category===cat.id);
      if (!eqsInCat.length) return;
      const section = document.createElement('div');
      section.className = 'eq-lib-section';
      section.style.marginBottom = '30px';
      section.innerHTML = `<div class="section-head"><span class="idx">${cat.icon}</span><h2>${cat.label}</h2>
        <span class="pill mono">${eqsInCat.length} equation${eqsInCat.length>1?'s':''}</span></div>`;
      const grid = document.createElement('div');
      eqsInCat.forEach(eq => grid.appendChild(buildEquationCard(eq)));
      section.appendChild(grid);
      resultsContainer.appendChild(section);
    });

    buildCategoryPills(root);

    const searchInput = root.querySelector('#eqLibSearch');
    searchInput.oninput = () => { activeQuery = searchInput.value; applyFilter(root); };

    root.querySelector('#eqLibClear').onclick = () => {
      activeQuery = ''; activeCategory = 'all';
      searchInput.value = '';
      root.querySelectorAll('.asset-btn').forEach(b => b.classList.toggle('active', b.dataset.cat==='all'));
      applyFilter(root);
    };

    // Typeset once — filtering afterward only toggles visibility, never re-typesets
    BS.typeset();
    applyFilter(root);
  }

  BS.registerModule('library', {
    title:'Equation Library',
    subtitle:'A searchable, filterable reference of every equation used throughout the lab',
    keywords:'equation library search filter stochastic calculus ito calculus black scholes pde heat equation closed form greeks probability binomial monte carlo finite difference volatility hedging risk neutral put call parity discounting',
    built:true,
    render
  });
})();
