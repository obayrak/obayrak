<script>
registerTab({ id:"ddm", num:"06", group:"valuation", label:"Dividend Discount Model", render: renderDDMTab });
function renderDDMTab(el, d, ticker){
  const div0 = d.price * d.divYield/100;
  const ke = DCF_STATE.wacc/100 + 0.015; // rough cost-of-equity proxy above WACC
  const g = 0.03;
  const gordonValue = div0>0 ? (div0*(1+g))/(ke-g) : null;
  el.innerHTML = `
    <div class="section-head"><h3>Dividend Discount Model</h3>
    <p>Values equity as the present value of expected future dividends. Most meaningful for stable, mature dividend payers — see the suitability note below before leaning on this model.</p></div>
    <div class="card">
      <h4>Dividend Snapshot</h4>
      <div class="stat-grid">
        ${statCell("Trailing Dividend Yield", fmtPct(d.divYield))}
        ${statCell("Est. Annual Dividend/Share", d.divYield>0? fmtPx(div0):"—")}
        ${statCell("Assumed Cost of Equity", fmtPct(ke*100))}
        ${statCell("Assumed Long-Run Growth", fmtPct(g*100))}
      </div>
      ${d.divYield<=0 ? `<div class="why-matters"><b>Suitability</b>${d.name} pays little or no dividend — DDM is a poor fit here. Rely on DCF (Tab 05) or Relative Valuation (Tab 07) instead, and treat any DDM output as illustrative only.</div>` : ""}
    </div>
    <div class="card">
      <h4>Model Formulas</h4>
      <div class="mjx-block">$$ P_0 = \\frac{D_1}{r_e - g} \\quad \\text{(single-stage Gordon Growth)} $$</div>
      <div class="mjx-block">$$ P_0 = \\sum_{t=1}^{n} \\frac{D_t}{(1+r_e)^t} + \\frac{D_{n+1}}{(r_e-g_{\\infty})(1+r_e)^n} \\quad \\text{(multi-stage)} $$</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Symbols</span><span class="t">What each symbol in the equations means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>P<sub>0</sub></b> — the estimated fair value of one share today (time zero).</div>
          <div class="term"><b>D<sub>1</sub></b> — the dividend per share expected one year from now.</div>
          <div class="term"><b>D<sub>t</sub></b> — the dividend per share expected in year t during the explicit multi-stage forecast.</div>
          <div class="term"><b>D<sub>n+1</sub></b> — the first dividend of the stable, terminal growth phase, right after the explicit forecast ends.</div>
          <div class="term"><b>r<sub>e</sub></b> — the cost of equity; the annual return shareholders require for the risk of owning the stock.</div>
          <div class="term"><b>g</b> — the assumed constant dividend growth rate used in the single-stage version.</div>
          <div class="term"><b>g<sub>∞</sub></b> — the terminal (perpetual) dividend growth rate assumed after the multi-stage forecast ends.</div>
          <div class="term"><b>t / n</b> — t is the year being discounted; n is the number of years in the explicit forecast before the terminal phase.</div>
        </div>
      </div>
      ${gordonValue? `<div class="stat-grid"><div class="stat-cell"><div class="lbl">Single-Stage Gordon Value</div><div class="val">${fmtPx(gordonValue)}</div></div></div>` : ""}
    </div>
    <div class="placeholder-module">
      <div class="stamp">Scaffold Ready</div>
      <div>Two-stage &amp; three-stage builds, payout ratio and dividend-coverage trend, yield history chart, and a growth-rate sensitivity grid can each be patched into this module independently.</div>
    </div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">Understanding the Dividend Discount Model</span></div>
      <h5>What it's doing</h5>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">The DDM says a share is worth exactly the present value of every dividend it will ever pay you. It's the oldest formal valuation model, dating back to John Burr Williams and later popularized as the "Gordon Growth Model."</p>
      <div class="vx-grid">
        <div class="vx-cell"><b>D₁ (Next Dividend)</b>The dividend per share expected one year from now — the starting cash flow the model discounts.</div>
        <div class="vx-cell"><b>rₑ (Cost of Equity)</b>The annual return shareholders demand for the risk of owning the stock — always higher than the cost of debt, since equity holders are paid last.</div>
        <div class="vx-cell"><b>g (Dividend Growth Rate)</b>How fast the dividend is assumed to grow forever. Must stay below rₑ, or the formula produces a nonsensical (negative or infinite) value.</div>
        <div class="vx-cell"><b>Single-stage vs. multi-stage</b>Single-stage assumes one constant growth rate forever — fine for a mature utility. Multi-stage lets growth start higher and fade toward a lower, sustainable rate — better for companies still growing quickly.</div>
      </div>
      <h5 style="margin-top:12px;">When to trust it</h5>
      <ol>
        <li>Best suited to mature, stable dividend payers with a long payment history (utilities, consumer staples, large banks).</li>
        <li>Weak or meaningless for non-dividend payers or high-growth companies — use DCF (Tab 05) instead.</li>
        <li>Always check that assumed growth is realistic and sits comfortably below the cost of equity.</li>
      </ol>
    </div>
  `;
}
</script>
<!-- MODULE:TAB_06_DDM:END -->

<!-- MODULE:TAB_07_RELATIVE:START -->
<script>
registerTab({ id:"relative", num:"07", group:"valuation", label:"Relative Valuation", render: renderRelativeTab });
function renderRelativeTab(el, d, ticker){
  const f = d.fin; const last = f.years.length-1;
  const pe = d.price/f.eps[last];
  const evEbitda = (d.ev*1000)/f.ebitda[last];
  const evSales = (d.ev*1000)/f.revenue[last];
  const pb = (d.mcap*1000)/f.equity[last];
  const pfcf = (d.mcap*1000)/Math.max(f.fcf[last],1);
  // synthetic sector-average comparison band (± around the company's own multiple, seeded so it's stable)
  const rnd = seededRand(hashSeed(ticker+"peer"));
  const peerAvgPE = pe*(0.85+rnd()*0.3);
  const peerAvgEvEbitda = evEbitda*(0.85+rnd()*0.3);
  const peerAvgPS = evSales*(0.85+rnd()*0.3);
  const premPE = pctChange(pe, peerAvgPE);
  el.innerHTML = `
    <div class="section-head"><h3>Relative Valuation</h3>
    <p>Benchmarks ${d.name} against an approximate peer/sector average multiple. Peer averages here are illustrative (seeded synthetically); wire in a real peer set from a screener for production use.</p></div>
    <div class="card">
      <h4>Multiples vs. Peer Average</h4>
      <table class="data-table">
        <thead><tr><th style="text-align:left;">Metric</th><th>${ticker}</th><th>Peer Avg (approx.)</th><th>Premium/Discount</th></tr></thead>
        <tbody>
          <tr><td class="lbl">P/E</td><td>${fmtNum(pe)}x</td><td>${fmtNum(peerAvgPE)}x</td><td>${fmtPct(premPE)}</td></tr>
          <tr><td class="lbl">EV/EBITDA</td><td>${fmtNum(evEbitda)}x</td><td>${fmtNum(peerAvgEvEbitda)}x</td><td>${fmtPct(pctChange(evEbitda,peerAvgEvEbitda))}</td></tr>
          <tr><td class="lbl">EV/Sales</td><td>${fmtNum(evSales)}x</td><td>${fmtNum(peerAvgPS)}x</td><td>${fmtPct(pctChange(evSales,peerAvgPS))}</td></tr>
          <tr><td class="lbl">Price/Book</td><td>${fmtNum(pb)}x</td><td>—</td><td>—</td></tr>
          <tr><td class="lbl">Price/FCF</td><td>${fmtNum(pfcf)}x</td><td>—</td><td>—</td></tr>
          <tr><td class="lbl">Dividend Yield</td><td>${fmtPct(d.divYield)}</td><td>—</td><td>—</td></tr>
        </tbody>
      </table>
      <div class="pin"><span class="mark">i</span><div>A persistent premium can reflect superior growth/ROIC (justified) or simple market euphoria (unjustified) — cross-check against Tab 04's growth quality before concluding either way.</div></div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">What each multiple means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>P/E</b> — Price ÷ Earnings per share. How many years of current earnings you're paying for. <span class="f">The most common multiple, but distorted by one-off items and differences in leverage or accounting.</span></div>
          <div class="term"><b>EV/EBITDA</b> — Enterprise Value ÷ EBITDA. Similar idea to P/E, but capital-structure neutral (uses EV, which includes debt) and before D&amp;A. <span class="f">Better for comparing companies with different debt loads or depreciation policies.</span></div>
          <div class="term"><b>EV/Sales</b> — Enterprise Value ÷ Revenue. Useful when a company has little or no profit yet. <span class="f">Says nothing about profitability on its own — always pair with a margin metric.</span></div>
          <div class="term"><b>Price/Book</b> — Market cap ÷ book (accounting) equity. What you pay per dollar of net assets on the balance sheet. <span class="f">More relevant for asset-heavy businesses like banks than for asset-light software companies.</span></div>
          <div class="term"><b>Price/FCF</b> — Market cap ÷ free cash flow. Like P/E, but based on cash generated rather than accounting profit. <span class="f">Harder to manipulate with non-cash accounting choices.</span></div>
        </div>
      </div>
    </div>
    <div class="placeholder-module">
      <div class="stamp">Scaffold Ready</div>
      <div>Radar chart across all multiples, historical valuation-band chart (5Y P/E range), and a real named-peer table (with PEG) can be added once a peer list is supplied per sector.</div>
    </div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">Understanding Relative Valuation</span></div>
      <h5>What it's doing</h5>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">Instead of estimating intrinsic value from scratch, relative valuation asks: "what is the market currently paying for similar companies, and does this one deserve to trade above, below, or in line with them?" It's a comparison exercise, not an independent valuation.</p>
      <h5 style="margin-top:12px;">How to use it well</h5>
      <ol>
        <li>Choose peers that genuinely compete for the same customers, capital, and growth opportunities — comparing across unrelated sectors is misleading.</li>
        <li>A premium or discount to peers must be justified qualitatively (better growth, moat, margins) — a cheap multiple isn't automatically a "buy," it can simply be cheap for a reason.</li>
        <li>Use this alongside an intrinsic method (DCF, Residual Income) rather than instead of one — relative valuation can be wrong in the same direction as the whole market (a bubble looks "fairly valued" relative to equally bubbly peers).</li>
      </ol>
    </div>
  `;
}
</script>
<!-- MODULE:TAB_07_RELATIVE:END -->

<!-- MODULE:TAB_08_RESIDUAL:START -->
<script>
registerTab({ id:"residual", num:"08", group:"valuation", label:"Residual Income Model", render: renderResidualTab });
function renderResidualTab(el, d, ticker){
  const f = d.fin; const last = f.years.length-1;
  const bvps = f.equity[last]/(d.shares*1000);
  const roe = f.netIncome[last]/f.equity[last];
  const ke = DCF_STATE.wacc/100 + 0.015;
  const ri1 = bvps*(roe-ke);
  const g = 0.02;
  const value = ri1>0 ? bvps + ri1/(ke-g) : bvps;
  el.innerHTML = `
    <div class="section-head"><h3>Residual Income Model</h3>
    <p>Values equity as current book value plus the present value of future "residual" (economic) income the firm earns above its cost of equity.</p></div>
    <div class="card">
      <h4>Formula &amp; Derivation</h4>
      <div class="mjx-block">$$ RI_t = NI_t - r_e \\times BV_{t-1} \\qquad V_0 = BV_0 + \\sum_{t=1}^{\\infty} \\frac{RI_t}{(1+r_e)^t} $$</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Symbols</span><span class="t">What each symbol in the equation means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>RI<sub>t</sub></b> — Residual Income in year t; the profit earned above what shareholders required for that year.</div>
          <div class="term"><b>NI<sub>t</sub></b> — Net Income in year t.</div>
          <div class="term"><b>r<sub>e</sub></b> — the cost of equity; the annual return shareholders require for the risk of owning the stock.</div>
          <div class="term"><b>BV<sub>t-1</sub></b> — Book Value of equity at the <i>start</i> of year t (i.e., the end of year t-1) — the capital base shareholders had "at work" that year.</div>
          <div class="term"><b>V<sub>0</sub></b> — the estimated intrinsic value of equity today.</div>
          <div class="term"><b>BV<sub>0</sub></b> — today's book value of equity, the model's known starting point.</div>
          <div class="term"><b>t</b> — the year being discounted, summed here all the way to infinity (in practice, truncated with a terminal growth assumption after a set horizon).</div>
        </div>
      </div>
      <div class="pin"><span class="mark">i</span><div>If <b>ROE = cost of equity</b>, residual income is zero and the stock should trade near book value. Persistent ROE above cost of equity is what justifies trading above book (Price/Book &gt; 1).</div></div>
    </div>
    <div class="card">
      <h4>Current Estimate</h4>
      <div class="stat-grid">
        ${statCell("Book Value / Share", fmtPx(bvps))}
        ${statCell("ROE (TTM)", fmtPct(roe*100))}
        ${statCell("Cost of Equity (est.)", fmtPct(ke*100))}
        ${statCell("Yr-1 Residual Income/Share", fmtPx(ri1))}
        ${statCell("Estimated Intrinsic Value", fmtPx(value))}
      </div>
    </div>
    <div class="placeholder-module"><div class="stamp">Scaffold Ready</div><div>Multi-year residual income projection table and a WACC/fade-rate sensitivity grid can be patched in next.</div></div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">Understanding the Residual Income Model</span></div>
      <h5>What it's doing</h5>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">This model starts from something concrete and already known — book value (net assets on the balance sheet) — and adds only the value of "excess" profit the company is expected to earn above what shareholders require. It answers: how much value has management created beyond simply holding the assets?</p>
      <div class="vx-grid">
        <div class="vx-cell"><b>Residual Income (RI)</b>Net income minus a charge for using shareholders' capital (cost of equity × prior book value). It's the profit left over after shareholders are "paid" for the opportunity cost of their capital.</div>
        <div class="vx-cell"><b>Book Value (BV)</b>Total shareholders' equity — assets minus liabilities. The model's starting point, since it's directly observable rather than estimated.</div>
      </div>
      <h5 style="margin-top:12px;">Why it's useful</h5>
      <ol>
        <li>Less sensitive to terminal-value assumptions than a DCF, since most of the value sits in the known starting book value rather than a distant lump sum.</li>
        <li>Works well for banks, insurers, and other businesses where book value is meaningful and earnings can be volatile.</li>
        <li>Weak fit for asset-light, high-growth companies where book value understates the real economic assets (like brand or software).</li>
      </ol>
    </div>
  `;
}
</script>
<!-- MODULE:TAB_08_RESIDUAL:END -->

<script>
registerTab({ id:"asset", num:"09", group:"valuation", label:"Asset-Based Valuation", render: renderAssetTab });
function renderAssetTab(el, d, ticker){
  const f = d.fin; const last = f.years.length-1;
  const bv = f.equity[last];
  const adjBv = bv*1.08; // illustrative markup for off-balance-sheet/intangible adjustments

  el.innerHTML = `
    <div class="section-head"><h3>Asset-Based Valuation</h3>
    <p>Values the company from its balance sheet rather than its earnings power — most relevant for banks, insurers, industrials, real estate, and distressed situations where liquidation value is a realistic floor.</p></div>
    <div class="card">
      <h4>Asset-Based Estimates</h4>
      <div class="stat-grid">
        ${statCell("Book Value", fmtBil(bv/1000))}
        ${statCell("Adjusted Book Value (est.)", fmtBil(adjBv/1000))}
        ${statCell("Net Asset Value (est.)", fmtBil(nav/1000))}
        ${statCell("Liquidation Value (est.)", fmtBil(Math.max(liquidation,0)/1000))}
        ${statCell("Book Value / Share", fmtPx(perShareBV))}
      </div>
      <div class="why-matters"><b>Suitability for ${d.sector}</b>${["Financial Services","Industrials","Materials","Real Estate"].includes(d.sector) ? "This sector is typically asset-heavy, so asset-based methods carry real weight alongside DCF." : "This sector tends to be asset-light — treat asset-based figures as a conservative floor, not a primary valuation anchor."}</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">What each asset-based estimate means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>Book Value</b> — Total assets minus total liabilities, straight from the balance sheet. <span class="f">The accounting "net worth" of the company.</span></div>
          <div class="term"><b>Adjusted Book Value</b> — Book value adjusted to better reflect real economic worth (e.g., marking real estate or securities to current market prices instead of historical cost). <span class="f">Closer to what assets would actually fetch today.</span></div>
          <div class="term"><b>Net Asset Value (NAV)</b> — Similar to adjusted book value; commonly used for holding companies, REITs, and funds whose worth is best measured by the sum of what they own.</div>
          <div class="term"><b>Liquidation Value</b> — An estimate of what would be left for shareholders if the company sold everything quickly and paid off all liabilities. <span class="f">Usually the most conservative estimate, since a forced/quick sale rarely fetches full value.</span></div>
        </div>
      </div>
    </div>
    <div class="placeholder-module"><div class="stamp">Scaffold Ready</div><div>Visual balance-sheet waterfall and per-line replacement-cost adjustments can be added once fixed-asset detail (PP&amp;E schedules) is available.</div></div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">Understanding Asset-Based Valuation</span></div>
      <h5>What it's doing</h5>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">Instead of valuing a company by what it can <i>earn</i>, this approach values it by what it <i>owns</i> — useful when earnings are unreliable, negative, or simply less important than the underlying assets (banks, insurers, real estate, or a company in financial distress).</p>
      <h5 style="margin-top:12px;">When it's most useful</h5>
      <ol>
        <li>Provides a "floor" valuation — a sense of what shareholders might recover even in a worst-case wind-down scenario.</li>
        <li>Most reliable for asset-heavy, tangible-asset businesses; least reliable for asset-light businesses whose real value sits in brand, software, or people (which don't show up on the balance sheet).</li>
        <li>Should be used alongside — never instead of — an earnings-power method like DCF (Tab 05) for a going-concern business.</li>
      </ol>
    </div>
  `;
}
</script>

<script>
registerTab({ id:"graham", num:"10", group:"valuation", label:"Graham Valuation", render: renderGrahamTab });
function renderGrahamTab(el, d, ticker){
  const f = d.fin; const last = f.years.length-1;
  const bvps = f.equity[last]/(d.shares*1000);
  const grahamNumber = Math.sqrt(22.5 * f.eps[last] * bvps);
  const marginOfSafety = pctChange(grahamNumber, d.price);
  el.innerHTML = `
    <div class="section-head"><h3>Graham Valuation</h3>
    <p>Benjamin Graham's conservative, formula-based approach to bounding intrinsic value — designed for defensive investors, not growth stocks with negative earnings or no tangible book value.</p></div>
    <div class="card">
      <h4>Graham Number</h4>
      <div class="mjx-block">$$ \\text{Graham Number} = \\sqrt{22.5 \\times EPS \\times BVPS} $$</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Symbols</span><span class="t">What each symbol in the equation means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>EPS</b> — Earnings Per Share; net income ÷ diluted shares outstanding.</div>
          <div class="term"><b>BVPS</b> — Book Value Per Share; shareholders' equity ÷ shares outstanding.</div>
          <div class="term"><b>22.5</b> — a fixed constant, not a variable; equal to Graham's ceiling of 15× earnings multiplied by his ceiling of 1.5× book value (15 × 1.5 = 22.5).</div>
        </div>
      </div>
      <div class="pin"><span class="mark">i</span><div>The constant 22.5 caps the implied P/E at 15x and Price/Book at 1.5x simultaneously (15 × 1.5 = 22.5) — Graham's ceiling for a "defensive" purchase.</div></div>
      <div class="stat-grid">
        ${statCell("EPS (TTM)", "$"+f.eps[last].toFixed(2))}
        ${statCell("Book Value/Share", fmtPx(bvps))}
        ${statCell("Graham Number", fmtPx(grahamNumber))}
        ${statCell("Current Price", fmtPx(d.price))}
        ${statCell("Margin of Safety", fmtPct(marginOfSafety))}
      </div>
      ${(f.eps[last]<=0 || bvps<=0) ? `<div class="why-matters"><b>Not applicable</b>Graham's formula requires positive earnings and book value; at least one is non-positive here, so treat this output as not meaningful.</div>` : ""}
    </div>
    <div class="placeholder-module"><div class="stamp">Scaffold Ready</div><div>Historical Graham-number trend chart and a side-by-side comparison strip against the Tab 05 DCF output can be added next.</div></div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">Understanding the Graham Number</span></div>
      <h5>What it's doing</h5>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">Benjamin Graham — Warren Buffett's teacher and the father of value investing — designed this as a simple, conservative ceiling on what a "defensive" (risk-averse) investor should pay for a stock, using only two inputs: earnings and book value.</p>
      <div class="vx-grid">
        <div class="vx-cell"><b>EPS (Earnings Per Share)</b>Net income divided by diluted shares outstanding — the profit attributable to each share.</div>
        <div class="vx-cell"><b>BVPS (Book Value Per Share)</b>Shareholders' equity divided by shares outstanding — the accounting net worth per share.</div>
        <div class="vx-cell"><b>The Constant 22.5</b>Derived from Graham's two personal rules of thumb: never pay more than 15× earnings, and never more than 1.5× book value. Multiplying those caps (15 × 1.5) gives 22.5.</div>
        <div class="vx-cell"><b>Margin of Safety</b>The gap between the Graham Number and the market price — Graham's core philosophy was to only buy with a large cushion against being wrong.</div>
      </div>
      <h5 style="margin-top:12px;">Limitations</h5>
      <ol>
        <li>Deliberately conservative — it will flag almost every high-growth or high-multiple stock as "overvalued," even good ones.</li>
        <li>Not meaningful for companies with negative earnings or negative book value.</li>
        <li>Best treated as one more data point in the Comparison tab (Tab 13), not a standalone verdict.</li>
      </ol>
    </div>
  `;
}
</script>
<!-- MODULE:TAB_10_GRAHAM:END -->

<script>
registerTab({ id:"reversedcf", num:"11", group:"valuation", label:"Reverse DCF", render: renderReverseDCFTab });
function solveImpliedGrowth(d){
  const f = d.fin; const wacc = DCF_STATE.wacc/100; const term = DCF_STATE.termGrowth/100;
  const targetEquity = d.mcap*1000 + f.debt[f.debt.length-1] - f.cash[f.cash.length-1];
  const baseFCF = f.fcf[f.fcf.length-1];
  let lo=-0.10, hi=0.40;
  for(let iter=0; iter<60; iter++){
    const g = (lo+hi)/2;
    let cf = baseFCF, pvSum=0;
    for(let t=1;t<=5;t++){ cf = cf*(1+g); pvSum += cf/Math.pow(1+wacc,t); }
    const tv = cf*(1+term)/(wacc-term);
    const ev = pvSum + tv/Math.pow(1+wacc,5);
    if (ev > targetEquity) hi=g; else lo=g;
  }
  return (lo+hi)/2*100;
}
function renderReverseDCFTab(el, d, ticker){
  const impliedG = solveImpliedGrowth(d);
  const f = d.fin; const histCagr = cagr(f.fcf[0]>0?f.fcf[0]:1, f.fcf[f.fcf.length-1]>0?f.fcf[f.fcf.length-1]:1, f.fcf.length-1);
  el.innerHTML = `
    <div class="section-head"><h3>Reverse DCF — Market-Implied Expectations</h3>
    <p>Instead of assuming a growth rate to find fair value, this flips the DCF around: it solves for the 5-year FCF growth rate that today's market price already implies, at the WACC and terminal growth set in Tab 05.</p></div>
    <div class="card">
      <h4>Implied vs. Historical Growth</h4>
      <div class="stat-grid">
        ${statCell("Market-Implied 5Y FCF Growth", fmtPct(impliedG))}
        ${statCell("Historical FCF CAGR", fmtPct(histCagr))}
        ${statCell("WACC used", fmtPct(DCF_STATE.wacc))}
        ${statCell("Terminal Growth used", fmtPct(DCF_STATE.termGrowth))}
      </div>
      <div class="why-matters"><b>Reading it</b>${impliedG > histCagr+3 ? "The market is pricing in meaningfully faster growth than the company has historically delivered — a demanding bar." : impliedG < histCagr-3 ? "The market is pricing in slower growth than the company's own history — potentially a conservative, de-risked expectation." : "The implied growth rate is broadly in line with historical performance — the market isn't obviously pricing in a big acceleration or deceleration."}</div>
      <div class="pin"><span class="mark">i</span><div>This reveals <b>market expectations</b>, not intrinsic value — it answers "what does the crowd believe?" rather than "what is it actually worth?"</div></div>
    </div>
    <div class="placeholder-module"><div class="stamp">Scaffold Ready</div><div>Solve separately for implied terminal growth and implied margin, and chart the implied-growth trend over the last several quarters, once historical price series are wired in.</div></div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">Understanding Reverse DCF</span></div>
      <h5>What it's doing</h5>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">A normal DCF asks "if I assume this growth rate, what is the stock worth?" A Reverse DCF flips the question: "given today's actual market price, what growth rate must investors already be assuming?" It uses the same math engine as Tab 05, just solved backward.</p>
      <div class="vx-grid">
        <div class="vx-cell"><b>Market-Implied Growth</b>The FCF growth rate that, plugged into the DCF formula, produces today's exact market price. A useful gut-check on how demanding the market's expectations really are.</div>
        <div class="vx-cell"><b>Why it's different from an opinion</b>It removes your own growth assumption from the equation entirely — instead it tells you the market's assumption, which you can then judge as reasonable or not based on the company's history and industry.</div>
      </div>
      <h5 style="margin-top:12px;">How to use it</h5>
      <ol>
        <li>Compare the implied growth rate to the company's own historical CAGR (Tab 04) — a big gap either way is worth investigating before trusting the market price.</li>
        <li>This measures sentiment/expectations, not "fair value" — a stock can have demanding implied growth and still be a reasonable buy if you believe the company will actually deliver it.</li>
      </ol>
    </div>
  `;
}
</script>
<!-- MODULE:TAB_11_REVERSE_DCF:END -->

<script>
registerTab({ id:"sensitivity", num:"12", group:"valuation", label:"Sensitivity Analysis", render: renderSensitivityTab });
function renderSensitivityTab(el, d, ticker){
  const waccRange = [DCF_STATE.wacc-2, DCF_STATE.wacc-1, DCF_STATE.wacc, DCF_STATE.wacc+1, DCF_STATE.wacc+2];
  const growthRange = [DCF_STATE.growth-8, DCF_STATE.growth-4, DCF_STATE.growth, DCF_STATE.growth+4, DCF_STATE.growth+8];
  const grid = growthRange.map(g => waccRange.map(w => {
    const r = computeDCF(d, Object.assign({}, DCF_STATE, {growth:g, wacc:w}));
    return r.perShare;
  }));
  const flat = grid.flat();
  const minV = Math.min(...flat), maxV = Math.max(...flat);
  function cellColor(v){
    const t = (v-minV)/((maxV-minV)||1);
    // interpolate negative(coral) -> accent(gold) -> positive(teal)
    const c1=[217,105,79], c2=[212,162,74], c3=[69,176,140];
    let c;
    if (t<0.5){ const k=t/0.5; c=c1.map((v0,i)=>Math.round(v0+(c2[i]-v0)*k)); } else { const k=(t-0.5)/0.5; c=c2.map((v0,i)=>Math.round(v0+(c3[i]-v0)*k)); }
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  el.innerHTML = `
    <div class="section-head"><h3>Sensitivity Analysis</h3>
    <p>Intrinsic value per share (from the Tab 05 DCF engine) across a grid of WACC and Year-1 FCF growth assumptions. Centered on the current Tab 05 assumptions — change them there and revisit this tab.</p></div>
    <div class="card">
      <h4>Growth Rate vs. WACC — Intrinsic Value / Share</h4>
      <table class="data-table" style="text-align:center;">
        <thead><tr><th style="text-align:left;">Growth ↓ / WACC →</th>${waccRange.map(w=>`<th>${w.toFixed(1)}%</th>`).join("")}</tr></thead>
        <tbody>
          ${growthRange.map((g,gi)=>`<tr><td class="lbl">${g.toFixed(1)}%</td>${waccRange.map((w,wi)=>`<td style="background:${cellColor(grid[gi][wi])}; color:#181008; font-weight:600;">${fmtPx(grid[gi][wi])}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table>
      <div class="pin"><span class="mark">i</span><div>Current market price is <b>${fmtPx(d.price)}</b> — cells shaded toward teal imply meaningful undervaluation at that assumption pair; coral implies overvaluation.</div></div>
    </div>
    <div class="placeholder-module"><div class="stamp">Scaffold Ready</div><div>Additional grids (Terminal Growth × Discount Rate, Operating Margin × Growth, FCF Margin × WACC) and a 3D sensitivity surface can reuse the same <span class="mono">computeDCF()</span> engine — just swap which two parameters vary.</div></div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">Understanding Sensitivity Analysis</span></div>
      <h5>What it's doing</h5>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">No DCF assumption is known with certainty — WACC and growth are estimates, not facts. A sensitivity table (sometimes called a "data table" or "two-way sensitivity grid") recalculates the model's output across a range of plausible values for two inputs at once, so you can see how fragile — or robust — the valuation really is.</p>
      <h5 style="margin-top:12px;">Why this matters</h5>
      <ol>
        <li>If the intrinsic value swings wildly across the grid, the valuation is highly assumption-dependent — treat any single-point answer with real caution.</li>
        <li>If most of the grid still implies meaningful upside (or downside) versus the market price, that's a more resilient conclusion than a single DCF run.</li>
        <li>This is a core habit of professional equity research: never present one number without also showing how sensitive it is to the inputs that produced it.</li>
      </ol>
    </div>
  `;
}
</script>
<!-- MODULE:TAB_12_SENSITIVITY:END -->

<script>
registerTab({ id:"comparison", num:"13", group:"synthesis", label:"Valuation Comparison", render: renderComparisonTab });

function gatherValuations(d, ticker){
  const f = d.fin; const last = f.years.length-1;
  const dcf = computeDCF(d, DCF_STATE);
  const bvps = f.equity[last]/(d.shares*1000);
  const roe = f.netIncome[last]/f.equity[last];
  const ke = DCF_STATE.wacc/100 + 0.015;
  const ri1 = bvps*(roe-ke); const g2=0.02;
  const residual = ri1>0 ? bvps + ri1/(ke-g2) : bvps;
  const grahamNumber = (f.eps[last]>0 && bvps>0) ? Math.sqrt(22.5*f.eps[last]*bvps) : null;
  const rnd = seededRand(hashSeed(ticker+"peer"));
  const peerPE = (d.price/f.eps[last])*(0.85+rnd()*0.3);
  const relValue = peerPE*f.eps[last];
  const div0 = d.price*d.divYield/100;
  const ddmValue = div0>0 ? (div0*1.03)/(ke-0.03) : null;
  const nav = f.equity[last]*1.02/(d.shares*1000);

  return [
    {method:"DCF (FCFF, Gordon)", value:dcf.perShare, use:"Mature, predictable cash flows"},
    {method:"Residual Income", value:residual, use:"Strong ROE / book-value driven"},
    {method:"Relative (P/E vs peers)", value:relValue, use:"Large peer group available"},
    {method:"Graham Number", value:grahamNumber, use:"Conservative defensive benchmark"},
    {method:"Dividend Discount (Gordon)", value:ddmValue, use:"Stable dividend payer"},
    {method:"Net Asset Value (approx.)", value:nav, use:"Asset-intensive businesses"}
  ].filter(v=>v.value && !isNaN(v.value) && v.value>0);
}

function renderComparisonTab(el, d, ticker){
  const rows = gatherValuations(d, ticker);
  const values = rows.map(r=>r.value);
  const mean = values.reduce((a,b)=>a+b,0)/values.length;
  const sorted = [...values].sort((a,b)=>a-b);
  const median = sorted.length%2 ? sorted[(sorted.length-1)/2] : (sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
  const std = Math.sqrt(values.reduce((s,v)=>s+Math.pow(v-mean,2),0)/values.length);
  const cov = std/mean*100;

  el.innerHTML = `
    <div class="section-head"><h3>Comprehensive Valuation Model Comparison</h3>
    <p>Pulls the intrinsic-value output from every model currently implemented and lines them up side by side, with basic summary statistics and a simple equal-weighted composite.</p></div>

    <div class="card">
      <h4>Model Comparison Table</h4>
      <table class="data-table">
        <thead><tr><th style="text-align:left;">Valuation Method</th><th>Intrinsic Value</th><th>Premium/Discount to Market</th><th style="text-align:left;">Best Use Case</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr><td class="lbl">${r.method}</td><td>${fmtPx(r.value)}</td><td>${fmtPct(pctChange(r.value,d.price))}</td><td class="lbl" style="text-align:left; color:var(--text-2); font-family:var(--sans); font-size:12px;">${r.use}</td></tr>`).join("")}
          <tr style="border-top:2px solid var(--border);"><td class="lbl">Current Market Price</td><td>${fmtPx(d.price)}</td><td>—</td><td></td></tr>
        </tbody>
      </table>
    </div>

    <div class="grid-2">
      <div class="card">
        <h4>Statistical Comparison</h4>
        <div class="stat-grid">
          ${statCell("Mean Fair Value", fmtPx(mean))}
          ${statCell("Median Fair Value", fmtPx(median))}
          ${statCell("Std. Deviation", fmtPx(std))}
          ${statCell("Coefficient of Variation", fmtPct(cov))}
          ${statCell("Lowest Model", fmtPx(sorted[0]))}
          ${statCell("Highest Model", fmtPx(sorted[sorted.length-1]))}
        </div>
        <div class="why-matters"><b>Reading dispersion</b>A low coefficient of variation (roughly under 15–20%) means the models broadly agree; above that, dig into which assumption (growth, WACC, peer multiple) is driving the outlier.</div>
        <div class="edu-box">
          <div class="edu-head"><span class="cap">Learn It</span><span class="t">The statistics, explained</span></div>
          <div class="edu-glossary">
            <div class="term"><b>Mean</b> — The simple average of every model's fair value estimate. <span class="f">Easy to compute but sensitive to one extreme outlier model.</span></div>
            <div class="term"><b>Median</b> — The middle value once all estimates are sorted. <span class="f">More robust than the mean when one model produces an unusually high or low number.</span></div>
            <div class="term"><b>Standard Deviation</b> — How much, on average, the individual model estimates differ from the mean. <span class="f">A larger number means the models disagree more.</span></div>
            <div class="term"><b>Coefficient of Variation</b> — Standard deviation ÷ mean, expressed as a %. <span class="f">Standardizes dispersion so it can be compared across companies of very different price levels.</span></div>
          </div>
        </div>
      </div>
      <div class="card">
        <h4>Equal-Weighted Composite &amp; Rating</h4>
        <div class="canvas-wrap"><canvas id="comp-bar-chart" data-h="220"></canvas></div>
        <div class="stat-grid" style="margin-top:10px;">
          ${statCell("Weighted Fair Value (equal wt.)", fmtPx(mean))}
          ${statCell("Upside vs. Market", fmtPct(pctChange(mean,d.price)))}
        </div>
      </div>
    </div>
    <div class="placeholder-module"><div class="stamp">Scaffold Ready</div><div>Custom per-model weight sliders (must sum to 100%), a radar/box-plot dispersion view, and an agreement/outlier detector can be added on top of the <span class="mono">gatherValuations()</span> data already assembled here.</div></div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">Understanding the Comparison &amp; Composite</span></div>
      <h5>What it's doing</h5>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">No single valuation model is "correct" — each one makes different assumptions and shines under different circumstances (see the "Best Use Case" column above). This tab treats each applicable model as one independent vote, then blends them into a single composite view.</p>
      <h5 style="margin-top:12px;">How to use it</h5>
      <ol>
        <li>Look for <b>convergence</b> — when most models land in a similar range, that's a more trustworthy signal than any one model alone.</li>
        <li>Investigate <b>divergence</b> — if one model is a clear outlier, understand why (e.g., DDM breaks down for non-dividend payers, Graham breaks down for negative earnings) before discounting or trusting it.</li>
        <li>An equal-weighted average is a reasonable starting point, but professional analysts often weight models by relevance to the specific company (e.g., heavier weight on DCF for a mature cash-generator, heavier weight on Relative Valuation in a fast-moving sector with abundant peers).</li>
      </ol>
    </div>
  `;
  drawBars(document.getElementById('comp-bar-chart'), rows.map(r=>r.method.split(" ")[0]),
    [{name:"Intrinsic Value ($/sh)", color:css('--accent'), values:values}], {yFmt:(v)=>"$"+v.toFixed(0)});
}

<script>
registerTab({ id:"risk", num:"15", group:"technical", label:"Risk Analysis", render: renderRiskTab });

function computeAltmanZ(d){
  const f = d.fin; const last = f.years.length-1;
  const wc = (f.assets[last]-f.liabilities[last])*0.35; // proxy for net working capital
  const ta = f.assets[last];
  const re = f.equity[last]*0.6; // proxy retained earnings
  const ebit = f.opIncome[last];
  const mve = d.mcap*1000;
  const tl = f.liabilities[last];
  const sales = f.revenue[last];
  const z = 1.2*(wc/ta) + 1.4*(re/ta) + 3.3*(ebit/ta) + 0.6*(mve/tl) + 1.0*(sales/ta);
  return z;
}
function computePiotroski(d){
  const f = d.fin; const n = f.years.length; const last=n-1, prev=n-2;
  let score = 0;
  if (f.netIncome[last]>0) score++;
  if (f.ocf[last]>0) score++;
  if (f.netIncome[last]/f.assets[last] > f.netIncome[prev]/f.assets[prev]) score++;
  if (f.ocf[last] > f.netIncome[last]) score++;
  if (f.debt[last]/f.equity[last] < f.debt[prev]/f.equity[prev]) score++;
  if ((f.assets[last]-f.liabilities[last])/f.assets[last] > 0) score++; // simplistic current-ratio proxy
  if (f.grossProfit ? (f.grossProfit[last]/f.revenue[last] > f.grossProfit[prev]/f.revenue[prev]) : false) score++;
  if (f.revenue[last]/f.assets[last] > f.revenue[prev]/f.assets[prev]) score++;
  score += 1; // shares outstanding assumed flat/no dilution in this sample dataset
  return Math.min(score,9);
}

function renderRiskTab(el, d, ticker){
  const z = computeAltmanZ(d);
  const zZone = z>2.99 ? "Safe Zone" : z>1.81 ? "Grey Zone" : "Distress Zone";
  const zClass = z>2.99? "buy" : z>1.81? "hold" : "sell";
  const f = computePiotroski(d);
  const debtEbitda = d.fin.debt[d.fin.debt.length-1]/d.fin.ebitda[d.fin.ebitda.length-1];

  el.innerHTML = `
    <div class="section-head"><h3>Risk Analysis</h3>
    <p>Credit-quality and distress screens (Altman Z-score, Piotroski F-score), plus a qualitative scan across financial, operating and market risk factors.</p></div>

    <div class="grid-2">
      <div class="card" style="text-align:center;">
        <h4>Altman Z-Score</h4>
        <div style="font-family:var(--serif); font-size:44px; font-weight:700; color:var(--accent);">${z.toFixed(2)}</div>
        <span class="badge-pill ${zClass}">${zZone}</span>
        <div class="mjx-block" style="margin-top:10px;">$$ Z = 1.2X_1+1.4X_2+3.3X_3+0.6X_4+1.0X_5 $$</div>
        <div class="pin"><span class="mark">i</span><div>Z &gt; 2.99 = low bankruptcy risk (Safe); 1.81–2.99 = Grey Zone; &lt; 1.81 = elevated distress risk. Designed for industrial companies — interpret cautiously for financials/tech.</div></div>
        <div class="edu-box" style="text-align:left;">
          <div class="edu-head"><span class="cap">Symbols</span><span class="t">What each symbol in the equation means</span></div>
          <div class="edu-glossary">
            <div class="term"><b>X<sub>1</sub></b> — Working Capital ÷ Total Assets. A liquidity measure: short-term operating cushion relative to overall size.</div>
            <div class="term"><b>X<sub>2</sub></b> — Retained Earnings ÷ Total Assets. A measure of accumulated, reinvested profitability over the company's history.</div>
            <div class="term"><b>X<sub>3</sub></b> — EBIT ÷ Total Assets. Current operating profitability relative to the asset base (similar in spirit to ROA).</div>
            <div class="term"><b>X<sub>4</sub></b> — Market Value of Equity ÷ Total Liabilities. A market-based leverage cushion: how far equity could fall before liabilities exceed what the company is worth.</div>
            <div class="term"><b>X<sub>5</sub></b> — Sales ÷ Total Assets. An efficiency measure: how much revenue is generated per dollar of assets (similar to asset turnover).</div>
            <div class="term"><b>1.2, 1.4, 3.3, 0.6, 1.0</b> — fixed weights Altman derived statistically; they are constants, not variables, and are not meant to be adjusted.</div>
          </div>
        </div>
        <div class="edu-box" style="text-align:left;">
          <div class="edu-head"><span class="cap">Learn It</span><span class="t">What goes into the Z-score</span></div>
          <div class="edu-glossary">
            <div class="term">Edward Altman's 1968 model combines five ratios — working capital/assets (liquidity), retained earnings/assets (accumulated profitability), EBIT/assets (current profitability), market value of equity/liabilities (leverage cushion), and sales/assets (efficiency) — into one bankruptcy-risk score. <span class="f">Each ratio captures a different way a company can get into financial trouble, so a single low ratio won't sink the score, but several weak ones will.</span></div>
          </div>
        </div>
      </div>
      <div class="card" style="text-align:center;">
        <h4>Piotroski F-Score</h4>
        <div style="font-family:var(--serif); font-size:44px; font-weight:700; color:var(--accent);">${f}<span style="font-size:18px;color:var(--text-2);">/9</span></div>
        <span class="badge-pill ${f>=7?'buy':f>=4?'hold':'sell'}">${f>=7?'Strong Fundamentals':f>=4?'Mixed':'Weak Fundamentals'}</span>
        <div class="pin"><span class="mark">i</span><div>Nine binary tests across profitability, leverage/liquidity and operating efficiency, each scored 1 if it improved year-over-year. Higher is better; ≥7 is considered strong.</div></div>
        <div class="edu-box" style="text-align:left;">
          <div class="edu-head"><span class="cap">Learn It</span><span class="t">What the nine tests check</span></div>
          <div class="edu-glossary">
            <div class="term">Joseph Piotroski's model asks nine yes/no questions grouped into three buckets: <b>Profitability</b> (is net income positive? is operating cash flow positive? did ROA improve? does cash flow exceed net income — a quality-of-earnings check?), <b>Leverage/Liquidity</b> (did leverage fall? did the current ratio improve? was there no new dilutive share issuance?), and <b>Operating Efficiency</b> (did gross margin improve? did asset turnover improve?). <span class="f">Unlike the Z-score, this doesn't measure absolute health — it measures the <i>direction of change</i>, making it popular for screening improving (or deteriorating) value stocks.</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h4>Qualitative Risk Factors</h4>
      <div class="grid-3">
        <div><b>Debt &amp; Rates</b><p style="color:var(--text-2); font-size:12.5px;">Debt/EBITDA of ${fmtNum(debtEbitda)}x; higher-for-longer rates raise refinancing cost and depress the DCF's discount-rate-sensitive terminal value (Tab 05/12).</p></div>
        <div><b>Currency &amp; Geography</b><p style="color:var(--text-2); font-size:12.5px;">See the geographic revenue mix in Tab 01 — meaningful non-domestic exposure implies FX translation risk.</p></div>
        <div><b>Industry &amp; Competitive</b><p style="color:var(--text-2); font-size:12.5px;">${d.industry} competitive intensity should be weighed against the moat narrative in Tab 01 before extending the explicit forecast period.</p></div>
      </div>
    </div>
    <div class="placeholder-module"><div class="stamp">Scaffold Ready</div><div>Beneish M-score, ESG factor scoring, and an explicit probability-of-distress model can be layered in alongside the two scores above.</div></div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">How risk screens connect back to valuation</span></div>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">A valuation model can only be as trustworthy as the assumption that the company survives to earn the cash flows it projects. Z-score and F-score exist to sanity-check that survival assumption before you trust any DCF, DDM, or relative-valuation output for the same company.</p>
      <ol>
        <li>A high intrinsic value from Tab 05–13 paired with a low Z-score is a red flag — a company can be "cheap" on paper and still be at real risk of not reaching the cash flows the model assumes.</li>
        <li>These scores are diagnostic screens, not precise probabilities — always cross-check with a qualitative read of the industry and balance sheet, not just the number.</li>
      </ol>
    </div>
  `;
}
</script>

<script>
/* ============================================================
   TAB 16 — INVESTMENT DECISION (final synthesis)
   ============================================================ */
registerTab({ id:"decision", num:"16", group:"synthesis", label:"Investment Decision", render: renderDecisionTab });

function renderDecisionTab(el, d, ticker){
  const f = d.fin; const last = f.years.length-1;
  const dcf = computeDCF(d, DCF_STATE);
  const upside = pctChange(dcf.perShare, d.price);
  const roic = (f.opIncome[last]*0.79)/(f.debt[last]+f.equity[last])*100;
  const revCagr = cagr(f.revenue[0], f.revenue[last], f.revenue.length-1);
  const netMargin = f.netIncome[last]/f.revenue[last]*100;
  const debtEbitda = f.debt[last]/f.ebitda[last];

  // simple composite score 0-100
  let score = 50;
  score += Math.max(-20, Math.min(20, upside*0.5));
  score += Math.max(-10, Math.min(10, (roic-9)*1.2));
  score += Math.max(-8, Math.min(8, (revCagr-5)*0.8));
  score += Math.max(-8, Math.min(8, (netMargin-10)*0.4));
  score -= Math.max(0, Math.min(10, (debtEbitda-3)*2));
  score = Math.max(0, Math.min(100, Math.round(score)));

  const rating = score>=75?"Strong Buy": score>=58?"Buy": score>=42?"Hold": score>=25?"Sell":"Strong Sell";
  const ratingClass = score>=58?"buy": score>=42?"hold":"sell";

  el.innerHTML = `
    <div class="section-head">
      <h3>Investment Decision — Final Synthesis</h3>
      <p>A single analyst-style verdict blending intrinsic valuation (DCF, Tab 05), quality (ROIC, margins), growth, leverage, and today's technical read. Treat the score as a structured starting point for your own judgment, not a replacement for it.</p>
    </div>

    <div class="grid-2">
      <div class="card" style="text-align:center;">
        <h4>Overall Investment Score</h4>
        <div style="font-family:var(--serif); font-size:56px; font-weight:700; color:var(--accent); margin:6px 0;">${score}<span style="font-size:20px; color:var(--text-2);">/100</span></div>
        <span class="badge-pill ${ratingClass}" style="font-size:14px; padding:6px 16px;">${rating}</span>
      </div>
      <div class="card">
        <h4>Key Inputs to the Score</h4>
        <div class="stat-grid">
          ${statCell("DCF Upside/Downside", fmtPct(upside))}
          ${statCell("ROIC (approx.)", fmtPct(roic))}
          ${statCell("Revenue CAGR", fmtPct(revCagr))}
          ${statCell("Net Margin (TTM)", fmtPct(netMargin))}
          ${statCell("Debt / EBITDA", fmtNum(debtEbitda)+"x")}
          ${statCell("Fair Value / Share", fmtPx(dcf.perShare))}
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h4>Bull Case</h4>
        <ul style="padding-left:18px; color:var(--text-1); font-size:13px; line-height:1.7;">
          <li>${d.moat}</li>
          <li>Revenue has compounded at roughly ${fmtPct(revCagr)} over the historical window, with net margins near ${fmtPct(netMargin)}.</li>
          <li>If growth or margins land nearer the Bull scenario in Tab 05, intrinsic value per share moves meaningfully above today's ${fmtPx(d.price)}.</li>
        </ul>
      </div>
      <div class="card">
        <h4>Bear Case</h4>
