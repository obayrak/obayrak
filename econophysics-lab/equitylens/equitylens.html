<style>
/* ============================================================
   LEDGER PLATFORM — DESIGN TOKENS
   Concept: a research analyst's ledger / exchange tape.
   Serif "ledger" headings, mono "tape" figures, warm parchment
   light mode vs. deep slate-ink dark mode. Amber-gold marks the
   brand/interactive accent (a wax-seal / rubber-stamp idea),
   teal = constructive/positive, coral = adverse/negative.
   ============================================================ */
:root{
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;

  --radius-sm: 3px;
  --radius-md: 6px;
  --radius-lg: 10px;

  /* dark (default) */
  --bg-0: #0a0e13;
  --bg-1: #10151c;
  --bg-2: #161c24;
  --bg-3: #1e262f;
  --border: #2a3441;
  --border-soft: #212a34;
  --text-0: #eef1f4;
  --text-1: #c3ccd6;
  --text-2: #8a96a3;
  --text-3: #5c6773;

  --accent: #d4a24a;       /* stamped gold — brand / interactive */
  --accent-ink: #7a5a1e;
  --accent-soft: rgba(212,162,74,0.14);
  --positive: #45b08c;     /* constructive / buy / gains */
  --positive-soft: rgba(69,176,140,0.14);
  --negative: #d9694f;     /* adverse / sell / losses */
  --negative-soft: rgba(217,105,79,0.14);
  --info: #6a93c2;
  --info-soft: rgba(106,147,194,0.14);

  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}

html[data-theme="light"]{
  --bg-0: #f6f3ec;
  --bg-1: #fbf9f4;
  --bg-2: #ffffff;
  --bg-3: #efeadd;
  --border: #ddd5c2;
  --border-soft: #e7e1d2;
  --text-0: #1c1a15;
  --text-1: #3c382e;
  --text-2: #6c6656;
  --text-3: #948d78;

  --accent: #a9762a;
  --accent-ink: #7a5a1e;
  --accent-soft: rgba(169,118,42,0.10);
  --positive: #2f8f6d;
  --positive-soft: rgba(47,143,109,0.10);
  --negative: #b5482f;
  --negative-soft: rgba(181,72,47,0.10);
  --info: #3f6693;
  --info-soft: rgba(63,102,147,0.10);

  --shadow: 0 8px 24px rgba(60,50,30,0.10);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-0);
  color:var(--text-0);
  font-family:var(--sans);
  font-size:14.5px;
  line-height:1.5;
  transition:background .25s ease, color .25s ease;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft); color:var(--text-0);}
a{color:var(--accent);}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:-0.01em; margin:0;}
.mono{font-family:var(--mono);}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums;}

/* scrollbar */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);}

/* ---------- Tape strip (live TradingView Ticker Tape widget) ---------- */
#tape-strip{
  background:var(--bg-1);
  border-bottom:1px solid var(--border-soft);
}

/* ---------- Header ---------- */
header.app-header{
  padding:22px 32px 16px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  border-bottom:1px solid var(--border-soft);
  background:
    radial-gradient(1200px 160px at 15% -40%, var(--accent-soft), transparent 60%),
    var(--bg-0);
}
.brand{display:flex; align-items:center; gap:14px;}
.brand-mark{
  width:42px;height:42px;border-radius:8px;
  background:linear-gradient(155deg, var(--accent), var(--accent-ink));
  display:flex;align-items:center;justify-content:center;
  color:#100b03; font-family:var(--serif); font-weight:700; font-size:20px;
  box-shadow:var(--shadow);
  flex:none;
}
.brand-text h1{font-size:22px;}
.brand-text .tagline{font-size:12px; color:var(--text-2); margin-top:2px; letter-spacing:.02em;}

.header-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

.ticker-search{position:relative;}
.ticker-search input{
  width:230px;
  background:var(--bg-2);
  border:1px solid var(--border);
  color:var(--text-0);
  font-family:var(--mono);
  font-size:13px;
  padding:9px 12px 9px 34px;
  border-radius:var(--radius-md);
  outline:none;
  transition:border-color .15s ease;
}
.ticker-search input:focus{border-color:var(--accent);}
.ticker-search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none;}
.ticker-suggest{
  position:absolute; top:calc(100% + 6px); left:0; width:100%;
  background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-md);
  box-shadow:var(--shadow); z-index:40; overflow:hidden; display:none;
}
.ticker-suggest.open{display:block;}
.ticker-suggest div{padding:8px 12px; font-family:var(--mono); font-size:12.5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px;}
.ticker-suggest div:hover{background:var(--accent-soft);}
.ticker-suggest small{color:var(--text-2); font-family:var(--sans);}

button.btn{
  background:var(--bg-2); color:var(--text-0); border:1px solid var(--border);
  padding:9px 14px; border-radius:var(--radius-md); font-size:13px; cursor:pointer;
  font-family:var(--sans); font-weight:500;
  display:inline-flex; align-items:center; gap:6px;
  transition:border-color .15s ease, background .15s ease;
}
button.btn:hover{border-color:var(--accent);}
button.btn.primary{background:var(--accent); color:#191204; border-color:var(--accent); font-weight:600;}
button.btn.primary:hover{filter:brightness(1.06);}
button.icon-btn{padding:9px 10px;}

.data-badge{
  font-size:11px; padding:4px 9px; border-radius:20px; font-family:var(--mono);
  border:1px solid var(--border); color:var(--text-2); white-space:nowrap;
}
.data-badge.live{color:var(--positive); border-color:var(--positive-soft); background:var(--positive-soft);}
.data-badge.cached{color:var(--accent); border-color:var(--accent-soft); background:var(--accent-soft);}

/* ---------- Dashboard bar ---------- */
#dashboard{
  padding:18px 32px; border-bottom:1px solid var(--border-soft);
  background:var(--bg-1);
}
.dash-top{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
.company-logo{
  width:46px; height:46px; border-radius:10px; background:var(--bg-3);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-weight:700; font-size:17px; color:var(--accent);
  border:1px solid var(--border); flex:none;
}
.company-id h2{font-size:19px;}
.company-id .sub{font-size:12.5px; color:var(--text-2); margin-top:2px;}
.company-id .sub span{color:var(--text-1);}
.price-block{margin-left:auto; text-align:right;}
.price-block .px{font-family:var(--mono); font-size:26px; font-weight:600;}
.price-block .chg{font-family:var(--mono); font-size:13px; margin-top:2px;}
.chg.up{color:var(--positive);} .chg.down{color:var(--negative);}

.stat-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(132px,1fr)); gap:1px;
  background:var(--border-soft); border:1px solid var(--border-soft); border-radius:var(--radius-md); overflow:hidden;
}
.stat-cell{background:var(--bg-2); padding:10px 12px;}
.stat-cell .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-2); margin-bottom:4px;}
.stat-cell .val{font-family:var(--mono); font-size:14px; color:var(--text-0); font-weight:600;}

/* ---------- Nav ---------- */
nav#tab-nav{
  padding:14px 32px 0; background:var(--bg-0); position:sticky; top:0; z-index:20;
  border-bottom:1px solid var(--border-soft);
}
.nav-group-row{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
.nav-group-btn{
  font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  color:var(--text-2); background:transparent; border:1px solid transparent; border-radius:20px;
  padding:6px 13px; cursor:pointer;
}
.nav-group-btn.active{color:var(--text-0); border-color:var(--border); background:var(--bg-2);}
.nav-tabs-row{display:flex; gap:2px; overflow-x:auto; padding-bottom:0;}
.nav-tab{
  font-family:var(--sans); font-size:13px; color:var(--text-2); background:transparent; border:none;
  padding:10px 14px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; position:relative; top:1px;
}
.nav-tab .n{font-family:var(--mono); font-size:10.5px; color:var(--text-3); margin-right:6px;}
.nav-tab:hover{color:var(--text-0);}
.nav-tab.active{color:var(--text-0); border-bottom-color:var(--accent);}
.nav-tab.active .n{color:var(--accent);}

/* ---------- Main / panels ---------- */
main{padding:26px 32px 60px; max-width:1400px; margin:0 auto;}
.panel{display:none; animation:fade-in .2s ease;}
.panel.active{display:block;}
@keyframes fade-in{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.section-head{margin-bottom:16px;}
.section-head h3{font-size:19px; margin-bottom:4px;}
.section-head p{color:var(--text-2); font-size:13px; max-width:760px;}

.card{
  background:var(--bg-1); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  padding:18px 20px; margin-bottom:18px;
}
.card h4{font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.card h4 .tag{font-size:10px; font-family:var(--mono); color:var(--accent); border:1px solid var(--accent-soft); background:var(--accent-soft); padding:2px 7px; border-radius:10px; text-transform:uppercase; letter-spacing:.04em;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
@media (max-width:980px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

/* pinpoint / teaching callouts */
.pin{
  display:flex; gap:10px; background:var(--info-soft); border:1px solid rgba(106,147,194,0.28);
  border-radius:var(--radius-md); padding:10px 12px; font-size:12.5px; color:var(--text-1); margin:10px 0;
}
.pin .mark{
  flex:none; width:18px; height:18px; border-radius:50%; background:var(--info); color:#fff;
  font-family:var(--mono); font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:700;
}
.pin b{color:var(--text-0);}

.why-matters{border-left:3px solid var(--accent); padding:8px 12px; background:var(--accent-soft); border-radius:0 var(--radius-md) var(--radius-md) 0; font-size:12.5px; margin:10px 0;}
.why-matters b{color:var(--accent); text-transform:uppercase; font-size:10.5px; letter-spacing:.05em; display:block; margin-bottom:3px;}

/* ---------- Student explanation boxes (glossary / "learn this metric") ---------- */
.edu-box{
  border:1px solid var(--border); border-radius:var(--radius-md);
  background:var(--bg-2); padding:14px 16px; margin:14px 0 0;
}
.edu-box .edu-head{
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
}
.edu-box .edu-head .cap{
  font-family:var(--serif); font-weight:700; font-size:10px; color:var(--info);
  border:1px solid rgba(106,147,194,0.35); background:var(--info-soft);
  padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.06em;
}
.edu-box .edu-head span.t{font-size:13px; font-weight:600; color:var(--text-0);}
.edu-glossary{display:grid; grid-template-columns:1fr; gap:9px;}
.edu-glossary .term{font-size:12.5px; line-height:1.55; color:var(--text-1); padding-left:14px; border-left:2px solid var(--border);}
.edu-glossary .term b{color:var(--text-0); font-family:var(--mono); font-size:12.5px;}
.edu-glossary .term .f{color:var(--text-2); font-style:italic;}
@media (min-width:760px){ .edu-glossary.cols-2{grid-template-columns:1fr 1fr;} }

.valuation-explainer{
  border:1px dashed var(--accent); border-radius:var(--radius-lg);
  background:var(--accent-soft); padding:16px 18px; margin-top:18px;
}
.valuation-explainer .edu-head .cap{color:var(--accent); border-color:var(--accent-soft); background:rgba(212,162,74,0.16);}
.valuation-explainer h5{font-family:var(--serif); font-size:14.5px; margin:0 0 8px; color:var(--text-0);}
.valuation-explainer ol, .valuation-explainer ul{margin:6px 0 0; padding-left:19px; color:var(--text-1); font-size:12.5px; line-height:1.65;}
.valuation-explainer .vx-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:8px;}
@media (min-width:820px){ .valuation-explainer .vx-grid{grid-template-columns:1fr 1fr;} }
.valuation-explainer .vx-cell b{color:var(--text-0); display:block; margin-bottom:3px; font-size:12px;}
.valuation-explainer .vx-cell{font-size:12.5px; color:var(--text-1); line-height:1.55;}

table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
table.data-table th{
  text-align:right; font-family:var(--mono); font-size:11px; color:var(--text-2); text-transform:uppercase;
  letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--border); font-weight:600;
}
table.data-table th:first-child, table.data-table td:first-child{text-align:left;}
table.data-table td{padding:8px 10px; text-align:right; font-family:var(--mono); border-bottom:1px solid var(--border-soft); color:var(--text-1);}
table.data-table tr:hover td{background:var(--bg-2);}
table.data-table td.lbl{font-family:var(--sans); color:var(--text-0); font-weight:500;}

.badge-pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-family:var(--mono); font-weight:600;}
.badge-pill.buy{background:var(--positive-soft); color:var(--positive);}
.badge-pill.sell{background:var(--negative-soft); color:var(--negative);}
.badge-pill.hold{background:var(--accent-soft); color:var(--accent);}

.mjx-block{overflow-x:auto; padding:4px 0;}

.slider-row{display:flex; align-items:center; gap:12px; margin:10px 0;}
.slider-row label{width:190px; font-size:12.5px; color:var(--text-1); flex:none;}
.slider-row input[type=range]{flex:1; accent-color:var(--accent);}
.slider-row .sval{width:64px; text-align:right; font-family:var(--mono); font-size:12.5px; color:var(--text-0); flex:none;}

.tv-embed{border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border-soft); background:var(--bg-2);}

.placeholder-module{
  border:1px dashed var(--border); border-radius:var(--radius-lg); padding:30px; text-align:center; color:var(--text-2);
}
.placeholder-module .stamp{
  display:inline-block; font-family:var(--serif); font-weight:700; color:var(--accent); border:2px solid var(--accent);
  padding:4px 14px; border-radius:6px; transform:rotate(-3deg); margin-bottom:10px; letter-spacing:.05em; font-size:13px;
}

footer{padding:20px 32px 40px; color:var(--text-3); font-size:11.5px; border-top:1px solid var(--border-soft); text-align:center;}

.canvas-wrap{position:relative; width:100%;}
canvas{width:100%; display:block;}
</style>
</head>

/** Simple deterministic hash so unknown tickers still get a
 *  stable, plausible-looking synthetic dataset every time. */
function hashSeed(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
function seededRand(seed){
  let s = seed % 2147483647; if (s<=0) s += 2147483646;
  return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
}

function buildSyntheticData(rawTicker){
  const seed = hashSeed(rawTicker.toUpperCase());
  const rnd = seededRand(seed);
  const sectors = [["Technology","Software—Application"],["Healthcare","Biotechnology"],["Financial Services","Banks—Regional"],
    ["Industrials","Aerospace & Defense"],["Energy","Oil & Gas E&P"],["Consumer Discretionary","Specialty Retail"],
    ["Consumer Staples","Packaged Foods"],["Materials","Chemicals"],["Utilities","Utilities—Regulated Electric"]];
  const [sector, industry] = sectors[Math.floor(rnd()*sectors.length)];
  const price = +(20 + rnd()*280).toFixed(2);
  const shares = +(0.2 + rnd()*8).toFixed(2);
  const mcap = +(price*shares).toFixed(0);
  const baseRev = 500 + rnd()*40000;
  const growth = 0.03 + rnd()*0.18;
  const grossMarginBase = 0.25 + rnd()*0.45;
  const years = ["Y-4","Y-3","Y-2","Y-1","TTM"];
  const revenue=[], grossProfit=[], opIncome=[], ebitda=[], netIncome=[], eps=[], assets=[], liabilities=[], equity=[], cash=[], debt=[], ocf=[], icf=[], fcf=[], capex=[];
  let rev = baseRev/Math.pow(1+growth,4);
  for(let i=0;i<5;i++){
    rev = i===0? rev : rev*(1+growth*(0.7+rnd()*0.6));
    const gm = grossMarginBase + (rnd()-0.5)*0.03;
    const gp = rev*gm;
    const om = gm*(0.35+rnd()*0.25);
    const oi = rev*om;
    const eb = oi*1.18;
    const ni = oi*(0.72+rnd()*0.12);
    revenue.push(rev); grossProfit.push(gp); opIncome.push(oi); ebitda.push(eb); netIncome.push(ni);
    eps.push(+(ni/(shares*1000)).toFixed(2));
    const asset = rev*(1.1+rnd()*0.6); assets.push(asset);
    const liab = asset*(0.45+rnd()*0.25); liabilities.push(liab);
    equity.push(asset-liab);
    cash.push(rev*(0.08+rnd()*0.12));
    debt.push(asset*(0.15+rnd()*0.2));
    const oc = ni*(1.15+rnd()*0.3); ocf.push(oc);
    icf.push(-oc*(0.35+rnd()*0.3));
    const capx = -rev*(0.03+rnd()*0.08); capex.push(capx);
    fcf.push(oc+capx);
  }
  const t = rawTicker.toUpperCase();
  return {
    name:`${t} Holdings (sample profile)`, exch: t.includes(":")? t.split(":")[0]:"NASDAQ", sector, industry,
    ceo:"— (not in cache)", employees: Math.round(500+rnd()*80000), hq:"— (not in cache)",
    price, chgPct:+((rnd()-0.5)*4).toFixed(2), mcap, ev:+(mcap*(1+(rnd()-0.5)*0.1)).toFixed(0), shares, beta:+(0.6+rnd()*1.1).toFixed(2),
    divYield:+(rnd()*3).toFixed(2), wk52hi:+(price*(1.05+rnd()*0.25)).toFixed(2), wk52lo:+(price*(0.6+rnd()*0.25)).toFixed(2),
    avgVol:+(0.5+rnd()*40).toFixed(1),
    desc:`No cached profile is available for ${t}; this is a deterministic synthetic dataset generated locally (same ticker always reproduces the same numbers) so every module below still has data to render.`,
    moat:"Synthetic placeholder — replace with the company's actual competitive-advantage narrative once real filings data is wired in.",
    segments:[["Core Segment",100]],
    geo:[["Unspecified",100]],
    synthetic:true,
    fin:{ years, revenue, grossProfit, opIncome, ebitda, netIncome, eps, assets, liabilities, equity, cash, debt, ocf, icf, fcf, capex }
  };
}

function getCompanyData(rawTicker){
  const key = rawTicker.trim().toUpperCase();
  if (SAMPLE_DB[key]) return Object.assign({synthetic:false}, SAMPLE_DB[key]);

/* ---- formatting helpers used across every tab module ---- */
function fmtB(n){ // n already in millions -> show as B/M
  if (n===undefined||n===null||isNaN(n)) return "—";
  const abs = Math.abs(n);
  if (abs>=1000) return (n/1000).toFixed(2)+"B";
  return n.toFixed(0)+"M";
}
function fmtPx(n){ return n===undefined? "—" : "$"+n.toFixed(2); }
function fmtPct(n,d=2){ return n===undefined||n===null||isNaN(n) ? "—" : n.toFixed(d)+"%"; }
function fmtNum(n,d=2){ return n===undefined||n===null||isNaN(n) ? "—" : n.toFixed(d); }
function fmtShares(n){ return n===undefined? "—" : n.toFixed(2)+"B"; }
function fmtBil(n){ if(n===undefined||n===null||isNaN(n)) return "—"; return n>=1000 ? "$"+(n/1000).toFixed(2)+"T" : "$"+n.toFixed(1)+"B"; }
function pctChange(a,b){ return b? ((a-b)/Math.abs(b))*100 : NaN; }
function cagr(first,last,periods){ return first>0? (Math.pow(last/first, 1/periods)-1)*100 : NaN; }

/* ---- tiny reusable canvas chart helpers (no external chart lib; DPR-aware) ---- */
function css(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }
const PALETTE = ()=>[css('--accent'), css('--positive'), css('--info'), css('--negative'), '#9b7bd1', '#6bb3c9', '#c98f4a'];

function setupCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || canvas.parentElement.clientWidth || 400;
  const h = canvas.dataset.h ? +canvas.dataset.h : (canvas.height || 220);
  canvas.width = w*dpr; canvas.height = h*dpr; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  return {ctx, w, h};
}

function drawDonut(canvas, data /* [[label,val],...] */){
  const {ctx,w,h} = setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const total = data.reduce((s,[,v])=>s+v,0) || 1;
  const cx=w*0.32, cy=h/2, r=Math.min(w*0.28,h*0.42), rIn=r*0.58;
  let start=-Math.PI/2;
  const colors = PALETTE();
  data.forEach(([label,val],i)=>{
    const ang = (val/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+ang);
    ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();
    start += ang;
  });
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,rIn,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  // legend
  const lx = w*0.58, ly0 = h*0.5 - (data.length*20)/2;
  ctx.textBaseline='middle'; ctx.font='12px Inter, sans-serif';
  data.forEach(([label,val],i)=>{
    const y = ly0 + i*20;
    ctx.fillStyle = colors[i%colors.length];
    ctx.fillRect(lx, y-6, 11, 11);
    ctx.fillStyle = css('--text-1');
    ctx.fillText(`${label} — ${val.toFixed(1)}%`, lx+17, y);
  });
}

function drawBars(canvas, categories, series /* [{name,color,values:[]}] */, opts={}){
  const {ctx,w,h} = setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL=opts.padL||46, padB=28, padT=14, padR=10;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const allVals = series.flatMap(s=>s.values);
  const maxV = Math.max(...allVals, 0), minV = Math.min(...allVals,0);
  const range = (maxV-minV)||1;
  const zeroY = padT + plotH*(maxV/range);
  const yFmt = opts.yFmt || fmtB;
  // axes
  ctx.strokeStyle = css('--border'); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, h-padB); ctx.lineTo(w-padR, h-padB); ctx.stroke();
  ctx.fillStyle = css('--text-2'); ctx.font='10.5px "IBM Plex Mono", monospace'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){ const v = minV + range*i/4; const y = padT + plotH*(1-i/4); ctx.fillText(yFmt(v), padL-6, y); ctx.strokeStyle=css('--border-soft'); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke(); }
  const groupW = plotW/categories.length;
  const barW = Math.min(26, (groupW*0.7)/series.length);
  ctx.textAlign='center'; ctx.fillStyle=css('--text-2');
  categories.forEach((cat,ci)=>{
    const gx = padL + groupW*ci + groupW/2;
    ctx.fillText(cat, gx, h-padB+14);
    series.forEach((s,si)=>{
      const val = s.values[ci];
      const bx = gx - (series.length*barW)/2 + si*barW;
      const barH = plotH*(Math.abs(val)/range);
      const by = val>=0 ? zeroY-barH : zeroY;
      ctx.fillStyle = s.color;
      ctx.fillRect(bx, by, barW-3, barH);
    });
  });
  // legend
  let lx = padL;
  series.forEach(s=>{
    ctx.fillStyle=s.color; ctx.fillRect(lx, 2, 10,10);
    ctx.fillStyle=css('--text-1'); ctx.textAlign='left'; ctx.font='11px Inter, sans-serif';
    ctx.fillText(s.name, lx+14, 8);
    lx += ctx.measureText(s.name).width + 34;
  });
}

function drawLine(canvas, categories, series /* [{name,color,values:[]}] */, opts={}){
  const {ctx,w,h} = setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL=50, padB=26, padT=14, padR=14;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const allVals = series.flatMap(s=>s.values).filter(v=>!isNaN(v));
  const maxV = Math.max(...allVals), minV = Math.min(...allVals,0);
  const range=(maxV-minV)||1;
  const yFmt = opts.yFmt || fmtB;
  ctx.strokeStyle=css('--border'); ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,h-padB); ctx.lineTo(w-padR,h-padB); ctx.stroke();
  ctx.fillStyle=css('--text-2'); ctx.font='10.5px "IBM Plex Mono", monospace'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){ const v=minV+range*i/4; const y=padT+plotH*(1-i/4); ctx.fillText(yFmt(v), padL-6, y); ctx.strokeStyle=css('--border-soft'); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke(); }
  ctx.textAlign='center'; ctx.fillStyle=css('--text-2');
  categories.forEach((c,i)=>{ const x = padL + plotW*(i/(categories.length-1||1)); ctx.fillText(c, x, h-padB+13); });
  series.forEach(s=>{
    ctx.strokeStyle=s.color; ctx.lineWidth=2; ctx.beginPath();
    s.values.forEach((v,i)=>{ const x=padL+plotW*(i/(categories.length-1||1)); const y=padT+plotH*(1-(v-minV)/range); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
    s.values.forEach((v,i)=>{ const x=padL+plotW*(i/(categories.length-1||1)); const y=padT+plotH*(1-(v-minV)/range); ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fillStyle=s.color; ctx.fill(); });
  });
  let lx=padL;
  series.forEach(s=>{ ctx.fillStyle=s.color; ctx.fillRect(lx,2,10,10); ctx.fillStyle=css('--text-1'); ctx.textAlign='left'; ctx.font='11px Inter, sans-serif'; ctx.fillText(s.name, lx+14,8); lx += ctx.measureText(s.name).width+34; });
}

/* ---- TradingView live-widget helpers ----
   Shared by every module that embeds a real TradingView widget (Tabs 01, 02, 14).
   Widgets are iframes TradingView serves directly with live data baked in visually —
   there is no free public API to pull raw numbers back out of them into JS, so these
   are used for live *display* only. The calculators elsewhere in this app (ratios,
   DCF, scoring, etc.) still run on the cached/synthetic SAMPLE_DB dataset. */
function tvSymbol(ticker){
  if (ticker.includes(":")) return ticker; // already exchange-qualified (e.g. BIST:ASELS)
  const nasdaqSet = new Set(["AAPL","MSFT","NVDA","GOOGL","AMZN","META","TSLA"]);
  return (nasdaqSet.has(ticker) ? "NASDAQ:" : "NYSE:") + ticker;
}
function loadTVWidget(containerId, scriptSrc, config){
  const container = document.getElementById(containerId);
  if (!container) return;
  const s = document.createElement('script');
  s.type = "text/javascript";
  s.src = scriptSrc;
  s.async = true;
  s.innerHTML = JSON.stringify(config);
  container.appendChild(s);
}

function rerenderActive(){
  const tab = TAB_REGISTRY.find(t=>t.id===APP.activeTab);
  if (tab && APP.data) tab.render(document.getElementById('panel-'+tab.id), APP.data, APP.ticker);
  renderDashboard(APP.data, APP.ticker);
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

/* ---- ticker search + load ---- */
const tickerInput = document.getElementById('ticker-input');
const suggestBox = document.getElementById('ticker-suggest');
let searchDebounce = null;
let searchAbort = null;

/* Live symbol lookup — TradingView's symbol_search endpoint, same origin
   family as the s3.tradingview.com widget scripts already embedded on this
   page. Falls back to the local TICKER_INDEX list only if the network
   call fails (offline, blocked, etc). */
async function fetchTVSymbols(query){
  const url = `https://symbol-search.tradingview.com/symbol_search/?text=${encodeURIComponent(query)}&hl=1&lang=en&domain=production`;
  if (searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  const res = await fetch(url, { signal: searchAbort.signal });
  if (!res.ok) throw new Error("symbol search failed");
  const raw = await res.json();
  const strip = s => (s||"").replace(/<[^>]+>/g, ""); // TV wraps matched text in <em> tags
  return raw.slice(0,8).map(r => ({
    ticker: r.exchange ? `${r.exchange}:${strip(r.symbol)}` : strip(r.symbol),
    plainSymbol: strip(r.symbol),
    name: strip(r.description),
    exch: r.exchange || "",
    type: r.type || ""
  }));
}

function renderSuggestions(items){
  if (!items.length){ suggestBox.classList.remove('open'); return; }
  suggestBox.innerHTML = items.map(it =>
    `<div data-t="${it.ticker}">${it.plainSymbol} <small>${it.name}${it.exch? ' · '+it.exch:''}</small></div>`
  ).join("");
  suggestBox.classList.add('open');
  suggestBox.querySelectorAll('div').forEach((d,i)=>{
    d.addEventListener('click', ()=>{
      tickerInput.value = items[i].ticker;
      suggestBox.classList.remove('open');
      loadTicker(items[i].ticker);
    });
  });
}

tickerInput.addEventListener('input', ()=>{
  const q = tickerInput.value.trim();
  if (!q){ suggestBox.classList.remove('open'); return; }
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(async ()=>{
    try{
      const items = await fetchTVSymbols(q);
      renderSuggestions(items);
    }catch(err){
      if (err.name === 'AbortError') return; // superseded by a newer keystroke
      // network unavailable — fall back to the small local index
      const qU = q.toUpperCase();
      const matches = TICKER_INDEX.filter(([t,n])=> t.includes(qU) || n.toUpperCase().includes(qU)).slice(0,7)
        .map(([t,n])=>({ticker:t, plainSymbol:t, name:n, exch:""}));
      renderSuggestions(matches);
    }
  }, 250); // debounce so we don't fire a request on every keystroke
});

document.addEventListener('click', (e)=>{ if (!e.target.closest('.ticker-search')) suggestBox.classList.remove('open'); });
tickerInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter'){ suggestBox.classList.remove('open'); loadTicker(tickerInput.value); } });
document.getElementById('load-btn').addEventListener('click', ()=> loadTicker(tickerInput.value));

function loadTicker(raw){
  const t = (raw||"").trim().toUpperCase();
  if (!t) return;
  const data = getCompanyData(t);
  APP.ticker = t; APP.data = data;
  const badge = document.getElementById('data-badge');
  badge.textContent = "LIVE PRICE · TRADINGVIEW";
  badge.className = "data-badge live";
  renderDashboard(data, t);
  renderAllPanels();
  renderNavGroups(); setActiveGroup(activeGroup); // will call setActiveTab -> renders first tab
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}
</script>

<script>
/* ============================================================
   TAB 02 — FINANCIAL STATEMENTS (5yr + TTM)
   ============================================================ */
registerTab({ id:"financials", num:"02", group:"fundamentals", label:"Financial Statements", render: renderFinancialsTab });

function statRow(label, arr, opts={}){
  const cells = arr.map(v=> `<td>${opts.pct ? fmtPct(v) : (opts.eps ? '$'+v.toFixed(2) : fmtB(v))}</td>`).join("");
  return `<tr><td class="lbl">${label}</td>${cells}</tr>`;
}

function renderFinancialsTab(el, d, ticker){
  const f = d.fin;
  const sym = tvSymbol(ticker);
  const years = f.years;
  const grossMargin = f.revenue.map((r,i)=> f.grossProfit[i]/r*100);
  const opMargin = f.revenue.map((r,i)=> f.opIncome[i]/r*100);
  const netMargin = f.revenue.map((r,i)=> f.netIncome[i]/r*100);
  const revGrowth = f.revenue.map((r,i)=> i===0? NaN : pctChange(r, f.revenue[i-1]));
  const workingCap = f.assets.map((a,i)=> a - f.liabilities[i]); // simplified proxy for equity; true WC needs current-only detail

  el.innerHTML = `
    <div class="section-head">
      <h3>Financial Statements</h3>
      <p>Five fiscal years plus trailing twelve months (TTM), across all three core statements below. Figures in USD millions unless noted.</p>
    </div>

    <div class="card">
      <h4>Live Financials <span class="tag">TradingView · Live</span></h4>
      <div class="tv-embed" style="height:720px;">
        <div class="tradingview-widget-container" style="height:100%;">
          <div id="fin-tv-financials" style="height:100%;"></div>
        </div>
      </div>
      <div class="pin"><span class="mark">i</span><div>Streams TradingView's own live income statement, balance sheet and cash flow figures for <b>${sym}</b>. Switch between annual/quarterly and expand any line directly inside the widget.</div></div>
      <div class="why-matters"><b>Why two data sources</b>The tables below stay on this app's cached/synthetic dataset (<span class="mono">SAMPLE_DB</span>): a free embedded widget can display TradingView's numbers, but it can't hand them back to JavaScript — so the ratio, DCF and scoring calculators elsewhere in this app (Tabs 03–13, 15–16) keep running on the sample data instead.</div>

      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">Reading the live widget's stat labels — TTM, FQ &amp; FY explained</span></div>
        <div class="edu-glossary">
          <div class="term">The live widget above tags many figures with a period abbreviation. <b>TTM</b> = Trailing Twelve Months, the sum of the four most recently reported quarters — an "always current" annual figure that doesn't wait for fiscal year-end. <b>FQ</b> = Fiscal Quarter, the single most recent reported quarter on its own, useful for spotting a sudden change that a smoothed TTM figure would hide. <b>FY</b> = Fiscal Year, the company's most recently <i>completed</i> full fiscal year. <span class="f">Same underlying line item, three different windows of time — always check which one you're looking at before comparing two numbers.</span></div>
        </div>
      </div>

      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">Valuation ratios shown on the live widget</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>P/E ratio</b> — Price per Share ÷ Diluted EPS. How many years of current earnings you're paying for at today's price. <span class="f">The most widely quoted multiple — see Tab 07 for a peer comparison.</span></div>
          <div class="term"><b>P/S ratio</b> — Price ÷ Revenue per Share (equivalently, market cap ÷ total revenue). Useful when a company isn't yet profitable, since it ignores earnings entirely. <span class="f">Says nothing about margins on its own — always pair with a profitability metric.</span></div>
          <div class="term"><b>P/B ratio</b> — Price ÷ Book Value per Share. What you pay per dollar of accounting net worth. <span class="f">Most meaningful for asset-heavy businesses like banks; less meaningful for asset-light software or services companies.</span></div>
          <div class="term"><b>P/CF ratio</b> — Price ÷ Operating Cash Flow per Share. Similar in spirit to P/E, but based on actual cash from operations rather than accounting net income. <span class="f">Harder to distort with non-cash accounting choices than P/E.</span></div>
          <div class="term"><b>P/FCF ratio</b> — Price ÷ Free Cash Flow per Share. The strictest of the group — cash left over <i>after</i> the reinvestment (CapEx) needed to keep the business running. <span class="f">The multiple most directly comparable to the DCF engine in Tab 05.</span></div>
        </div>
      </div>

      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">Returns &amp; efficiency shown on the live widget</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>Return on Assets (TTM)</b> — Trailing-twelve-month net income ÷ total assets. How efficiently all capital, regardless of financing, is turned into profit. <span class="f">Full definition and trend in Tab 03.</span></div>
          <div class="term"><b>Return on Equity (TTM)</b> — Trailing-twelve-month net income ÷ shareholders' equity. How much profit is generated per dollar shareholders have invested. <span class="f">Can be inflated by leverage — cross-check against Debt/Equity in Tab 03.</span></div>
          <div class="term"><b>Return on Invested Capital (TTM)</b> — Trailing-twelve-month after-tax operating profit ÷ (debt + equity). The cleanest read on core-business profitability, independent of financing choices. <span class="f">Compare to WACC (Tab 05) — ROIC above WACC means growth is creating value.</span></div>
          <div class="term"><b>Revenue per Employee (FY)</b> — Total revenue for the fiscal year ÷ headcount. A rough measure of workforce productivity and business-model scalability. <span class="f">Naturally much higher for software/tech companies than for labor-intensive retailers or manufacturers — most useful compared within the same industry.</span></div>
          <div class="term"><b>Net Income per Employee (FY)</b> — Net income for the fiscal year ÷ headcount. How much bottom-line profit each employee generates, on average. <span class="f">A quick, if blunt, gauge of operating leverage and workforce efficiency.</span></div>
        </div>
      </div>

      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">Income statement fields shown on the live widget</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>Total Revenue (TTM)</b> — The trailing-twelve-month sum of total sales. <span class="f">The most current read on the top line without waiting for a new fiscal year to close.</span></div>
          <div class="term"><b>Revenue per Share (TTM)</b> — Total revenue (TTM) ÷ diluted shares outstanding. Sales expressed on a per-share basis, the denominator behind the P/S ratio above. <span class="f">Useful for tracking dilution's effect on a shareholder's claim on sales.</span></div>
          <div class="term"><b>Gross Profit (TTM)</b> — Trailing-twelve-month revenue minus cost of goods sold. <span class="f">See the fuller Income Statement glossary above for what this represents.</span></div>

          <div class="term"><b>Net Income (TTM)</b> — Trailing-twelve-month bottom-line profit after every expense, interest, and tax. <span class="f">The numerator behind trailing P/E and ROE/ROA.</span></div>
          <div class="term"><b>EPS Diluted (TTM)</b> — Net income (TTM) ÷ diluted shares outstanding. The smoothed, most-current earnings-per-share figure most valuation multiples use. <span class="f">"Diluted" means it already accounts for stock options, RSUs, and convertible securities that could increase the share count.</span></div>
          <div class="term"><b>EPS Diluted (FQ)</b> — Diluted EPS for the single most recently reported fiscal quarter alone, not smoothed over a full year. <span class="f">Best for spotting a sudden acceleration, deceleration, or one-off item that a TTM figure would average away.</span></div>
          <div class="term"><b>Total Shares Outstanding</b> — The total number of shares currently issued and held by all shareholders. <span class="f">The denominator behind EPS, book value per share, revenue per share, and per-share intrinsic value throughout this app's valuation tabs.</span></div>
        </div>
      </div>

    <div class="card">

          ${statRow("Net Income", f.netIncome)}
          ${statRow("EPS (diluted)", f.eps, {eps:true})}
        </tbody>
      </table>
      <div class="why-matters"><b>Why this matters</b>Revenue is the top of every valuation funnel; gross &amp; operating margin trends tell you whether growth is <i>profitable</i> growth before you ever build a DCF.</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">What each income statement line means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>Revenue</b> — Total sales of goods or services before any costs are subtracted. <span class="f">Also called "sales" or "the top line" — the starting point for every other line below.</span></div>
          <div class="term"><b>Gross Profit</b> — Revenue minus the direct cost of producing what was sold (COGS: materials, direct labor, manufacturing). <span class="f">Shows the profit left before overhead, marketing, or R&amp;D are paid for.</span></div>
          <div class="term"><b>Operating Income</b> — Gross profit minus operating expenses (R&amp;D, sales &amp; marketing, general &amp; admin). <span class="f">Also called EBIT — profit from the actual business, before interest and taxes.</span></div>
          <div class="term"><b>EBITDA</b> — Earnings Before Interest, Taxes, Depreciation &amp; Amortization. Operating income with non-cash depreciation/amortization added back. <span class="f">A rough proxy for operating cash generation, popular for comparing capital-intensity-heavy companies.</span></div>
          <div class="term"><b>EBIT</b> — Earnings Before Interest &amp; Taxes. Essentially the same as operating income here. <span class="f">The profit figure used with EV multiples like EV/EBIT.</span></div>
          <div class="term"><b>Net Income</b> — What's left after <i>everything</i> is subtracted: operating costs, interest expense, and taxes. <span class="f">The "bottom line" — the actual profit attributable to shareholders for the period.</span></div>
          <div class="term"><b>EPS (diluted)</b> — Net income ÷ diluted shares outstanding (including the effect of stock options/convertibles). <span class="f">Profit expressed on a per-share basis — the figure most P/E ratios and per-share valuations are built from.</span></div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h4>Revenue &amp; Net Income Growth <span class="tag">$M</span></h4>
        <div class="canvas-wrap"><canvas id="fin-growth-chart" data-h="220"></canvas></div>

    <div class="card">
      <h4>Balance Sheet <span class="tag">5Y + TTM</span></h4>
      <table class="data-table">
        <thead><tr><th style="text-align:left;">$M</th>${years.map(y=>`<th>${y}</th>`).join("")}</tr></thead>
        <tbody>
          ${statRow("Total Assets", f.assets)}

        </tbody>
      </table>
      <div class="why-matters"><b>Why this matters</b>The balance sheet is a snapshot, not a flow — it shows what the company <i>owns</i> and <i>owes</i> at one point in time, which is what the Asset-Based (Tab 09) and Residual Income (Tab 08) models value directly.</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">What each balance sheet line means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>Total Assets</b> — Everything the company owns or controls that has economic value: cash, inventory, equipment, buildings, patents, goodwill, and more. <span class="f">The left side of the classic "Assets = Liabilities + Equity" accounting equation.</span></div>
          <div class="term"><b>Total Liabilities</b> — Everything the company owes to outsiders: debt, accounts payable, deferred revenue, pension obligations, and more. <span class="f">Claims on the company's assets that come <i>before</i> shareholders in a liquidation.</span></div>
          <div class="term"><b>Total Equity</b> — Assets minus liabilities — the accounting "net worth" belonging to shareholders. <span class="f">Also called shareholders' or stockholders' equity; the basis for book value per share.</span></div>
          <div class="term"><b>Cash &amp; Equivalents</b> — Cash on hand plus highly liquid short-term investments that can be converted to cash almost immediately. <span class="f">Subtracted from debt to get "net debt" in enterprise value calculations.</span></div>
          <div class="term"><b>Total Debt</b> — All interest-bearing borrowings, short- and long-term (bonds, loans, leases classified as debt). <span class="f">Does not include non-debt liabilities like accounts payable.</span></div>
          <div class="term"><b>Net Working Capital</b> — A proxy for the short-term operating cushion between what's owed and what's owned. <span class="f">Positive working capital generally means the company can cover near-term obligations without raising new financing.</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h4>Cash Flow Statement <span class="tag">5Y + TTM</span></h4>
      <table class="data-table">
        <thead><tr><th style="text-align:left;">$M</th>${years.map(y=>`<th>${y}</th>`).join("")}</tr></thead>
        <tbody>
          ${statRow("Operating Cash Flow", f.ocf)}
          ${statRow("Investing Cash Flow", f.icf)}
          ${statRow("Capital Expenditures", f.capex)}
          ${statRow("Free Cash Flow (OCF − CapEx)", f.fcf)}
        </tbody>
      </table>
      <div class="why-matters"><b>Why this matters</b>Free Cash Flow — not net income — is the raw input for the DCF (Tab 05). Net income can be flattered by non-cash items; FCF is closer to cash the owners could actually take out.</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">What each cash flow line means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>Operating Cash Flow (OCF)</b> — Cash generated purely by running the business day-to-day, starting from net income and adjusting for non-cash items (like depreciation) and changes in working capital. <span class="f">Answers: is the reported profit actually showing up as real cash?</span></div>
          <div class="term"><b>Investing Cash Flow (ICF)</b> — Cash spent on or received from long-term investments: buying/selling equipment, property, other businesses, or securities. <span class="f">Usually negative for a growing company that's actively reinvesting.</span></div>
          <div class="term"><b>Capital Expenditures (CapEx)</b> — Cash spent specifically on long-term physical or intangible assets (property, equipment, software) needed to maintain or grow the business. <span class="f">A subset of investing cash flow; the key input subtracted from OCF to get free cash flow.</span></div>
          <div class="term"><b>Free Cash Flow (FCF)</b> — Operating cash flow minus CapEx. The cash left over after the business has funded the reinvestment it needs to keep operating and growing. <span class="f">The cash that could, in principle, be paid out to lenders and shareholders without harming the business — the foundation of the DCF model (Tab 05).</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h4>Common-Size Income Statement <span class="tag">% of Revenue</span></h4>
      <table class="data-table">
        <thead><tr><th style="text-align:left;">% of Revenue</th>${years.map(y=>`<th>${y}</th>`).join("")}</tr></thead>
        <tbody>
          ${statRow("Gross Margin", grossMargin, {pct:true})}
          ${statRow("Operating Margin", opMargin, {pct:true})}
          ${statRow("Net Margin", netMargin, {pct:true})}
          ${statRow("Revenue Growth YoY", revGrowth, {pct:true})}
        </tbody>
      </table>
      <div class="pin"><span class="mark">i</span><div><b>Common-size statements</b> restate every line as a % of revenue so you can compare years (or companies of different sizes) on a like-for-like basis.</div></div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">What each common-size line means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>Gross Margin</b> — Gross profit expressed as a % of revenue. <span class="f">A pricing-power and production-efficiency gauge; see the fuller definition in Tab 03.</span></div>
          <div class="term"><b>Operating Margin</b> — Operating income as a % of revenue. <span class="f">Shows core-business profitability after overhead, independent of financing or tax structure.</span></div>
          <div class="term"><b>Net Margin</b> — Net income as a % of revenue. <span class="f">The final, all-in profitability read for the period.</span></div>
          <div class="term"><b>Revenue Growth YoY</b> — The percentage change in revenue versus the prior year. <span class="f">The starting point for every growth assumption used later in Tab 04 and the DCF (Tab 05).</span></div>
        </div>
      </div>
    </div>
  `;

  loadTVWidget('fin-tv-financials', "https://s3.tradingview.com/external-embedding/embed-widget-financials.js", {
    colorTheme: APP.theme==='dark'?'dark':'light', isTransparent:true, largeChartUrl:"",
    displayMode:"adaptive", width:"100%", height:"100%", symbol: sym, locale:"en"
  });

  drawBars(document.getElementById('fin-growth-chart'), years, [
    {name:"Revenue", color:css('--accent'), values:f.revenue},
    {name:"Net Income", color:css('--positive'), values:f.netIncome}
  ]);
  drawLine(document.getElementById('fin-margin-chart'), years, [
    {name:"Gross Margin", color:css('--accent'), values:grossMargin},
    {name:"Operating Margin", color:css('--info'), values:opMargin},
    {name:"Net Margin", color:css('--positive'), values:netMargin}
  ], {yFmt:(v)=>v.toFixed(0)+"%"});
}
</script>

<script>
/* ============================================================
   TAB 03 — FINANCIAL RATIOS
   ============================================================ */
registerTab({ id:"ratios", num:"03", group:"fundamentals", label:"Financial Ratios", render: renderRatiosTab });

function renderRatiosTab(el, d, ticker){
  const f = d.fin;
  const n = f.years.length;
  const roe = f.netIncome.map((ni,i)=> ni/f.equity[i]*100);
  const roa = f.netIncome.map((ni,i)=> ni/f.assets[i]*100);
  const roic = f.opIncome.map((oi,i)=> (oi*0.79)/(f.debt[i]+f.equity[i])*100); // after-tax NOPAT / invested capital, 21% tax approx
  const grossM = f.revenue.map((r,i)=> f.grossProfit[i]/r*100);
  const opM = f.revenue.map((r,i)=> f.opIncome[i]/r*100);
  const ebitdaM = f.revenue.map((r,i)=> f.ebitda[i]/r*100);
  const netM = f.revenue.map((r,i)=> f.netIncome[i]/r*100);
  // liquidity/efficiency approximations since we don't carry full current-asset/liability detail
  const currentRatio = f.assets.map((a,i)=> (a*0.42)/(f.liabilities[i]*0.38));
  const quickRatio = currentRatio.map(v=> v*0.78);
  const cashRatio = f.cash.map((c,i)=> c/(f.liabilities[i]*0.38));
  const assetTurnover = f.revenue.map((r,i)=> r/f.assets[i]);
  const debtEquity = f.debt.map((dd,i)=> dd/f.equity[i]);
  const debtEbitda = f.debt.map((dd,i)=> dd/f.ebitda[i]);
  const interestCoverage = f.opIncome.map((oi,i)=> oi/Math.max(f.debt[i]*0.045, 1));
  const fcfMargin = f.revenue.map((r,i)=> f.fcf[i]/r*100);
  const fcfYield = f.fcf.map(v=> v/(d.mcap*1000)*100);
  const cashConversion = f.netIncome.map((ni,i)=> f.ocf[i]/ni*100);

  const last = n-1;
  const kpi = (lbl,val,note)=>`<div class="stat-cell"><div class="lbl">${lbl}</div><div class="val">${val}</div>${note?`<div style="font-size:10px;color:var(--text-3);margin-top:2px;">${note}</div>`:""}</div>`;

  el.innerHTML = `
    <div class="section-head">
      <h3>Financial Ratios</h3>
      <p>Profitability, liquidity, efficiency, leverage, and cash-flow ratios, trended across the same five years, with the current (TTM) reading called out. Liquidity/efficiency ratios use approximated current-asset splits since only summarized balance-sheet lines are cached.</p>
    </div>

    <div class="card">
      <h4>Profitability — Current (TTM) <span class="tag">Snapshot</span></h4>
      <div class="stat-grid">
        ${kpi("ROE", fmtPct(roe[last]), "Net income ÷ equity")}
        ${kpi("ROA", fmtPct(roa[last]), "Net income ÷ assets")}
        ${kpi("ROIC (approx.)", fmtPct(roic[last]), "NOPAT ÷ invested capital")}
        ${kpi("Gross Margin", fmtPct(grossM[last]))}
        ${kpi("Operating Margin", fmtPct(opM[last]))}
        ${kpi("EBITDA Margin", fmtPct(ebitdaM[last]))}
        ${kpi("Net Margin", fmtPct(netM[last]))}
      </div>
      <div class="why-matters"><b>Why this matters</b><b>ROIC vs. WACC</b> is the single most important profitability check: if ROIC (Tab 04) exceeds the cost of capital, growth <i>creates</i> value; if not, growth <i>destroys</i> it, however fast revenue rises.</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">What each profitability metric means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>ROE</b> — Return on Equity. Net income ÷ shareholders' equity. Tells you how many cents of profit the company generates per dollar shareholders have invested. <span class="f">Higher generally = more efficient use of owners' capital, but very high ROE can also come from heavy debt (leverage), so pair it with Debt/Equity.</span></div>
          <div class="term"><b>ROA</b> — Return on Assets. Net income ÷ total assets. Shows how efficiently <i>all</i> capital (debt + equity) is used to generate profit, regardless of how it was financed. <span class="f">Useful for comparing companies with different capital structures.</span></div>
          <div class="term"><b>ROIC</b> — Return on Invested Capital. After-tax operating profit (NOPAT) ÷ (debt + equity). The cleanest read on core business profitability, stripped of financing choices. <span class="f">Compare it to WACC (Tab 05) — ROIC above WACC means the business creates value.</span></div>
          <div class="term"><b>Gross Margin</b> — Gross profit ÷ revenue. What's left after only the direct cost of producing the good or service (COGS). <span class="f">Reflects pricing power and production efficiency.</span></div>
          <div class="term"><b>Operating Margin</b> — Operating income ÷ revenue. What's left after COGS <i>and</i> operating expenses (R&amp;D, SG&amp;A), before interest and taxes. <span class="f">Shows how much of every sales dollar becomes profit from the core business.</span></div>
          <div class="term"><b>EBITDA Margin</b> — EBITDA ÷ revenue. Operating profitability before depreciation and amortization are subtracted. <span class="f">Useful for comparing capital-intensity-heavy companies, since D&amp;A accounting choices vary.</span></div>
          <div class="term"><b>Net Margin</b> — Net income ÷ revenue. The "bottom line" — profit left after every expense, interest, and tax. <span class="f">The final scorecard of a period's profitability, but can be swung by one-off items.</span></div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h4>Profitability Trend <span class="tag">%</span></h4>
        <div class="canvas-wrap"><canvas id="rat-profit-chart" data-h="220"></canvas></div>
      </div>
      <div class="card">
        <h4>Leverage &amp; Coverage <span class="tag">Ratio</span></h4>
        <div class="canvas-wrap"><canvas id="rat-lev-chart" data-h="220"></canvas></div>
        <div class="pin"><span class="mark">i</span><div><b>Debt/EBITDA</b> above ~4–5x (outside financials/utilities) usually signals meaningfully elevated credit risk — cross-check with Tab 15's Altman Z-score.</div></div>
        <div class="edu-box">
          <div class="edu-head"><span class="cap">Learn It</span><span class="t">Leverage &amp; coverage, explained</span></div>
          <div class="edu-glossary">
            <div class="term"><b>Debt/Equity</b> — Total debt ÷ shareholders' equity. How much the company relies on borrowed money versus owner capital. <span class="f">Higher = more financial risk, but also more upside for equity holders if the borrowed money earns more than it costs.</span></div>
            <div class="term"><b>Debt/EBITDA</b> — Total debt ÷ EBITDA. A rough "years of cash-flow-before-interest-and-tax it would take to pay off all debt." <span class="f">The ratio credit analysts and lenders watch most closely.</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h4>Liquidity, Efficiency &amp; Cash Flow — Current (TTM)</h4>
      <div class="stat-grid">
        ${kpi("Current Ratio", fmtNum(currentRatio[last]), "Current assets ÷ current liab.")}
        ${kpi("Quick Ratio", fmtNum(quickRatio[last]), "Excl. inventory")}
        ${kpi("Cash Ratio", fmtNum(cashRatio[last]))}
        ${kpi("Asset Turnover", fmtNum(assetTurnover[last])+"x", "Revenue ÷ assets")}
        ${kpi("Debt / Equity", fmtNum(debtEquity[last]))}
        ${kpi("Debt / EBITDA", fmtNum(debtEbitda[last])+"x")}
        ${kpi("Interest Coverage", fmtNum(interestCoverage[last])+"x", "EBIT ÷ est. interest")}
        ${kpi("FCF Margin", fmtPct(fcfMargin[last]))}
        ${kpi("FCF Yield", fmtPct(fcfYield[last]), "FCF ÷ market cap")}
        ${kpi("Cash Conversion", fmtPct(cashConversion[last]), "OCF ÷ net income")}
      </div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">What each liquidity, efficiency &amp; cash-flow metric means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>Current Ratio</b> — Current assets ÷ current liabilities. Can the company cover bills due within a year using assets it can turn into cash within a year? <span class="f">Above 1.0 is generally healthy; well above 2–3 may mean idle cash.</span></div>
          <div class="term"><b>Quick Ratio</b> — Like the Current Ratio, but excludes inventory (which can be slow or hard to sell fast). <span class="f">A stricter, more conservative liquidity test.</span></div>
          <div class="term"><b>Cash Ratio</b> — Cash &amp; equivalents ÷ current liabilities. The most conservative liquidity test — could the company pay short-term bills with cash on hand alone, right now? <span class="f">Rarely needs to be high; very low can be a red flag in a downturn.</span></div>
          <div class="term"><b>Asset Turnover</b> — Revenue ÷ total assets. How much sales the company generates per dollar of assets it owns. <span class="f">Higher = more efficient use of its asset base (common in retail); naturally lower in capital-heavy industries (utilities, telecom).</span></div>
          <div class="term"><b>Interest Coverage</b> — Operating income (EBIT) ÷ interest expense. How many times over the company could pay its interest bill from operating profit. <span class="f">Below ~2–3x is often considered risky.</span></div>
          <div class="term"><b>FCF Margin</b> — Free cash flow ÷ revenue. What share of every sales dollar turns into cash the company could actually distribute or reinvest. <span class="f">A "quality of earnings" check — persistent gaps versus net margin are worth investigating.</span></div>
          <div class="term"><b>FCF Yield</b> — Free cash flow ÷ market capitalization. Similar in spirit to a bond yield: how much cash the business generates each year relative to what you'd pay to own it today. <span class="f">Higher generally signals cheaper valuation, all else equal.</span></div>
          <div class="term"><b>Cash Conversion</b> — Operating cash flow ÷ net income. Checks whether reported profit is actually showing up as real cash. <span class="f">Persistently below 100% can flag aggressive accounting or working-capital strain; well above 100% is a good sign.</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h4>Full Ratio History <span class="tag">5Y + TTM</span></h4>
      <table class="data-table">
        <thead><tr><th style="text-align:left;">Ratio</th>${f.years.map(y=>`<th>${y}</th>`).join("")}</tr></thead>
        <tbody>
          ${statRow("ROE", roe, {pct:true})}
          ${statRow("ROA", roa, {pct:true})}
          ${statRow("ROIC (approx.)", roic, {pct:true})}
          ${statRow("Gross Margin", grossM, {pct:true})}
          ${statRow("Operating Margin", opM, {pct:true})}
          ${statRow("Net Margin", netM, {pct:true})}
          ${statRow("Current Ratio", currentRatio)}
          ${statRow("Debt/Equity", debtEquity)}
          ${statRow("Debt/EBITDA", debtEbitda)}
          ${statRow("FCF Margin", fcfMargin, {pct:true})}
        </tbody>
      </table>
    </div>
  `;

  drawLine(document.getElementById('rat-profit-chart'), f.years, [
    {name:"ROE", color:css('--accent'), values:roe},
    {name:"ROA", color:css('--info'), values:roa},
    {name:"ROIC", color:css('--positive'), values:roic}
  ], {yFmt:(v)=>v.toFixed(0)+"%"});

  drawBars(document.getElementById('rat-lev-chart'), f.years, [
    {name:"Debt/Equity", color:css('--negative'), values:debtEquity},
    {name:"Debt/EBITDA", color:css('--accent'), values:debtEbitda}
  ], {yFmt:(v)=>v.toFixed(1)+"x"});
}
</script>

<script>
/* ============================================================
   TAB 04 — GROWTH ANALYSIS
   ============================================================ */
registerTab({ id:"growth", num:"04", group:"fundamentals", label:"Growth Analysis", render: renderGrowthTab });

function renderGrowthTab(el, d, ticker){
  const f = d.fin; const n = f.years.length;
  const revCagr = cagr(f.revenue[0], f.revenue[n-1], n-1);
  const epsCagr = cagr(f.eps[0], f.eps[n-1], n-1);
  const fcfCagr = cagr(Math.max(f.fcf[0],1), Math.max(f.fcf[n-1],1), n-1);
  const bvps0 = (d.fin.equity[0])/(d.shares*1000), bvpsN = (d.fin.equity[n-1])/(d.shares*1000);
  const bvCagr = cagr(Math.max(bvps0,0.01), Math.max(bvpsN,0.01), n-1);
  const reinvestRate = f.capex.map((c,i)=> Math.abs(c)/Math.max(f.opIncome[i]*0.79,1)*100);
  const roicSeries = f.opIncome.map((oi,i)=> (oi*0.79)/(f.debt[i]+f.equity[i])*100);

  el.innerHTML = `
    <div class="section-head">
      <h3>Growth Analysis</h3>
      <p>Historical compounding across revenue, earnings, book value and free cash flow, plus a first look at growth <i>quality</i> via the reinvestment rate and ROIC.</p>
    </div>
    <div class="card">
      <h4>Historical CAGR <span class="tag">${f.years[0]} → ${f.years[n-1]}</span></h4>
      <div class="stat-grid">
        ${statCell("Revenue CAGR", fmtPct(revCagr))}
        ${statCell("EPS CAGR", fmtPct(epsCagr))}
        ${statCell("FCF CAGR", fmtPct(fcfCagr))}
        ${statCell("Book Value/Share CAGR", fmtPct(bvCagr))}
      </div>
      <div class="mjx-block">$$ CAGR = \\left(\\frac{V_{end}}{V_{start}}\\right)^{\\frac{1}{n}} - 1 $$</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Symbols</span><span class="t">What each symbol in the equation means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>V<sub>end</sub></b> — the metric's value at the <i>end</i> of the period (e.g., this year's revenue, EPS, or book value/share).</div>
          <div class="term"><b>V<sub>start</sub></b> — the metric's value at the <i>start</i> of the period (the earliest year shown).</div>
          <div class="term"><b>n</b> — the number of years between start and end (the number of compounding periods).</div>
          <div class="term"><b>CAGR</b> — the single constant annual growth rate solved for; expressed as a decimal (multiply by 100 for %).</div>
        </div>
      </div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Learn It</span><span class="t">What CAGR means, in plain terms</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>CAGR</b> — Compound Annual Growth Rate. The single, smoothed annual growth rate that, applied every year, would take the starting value to the ending value. <span class="f">It smooths out year-to-year noise — useful for comparing long-run trends, but it hides volatility along the way.</span></div>
          <div class="term"><b>Revenue CAGR</b> — How fast total sales have compounded. <span class="f">The top-line growth engine every other metric below ultimately depends on.</span></div>
          <div class="term"><b>EPS CAGR</b> — How fast diluted earnings per share have compounded. <span class="f">Can outpace revenue CAGR via margin expansion or buybacks — or lag it if shares are being issued.</span></div>
          <div class="term"><b>FCF CAGR</b> — How fast free cash flow has compounded. <span class="f">The growth rate that most directly feeds the DCF model in Tab 05.</span></div>
          <div class="term"><b>Book Value/Share CAGR</b> — How fast per-share net worth (equity ÷ shares) has compounded, mainly through retained earnings. <span class="f">A slower, steadier growth measure — relevant for the Residual Income model (Tab 08).</span></div>
        </div>
      </div>
    </div>
    <div class="grid-2">
      <div class="card">
        <h4>Reinvestment Rate vs. ROIC <span class="tag">%</span></h4>
        <div class="canvas-wrap"><canvas id="gr-reinv-chart" data-h="220"></canvas></div>
        <div class="why-matters"><b>Why this matters</b>Growth only creates value when <b>ROIC &gt; WACC</b>. A rising reinvestment rate paired with falling ROIC is a warning sign of low-quality, value-destroying growth.</div>
        <div class="edu-box">
          <div class="edu-head"><span class="cap">Learn It</span><span class="t">Reinvestment Rate &amp; ROIC</span></div>
          <div class="edu-glossary">
            <div class="term"><b>Reinvestment Rate</b> — CapEx (as a proxy) ÷ after-tax operating profit. The share of profit being plowed back into the business rather than paid out or held as cash. <span class="f">A higher rate only helps shareholders if it's reinvested at a good return — see ROIC.</span></div>
            <div class="term"><b>ROIC</b> — see the profitability glossary in Tab 03. Here it's tracked over time to judge whether growth has been getting more or less efficient.</div>
          </div>
        </div>
      </div>
      <div class="card">
        <h4>Coming Next in This Module</h4>
        <div class="placeholder-module">
          <div class="stamp">Scaffold Ready</div>
          <div>Rolling CAGR windows, dividend growth &amp; buyback trend, CAPEX/R&amp;D as % of revenue, and organic-vs-acquisition growth decomposition. Each can be patched in independently — the data schema (<span class="mono">d.fin</span>) already carries everything needed except a buyback/dividend history line, which can be added to <span class="mono">SAMPLE_DB</span> per ticker.</div>
        </div>
      </div>
    </div>
  `;
  drawLine(document.getElementById('gr-reinv-chart'), f.years, [
    {name:"Reinvestment Rate", color:css('--accent'), values:reinvestRate},
    {name:"ROIC", color:css('--positive'), values:roicSeries}
  ], {yFmt:(v)=>v.toFixed(0)+"%"});
}
</script>

<script>
/* ============================================================
   TAB 05 — DISCOUNTED CASH FLOW (FCFF / FCFE)
   ============================================================ */
registerTab({ id:"dcf", num:"05", group:"valuation", label:"DCF Valuation", render: renderDCFTab });

const DCF_STATE = { years:5, growth:8, termGrowth:2.5, wacc:9, taxRate:21, capexPctRev:6, method:"gordon", scenario:"base" };

function computeDCF(d, state){
  const f = d.fin;
  const baseFCF = f.fcf[f.fcf.length-1]; // TTM FCF, $M
  const scenarioAdj = { bear:-0.35, base:0, bull:0.35 }[state.scenario];
  const g = (state.growth/100) * (1+scenarioAdj);
  const term = state.termGrowth/100;
  const wacc = state.wacc/100;
  const n = state.years;
  let flows = [], pv = [];
  let cf = baseFCF;
  for(let i=1;i<=n;i++){
    cf = cf*(1+g*(1 - (i-1)/(n*1.6))); // gently fade growth toward terminal over the forecast
    flows.push(cf);
    pv.push(cf/Math.pow(1+wacc,i));
  }
  let tv;
  if (state.method==="gordon"){
    tv = flows[n-1]*(1+term)/(wacc-term);
  } else {
    const exitMultiple = 12; // EV/EBITDA-style exit multiple assumption
    tv = (f.ebitda[f.ebitda.length-1]*Math.pow(1+g,n)) * exitMultiple/1000*1000; // keep in $M scale
  }
  const pvTV = tv/Math.pow(1+wacc,n);
  const ev = pv.reduce((a,b)=>a+b,0) + pvTV;
  const equityValue = ev - (d.fin.debt[d.fin.debt.length-1]) + (d.fin.cash[d.fin.cash.length-1]);
  const perShare = equityValue/(d.shares*1000);
  return { flows, pv, tv, pvTV, ev, equityValue, perShare, baseFCF, g, wacc, term };
}

function renderDCFTab(el, d, ticker){
  el.innerHTML = `
    <div class="section-head">
      <h3>Discounted Cash Flow Valuation</h3>
      <p>Projects Free Cash Flow to the Firm (FCFF) forward, discounts it at the Weighted Average Cost of Capital (WACC), and adds a terminal value. Every assumption below is editable — this is meant to be played with, not just read.</p>
    </div>

    <div class="card">
      <h4>Model &amp; Formulas <span class="tag">Theory</span></h4>
      <div class="mjx-block">$$ EV = \\sum_{t=1}^{n} \\frac{FCFF_t}{(1+WACC)^t} + \\frac{TV_n}{(1+WACC)^n} $$</div>
      <div class="mjx-block">$$ TV_n^{Gordon} = \\frac{FCFF_n (1+g_{\\infty})}{WACC - g_{\\infty}} \\qquad TV_n^{Exit} = EBITDA_n \\times \\text{Exit Multiple} $$</div>
      <div class="mjx-block">$$ \\text{Equity Value} = EV - \\text{Net Debt} \\qquad \\text{Intrinsic Value / Share} = \\frac{\\text{Equity Value}}{\\text{Diluted Shares Outstanding}} $$</div>
      <div class="edu-box">
        <div class="edu-head"><span class="cap">Symbols</span><span class="t">What each symbol in the equations means</span></div>
        <div class="edu-glossary cols-2">
          <div class="term"><b>EV</b> — Enterprise Value, the sum of all discounted cash flows plus the discounted terminal value; the total value of the operating business, belonging to debt and equity holders combined.</div>
          <div class="term"><b>t</b> — the year of the forecast being discounted (t = 1, 2, 3…), counted from today.</div>
          <div class="term"><b>n</b> — the total number of years in the explicit forecast horizon before the terminal value takes over.</div>
          <div class="term"><b>FCFF<sub>t</sub></b> — Free Cash Flow to the Firm projected for year t (unlevered cash flow, before financing effects).</div>
          <div class="term"><b>WACC</b> — Weighted Average Cost of Capital; the discount rate blending the required return of both lenders and shareholders.</div>
          <div class="term"><b>TV<sub>n</sub></b> — Terminal Value as of year n; the lump-sum value of every cash flow beyond the explicit forecast.</div>
          <div class="term"><b>FCFF<sub>n</sub></b> — the final year's projected Free Cash Flow to the Firm, used as the base for the terminal value.</div>
          <div class="term"><b>g<sub>∞</sub></b> — the terminal (perpetual) growth rate assumed for cash flows after year n, forever.</div>
          <div class="term"><b>EBITDA<sub>n</sub></b> — EBITDA in the final forecast year, used as the base for the Exit Multiple method of terminal value.</div>
          <div class="term"><b>Exit Multiple</b> — an assumed EV/EBITDA multiple a buyer might pay for the business at the end of year n, based on comparable transactions.</div>
          <div class="term"><b>Net Debt</b> — total debt minus cash &amp; equivalents; subtracted from EV because lenders are paid before shareholders.</div>
          <div class="term"><b>Diluted Shares Outstanding</b> — total shares including the effect of options/convertibles; the denominator that turns Equity Value into a per-share price.</div>
        </div>
      </div>
      <div class="pin"><span class="mark">i</span><div><b>FCFF</b> (unlevered) belongs with <b>WACC</b> and gives Enterprise Value. <b>FCFE</b> (levered, after interest &amp; debt paydown) belongs with the <b>cost of equity</b> and gives Equity Value directly — never mix the two discount rates with the wrong cash flow.</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h4>Assumptions <span class="tag">Editable</span></h4>
        <div class="slider-row"><label>Forecast horizon (yrs)</label><input type="range" id="dcf-years" min="5" max="10" step="1" value="${DCF_STATE.years}"><span class="sval" id="v-years">${DCF_STATE.years}</span></div>
        <div class="slider-row"><label>FCF growth rate, Yr 1 (%)</label><input type="range" id="dcf-growth" min="-5" max="30" step="0.5" value="${DCF_STATE.growth}"><span class="sval" id="v-growth">${DCF_STATE.growth}%</span></div>
        <div class="slider-row"><label>Terminal growth g∞ (%)</label><input type="range" id="dcf-term" min="0" max="5" step="0.1" value="${DCF_STATE.termGrowth}"><span class="sval" id="v-term">${DCF_STATE.termGrowth}%</span></div>
        <div class="slider-row"><label>WACC / discount rate (%)</label><input type="range" id="dcf-wacc" min="4" max="16" step="0.25" value="${DCF_STATE.wacc}"><span class="sval" id="v-wacc">${DCF_STATE.wacc}%</span></div>
        <div class="slider-row"><label>Terminal value method</label>
          <select id="dcf-method" style="flex:1; background:var(--bg-2); color:var(--text-0); border:1px solid var(--border); border-radius:6px; padding:6px;">
            <option value="gordon" ${DCF_STATE.method==='gordon'?'selected':''}>Gordon Growth</option>
            <option value="exit" ${DCF_STATE.method==='exit'?'selected':''}>Exit Multiple (12x EBITDA)</option>
          </select>
        </div>
        <div class="slider-row"><label>Scenario</label>
          <select id="dcf-scenario" style="flex:1; background:var(--bg-2); color:var(--text-0); border:1px solid var(--border); border-radius:6px; padding:6px;">
            <option value="bear" ${DCF_STATE.scenario==='bear'?'selected':''}>Bear</option>
            <option value="base" ${DCF_STATE.scenario==='base'?'selected':''}>Base</option>
            <option value="bull" ${DCF_STATE.scenario==='bull'?'selected':''}>Bull</option>
          </select>
        </div>
        <div class="why-matters"><b>Common mistake</b>Setting terminal growth above long-run GDP/inflation (~2–3%) implies the company eventually becomes the entire economy. Keep g∞ conservative — the terminal value is typically 60–80% of total EV, so it deserves the most scrutiny, not the least.</div>
      </div>
      <div class="card">
        <h4>Valuation Output <span class="tag">Live</span></h4>
        <div id="dcf-output"></div>
      </div>
    </div>

    <div class="card">
      <h4>Projection &amp; Cash Flow Waterfall <span class="tag">$M</span></h4>
      <div class="canvas-wrap"><canvas id="dcf-waterfall" data-h="240"></canvas></div>
    </div>

    <div class="card">
      <h4>Projection Table</h4>
      <table class="data-table" id="dcf-table"></table>
    </div>

    <div class="valuation-explainer">
      <div class="edu-head"><span class="cap">Learn It</span><span class="t">Understanding the DCF model, step by step</span></div>
      <h5>What it's doing</h5>
      <p style="margin:0; font-size:12.5px; color:var(--text-1); line-height:1.6;">A Discounted Cash Flow model says a business is worth the cash it will hand its owners in the future — adjusted for the fact that a dollar next year is worth less than a dollar today (time value of money and risk).</p>
      <div class="vx-grid">
        <div class="vx-cell"><b>FCFF (Free Cash Flow to the Firm)</b>Cash generated by operations after reinvestment needs (CapEx), before paying lenders or shareholders — the cash "the whole company" produces, regardless of who financed it.</div>
        <div class="vx-cell"><b>WACC (Weighted Average Cost of Capital)</b>The blended annual return that both lenders and shareholders require for the risk they're taking. It's the discount rate that converts future dollars into today's dollars.</div>
        <div class="vx-cell"><b>Terminal Value</b>Since a company can't be forecast line-by-line forever, everything beyond the explicit forecast window is captured in one lump-sum value, using either steady long-run growth (Gordon Growth) or a comparable-company exit multiple.</div>
        <div class="vx-cell"><b>Enterprise Value → Equity Value</b>Enterprise Value belongs to everyone who financed the company (debt + equity). Subtracting net debt isolates what's left for shareholders — Equity Value — which, divided by shares outstanding, gives an intrinsic price per share.</div>
      </div>
      <h5 style="margin-top:12px;">How to read the output</h5>
      <ol>
        <li>Compare "Intrinsic Value / Share" to the current market price — a large gap either way is only meaningful if the assumptions behind it are reasonable.</li>
        <li>Always sanity-check the discount rate and terminal growth first (Tab 12) — small changes there move the answer far more than most people expect.</li>
        <li>Treat the output as a range of plausible values (via Bear/Base/Bull), not a single precise number.</li>
      </ol>
    </div>
  `;

  function refresh(){
    ['years','growth','term','wacc'].forEach(k=>{});
    DCF_STATE.years = +document.getElementById('dcf-years').value;
    DCF_STATE.growth = +document.getElementById('dcf-growth').value;
    DCF_STATE.termGrowth = +document.getElementById('dcf-term').value;
    DCF_STATE.wacc = +document.getElementById('dcf-wacc').value;
    DCF_STATE.method = document.getElementById('dcf-method').value;
    DCF_STATE.scenario = document.getElementById('dcf-scenario').value;
    document.getElementById('v-years').textContent = DCF_STATE.years;
    document.getElementById('v-growth').textContent = DCF_STATE.growth+"%";
    document.getElementById('v-term').textContent = DCF_STATE.termGrowth+"%";
    document.getElementById('v-wacc').textContent = DCF_STATE.wacc+"%";

    const r = computeDCF(d, DCF_STATE);
    const upside = pctChange(r.perShare, d.price);
    const upClass = upside>=0 ? 'up':'down';
    document.getElementById('dcf-output').innerHTML = `
      <div class="stat-grid">
        ${statCell("Enterprise Value", fmtBil(r.ev/1000))}
        ${statCell("Equity Value", fmtBil(r.equityValue/1000))}
        ${statCell("Intrinsic Value / Share", fmtPx(r.perShare))}
        ${statCell("Current Market Price", fmtPx(d.price))}
        ${statCell("Implied Upside/Downside", `<span class="chg ${upClass}">${upside>=0?'+':''}${upside.toFixed(1)}%</span>`)}
        ${statCell("Margin of Safety", fmtPct(100*(r.perShare-d.price)/r.perShare))}
      </div>
      <div style="margin-top:10px;"><span class="badge-pill ${upside>10?'buy':upside<-10?'sell':'hold'}">${upside>10?'Undervalued':upside<-10?'Overvalued':'Near Fair Value'}</span></div>
    `;

    const cats = r.flows.map((_,i)=>"Yr "+(i+1));
    drawBars(document.getElementById('dcf-waterfall'), cats.concat(["Terminal PV"]),
      [{name:"PV of Cash Flow", color:css('--accent'), values:r.pv.concat([r.pvTV])}]);

    const tbl = document.getElementById('dcf-table');
    tbl.innerHTML = `<thead><tr><th style="text-align:left;">Year</th>${cats.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
      <tbody>
        <tr><td class="lbl">Projected FCFF ($M)</td>${r.flows.map(v=>`<td>${fmtB(v)}</td>`).join("")}</tr>
        <tr><td class="lbl">Discount Factor</td>${r.flows.map((_,i)=>`<td>${(1/Math.pow(1+DCF_STATE.wacc/100,i+1)).toFixed(3)}</td>`).join("")}</tr>
        <tr><td class="lbl">PV of FCFF ($M)</td>${r.pv.map(v=>`<td>${fmtB(v)}</td>`).join("")}</tr>
      </tbody>`;

   if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([document.getElementById('panel-dcf')]);
  }

  ['dcf-years','dcf-growth','dcf-term','dcf-wacc','dcf-method','dcf-scenario'].forEach(id=>{
    document.getElementById(id).addEventListener('input', refresh);
    document.getElementById(id).addEventListener('change', refresh);
  });
  refresh();
}
</script>
