<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Laboratory — Learn Finance by Experimenting</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  },
  svg: { fontCache: 'global' }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

<style>
:root{
  --bg-0:#08110d;
  --bg-1:#0e1a14;
  --panel:#122019;
  --panel-2:#16261d;
  --line:#24382c;
  --ledger:#1a2b21;
  --gold:#c9a24b;
  --gold-bright:#e6c368;
  --emerald:#2fae7a;
  --emerald-bright:#3fd69a;
  --loss:#d9614f;
  --text-0:#eef3ee;
  --text-1:#a9bcae;
  --text-2:#6c8274;
  --font-display:'Orbitron', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(180deg, var(--bg-0), var(--bg-1) 60%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(201,162,75,0.035) 40px);
  color:var(--text-0);
  font-family:var(--font-mono);
  min-height:100vh;
}

/* ---------- Header ---------- */
.hero{
  padding:30px 24px 16px;
  text-align:center;
  position:relative;
}
.hero::before{
  content:"";
  position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(47,174,122,0.14), transparent 60%);
  pointer-events:none;
}
.eyebrow{
  font-family:var(--font-mono);
  letter-spacing:0.35em;
  font-size:11px;
  color:var(--emerald-bright);
  text-transform:uppercase;
}
h1.title{
  font-family:var(--font-display);
  font-weight:900;
  font-size:clamp(26px,4.5vw,42px);
  letter-spacing:0.04em;
  margin:8px 0 4px;
  background:linear-gradient(90deg, var(--gold-bright), var(--emerald-bright));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.subtitle{
  color:var(--text-1);
  font-style:italic;
  font-size:13px;
}

/* ---------- Top tab bar (left to right) ---------- */
.topbar-wrap{
  position:sticky; top:0; z-index:50;
  background:var(--bg-0);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.topbar{
  display:flex;
  flex-wrap:wrap;
  max-width:1280px;
  margin:0 auto;
}
.tab-btn{
  flex:0 0 auto;
  padding:10px 16px 8px;
  cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;
  transition:background .15s ease, border-color .15s ease;
}
.tab-btn:hover{background:var(--panel);}
.tab-btn.active{
  background:var(--panel);
  border-bottom-color:var(--emerald-bright);
}
.tab-btn.disabled{opacity:0.38;}
.tab-num{
  font-family:var(--font-display);
  font-size:9px;
  color:var(--text-2);
  letter-spacing:0.08em;
}
.tab-name{
  font-family:var(--font-display);
  font-size:11.5px;
  font-weight:700;
  color:var(--text-0);
  margin-top:1px;
}
.tab-btn.active .tab-name{color:var(--gold-bright);}
.tab-dot{
  display:inline-block; width:5px; height:5px; border-radius:50%;
  margin-left:5px; vertical-align:middle;
}
.tab-dot.ready{background:var(--emerald-bright);}
.tab-dot.pending{background:var(--text-2);}

/* ---------- Sub tab bar (Theory / Solution / Simulation) ---------- */
.subbar{
  display:flex; gap:2px;
  max-width:1280px;
  margin:18px auto 0;
  padding:0 20px;
}
.subtab-btn{
  padding:9px 20px;
  font-family:var(--font-display);
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-1);
  background:var(--panel);
  border:1px solid var(--line);
  border-bottom:none;
  border-radius:4px 4px 0 0;
  cursor:pointer;
}
.subtab-btn.active{
  color:var(--bg-0);
  background:var(--emerald-bright);
  border-color:var(--emerald-bright);
}
.subtab-btn.disabled{opacity:0.4; cursor:default;}

/* ---------- Stage ---------- */
.stage{
  max-width:1280px;
  margin:0 auto;
  padding:0 20px 60px;
}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:0 3px 3px 3px;
  padding:26px;
}
.panel h2{
  font-family:var(--font-display);
  font-size:20px;
  margin:0 0 4px;
  color:var(--gold-bright);
}
.panel .desc{color:var(--text-1); font-size:13px; margin-bottom:22px; max-width:76ch;}

.placeholder{
  text-align:center;
  padding:60px 20px;
  color:var(--text-2);
}
.placeholder .big{
  font-family:var(--font-display);
  font-size:14px;
  color:var(--text-1);
  letter-spacing:0.06em;
  margin-bottom:8px;
}
.badge{
  display:inline-block;
  border:1px solid var(--line);
  color:var(--text-2);
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  padding:3px 9px;
  border-radius:20px;
  margin-top:10px;
}

/* ---------- Theory / Solution content blocks ---------- */
.theory-block{max-width:76ch;}
.theory-block h3{
  font-family:var(--font-display); font-size:14px; color:var(--emerald-bright);
  margin:22px 0 8px;
}
.theory-block p{color:var(--text-1); font-size:13.5px; line-height:1.7;}
.formula-box{
  background:var(--ledger); border:1px solid var(--line); border-radius:3px;
  padding:14px 16px; font-size:14px; color:var(--text-0); overflow-x:auto;
  margin:14px 0;
}
.footnote{font-size:11px; color:var(--text-2); margin-top:8px; line-height:1.5;}

.worked-table{width:100%; border-collapse:collapse; font-size:12.5px; margin:14px 0;}
.worked-table th, .worked-table td{
  border-bottom:1px solid var(--line); padding:7px 10px; text-align:right;
}
.worked-table th{color:var(--text-2); text-transform:uppercase; font-size:10px; letter-spacing:0.06em;}
.worked-table td:first-child, .worked-table th:first-child{text-align:left; color:var(--text-1);}
.worked-table td.gold{color:var(--gold-bright);}
.worked-table td.emerald{color:var(--emerald-bright);}

.solution-summary{
  background:var(--ledger); border-left:3px solid var(--emerald-bright);
  border-radius:2px; padding:12px 16px; font-size:13px; color:var(--text-1);
  margin-top:16px; line-height:1.7;
}

.glossary{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:3px;
  padding:14px 18px;
  margin:16px 0 22px;
}
.glossary .glossary-title{
  font-family:var(--font-display);
  font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--text-2); margin-bottom:10px;
}
.glossary dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px;}
.glossary dt{
  font-family:var(--font-mono); font-weight:700; color:var(--gold-bright);
  white-space:nowrap;
}
.glossary dd{margin:0; color:var(--text-1); font-size:13px; line-height:1.6;}

/* ---------- Simulation layout ---------- */
.lab-grid{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:24px;
}
@media (max-width:820px){ .lab-grid{grid-template-columns:1fr;} }

.controls{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:3px;
  padding:18px;
  align-self:start;
}
.ctrl{margin-bottom:18px;}
.ctrl label{
  display:flex; justify-content:space-between;
  font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--text-1); margin-bottom:6px;
}
.ctrl label .val{color:var(--emerald-bright); font-weight:700;}
input[type=range]{
  width:100%; -webkit-appearance:none; height:4px;
  background:var(--line); border-radius:2px; outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background:var(--gold-bright); cursor:pointer; border:2px solid var(--bg-0);
}
.toggle-row{
  display:flex; align-items:center; gap:8px;
  font-size:12px; color:var(--text-1);
  margin-top:4px;
}
.toggle-row input{accent-color:var(--emerald-bright);}

.stats{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin-top:20px;
}
.stat{
  background:var(--ledger); border:1px solid var(--line);
  padding:10px 12px; border-radius:2px;
}
.stat .k{font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-2);}
.stat .v{font-family:var(--font-display); font-size:16px; color:var(--gold-bright); margin-top:3px;}
.stat .v.loss{color:var(--loss);}
.stat .v.gain{color:var(--emerald-bright);}

.viz-col{display:flex; flex-direction:column; gap:18px;}

.stack-wrap{
  background:var(--ledger);
  border:1px solid var(--line);
  border-radius:3px;
  padding:16px;
  min-height:170px;
  position:relative;
  overflow:hidden;
}
.stack-row{display:flex; align-items:flex-end; gap:6px; height:150px;}
.stack-year{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  height:100%; position:relative;
}
.bar{width:100%; border-radius:2px 2px 0 0; transition:height .5s cubic-bezier(.2,.8,.3,1);}
.bar.actual{background:linear-gradient(180deg, var(--gold-bright), var(--gold)); position:absolute; bottom:0; left:0; right:0; z-index:2;}
.bar.real{background:linear-gradient(180deg, rgba(63,214,154,0.55), rgba(63,214,154,0.25)); position:absolute; bottom:0; left:0; right:0; z-index:1;}
.stack-yr-label{font-size:8px; color:var(--text-2); margin-top:4px;}

.legend{display:flex; gap:16px; font-size:11px; color:var(--text-1); margin-top:8px;}
.legend span{display:flex; align-items:center; gap:5px;}
.swatch{width:10px; height:10px; border-radius:2px; display:inline-block;}

#graph-tvm{width:100%; height:340px;}

.data-note{
  border:1px dashed var(--line);
  border-radius:3px;
  padding:10px 14px;
  font-size:11px;
  color:var(--text-2);
  margin-top:10px;
  line-height:1.6;
}
.data-note b{color:var(--text-1);}

/* ---------- Lab 03: item price rows ---------- */
.wallet-banner{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--ledger); border:1px solid var(--gold);
  border-radius:3px; padding:10px 16px; margin-bottom:14px;
}
.wallet-banner .wl-label{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-2);}
.wallet-banner .wl-value{font-family:var(--font-display); font-size:18px; color:var(--gold-bright);}
.item-rows{display:flex; flex-direction:column; gap:12px;}
.item-row{background:var(--ledger); border:1px solid var(--line); border-radius:3px; padding:10px 14px;}
.item-row-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px;}
.item-row-top .item-name{color:var(--text-0); font-weight:700;}
.item-row-top .item-price{font-family:var(--font-display); color:var(--emerald-bright);}
.item-track{position:relative; height:8px; background:var(--panel); border-radius:4px; overflow:visible;}
.item-fill{
  position:absolute; top:0; left:0; height:100%; border-radius:4px;
  background:linear-gradient(90deg, var(--emerald), var(--loss));
  transition:width .5s cubic-bezier(.2,.8,.3,1);
}
.item-afford{font-size:10px; color:var(--text-2); margin-top:5px;}
#graph-inf{width:100%; height:340px;}

/* ---------- Lab 04: loan payment split visualization ---------- */
.split-bar-track{
  position:relative; height:22px; background:var(--panel);
  border-radius:4px; overflow:hidden; display:flex;
}
.split-fill{height:100%; transition:width .5s cubic-bezier(.2,.8,.3,1);}
.split-fill.principal{background:linear-gradient(90deg, var(--emerald), var(--emerald-bright));}
.split-fill.interest{background:linear-gradient(90deg, var(--loss), #ef8878);}
.split-bar-labels{display:flex; justify-content:space-between; font-size:10px; color:var(--text-2); margin-top:4px;}
.split-bar-labels .principal-lbl{color:var(--emerald-bright);}
.split-bar-labels .interest-lbl{color:var(--loss);}
#graph-loan-pie{width:100%; height:280px;}
#graph-loan-stack{width:100%; height:300px;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(5,10,7,0.75);
  display:none; align-items:center; justify-content:center; z-index:999;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--panel-2); border:1px solid var(--gold); border-radius:4px;
  padding:22px 26px; max-width:380px; text-align:center;
}
.modal-box p{color:var(--text-1); font-size:13px;}
.modal-box button{
  margin-top:14px; background:var(--emerald); color:#052018; border:none;
  padding:8px 18px; border-radius:20px; font-family:var(--font-mono); font-weight:700;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">Learn Finance by Experimenting</div>
  <h1 class="title">FINANCE LABORATORY</h1>
</div>

<div class="topbar-wrap">
  <div class="topbar" id="topbar"></div>
</div>

<div class="subbar" id="subbar"></div>

<div class="stage">
  <div class="panel" id="stage-panel"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <p id="modal-text"></p>
    <button onclick="closeModal()">OK</button>
  </div>
</div>

<script>
/* =========================================================
   FINANCE LABORATORY — Step 1 skeleton (v2)
   Structure: top-level tabs (left to right) = 20 labs.
   Each lab has 3 fixed subtabs: Theory / Solution / Simulation.
   Subtab CONTENT is lab-specific (renderTheoryN / renderSolutionN /
   renderSimulationN); the subtab SHELL is identical across all 20,
   built once here (skeleton-first, matches physics-suite pattern).

   House rules carried over from the physics suite:
   - Tab/subtab switching via onclick string args (Google Sites safe)
   - No window.alert() — custom modal overlay
   - No data-* attributes for state — plain JS objects
   - KaTeX auto-render fired once per render, guarded
   - Plotly calls wrapped in try/catch (CDN can be blocked in sandboxed embeds)
   ========================================================= */

const LABS = [
  {id:1,  name:"Time Value of Money",      ready:true},
  {id:2,  name:"Compound Interest",        ready:true},
  {id:3,  name:"Inflation Simulator",      ready:true},
  {id:4,  name:"Loan & Mortgage",          ready:true},
  {id:5,  name:"Savings vs Investing",     ready:true},
  {id:6,  name:"Stock Market Sim",         ready:true},
  {id:7,  name:"Supply & Demand",          ready:true},
  {id:8,  name:"Central Bank Sim",         ready:true},
  {id:9,  name:"Inflation vs Interest",    ready:true},
  {id:10, name:"Currency Exchange",        ready:true},
  {id:11, name:"Bond Pricing",             ready:true},
{id:12, name:"Risk vs Return",           ready:true},
{id:13, name:"Budget Simulator",         ready:true},
{id:14, name:"Business Simulator",       ready:true},
{id:15, name:"Retirement Planner",       ready:true},
{id:16, name:"Tax Simulator",            ready:true},
{id:17, name:"Portfolio Diversification",ready:true},
{id:18, name:"Financial Crisis Sim",     ready:true},
{id:19, name:"Economic Dashboard",       ready:true},
{id:20, name:"Financial Game",           ready:true},
];

const SUBTABS = ["theory","solution","simulation"];
const SUBTAB_LABELS = {theory:"Theory", solution:"Solution", simulation:"Simulation"};

let currentLab = 1;
let currentSub = "theory";

/* ---------- Top tab bar ---------- */
function buildTopbar(){
  const bar = document.getElementById('topbar');
  bar.innerHTML = '';
  LABS.forEach(lab=>{
    const btn = document.createElement('div');
    btn.className = 'tab-btn' + (lab.id===currentLab ? ' active':'') + (!lab.ready ? ' disabled':'');
    btn.id = 'tab-btn-'+lab.id;
    btn.innerHTML = `
      <div class="tab-num">LAB ${String(lab.id).padStart(2,'0')}</div>
      <div class="tab-name">${lab.name}<span class="tab-dot ${lab.ready?'ready':'pending'}"></span></div>
    `;
    btn.onclick = function(){ selectLab(lab.id); };
    bar.appendChild(btn);
  });
}

/* ---------- Subtab bar ---------- */
function buildSubbar(){
  const bar = document.getElementById('subbar');
  bar.innerHTML = '';
  const lab = LABS.find(l=>l.id===currentLab);
  SUBTABS.forEach(key=>{
    const btn = document.createElement('div');
    btn.className = 'subtab-btn' + (key===currentSub ? ' active':'') + (!lab.ready ? ' disabled':'');
    btn.id = 'subtab-btn-'+key;
    btn.textContent = SUBTAB_LABELS[key];
    btn.onclick = function(){ selectSubtab(key); };
    bar.appendChild(btn);
  });
}

function selectLab(id){
  currentLab = id;
  currentSub = "theory";
  document.querySelectorAll('.tab-btn').forEach(c=>c.classList.remove('active'));
  const btn = document.getElementById('tab-btn-'+id);
  if(btn) btn.classList.add('active');
  buildSubbar();
  renderStage();
}

function selectSubtab(key){
  currentSub = key;
  document.querySelectorAll('.subtab-btn').forEach(c=>c.classList.remove('active'));
  const btn = document.getElementById('subtab-btn-'+key);
  if(btn) btn.classList.add('active');
  renderStage();
}

function renderStage(){
  const lab = LABS.find(l=>l.id===currentLab);
  if(!lab.ready){
    renderPlaceholder(lab);
    renderMath();
    return;
  }
  if(currentLab===1){
    if(currentSub==='theory') renderTheory1();
    if(currentSub==='solution') renderSolution1();
    if(currentSub==='simulation') renderSimulation1();
  }
  if(currentLab===2){
    if(currentSub==='theory') renderTheory2();
    if(currentSub==='solution') renderSolution2();
    if(currentSub==='simulation') renderSimulation2();
  }
  if(currentLab===3){
    if(currentSub==='theory') renderTheory3();
    if(currentSub==='solution') renderSolution3();
    if(currentSub==='simulation') renderSimulation3();
  }
  if(currentLab===4){
    if(currentSub==='theory') renderTheory4();
    if(currentSub==='solution') renderSolution4();
    if(currentSub==='simulation') renderSimulation4();
  }
  if(currentLab===5){
    if(currentSub==='theory') renderTheory5();
    if(currentSub==='solution') renderSolution5();
    if(currentSub==='simulation') renderSimulation5();
  }
  if(currentLab===6){
    if(currentSub==='theory') renderTheory6();
    if(currentSub==='solution') renderSolution6();
    if(currentSub==='simulation') renderSimulation6();
  }
  if(currentLab===7){
    if(currentSub==='theory') renderTheory7();
    if(currentSub==='solution') renderSolution7();
    if(currentSub==='simulation') renderSimulation7();
  }
  if(currentLab===8){
    if(currentSub==='theory') renderTheory8();
    if(currentSub==='solution') renderSolution8();
    if(currentSub==='simulation') renderSimulation8();
  }
  if(currentLab===9){
    if(currentSub==='theory') renderTheory9();
    if(currentSub==='solution') renderSolution9();
    if(currentSub==='simulation') renderSimulation9();
  }
  if(currentLab===10){
    if(currentSub==='theory') renderTheory10();
    if(currentSub==='solution') renderSolution10();
    if(currentSub==='simulation') renderSimulation10();
  }
    if(currentLab===11){
    if(currentSub==='theory') renderTheory11();
    if(currentSub==='solution') renderSolution11();
    if(currentSub==='simulation') renderSimulation11();
  }
  if(currentLab===12){
    if(currentSub==='theory') renderTheory12();
    if(currentSub==='solution') renderSolution12();
    if(currentSub==='simulation') renderSimulation12();
  }
    if(currentLab===13){
    if(currentSub==='theory') renderTheory13();
    if(currentSub==='solution') renderSolution13();
    if(currentSub==='simulation') renderSimulation13();
  }
    if(currentLab===14){
    if(currentSub==='theory') renderTheory14();
    if(currentSub==='solution') renderSolution14();
    if(currentSub==='simulation') renderSimulation14();
  }
    if(currentLab===15){
    if(currentSub==='theory') renderTheory15();
    if(currentSub==='solution') renderSolution15();
    if(currentSub==='simulation') renderSimulation15();
  }
    if(currentLab===16){
    if(currentSub==='theory') renderTheory16();
    if(currentSub==='solution') renderSolution16();
    if(currentSub==='simulation') renderSimulation16();
  }
    if(currentLab===17){
    if(currentSub==='theory') renderTheory17();
    if(currentSub==='solution') renderSolution17();
    if(currentSub==='simulation') renderSimulation17();
  }
    if(currentLab===18){
    if(currentSub==='theory') renderTheory18();
    if(currentSub==='solution') renderSolution18();
    if(currentSub==='simulation') renderSimulation18();
  }
    if(currentLab===19){
    if(currentSub==='theory') renderTheory19();
    if(currentSub==='solution') renderSolution19();
    if(currentSub==='simulation') renderSimulation19();
  }
    if(currentLab===20){
    if(currentSub==='theory') renderTheory20();
    if(currentSub==='solution') renderSolution20();
    if(currentSub==='simulation') renderSimulation20();
  }
  
  renderMath();
}

function renderPlaceholder(lab){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab ${String(lab.id).padStart(2,'0')} — ${lab.name}</h2>
    <div class="desc">This module is scaffolded in the curriculum but not yet wired up.</div>
    <div class="placeholder">
      <div class="big">🛠 Skeleton reserved — Theory / Solution / Simulation subtabs not yet implemented</div>
      <div>Built incrementally, one lab per step.</div>
      <div class="badge">Coming in a later step</div>
    </div>

/* =========================================================
   LAB 01 — TIME VALUE OF MONEY
   Real-world data: approximate annual U.S. CPI inflation,
   2015–2024 (illustrative, rounded to one decimal — for
   teaching purposes, not a precision economic source).
   ========================================================= */
const CPI_HISTORY = [
  {year:2015, pct:0.1}, {year:2016, pct:1.3}, {year:2017, pct:2.1},
  {year:2018, pct:2.4}, {year:2019, pct:1.8}, {year:2020, pct:1.2},
  {year:2021, pct:4.7}, {year:2022, pct:8.0}, {year:2023, pct:4.1},
  {year:2024, pct:2.9}
];

const tvm = { money:1000, years:10, rate:6, inf:3, useRealCPI:false };

/* ---- Subtab: Theory ---- */
function renderTheory1(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 01 — Time Value of Money</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>A dollar today is worth more than a dollar received in the future — not because of sentiment, but because today's dollar can be invested and start earning immediately. <b>Time Value of Money</b>, usually shortened to <b>TVM</b>, is the principle that connects a present sum of money to its future equivalent through an interest rate.</p>

      ${glossaryHTML("Terms used on this page", [
        ["PV", "<b>Present Value</b> — how much a sum of money is worth right now, today, before any growth has happened."],
        ["FV", "<b>Future Value</b> — how much that same sum will be worth after it has grown for a number of years."],
        ["r", "The <b>annual interest (or return) rate</b>, written as a decimal in the formula — for example 6% is written as 0.06."],
        ["t", "<b>Time</b>, measured in years — how long the money is left to grow."],
        ["π (pi)", "The <b>inflation rate</b>. Note: this is a different symbol from the geometry constant 3.14159 — in finance, π is just the traditional letter economists use for inflation."],
        ["CPI", "<b>Consumer Price Index</b> — a real government-tracked number showing how much the average cost of everyday goods (food, rent, gas) changed from one year to the next. It's the standard way inflation is actually measured, rather than assumed."],
        ["Real value", "What a sum of money is actually worth once you account for inflation — i.e. how much it could really buy, expressed in today's dollars."],
        ["Nominal value", "The plain dollar amount on the account statement, with no adjustment for inflation — what most people mean when they say 'how much money I have.'"]
      ])}

      <h3>Future value</h3>
      <p>If you invest a present sum of money (<b>PV</b>) at a fixed annual rate (<b>r</b>) for a number of years (<b>t</b>), compounding once a year, it grows into a future value (<b>FV</b>):</p>
      <div class="formula-box">$$FV = PV \\times (1+r)^{t}$$</div>

      <h3>Why inflation matters</h3>
      <p>Growth in dollar terms is only half the picture. Prices rise too, at an inflation rate (<b>π</b>). To see what your future pile of money can actually buy in today's terms — its <b>real value</b> — divide the future value back down by cumulative inflation:</p>
      <div class="formula-box">$$Real = \\frac{FV}{(1+\\pi)^{t}}$$</div>
      <p>When the interest rate <b>r</b> is bigger than the inflation rate <b>π</b>, real wealth grows. When inflation <b>π</b> is bigger than the interest rate <b>r</b>, the balance climbs on paper (nominal value goes up) while its real value — what it can actually buy — quietly shrinks. That gap between nominal and real is the core trap this lab is built to make visible.</p>

      <h3>Flat rate vs. real historical path</h3>
      <p>Textbooks usually assume a constant inflation rate for simplicity — the same π every year. Real inflation is lumpy: the U.S. <b>CPI</b> grew under 1% in 2015 and roughly 8% in 2022. The Simulation subtab lets you swap a flat assumption for the actual year-by-year 2015–2024 CPI path, so a spike like 2022 shows up as a kink in the curve rather than being smoothed away.</p>
    </div>
  `;
}

/* ---- Subtab: Solution (static worked example, real CPI data) ---- */
function renderSolution1(){
  const PV = 5000, r = 5, years = 10;
  let rows = '', nominal = PV, cum = 1;
  for(let y=0; y<=years; y++){
    if(y>0){
      nominal *= (1 + r/100);
      const cpi = CPI_HISTORY[(y-1) % CPI_HISTORY.length];
      cum *= (1 + cpi.pct/100);
    }
    const real = nominal / cum;
    const cpiLabel = y===0 ? '—' : CPI_HISTORY[(y-1) % CPI_HISTORY.length].year + ' (' + CPI_HISTORY[(y-1) % CPI_HISTORY.length].pct + '%)';
    rows += `<tr>
      <td>Year ${y}</td>
      <td>${cpiLabel}</td>
      <td class="gold">$${nominal.toFixed(0)}</td>
      <td class="emerald">$${real.toFixed(0)}</td>
    </tr>`;
  }
  const finalNominal = nominal, finalReal = nominal/cum;
  const lostPct = (100 * (1 - finalReal/finalNominal)).toFixed(1);

  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 01 — Time Value of Money</h2>
    <div class="desc">Solution — a worked example using the actual recorded 2015–2024 U.S. CPI path</div>
    <div class="theory-block">
      <p><b>Setup:</b> invest a present value (<b>PV</b>) of $5,000 at a fixed 5% annual return (<b>r</b>) for 10 years (<b>t</b>). Instead of assuming a flat inflation rate, each year is deflated by that specific year's real recorded <b>CPI</b> (Consumer Price Index) change — the actual measured rise in everyday prices that year.</p>

      ${glossaryHTML("Terms used in this table", [
        ["Nominal value", "The dollar amount on paper for that year — <b>PV</b> compounded forward by the 5% return, with no inflation adjustment."],
        ["Real value", "The nominal value <b>deflated</b> (divided down) by cumulative inflation since year 0 — what that nominal amount can actually buy, expressed in year-0 dollars."],
        ["CPI year used", "Which historical year's <b>Consumer Price Index</b> change was applied to get from one row to the next."]
      ])}

      <table class="worked-table">
        <tr><th>Year</th><th>CPI year used</th><th>Nominal value</th><th>Real value (today's $)</th></tr>
        ${rows}
      </table>
      <div class="solution-summary">
        After 10 years, the $5,000 present value (<b>PV</b>) grows to a future, nominal value (<b>FV</b>) of <b>$${finalNominal.toFixed(0)}</b>,
        but its real value — what it can actually buy — is only
        <b>$${finalReal.toFixed(0)}</b>. That's a loss of about <b>${lostPct}%</b> of purchasing power to inflation,
        driven mostly by the high-CPI years 2021–2022. The 5% return outpaced inflation (π) in most years but didn't
        fully offset the 2022 CPI spike in the year it happened.
      </div>
      <div class="footnote">CPI figures are approximate/illustrative (see data note in the Simulation tab), used here to teach the mechanism rather than as a precise financial record.</div>
    </div>
  `;
}

function updateSimulation1(){
  tvm.money = +document.getElementById('in-money').value;
  tvm.years = +document.getElementById('in-years').value;
  tvm.rate  = +document.getElementById('in-rate').value;
  tvm.inf   = +document.getElementById('in-inf').value;
  tvm.useRealCPI = document.getElementById('in-real-cpi').checked;

  document.getElementById('lbl-money').textContent = '$' + tvm.money.toLocaleString();
  document.getElementById('lbl-years').textContent = tvm.years;
  document.getElementById('lbl-rate').textContent = tvm.rate + '%';
  document.getElementById('lbl-inf').textContent = tvm.inf + '%';
  document.getElementById('in-inf').disabled = tvm.useRealCPI;

  // Nominal grows at the rate slider; real value deflates nominal by
  // cumulative inflation (flat slider, or the real CPI path if toggled on)
  const nominal = [tvm.money];
  let cpiWindow = [];
  for(let y=1; y<=tvm.years; y++){
    nominal.push(nominal[y-1] * (1 + tvm.rate/100));
    const yearlyInf = tvm.useRealCPI ? CPI_HISTORY[(y-1) % CPI_HISTORY.length].pct : tvm.inf;
    cpiWindow.push(yearlyInf);
  }
  let cumInf = 1;
  const realSeries = [tvm.money];
  for(let y=1; y<=tvm.years; y++){
    cumInf *= (1 + cpiWindow[y-1]/100);
    realSeries.push(nominal[y] / cumInf);
  }

  const fv = nominal[tvm.years];
  const rv = realSeries[tvm.years];
  const lostPct = 100 * (1 - rv/fv);
  const avgInf = cpiWindow.reduce((a,b)=>a+b,0) / cpiWindow.length;

  document.getElementById('stat-fv').textContent = '$' + fv.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  document.getElementById('stat-real').textContent = '$' + rv.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  document.getElementById('stat-lost').textContent = lostPct.toFixed(1) + '%';
  document.getElementById('stat-avginf').textContent = avgInf.toFixed(1) + '%';

  renderStack(nominal, realSeries);
  renderGraph(nominal, realSeries);
}

function renderStack(nominal, real){
  const row = document.getElementById('stack-row');
  row.innerHTML = '';
  const maxVal = Math.max(...nominal);
  nominal.forEach((val, i)=>{
    const rval = real[i];
    const cell = document.createElement('div');
    cell.className = 'stack-year';
    const actualH = Math.max(2, 100 * val/maxVal);
    const realH = Math.max(2, 100 * rval/maxVal);
    cell.innerHTML = `
      <div style="position:relative; width:100%; height:100%;">
        <div class="bar actual" style="height:${actualH}%;"></div>
        <div class="bar real" style="height:${realH}%;"></div>
      </div>
      <div class="stack-yr-label">Y${i}</div>
    `;
    row.appendChild(cell);
  });
}

/* ---- Subtab: Theory ---- */
function renderTheory2(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 02 — Compound Interest</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p><b>Simple interest</b> pays you a fixed percentage of your original deposit every year. <b>Compound interest</b> pays you a percentage of your original deposit <i>plus</i> every bit of interest it has already earned — interest earning interest. Over enough years, that difference becomes enormous.</p>

      ${glossaryHTML("Terms used on this page", [
        ["P", "<b>Principal</b> — the original amount of money you start with, before any interest is added."],
        ["r", "The <b>annual interest rate</b>, written as a decimal — 6% is written as 0.06."],
        ["n", "<b>Compounding frequency</b> — how many times per year interest is calculated and added to the balance. Once a year is n = 1, monthly is n = 12, daily is n = 365."],
        ["t", "<b>Time</b>, measured in years."],
        ["A", "<b>Amount</b> — the total balance after interest has been applied, i.e. the future value of the principal."]
      ])}

      <h3>Compound interest formula</h3>
      <p>The balance (<b>A</b>) after compounding a principal (<b>P</b>) at rate <b>r</b>, <b>n</b> times per year, for <b>t</b> years:</p>
      <div class="formula-box">$$A = P \\left(1 + \\frac{r}{n}\\right)^{nt}$$</div>

      <h3>Simple interest formula, for comparison</h3>
      <p>Simple interest never lets earned interest itself earn more interest — it always applies the rate to the original principal only:</p>
      <div class="formula-box">$$A = P (1 + rt)$$</div>
      <p>At low <b>r</b> or short <b>t</b>, the two are close. As <b>t</b> grows, compound interest pulls dramatically ahead, because each year's interest becomes part of next year's base.</p>

      <h3>Why compounding frequency (n) matters</h3>
      <p>Compounding monthly (n = 12) earns slightly more than compounding annually (n = 1) at the same stated rate, because interest starts earning interest sooner. The effect is real but smaller than most people expect — the number of years (<b>t</b>) matters far more than the compounding frequency (<b>n</b>).</p>
    </div>
  `;
}

/* ---- Subtab: Solution (static worked example, real S&P 500 data) ---- */
function renderSolution2(){

      const rec = SP500_HISTORY[(y-1) % SP500_HISTORY.length];
      compound *= (1 + rec.pct/100);
      simple = P * (1 + (avgRate/100) * y);
    }
    const label = y===0 ? '—' : SP500_HISTORY[(y-1) % SP500_HISTORY.length].year + ' (' + SP500_HISTORY[(y-1) % SP500_HISTORY.length].pct + '%)';
    rows += `<tr>

        After 10 years, compounding at the real, uneven S&amp;P 500 path finishes at <b>$${compound.toFixed(0)}</b>,
        versus <b>$${simple.toFixed(0)}</b> under simple interest at the same average rate — a gap of
        <b>$${diff.toFixed(0)}</b> that exists purely because compound interest let earlier gains keep earning.

  const freqValues = [1,2,4,12];

  ['in-ci-p','in-ci-r','in-ci-n','in-ci-t','in-ci-real'].forEach(id=>{
    document.getElementById(id).addEventListener('input', updateSimulation2);
  });
  updateSimulation2();

  function updateSimulation2(){
    ci.principal = +document.getElementById('in-ci-p').value;
    ci.rate = +document.getElementById('in-ci-r').value;
    const freqIdx = +document.getElementById('in-ci-n').value;
    ci.freq = freqValues[freqIdx];
    ci.years = +document.getElementById('in-ci-t').value;
    ci.useRealSP = document.getElementById('in-ci-real').checked;

    document.getElementById('lbl-ci-p').textContent = '$' + ci.principal.toLocaleString();
    document.getElementById('lbl-ci-r').textContent = ci.rate + '%';
    document.getElementById('lbl-ci-n').textContent = freqLabels[freqIdx];
    document.getElementById('lbl-ci-t').textContent = ci.years;
    document.getElementById('in-ci-n').disabled = ci.useRealSP;

    const compoundSeries = [ci.principal];
    const simpleSeries = [ci.principal];
    for(let y=1; y<=ci.years; y++){
      if(ci.useRealSP){
        const rec = SP500_HISTORY[(y-1) % SP500_HISTORY.length];
        compoundSeries.push(compoundSeries[y-1] * (1 + rec.pct/100));
      }else{
        compoundSeries.push(ci.principal * Math.pow(1 + (ci.rate/100)/ci.freq, ci.freq * y));
      }
      simpleSeries.push(ci.principal * (1 + (ci.rate/100) * y));
    }

    const finalCompound = compoundSeries[ci.years];
    const finalSimple = simpleSeries[ci.years];
    const effRate = (Math.pow(finalCompound/ci.principal, 1/ci.years) - 1) * 100;

    document.getElementById('stat-ci-compound').textContent = '$' + finalCompound.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    document.getElementById('stat-ci-simple').textContent = '$' + finalSimple.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    document.getElementById('stat-ci-diff').textContent = '$' + (finalCompound - finalSimple).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    document.getElementById('stat-ci-eff').textContent = effRate.toFixed(1) + '%';

    renderStackCI(compoundSeries, simpleSeries);
    renderGraphCI(compoundSeries, simpleSeries);
  }
}

function renderStackCI(compound, simple){
  const row = document.getElementById('stack-row-ci');

/* =========================================================
   LAB 04 — LOAN & MORTGAGE SIMULATOR
   Real-world data: approximate average U.S. 30-year fixed
   mortgage rate by origination year, 2015–2024 (illustrative,
   rounded — for teaching purposes, not a precision financial
   record). Unlike CPI or S&P 500 data used in earlier labs,
   a mortgage rate is LOCKED at origination and stays fixed for
   the life of the loan — so "real data mode" here means picking
   a real historical origination year, not a year-by-year path.
   ========================================================= */
const MORTGAGE_HISTORY = [
  {year:2015, pct:3.85}, {year:2016, pct:3.65}, {year:2017, pct:3.99},
  {year:2018, pct:4.54}, {year:2019, pct:3.94}, {year:2020, pct:3.11},
  {year:2021, pct:2.96}, {year:2022, pct:5.34}, {year:2023, pct:6.81},
  {year:2024, pct:6.72}
];

const loan = { principal:300000, years:30, rate:6, useRealOrigin:false, originIdx:6, viewYear:1 };

/* Build a full monthly amortization schedule, return yearly-aggregated arrays */
function amortize(P, annualRatePct, years){
  const r = (annualRatePct/100) / 12;
  const n = years * 12;
  const M = r === 0 ? P/n : P * (r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1);
  let balance = P;
  const yearlyPrincipal = [], yearlyInterest = [], remainingByYear = [];
  for(let y=0; y<years; y++){
    let pSum=0, iSum=0;
    for(let m=0; m<12; m++){
      const interest = balance * r;
      const principalPortion = M - interest;
      balance -= principalPortion;
      if(balance < 0) balance = 0;
      pSum += principalPortion;
      iSum += interest;
    }
    yearlyPrincipal.push(pSum);
    yearlyInterest.push(iSum);
    remainingByYear.push(balance);
  }
  const totalInterest = yearlyInterest.reduce((a,b)=>a+b,0);
  return {monthlyPayment:M, yearlyPrincipal, yearlyInterest, remainingByYear, totalInterest};
}

      <p>A loan lets you borrow a lump sum now and pay it back in fixed installments over time. A <b>mortgage</b> is simply a loan used to buy property, usually repaid monthly over 15–30 years. Every payment you make is split between two things: paying down what you borrowed, and paying the lender for the privilege of borrowing it.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Principal", "The original amount borrowed — the actual price tag of the loan before any interest is added."],
        ["Interest rate (APR)", "The annual percentage rate the lender charges for the loan, usually fixed for the life of a mortgage once it's signed."],
        ["Loan term", "How many years you have to repay the loan — commonly 15 or 30 years for a mortgage."],
        ["Monthly payment", "The fixed dollar amount paid every month, calculated so the loan is fully paid off — principal and interest — by the end of the term."],
        ["Amortization", "The process of gradually paying off a loan through regular payments, where each payment covers that period's interest plus a shrinking-then-growing share of principal."],
        ["Remaining balance", "How much principal is still owed at any point in the loan — what's left to pay off."],
        ["Total interest paid", "The sum of every interest portion across all payments over the full life of the loan — the true 'cost' of borrowing, on top of the principal."]
      ])}

      <h3>The monthly payment formula</h3>
      <p>For a fixed-rate loan, the monthly payment (<b>M</b>) that fully repays a principal (<b>P</b>) at monthly interest rate <b>r</b> over <b>n</b> total monthly payments is:</p>
      <div class="formula-box">$$M = P \\cdot \\frac{r(1+r)^{n}}{(1+r)^{n}-1}$$</div>
      <p>Here <b>r</b> is the <i>monthly</i> rate — the annual rate divided by 12 — and <b>n</b> is the loan term in years multiplied by 12.</p>

      <h3>Why early payments are mostly interest</h3>
      <p>Each month, interest is charged on whatever principal balance still remains. Early in the loan, the remaining balance is large, so most of that month's fixed payment goes to interest and only a small sliver chips away at principal. As the balance shrinks year after year, the interest portion shrinks with it, and more of each payment goes toward principal — even though the payment amount itself never changes. This lab's Simulation tab lets you scrub through the loan's life to watch that split flip.</p>

      <h3>Why a mortgage rate is different from CPI or stock returns</h3>
      <p>In Labs 01–03, inflation and stock returns changed <i>every year</i>. A mortgage rate is different: once you sign, that rate is <b>locked in</b> for the entire term — a real-data comparison here means comparing what rate was available in different <i>origination</i> years, not a rate that moves year to year within a single loan.</p>
    </div>
  `;
}

/* =========================================================
   LAB 05 — SAVINGS VS INVESTING
   Real-world data: approximate U.S. national average savings
   account interest rate by year, 2015–2024 (illustrative,
   rounded — FDIC-style national average, not a specific bank's
   rate; for teaching purposes, not a precision financial
   record). Reuses SP500_HISTORY (Lab 02) and CPI_HISTORY
   (Lab 01) so the inflation-adjusted comparison lines up with
   the same real data used elsewhere in the app.
   ========================================================= */
const SAVINGS_HISTORY = [
  {year:2015, pct:0.06}, {year:2016, pct:0.06}, {year:2017, pct:0.08},
  {year:2018, pct:0.09}, {year:2019, pct:0.09}, {year:2020, pct:0.05},
  {year:2021, pct:0.06}, {year:2022, pct:0.24}, {year:2023, pct:0.47},
  {year:2024, pct:0.58}
];

const sav = { initial:10000, years:10, allocPct:50, useRealSavings:false, useRealStocks:false, flatSavingsRate:1, flatStockRate:8 };

function computeSavingsInvesting(){
  const years = sav.years;
  const stockShare = sav.allocPct/100;
  const savingsShare = 1 - stockShare;

  const savingsSeries = [sav.initial * savingsShare];
  const stockSeries = [sav.initial * stockShare];
  const allStockSeries = [sav.initial];   // 100% stocks, for comparison
  const allSavingsSeries = [sav.initial]; // 100% savings, for comparison

  for(let y=1; y<=years; y++){
    const savRate = sav.useRealSavings ? SAVINGS_HISTORY[(y-1)%SAVINGS_HISTORY.length].pct : sav.flatSavingsRate;
    const stkRate = sav.useRealStocks ? SP500_HISTORY[(y-1)%SP500_HISTORY.length].pct : sav.flatStockRate;
    savingsSeries.push(savingsSeries[y-1] * (1+savRate/100));
    stockSeries.push(stockSeries[y-1] * (1+stkRate/100));
    allStockSeries.push(allStockSeries[y-1] * (1+stkRate/100));
    allSavingsSeries.push(allSavingsSeries[y-1] * (1+savRate/100));
  }
  const totalSeries = savingsSeries.map((s,i)=>s+stockSeries[i]);
  return {savingsSeries, stockSeries, totalSeries, allStockSeries, allSavingsSeries};
}

function renderTheory5(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 05 — Savings vs Investing</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>Every dollar you're not spending today faces the same question: park it somewhere safe and predictable, or put it somewhere that can grow faster but isn't guaranteed? <b>Savings accounts</b> and <b>investing</b> (e.g. in stocks) sit at opposite ends of that trade-off, and the right mix depends on what the money is for and how soon you'll need it.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Savings account", "A bank account that pays a modest, low-risk interest rate. Balances are typically insured (e.g. FDIC-insured in the U.S. up to certain limits), so the dollar amount essentially cannot go down from market forces."],
        ["Investing", "Putting money into assets like stocks, whose value moves with the market — capable of higher long-run growth, but with real risk of losing value, especially over short periods."],
        ["Risk", "The chance that an investment's value goes down, or doesn't grow as expected, before you need the money."],
        ["Return", "The percentage gain (or loss) an account or investment produces over a period, usually a year."],
        ["Asset allocation", "How money is split between different types of assets — e.g. 50% in a savings account, 50% in stocks — used to balance risk and growth."],
        ["Time horizon", "How long before the money is needed. Money needed soon (an emergency fund, a house down payment next year) generally belongs somewhere safe; money not needed for decades (retirement) has time to ride out stock market swings."],
        ["Real return", "A return after subtracting inflation — what the money's growth is actually worth in today's purchasing power, not just in raw dollar terms."]
      ])}

      <h3>The core trade-off</h3>
      <p>A savings account's rate is set by the bank (often tracking the central bank's policy rate) and applies to every dollar with no chance of loss — but historically, national average savings rates have often sat <i>below</i> inflation, meaning money sitting in savings can quietly lose real purchasing power even while the account balance itself only ever goes up. Stocks have historically outpaced inflation by a wide margin over long periods, but with real volatility: any single year, or even several years in a row, can be negative.</p>
      <div class="formula-box">$$Balance_t = Balance_0 \\times (1+r)^{t}$$</div>
      <p>The same compounding formula applies to both — the only thing that changes is which <b>r</b> (rate) you plug in, and how much that rate jumps around year to year.</p>

      <h3>Blending the two: asset allocation</h3>
      <p>Rather than an all-or-nothing choice, most real portfolios split money between safer and riskier assets. If a fraction <b>w</b> of a balance sits in stocks and the rest, <b>(1−w)</b>, sits in savings, the blended balance after one year is:</p>
      <div class="formula-box">$$Balance_1 = Balance_0 \\big[ w(1+r_{stock}) + (1-w)(1+r_{savings}) \\big]$$</div>
      <p>Turning the stock allocation <b>w</b> up raises expected growth but also raises how much a bad year can hurt; turning it down does the opposite. There's no allocation that's simply "correct" — it's a genuine trade-off shaped by time horizon and how much volatility someone can tolerate without needing to sell at a bad moment.</p>

      <h3>Why this differs from Lab 06</h3>
      <p>Lab 06 focuses on stock-only strategies (lump sum vs. dollar-cost averaging). This lab focuses on the earlier decision: <i>how much</i> of a balance should even be exposed to the stock market in the first place, using real historical savings-account rates (2015–2024) side by side with the same real S&amp;P 500 path used elsewhere in the app.</p>
    </div>
  `;
}

/* =========================================================
   LAB 06 — STOCK MARKET SIM
   Reuses SP500_HISTORY (real 2015–2024 U.S. S&P 500 annual
   total returns) from Lab 02. Adds a Monte Carlo random-walk
   mode built from that same history's mean and standard
   deviation, so "randomized" paths are still grounded in real
   statistics rather than an arbitrary guess.
   ========================================================= */
function sp500Stats(){
  const rets = SP500_HISTORY.map(s=>s.pct);
  const mean = rets.reduce((a,b)=>a+b,0) / rets.length;
  const variance = rets.reduce((a,b)=>a + (b-mean)*(b-mean), 0) / rets.length;
  const stdev = Math.sqrt(variance);
  return {mean, stdev};
}

/* Box–Muller transform for approximately normal random returns,
   centered on real S&P 500 mean/stdev (or user overrides) */
function generateMonteCarloReturns(years, meanPct, stdevPct){
  const rets = [];
  for(let y=0; y<years; y++){
    let u1 = Math.random(), u2 = Math.random();
    if(u1 < 1e-9) u1 = 1e-9;
    const z = Math.sqrt(-2*Math.log(u1)) * Math.cos(2*Math.PI*u2);
    rets.push(meanPct + z*stdevPct);
  }
  return rets;
}

const stock = { initial:10000, years:10, mode:1, flatRate:8, mcMean:8, mcVol:15, dca:false, contribution:1000 };
let stockLastReturns = null;

function computePortfolio(){
  const years = stock.years;
  let returns = [];
  if(stock.mode===0){
    for(let y=0; y<years; y++) returns.push(stock.flatRate);
  }else if(stock.mode===1){
    for(let y=0; y<years; y++) returns.push(SP500_HISTORY[y % SP500_HISTORY.length].pct);
  }else{
    returns = generateMonteCarloReturns(years, stock.mcMean, stock.mcVol);
  }
  const value = [stock.initial];
  const contributed = [stock.initial];
  for(let y=1; y<=years; y++){
    let v = value[y-1] * (1 + returns[y-1]/100);
    let c = contributed[y-1];
    if(stock.dca){ v += stock.contribution; c += stock.contribution; }
    value.push(v);
    contributed.push(c);
  }
  stockLastReturns = returns;
  return {value, contributed, returns};
}

function renderTheory6(){
  const s = sp500Stats();
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 06 — Stock Market Sim</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>Buying a stock means buying a small slice of ownership in a company. A stock's price moves with how investors expect that company (or, for an index like the <b>S&amp;P 500</b>, hundreds of companies at once) to perform in the future — which makes returns uncertain year to year, even though they tend to trend upward over long periods.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Return", "The percentage gain or loss on an investment over a period, usually one year."],
        ["Volatility (σ)", "How much returns swing around their average, measured as a <b>standard deviation</b>. Higher volatility means bigger, less predictable year-to-year swings."],
        ["Arithmetic mean return", "The plain average of a list of yearly percentage returns — add them up, divide by how many years."],
        ["CAGR", "<b>Compound Annual Growth Rate</b> — the single steady annual rate that would have produced the same start-to-end growth. Also called the <b>geometric mean</b> return."],
        ["Lump sum", "Investing one full amount all at once, on day one, and leaving it alone."],
        ["Dollar-cost averaging (DCA)", "Investing a fixed amount at regular intervals (e.g. every year) instead of all at once — buying more shares when prices are low and fewer when prices are high, automatically."],
        ["S&P 500", "A stock market index tracking 500 large U.S. companies — commonly used as a stand-in for 'the stock market' as a whole because it's broad and diversified."]
      ])}

      <h3>Why CAGR is lower than the arithmetic average (volatility drag)</h3>
      <p>A common intuition trap: if a stock returns +50% one year and −50% the next, the average return is 0%. But $100 growing 50% becomes $150, and $150 falling 50% becomes $75 — a real loss, despite a 0% arithmetic average. Volatility itself erodes compounded growth. The relationship is approximately:</p>
      <div class="formula-box">$$CAGR \\approx \\bar{r} - \\frac{\\sigma^{2}}{2}$$</div>
      <p>where <b>r̄</b> is the arithmetic mean return and <b>σ</b> (sigma) is the standard deviation of returns. The more volatile the ride, the bigger the gap between the average return you'd naively expect and the compound growth rate you actually get. The exact CAGR from real data is calculated directly rather than through this approximation:</p>
      <div class="formula-box">$$CAGR = \\left(\\frac{FV}{PV}\\right)^{1/t} - 1$$</div>

      <h3>A precise note on "sequence of returns risk"</h3>
      <p>It's often said that the <i>order</i> of returns matters. For a pure lump sum with no further contributions or withdrawals, that's actually not true — multiplication doesn't care about order, so $10,000 growing through +20%, −10%, +5% ends at exactly the same place as −10%, +5%, +20%. Sequence risk becomes real once money is added or removed <i>during</i> the ride: a crash right after a big contribution hurts far more than a crash right before one, because more dollars were exposed to the bad year. The Simulation tab's dollar-cost-averaging mode makes this visible.</p>

      <h3>What this lab uses as real data</h3>
      <p>The real-path mode reuses the actual annual S&amp;P 500 total returns from 2015–2024 (same dataset as Lab 02), which had an arithmetic mean of about <b>${s.mean.toFixed(1)}%</b> and a standard deviation of about <b>${s.stdev.toFixed(1)}%</b> — including two negative years, 2018 and 2022. The Monte Carlo mode draws random yearly returns from a normal distribution centered on real historical mean/volatility figures, rather than an arbitrary made-up spread.</p>
    </div>
  `;
}

/* ---- Subtab: Solution (static worked example, real S&P 500 data) ---- */
function renderSolution6(){
  const years = 10;
  // Lump sum: $10,000 invested once in 2015
  let lump = 10000;
  const lumpRows = [];
  // DCA: $1,000 invested at the start of each year, 2015–2024
  let dcaVal = 0, dcaContrib = 0;
  const dcaRows = [];
  for(let y=0; y<years; y++){
    const rec = SP500_HISTORY[y];
    lump *= (1 + rec.pct/100);
    dcaVal += 1000;               // this year's contribution
    dcaContrib += 1000;
    dcaVal *= (1 + rec.pct/100);  // that contribution (and prior balance) rides this year's return
    lumpRows.push({year:rec.year, pct:rec.pct, lump, dcaVal, dcaContrib});
  }
  const finalLump = lump;
  const finalDca = dcaVal;
  const lumpGainPct = (100*(finalLump-10000)/10000).toFixed(0);
  const dcaGainPct = (100*(finalDca-dcaContrib)/dcaContrib).toFixed(0);
  const winner = finalLump > finalDca ? 'lump sum' : 'dollar-cost averaging';
  const gap = Math.abs(finalLump-finalDca);

  let rowsHTML = '';
  lumpRows.forEach(r=>{
    rowsHTML += `<tr>
      <td>${r.year}</td>
      <td>${r.pct}%</td>
      <td class="emerald">$${r.lump.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</td>
      <td class="gold">$${r.dcaVal.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</td>
    </tr>`;
  });

  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 06 — Stock Market Sim</h2>
    <div class="desc">Solution — $10,000 invested two different ways over the real 2015–2024 S&amp;P 500 path</div>
    <div class="theory-block">
      <p><b>Setup:</b> Strategy A puts the full $10,000 in on day one of 2015 and leaves it alone (lump sum). Strategy B invests $1,000 at the start of every year from 2015–2024, also totaling $10,000 by the end (dollar-cost averaging). Both ride the exact same real S&amp;P 500 annual returns.</p>

      ${glossaryHTML("Terms used in this table", [
        ["Lump sum balance", "The full $10,000 compounding from year one, exposed to every year's return in full."],
        ["DCA balance", "Running balance where a new $1,000 contribution is added at the start of each year, then that year's return is applied to the whole balance."]
      ])}

      <table class="worked-table">
        <tr><th>Year</th><th>S&amp;P 500 return</th><th>Lump sum balance</th><th>DCA balance</th></tr>
        ${rowsHTML}
      </table>
      <div class="solution-summary">
        By the end of 2024, the lump sum strategy finishes at <b>$${finalLump.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</b>
        (a gain of about <b>${lumpGainPct}%</b>), while dollar-cost averaging finishes at
        <b>$${finalDca.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</b> (a gain of about <b>${dcaGainPct}%</b> on contributed capital).
        In this particular real window, <b>${winner}</b> came out about <b>$${gap.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</b> ahead —
        because 2015–2024 was, on net, a rising market, so money that got in earlier (the lump sum) had more time exposed to the gains.
        In a falling or choppier market, DCA typically wins instead, since later contributions avoid buying in at the earlier, higher prices.
        Neither strategy is universally "correct" — it depends entirely on the path prices actually take, which nobody knows in advance.
      </div>
      <div class="footnote">S&amp;P 500 return figures are approximate/illustrative, rounded — used to teach the mechanism, not as a precise financial record. Contributions assumed at the start of each year for simplicity.</div>
    </div>
  `;
}

  const {value, contributed} = computePortfolio();
  const finalVal = value[stock.years];
  const finalContrib = contributed[stock.years];
  const gain = finalVal - finalContrib;
  const gainPct = 100 * gain / finalContrib;

  document.getElementById('stat-st-final').textContent = '$' + finalVal.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  document.getElementById('stat-st-cagr').textContent = cagr.toFixed(1) + '%';

  renderStackStock(value, contributed);

/* =========================================================
   LAB 07 — SUPPLY & DEMAND
   Real-world anchor: approximate U.S. average retail price per
   dozen Grade A large eggs, 2015–2024 (illustrative, rounded —
   for teaching purposes, not a precision economic record). The
   2022 spike reflects the real 2022 avian flu outbreak, which
   killed a large share of the U.S. egg-laying flock — a textbook
   negative supply shock hitting a relatively inelastic-demand
   staple good. The linear demand/supply model used in the
   Solution and Simulation tabs is a stylized teaching model with
   clean, round parameters chosen to produce a price swing of a
   similar order of magnitude — it is NOT a fitted econometric
   estimate of the real egg market.
   ========================================================= */
const EGG_HISTORY = [
  {year:2015, price:2.75}, {year:2016, price:1.50}, {year:2017, price:1.66},
  {year:2018, price:1.65}, {year:2019, price:1.40}, {year:2020, price:1.46},
  {year:2021, price:1.79}, {year:2022, price:4.21}, {year:2023, price:2.04},
  {year:2024, price:3.00}
];

const sd = { a:100, b:10, c:20, d:15, shockPct:0, priceControl:'none', controlPrice:3.2, useRealEgg:false };

function sdEquilibrium(a,b,c,d){
  const P = (a-c)/(b+d);
  const Q = a - b*P;
  return {P, Q};
}

function computeSD(){
  const cEff = sd.c * (1 - sd.shockPct/100);
  const before = sdEquilibrium(sd.a, sd.b, sd.c, sd.d);
  const after = sdEquilibrium(sd.a, sd.b, cEff, sd.d);
  const elasticity = -sd.b * (after.P / after.Q);

  const refPrice = sd.priceControl==='none' ? after.P : sd.controlPrice;
  const qd = Math.max(0, sd.a - sd.b*refPrice);
  const qs = Math.max(0, cEff + sd.d*refPrice);
  const gap = qd - qs; // positive = shortage, negative = surplus

  return {cEff, before, after, elasticity, refPrice, qd, qs, gap};
}

/* ---- Subtab: Theory ---- */
function renderTheory7(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 07 — Supply &amp; Demand</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>Markets set prices through a tug-of-war between two groups: buyers, who want more of something the cheaper it gets, and sellers, who want to offer more of something the more they can charge for it. The price where those two forces exactly balance is the market's <b>equilibrium</b>.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Qd", "<b>Quantity demanded</b> — how much of a good buyers want to buy at a given price. Falls as price rises."],
        ["Qs", "<b>Quantity supplied</b> — how much of a good sellers want to sell at a given price. Rises as price rises."],
        ["Equilibrium price (P*)", "The one price where quantity demanded exactly equals quantity supplied — no shortage, no surplus."],
        ["Equilibrium quantity (Q*)", "How much actually gets bought and sold at the equilibrium price."],
        ["Supply shock", "A sudden event that shifts the whole supply curve — e.g. a disease outbreak, a war, a factory fire — changing how much sellers can offer at every price, not just at one price."],
        ["Shortage", "When quantity demanded exceeds quantity supplied at the current price — happens when a price is held below equilibrium (e.g. by a price ceiling)."],
        ["Surplus", "When quantity supplied exceeds quantity demanded at the current price — happens when a price is held above equilibrium (e.g. by a price floor)."],
        ["Price elasticity of demand", "How sensitive quantity demanded is to a price change. 'Elastic' (|E|>1) means demand swings a lot; 'inelastic' (|E|<1) means demand barely moves even when price jumps — common for staple goods with few substitutes."]
      ])}

      <h3>Linear demand and supply</h3>
      <p>The simplest useful model treats both curves as straight lines. Demand slopes downward; supply slopes upward:</p>
      <div class="formula-box">$$Q_d = a - bP \\qquad\\qquad Q_s = c + dP$$</div>
      <p>Here <b>a</b> and <b>c</b> are intercepts (quantity when price is zero, loosely — "how much people want" and "how much sellers are willing to offer for free/at cost"), and <b>b</b> and <b>d</b> are slopes controlling how sharply each curve responds to price.</p>

      <h3>Solving for equilibrium</h3>
      <p>Equilibrium is simply the price where the two quantities are equal — set <b>Qd = Qs</b> and solve for <b>P</b>:</p>
      <div class="formula-box">$$P^{*} = \\frac{a-c}{b+d} \\qquad\\qquad Q^{*} = a - bP^{*}$$</div>

      <h3>What a supply shock does</h3>
      <p>A shock like a disease outbreak doesn't change how much buyers want at a given price — it changes how much sellers <i>can</i> offer. That's a shift of the entire supply curve (a smaller <b>c</b>), not a movement along it. With demand unchanged, a leftward supply shift raises the equilibrium price and lowers the equilibrium quantity. If demand for that good is inelastic — buyers can't easily do without it or substitute away — even a modest supply cut can cause an outsized price spike, because buyers keep bidding for a nearly-fixed amount they still need.</p>

      <h3>Price controls: ceilings and floors</h3>
      <p>Governments sometimes hold a price below equilibrium (a <b>price ceiling</b>, e.g. rent control) or above it (a <b>price floor</b>, e.g. a minimum wage). Away from the market's natural equilibrium, Qd and Qs no longer match — a ceiling below equilibrium creates a shortage (more buyers than available goods), and a floor above equilibrium creates a surplus (more goods than willing buyers).</p>

      <h3>A real-world example this lab is built around</h3>
      <p>In 2022, a severe avian flu outbreak killed a large share of the U.S. egg-laying flock — a real, sudden negative supply shock. Because eggs are a staple with demand that doesn't fall much even as prices rise, the retail price spiked sharply that year before easing as flocks recovered. The Simulation tab lets you recreate that same shock-and-inelastic-demand mechanism with adjustable sliders.</p>
    </div>
  `;
}

/* ---- Subtab: Solution (worked example, stylized model + real price context) ---- */
function renderSolution7(){
  const a=100, b=10, c=20, d=15;
  const before = sdEquilibrium(a,b,c,d);
  const shockPct = 40;
  const cEff = c*(1-shockPct/100);
  const after = sdEquilibrium(a,b,cEff,d);
  const elasticity = -b*(before.P/before.Q);
  const priceChangePct = 100*(after.P-before.P)/before.P;
  const qtyChangePct = 100*(after.Q-before.Q)/before.Q;

  const prices = [1,2,3,4,5];
  let rows = '';
  prices.forEach(P=>{
    const qd = a-b*P;
    const qsBefore = c+d*P;
    const qsAfter = cEff+d*P;
    rows += `<tr>
      <td>$${P.toFixed(2)}</td>
      <td class="gold">${qd.toFixed(0)}</td>
      <td class="emerald">${qsBefore.toFixed(0)}</td>
      <td class="emerald">${qsAfter.toFixed(0)}</td>
    </tr>`;
  });

  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 07 — Supply &amp; Demand</h2>
    <div class="desc">Solution — a stylized egg market hit by a 40% supply shock (avian-flu-style)</div>
    <div class="theory-block">
      <p><b>Setup:</b> a simplified market with demand <b>Qd = 100 − 10P</b> and baseline supply <b>Qs = 20 + 15P</b> (Q in millions of dozens/week, P in $/dozen — clean, illustrative units chosen to teach the mechanism, not fitted to real data). A disease outbreak then wipes out 40% of supply capacity at every price level.</p>

      ${glossaryHTML("Terms used in this table", [
        ["Qd", "Quantity demanded at that price, from the fixed demand curve — unaffected by the supply shock."],
        ["Qs before shock", "Quantity supplied at that price under the original supply curve."],
        ["Qs after shock", "Quantity supplied at that price after the 40% capacity cut — the whole curve shifts down."]
      ])}

      <table class="worked-table">
        <tr><th>Price</th><th>Qd</th><th>Qs (before)</th><th>Qs (after shock)</th></tr>
        ${rows}
      </table>

      <div class="solution-summary">
        Before the shock, equilibrium is at <b>P* = $${before.P.toFixed(2)}</b>, <b>Q* = ${before.Q.toFixed(1)}</b> million dozens/week.
        The price elasticity of demand there is about <b>${elasticity.toFixed(2)}</b> — inelastic (|E| &lt; 1), meaning quantity demanded barely
        responds to price. After the 40% supply shock, equilibrium moves to <b>P* = $${after.P.toFixed(2)}</b>, <b>Q* = ${after.Q.toFixed(1)}</b> —
        a price increase of about <b>${priceChangePct.toFixed(0)}%</b> against a quantity drop of only about <b>${Math.abs(qtyChangePct).toFixed(0)}%</b>.
        Because demand barely budges, almost all of the adjustment shows up as a higher price rather than a smaller quantity traded —
        exactly the pattern seen in the real 2022 U.S. egg market, where average retail prices rose from roughly $1.79/dozen in 2021 to
        roughly $4.21/dozen in 2022 following the avian flu outbreak.
      </div>
      <div class="footnote">The $100/$10/$20/$15 model parameters are stylized teaching values, not a fitted estimate of the real egg market. The $1.79 → $4.21 real prices are approximate/illustrative U.S. averages, rounded, used here only as real-world context for the size of the swing.</div>
    </div>
  `;
}

function renderSDCurves(result){
  try{
    if(typeof Plotly === 'undefined'){ return; }
    const maxP = Math.max(result.before.P, result.after.P, sd.controlPrice) * 1.6 + 1;
    const pRange = [];
    for(let p=0; p<=maxP; p+=maxP/40) pRange.push(p);

    const demandQ = pRange.map(p=>Math.max(0, sd.a - sd.b*p));
    const supplyBeforeQ = pRange.map(p=>Math.max(0, sd.c + sd.d*p));
    const supplyAfterQ = pRange.map(p=>Math.max(0, result.cEff + sd.d*p));

    const traces = [
      {x:demandQ, y:pRange, name:'Demand', mode:'lines', line:{color:'#e6c368', width:3}}
    ];
    if(sd.shockPct>0){
      traces.push({x:supplyBeforeQ, y:pRange, name:'Supply (before shock)', mode:'lines', line:{color:'#6c8274', width:2, dash:'dot'}});
    }
    traces.push({x:supplyAfterQ, y:pRange, name: sd.shockPct>0 ? 'Supply (after shock)' : 'Supply', mode:'lines', line:{color:'#3fd69a', width:3}});
    traces.push({x:[result.after.Q], y:[result.after.P], name:'Equilibrium', mode:'markers', marker:{color:'#d9614f', size:11, symbol:'diamond'}});

    const annotations = [];
    const shapes = [];
    if(sd.priceControl!=='none'){
      shapes.push({
        type:'line', x0:0, x1:Math.max(...demandQ, ...supplyAfterQ), y0:sd.controlPrice, y1:sd.controlPrice,
        line:{color:'#d9614f', width:2, dash:'dash'}
      });
      annotations.push({
        x:Math.max(...demandQ, ...supplyAfterQ)*0.6, y:sd.controlPrice,
        text: (sd.priceControl==='ceiling'?'Price ceiling':'Price floor') + ' — $' + sd.controlPrice.toFixed(2),
        showarrow:false, yshift:12,
        font:{color:'#d9614f', size:10, family:'JetBrains Mono'},
        bgcolor:'rgba(8,17,13,0.85)', bordercolor:'#d9614f', borderwidth:1, borderpad:3
      });
    }

    Plotly.newPlot('graph-sd-curves', traces, {
      paper_bgcolor:'rgba(0,0,0,0)',
      plot_bgcolor:'rgba(0,0,0,0)',
      font:{color:'#a9bcae', family:'JetBrains Mono'},
      margin:{t:20,l:55,r:20,b:40},
      xaxis:{title:'Quantity', gridcolor:'#24382c'},
      yaxis:{title:'Price ($)', gridcolor:'#24382c', tickprefix:'$'},
      legend:{orientation:'h', y:-0.2},
      shapes:shapes,
      annotations:annotations
    }, {displayModeBar:false, responsive:true});
  }catch(e){
    console.warn('Plotly unavailable in this embed context:', e);
  }
}

function renderSDBars(result){

    `;

  });
  const note = document.createElement('div');
  note.className = 'item-afford';
  note.textContent = sd.priceControl==='none'
    ? 'At the market equilibrium price, quantity demanded exactly equals quantity supplied.'

      : (result.gap<-0.5 ? `The price control holds price above equilibrium, so sellers offer more than buyers want — a surplus.`
      : 'The control price happens to sit close to equilibrium.'));
  wrap.appendChild(note);
}

function taylorRate(pi, u, rStar, piTarget, uStar, a, b){
  return rStar + pi + a*(pi-piTarget) + b*(uStar-u);

        ["Transmission mechanism", "The chain of cause and effect by which a rate change eventually shows up in inflation and jobs: higher rates → costlier borrowing → less spending/investment → cooler demand → lower inflation, but often also higher unemployment along the way."],
        ["Taylor Rule", "A simple formula, proposed by economist John Taylor, that recommends a policy interest rate based on how far inflation and unemployment are from their targets — used as a benchmark, not a rule central banks are bound to follow exactly."],

      <div class="formula-box">$$i = r^{*} + \\pi + a(\\pi-\\pi^{*}) + b(u^{*}-u)$$</div>
      <p>Here <b>i</b> is the recommended policy rate, <b>r*</b> is the neutral real rate, <b>π</b> is current inflation, <b>π*</b> is the inflation target (commonly 2%), <b>u</b> is current unemployment, <b>u*</b> is the "natural" rate of unemployment consistent with a healthy economy, and <b>a, b</b> are weights (Taylor's original paper used 0.5 for both). When inflation runs above target, the rule pushes the rate up; when unemployment runs above its natural rate (economic slack), it pushes the rate down.</p>

      <h3>Why real policy doesn't follow the rule exactly</h3>
      <p>The Taylor Rule is a useful benchmark, not a dial a central bank turns automatically. Real policymakers weigh forward-looking expectations, financial stability, global conditions, and the long, uncertain lags before a rate change fully shows up in the economy (often estimated at many months to over a year) — and they're constrained by the zero lower bound when the formula recommends a rate that's already deeply negative. The Simulation tab lets you compare what the simple rule would have recommended against what the real federal funds rate actually was in each year from 2015–2024.</p>

/* =========================================================
   LAB 09 — INFLATION VS INTEREST RATE
   Real-world data: approximate Turkish central bank policy
   rate vs. annual CPI inflation, 2015–2024 (illustrative,
   rounded — for teaching purposes, not a precision economic
   record). Chosen deliberately because it's one of the
   clearest real-world cases of a HIGH nominal interest rate
   (sometimes 20–45%) coexisting with an even HIGHER inflation
   rate — producing a deeply negative real return despite a
   headline number that looks generous. Reuses CPI_HISTORY
   (Lab 01) for the mild-inflation comparison case.
   ========================================================= */
const TURKEY_ECON_HISTORY = [
  {year:2015, rate:7.50,  cpi:8.8},
  {year:2016, rate:8.00,  cpi:8.5},
  {year:2017, rate:9.25,  cpi:11.9},
  {year:2018, rate:16.00, cpi:20.3},
  {year:2019, rate:12.00, cpi:11.8},
  {year:2020, rate:8.75,  cpi:14.6},
  {year:2021, rate:14.00, cpi:36.1},
  {year:2022, rate:9.00,  cpi:64.3},
  {year:2023, rate:30.00, cpi:64.8},
  {year:2024, rate:45.00, cpi:44.4}
];

const ir = {
  initial:10000, years:10,
  inflation:3, interest:6,
  useRealData:false, yearIdx:7 // default to 2022, the sharpest negative-real-rate year
};

/* Fisher equation: exact real rate from nominal rate and inflation, both as % */
function fisherRealRate(nominalPct, inflationPct){
  return (100 * ((1+nominalPct/100)/(1+inflationPct/100) - 1));
}

function computeIR(){
  const years = ir.years;
  const nominalSeries = [ir.initial];
  const realSeries = [ir.initial];
  let cumInf = 1;
  const ratesUsed = [];
  for(let y=1; y<=years; y++){
    let infPct, intPct;
    if(ir.useRealData){
      const rec = TURKEY_ECON_HISTORY[(ir.yearIdx + y - 1) % TURKEY_ECON_HISTORY.length];
      infPct = rec.cpi;
      intPct = rec.rate;
    }else{
      infPct = ir.inflation;
      intPct = ir.interest;
    }
    ratesUsed.push({infPct, intPct});
    nominalSeries.push(nominalSeries[y-1] * (1 + intPct/100));
    cumInf *= (1 + infPct/100);
    realSeries.push(nominalSeries[y] / cumInf);
  }
  return {nominalSeries, realSeries, ratesUsed};
}

    <div class="theory-block">

      ${glossaryHTML("Terms used on this page", [
        ["Nominal interest rate", "The plain, stated interest rate — the number on the account or the bond, with no adjustment for inflation."],
        ["Real interest rate", "What that interest rate is actually worth once inflation is subtracted out — how much your <i>purchasing power</i> grows, not just your dollar (or lira) count."],
        ["Fisher equation", "The formula connecting nominal rate, inflation, and real rate — named after economist Irving Fisher."],
        ["Negative real rate", "When inflation is higher than the nominal interest rate, so a saver's money grows in number but shrinks in what it can actually buy."],
        ["Purchasing power", "How much a fixed amount of money can actually buy — the same concept from Lab 03, now applied to money that's earning interest instead of sitting still."]
      ])}

      <h3>The Fisher equation</h3>
      <p>The approximate, back-of-envelope version simply subtracts inflation from the nominal rate:</p>
      <div class="formula-box">$$r_{real} \\approx r_{nominal} - \\pi$$</div>
      <p>The exact version compounds correctly instead of just subtracting, which matters more the higher both numbers get:</p>
      <div class="formula-box">$$1 + r_{real} = \\frac{1+r_{nominal}}{1+\\pi}$$</div>
      <p>Here <b>r<sub>nominal</sub></b> is the stated interest rate, <b>π</b> is the inflation rate over the same period, and <b>r<sub>real</sub></b> is what's left once rising prices are backed out.</p>

      <h3>Why 10% interest isn't always good</h3>
      <p>If inflation (π) is 3%, a 10% nominal rate gives a real rate of roughly +7% — genuinely strong growth in purchasing power. But if inflation is 15%, that same 10% nominal rate gives a real rate of roughly <b>−5%</b>: the account balance still climbs every year, yet it buys <i>less</i> with every year that passes. The headline number alone can't tell you which situation you're in.</p>

      <h3>A real-world case: high nominal rates, higher inflation</h3>
      <p>Turkish lira deposit and policy rates have, in several recent years, reached levels that would look extremely attractive in a low-inflation economy — 20%, 30%, even 45%. But Turkish CPI inflation over the same years has often run just as high or higher, meaning savers earning those "generous" nominal rates were frequently still losing real purchasing power. This lab's Simulation tab lets you replay that real 2015–2024 rate-vs-inflation history directly.</p>

function renderSolution9(){
  const P = 10000, years = 5;

  // Case A: mild inflation, positive real rate (6% interest, 3% inflation, flat)
  let mildNominal = P, mildReal = P, mildCum = 1;
  const mildRows = [];
  for(let y=0; y<=years; y++){
    if(y>0){
      mildNominal *= 1.06;
      mildCum *= 1.03;
    }
    mildReal = mildNominal / mildCum;
    mildRows.push({y, nominal:mildNominal, real:mildReal});
  }

  // Case B: real Turkey data starting 2022 (9.00% rate, 64.3% inflation that year, then continuing the real path)
  let trNominal = P, trReal = P, trCum = 1;
  const trRows = [];
  const startIdx = TURKEY_ECON_HISTORY.findIndex(r=>r.year===2022);
  for(let y=0; y<=years; y++){
    if(y>0){
      const rec = TURKEY_ECON_HISTORY[(startIdx + y - 1) % TURKEY_ECON_HISTORY.length];
      trNominal *= (1 + rec.rate/100);
      trCum *= (1 + rec.cpi/100);
    }
    trReal = trNominal / trCum;
    trRows.push({y, nominal:trNominal, real:trReal});
  }

  let rowsHTML = '';
  for(let y=0; y<=years; y++){
    rowsHTML += `<tr>
      <td>Year ${y}</td>
      <td class="gold">$${mildRows[y].nominal.toFixed(0)}</td>
      <td class="emerald">$${mildRows[y].real.toFixed(0)}</td>
      <td class="gold">₺${trRows[y].nominal.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</td>
      <td class="loss" style="color:var(--loss);">₺${trRows[y].real.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</td>
    </tr>`;
  }

  const mildFinalLostPct = (100*(1 - mildRows[years].real/mildRows[years].nominal)).toFixed(1);
  const trFinalLostPct = (100*(1 - trRows[years].real/trRows[years].nominal)).toFixed(1);

  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 09 — Inflation vs Interest Rate</h2>
    <div class="desc">Solution — the same 10,000 saved for 5 years, in a mild-inflation account vs. a real high-nominal-rate account</div>
    <div class="theory-block">
      <p><b>Setup:</b> Case A deposits $10,000 at a flat 6% nominal interest rate with 3% flat inflation. Case B deposits ₺10,000 at the real Turkish policy rate and real CPI inflation, starting from 2022 — a year when the nominal rate was actually 9.00% and inflation was 64.3%, i.e. a rate that looks far from generous once inflation is accounted for, followed by the real subsequent years' path.</p>

      ${glossaryHTML("Terms used in this table", [
        ["Case A — mild inflation", "6% nominal interest vs. 3% flat inflation — a positive real rate, purchasing power grows."],
        ["Case B — real Turkey path", "The actual recorded policy rate and CPI inflation for 2022 onward — nominal balance still grows, but usually more slowly than prices."]
      ])}

      <table class="worked-table">
        <tr><th>Year</th><th>Case A nominal</th><th>Case A real</th><th>Case B nominal</th><th>Case B real</th></tr>
        ${rowsHTML}
      </table>
      <div class="solution-summary">
        In Case A, the account grows from $10,000 to <b>$${mildRows[years].nominal.toFixed(0)}</b> nominally, and its real,
        inflation-adjusted value is <b>$${mildRows[years].real.toFixed(0)}</b> — only about <b>${mildFinalLostPct}%</b> lost to
        inflation, because the 6% rate mostly outran 3% inflation. In Case B, the account still grows from ₺10,000 to a much
        larger-looking <b>₺${trRows[years].nominal.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</b> nominally — but its real value is only
        <b>₺${trRows[years].real.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</b>, a loss of roughly <b>${trFinalLostPct}%</b> of
        purchasing power, because inflation ran ahead of the nominal rate in most of those years. The saver in Case B saw a
        far bigger number in their account, and still ended up considerably poorer in real terms — the exact trap the phrase
        "10% interest isn't always good" is warning against.
      </div>
      <div class="footnote">Turkish policy rate and CPI figures are approximate/illustrative annual figures, rounded — used to teach the mechanism, not as a precise economic record.</div>
