  wrap.appendChild(note);
}

/* =========================================================
   LAB 10 — CURRENCY EXCHANGE SIMULATOR
   Real-world data: approximate annual average USD/EUR,
   USD/JPY, and USD/TRY exchange rates, 2015–2024
   (illustrative, rounded — for teaching purposes, not a
   precision financial record). EUR is quoted as USD-per-EUR
   (market convention); JPY and TRY are quoted as
   units-per-USD (also market convention) — deliberately kept
   consistent with how these pairs are actually quoted, rather
   than forcing all three into one direction.

   Three fixed real-world roles are mapped onto the three
   foreign currencies so the SAME exchange-rate concept shows
   up three different ways:
     EUR -> an American's vacation cost abroad
     JPY -> a US importer's cost of foreign-priced goods
     TRY -> a US exporter's profit converted back to USD
   ========================================================= */
const FX_HISTORY = [
  {year:2015, eur:1.11, jpy:121, try:2.72},
  {year:2016, eur:1.11, jpy:109, try:3.02},
  {year:2017, eur:1.13, jpy:112, try:3.65},
  {year:2018, eur:1.18, jpy:110, try:4.83},
  {year:2019, eur:1.12, jpy:109, try:5.68},
  {year:2020, eur:1.14, jpy:107, try:7.01},
  {year:2021, eur:1.18, jpy:110, try:8.85},
  {year:2022, eur:1.05, jpy:131, try:16.55},
  {year:2023, eur:1.08, jpy:141, try:23.78},
  {year:2024, eur:1.08, jpy:151, try:32.80}
];
const FX_BASE = FX_HISTORY[FX_HISTORY.length-1]; // 2024 used as the simulator's baseline

const FX_ITEMS = {
  vacation: {label:'Paris hotel room (per night)', symbol:'€', localPrice:200},
  importItem: {label:'Imported electronics parts (per unit)', symbol:'¥', localPrice:50000},
  exportItem: {label:'Exported machinery (per unit)', symbol:'₺', localPrice:500000}
};

const fx = { eurShockPct:0, jpyShockPct:0, tryShockPct:0, useRealData:false, yearIdx:9 };

function computeFX(){
  let eurRate, jpyRate, tryRate;
  if(fx.useRealData){
    const rec = FX_HISTORY[fx.yearIdx];
    eurRate = rec.eur; jpyRate = rec.jpy; tryRate = rec.try;
  }else{
    eurRate = FX_BASE.eur * (1 + fx.eurShockPct/100);
    jpyRate = FX_BASE.jpy * (1 + fx.jpyShockPct/100);
    tryRate = FX_BASE.try * (1 + fx.tryShockPct/100);
  }
  // EUR quoted as USD-per-EUR -> multiply. JPY/TRY quoted as units-per-USD -> divide.
  const vacationUSD = FX_ITEMS.vacation.localPrice * eurRate;
  const importUSD    = FX_ITEMS.importItem.localPrice / jpyRate;
  const exportUSD     = FX_ITEMS.exportItem.localPrice / tryRate;

  const vacationBaseUSD = FX_ITEMS.vacation.localPrice * FX_BASE.eur;
  const importBaseUSD    = FX_ITEMS.importItem.localPrice / FX_BASE.jpy;
  const exportBaseUSD     = FX_ITEMS.exportItem.localPrice / FX_BASE.try;

  return {eurRate, jpyRate, tryRate, vacationUSD, importUSD, exportUSD, vacationBaseUSD, importBaseUSD, exportBaseUSD};
}

function renderTheory10(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 10 — Currency Exchange Simulator</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>An exchange rate is just the price of one currency in terms of another. Unlike a stock or a bond, a currency doesn't have an obvious "up is good" direction — a stronger dollar helps some people and hurts others, often at the very same moment, depending on which side of a transaction they're standing on.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Exchange rate", "How much of one currency it takes to buy one unit of another — e.g. how many Japanese yen it takes to buy one U.S. dollar."],
        ["Direct quote (USD-per-foreign)", "Quoting a currency as how many dollars one unit of it costs — the convention normally used for EUR, e.g. '$1.08 per euro.'"],
        ["Indirect quote (foreign-per-USD)", "Quoting a currency as how many units of it one dollar buys — the convention normally used for JPY and TRY, e.g. '151 yen per dollar.'"],
        ["Appreciation", "A currency becoming worth more relative to another — it now takes fewer units of it to buy the same foreign currency."],
        ["Depreciation", "A currency becoming worth less relative to another — it now takes more units of it to buy the same foreign currency."],
        ["Import", "A good bought from abroad and brought into the home country — its cost in home currency depends directly on the exchange rate."],
        ["Export", "A good sold abroad by a home-country business — the foreign currency it earns must be converted back to home currency, again depending on the exchange rate."]
      ])}

      <h3>Converting between currencies</h3>
      <p>When a currency is quoted directly (USD per unit of foreign currency, the usual convention for EUR), converting a foreign price to dollars means multiplying:</p>
      <div class="formula-box">$$Cost_{USD} = Price_{foreign} \\times Rate_{USD/foreign}$$</div>
      <p>When a currency is quoted indirectly (units of foreign currency per USD, the usual convention for JPY and TRY), converting means dividing instead:</p>
      <div class="formula-box">$$Cost_{USD} = \\frac{Price_{foreign}}{Rate_{foreign/USD}}$$</div>

      <h3>Who wins and who loses when a currency moves</h3>
      <p>Say the U.S. dollar <b>strengthens</b> (appreciates) against a foreign currency. A dollar now buys more of that foreign currency than before. That's great news for:</p>
      <p>— <b>American vacationers</b> abroad (everything priced in the foreign currency now costs fewer dollars), and<br>
      — <b>American importers</b> (foreign-made goods now cost fewer dollars to buy).</p>
      <p>But it's bad news for <b>American exporters</b>: when they sell goods abroad priced in the foreign currency and convert the proceeds back, a stronger dollar means those same foreign-currency earnings convert into <i>fewer</i> dollars of profit. A weaker dollar flips all three of these around exactly.</p>

      <h3>Why this connects to earlier labs</h3>
      <p>Exchange rates don't move randomly — they're heavily influenced by the interest-rate differences covered in Labs 08 and 09. A country offering a much higher interest rate tends to attract foreign capital seeking that yield, which increases demand for its currency and can cause it to appreciate — unless inflation (also from Lab 09) is eroding that currency's value faster than the higher rate compensates for, which is exactly the situation Turkey found itself in through parts of 2021–2024, and part of why the lira depreciated so sharply even as its policy rate rose.</p>
    </div>
  `;
}

/* =========================================================
   LAB 11 — BOND PRICING
   Real-world data: approximate U.S. 10-year Treasury yield,
   annual averages, 2015–2024 (illustrative, rounded — for
   teaching purposes, not a precision financial record).
   Chosen because 2020 (yields near historic lows) and 2023
   (yields near a multi-decade high) bracket one of the
   sharpest real bond-market moves in recent history — a
   fixed-coupon bond bought in 2020 and priced at 2023 rates
   lost a large, real, measurable share of its value, purely
   from rates rising. Single annual coupon assumed throughout
   for simplicity — real Treasury bonds pay semiannually.
   ========================================================= */
const TREASURY_10Y_HISTORY = [
  {year:2015, yield:2.14}, {year:2016, yield:1.84}, {year:2017, yield:2.33},
  {year:2018, yield:2.91}, {year:2019, yield:2.14}, {year:2020, yield:0.89},
  {year:2021, yield:1.45}, {year:2022, yield:2.95}, {year:2023, yield:3.96},
  {year:2024, yield:4.21}
];

const bond = { face:1000, couponRate:5, years:10, marketRate:5, useRealData:false, yearIdx:9 };

/* Standard bond pricing: sum of discounted coupons + discounted face value.
   Single annual coupon, C = face * couponRate. r = market discount rate. */
function bondPrice(face, couponRatePct, years, marketRatePct){
  const C = face * couponRatePct/100;
  const r = marketRatePct/100;
  let price = 0;
  if(Math.abs(r) < 1e-9){
    price = C*years + face; // no discounting at 0% rate
  }else{
    for(let t=1; t<=years; t++){
      price += C / Math.pow(1+r, t);
    }
    price += face / Math.pow(1+r, years);
  }
  return price;
}

/* ---- Subtab: Theory ---- */
function renderTheory11(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 11 — Bond Pricing</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>A bond is a loan running in reverse: instead of you borrowing from a bank, you lend money to a government or company, and they pay you back with regular fixed interest payments plus your original amount at the end. Once issued, a bond's own fixed payments never change — but its <b>price</b> in the market moves constantly, because it has to compete with whatever new bonds are currently offering.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Face value (par value)", "The amount the bond repays at maturity — commonly $1,000 for a single bond. Also called the <b>par value</b>."],
        ["Coupon rate", "The fixed annual interest rate printed on the bond when it's issued — this never changes for the life of the bond."],
        ["Coupon payment", "The actual dollar amount paid each year — face value × coupon rate."],
        ["Market interest rate (yield)", "The interest rate currently available on newly issued, comparable bonds. This moves constantly with the economy."],
        ["Bond price", "What the bond actually sells for today in the market — can be above, below, or equal to face value."],
        ["Par", "When a bond's price equals its face value — happens exactly when the coupon rate equals the current market rate."],
        ["Premium", "When a bond's price is above face value — happens when its coupon rate is higher than the current market rate, since its fixed payments are more attractive than what's newly available."],
        ["Discount", "When a bond's price is below face value — happens when its coupon rate is lower than the current market rate, since its fixed payments are less attractive than what's newly available."]
      ])}

      <h3>The bond pricing formula</h3>
      <p>A bond's price is simply the present value of all its future cash flows — every coupon payment (<b>C</b>) plus the final face value (<b>F</b>) — each discounted back to today at the current market rate (<b>r</b>):</p>
      <div class="formula-box">$$Price = \\sum_{t=1}^{n} \\frac{C}{(1+r)^{t}} + \\frac{F}{(1+r)^{n}}$$</div>
      <p>Here <b>n</b> is the number of years left to maturity. This is the same present-value logic from Lab 01 — just applied to a whole stream of future payments instead of a single lump sum.</p>

      <h3>Why higher interest rates mean lower bond prices</h3>
      <p>A bond's coupon payments are <b>fixed</b> — locked in the moment it's issued. If market interest rates rise afterward, brand-new bonds start offering bigger coupon payments for the same face value. The old, lower-coupon bond is now less attractive by comparison, so its price has to fall until it offers a buyer the same effective return as the new bonds do. The formula makes this automatic: raising <b>r</b> makes every denominator in the sum bigger, which makes the whole price smaller. The relationship runs in only one direction — bond prices and interest rates always move opposite each other.</p>
      <div class="formula-box">$$r \\uparrow \\;\\Rightarrow\\; Price \\downarrow \\qquad\\qquad r \\downarrow \\;\\Rightarrow\\; Price \\uparrow$$</div>

      <h3>Longer maturities feel it more</h3>
      <p>A bond with many years left to maturity has more future coupon payments exposed to the new, less-favorable discount rate, and its far-off face value gets discounted over more years too. Short-maturity bonds barely move when rates change; long-maturity bonds can move dramatically. The Simulation tab lets you see this directly by adjusting years to maturity alongside the rate.</p>

      <h3>A real-world case: bonds bought in 2020, priced by 2023</h3>
      <p>U.S. 10-year Treasury yields fell to roughly 0.89% in 2020 — among the lowest in decades — then rose to roughly 3.96% by 2023 as the Federal Reserve fought inflation (see Lab 08). A bond bought in 2020 with a coupon locked in near that era's low rate became, by 2023, a fixed-payment asset competing against newly issued bonds paying far more. Its price had to fall to compensate — a real, painful lesson for many bond investors in 2022–2023, worked through numerically in the Solution tab.</p>
    </div>
  `;
}

/* ---- Subtab: Solution (worked example, real 2020 vs 2023 Treasury yields) ---- */
function renderSolution11(){
  const face = 1000, years = 10;
  const y2020 = TREASURY_10Y_HISTORY.find(t=>t.year===2020).yield; // 0.89% — coupon locked in at issuance, priced at par
  const y2023 = TREASURY_10Y_HISTORY.find(t=>t.year===2023).yield; // 3.96% — market rate 3 years later

  const priceAtIssue = bondPrice(face, y2020, years, y2020); // should equal face (par)
  const priceIn2023 = bondPrice(face, y2020, years - 3, y2023); // 3 years elapsed, 7 years left

  const lossPct = 100*(priceIn2023-priceAtIssue)/priceAtIssue;

  const testRates = [0.89, 1.45, 2.95, 3.96, 5.0];
  let rows = '';
  testRates.forEach(r=>{
    const p = bondPrice(face, y2020, years-3, r);
    const status = Math.abs(p-face)<1 ? 'Par' : (p>face ? 'Premium' : 'Discount');
    rows += `<tr>
      <td>${r.toFixed(2)}%</td>
      <td class="${p<face?'':''}" style="${p<face?'color:var(--loss);':'color:var(--emerald-bright);'}">$${p.toFixed(2)}</td>
      <td>${status}</td>
    </tr>`;
  });

  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 11 — Bond Pricing</h2>
    <div class="desc">Solution — a $1,000, 10-year bond issued in 2020 near record-low rates, repriced 3 years later</div>
    <div class="theory-block">
      <p><b>Setup:</b> a $1,000 face-value, 10-year bond is issued in 2020 when the 10-year Treasury yield was about ${y2020.toFixed(2)}%. Issued at par, its coupon rate is set to match that yield exactly (${y2020.toFixed(2)}%), so its issue-day price equals its $1,000 face value. Fast-forward to 2023: the bond now has 7 years left to maturity, and the market rate for comparable bonds has risen to about ${y2023.toFixed(2)}%.</p>

      ${glossaryHTML("Terms used in this table", [
        ["Market rate tested", "The current market interest rate used to discount the bond's remaining 7 years of fixed ${y2020.toFixed(2)}% coupon payments."],
        ["Resulting price", "What the bond is worth today at that market rate, using the pricing formula from the Theory tab."]
      ])}

      <table class="worked-table">
        <tr><th>Market rate</th><th>Bond price (7 yrs left)</th><th>Status</th></tr>
        ${rows}
      </table>
      <div class="solution-summary">
        The bond was issued at par: <b>$${priceAtIssue.toFixed(2)}</b>, exactly its $1,000 face value, because its coupon rate matched
        the market rate on day one. By 2023, with the same fixed ${y2020.toFixed(2)}% coupon but the market now demanding ${y2023.toFixed(2)}%,
        the bond's price has fallen to <b>$${priceIn2023.toFixed(2)}</b> — a drop of about <b>${Math.abs(lossPct).toFixed(1)}%</b>, despite the bond
        never missing a payment and being just as certain to repay its full $1,000 face value at maturity. Nothing about the bond's own
        promises changed; only the rate available elsewhere did — and that alone was enough to erase a meaningful chunk of its market value.
      </div>
      <div class="footnote">Treasury yield figures are approximate/illustrative annual averages, rounded — used to teach the mechanism, not as a precise financial record. Assumes a single annual coupon; real Treasury bonds pay semiannually, which changes exact figures slightly but not the direction of the effect.</div>
    </div>
  `;
}

  const diffPct = 100*(price-bond.face)/bond.face;

    ? 'The coupon rate matches the market rate, so the bond trades right at face value (par).'
    : (diffPct > 0
      ? `The coupon rate (${bond.couponRate.toFixed(1)}%) is above the market rate (${bond.marketRate.toFixed(2)}%), so buyers pay a premium of about ${diffPct.toFixed(1)}% over face value for those better-than-market payments.`
      : `The coupon rate (${bond.couponRate.toFixed(1)}%) is below the market rate (${bond.marketRate.toFixed(2)}%), so the bond only sells at a discount of about ${Math.abs(diffPct).toFixed(1)}% below face value to compete with newer bonds.`);
  wrap.appendChild(note);
}

/* =========================================================
   LAB 12 — RISK VS RETURN LABORATORY
   Six asset classes with illustrative annualized return/risk
   (standard deviation) parameters, approximate and rounded —
   for teaching purposes, not fitted financial estimates. Cash
   through Corporate Bonds are simplified textbook figures.
   Stocks re-uses the REAL S&P 500 mean/stdev computed from
   SP500_HISTORY (Lab 02/06) via sp500Stats(), so the "Stocks"
   dot in the scatter plot is grounded in the same real data
   used elsewhere in the app. Crypto is a deliberately extreme
   illustrative case (roughly Bitcoin-scale volatility) to make
   the risk/return spread dramatic and visually obvious.

   Monte Carlo engine: for each asset, simulate 1000 random
   multi-year paths (Box–Muller normal draws per year, same
   technique as Lab 06's random-walk mode), compound each path
   into a realized CAGR, then scatter all simulated CAGRs
   against that asset's risk parameter. Students see, for each
   asset, a cloud of 1000 possible outcomes rather than a
   single "expected" number.
   ========================================================= */
function getAssetClasses(){
  const s = sp500Stats(); // real S&P 500 mean/stdev, reused from Lab 06
  return [
    {key:'cash',     label:'Cash (under the mattress)', return:0.5,  risk:0.3,  color:'#6c8274'},
    {key:'savings',  label:'Savings account',            return:1.5,  risk:0.6,  color:'#a9c2ae'},
    {key:'govt',     label:'Government bonds',            return:3.0,  risk:6.0,  color:'#4fc3e0'},
    {key:'corp',     label:'Corporate bonds',              return:5.0,  risk:9.0,  color:'#e6c368'},
    {key:'stocks',   label:'Stocks (real S&P 500 stats)',  return:s.mean, risk:s.stdev, color:'#3fd69a'},
    {key:'crypto',   label:'Crypto',                       return:55.0, risk:75.0, color:'#d9614f'}
  ];
}

const rr = { years:10, trials:1000, enabled:{cash:true, savings:true, govt:true, corp:true, stocks:true, crypto:true} };
let rrLastSimResults = null; // {key: [cagr, cagr, ...]}

function boxMullerSample(meanPct, stdevPct){
  let u1 = Math.random(), u2 = Math.random();
  if(u1 < 1e-9) u1 = 1e-9;
  const z = Math.sqrt(-2*Math.log(u1)) * Math.cos(2*Math.PI*u2);
  return meanPct + z*stdevPct;
}

/* Simulate `trials` independent multi-year paths for one asset, each path
   drawing `years` random annual returns from a normal distribution, then
   compounding into a single realized CAGR for that path. */
function simulateAssetCAGRs(trials, years, meanPct, stdevPct){
  const out = new Array(trials);
  for(let i=0; i<trials; i++){
    let val = 1;
    for(let y=0; y<years; y++){
      const r = boxMullerSample(meanPct, stdevPct);
      val *= (1 + r/100);
    }
    out[i] = (Math.pow(Math.max(val,1e-9), 1/years) - 1) * 100;
  }
  return out;
}

function meanOf(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function stdevOf(arr){
  const m = meanOf(arr);
  return Math.sqrt(arr.reduce((a,b)=>a+(b-m)*(b-m),0)/arr.length);
}

        ["Volatility", "Another word for the same thing as risk here — how much returns bounce around year to year."],
        ["Monte Carlo simulation", "A technique that runs an outcome many times (here, 1,000 times) using randomly drawn inputs each time, to see the full range of things that could plausibly happen — rather than relying on a single average number."],
        ["CAGR", "Compound Annual Growth Rate — the single steady annual rate that would produce the same total growth as a whole multi-year path, introduced in Lab 06."],

      <p>where each yearly return <b>r<sub>y</sub></b> is drawn independently from a normal distribution centered on that asset's expected return, with a spread set by its risk (standard deviation) — the same Box–Muller random-sampling technique used in Lab 06's Monte Carlo mode.</p>

  let widestAsset = null, widestSpread = -1;
  enabledAssets.forEach(a=>{

   Real-world anchor: approximate average U.S. household

   category shares — NOT a precise economic record) used as a

   events (medical bill, car repair, bonus, vacation) use the
   same Box–Muller-adjacent random-draw pattern already used
   for Monte Carlo in Labs 06 and 12, applied here as simple
   chance-per-month draws rather than normal sampling, since
   real-world windfalls/shocks are lumpy, not continuous.
   ========================================================= */
const BUDGET_BENCHMARKS = {

  // sums to 82% — the remaining ~18% covers categories this simplified
  // model doesn't break out (healthcare, insurance, debt payments, etc.)

const BUDGET_EVENTS = [
  {key:'medical',   label:'Medical bill', type:'expense', chance:0.08, min:200,  max:1500},
  {key:'carrepair', label:'Car repair',   type:'expense', chance:0.06, min:150,  max:1200},
  {key:'bonus',     label:'Bonus',        type:'income',  chance:0.05, min:500,  max:2500},
  {key:'vacation',  label:'Vacation',     type:'expense', chance:0.04, min:400,  max:2000}
];

const bud = {
  salary:5000,
  alloc:{housing:30, food:15, transport:10, entertainment:10, investment:10, savings:15},
  months:12,
  useRealAlloc:false,
  eventsEnabled:true,
  investReturn:7,   // annual %, applied monthly to the investment bucket
  savingsReturn:2   // annual %, applied monthly to the savings bucket
};
let budLastSim = null; // cached so re-renders (e.g. toggling a checkbox) don't silently reroll events

function budAllocTotal(alloc){
  return alloc.housing+alloc.food+alloc.transport+alloc.entertainment+alloc.investment+alloc.savings;
}

/* Core monthly simulation. If eventLog is passed in (scripted events, used by
   the static Solution example), those exact events are applied instead of
   rolling random chance — keeps the worked example reproducible. */
function simulateBudget(months, salary, alloc, investReturnAnnual, savingsReturnAnnual, eventsEnabled, scriptedEvents){
  const investR = investReturnAnnual/100/12;
  const savingsR = savingsReturnAnnual/100/12;
  const total = budAllocTotal(alloc);
  const unallocPct = 100 - total;

  let checking = 0, savings = 0, invest = 0;
  const checkingSeries=[0], savingsSeries=[0], investSeries=[0], totalSeries=[0];
  const eventLog = [];

  for(let m=1; m<=months; m++){
    const housingCost = salary*alloc.housing/100;
    const foodCost = salary*alloc.food/100;
    const transportCost = salary*alloc.transport/100;
    const entertainmentCost = salary*alloc.entertainment/100;
    const investContrib = salary*alloc.investment/100;
    const savingsContrib = salary*alloc.savings/100;
    const unallocCash = salary*unallocPct/100; // leftover buffer, stays liquid in checking

    checking += salary - housingCost - foodCost - transportCost - entertainmentCost - investContrib - savingsContrib - unallocCash + unallocCash;
    // (the unalloc term cancels intentionally — it's salary minus every allocated bucket, i.e. exactly the buffer)
    invest = (invest + investContrib) * (1+investR);
    savings = (savings + savingsContrib) * (1+savingsR);

    if(scriptedEvents){
      scriptedEvents.filter(e=>e.month===m).forEach(e=>{
        checking += e.type==='income' ? e.amount : -e.amount;
        eventLog.push({month:m, label:e.label, amount:e.amount, type:e.type});
      });
    }else if(eventsEnabled){
      BUDGET_EVENTS.forEach(ev=>{
        if(Math.random() < ev.chance){
          const amt = ev.min + Math.random()*(ev.max-ev.min);
          checking += ev.type==='income' ? amt : -amt;
          eventLog.push({month:m, label:ev.label, amount:amt, type:ev.type});
        }
      });
    }

    checkingSeries.push(checking);
    savingsSeries.push(savings);
    investSeries.push(invest);
    totalSeries.push(checking+savings+invest);
  }
  return {checkingSeries, savingsSeries, investSeries, totalSeries, eventLog, unallocPct};
}

    <div class="theory-block">
      <p>A budget is just a plan for where every dollar of income goes before it arrives — split between fixed obligations, everyday living costs, money set aside for the future, and a cushion for the unplanned. The math is simple addition and subtraction; the hard part is that real life doesn't stick to the plan.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Gross income", "Total earnings before taxes and deductions."],
        ["Net (take-home) income", "What's actually deposited after taxes — the number this lab treats as 'salary,' since it's what there is to allocate."],
        ["Fixed expenses", "Costs that stay roughly the same every month regardless of choices — e.g. rent or a mortgage payment."],
        ["Variable (discretionary) expenses", "Costs that can be adjusted month to month — e.g. entertainment, dining out."],
        ["Emergency fund", "Money set aside specifically to absorb unplanned costs (medical bills, car repairs) without derailing the rest of the budget."],
        ["Cash flow", "The net movement of money in and out over a period — positive cash flow means more came in than went out."],
        ["50/30/20 rule", "A commonly cited guideline: roughly 50% of take-home income to needs, 30% to wants, 20% to savings and debt repayment. A starting point, not a law."],
        ["Compounding (savings/investment)", "Money set aside doesn't just sit still — in a savings account or investment, it earns returns on top of returns, the same mechanism from Labs 01–02."]

      <p>Every month, a checking balance simply carries forward the leftover from allocating income across every category, plus or minus whatever unplanned events happened that month:</p>
      <div class="formula-box">$$Balance_m = Balance_{m-1} + Salary - \\sum Expenses - Contributions_{sav,inv} \\pm Events_m$$</div>
      <p>Money routed into savings or investment doesn't just sit at face value either — each of those buckets grows on its own:</p>
      <div class="formula-box">$$Bucket_m = (Bucket_{m-1} + Contribution_m)\\times(1+r_{monthly})$$</div>
      <p>where <b>r<sub>monthly</sub></b> is that bucket's annual return divided by 12 — investment accounts are modeled with a higher, more volatile long-run rate; savings accounts with a lower, steadier one, echoing the same trade-off from Lab 05.</p>

      <h3>Why "unexpected" events still belong in a budget</h3>
      <p>A medical bill or a car repair feels random in any given month, but over a year it's nearly certain that <i>something</i> unplanned will happen — an emergency fund (or an underspent buffer) exists precisely so an unplanned $800 expense doesn't force cutting into rent money. This lab treats events as monthly dice rolls: a small chance each month of a medical bill, a car repair, a surprise bonus, or a vacation cost — none guaranteed in any single month, but likely to show up somewhere across a full year.</p>

      <h3>What "real-world" allocation means here</h3>

/* =========================================================
   LAB 14 — BUSINESS SIMULATOR
   Fixed model constants below (demand baseline, price
   sensitivity, marketing effectiveness, competition penalty,
   capacity per employee, wage, material cost) are illustrative
   teaching parameters chosen to produce a plausible, readable
   simulation — NOT fitted to any real company or industry.
   Interest rate and inflation can optionally be driven by the
   REAL 2015–2024 U.S. Fed funds rate (FED_FUNDS_HISTORY, Lab 08)
   and CPI inflation (CPI_HISTORY, Lab 01) so the cost side of
   the simulation is grounded in real economic history even
   though the business itself is fictional.
   ========================================================= */
const BIZ_D0 = 4000;              // baseline monthly demand at the reference price
const BIZ_REF_PRICE = 40;         // $/unit reference price baseline demand assumes
const BIZ_PRICE_SENS = 60;        // units of demand lost per $1 above reference price
const BIZ_MKT_K = 3;              // demand gained per sqrt($ marketing spend)
const BIZ_COMP_PENALTY = 80;      // units of demand lost per competition-intensity point
const BIZ_CAPACITY_PER_EMP = 60;  // units/month one employee can produce
const BIZ_WAGE_PER_EMP = 3000;    // $/month base wage per employee, before inflation
const BIZ_MATERIAL_COST = 12;     // $/unit base material cost, before inflation

const biz = {
  price:40, employees:40, production:2400, marketing:5000,
  competition:5, loan:150000,
  interestRate:6, inflation:3, useRealEcon:false, yearIdx:0,
  months:12
};
let bizLastSim = null;

function bizDemand(price, marketing, competition){
  const q = BIZ_D0 - BIZ_PRICE_SENS*(price-BIZ_REF_PRICE) + BIZ_MKT_K*Math.sqrt(Math.max(0,marketing)) - BIZ_COMP_PENALTY*competition;
  return Math.max(0, q);
}

function simulateBusiness(params){
  const {price, employees, production, marketing, competition, loan, months, useRealEcon, yearIdx, interestRate, inflation} = params;
  const capacity = employees * BIZ_CAPACITY_PER_EMP;

  let cash = loan;
  let materialCost = BIZ_MATERIAL_COST;
  let wage = BIZ_WAGE_PER_EMP;

  const rows = [];
  for(let m=1; m<=months; m++){
    let annualRate, annualInf;
    if(useRealEcon){
      const idx = (yearIdx + Math.floor((m-1)/12)) % FED_FUNDS_HISTORY.length;
      annualRate = FED_FUNDS_HISTORY[idx].pct;
      annualInf = CPI_HISTORY[idx].pct;
    }else{
      annualRate = interestRate;
      annualInf = inflation;
    }
    const monthlyInf = Math.pow(1+annualInf/100, 1/12) - 1;
    if(m>1){ materialCost *= (1+monthlyInf); wage *= (1+monthlyInf); }

    const demand = bizDemand(price, marketing, competition);
    const unitsProduced = Math.min(production, capacity);
    const unitsSold = Math.min(unitsProduced, demand);

    const revenue = price*unitsSold;
    const cogs = materialCost*unitsProduced;
    const wages = wage*employees;
    const interest = loan*(annualRate/100/12);
    const profit = revenue - cogs - wages - marketing - interest;
    cash += profit;

    rows.push({month:m, year: useRealEcon ? FED_FUNDS_HISTORY[(yearIdx+Math.floor((m-1)/12))%FED_FUNDS_HISTORY.length].year : null,
      demand, capacity, unitsProduced, unitsSold, revenue, cogs, wages, marketing, interest, profit, cash,
      annualRate, annualInf, materialCost, wage});
  }
  return rows;
}

/* ---- Subtab: Theory ---- */
function renderTheory14(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 14 — Business Simulator</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>Running a company means making several decisions at once, none of them in isolation — the price you charge changes how much you sell, how many people you hire limits how much you can make, and how much you spend on marketing can pull in demand that wouldn't otherwise exist. Meanwhile, forces outside your control — competitors, interest rates, inflation — quietly reshape the numbers underneath every decision.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Demand", "How many units customers want to buy at a given price — falls as price rises, rises with marketing spend, and falls as competition intensifies."],
        ["Production capacity", "The maximum units your workforce can physically produce in a month — determined by headcount."],
        ["Units sold", "The smaller of what you produced and what customers actually demanded — you can't sell what you didn't make, and you can't sell more than people want."],
        ["Revenue", "Price × units sold — money coming in."],
        ["COGS", "<b>Cost of Goods Sold</b> — the material cost of every unit <i>produced</i> (not just sold), since materials are spent whether or not the product sells."],
        ["Wages", "Total monthly pay to all employees — a fixed cost that doesn't shrink just because sales were slow that month."],
        ["Interest expense", "The monthly cost of carrying a business loan — principal × (annual rate ÷ 12), assuming interest-only for simplicity."],
        ["Profit", "Revenue minus every cost (COGS, wages, marketing, interest) for that month."],
        ["Cash balance", "Starting capital plus every month's profit added on — can go negative if losses pile up, meaning the business runs out of money."]
      ])}

      <h3>The demand curve this lab uses</h3>
      <p>Demand responds to three decisions and one outside pressure — price, marketing, and competition — around a baseline:</p>
      <div class="formula-box">$$Q_d = D_0 - s\\,(P-P_0) + k\\sqrt{M} - c \\cdot Comp$$</div>
      <p>Here <b>D₀</b> and <b>P₀</b> are the baseline demand and reference price, <b>s</b> is price sensitivity (raising price loses customers), <b>M</b> is marketing spend (the square root captures <i>diminishing returns</i> — doubling your marketing budget doesn't double your customers), and <b>Comp</b> is a 0–10 competition-intensity score that steadily eats into demand as rivals get stronger or more numerous.</p>

      <h3>Production, sales, and the overproduction trap</h3>
      <p>Employees set a hard ceiling on how much you can produce:</p>
      <div class="formula-box">$$Capacity = Employees \\times UnitsPerEmployee$$</div>
      <p>But producing more than the market actually demands doesn't help — those extra units still cost materials to make, yet earn no revenue if nobody buys them. The model deliberately does <i>not</i> let unsold inventory carry over or refund its cost, so overproduction shows up directly as wasted COGS eating into profit.</p>

      <h3>How interest and inflation feed in</h3>
      <p>A business loan (from Lab 04's mortgage logic, simplified to interest-only here) adds a fixed monthly interest cost driven by the prevailing interest rate. Inflation compounds monthly and raises both material costs and wages over time — the same compounding mechanism from Labs 01–03, just applied to a company's expenses instead of a household's. The Simulation tab can optionally replay the real 2015–2024 U.S. Fed funds rate and CPI inflation (from Labs 08 and 01) instead of a flat assumption, so you can see how a company would have fared financing itself through a real period of rising rates.</p>

      <h3>Profit vs. cash</h3>
      <p>Profit is a monthly scorecard; cash is the running total. A single bad month can be recovered from if cash reserves are healthy — but a business that runs its cash balance negative for long enough, even while individual months look survivable, is in real trouble. The Simulation tab tracks both.</p>
    </div>
  `;
}

/* =========================================================
   LAB 15 — RETIREMENT PLANNER
   Two-phase model: accumulation (working years, monthly
   contributions compounding) then decumulation (retirement
   years, level real-terms monthly income drawn down via a
   standard annuity-immediate formula, same present-value logic
   as Lab 11's bond pricing and Lab 04's loan amortization, just
   run in reverse). Reuses SP500_HISTORY (Lab 02/06) and
   CPI_HISTORY (Lab 01) as optional real-world return/inflation
   paths, cycling year over year across a multi-decade horizon.
   ========================================================= */
const ret = {
  currentAge:30, retirementAge:65, lifeExpectancy:90,
  currentSavings:20000, monthlyInvestment:500,
  expectedReturn:7, inflation:3,
  useRealMarket:false, useRealCPI:false,
  playing:false, playYear:0
};
let retLastSim = null;

/* Simulate the accumulation phase, month by month, returning
   yearly snapshots (nominal + real, in today's-dollar terms). */
function simulateAccumulation(p){
  const years = p.retirementAge - p.currentAge;
  let nominal = p.currentSavings;
  let cumInf = 1;
  const nominalYearly = [nominal];
  const realYearly = [nominal];
  const ratesUsed = [];

  for(let y=1; y<=years; y++){
    const annualReturn = p.useRealMarket ? SP500_HISTORY[(y-1)%SP500_HISTORY.length].pct : p.expectedReturn;
    const annualInf = p.useRealCPI ? CPI_HISTORY[(y-1)%CPI_HISTORY.length].pct : p.inflation;
    const monthlyReturn = Math.pow(1+annualReturn/100, 1/12) - 1;
    for(let m=0; m<12; m++){
      nominal = nominal*(1+monthlyReturn) + p.monthlyInvestment;
    }
    cumInf *= (1+annualInf/100);
    nominalYearly.push(nominal);
    realYearly.push(nominal/cumInf);
    ratesUsed.push({annualReturn, annualInf});
  }
  return {nominalYearly, realYearly, ratesUsed, finalNominal:nominal, finalReal:nominal/cumInf, cumInfAtRetirement:cumInf};
}

/* Annuity-immediate payout: level monthly income (in today's
   real dollars) that exactly exhausts realWealth over n months
   at a constant real monthly rate. */
function annuityPayment(principal, monthlyRate, nMonths){
  if(Math.abs(monthlyRate) < 1e-9) return principal/nMonths;
  return principal * monthlyRate / (1 - Math.pow(1+monthlyRate, -nMonths));
}

function simulateDecumulation(realWealth, avgReturnPct, avgInfPct, retirementYears, cumInfAtRetirement){
  const nMonths = retirementYears*12;
  const realAnnualRate = (100*((1+avgReturnPct/100)/(1+avgInfPct/100) - 1));
  const realMonthlyRate = Math.pow(1+realAnnualRate/100, 1/12) - 1;
  const payment = annuityPayment(realWealth, realMonthlyRate, nMonths);

  let realBal = realWealth;
  const realYearly = [realBal];
  const nominalYearly = [realBal*cumInfAtRetirement];
  let cumInf = cumInfAtRetirement;
  const monthlyInf = Math.pow(1+avgInfPct/100, 1/12)-1;

  for(let y=1; y<=retirementYears; y++){
    for(let m=0; m<12; m++){
      realBal = (realBal - payment)*(1+realMonthlyRate);
      cumInf *= (1+monthlyInf);
    }
    realYearly.push(Math.max(0,realBal));
    nominalYearly.push(Math.max(0,realBal)*cumInf);
  }
  return {payment, realYearly, nominalYearly, nominalPaymentAtRetirement: payment*cumInfAtRetirement};
}

function renderTheory15(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 15 — Retirement Planner</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>Retirement planning is really two mirror-image problems joined at one moment in time: for decades you add money and let it grow (<b>accumulation</b>), then for the rest of life you draw it back down (<b>decumulation</b>) — trying to spend it at a pace that doesn't run out before you do.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Accumulation phase", "The working years, from now until retirement, during which regular contributions are invested and compound."],
        ["Decumulation phase", "The retirement years, during which no new money goes in — the accumulated balance is instead withdrawn steadily to live on."],
        ["Nominal wealth", "The plain dollar amount in the account, with no adjustment for inflation."],
        ["Real wealth", "What that dollar amount can actually buy, expressed in today's purchasing power — the same real-vs-nominal distinction from Lab 01, now applied over a multi-decade horizon."],
        ["Expected return", "The assumed average annual growth rate of invested money during the accumulation phase."],
        ["Safe withdrawal rate", "A commonly cited rule of thumb (e.g. the '4% rule') for how much of a retirement balance can be withdrawn each year without excessive risk of running out — a simplification of the more precise annuity math this lab uses directly."],
        ["Annuity payment", "A level, regular payment calculated so that a fixed starting balance, still earning returns, is exactly exhausted after a set number of payments — the same present-value logic used to price a bond in Lab 11, run in reverse."],
        ["Life expectancy (planning horizon)", "How many years the retirement balance needs to last — set deliberately, not predicted, since planning for a shorter-than-actual lifespan risks running out of money."]
      ])}

      <h3>Accumulation: growing the balance</h3>
      <p>Each month, the balance grows by that month's return, then a new contribution (<b>C</b>) is added:</p>
      <div class="formula-box">$$Balance_m = Balance_{m-1}\\times(1+r_{monthly}) + C$$</div>
      <p>Over enough decades, the earlier contributions matter disproportionately — money added in your 20s has 30–40 years to compound, while money added in your 50s has only a decade or two, echoing the compounding lessons from Labs 01–02.</p>

      <h3>Nominal vs. real, over a working lifetime</h3>
      <p>A dollar contributed at age 30 and a dollar contributed at age 60 are not the same dollar in real terms — inflation has been eating at purchasing power the entire time. The real, inflation-adjusted balance at any point divides the nominal balance by cumulative inflation since today, exactly as in Lab 01:</p>
      <div class="formula-box">$$Real\\ Balance = \\frac{Nominal\\ Balance}{(1+\\pi)^{t}}$$</div>

      <h3>Decumulation: paying yourself back</h3>
      <p>At retirement, the accumulated real wealth needs to be converted into a stream of monthly income lasting through the whole retirement horizon (<b>n</b> months). Solving the same kind of present-value equation used to price a bond's coupons (Lab 11) — but solving for the payment instead of the price — gives a level monthly income that exactly exhausts the balance by the end:</p>
      <div class="formula-box">$$Payment = Wealth_{real} \\times \\frac{r_{real}}{1-(1+r_{real})^{-n}}$$</div>
      <p>Using the <b>real</b> monthly rate (return minus inflation, via the Fisher equation from Lab 09) means this payment holds <i>constant purchasing power</i> throughout retirement — it doesn't buy less in year 20 than it did in year 1, even though the nominal dollar figure needed to maintain it keeps rising with inflation.</p>

      <h3>Why this lab uses real market and inflation history</h3>
      <p>A flat "7% return, 3% inflation" assumption is a useful starting point, but real markets moved unevenly — the real S&amp;P 500 path (Lab 02/06) and real CPI history (Lab 01) can be cycled through the accumulation phase instead, showing how the exact same contribution schedule would have turned out riding through real up and down years rather than a smooth average.</p>
    </div>
  `;
}

function renderRetStack(nominal, real, upToIndex){
  const row = document.getElementById('stack-row-ret');
  row.innerHTML = '';
  const maxVal = Math.max(...nominal);
  nominal.forEach((val, i)=>{
    const visible = i <= upToIndex;
    const rval = real[i];
    const cell = document.createElement('div');
    cell.className = 'stack-year';
    const nomH = visible ? Math.max(2, 100*val/maxVal) : 0;
    const realH = visible ? Math.max(2, 100*rval/maxVal) : 0;
    cell.innerHTML = `
      <div style="position:relative; width:100%; height:100%;">
        <div class="bar actual" style="height:${nomH}%;"></div>
        <div class="bar real" style="height:${realH}%;"></div>
      </div>
      <div class="stack-yr-label">${ret.currentAge+i}</div>
    `;
    row.appendChild(cell);
  });
}

function playRetirementAnimation(){
  if(ret.playing) return;
  ret.playing = true;
  const acc = retLastSim.acc;
  let year = 0;
  const totalYears = acc.nominalYearly.length-1;
  const interval = setInterval(()=>{
    year++;
    renderRetStack(acc.nominalYearly, acc.realYearly, year);
    if(year >= totalYears || !ret.playing){
      clearInterval(interval);
      ret.playing = false;
    }
  }, Math.max(30, Math.min(300, 3000/Math.max(1,totalYears))));
}

/* =========================================================
   LAB 16 — TAX SIMULATOR
   Real-world data: approximate 2024 U.S. federal income tax
   brackets and standard deductions, Single and Married Filing
   Jointly (illustrative, rounded to whole numbers/percentages
   — for teaching purposes, not official tax guidance; real
   filing involves credits, phase-outs, state tax, and other
   factors this model deliberately omits).
   ========================================================= */
const TAX_BRACKETS_2024 = {
  single: {
    standardDeduction: 14600,
    brackets: [
      {rate:10, upTo:11600},
      {rate:12, upTo:47150},
      {rate:22, upTo:100525},
      {rate:24, upTo:191950},
      {rate:32, upTo:243725},
      {rate:35, upTo:609350},
      {rate:37, upTo:Infinity}
    ]
  },
  married: {
    standardDeduction: 29200,
    brackets: [
      {rate:10, upTo:23200},
      {rate:12, upTo:94300},
      {rate:22, upTo:201050},
      {rate:24, upTo:383900},
      {rate:32, upTo:487450},
      {rate:35, upTo:731200},
      {rate:37, upTo:Infinity}
    ]
  }
};

const tax = { grossIncome:85000, filing:'single', useDeduction:true };

/* Progressive tax calculation: each bracket's rate only applies to the
   slice of income that falls within it — never the whole income. */
function computeProgressiveTax(taxableIncome, brackets){
  let remaining = Math.max(0, taxableIncome);
  let totalTax = 0;
  let lowerBound = 0;
  const bracketBreakdown = [];
  let marginalRate = brackets[0].rate;

  for(const b of brackets){
    const sliceWidth = b.upTo - lowerBound;
    const sliceTaxed = Math.min(remaining, sliceWidth);
    if(sliceTaxed > 0){
      const sliceTax = sliceTaxed * b.rate/100;
      totalTax += sliceTax;
      bracketBreakdown.push({rate:b.rate, from:lowerBound, to:Math.min(b.upTo, lowerBound+sliceTaxed), taxed:sliceTaxed, tax:sliceTax});
      marginalRate = b.rate;
      remaining -= sliceTaxed;
    }
    lowerBound = b.upTo;
    if(remaining <= 0) break;
  }
  return {totalTax, bracketBreakdown, marginalRate};
}

function computeTaxResult(gross, filingKey, useDeduction){
  const plan = TAX_BRACKETS_2024[filingKey];
  const deduction = useDeduction ? plan.standardDeduction : 0;
  const taxable = Math.max(0, gross - deduction);
  const {totalTax, bracketBreakdown, marginalRate} = computeProgressiveTax(taxable, plan.brackets);
  const net = gross - totalTax;
  const effectiveRate = gross>0 ? 100*totalTax/gross : 0;
  return {deduction, taxable, totalTax, bracketBreakdown, marginalRate, net, effectiveRate};
}

function renderTheory16(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 16 — Tax Simulator</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>Income tax in the U.S. (and many other countries) is <b>progressive</b> — but not in the way people often picture it. Moving into a higher tax bracket doesn't tax your <i>entire</i> income at the new, higher rate. Only the slice of income that actually falls inside that bracket gets taxed at that bracket's rate. Everything below it was already taxed at the lower rates that applied to those earlier slices.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Gross income", "Total income earned before any taxes or deductions are subtracted."],
        ["Standard deduction", "A fixed dollar amount subtracted from gross income before tax brackets are applied — a simplification that reduces taxable income for nearly every filer without itemizing individual expenses."],
        ["Taxable income", "Gross income minus deductions — the amount tax brackets are actually applied to."],
        ["Tax bracket", "A range of income taxed at a specific rate. A single filer might have one bracket for the first $11,600 of taxable income, a different bracket for the next chunk, and so on."],
        ["Marginal tax rate", "The rate applied to the <i>next dollar</i> earned — i.e. the rate of the highest bracket your taxable income currently reaches into."],
        ["Effective tax rate", "Total tax paid divided by gross income — the single 'average' rate actually paid, blending every bracket's contribution. Always lower than the marginal rate for anyone in more than one bracket."],
        ["Net income (take-home pay)", "Gross income minus total tax owed — what's actually left to spend or save."],
        ["Filing status", "A category (e.g. Single, Married Filing Jointly) that determines which bracket thresholds and standard deduction apply — married joint filers typically get roughly double the bracket widths and deduction of single filers."]
      ])}

      <h3>How progressive tax is actually calculated</h3>
      <p>Taxable income is split into slices, one per bracket, and each slice is taxed only at its own bracket's rate:</p>
      <div class="formula-box">$$Tax = \\sum_{i} r_i \\times \\big(\\min(Income, upTo_i) - lowerBound_i\\big)$$</div>
      <p>where each bracket <b>i</b> has a rate <b>r<sub>i</sub></b> and applies only to the portion of taxable income between that bracket's lower bound and its upper threshold (<b>upTo<sub>i</sub></b>).</p>

      <h3>Why marginal and effective rates diverge</h3>
      <p>Someone whose taxable income reaches into the 24% bracket does <b>not</b> pay 24% on their whole income — they pay 10% on the first slice, 12% on the next, 22% on the next, and only 24% on the portion that actually falls in that top bracket. Their <i>effective</i> rate — total tax divided by total income — ends up meaningfully lower than 24%. This is exactly why "I don't want a raise, it'll push me into a higher bracket" is a common misunderstanding: a raise can only ever increase your <i>marginal</i> rate on the new income, never retroactively raise the rate on income you already earned.</p>
      <div class="formula-box">$$Effective\\ Rate = \\frac{Total\\ Tax}{Gross\\ Income} \\qquad\\qquad Marginal\\ Rate = r_{\\text{top bracket reached}}$$</div>

      <h3>Deductions shift where brackets start biting</h3>
      <p>The standard deduction is subtracted from gross income <i>before</i> brackets are applied — it doesn't change any bracket's rate, but it shrinks the taxable base every rate is applied to, which is why two people with the same gross income but different deductions can end up with different effective rates.</p>

      <h3>What this lab uses as real data</h3>
      <p>The Simulation tab uses the actual approximate 2024 U.S. federal bracket thresholds and standard deduction for both Single and Married Filing Jointly status — real numbers, though this simplified model omits credits, phase-outs, state and local tax, and other real-world complications that would change an actual tax bill.</p>
    </div>
  `;
}

/* =========================================================
   LAB 17 — PORTFOLIO DIVERSIFICATION
   Five asset classes with illustrative annualized return/risk
   parameters (Stocks reuses the REAL S&P 500 mean/stdev from
   sp500Stats(), Lab 06/12 — the other four are simplified
   teaching values, not fitted estimates). A fixed, illustrative
   correlation matrix drives correlated Monte Carlo draws via a
   Cholesky decomposition, so diversification's risk-reduction
   benefit is a real emergent property of the simulation rather
   than an assumed result. 1,000 trials, each simulating a
   multi-year path of correlated annual returns, rebalanced to
   target weights each year (simplest rebalancing assumption).
   ========================================================= */
function getPortfolioAssets(){
  const s = sp500Stats(); // real S&P 500 mean/stdev, reused from Lab 06/12
  return [
    {key:'stocks', label:'Stocks', return:s.mean, risk:s.stdev, color:'#3fd69a'},
    {key:'bonds',  label:'Bonds',  return:4.0,     risk:6.0,     color:'#4fc3e0'},
    {key:'cash',   label:'Cash',   return:1.5,     risk:0.5,     color:'#a9bcae'},
    {key:'gold',   label:'Gold',   return:5.0,     risk:15.0,    color:'#e6c368'},
    {key:'crypto', label:'Crypto', return:55.0,    risk:75.0,    color:'#d9614f'}
  ];
}

/* Illustrative correlation matrix, order: stocks, bonds, cash, gold, crypto.
   Stocks/bonds mildly negative (classic diversification pairing), cash
   near-zero with everything, gold slightly negative with stocks (safe-haven
   behavior), crypto weakly positive with stocks (both "risk-on" assets) and
   near-zero with everything else. Rounded, for teaching purposes only. */
const PORT_CORR = [
  [1.00, -0.20,  0.05, -0.10,  0.30],
  [-0.20, 1.00,  0.10,  0.15, -0.05],
  [0.05,  0.10,  1.00,  0.00,  0.00],
  [-0.10, 0.15,  0.00,  1.00,  0.05],
  [0.30, -0.05,  0.00,  0.05,  1.00]
];

/* Cholesky decomposition of a symmetric positive-definite correlation
   matrix -> lower-triangular L such that L * L^T = corr. Used to turn
   independent standard-normal draws into correlated ones. */
function choleskyDecompose(matrix){
  const n = matrix.length;
  const L = Array.from({length:n}, ()=>new Array(n).fill(0));
  for(let i=0; i<n; i++){
    for(let j=0; j<=i; j++){
      let sum = 0;
      for(let k=0; k<j; k++) sum += L[i][k]*L[j][k];
      if(i===j){
        L[i][j] = Math.sqrt(Math.max(0, matrix[i][i]-sum));
      }else{
        L[i][j] = (matrix[i][j]-sum) / (L[j][j] || 1e-9);
      }
    }
  }
  return L;
}
const PORT_CHOL = choleskyDecompose(PORT_CORR);

function stdNormal(){
  let u1 = Math.random(), u2 = Math.random();
  if(u1 < 1e-9) u1 = 1e-9;
  return Math.sqrt(-2*Math.log(u1)) * Math.cos(2*Math.PI*u2);
}

/* One correlated draw across all n assets for a single year, given each
   asset's mean/stdev and the shared Cholesky factor. */
function correlatedYearlyReturns(assets, chol){
  const z = assets.map(()=>stdNormal());
  const correlatedZ = chol.map(row=> row.reduce((sum,c,k)=> sum + c*z[k], 0));
  return assets.map((a,i)=> a.return + correlatedZ[i]*a.risk);
}

const port = { weights:{stocks:40, bonds:30, cash:10, gold:10, crypto:10}, years:10, trials:1000, riskFree:2 };
let portLastSim = null; // {trialReturns: [ [yearlyPortfolioReturn,...], ... ], perAssetSeries }

function portWeightTotal(w){
  return w.stocks+w.bonds+w.cash+w.gold+w.crypto;
}

function simulatePortfolio(weights, years, trials, riskFreePct){
  const assets = getPortfolioAssets();
  const wArr = assets.map(a=>weights[a.key]/100);
  const trialCAGRs = [];
  const allYearlyReturns = []; // flattened, for worst/best year and volatility
  const trialYearSeries = []; // for the fan chart (subset)

  for(let t=0; t<trials; t++){
    let value = 1;
    const yearlyPortReturns = [];
    for(let y=0; y<years; y++){
      const yearReturns = correlatedYearlyReturns(assets, PORT_CHOL); // % per asset this year
      let portReturn = 0;
      for(let i=0; i<assets.length; i++) portReturn += wArr[i]*yearReturns[i];
      value *= (1+portReturn/100);
      yearlyPortReturns.push(portReturn);
      allYearlyReturns.push(portReturn);
    }
    const cagr = (Math.pow(Math.max(value,1e-9), 1/years) - 1) * 100;
    trialCAGRs.push(cagr);
    if(t < 40) trialYearSeries.push(yearlyPortReturns); // cap stored paths for the fan chart
  }

  const meanReturn = meanOf(trialCAGRs);
  const volatility = stdevOf(allYearlyReturns); // annual portfolio volatility, across all simulated years
  const worstYear = Math.min(...allYearlyReturns);
  const bestYear = Math.max(...allYearlyReturns);
  const sharpe = volatility>0 ? (meanReturn-riskFreePct)/volatility : 0;

  return {trialCAGRs, meanReturn, volatility, worstYear, bestYear, sharpe, trialYearSeries, assets};
}

/* ---- Subtab: Theory ---- */
function renderTheory17(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 17 — Portfolio Diversification</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>Lab 12 showed that riskier assets carry wider outcome ranges. This lab asks the next question: what happens if you don't put all your money in one asset, but split it across several that don't move in exactly the same way at the same time? The surprising result is that a mixed portfolio can end up <i>less</i> risky than even its safest individual ingredient, without necessarily giving up much return.</p>

      ${glossaryHTML("Terms used on this page", [
        ["Diversification", "Spreading money across multiple assets whose returns aren't perfectly in sync, so that a bad year in one is often cushioned by an average or good year in another."],
        ["Correlation", "A number from −1 to +1 describing how two assets' returns move together. +1 means they move in perfect lockstep; −1 means one tends to rise exactly when the other falls; 0 means no relationship."],
        ["Portfolio volatility", "The standard deviation of the whole portfolio's combined annual returns — how much the blended outcome swings, not any single asset's swing on its own."],
        ["Rebalancing", "Periodically selling a bit of whatever grew and buying a bit of whatever lagged, to bring the portfolio back to its original target weights — this lab rebalances every year."],
        ["Sharpe ratio", "Return earned per unit of risk taken, named after economist William Sharpe — a higher Sharpe ratio means more return for the same amount of volatility, or the same return for less."],
        ["Risk-free rate", "The return available on an investment with essentially no risk (e.g. a short-term government bill) — the baseline the Sharpe ratio measures 'extra' return against."],
        ["Worst year / best year", "Across every simulated year in every simulated trial, the single lowest and single highest annual portfolio return observed — a concrete look at the tails of the outcome distribution."]
      ])}

      <h3>Why correlation matters more than individual risk</h3>
      <p>A two-asset portfolio's variance isn't just a weighted average of each asset's own variance — it also depends on how the two move together:</p>
      <div class="formula-box">$$\\sigma_p^2 = w_1^2\\sigma_1^2 + w_2^2\\sigma_2^2 + 2w_1w_2\\,\\rho_{1,2}\\,\\sigma_1\\sigma_2$$</div>
      <p>Here <b>w₁, w₂</b> are the weights allocated to each asset, <b>σ₁, σ₂</b> are each asset's own risk (standard deviation), and <b>ρ<sub>1,2</sub></b> (rho) is the correlation between them. When <b>ρ</b> is strongly negative, that last term actually <i>subtracts</i> from total risk — combining two volatile assets that move opposite each other can produce a portfolio calmer than either one alone. When <b>ρ</b> is close to +1, there's little diversification benefit at all — the assets are effectively moving as one.</p>

      <h3>The Sharpe ratio: return per unit of risk</h3>
      <div class="formula-box">$$Sharpe = \\frac{\\bar{r}_p - r_f}{\\sigma_p}$$</div>
      <p>where <b>r̄<sub>p</sub></b> is the portfolio's average return, <b>r<sub>f</sub></b> is the risk-free rate, and <b>σ<sub>p</sub></b> is portfolio volatility. Two portfolios can have the exact same expected return, yet one achieves it far more smoothly — that portfolio has the higher Sharpe ratio, and is doing more with the same risk budget.</p>

      <h3>What this lab's assets and correlations represent</h3>
      <p>Five assets — Stocks (using the real S&amp;P 500 mean/volatility from Lab 06), Bonds, Cash, Gold, and Crypto — are combined using a fixed, illustrative correlation matrix: stocks and bonds mildly negatively correlated (a classic diversification pairing), gold mildly negatively correlated with stocks (its traditional "safe haven" behavior), cash nearly uncorrelated with everything, and crypto weakly positively correlated with stocks (both often behave as "risk-on" assets). These correlation figures are simplified teaching assumptions, not fitted to real historical co-movement.</p>

      <h3>Monte Carlo with correlation</h3>
      <p>Rather than simulating each asset independently (as Lab 12 does), this lab draws all five assets' returns <i>jointly</i> each simulated year, using a technique called Cholesky decomposition to convert independent random draws into correlated ones matching the target correlation matrix — so a simulated bad year for stocks is more likely to coincide with a simulated good year for bonds, exactly as the correlation assumption specifies.</p>
    </div>
  `;
}

function runPortfolioSimulation(){
  syncPortLabels();
  const total = portWeightTotal(port.weights);
  if(total===0){
    showModal('Allocate at least some weight to at least one asset before running the simulation.');
    return;
  }
  // Normalize weights to sum to 100 for the simulation, even if the sliders don't sum exactly
  const norm = {};
  Object.keys(port.weights).forEach(k=> norm[k] = port.weights[k]/total*100);

  portLastSim = simulatePortfolio(norm, port.years, port.trials, port.riskFree);

  renderPortFan(r);
}

/* =========================================================
   LAB 18 — FINANCIAL CRISIS SIMULATOR
   Real-world data: an approximate, illustrative month-by-month
   timeline of the 2007–2009 U.S. financial crisis — S&P 500
   index level, Fed funds rate, a 0–100 "bank stress" score, and
   a 0–100 "government intervention" score, rounded and
   simplified for teaching purposes, not a precision financial
   record. Real milestones referenced (Bear Stearns collapse,
   Lehman Brothers bankruptcy, TARP passage, Fed rate cuts to
   near zero) are real historical events; the numeric scores
   assigned to bank stress and intervention are illustrative
   indices built for this lab, not official statistics.
   ========================================================= */
const CRISIS_TIMELINE = [
  {month:0,   label:'Jan 2007',  sp500:1420, fedRate:5.25, bankStress:8,  intervention:0,  event:null},
  {month:6,   label:'Jul 2007',  sp500:1455, fedRate:5.25, bankStress:15, intervention:0,  event:null},

  {month:18,  label:'Jul 2008',  sp500:1267, fedRate:2.00, bankStress:55, intervention:25, event:null},
  {month:20,  label:'Sep 2008',  sp500:1166, fedRate:2.00, bankStress:95, intervention:40, event:'📍 Lehman Brothers files for bankruptcy'},
  {month:21,  label:'Oct 2008',  sp500:969,  fedRate:1.00, bankStress:90, intervention:75, event:'📍 TARP signed into law — $700B financial rescue package'},
  {month:23,  label:'Dec 2008',  sp500:903,  fedRate:0.25, bankStress:80, intervention:85, event:'📍 Fed funds rate cut to near zero'},
  {month:26,  label:'Mar 2009',  sp500:757,  fedRate:0.25, bankStress:70, intervention:90, event:'📍 S&P 500 bottoms out, roughly -53% from its 2007 peak'},
  {month:32,  label:'Sep 2009',  sp500:1057, fedRate:0.25, bankStress:40, intervention:85, event:'Recovery underway; banks stabilizing'},

  {month:55,  label:'Aug 2011',  sp500:1120, fedRate:0.25, bankStress:35, intervention:45, event:'📍 U.S. credit rating downgraded; European debt crisis fears spike'},
  {month:65,  label:'Jun 2012',  sp500:1362, fedRate:0.25, bankStress:22, intervention:40, event:'Eurozone concerns easing; Fed continues low-rate stance'},
  {month:77,  label:'Jun 2013',  sp500:1606, fedRate:0.25, bankStress:15, intervention:30, event:'📍 "Taper tantrum" — bond yields spike on Fed tapering talk'},
  {month:83,  label:'Dec 2013',  sp500:1848, fedRate:0.25, bankStress:10, intervention:25, event:'S&P 500 reaches new all-time highs'},
  {month:95,  label:'Dec 2014',  sp500:2058, fedRate:0.25, bankStress:8,  intervention:15, event:'📍 Fed ends quantitative easing bond-purchase program'},
  {month:107, label:'Dec 2015',  sp500:2043, fedRate:0.50, bankStress:7,  intervention:5,  event:'📍 Fed raises rates for the first time since the crisis'}
];

/* Linear interpolation between two adjacent milestones, for smooth playback
   between the sparse real-data points above. */
function interpolateCrisis(monthFrac){
  for(let i=0; i<CRISIS_TIMELINE.length-1; i++){
    const a = CRISIS_TIMELINE[i], b = CRISIS_TIMELINE[i+1];
    if(monthFrac >= a.month && monthFrac <= b.month){
      const span = b.month - a.month;
      const t = span===0 ? 0 : (monthFrac - a.month)/span;
      return {
        sp500: a.sp500 + t*(b.sp500-a.sp500),
        fedRate: a.fedRate + t*(b.fedRate-a.fedRate),
        bankStress: a.bankStress + t*(b.bankStress-a.bankStress),
        intervention: a.intervention + t*(b.intervention-a.intervention)
      };
    }
  }
  const last = CRISIS_TIMELINE[CRISIS_TIMELINE.length-1];
  return {sp500:last.sp500, fedRate:last.fedRate, bankStress:last.bankStress, intervention:last.intervention};
}

const crisis = { playhead:0, playing:false, speed:1, severity:100, invested:10000 };

/* Scale the real timeline's stock drawdown by a user-chosen severity %,
   so the Simulation tab can show "what if this had been milder/worse"
   while keeping the same real event timing and bank-stress/intervention shape. */
function scaledCrisisSeries(severityPct){
  const peak = Math.max(...CRISIS_TIMELINE.map(p=>p.sp500));
  return CRISIS_TIMELINE.map(p=>{
    const drawdownFromPeak = (peak - p.sp500)/peak;
    const scaledDrawdown = drawdownFromPeak * (severityPct/100);
    return {...p, sp500: peak*(1-scaledDrawdown)};
  });
}

function renderTheory18(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 18 — Financial Crisis Simulator</h2>

      ${glossaryHTML("Terms used on this page", [
        ["Subprime mortgage", "A home loan given to a borrower with a weaker credit history, carrying more risk of default than a typical mortgage."],

        ["Contagion", "The way trouble at one financial institution spreads to others — often because banks lend to each other, hold each other's securities, or simply lose trust in one another all at once."],
        ["Bank run", "When large numbers of depositors or lenders try to pull their money out of a bank at the same time, fearing it may fail — the fear itself can cause the very failure it feared."],
        ["Bailout", "Government financial support given to a struggling company or bank to prevent its failure, usually justified when that failure would seriously damage the wider economy."],

      <h3>How the pieces connect</h3>

      <p>Recall the Taylor Rule from Lab 08: rising unemployment and a weakening economy both push the recommended policy rate down. A crisis makes both of those numbers move suddenly and severely, which is why the real Fed funds rate fell from about 5.25% in 2007 to a range of 0–0.25% by December 2008 — one of the fastest rate-cutting cycles in modern history.</p>

function updateCrisisFrame(){
  const series = scaledCrisisSeries(crisis.severity);
  const frame = interpolateCrisisFromSeries(series, crisis.playhead);
  const peak = Math.max(...series.map(p=>p.sp500));

  document.getElementById('lbl-crisis-month').textContent = milestoneLabelAt(crisis.playhead);
  document.getElementById('stat-crisis-sp500').textContent = frame.sp500.toFixed(0);
  document.getElementById('stat-crisis-rate').textContent = frame.fedRate.toFixed(2) + '%';
  document.getElementById('stat-crisis-stress').textContent = frame.bankStress.toFixed(0) + '/100';
  document.getElementById('stat-crisis-intervention').textContent = frame.intervention.toFixed(0) + '/100';

  const portfolioVal = crisis.invested * (frame.sp500/peak);
  const drawdownPct = 100*(1-frame.sp500/peak);
  document.getElementById('stat-crisis-portfolio').textContent = '$' + portfolioVal.toFixed(0).toLocaleString();
  document.getElementById('stat-crisis-drawdown').textContent = '-' + drawdownPct.toFixed(0) + '%';

  const currentEvent = CRISIS_TIMELINE.find(p=>p.month===Math.round(crisis.playhead) && p.event);
  document.getElementById('crisis-event-text').textContent = currentEvent ? currentEvent.event : 'Watching the market and banking system closely…';

  renderCrisisChart(series);
  renderCrisisGauges(frame);
}

function milestoneLabelAt(monthFrac){
  let best = CRISIS_TIMELINE[0];
  for(const p of CRISIS_TIMELINE){ if(p.month<=monthFrac) best = p; }
  return best.label;
}

function interpolateCrisisFromSeries(series, monthFrac){
  for(let i=0; i<series.length-1; i++){
    const a = series[i], b = series[i+1];
    if(monthFrac >= a.month && monthFrac <= b.month){
      const span = b.month-a.month;
      const t = span===0 ? 0 : (monthFrac-a.month)/span;
      return {
        sp500: a.sp500+t*(b.sp500-a.sp500),
        fedRate: a.fedRate+t*(b.fedRate-a.fedRate),
        bankStress: a.bankStress+t*(b.bankStress-a.bankStress),
        intervention: a.intervention+t*(b.intervention-a.intervention)
      };
    }
  }
  const last = series[series.length-1];
  return {sp500:last.sp500, fedRate:last.fedRate, bankStress:last.bankStress, intervention:last.intervention};
}
