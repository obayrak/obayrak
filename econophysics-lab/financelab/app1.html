/* =========================================================
   LAB 19 — ECONOMIC DASHBOARD
   Real-world data: approximate annual U.S. real GDP growth and
   University-of-Michigan-style consumer sentiment index,
   2015–2024 (illustrative, rounded — for teaching purposes, not
   precision economic records). Reuses CPI_HISTORY (Lab 01),
   FED_FUNDS_HISTORY (Lab 08), UNEMPLOYMENT_HISTORY (Lab 08), and
   SP500_HISTORY (Lab 02/06) so all six indicators line up on the
   same real 2015–2024 timeline used elsewhere in the app.

   The interactive model (ECON_LINKS) is a deliberately simplified,
   stylized teaching approximation of Okun's Law, the Phillips
   Curve, a Taylor-Rule-style policy reaction, and stock-market
   wealth effects — NOT a fitted macroeconometric model. It exists
   to make "everything is connected" tangible, not to predict the
   real economy. This is stated explicitly in-page.
   ========================================================= */
const GDP_GROWTH_HISTORY = [
  {year:2015, pct:3.1}, {year:2016, pct:1.7}, {year:2017, pct:2.3},
  {year:2018, pct:3.0}, {year:2019, pct:2.6}, {year:2020, pct:-2.2},
  {year:2021, pct:5.8}, {year:2022, pct:1.9}, {year:2023, pct:2.5},
  {year:2024, pct:2.8}
];
const CONSUMER_CONFIDENCE_HISTORY = [
  {year:2015, idx:92.9}, {year:2016, idx:91.8}, {year:2017, idx:96.8},
  {year:2018, idx:98.4}, {year:2019, idx:93.8}, {year:2020, idx:71.8},
  {year:2021, idx:76.0}, {year:2022, idx:58.0}, {year:2023, idx:64.9},
  {year:2024, idx:69.0}
];

const ECON_VARS = [
  {key:'gdp',          label:'GDP Growth',          unit:'%',   min:-6,  max:8,   color:'#3fd69a'},
  {key:'inflation',    label:'Inflation',           unit:'%',   min:0,   max:12,  color:'#d9614f'},
  {key:'rate',         label:'Interest Rate',       unit:'%',   min:0,   max:12,  color:'#e6c368'},
  {key:'unemployment', label:'Unemployment',        unit:'%',   min:2,   max:12,  color:'#4fc3e0'},
  {key:'stocks',       label:'Stock Market',        unit:'% chg', min:-40, max:40, color:'#a9bcae'},
  {key:'confidence',   label:'Consumer Confidence', unit:'idx', min:30,  max:110, color:'#c9a24b'}
];

/* Illustrative baseline "current conditions" the dashboard starts from. */
const ECON_BASELINE = {gdp:2.5, inflation:3.0, rate:5.25, unemployment:4.0, stocks:0, confidence:70};

/* Direct, first-round sensitivities: how a +1 unit shock to the KEY
   variable moves each of the other five. Deliberately simple,
   illustrative coefficients — see Theory tab for the reasoning
   behind each sign and rough magnitude. */
const ECON_LINKS = {
  rate:         {gdp:-0.30, inflation:-0.25, unemployment:0.15,  stocks:-2.0, confidence:-1.5},
  inflation:    {rate:0.50, gdp:-0.15,       unemployment:0.05,  stocks:-1.0, confidence:-2.0},
  unemployment: {gdp:-0.50, inflation:-0.30, rate:-0.40,         stocks:-1.5, confidence:-3.0},
  gdp:          {unemployment:-0.40, inflation:0.20, rate:0.20,  stocks:2.5,  confidence:2.0},
  stocks:       {confidence:0.15, gdp:0.03,  inflation:0.01,     rate:0.01,   unemployment:-0.01},
  confidence:   {gdp:0.08,  inflation:0.02,  stocks:0.3,         unemployment:-0.03, rate:0.01}
};
const ECON_FEEDBACK_DAMPING = 0.35; // how strongly round-1 effects cross-propagate into round 2

const econ = {driverIdx:1, shockAmount:3.3, useRealHistory:false, stage:0};
let econLastResult = null; // {round1, round2, total, newValues, driverKey, shockAmount}

/* Two-round propagation: round 1 = direct effect of the shocked
   variable on the other five. Round 2 = those five effects
   cross-propagating into each other once more, damped, to give a
   (still simplified) sense of feedback rather than a single flat
   pass. */
function computeEconShock(driverKey, shockAmount){
  const others = ECON_VARS.map(v=>v.key).filter(k=>k!==driverKey);
  const round1 = {};
  others.forEach(k=>{ round1[k] = (ECON_LINKS[driverKey][k]||0) * shockAmount; });

  const round2 = {};
  others.forEach(key=>{
    let sum = 0;
    others.forEach(j=>{
      if(j===key) return;
      const coeff = (ECON_LINKS[j] && ECON_LINKS[j][key]) ? ECON_LINKS[j][key] : 0;
      sum += coeff * round1[j];
    });
    round2[key] = sum * ECON_FEEDBACK_DAMPING;
  });

  const total = {};
  others.forEach(k=>{ total[k] = round1[k] + round2[k]; });

  const newValues = {};
  ECON_VARS.forEach(v=>{
    newValues[v.key] = v.key===driverKey
      ? ECON_BASELINE[v.key] + shockAmount
      : ECON_BASELINE[v.key] + total[v.key];
  });

  return {round1, round2, total, newValues, driverKey, shockAmount};
}

function econFormatVal(key, val){
  if(key==='confidence') return val.toFixed(1);
  if(key==='stocks') return (val>=0?'+':'') + val.toFixed(1) + '%';
  return val.toFixed(1) + '%';
}

function econDeltaClass(key, delta){
  if(key==='rate') return ''; // policy tool — not inherently good or bad, left neutral
  if(Math.abs(delta) < 0.05) return '';
  if(key==='inflation' || key==='unemployment') return delta>0 ? 'loss' : 'gain';
  return delta>0 ? 'gain' : 'loss';
}

/* ---- Subtab: Theory ---- */
function renderTheory19(){
  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 19 — Economic Dashboard</h2>
    <div class="desc">Theory</div>
    <div class="theory-block">
      <p>None of the six numbers on this dashboard move in isolation. A central bank raising interest rates doesn't just change the interest rate — it ripples into borrowing costs, hiring decisions, stock valuations, and how confident people feel about spending money. This lab exists to make that web of cause and effect something you can push on directly, one variable at a time, and watch the rest respond.</p>

      ${glossaryHTML("Terms used on this page", [
        ["GDP growth", "The percentage change in a country's total economic output (Gross Domestic Product) from one year to the next — the broadest single measure of whether an economy is expanding or shrinking."],
        ["Inflation", "The rate at which average prices rise, from Lab 03 — how much a fixed amount of money loses purchasing power each year."],
        ["Interest rate", "Here, the central bank's policy rate from Lab 08 — the lever used to cool an overheating economy (raise it) or stimulate a weak one (cut it)."],
        ["Unemployment", "The share of the workforce actively looking for work but not employed — a direct gauge of labor-market health."],
        ["Stock market", "Here, the market's overall percentage change from a baseline — a forward-looking gauge of how investors expect company profits (and the economy) to perform."],
        ["Consumer confidence", "A survey-based index of how optimistic households feel about their own finances and the economy — a leading indicator, since confident people spend more and worried people save more."],
        ["Phillips Curve", "The observed historical tendency for inflation and unemployment to move in opposite directions — low unemployment (a tight labor market) tends to coincide with higher inflation, and vice versa."],
        ["Okun's Law", "A rule of thumb linking GDP growth to unemployment — stronger-than-trend growth tends to pull unemployment down, and weaker growth tends to push it up."],
        ["Wealth effect", "The tendency for people to spend more when their investments (like stocks) are rising in value, and less when they're falling — even before any of that paper gain or loss is actually realized."],
        ["Feedback loop", "A chain reaction where an effect of a change goes on to cause further changes elsewhere, which can loop back and reinforce (or dampen) the original change."]
      ])}

      <h3>Five real relationships, simplified into one small model</h3>
      <p>This dashboard's simulation encodes five familiar relationships from earlier labs into a single connected system:</p>
      <div class="formula-box">$$\\Delta U \\approx -0.5 \\times \\Delta GDP\\ \\text{growth} \\qquad\\text{(Okun's Law, simplified)}$$</div>
      <div class="formula-box">$$\\Delta \\pi \\approx -0.3 \\times \\Delta U \\qquad\\text{(Phillips Curve, simplified)}$$</div>
      <p>A Taylor-Rule-style reaction (Lab 08) links inflation to the interest rate response; a bond-pricing-style logic (Lab 11) links interest rates inversely to stock prices; and a wealth-effect link ties stock market moves to consumer confidence and, in turn, back into spending and GDP.</p>

      <h3>Direct effects vs. feedback effects</h3>
      <p>When you shock one variable, the Simulation tab computes the reaction in two stages. <b>Round 1</b> is the direct effect — e.g. inflation rising pushes the interest rate up, immediately. <b>Round 2</b> is the feedback — that higher interest rate then further cools GDP growth, which further affects unemployment, which affects confidence, and so on, each pass weighted down by a damping factor so the system settles rather than spiraling forever:</p>
      <div class="formula-box">$$Total\\ Effect = Effect_{round 1} + \\big(Effect_{round 1} \\times Links \\times damping\\big)_{round 2}$$</div>
      <p>Real economies keep propagating for many more rounds, over months and years, with lags this simplified two-round model doesn't capture — it's built to make the <i>direction</i> and rough <i>relative size</i> of interconnection visible, not to forecast actual future values.</p>

      <h3>Why the model won't always match reality</h3>
      <p>The Solution tab runs this exact model against a real historical episode — the 2021→2022 U.S. inflation surge — and compares its predictions to what actually happened. Some predictions land close; others miss by a lot, particularly unemployment, which real 2022 data defied in a way a five-variable linear model can't capture. That gap is the point: real economies are shaped by far more forces (supply chains, fiscal policy, global events, expectations) than any six-number dashboard can hold at once.</p>
    </div>
  `;
}

/* ---- Subtab: Solution (worked example, real 2021→2022 inflation shock) ---- */
function renderSolution19(){
  const base = {
    gdp: GDP_GROWTH_HISTORY.find(g=>g.year===2021).pct,
    inflation: CPI_HISTORY.find(c=>c.year===2021).pct,
    rate: FED_FUNDS_HISTORY.find(f=>f.year===2021).pct,
    unemployment: UNEMPLOYMENT_HISTORY.find(u=>u.year===2021).pct,
    stocks: 0,
    confidence: CONSUMER_CONFIDENCE_HISTORY.find(c=>c.year===2021).idx
  };
  const real2022 = {
    inflation: CPI_HISTORY.find(c=>c.year===2022).pct,
    rate: FED_FUNDS_HISTORY.find(f=>f.year===2022).pct,
    gdp: GDP_GROWTH_HISTORY.find(g=>g.year===2022).pct,
    unemployment: UNEMPLOYMENT_HISTORY.find(u=>u.year===2022).pct,
    stocks: SP500_HISTORY.find(s=>s.year===2022).pct,
    confidence: CONSUMER_CONFIDENCE_HISTORY.find(c=>c.year===2022).idx
  };
  const shockAmount = real2022.inflation - base.inflation;

  // Run the same model, but seeded from the real 2021 baseline instead of ECON_BASELINE
  const savedBaseline = {...ECON_BASELINE};
  Object.assign(ECON_BASELINE, base);
  const result = computeEconShock('inflation', shockAmount);
  Object.keys(savedBaseline).forEach(k=> ECON_BASELINE[k]=savedBaseline[k]); // restore

  const rows = ['rate','gdp','unemployment','stocks','confidence'].map(key=>{
    const predicted = result.newValues[key];
    const actual = real2022[key];
    const label = ECON_VARS.find(v=>v.key===key).label;
    return `<tr>
      <td>${label}</td>
      <td>${econFormatVal(key, base[key])}</td>
      <td class="gold">${econFormatVal(key, predicted)}</td>
      <td class="emerald">${econFormatVal(key, actual)}</td>
    </tr>`;
  }).join('');

  document.getElementById('stage-panel').innerHTML = `
    <h2>Lab 19 — Economic Dashboard</h2>
    <div class="desc">Solution — shocking the model with the real 2021→2022 U.S. inflation surge, then checking it against what actually happened</div>
    <div class="theory-block">
      <p><b>Setup:</b> seed the model with real 2021 conditions (inflation ${base.inflation}%, Fed funds ${base.rate}%, GDP growth ${base.gdp}%, unemployment ${base.unemployment}%, consumer confidence ${base.confidence}), then shock inflation up to the real 2022 value of ${real2022.inflation}% (a shock of +${shockAmount.toFixed(1)} points) and let the model's Okun's-Law/Phillips-Curve/Taylor-Rule-style links compute where everything else lands.</p>

      ${glossaryHTML("Terms used in this table", [
        ["2021 baseline", "The real recorded value for that indicator in 2021, before the shock."],
        ["Model prediction", "What this lab's simplified two-round propagation model computes for 2022, given only the inflation shock."],
        ["Real 2022", "What actually happened in 2022, from the real datasets used elsewhere in this app (Labs 01, 02, 08)."]
      ])}

      <table class="worked-table">
        <tr><th>Indicator</th><th>2021 baseline</th><th>Model prediction</th><th>Real 2022</th></tr>
        ${rows}
      </table>
      <div class="solution-summary">
        The model gets the interest rate almost exactly right (predicted <b>${econFormatVal('rate',result.newValues.rate)}</b> vs. the
        real <b>${econFormatVal('rate',real2022.rate)}</b>) and gets the direction right on every single indicator — rates up, GDP
        growth down, stocks down, confidence down. But it badly misses <b>unemployment</b>: the model predicts it should rise to
        about <b>${econFormatVal('unemployment',result.newValues.unemployment)}</b> as the Phillips-Curve link kicks in, while real
        unemployment actually <i>fell</i> to <b>${real2022.unemployment}%</b> — a historically unusual, very tight post-pandemic labor
        market that a simple five-variable model has no way to see coming. The model also understates how sharply real stocks
        (${real2022.stocks}%) and real consumer confidence (${real2022.confidence}) actually fell — real markets and real sentiment
        often overreact well beyond what a linear approximation predicts. Getting four of six directions and one of six magnitudes
        right isn't a failure of the exercise — it's exactly the lesson: connections between these variables are real, but far
        weaker and far less complete than any six-number dashboard can capture.
      </div>
      <div class="footnote">GDP growth and consumer confidence figures are approximate/illustrative annual figures, rounded — used to teach the mechanism, not as precise economic records. The propagation model (ECON_LINKS) is a deliberately simplified teaching approximation, not a fitted macroeconometric model.</div>
    </div>
  `;
}

function syncEconLabels(){
  econ.driverIdx = +document.getElementById('in-econ-driver').value;
  econ.shockAmount = +document.getElementById('in-econ-shock').value;
  document.getElementById('lbl-econ-driver').textContent = ECON_VARS[econ.driverIdx].label;
  document.getElementById('lbl-econ-shock').textContent = (econ.shockAmount>=0?'+':'') + econ.shockAmount.toFixed(1);
}

function applyEconShock(){
  syncEconLabels();
  const driverKey = ECON_VARS[econ.driverIdx].key;
  econLastResult = computeEconShock(driverKey, econ.shockAmount);
  econ.stage = 1;

  const round1Values = {};
  ECON_VARS.forEach(v=>{
    round1Values[v.key] = v.key===driverKey
      ? ECON_BASELINE[v.key] + econ.shockAmount
      : ECON_BASELINE[v.key] + econLastResult.round1[v.key];
  });
  renderEconGauges(round1Values);
  renderEconRows(ECON_BASELINE, round1Values, econLastResult);
  renderEconImpactChart(econLastResult, 1);

  setTimeout(()=>{
    econ.stage = 2;
    renderEconGauges(econLastResult.newValues);
    renderEconRows(ECON_BASELINE, econLastResult.newValues, econLastResult);
    renderEconImpactChart(econLastResult, 2);
  }, 700);
}

/* =========================================================
   LAB 20 — FINANCIAL LIFE GAME (capstone)
   A 20-year turn-based simulation. Each year the student picks
   ONE primary action, then a random economic event fires, and
   every earlier lab's mechanics runs automatically underneath:
   salary/expenses cash flow (Lab 13), investment growth via the
   same Box–Muller random-walk technique already defined for
   Labs 06/12/17 (reusing the existing stdNormal() function — no
   redefinition needed), a simplified mortgage (Lab 04 logic), a
   risky business venture (Lab 14 logic), debt that compounds
   (Lab 04's rate idea reversed), and inflation tracked as a
   cumulative price index (Lab 01/03) so "purchasing power" is a
   real computed number, not a flavor stat. A "financial
   independence" check reuses the safe-withdrawal-rate idea from
   Lab 15's annuity logic (4% of invested assets).

   Random event magnitudes are illustrative teaching values,
   loosely patterned on real event scales referenced elsewhere in
   this app (a 2008-style crash, a 2020-style pandemic shock, a
   2021–22-style inflation spike) — NOT a fitted model of any
   specific historical period, and not financial advice.
   ========================================================= */

const GAME_YEARS = 20;
const GAME_ACTIONS = [
  {key:'spend',    label:'Spend',            icon:'🛍️', desc:'Treat yourself. Fun now, nothing to show for it later.'},
  {key:'save',     label:'Save',             icon:'🏦', desc:'Move half your spare cash into a low-risk savings account (~2%/yr).'},
  {key:'invest',   label:'Invest',           icon:'📈', desc:'Move half your spare cash into the stock market (~8%/yr average, volatile).'},
  {key:'borrow',   label:'Borrow',           icon:'💳', desc:'Take out a $10,000 loan at 8%/yr interest. More cash now, a debt later.'},
  {key:'house',    label:'Buy a House',      icon:'🏠', desc:'20% down on a $200,000 house, mortgaged the rest. Appreciates slowly.'},
  {key:'business', label:'Start a Business', icon:'🚀', desc:'$15,000 to start. High risk, high reward — can fail completely.'},
  {key:'retire',   label:'Retire',           icon:'🌴', desc:'Stop working. Live off savings and investments from here on.'}
];

const GAME_EVENTS = [
  {key:'none',       label:'A quiet year',       chance:0.35},
  {key:'promotion',  label:'📍 Promotion!',      chance:0.15},
  {key:'crash',      label:'📍 Market crash',    chance:0.12},
  {key:'recession',  label:'📍 Recession',       chance:0.12},
  {key:'jobloss',    label:'📍 Job loss',        chance:0.10},
  {key:'inflation',  label:'📍 Inflation spike', chance:0.10},
  {key:'pandemic',   label:'📍 Pandemic',        chance:0.06}
];

function gameFreshState(){
  return {
    year:0, age:25,
    cash:10000, savings:0, investments:0,
    house:0, mortgage:0, mortgagePayment:0,
    business:0, businessFailed:false,
    debt:0,
    salary:45000, expenses:32000,
    retired:false, retiredYear:null,
    cpi:100,
    history:[{year:0, age:25, cash:10000, savings:0, investments:0, house:0, mortgage:0, business:0, debt:0,
      netWorth:10000, purchasingPower:10000, cpi:100, salary:45000, expenses:32000, passiveIncome:0, independent:false, event:'Game start'}],
    eventLog:[],
    gameOver:false
  };
}
let game = gameFreshState();

function gameNetWorth(s){
  return s.cash + s.savings + s.investments + s.house + s.business - s.mortgage - s.debt;
}
function gamePurchasingPower(s){
  return gameNetWorth(s) / (s.cpi/100);
}
function gameIsFinanciallyIndependent(s, passiveIncome){
  return passiveIncome >= s.expenses;
}
function gameSnapshot(s, passiveIncome, eventLabel){
  s.history.push({
    year:s.year, age:s.age, cash:s.cash, savings:s.savings, investments:s.investments,
    house:s.house, mortgage:s.mortgage, business:s.business, debt:s.debt,
    netWorth:gameNetWorth(s), purchasingPower:gamePurchasingPower(s), cpi:s.cpi,
    salary:s.salary, expenses:s.expenses, passiveIncome,
    independent:gameIsFinanciallyIndependent(s,passiveIncome), event:eventLabel
  });
}
function gameRollEvent(){
  const r = Math.random();
  let cum = 0;
  for(const e of GAME_EVENTS){ cum += e.chance; if(r<=cum) return e.key; }
  return 'none';
}

/* One full year of the interactive game — uses real randomness
   (stdNormal, already defined for Labs 06/12/17) so results vary
   run to run, exactly as a real financial life would. */
function gameAdvanceYear(actionKey, scriptedEventKey){
  const s = game;
  s.year++; s.age++;

  // --- 1. Random event first, since it can affect this year's income ---
  const eventKey = scriptedEventKey || gameRollEvent();
  const eventMeta = GAME_EVENTS.find(e=>e.key===eventKey);
  let eventNote = eventMeta.label;
  let marketShock=0, businessShock=0, jobLossThisYear=false;

  if(eventKey==='promotion' && !s.retired){
    s.salary *= 1.15;
    eventNote += ` Salary raised to $${s.salary.toFixed(0)}.`;
  }else if(eventKey==='crash'){
    marketShock = -0.25 + stdNormal()*0.05;
    eventNote += ` The market drops sharply this year.`;
  }else if(eventKey==='recession'){
    marketShock = -0.08 + stdNormal()*0.03; businessShock = -0.15;
    eventNote += ` Growth slows across the board.`;
  }else if(eventKey==='jobloss'){
    if(!s.retired){ jobLossThisYear=true; eventNote += ` You lost your job this year — no salary.`; }
    else eventNote += ` No impact — you're already retired.`;
  }else if(eventKey==='inflation'){
    s.cpi *= 1.06; s.expenses *= 1.06;
    eventNote += ` Prices jump — expenses rise.`;
  }else if(eventKey==='pandemic'){
    marketShock = -0.15 + stdNormal()*0.05; businessShock = -0.35;
    if(!s.retired && Math.random()<0.4){ jobLossThisYear=true; eventNote += ` Reduced hours cut your income to zero this year.`; }
    else eventNote += ` A rough year for markets and business.`;
  }else{
    eventNote = 'A quiet year — no major surprises.';
  }

  // --- 2. Income lands in cash ---
  const effectiveIncome = s.retired ? 0 : (jobLossThisYear ? 0 : s.salary);
  s.cash += effectiveIncome - s.expenses - s.mortgagePayment;

  // --- 3. Retirees cover any shortfall by drawing down investments, then savings ---
  if(s.retired && s.cash < 0){
    const need = -s.cash;
    const fromInvest = Math.min(s.investments, need);
    s.investments -= fromInvest;
    const fromSavings = Math.min(s.savings, need-fromInvest);
    s.savings -= fromSavings;
    s.cash += fromInvest + fromSavings;
  }

  // --- 4. Apply the chosen action ---
  let actionNote = '';
  if(actionKey==='spend'){
    const splurge = Math.min(5000, Math.max(0, s.cash*0.15));
    s.cash -= splurge;
    actionNote = `Spent an extra $${splurge.toFixed(0)} on lifestyle.`;
  }else if(actionKey==='save'){
    const moved = Math.max(0, s.cash*0.5);
    s.cash -= moved; s.savings += moved;
    actionNote = `Moved $${moved.toFixed(0)} into savings.`;
  }else if(actionKey==='invest'){
    const moved = Math.max(0, s.cash*0.5);
    s.cash -= moved; s.investments += moved;
    actionNote = `Invested $${moved.toFixed(0)} in the market.`;
  }else if(actionKey==='borrow'){
    s.debt += 10000; s.cash += 10000;
    actionNote = `Borrowed $10,000 at 8%/yr.`;
  }else if(actionKey==='house'){
    if(s.house>0){ actionNote = `Already own a house.`; }
    else{
      const price=200000, down=price*0.20;
      if(s.cash < down){ actionNote = `Not enough cash for a down payment — skipped.`; }
      else{
        s.cash -= down; s.house = price; s.mortgage = price*0.80; s.mortgagePayment = s.mortgage*0.065;
        actionNote = `Bought a $${price.toLocaleString()} house, $${down.toLocaleString()} down.`;
      }
    }
  }else if(actionKey==='business'){
    if(s.business>0 && !s.businessFailed){ actionNote = `Already running a business.`; }
    else{
      const cost=15000;
      if(s.cash < cost){ actionNote = `Not enough cash to start a business — skipped.`; }
      else{
        s.cash -= cost; s.business = cost; s.businessFailed=false;
        actionNote = `Started a business with $${cost.toLocaleString()} in capital.`;
      }
    }
  }else if(actionKey==='retire'){
    if(!s.retired){ s.retired=true; s.retiredYear=s.year; actionNote=`Retired at age ${s.age}. No more salary.`; }
    else actionNote = `Already retired.`;
  }

  // --- 5. Any remaining shortfall becomes debt ---
  if(s.cash < 0){ s.debt += -s.cash; s.cash = 0; }

  // --- 6. Growth, interest, appreciation (this year's event shocks apply here) ---
  const savingsReturn = 0.02;
  const investReturn = 0.08 + stdNormal()*0.16 + marketShock;
  const houseAppreciation = 0.03;
  const businessGrowth = (s.business>0 && !s.businessFailed) ? (0.20 + stdNormal()*0.30 + businessShock) : 0;
  const debtRate = 0.08, mortgageRate = 0.065;

  s.savings *= (1+savingsReturn);
  s.investments *= Math.max(0, 1+investReturn);
  if(s.house>0) s.house *= (1+houseAppreciation);
  if(s.mortgage>0) s.mortgage = Math.max(0, s.mortgage*(1+mortgageRate) - s.mortgagePayment);
  if(s.business>0 && !s.businessFailed){
    s.business = Math.max(0, s.business*(1+businessGrowth));
    if(s.business < 500){ s.business=0; s.businessFailed=true; eventNote += ' Your business folded.'; }
  }
  if(s.debt>0) s.debt *= (1+debtRate);

  // --- 7. Baseline inflation drift and wage growth ---
  if(eventKey!=='inflation') s.cpi *= 1.025;
  s.expenses *= 1.02;
  if(!s.retired && !jobLossThisYear) s.salary *= 1.02;

  // --- 8. Passive income, for the financial-independence check ---
  const passiveIncome = s.investments*0.04 + s.savings*savingsReturn + (s.business>0 && !s.businessFailed ? s.business*0.10 : 0);

  s.eventLog.push({year:s.year, action:actionKey, actionNote, eventKey, eventNote});
  gameSnapshot(s, passiveIncome, eventNote);
  if(s.year >= GAME_YEARS) s.gameOver = true;

  return {actionNote, eventNote, eventKey};
}

function gameScore(s){
  const nw = gameNetWorth(s);
  const pp = gamePurchasingPower(s);
  const lastPassive = s.history.length ? s.history[s.history.length-1].passiveIncome : 0;
  const independent = gameIsFinanciallyIndependent(s, lastPassive);
  const nwScore = Math.min(100, 100*nw/500000);
  const ppScore = Math.min(100, 100*pp/300000);
  const fiScore = independent ? 100 : Math.min(100, 100*lastPassive/Math.max(1,s.expenses));
  const composite = 0.4*nwScore + 0.3*ppScore + 0.3*fiScore;
  let grade='F';
  if(composite>=90) grade='A+'; else if(composite>=80) grade='A'; else if(composite>=70) grade='B';
  else if(composite>=55) grade='C'; else if(composite>=40) grade='D';
  return {nw, pp, independent, composite, grade};
}

/* Deterministic scripted 20-year playthrough (no randomness) for
   the Solution tab — same pattern as Lab 13's scripted events,
   used so the worked example is reproducible on every render. */
function simulateScriptedGame(){
  const plan = [
    {action:'invest', event:'none'},     {action:'invest', event:'promotion'},
    {action:'save', event:'none'},       {action:'invest', event:'none'},
    {action:'house', event:'none'},      {action:'invest', event:'none'},
    {action:'invest', event:'crash'},    {action:'save', event:'none'},
    {action:'business', event:'none'},   {action:'invest', event:'none'},
    {action:'invest', event:'recession'},{action:'invest', event:'none'},
    {action:'invest', event:'promotion'},{action:'invest', event:'none'},
    {action:'invest', event:'pandemic'}, {action:'invest', event:'none'},
    {action:'invest', event:'none'},     {action:'invest', event:'inflation'},
    {action:'invest', event:'none'},     {action:'retire', event:'none'}
  ];
  let s = {cash:10000, savings:0, investments:0, house:0, mortgage:0, mortgagePayment:0,
    business:0, debt:0, salary:45000, expenses:32000, retired:false, cpi:100};
  const rows = [];

  plan.forEach((step, idx)=>{
    const year = idx+1;
    let marketShock=0, businessShock=0, eventNote='';
    const eventKey = step.event;
    if(eventKey==='promotion' && !s.retired){ s.salary*=1.15; eventNote='Promotion — salary raised.'; }
    else if(eventKey==='crash'){ marketShock=-0.25; eventNote='Market crash — investments drop sharply.'; }
    else if(eventKey==='recession'){ marketShock=-0.08; businessShock=-0.15; eventNote='Recession — growth slows.'; }
    else if(eventKey==='pandemic'){ marketShock=-0.15; businessShock=-0.35; eventNote='Pandemic — markets and business struggle.'; }
    else if(eventKey==='inflation'){ s.cpi*=1.06; s.expenses*=1.06; eventNote='Inflation spike — expenses rise.'; }
    else{ eventNote='Quiet year.'; }

    const income = s.retired?0:s.salary;
    s.cash += income - s.expenses - s.mortgagePayment;

    if(s.retired && s.cash<0){
      const need=-s.cash;
      const fi=Math.min(s.investments,need); s.investments-=fi;
      const fsv=Math.min(s.savings,need-fi); s.savings-=fsv;
      s.cash += fi+fsv;
    }

    if(step.action==='invest'){ const m=Math.max(0,s.cash*0.5); s.cash-=m; s.investments+=m; }
    else if(step.action==='save'){ const m=Math.max(0,s.cash*0.5); s.cash-=m; s.savings+=m; }
    else if(step.action==='house' && s.house===0){
      const price=200000, down=price*0.2;
      if(s.cash>=down){ s.cash-=down; s.house=price; s.mortgage=price*0.8; s.mortgagePayment=s.mortgage*0.065; }
    }else if(step.action==='business' && s.business===0){
      const cost=15000;
      if(s.cash>=cost){ s.cash-=cost; s.business=cost; }
    }else if(step.action==='retire' && !s.retired){ s.retired=true; }

    if(s.cash<0){ s.debt += -s.cash; s.cash=0; }

    const investReturn = 0.08+marketShock;
    const businessGrowth = s.business>0 ? (0.20+businessShock) : 0;
    s.savings *= 1.02;
    s.investments *= Math.max(0,1+investReturn);
    if(s.house>0) s.house *= 1.03;
    if(s.mortgage>0) s.mortgage = Math.max(0, s.mortgage*1.065 - s.mortgagePayment);
    if(s.business>0){ s.business = Math.max(0, s.business*(1+businessGrowth)); if(s.business<500) s.business=0; }
    if(s.debt>0) s.debt *= 1.08;
    if(eventKey!=='inflation') s.cpi *= 1.025;
    s.expenses *= 1.02;
    if(!s.retired) s.salary *= 1.02;

    const netWorth = s.cash+s.savings+s.investments+s.house+s.business-s.mortgage-s.debt;
    const purchasingPower = netWorth/(s.cpi/100);
    const passiveIncome = s.investments*0.04 + s.savings*0.02 + (s.business>0? s.business*0.10:0);
    rows.push({year, action:step.action, eventNote, netWorth, purchasingPower, passiveIncome, expenses:s.expenses});
  });
  return rows;
}

      <div class="solution-summary">
        By year 20, net worth reaches <b>$${final.netWorth.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</b>, worth
        <b>$${final.purchasingPower.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</b> in today's purchasing power after
        two decades of inflation. Estimated passive income at retirement is about <b>$${final.passiveIncome.toFixed(0)}/year</b>
        against expenses of about <b>$${final.expenses.toFixed(0)}/year</b> — meaning this playthrough
        <b>${fi ? 'does' : 'does not quite'}</b> reach full financial independence by the numbers this simplified model tracks.
        Notice that the market crash (year 7) and recession (year 11) didn't derail the plan — steady investing through
        the down years let the portfolio recover and keep compounding, the same lesson Lab 06 draws about staying invested
        through volatility rather than reacting to any single bad year.
      </div>
      <div class="footnote">This scripted version uses fixed, noise-free returns for each event type so the walkthrough is exactly reproducible — the interactive Simulation tab uses real randomized returns (via the same technique as Labs 06/12/17), so no two playthroughs there will look the same.</div>
    </div>
  `;
}

/* ---- Subtab: Simulation ---- */

          <div id="game-event-text" style="font-size:14px; color:var(--gold-bright); margin-top:6px; min-height:20px;">Your financial life begins. Choose your first move.</div>
        </div>

        <div class="formula-box">
          $$Net\\ Worth = Cash+Savings+Investments+Home\\ Equity+Business-Debt$$
          $$Purchasing\\ Power = \\frac{Net\\ Worth}{CPI/100} \\qquad Financially\\ Independent \\iff Passive\\ Income \\ge Expenses$$
        </div>

  document.getElementById('btn-game-reset').addEventListener('click', gameResetGame);

  if(game.gameOver) renderGameFinalPanel();
}

function renderGameActionButtons(){
  const wrap = document.getElementById('game-action-buttons');
  if(!wrap) return;
  wrap.innerHTML = '';
  const s = game;
  GAME_ACTIONS.forEach(a=>{
    let disabled = s.gameOver;
    let noteSuffix = '';
    if(a.key==='house' && s.house>0){ disabled=true; noteSuffix=' (owned)'; }
    if(a.key==='business' && s.business>0 && !s.businessFailed){ disabled=true; noteSuffix=' (running)'; }
    if(a.key==='retire' && s.retired){ disabled=true; noteSuffix=' (retired)'; }
    const btn = document.createElement('button');
    btn.disabled = disabled;
    btn.style.cssText = `text-align:left; width:100%; background:${disabled?'var(--panel-2)':'var(--ledger)'}; color:${disabled?'var(--text-2)':'var(--text-0)'}; border:1px solid var(--line); border-radius:4px; padding:10px 12px; cursor:${disabled?'default':'pointer'}; font-family:var(--font-mono); opacity:${disabled?'0.5':'1'};`;
    btn.innerHTML = `<div style="font-weight:700; font-size:12px;">${a.icon} ${a.label}${noteSuffix}</div><div style="font-size:10px; color:var(--text-2); margin-top:2px;">${a.desc}</div>`;
    if(!disabled) btn.onclick = ()=> gameChooseAction(a.key);
    wrap.appendChild(btn);
  });
}

function gameChooseAction(actionKey){
  if(game.gameOver) return;
  const result = gameAdvanceYear(actionKey, null);
  document.getElementById('game-event-text').innerHTML = `<b>Year ${game.year} (age ${game.age}):</b> ${result.actionNote}<br>${result.eventNote}`;
  renderGameActionButtons();
  renderGameUI();
  renderGameCharts();
  if(game.gameOver) renderGameFinalPanel();
}

function gameResetGame(){
  game = gameFreshState();
  document.getElementById('game-event-text').textContent = 'Your financial life begins. Choose your first move.';
  document.getElementById('game-final-panel').style.display = 'none';
  renderGameActionButtons();
  renderGameUI();
  renderGameCharts();
}

function renderGameUI(){
  const s = game;
  document.getElementById('lbl-game-year').textContent = `Year ${s.year} / ${GAME_YEARS} · Age ${s.age}`;
  const nw = gameNetWorth(s);
  const pp = gamePurchasingPower(s);
  const lastPassive = s.history.length ? s.history[s.history.length-1].passiveIncome : 0;
  const fi = gameIsFinanciallyIndependent(s, lastPassive);

  const nwEl = document.getElementById('stat-game-networth');
  nwEl.textContent = '$'+nw.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  nwEl.className = 'v ' + (nw>=10000?'gain':'loss');

  document.getElementById('stat-game-power').textContent = '$'+pp.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  document.getElementById('stat-game-salary').textContent = s.retired ? '$0 (retired)' : '$'+s.salary.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  document.getElementById('stat-game-expenses').textContent = '$'+s.expenses.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  const fiEl = document.getElementById('stat-game-fi');
  fiEl.textContent = fi ? 'Achieved ✓' : `$${lastPassive.toFixed(0)}/${s.expenses.toFixed(0)} covered`;
  fiEl.className = 'v ' + (fi ? 'gain' : '');

  document.getElementById('stat-game-status').textContent = s.gameOver ? 'Game over' : (s.retired ? 'Retired' : 'Working');

  const wrap = document.getElementById('item-rows-game');
  wrap.innerHTML = '';
  const items = [
    {label:'Cash', val:s.cash, color:'linear-gradient(90deg, var(--gold-bright), var(--gold))'},
    {label:'Savings', val:s.savings, color:'linear-gradient(90deg, #4fc3e0, #7fd8ee)'},
    {label:'Investments', val:s.investments, color:'linear-gradient(90deg, var(--emerald), var(--emerald-bright))'},
    {label:'Home equity', val:Math.max(0,s.house-s.mortgage), color:'linear-gradient(90deg, #c9a24b, #e6c368)'},
    {label:'Business', val:s.business, color:'linear-gradient(90deg, #8a6fd6, #b39ce8)'},
    {label:'Debt (loans + mortgage)', val:-(s.debt+s.mortgage), color:'linear-gradient(90deg, var(--loss), #ef8878)'}
  ];
  const maxAbs = Math.max(1, ...items.map(i=>Math.abs(i.val)));
  items.forEach(it=>{
    const share = Math.min(100, 100*Math.abs(it.val)/maxAbs);
    const el = document.createElement('div');
    el.className = 'item-row';
    el.innerHTML = `
      <div class="item-row-top">
        <span class="item-name">${it.label}</span>
        <span class="item-price" style="${it.val<0?'color:var(--loss);':''}">${it.val<0?'-':''}$${Math.abs(it.val).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</span>
      </div>
      <div class="item-track"><div class="item-fill" style="width:${share}%; background:${it.color};"></div></div>
    `;
    wrap.appendChild(el);
  });

  const recent = s.eventLog.slice(-6).reverse();
  if(recent.length){
    const rowsHTML = recent.map(e=>`<tr><td>Year ${e.year}</td><td>${e.actionNote}</td><td>${e.eventNote}</td></tr>`).join('');
    const evWrap = document.createElement('div');
    evWrap.innerHTML = `<table class="worked-table" style="margin-top:10px;"><tr><th>Year</th><th>Your move</th><th>What happened</th></tr>${rowsHTML}</table>`;
    wrap.appendChild(evWrap);
  }
}

function renderGameCharts(){
  try{
    if(typeof Plotly === 'undefined') return;
    const s = game;
    const years = s.history.map(h=>h.year);

    Plotly.newPlot('graph-game-networth', [
      {x:years, y:s.history.map(h=>h.netWorth), name:'Net worth', mode:'lines+markers', line:{color:'#e6c368', width:3}, marker:{size:5}},
      {x:years, y:s.history.map(h=>h.purchasingPower), name:"Purchasing power (today's $)", mode:'lines+markers', line:{color:'#3fd69a', width:3, dash:'dot'}, marker:{size:5}}
    ], {
      paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
      font:{color:'#a9bcae', family:'JetBrains Mono'},
      margin:{t:20,l:60,r:20,b:40},
      xaxis:{title:'Year', gridcolor:'#24382c'},
      yaxis:{title:'Dollars', gridcolor:'#24382c', tickprefix:'$'},
      legend:{orientation:'h', y:-0.2}
    }, {displayModeBar:false, responsive:true});

    Plotly.newPlot('graph-game-composition', [
      {x:years, y:s.history.map(h=>h.cash), name:'Cash', type:'bar', marker:{color:'#e6c368'}},
      {x:years, y:s.history.map(h=>h.savings), name:'Savings', type:'bar', marker:{color:'#4fc3e0'}},
      {x:years, y:s.history.map(h=>h.investments), name:'Investments', type:'bar', marker:{color:'#3fd69a'}},
      {x:years, y:s.history.map(h=>Math.max(0,h.house-h.mortgage)), name:'Home equity', type:'bar', marker:{color:'#c9a24b'}},
      {x:years, y:s.history.map(h=>h.business), name:'Business', type:'bar', marker:{color:'#8a6fd6'}}
    ], {
      barmode:'stack',
      paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
      font:{color:'#a9bcae', family:'JetBrains Mono'},
      margin:{t:20,l:60,r:20,b:40},
      xaxis:{title:'Year', gridcolor:'#24382c'},
      yaxis:{title:'Asset composition ($)', gridcolor:'#24382c', tickprefix:'$'},
      legend:{orientation:'h', y:-0.25}
    }, {displayModeBar:false, responsive:true});
  }catch(e){
    console.warn('Plotly unavailable in this embed context:', e);
  }
}

function renderGameFinalPanel(){
  const s = game;
  const score = gameScore(s);
  const panel = document.getElementById('game-final-panel');
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="solution-summary" style="border-left-color: var(--gold-bright);">
      <div style="font-family:var(--font-display); font-size:16px; color:var(--gold-bright); margin-bottom:6px;">
        20 years complete — Grade: <span style="color:var(--emerald-bright);">${score.grade}</span>
      </div>
      Final net worth: <b>$${score.nw.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</b><br>
      Final purchasing power (today's dollars): <b>$${score.pp.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</b><br>
      Financial independence: <b>${score.independent ? 'Achieved — passive income covers expenses' : 'Not yet achieved'}</b><br>
      Composite score: <b>${score.composite.toFixed(0)}/100</b>
      <div class="footnote" style="margin-top:10px;">Score blends net worth (40%), purchasing power (30%), and financial independence (30%) against illustrative benchmarks — a teaching scoreboard, not a real financial rating.</div>
    </div>
  `;
}
