<title>Econophysics — The Physics of Markets</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">

<style>
:root{
  --bg:#0a0e16;
  --bg-alt:#0d1220;
  --panel:#111726;
  --panel-2:#151c2e;
  --line: rgba(120,150,200,0.14);
  --ion:#4dd8e6;
  --ion-dim: rgba(77,216,230,0.16);
  --specie:#e0a94c;
  --specie-dim: rgba(224,169,76,0.16);
  --crash:#e05a6b;
  --crash-dim: rgba(224,90,107,0.16);
  --violet:#9d8cf0;
  --text:#e7ecf5;
  --muted:#8894a8;
  --muted-2:#5c6578;
  --radius: 10px;
  --mono: 'JetBrains Mono', monospace;
  --disp: 'Space Grotesk', sans-serif;
  --body: 'Inter', sans-serif;
}
[data-theme="light"]{
  --bg:#f2f4f8;
  --bg-alt:#ffffff;
  --panel:#ffffff;
  --panel-2:#eef1f7;
  --line: rgba(30,40,70,0.12);
  --text:#131826;
  --muted:#5a6478;
  --muted-2:#8994a8;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  overflow-x:hidden;
  transition: background .3s ease, color .3s ease;
}
::selection{ background:var(--ion); color:#04141a; }
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

/* ===== layout shell ===== */
.app{ display:grid; grid-template-columns: 268px 1fr; min-height:100vh; }
@media (max-width: 900px){ .app{ grid-template-columns: 1fr; } }

/* ===== sidebar ===== */
.sidebar{
  background:var(--bg-alt);
  border-right:1px solid var(--line);
  padding:20px 14px 30px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:14px;
  z-index:40;
}
@media (max-width:900px){
  .sidebar{ position:fixed; left:-280px; width:266px; transition:left .28s ease; box-shadow:20px 0 60px rgba(0,0,0,.4); }
  .sidebar.open{ left:0; }
}
.brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 14px; border-bottom:1px solid var(--line); margin-bottom:4px;}
.brand-mark{ width:34px; height:34px; border-radius:8px; background:conic-gradient(from 220deg, var(--ion), var(--specie), var(--crash), var(--ion)); position:relative; flex:none;}
.brand-mark::after{ content:''; position:absolute; inset:5px; border-radius:5px; background:var(--bg-alt); }
.brand-text{ font-family:var(--disp); font-weight:700; font-size:15.5px; line-height:1.15;}
.brand-text span{ display:block; font-family:var(--mono); font-weight:400; font-size:10px; color:var(--muted); letter-spacing:.09em; margin-top:2px;}

.navgroup-label{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--muted-2); text-transform:uppercase; padding:10px 10px 2px;}
.navlist{ list-style:none; display:flex; flex-direction:column; gap:1px;}
.navlist button{
  all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:7px; font-size:13px; color:var(--muted);
  font-family:var(--body); font-weight:500; width:100%;
  transition: background .15s, color .15s;
}
.navlist button .idx{ font-family:var(--mono); font-size:10px; color:var(--muted-2); width:18px; flex:none;}
.navlist button:hover{ background:var(--panel-2); color:var(--text); }
.navlist button.active{ background:var(--ion-dim); color:var(--ion); }
.navlist button.active .idx{ color:var(--ion); }

.side-footer{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); display:flex; gap:8px;}
.icon-btn{
  all:unset; cursor:pointer; width:34px; height:34px; border-radius:8px;
  display:flex; align-items:center; justify-content:center; background:var(--panel-2);
  color:var(--muted); border:1px solid var(--line);
  transition:.15s;
}
.icon-btn:hover{ color:var(--ion); border-color:var(--ion); }
.menu-toggle{ display:none; }
@media (max-width:900px){ .menu-toggle{ display:flex; position:fixed; top:14px; left:14px; z-index:60; } }

/* ===== ticker (signature element) ===== */
.ticker{
  position:sticky; top:0; z-index:30;
  background:var(--bg-alt); border-bottom:1px solid var(--line);
  height:34px; display:flex; align-items:center; overflow:hidden;
  font-family:var(--mono); font-size:11.5px;
}
.ticker-track{ display:flex; gap:36px; white-space:nowrap; animation: ticker-scroll 32s linear infinite; padding-left:100%;}
.ticker span{ color:var(--muted); }
.ticker b{ color:var(--text); font-weight:600; margin:0 5px;}
.up{ color:#5fd88a; } .down{ color:var(--crash); }
@keyframes ticker-scroll{ from{ transform:translateX(0);} to{ transform:translateX(-100%);} }

/* ===== main ===== */
main{ padding: 26px 32px 90px; max-width:1180px; }
@media (max-width:700px){ main{ padding:20px 16px 70px; } }

.section{ display:none; animation: fadein .35s ease; }
.section.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.section-head{ margin-bottom:22px; }
.eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ion); margin-bottom:8px; display:block;}
h1{ font-family:var(--disp); font-size:clamp(26px,4vw,38px); font-weight:700; letter-spacing:-.01em; margin-bottom:8px;}
h2{ font-family:var(--disp); font-size:20px; font-weight:600; margin:26px 0 12px; padding-top:4px;}
h3{ font-family:var(--disp); font-size:15.5px; font-weight:600; margin:16px 0 8px; color:var(--text);}
p{ color:var(--muted); line-height:1.68; font-size:14.5px; margin-bottom:12px; max-width:760px;}
p b, li b{ color:var(--text); font-weight:600;}
.lead{ font-size:16px; color:var(--text); opacity:.88; max-width:700px; }

.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-bottom:16px;
}
.panel-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
.panel-title h3{ margin:0; }
.tag{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ion); background:var(--ion-dim); padding:3px 8px; border-radius:20px; }
.tag.gold{ color:var(--specie); background:var(--specie-dim); }
.tag.red{ color:var(--crash); background:var(--crash-dim); }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
@media (max-width:800px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }

/* scope / readout panel */
.scope{
  position:relative; background:
    radial-gradient(ellipse at top left, rgba(77,216,230,.05), transparent 55%),
    var(--bg-alt);
  border:1px solid var(--line); border-radius:8px; overflow:hidden;
}
.scope canvas{ display:block; width:100%; }
[data-theme="light"] .scope{ background: radial-gradient(ellipse at top left, rgba(77,216,230,.08), transparent 55%), #fbfcfe; }

/* controls */
.controls{ display:flex; flex-wrap:wrap; gap:16px 22px; margin:14px 0; }
.ctrl{ display:flex; flex-direction:column; gap:6px; min-width:150px; flex:1;}
.ctrl label{ font-family:var(--mono); font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }
.ctrl label .val{ color:var(--ion); font-weight:600; }
input[type=range]{
  -webkit-appearance:none; appearance:none; height:4px; border-radius:3px; background:var(--line); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--ion); cursor:pointer; border:2px solid var(--bg-alt); box-shadow:0 0 0 1px var(--ion);
}
select, input[type=number]{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px;
  padding:7px 10px; font-family:var(--mono); font-size:12.5px; outline:none;
}
button.btn{
  all:unset; cursor:pointer; font-family:var(--mono); font-size:12px; font-weight:600;
  padding:8px 16px; border-radius:7px; background:var(--ion); color:#04141a; letter-spacing:.03em;
  transition:.15s; text-align:center;
}
button.btn:hover{ filter:brightness(1.1); transform:translateY(-1px); }
button.btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--text); }
button.btn.ghost:hover{ border-color:var(--ion); color:var(--ion); }
button.btn.gold{ background:var(--specie); }
button.btn.red{ background:var(--crash); }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }

/* stat readouts */
.stat-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
.stat{
  flex:1; min-width:110px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
}
.stat .k{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); display:block; margin-bottom:4px;}
.stat .v{ font-family:var(--mono); font-size:17px; font-weight:600; color:var(--text); }
.stat .v.ion{ color:var(--ion); } .stat .v.gold{ color:var(--specie); } .stat .v.red{ color:var(--crash); }

/* math block */
.eqn{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin:12px 0; overflow-x:auto; }
.eqn-label{ font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-bottom:8px; letter-spacing:.04em;}

/* comparison table */
.map-grid{ display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.map-cell{ background:var(--panel); padding:16px 18px; cursor:default; transition:.15s; position:relative;}
.map-cell:hover{ background:var(--panel-2); }
.map-cell .role{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; display:block;}
.map-cell.phys .role{ color:var(--ion); }
.map-cell.econ .role{ color:var(--specie); }
.map-cell b{ font-family:var(--disp); font-size:16px; display:block; margin-bottom:3px; color:var(--text); font-weight:600;}
.map-cell .desc{
  font-size:12.5px; color:var(--muted); max-height:0; overflow:hidden; transition:max-height .25s ease, margin-top .25s ease; line-height:1.5;
}
.map-cell:hover .desc{ max-height:120px; margin-top:6px; }

/* accordion / expandable */
.acc{ border:1px solid var(--line); border-radius:8px; margin-bottom:8px; overflow:hidden; background:var(--panel);}
.acc-head{ padding:12px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size:13.5px; font-weight:600;}
.acc-head::after{ content:'+'; font-family:var(--mono); color:var(--ion); font-size:16px; }
.acc.open .acc-head::after{ content:'−'; }
.acc-body{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
.acc-body-inner{ padding:0 16px 16px; }
.acc.open .acc-body{ max-height:600px; }

/* did you know */
.dyk{ border-left:3px solid var(--specie); background:var(--specie-dim); border-radius:0 8px 8px 0; padding:12px 16px; font-size:13px; color:var(--text); margin:14px 0;}
.dyk b{ color:var(--specie); }

.legend{ display:flex; gap:14px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:8px;}
.legend span{ display:inline-flex; align-items:center; gap:6px; }
.legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }

.footer-note{ text-align:center; color:var(--muted-2); font-size:11.5px; font-family:var(--mono); padding:40px 0 10px; }

.tradingview-widget-container{
    width:100%;
}

.tradingview-widget-container__widget{
    width:100%;
    height:100%;
}

#tvAssetChart{
    width:100%;
    height:900px;
}

#tvAssetTechnical{
    width:100%;
    height:300px;
}

#tvAssetInfo{
    width:100%;
    height:220px;
}

<script>
/* ============================================================
   ECONOPHYSICS — shared utilities
   ============================================================ */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));

function gauss(mean=0, sd=1){
  let u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return mean + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function studentT(nu=3){
  // sum-of-normals approx for heavy tails (fast, good enough for teaching visuals)
  const g = gauss(0,1);
  let chi2=0;
  for(let i=0;i<nu;i++){ const z=gauss(0,1); chi2+=z*z; }
  return g/Math.sqrt(chi2/nu);
}
function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function std(arr){ const m=mean(arr); return Math.sqrt(mean(arr.map(x=>(x-m)**2))); }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

function hidpi(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width));
  const h = Math.max(1, Math.round(canvas.height ? canvas.clientHeight||rect.height : rect.height));
  if(canvas.width !== w*dpr || canvas.height !== h*dpr){
    canvas.width = w*dpr; canvas.height = h*dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w: w, h: h};
}
function drawGrid(ctx,w,h,step=40){
  ctx.save();
  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=0;x<=w;x+=step){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,h); }
  for(let y=0;y<=h;y+=step){ ctx.moveTo(0,y+.5); ctx.lineTo(w,y+.5); }
  ctx.stroke();
  ctx.restore();
}
function getCSS(varName){
  return getComputedStyle(document.body).getPropertyValue(varName).trim();
}

/* ============================================================
   NAVIGATION / SECTION REGISTRY
   ============================================================ */
const SECTIONS = [
  // Foundations
  {id:'intro', group:'Foundations', title:'What is Econophysics?'},
  {id:'mapping', group:'Foundations', title:'Physics ↔ Economics'},
  {id:'stats', group:'Foundations', title:'Statistical Properties'},
  {id:'scaling', group:'Foundations', title:'Scaling Laws & Zipf'},
  {id:'complexity', group:'Foundations', title:'Complexity & Emergence'},
  // Stochastic Models
  {id:'brownian', group:'Stochastic Models', title:'Brownian Motion & GBM'},
  {id:'randomwalk', group:'Stochastic Models', title:'Random Walk Lab'},
  {id:'montecarlo', group:'Stochastic Models', title:'Monte Carlo Finance'},
  // Wealth & Inequality
  {id:'wealth', group:'Wealth & Inequality', title:'Wealth Exchange Model'},
  {id:'pareto', group:'Wealth & Inequality', title:'Pareto Distribution'},
  // Criticality & Networks
  {id:'volatility', group:'Criticality & Networks', title:'Market Volatility'},
  {id:'correlation', group:'Criticality & Networks', title:'Correlation Matrix'},
  {id:'network', group:'Criticality & Networks', title:'Financial Network'},
  {id:'percolation', group:'Criticality & Networks', title:'Percolation & Contagion'},
  {id:'crash', group:'Criticality & Networks', title:'Market Crash Simulation'},
  {id:'ising', group:'Criticality & Networks', title:'Ising Market Model'},
  {id:'soc', group:'Criticality & Networks', title:'Self-Organized Criticality'},
  // Finance & Risk
  {id:'risk', group:'Finance & Risk', title:'Risk Analysis'},
  {id:'marketdata', group:'Finance & Risk', title:'Real Market Data'},
  // Reference
  {id:'equations', group:'Reference', title:'Equation Reference'},
  {id:'exercises', group:'Reference', title:'Interactive Exercises'},
  {id:'casestudies', group:'Reference', title:'Historical Case Studies'},
  {id:'glossary', group:'Reference', title:'Glossary & Tooltips'},
  {id:'dashboard', group:'Reference', title:'Final Dashboard'},
];
const GROUP_TO_LIST = {
  'Foundations':'navFoundations', 'Stochastic Models':'navStochastic',
  'Wealth & Inequality':'navWealth', 'Criticality & Networks':'navCritical',
  'Finance & Risk':'navFinance', 'Reference':'navRef'
};
function buildNav(){
  let counters = {};
  SECTIONS.forEach((s)=>{
    counters[s.group] = (counters[s.group]||0)+1;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.dataset.target = s.id;
    btn.innerHTML = `<span class="idx">${String(counters[s.group]).padStart(2,'0')}</span><span>${s.title}</span>`;
    btn.addEventListener('click', ()=>showSection(s.id));
    li.appendChild(btn);
    $('#'+GROUP_TO_LIST[s.group]).appendChild(li);
  });
}
function showSection(id){
  $$('.section').forEach(s=>s.classList.remove('active'));
  const target = document.getElementById('sec-'+id);
  if(target) target.classList.add('active');
  $$('.navlist button').forEach(b=>b.classList.toggle('active', b.dataset.target===id));
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  if(window.innerWidth<=900) $('#sidebar').classList.remove('open');
  onSectionShown[id] && onSectionShown[id]();
}
const onSectionShown = {}; // populated per-section for lazy sim start

/* accordions */
document.addEventListener('click', (e)=>{
  const head = e.target.closest('.acc-head');
  if(head){ head.parentElement.classList.toggle('open'); }
});

/* theme + menu */
$('#themeToggle').addEventListener('click', ()=>{
  const b = document.body;
  b.dataset.theme = b.dataset.theme==='dark' ? 'light':'dark';
});
$('#menuToggle').addEventListener('click', ()=> $('#sidebar').classList.toggle('open'));

/* ticker content */
function buildTicker(){
  const items = [];
  const track = $('#tickerTrack');
  const html = items.map(it=>`<span>${it.sym} <b>${it.v}</b><span class="${it.d}">${it.d==='up'?'▲':'▼'}</span></span>`).join('');
  track.innerHTML = html + html; // duplicate for seamless loop
}

/* ============================================================
   SECTION CONTENT BUILDERS
   Each builder returns an HTML string OR directly wires up DOM.
   Pattern: create the <section> shell, inject HTML, then call
   a post-mount function (in onSectionShown) for anything that
   needs live canvases / listeners.
   ============================================================ */
const SECTION_BUILDERS = {}; // id -> function(container){...}
const BUILT = {}; // id -> true once implemented (false => stub)

function mountSections(){
  const main = $('#main');
  SECTIONS.forEach(s=>{
    const sec = document.createElement('section');
    sec.className = 'section';
    sec.id = 'sec-'+s.id;
    main.appendChild(sec);
    if(SECTION_BUILDERS[s.id]){
      SECTION_BUILDERS[s.id](sec);
      BUILT[s.id] = true;
    } else {
      sec.innerHTML = stubHTML(s);
      BUILT[s.id] = false;
    }
  });
}
function stubHTML(s){
  const idx = SECTIONS.filter(x=>x.group===s.group).findIndex(x=>x.id===s.id)+1;
  return `
    <div class="section-head">
      <span class="eyebrow">${s.group} · Module ${idx}</span>
      <h1>${s.title}</h1>
      <p class="lead">This module is scheduled for the next build step and is not yet implemented — it is intentionally left out rather than filled with fake content.</p>
    </div>
    <div class="panel"><p style="margin-bottom:0">Coming in a subsequent update: full interactive simulation and reference content for <b>${s.title}</b>.</p></div>`;
}

/* ---------- 1. INTRO ---------- */
SECTION_BUILDERS['intro'] = function(sec){
  sec.innerHTML = `
    <div class="section-head">
      <span class="eyebrow">Foundations · 01</span>
      <h1>What is Econophysics?</h1>
      <p class="lead">Econophysics applies the tools of statistical mechanics, random-process theory, and complex-systems analysis — originally built to describe gases, magnets, and disordered matter — to the behavior of financial markets and economies.</p>
    </div>

    <div class="grid-2">
      <div class="panel">

function drawIntroDemo(){
  const canvas = $('#introCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);
  const n = 60, steps = 200;
  const colors = [getCSS('--ion'), getCSS('--specie'), getCSS('--crash'), getCSS('--violet')];
  let paths = [];
  for(let i=0;i<n;i++){
    let y = h/2, path=[y];
    for(let t=1;t<steps;t++){ y += gauss(0, 1.1); path.push(y); }
    paths.push(path);
  }
  ctx.lineWidth = 1;
  paths.forEach((p,i)=>{
    ctx.strokeStyle = colors[i%colors.length];
    ctx.globalAlpha = 0.18;
    ctx.beginPath();
    p.forEach((y,t)=>{
      const x = (t/(steps-1))*w;
      const yy = clamp(y, 6, h-6);
      t===0 ? ctx.moveTo(x,yy) : ctx.lineTo(x,yy);
    });
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  // mean path
  ctx.strokeStyle = getCSS('--text'); ctx.lineWidth = 2;
  ctx.beginPath();
  for(let t=0;t<steps;t++){
    const x = (t/(steps-1))*w;
    const m = mean(paths.map(p=>p[t]));
    t===0 ? ctx.moveTo(x,m) : ctx.lineTo(x,m);
  }
  ctx.stroke();
}

onSectionShown['stats'] = function(){ drawStatsDemo(); if(window.renderMathInElement) renderMathInElement($('#sec-stats')); };
function drawStatsDemo(){
  const canvas = $('#statsCanvas');
  if(!canvas) return;
  const mode = $('#statsDist') ? $('#statsDist').value : 'both';
  const nu = $('#statsNu') ? +$('#statsNu').value : 3;
  const N = $('#statsN') ? +$('#statsN').value : 6000;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const g = Array.from({length:N}, ()=>gauss(0,1));
  const t = Array.from({length:N}, ()=>studentT(nu));

  function kurtosis(arr){
    const m = mean(arr), s = std(arr);
    return mean(arr.map(x=>((x-m)/s)**4));
  }
  $('#statKurtG').textContent = kurtosis(g).toFixed(2);
  $('#statKurtT').textContent = kurtosis(t).toFixed(2);
  $('#statMaxG').textContent = Math.max(...g.map(Math.abs)).toFixed(2)+'σ';
  $('#statMaxT').textContent = Math.max(...t.map(Math.abs)).toFixed(2)+'σ';

  function histogram(arr, bins, range){
    const [lo,hi] = range;
    const counts = new Array(bins).fill(0);
    arr.forEach(x=>{
      if(x<lo||x>hi) return;
      const b = clamp(Math.floor((x-lo)/(hi-lo)*bins),0,bins-1);
      counts[b]++;
    });
    return counts.map(c=>c/arr.length/((hi-lo)/bins));
  }
  const range = [-6,6], bins = 80;
  const hg = histogram(g,bins,range);
  const ht = histogram(t,bins,range);
  const maxDensity = Math.max(...hg, ...ht, 0.01);

  function plot(hist, color){
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.globalAlpha = 0.85; ctx.lineWidth = 1.6;
    ctx.beginPath();
    hist.forEach((v,i)=>{
      const x = (i/bins)*w;
      const y = h - (v/maxDensity)*(h-14) - 4;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if(mode==='gauss'||mode==='both') plot(hg, getCSS('--ion'));
  if(mode==='t'||mode==='both') plot(ht, getCSS('--crash'));

  // zero line + axis labels
  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('-6σ', 4, h-4); ctx.fillText('0', w/2-4, h-4); ctx.fillText('+6σ', w-28, h-4);
}

function drawScalingDemo(){
  const canvas = $('#scalingCanvas');
  if(!canvas) return;
  const alpha = $('#scalAlpha') ? +$('#scalAlpha').value : 2.5;
  const N = $('#scalN') ? +$('#scalN').value : 5000;
  $('#scalTrueA').textContent = alpha.toFixed(2);
  const xmin = 1;
  // sample from power law: x = xmin * (1-u)^(-1/(alpha-1))
  const samples = Array.from({length:N}, ()=>{
    const u = Math.random();
    return xmin * Math.pow(1-u, -1/(alpha-1));
  });
  // log-log histogram with logarithmic bins
  const logMax = Math.log10(Math.max(...samples));
  const bins = 26;
  const counts = new Array(bins).fill(0);
  samples.forEach(x=>{
    const b = clamp(Math.floor((Math.log10(x)/logMax)*bins), 0, bins-1);
    counts[b]++;
  });
  const pts = [];
  counts.forEach((c,i)=>{
    if(c<=0) return;
    const logx = (i+0.5)/bins*logMax;
    const width = (Math.pow(10,(i+1)/bins*logMax) - Math.pow(10,i/bins*logMax));
    const density = c/N/Math.max(width,1e-9);
    if(density>0) pts.push([logx, Math.log10(density)]);
  });
  // least squares fit slope
  const mx = mean(pts.map(p=>p[0])), my = mean(pts.map(p=>p[1]));
  let num=0, den=0;
  pts.forEach(p=>{ num += (p[0]-mx)*(p[1]-my); den += (p[0]-mx)**2; });
  const slope = den!==0 ? num/den : 0;
  $('#scalFitA').textContent = (-slope).toFixed(2);

  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);
  if(pts.length<2) return;
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const xlo=Math.min(...xs), xhi=Math.max(...xs), ylo=Math.min(...ys), yhi=Math.max(...ys);
  const X = v => 30 + (v-xlo)/(xhi-xlo||1)*(w-50);
  const Y = v => h-24 - (v-ylo)/(yhi-ylo||1)*(h-40);
  ctx.fillStyle = getCSS('--ion');
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),2.4,0,7); ctx.fill(); });
  // fit line
  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(X(xlo), Y(my+slope*(xlo-mx)));
  ctx.lineTo(X(xhi), Y(my+slope*(xhi-mx)));
  ctx.stroke();
  ctx.fillStyle = getCSS('--muted'); ctx.font='10px '+getCSS('--mono');
  ctx.fillText('log₁₀(x) →', w-70, h-6);
  ctx.save(); ctx.translate(12,20); ctx.fillText('log₁₀(density)', 0, 0); ctx.restore();
}
function drawZipfDemo(){
  const canvas = $('#zipfCanvas');
  if(!canvas) return;
  const s = $('#scalS') ? +$('#scalS').value : 1.0;
  const items = $('#scalItems') ? +$('#scalItems').value : 200;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);
  const sizes = Array.from({length:items}, (_,i)=> Math.pow(i+1, -s));
  const xs = sizes.map((_,i)=> Math.log10(i+1));
  const ys = sizes.map(v=> Math.log10(v));
  const xlo=Math.min(...xs), xhi=Math.max(...xs), ylo=Math.min(...ys), yhi=Math.max(...ys);
  const X = v => 30 + (v-xlo)/(xhi-xlo||1)*(w-50);
  const Y = v => h-24 - (v-ylo)/(yhi-ylo||1)*(h-40);
  ctx.strokeStyle = getCSS('--crash'); ctx.lineWidth=2;
  ctx.beginPath();
  xs.forEach((x,i)=>{ i===0 ? ctx.moveTo(X(x),Y(ys[i])) : ctx.lineTo(X(x),Y(ys[i])); });
  ctx.stroke();
  ctx.fillStyle = getCSS('--muted'); ctx.font='10px '+getCSS('--mono');
  ctx.fillText('log₁₀(rank) →', w-80, h-6);

}

let _bmLastResult = null; // cache so histogram + path chart share one simulation run

function runBrownianSim(){
  const canvas = $('#bmPathCanvas');
  if(!canvas) return;
  const mode = $('#bmMode').value;
  const mu = +$('#bmMu').value;
  const sigma = +$('#bmSigma').value;
  const dt = +$('#bmDt').value;
  const numPaths = +$('#bmPaths').value;
  const S0 = 100;
  const steps = clamp(Math.round(1/dt), 20, 500);
  const T = steps*dt;

  const paths = [];
  for(let p=0; p<numPaths; p++){
    const path = new Array(steps+1);
    path[0] = S0;
    let S = S0;
    for(let i=1;i<=steps;i++){
      if(mode==='rw'){
        S += (Math.random()<0.5 ? -1 : 1);
      } else if(mode==='abm'){
        S += mu*dt + sigma*Math.sqrt(dt)*gauss(0,1);
      } else { // gbm — exact solution step
        S = S*Math.exp((mu-0.5*sigma*sigma)*dt + sigma*Math.sqrt(dt)*gauss(0,1));
      }
      path[i] = S;
    }
    paths.push(path);
  }

  // per-timestep mean & std across the ensemble
  const meanArr = new Array(steps+1), stdArr = new Array(steps+1);
  for(let i=0;i<=steps;i++){
    const col = paths.map(p=>p[i]);
    meanArr[i] = mean(col);
    stdArr[i] = std(col);
  }

  const finals = paths.map(p=>p[steps]);
  const empMean = mean(finals), empStd = std(finals);
  let theoMean, theoStd;
  if(mode==='gbm'){
    theoMean = S0*Math.exp(mu*T);
    theoStd = Math.sqrt((S0**2)*Math.exp(2*mu*T)*(Math.exp(sigma*sigma*T)-1));
  } else if(mode==='abm'){
    theoMean = S0 + mu*T;
    theoStd = sigma*Math.sqrt(T);
  } else {
    theoMean = S0; theoStd = Math.sqrt(steps); // simple symmetric RW variance = n * step_var(=1)
  }

  $('#bmS0').textContent = S0.toFixed(2);
  $('#bmMeanEmp').textContent = empMean.toFixed(2);
  $('#bmMeanTheo').textContent = theoMean.toFixed(2);
  $('#bmStdEmp').textContent = empStd.toFixed(2);
  $('#bmStdTheo').textContent = theoStd.toFixed(2);

  _bmLastResult = {paths, meanArr, stdArr, finals, steps, mode};
  drawBrownianPaths(paths, meanArr, stdArr, steps);
  drawBrownianHist(finals, mode);
}

function drawBrownianPaths(paths, meanArr, stdArr, steps){
  const canvas = $('#bmPathCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  const allVals = paths.flat();
  const lo = Math.min(...allVals), hi = Math.max(...allVals);
  const pad = (hi-lo)*0.06 || 1;
  const ylo = lo-pad, yhi = hi+pad;
  const X = t => (t/steps)*w;
  const Y = v => h - 10 - ((v-ylo)/(yhi-ylo))*(h-20);

  // ±2σ band
  ctx.fillStyle = getCSS('--crash-dim');
  ctx.beginPath();
  for(let i=0;i<=steps;i++){ const x=X(i), y=Y(meanArr[i]+2*stdArr[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  for(let i=steps;i>=0;i--){ const x=X(i), y=Y(meanArr[i]-2*stdArr[i]); ctx.lineTo(x,y); }
  ctx.closePath(); ctx.fill();

  // ±1σ band
  ctx.fillStyle = getCSS('--specie-dim');
  ctx.beginPath();
  for(let i=0;i<=steps;i++){ const x=X(i), y=Y(meanArr[i]+1*stdArr[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  for(let i=steps;i>=0;i--){ const x=X(i), y=Y(meanArr[i]-1*stdArr[i]); ctx.lineTo(x,y); }
  ctx.closePath(); ctx.fill();

  // individual sample paths (faint)
  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 1; ctx.globalAlpha = 0.14;
  paths.forEach(p=>{
    ctx.beginPath();
    p.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // mean path (bold)
  ctx.strokeStyle = getCSS('--text'); ctx.lineWidth = 2.2;
  ctx.beginPath();
  meanArr.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-4);
  ctx.fillText('t = T', w-30, h-4);
}

function drawBrownianHist(finals, mode){
  const canvas = $('#bmHistCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const lo = Math.min(...finals), hi = Math.max(...finals);
  const bins = 30;
  const counts = new Array(bins).fill(0);
  finals.forEach(x=>{
    const b = clamp(Math.floor((x-lo)/(hi-lo||1)*bins), 0, bins-1);
    counts[b]++;
  });
  const maxC = Math.max(...counts, 1);
  const barW = w/bins;
  ctx.fillStyle = mode==='gbm' ? getCSS('--crash') : getCSS('--ion');
  ctx.globalAlpha = 0.8;
  counts.forEach((c,i)=>{
    const bh = (c/maxC)*(h-24);
    ctx.fillRect(i*barW+1, h-20-bh, barW-2, bh);
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText(lo.toFixed(1), 4, h-6);
  ctx.fillText(hi.toFixed(1), w-34, h-6);
}

function runRandomWalkSim(){
  const canvas = $('#rwPathCanvas');
  if(!canvas) return;

  const numWalkers = +$('#rwWalkers').value;
  const stepSize = +$('#rwStep').value;
  const bias = +$('#rwBias').value;
  const steps = +$('#rwSteps').value;

  const mu1 = stepSize*(2*bias-1);
  const var1 = 4*bias*(1-bias)*stepSize*stepSize;

  const numPathsToDraw = Math.min(150, numWalkers);
  const drawnPaths = Array.from({length:numPathsToDraw}, ()=> new Float64Array(steps+1));

  const positions = new Float64Array(numWalkers);
  const msdArr = new Float64Array(steps+1);
  const meanArr = new Float64Array(steps+1);

  const cp1 = Math.max(1, Math.round(steps*0.12));
  const cp2 = Math.max(2, Math.round(steps*0.45));
  const cp3 = steps;
  let snap1=null, snap2=null, snap3=null;

  for(let t=1; t<=steps; t++){
    let sum=0, sumSq=0;
    for(let i=0;i<numWalkers;i++){
      const dir = Math.random()<bias ? 1 : -1;
      positions[i] += dir*stepSize;
      const p = positions[i];
      sum += p; sumSq += p*p;
      if(i<numPathsToDraw) drawnPaths[i][t] = p;
    }
    meanArr[t] = sum/numWalkers;
    msdArr[t] = sumSq/numWalkers;
    if(t===cp1) snap1 = positions.slice();
    if(t===cp2) snap2 = positions.slice();
    if(t===cp3) snap3 = positions.slice();
  }

  const finalPositions = positions;
  const empMean = mean(Array.from(finalPositions));
  const empStd = std(Array.from(finalPositions));
  const theoMean = mu1*steps;
  const theoStd = Math.sqrt(var1*steps);
  const msdTheoFinal = var1*steps + (mu1*steps)**2;

  $('#rwMsdEmp').textContent = msdArr[steps].toFixed(2);
  $('#rwMsdTheo').textContent = msdTheoFinal.toFixed(2);
  $('#rwMeanCmp').textContent = `${empMean.toFixed(2)} / ${theoMean.toFixed(2)}`;
  $('#rwStdCmp').textContent = `${empStd.toFixed(2)} / ${theoStd.toFixed(2)}`;

  drawRWPaths(drawnPaths, meanArr, steps);
  drawRWMSD(msdArr, steps, mu1, var1);
  drawRWDist(finalPositions, theoMean, theoStd);
  drawRWCLT(snap1, snap2, snap3, cp1, cp2, cp3);
}

function drawRWPaths(drawnPaths, meanArr, steps){
  const canvas = $('#rwPathCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  let lo=Infinity, hi=-Infinity;
  drawnPaths.forEach(p=> p.forEach(v=>{ if(v<lo) lo=v; if(v>hi) hi=v; }));
  if(!isFinite(lo)){ lo=-1; hi=1; }
  const pad = (hi-lo)*0.08 || 1;
  lo -= pad; hi += pad;
  const X = t => (t/steps)*w;
  const Y = v => h - 10 - ((v-lo)/(hi-lo))*(h-20);

  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 1; ctx.globalAlpha = 0.16;
  drawnPaths.forEach(p=>{
    ctx.beginPath();
    for(let i=0;i<=steps;i++){ const x=X(i), y=Y(p[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  ctx.strokeStyle = getCSS('--text'); ctx.lineWidth = 2.2;
  ctx.beginPath();
  for(let i=0;i<=steps;i++){ const x=X(i), y=Y(meanArr[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.stroke();

  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(w, Y(0)); ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-4);
  ctx.fillText('t = T', w-30, h-4);
}

function drawRWMSD(msdArr, steps, mu1, var1){
  const canvas = $('#rwMSDCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const theo = t => var1*t + (mu1*t)**2;
  const maxY = Math.max(msdArr[steps], theo(steps)) * 1.08 || 1;
  const X = t => (t/steps)*w;
  const Y = v => h - 10 - (v/maxY)*(h-20);

  // theoretical curve
  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 2;
  ctx.beginPath();
  for(let t=0;t<=steps;t++){ const x=X(t), y=Y(theo(t)); t===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.stroke();

  // empirical points
  ctx.fillStyle = getCSS('--ion');
  const strideStep = Math.max(1, Math.round(steps/80));
  for(let t=0;t<=steps;t+=strideStep){
    ctx.beginPath(); ctx.arc(X(t), Y(msdArr[t]), 2, 0, 7); ctx.fill();
  }

  // linear fit for diffusion coefficient (using unbiased-diffusion relation MSD ≈ 2*D*t)
  const pts = [];
  for(let t=1;t<=steps;t+=strideStep) pts.push([t, msdArr[t]]);
  const mx = mean(pts.map(p=>p[0])), my = mean(pts.map(p=>p[1]));
  let num=0, den=0;
  pts.forEach(p=>{ num += (p[0]-mx)*(p[1]-my); den += (p[0]-mx)**2; });
  const slope = den!==0 ? num/den : 0;
  $('#rwDFit').textContent = (slope/2).toFixed(3);

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-4);
  ctx.fillText('t = T', w-30, h-4);
}

function rwHistogram(arr, bins, range){
  const [lo,hi] = range;
  const counts = new Array(bins).fill(0);
  arr.forEach(x=>{
    if(x<lo||x>hi) return;
    const b = clamp(Math.floor((x-lo)/(hi-lo)*bins), 0, bins-1);
    counts[b]++;
  });
  return counts.map(c=> c/arr.length/((hi-lo)/bins));
}

function drawRWDist(finalPositions, theoMean, theoStd){
  const canvas = $('#rwDistCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const arr = Array.from(finalPositions);
  const lo = Math.min(...arr), hi = Math.max(...arr);
  const pad = (hi-lo)*0.05 || 1;
  const range = [lo-pad, hi+pad];
  const bins = 40;
  const hist = rwHistogram(arr, bins, range);
  const maxDensity = Math.max(...hist, 1e-9);

  const X = i => (i/bins)*w;
  const Y = v => h - 6 - (v/maxDensity)*(h-16);

  ctx.fillStyle = getCSS('--ion'); ctx.globalAlpha = 0.75;
  const barW = w/bins;
  hist.forEach((v,i)=>{ ctx.fillRect(X(i)+1, Y(v), barW-2, h-6-Y(v)); });
  ctx.globalAlpha = 1;

  // gaussian overlay
  if(theoStd>0){
    ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 2;
    ctx.beginPath();
    for(let px=0; px<=w; px+=2){
      const x = range[0] + (px/w)*(range[1]-range[0]);
      const density = (1/(theoStd*Math.sqrt(2*Math.PI))) * Math.exp(-((x-theoMean)**2)/(2*theoStd*theoStd));
      const y = Y(density);
      px===0 ? ctx.moveTo(px,y) : ctx.lineTo(px,y);
    }
    ctx.stroke();
  }

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText(range[0].toFixed(1), 4, h-4);
  ctx.fillText(range[1].toFixed(1), w-30, h-4);
}

function drawRWCLT(snap1, snap2, snap3, cp1, cp2, cp3){
  const canvas = $('#rwCLTCanvas');
  if(!canvas || !snap1) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const colors = [getCSS('--crash'), getCSS('--specie'), getCSS('--ion')];
  const labels = [`t = ${cp1} (early)`, `t = ${cp2} (mid)`, `t = ${cp3} (final)`];
  const snaps = [snap1, snap2, snap3];

  const bins = 34;
  ctx.lineWidth = 1.8;
  snaps.forEach((snap,idx)=>{
    const arr = Array.from(snap);
    const m = mean(arr), s = std(arr) || 1;
    const z = arr.map(x=> (x-m)/s); // rescale so shapes are comparable
    const range = [-4,4];
    const hist = rwHistogram(z, bins, range);
    const maxDensity = Math.max(...hist, 1e-9);
    const X = i => (i/bins)*w;
    const Y = v => h - 6 - (v/maxDensity)*(h-16);
    ctx.strokeStyle = colors[idx];
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    hist.forEach((v,i)=>{ const x=X(i)+ (w/bins)/2, y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('-4σ', 4, h-4); ctx.fillText('0', w/2-4, h-4); ctx.fillText('+4σ', w-30, h-4);

  const legend = $('#rwCLTLegend');
  if(legend){
    legend.innerHTML = labels.map((l,i)=>`<span><i style="background:${colors[i]}"></i>${l}</span>`).join('');
  }
}


/* ---------- 8. MONTE CARLO FINANCE ---------- */

/* shared numeric helpers for this module */
function erf(x){
  // Abramowitz-Stegun approximation
  const sign = x<0 ? -1 : 1; x = Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t = 1/(1+p*x);
  const y = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
function normCDF(x){ return 0.5*(1+erf(x/Math.SQRT2)); }
function bsPrice(S0,K,r,sigma,T,type){
  if(T<=0 || sigma<=0) return type==='call' ? Math.max(S0-K,0) : Math.max(K-S0,0);
  const d1 = (Math.log(S0/K) + (r+0.5*sigma*sigma)*T) / (sigma*Math.sqrt(T));
  const d2 = d1 - sigma*Math.sqrt(T);
  if(type==='call') return S0*normCDF(d1) - K*Math.exp(-r*T)*normCDF(d2);
  return K*Math.exp(-r*T)*normCDF(-d2) - S0*normCDF(-d1);
}

function runMonteCarloSim(){
  const canvas = $('#mcHistCanvas');
  if(!canvas) return;

  const type = $('#mcType').value;
  const S0 = +$('#mcS0').value;
  const K = +$('#mcK').value;
  const r = +$('#mcR').value;
  const sigma = +$('#mcSigma').value;
  const T = +$('#mcT').value;
  const N = +$('#mcN').value;
  const mu = +$('#mcMu').value;

  // risk-neutral terminal prices (for pricing) + real-world terminal prices (for VaR)
  const ST_rn = new Float64Array(N);
  const ST_rw = new Float64Array(N);
  const drift_rn = (r-0.5*sigma*sigma)*T;
  const drift_rw = (mu-0.5*sigma*sigma)*T;
  const volT = sigma*Math.sqrt(T);
  const payoffs = new Float64Array(N);

  for(let i=0;i<N;i++){
    const z = gauss(0,1);
    const s_rn = S0*Math.exp(drift_rn + volT*z);
    ST_rn[i] = s_rn;
    ST_rw[i] = S0*Math.exp(drift_rw + volT*gauss(0,1)); // independent draw for real-world path
    payoffs[i] = type==='call' ? Math.max(s_rn-K,0) : Math.max(K-s_rn,0);
  }
  const disc = Math.exp(-r*T);
  const discPayoffs = Array.from(payoffs, p=> p*disc);
  const mcPrice = mean(discPayoffs);
  const seArr = std(discPayoffs)/Math.sqrt(N);
  const bsP = bsPrice(S0,K,r,sigma,T,type);

  $('#mcPriceMC').textContent = mcPrice.toFixed(3);
  $('#mcPriceBS').textContent = bsP.toFixed(3);
  $('#mcSE').textContent = '±'+seArr.toFixed(3);
  $('#mcCI').textContent = `[${(mcPrice-1.96*seArr).toFixed(2)}, ${(mcPrice+1.96*seArr).toFixed(2)}]`;

  drawMCHist(Array.from(ST_rn), K, type);
  drawMCConvergence(discPayoffs, bsP);
  drawMCVaR(Array.from(ST_rw), S0);
}

function drawMCHist(ST, K, type){
  const canvas = $('#mcHistCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const lo = Math.min(...ST), hi = Math.max(...ST);
  const bins = 44;
  const counts = new Array(bins).fill(0);
  ST.forEach(x=>{
    const b = clamp(Math.floor((x-lo)/(hi-lo||1)*bins), 0, bins-1);
    counts[b]++;
  });
  const maxC = Math.max(...counts,1);
  const barW = w/bins;
  const itmColor = getCSS('--specie'), otmColor = getCSS('--ion');

  counts.forEach((c,i)=>{
    const x0 = lo + (i/bins)*(hi-lo);
    const x1 = lo + ((i+1)/bins)*(hi-lo);
    const mid = (x0+x1)/2;
    const isITM = type==='call' ? mid>K : mid<K;
    ctx.fillStyle = isITM ? itmColor : otmColor;
    ctx.globalAlpha = 0.8;
    const bh = (c/maxC)*(h-24);
    ctx.fillRect(i*barW+1, h-20-bh, barW-2, bh);

  const kx = ((K-lo)/(hi-lo||1))*w;
  ctx.strokeStyle = getCSS('--crash'); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(kx,0); ctx.lineTo(kx,h-20); ctx.stroke();

  ctx.fillText(lo.toFixed(0), 4, h-4);

function drawMCConvergence(discPayoffs, bsP){
  const canvas = $('#mcConvCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const N = discPayoffs.length;
  const numCheckpoints = 80;
  const overallStd = std(discPayoffs);
  let running = 0;
  const runningMeans = [], ciLo=[], ciHi=[], xs=[];
  let idx=0;
  for(let c=1;c<=numCheckpoints;c++){
    const target = Math.round((c/numCheckpoints)*N);
    while(idx<target){ running += discPayoffs[idx]; idx++; }
    const n = idx;
    const m = running/n;
    const se = overallStd/Math.sqrt(n); // approx using full-sample std, standard teaching shortcut
    runningMeans.push(m); ciLo.push(m-1.96*se); ciHi.push(m+1.96*se); xs.push(n);
  }

  const allY = [...ciLo, ...ciHi, bsP];
  const ylo = Math.min(...allY), yhi = Math.max(...allY);
  const pad = (yhi-ylo)*0.1 || 1;
  const Y = v => h-20 - ((v-(ylo-pad))/((yhi+pad)-(ylo-pad)))*(h-30);
  const X = i => (i/(numCheckpoints-1))*w;

  // CI band
  ctx.fillStyle = getCSS('--specie-dim');
  ctx.beginPath();
  ciHi.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  for(let i=numCheckpoints-1;i>=0;i--){ ctx.lineTo(X(i), Y(ciLo[i])); }
  ctx.closePath(); ctx.fill();

  // BS reference line
  ctx.strokeStyle = getCSS('--text'); ctx.lineWidth = 1.6; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(0,Y(bsP)); ctx.lineTo(w,Y(bsP)); ctx.stroke();
  ctx.setLineDash([]);

  // running mean
  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 2;
  ctx.beginPath();
  runningMeans.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('N = '+xs[0], 4, h-4);
  ctx.fillText('N = '+N, w-60, h-4);
}

function drawMCVaR(ST_rw, S0){
  const canvas = $('#mcVaRCanvas');
  if(!canvas) return;

  const pl = ST_rw.map(s=> s-S0); // P&L per unit position
  pl.sort((a,b)=>a-b);
  const n = pl.length;
  const q = (p)=> pl[clamp(Math.floor(p*n), 0, n-1)];
  const var95 = -q(0.05);
  const var99 = -q(0.01);
  const tailIdx = Math.max(1, Math.floor(0.05*n));
  const es95 = -mean(pl.slice(0, tailIdx));
  const meanPL = mean(pl);

  $('#mcVaR95').textContent = var95.toFixed(2);
  $('#mcVaR99').textContent = var99.toFixed(2);
  $('#mcES95').textContent = es95.toFixed(2);
  $('#mcMeanPL').textContent = (meanPL>=0?'+':'')+meanPL.toFixed(2);

  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const lo = pl[0], hi = pl[n-1];
  const bins = 44;
  const counts = new Array(bins).fill(0);
  pl.forEach(x=>{
    const b = clamp(Math.floor((x-lo)/(hi-lo||1)*bins), 0, bins-1);
    counts[b]++;
  });
  const maxC = Math.max(...counts,1);
  const barW = w/bins;
  const var95Threshold = -var95;

  counts.forEach((c,i)=>{
    const x0 = lo + (i/bins)*(hi-lo);
    const mid = x0 + (hi-lo)/bins/2;
    ctx.fillStyle = mid < var95Threshold ? getCSS('--crash') : getCSS('--ion');
    ctx.globalAlpha = 0.8;
    const bh = (c/maxC)*(h-24);
    ctx.fillRect(i*barW+1, h-20-bh, barW-2, bh);
  });
  ctx.globalAlpha = 1;

  const vx = ((var95Threshold-lo)/(hi-lo||1))*w;
  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(vx,0); ctx.lineTo(vx,h-20); ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText(lo.toFixed(0), 4, h-4);
  ctx.fillText(hi.toFixed(0), w-30, h-4);
  ctx.fillStyle = getCSS('--specie');
  ctx.fillText('VaR95', clamp(vx-16,0,w-40), 12);
}

/* Lanczos approximation for ln(Gamma(x)), x > 0 */
function lgamma(x){
  const g = 7;
  const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028,
             771.32342877765313, -176.61502916214059, 12.507343278686905,
             -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if(x < 0.5){
    return Math.log(Math.PI/Math.sin(Math.PI*x)) - lgamma(1-x);
  }
  x -= 1;
  let a = c[0];
  const t = x + g + 0.5;
  for(let i=1;i<g+2;i++) a += c[i]/(x+i);
  return 0.5*Math.log(2*Math.PI) + (x+0.5)*Math.log(t) - t + Math.log(a);
}
/* Gamma-distribution PDF, parameterized by shape n and target mean <w> */
function gammaPDF(w, n, meanW){
  if(w<=0 || meanW<=0) return 0;
  const rate = n/meanW;
  const logPdf = n*Math.log(rate) + (n-1)*Math.log(w) - rate*w - lgamma(n);
  return Math.exp(logPdf);
}
function computeGini(arr){
  const n = arr.length;
  const sorted = [...arr].sort((a,b)=>a-b);
  const total = sorted.reduce((a,b)=>a+b,0);
  if(total<=0) return 0;
  let weightedSum = 0;
  sorted.forEach((w,i)=>{ weightedSum += (i+1)*w; });
  return (2*weightedSum)/(n*total) - (n+1)/n;
}

function resetWealthSim(){
  const N = +$('#weN').value;
  const mode = $('#weMode').value;
  const lambdaMax = +$('#weLambda').value;
  _wealthAgents = new Float64Array(N).fill(1); // everyone starts with equal wealth = 1
  _wealthLambdas = mode==='hetero'
    ? Float64Array.from({length:N}, ()=> Math.random()*lambdaMax)
    : new Float64Array(N).fill(lambdaMax);
  _wealthGiniHistory = [computeGini(Array.from(_wealthAgents))];
  _wealthSweepCount = 0;
  redrawWealthAll();
}

function advanceWealthSim(){
  if(!_wealthAgents) return resetWealthSim();
  const N = _wealthAgents.length;
  const sweeps = +$('#weSweeps').value;
  const mode = $('#weMode').value;
  const lambdaSlider = +$('#weLambda').value;

  // if uniform mode, lambda may have changed since last advance — keep lambdas in sync
  if(mode==='uniform'){ _wealthLambdas.fill(lambdaSlider); }

  for(let s=0; s<sweeps; s++){
    for(let k=0; k<N; k++){ // one sweep ≈ N random pairwise trades
      const i = Math.floor(Math.random()*N);
      let j = Math.floor(Math.random()*N);
      if(j===i) j = (j+1)%N;
      const eps = Math.random();
      const li = _wealthLambdas[i], lj = _wealthLambdas[j];
      const wi = _wealthAgents[i], wj = _wealthAgents[j];
      const pool = wi + wj;
      _wealthAgents[i] = li*wi + eps*(1-li)*pool;
      _wealthAgents[j] = lj*wj + (1-eps)*(1-lj)*pool;
    }
    _wealthGiniHistory.push(computeGini(Array.from(_wealthAgents)));
  }
  _wealthSweepCount += sweeps;
  redrawWealthAll();
}

function redrawWealthAll(){
  if(!_wealthAgents) return;
  const arr = Array.from(_wealthAgents);
  const mode = $('#weMode').value;
  const lambdaSlider = +$('#weLambda').value;
  const meanW = mean(arr);
  const gini = computeGini(arr);
  const sorted = [...arr].sort((a,b)=>a-b);

  $('#weSweepCount').textContent = _wealthSweepCount;
  $('#weMean').textContent = meanW.toFixed(3);
  $('#weGini').textContent = gini.toFixed(3);
  $('#weSpread').textContent = sorted[0]>1e-9
    ? (sorted[sorted.length-1]/sorted[0]).toFixed(1)+'×'
    : '∞';

  drawWealthHist(arr, mode, lambdaSlider, meanW);
  drawWealthLorenz(sorted);
  drawWealthGiniHistory(_wealthGiniHistory);
}

function drawWealthHist(arr, mode, lambda, meanW){

    const b = clamp(Math.floor((x/hi)*bins), 0, bins-1);
    counts[b]++;
  });
  const binWidth = hi/bins;
  const density = counts.map(c=> c/arr.length/binWidth);
  const maxDensity = Math.max(...density, 1e-9);

  const X = i => (i/bins)*w;
  const Y = v => h - 20 - (v/maxDensity)*(h-30);

  ctx.fillStyle = getCSS('--ion'); ctx.globalAlpha = 0.78;

  density.forEach((v,i)=>{ ctx.fillRect(X(i)+1, Y(v), barW-2, h-20-Y(v)); });
  ctx.globalAlpha = 1;

  // theoretical overlay (uniform mode only — heterogeneous has no simple closed form)
  if(mode==='uniform'){
    const n = 1 + 3*lambda/(1-lambda);

    }

}

function drawWealthLorenz(sorted){
  const canvas = $('#weLorenzCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  ctx.beginPath();

    ctx.lineTo(X(x), Y(y));
  });

  ctx.fillStyle = getCSS('--crash-dim');

let _paretoSamples = null; // cached raw samples from the last simulation run

/** Inverse-transform sample: X = xm / U^(1/alpha), U ~ Uniform(0,1) */
function paretoSample(xm, alpha){
  const u = Math.random();
  return xm / Math.pow(u, 1/alpha);
}
function paretoPDF(x, xm, alpha){
  if(x < xm) return 0;
  return alpha * Math.pow(xm, alpha) / Math.pow(x, alpha+1);
}
/** Theoretical top-p wealth share: W(p) = p^((alpha-1)/alpha), alpha > 1 */
function paretoTopShare(p, alpha){
  if(alpha <= 1) return NaN;
  return Math.pow(p, (alpha-1)/alpha);
}
function paretoGiniTheo(alpha){
  return alpha > 0.5 ? 1/(2*alpha-1) : NaN;
}

function runParetoSim(){
  const canvas = $('#parCCDFCanvas');
  if(!canvas) return;
  const xm = +$('#parXm').value;
  const alpha = +$('#parAlpha').value;
  const N = +$('#parN').value;

  const samples = new Float64Array(N);
  for(let i=0;i<N;i++) samples[i] = paretoSample(xm, alpha);
  _paretoSamples = {samples, xm, alpha};
  redrawParetoAll();
}

function redrawParetoAll(){
  if(!_paretoSamples) return;
  const {samples, xm, alpha} = _paretoSamples;
  const arr = Array.from(samples);
  const N = arr.length;

  const empMean = mean(arr);
  const theoMean = alpha>1 ? (alpha*xm/(alpha-1)) : Infinity;
  const empGini = computeGini(arr);
  const theoGini = paretoGiniTheo(alpha);

  // Hill estimator: alpha_hat = N / sum(ln(x_i / xm))
  let sumLog = 0;
  arr.forEach(x=> sumLog += Math.log(x/xm));
  const hillAlpha = sumLog>0 ? N/sumLog : NaN;

  $('#parMeanCmp').textContent = `${empMean.toFixed(2)} / ${isFinite(theoMean) ? theoMean.toFixed(2) : '∞'}`;
  $('#parGiniCmp').textContent = `${empGini.toFixed(3)} / ${isFinite(theoGini) ? theoGini.toFixed(3) : '—'}`;
  $('#parHillA').textContent = `${hillAlpha.toFixed(3)} (true: ${alpha.toFixed(2)})`;
  $('#parMax').textContent = Math.max(...arr).toFixed(2);
  $('#parInfiniteNote').style.display = alpha<=1 ? 'block' : 'none';

  drawParetoCCDF(arr, xm, alpha);
  drawParetoHist(arr, xm, alpha);
  drawParetoLorenz(arr, alpha);
  updateParetoShare();
}

function drawParetoCCDF(arr, xm, alpha){
  const canvas = $('#parCCDFCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const sorted = [...arr].sort((a,b)=>a-b);
  const N = sorted.length;
  // subsample for plotting performance if huge
  const stride = Math.max(1, Math.floor(N/1500));
  const pts = [];
  for(let i=N-1; i>=0; i-=stride){
    const rank = N-i; // number of samples >= sorted[i]
    const survival = rank/N;
    if(sorted[i] > 0 && survival > 0) pts.push([Math.log10(sorted[i]), Math.log10(survival)]);
  }
  if(pts.length < 2) return;

  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const xlo=Math.min(...xs), xhi=Math.max(...xs), ylo=Math.min(...ys), yhi=Math.max(...ys);
  const X = v => 30 + (v-xlo)/((xhi-xlo)||1)*(w-46);
  const Y = v => h-24 - (v-ylo)/((yhi-ylo)||1)*(h-36);

  ctx.fillStyle = getCSS('--ion');
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),1.8,0,7); ctx.fill(); });

  // theoretical line: log10(S) = alpha*log10(xm) - alpha*log10(x)
  const theoY = lx => alpha*Math.log10(xm) - alpha*lx;
  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(X(xlo), Y(clamp(theoY(xlo), ylo, yhi)));
  ctx.lineTo(X(xhi), Y(clamp(theoY(xhi), ylo, yhi)));
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font='10px '+getCSS('--mono');
  ctx.fillText('log₁₀(x) →', w-70, h-6);
  ctx.save(); ctx.translate(12,20); ctx.fillText('log₁₀ P(X>x)', 0, 0); ctx.restore();
}

function drawParetoHist(arr, xm, alpha){
  const canvas = $('#parHistCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  // clip to 95th percentile so the linear histogram is legible despite the long tail
  const sorted = [...arr].sort((a,b)=>a-b);
  const clip = sorted[Math.floor(sorted.length*0.95)] || sorted[sorted.length-1];
  const bins = 40;
  const counts = new Array(bins).fill(0);
  let clipped = 0;
  arr.forEach(x=>{
    if(x>clip){ clipped++; return; }
    const b = clamp(Math.floor(((x-xm)/(clip-xm||1))*bins), 0, bins-1);
    counts[b]++;
  });
  const maxC = Math.max(...counts,1);
  const barW = w/bins;
  ctx.fillStyle = getCSS('--ion'); ctx.globalAlpha = 0.8;
  counts.forEach((c,i)=>{
    const bh = (c/maxC)*(h-24);
    ctx.fillRect(i*barW+1, h-20-bh, barW-2, bh);
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('x = '+xm.toFixed(1), 4, h-4);
  ctx.fillText('x = '+clip.toFixed(1)+' (p95)', w-90, h-4);
  if(clipped>0){
    ctx.fillStyle = getCSS('--crash');
    ctx.fillText(clipped+' samples beyond p95 not shown', 4, 12);
  }
}

function drawParetoLorenz(arr, alpha){
  const canvas = $('#parLorenzCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const sorted = [...arr].sort((a,b)=>a-b);
  const n = sorted.length;
  const total = sorted.reduce((a,b)=>a+b,0) || 1;
  const X = f => 10 + f*(w-20);
  const Y = f => h - 10 - f*(h-20);

  ctx.strokeStyle = getCSS('--muted-2'); ctx.setLineDash([4,4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(1),Y(1)); ctx.stroke();
  ctx.setLineDash([]);

  // theoretical Lorenz curve: L(p) = 1-(1-p)^(1-1/alpha), for alpha>1
  if(alpha>1){
    ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 2;
    ctx.beginPath();
    for(let px=0; px<=w; px+=2){
      const p = (px-10)/(w-20);
      if(p<0||p>1) continue;
      const L = 1 - Math.pow(1-p, 1-1/alpha);
      const x = X(p), y = Y(clamp(L,0,1));
      px===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  // empirical Lorenz curve
  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(X(0), Y(0));
  let cum = 0;
  const stride = Math.max(1, Math.floor(n/400));
  for(let i=stride-1; i<n; i+=stride){
    for(let k=i-stride+1;k<=i;k++) cum += sorted[k];
    ctx.lineTo(X((i+1)/n), Y(cum/total));
  }
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('poorest → richest', X(0.28), h-2);
}

function updateParetoShare(){
  $('#parPVal').textContent = (+$('#parP').value).toFixed(2);
  if(!_paretoSamples) return;
  const p = +$('#parP').value;
  const {samples, alpha} = _paretoSamples;
  const theoShare = paretoTopShare(p, alpha);
  $('#parShareTheo').textContent = isFinite(theoShare) ? (theoShare*100).toFixed(1)+'%' : '—';

  const sorted = [...samples].sort((a,b)=>b-a); // descending
  const cutoff = Math.max(1, Math.round(p*sorted.length));
  const topSum = sorted.slice(0,cutoff).reduce((a,b)=>a+b,0);
  const total = sorted.reduce((a,b)=>a+b,0);
  $('#parShareEmp').textContent = total>0 ? ((topSum/total)*100).toFixed(1)+'%' : '—';
}

function acfSeries(arr, maxLag){
  const n = arr.length;
  const m = mean(arr);
  const denom = arr.reduce((s,x)=> s+(x-m)**2, 0);
  const out = [];
  for(let lag=0; lag<=maxLag; lag++){
    let num = 0;
    for(let i=0;i<n-lag;i++) num += (arr[i]-m)*(arr[i+lag]-m);
    out.push(denom>0 ? num/denom : 0);
  }
  return out;
}

function runVolatilitySim(){
  const canvas = $('#volReturnsCanvas');
  if(!canvas) return;

  const mode = $('#volMode').value;
  const sigmaLR = +$('#volSigmaLR').value;
  const alpha = +$('#volAlpha').value;
  const beta = +$('#volBeta').value;
  const T = +$('#volT').value;

  const persistence = alpha+beta;
  const omega = sigmaLR*sigmaLR*(1-persistence);
  const halfLife = persistence>0 && persistence<1 ? Math.log(0.5)/Math.log(persistence) : Infinity;

  const returns = new Float64Array(T);
  const sigmas = new Float64Array(T);
  let sigma2 = sigmaLR*sigmaLR;

  for(let t=0;t<T;t++){
    if(mode==='garch'){
      sigmas[t] = Math.sqrt(sigma2);
      const z = gauss(0,1);
      returns[t] = sigmas[t]*z;
      sigma2 = omega + alpha*returns[t]*returns[t] + beta*sigma2;
    } else {
      sigmas[t] = sigmaLR;
      returns[t] = sigmaLR*gauss(0,1);
    }
  }

  const realizedSigma = std(Array.from(returns));

  $('#volPersistence').textContent = persistence.toFixed(3);
  $('#volHalfLife').textContent = isFinite(halfLife) ? halfLife.toFixed(1) : '∞';

  _volLastResult = {returns, sigmas, sigmaLR, mode};
  drawVolReturns(returns, sigmas);
  drawVolSigma(sigmas, sigmaLR);

  const acfR = acfSeries(Array.from(returns), 40).slice(1);
  const acfAbs = acfSeries(Array.from(returns).map(Math.abs), 40).slice(1);
  drawVolACF($('#volACFCanvas'), acfR, getCSS('--ion'));
  drawVolACF($('#volACFAbsCanvas'), acfAbs, getCSS('--crash'));
}

function drawVolReturns(returns, sigmas){
  const canvas = $('#volReturnsCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  const T = returns.length;
  const maxAbs = Math.max(...Array.from(returns).map(Math.abs), ...Array.from(sigmas).map(s=>2*s)) * 1.05 || 1;
  const X = t => (t/T)*w;
  const Y = v => h/2 - (v/maxAbs)*(h/2-8);
  const barW = Math.max(w/T, 0.6);

  ctx.fillStyle = getCSS('--specie-dim');
  ctx.beginPath();
  for(let t=0;t<T;t++){ const x=X(t), y=Y(2*sigmas[t]); t===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  for(let t=T-1;t>=0;t--){ const x=X(t), y=Y(-2*sigmas[t]); ctx.lineTo(x,y); }
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = getCSS('--ion'); ctx.globalAlpha = 0.85;
  for(let t=0;t<T;t++){
    const x = X(t), y0 = Y(0), y1 = Y(returns[t]);
    ctx.fillRect(x, Math.min(y0,y1), Math.max(barW,0.6), Math.abs(y1-y0));
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,Y(0)); ctx.lineTo(w,Y(0)); ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-4);
  ctx.fillText('t = T', w-30, h-4);
}

function drawVolSigma(sigmas, sigmaLR){

  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const T = sigmas.length;
  const maxS = Math.max(...Array.from(sigmas), sigmaLR) * 1.1 || 1;
  const X = t => (t/T)*w;
  const Y = v => h - 10 - (v/maxS)*(h-20);

  ctx.strokeStyle = getCSS('--muted-2'); ctx.setLineDash([5,4]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0,Y(sigmaLR)); ctx.lineTo(w,Y(sigmaLR)); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 1.8;
  ctx.beginPath();
  for(let t=0;t<T;t++){ const x=X(t), y=Y(sigmas[t]); t===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-4);
  ctx.fillText('t = T', w-30, h-4);
  ctx.fillText('σ_LR', 4, Y(sigmaLR)-4);
}

function drawVolACF(canvas, acfVals, color){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);

  const barW = (w/n)*0.7;

  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth=1;

  ctx.fillText('lag '+n, w-40, h-4);
}


/* ---------- 12. CORRELATION MATRIX (RANDOM MATRIX THEORY) ---------- */

/* --- color helpers for the heatmap --- */
function hexToRgb(hex){
  hex = hex.trim();
  if(hex[0]==='#') hex = hex.slice(1);
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function mixColor(hex1, hex2, t){
  const c1=hexToRgb(hex1), c2=hexToRgb(hex2);
  const r=Math.round(lerp(c1[0],c2[0],t)), g=Math.round(lerp(c1[1],c2[1],t)), b=Math.round(lerp(c1[2],c2[2],t));
  return `rgb(${r},${g},${b})`;
}
function corrColor(v){
  v = clamp(v,-1,1);
  return v>=0 ? mixColor(getCSS('--panel-2'), getCSS('--ion'), v)
               : mixColor(getCSS('--panel-2'), getCSS('--crash'), -v);
}

/* --- Jacobi eigenvalue algorithm for symmetric N×N matrices --- */
function jacobiEigenvalues(A, n, maxSweeps=50){
  const a = A.map(row=>row.slice());
  const v = Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=> i===j?1:0));
  for(let sweep=0; sweep<maxSweeps; sweep++){
    let off=0;
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) off += a[i][j]*a[i][j];
    if(off < 1e-9) break;
    for(let p=0;p<n-1;p++){
      for(let q=p+1;q<n;q++){
        if(Math.abs(a[p][q]) < 1e-12) continue;
        const theta = (a[q][q]-a[p][p])/(2*a[p][q]);
        const t = (theta===0 ? 1 : Math.sign(theta))/(Math.abs(theta)+Math.sqrt(theta*theta+1));
        const c = 1/Math.sqrt(t*t+1), s = t*c;
        const app=a[p][p], aqq=a[q][q], apq=a[p][q];
        a[p][p] = c*c*app - 2*s*c*apq + s*s*aqq;
        a[q][q] = s*s*app + 2*s*c*apq + c*c*aqq;
        a[p][q] = 0; a[q][p] = 0;
        for(let i=0;i<n;i++){
          if(i!==p && i!==q){
            const aip=a[i][p], aiq=a[i][q];
            a[i][p]=c*aip-s*aiq; a[p][i]=a[i][p];
            a[i][q]=s*aip+c*aiq; a[q][i]=a[i][q];
          }
        }
        for(let i=0;i<n;i++){
          const vip=v[i][p], viq=v[i][q];
          v[i][p]=c*vip-s*viq;
          v[i][q]=s*vip+c*viq;
        }
      }
    }
  }
  const values = Array.from({length:n},(_,i)=>a[i][i]);
  return {values, vectors:v};
}

/* --- factor-model asset return simulation & correlation estimation --- */
function simulateFactorReturns(N, T, marketBeta, sectorBeta, sectorOf, numSectors){
  const X = Array.from({length:T}, ()=> new Array(N));
  for(let t=0;t<T;t++){
    const M = gauss(0,1);
    const S = Array.from({length:numSectors}, ()=> gauss(0,1));
    for(let i=0;i<N;i++){
      X[t][i] = marketBeta*M + sectorBeta*S[sectorOf[i]] + gauss(0,1);
    }
  }
  return X;
}
function correlationMatrix(X, T, N){
  const means = new Array(N).fill(0), stds = new Array(N).fill(0);
  for(let i=0;i<N;i++){ let s=0; for(let t=0;t<T;t++) s+=X[t][i]; means[i]=s/T; }
  for(let i=0;i<N;i++){ let s=0; for(let t=0;t<T;t++) s+=(X[t][i]-means[i])**2; stds[i]=Math.sqrt(s/T)||1; }
  const Z = Array.from({length:T},(_,t)=> Array.from({length:N},(_,i)=> (X[t][i]-means[i])/stds[i]));
  const C = Array.from({length:N},()=> new Array(N).fill(0));
  for(let i=0;i<N;i++){
    for(let j=i;j<N;j++){
      let s=0; for(let t=0;t<T;t++) s += Z[t][i]*Z[t][j];
      const val = s/T;
      C[i][j]=val; C[j][i]=val;
    }
  }
  return C;
}
function mpDensity(lambda, Q, lo, hi){
  if(lambda<lo || lambda>hi || lambda<=0) return 0;
  return (Q/(2*Math.PI)) * Math.sqrt((hi-lambda)*(lambda-lo)) / lambda;
}

function runCorrelationSim(){
  const canvas = $('#corrHeatmapCanvas');
  if(!canvas) return;

  const N = +$('#corrN').value;
  const T = +$('#corrT').value;
  const numSectors = +$('#corrSectors').value;
  const marketBeta = +$('#corrMarketBeta').value;
  const sectorBeta = +$('#corrSectorBeta').value;

  const sectorSize = Math.ceil(N/numSectors);
  const sectorOf = Array.from({length:N}, (_,i)=> Math.min(numSectors-1, Math.floor(i/sectorSize)));

  const X = simulateFactorReturns(N,T,marketBeta,sectorBeta,sectorOf,numSectors);
  const C = correlationMatrix(X,T,N);
  const {values, vectors} = jacobiEigenvalues(C,N);

  const idx = values.map((v,i)=>i).sort((a,b)=> values[b]-values[a]);
  const sortedValues = idx.map(i=>values[i]);
  const topIdx = idx[0];
  let topVec = Array.from({length:N},(_,i)=> vectors[i][topIdx]);
  if(mean(topVec) < 0) topVec = topVec.map(v=>-v);

  const Q = T/N;
  const mpLo = Q>=1 ? Math.pow(1-Math.sqrt(1/Q),2) : 0;
  const mpHi = Math.pow(1+Math.sqrt(1/Q),2);
  const signalCount = sortedValues.filter(v=> v>mpHi).length;

  $('#corrQVal').textContent = Q.toFixed(2);
  $('#corrLambda1').textContent = sortedValues[0].toFixed(3);
  $('#corrVarExplained').textContent = ((sortedValues[0]/N)*100).toFixed(1)+'%';
  $('#corrMPBound').textContent = mpHi.toFixed(3);
  $('#corrSignalCount').textContent = signalCount + ' / ' + N;

  _corrLastResult = {C, sortedValues, sectorOf, topVec, mpLo, mpHi, Q, N};
  drawCorrHeatmap(C, N, sectorOf);
  drawEigvecBars(topVec, sectorOf);
  drawEigenSpectrum(sortedValues, mpLo, mpHi, Q, N);
}

function drawCorrHeatmap(C, N, sectorOf){
  const canvas = $('#corrHeatmapCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  const size = Math.min(w,h);
  const cell = size/N;
  const offsetX = (w-size)/2;

  for(let i=0;i<N;i++){
    for(let j=0;j<N;j++){
      ctx.fillStyle = corrColor(C[i][j]);
      ctx.fillRect(offsetX + j*cell, i*cell, Math.ceil(cell)+0.5, Math.ceil(cell)+0.5);
    }
  }
  // sector boundary lines
  ctx.strokeStyle = getCSS('--bg-alt'); ctx.lineWidth = 1.6;
  let prevSector = sectorOf[0];
  for(let i=1;i<N;i++){
    if(sectorOf[i] !== prevSector){
      ctx.beginPath();
      ctx.moveTo(offsetX, i*cell); ctx.lineTo(offsetX+size, i*cell); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(offsetX+i*cell, 0); ctx.lineTo(offsetX+i*cell, size); ctx.stroke();
      prevSector = sectorOf[i];
    }
  }
  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth = 1;
  ctx.strokeRect(offsetX, 0, size, size);
}

function drawEigvecBars(topVec, sectorOf){
  const canvas = $('#corrEigvecCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const N = topVec.length;
  const sectorColors = [getCSS('--ion'), getCSS('--specie'), getCSS('--crash'), getCSS('--violet')];
  const maxAbs = Math.max(...topVec.map(Math.abs), 1e-6);
  const barW = w/N;
  const zeroY = h/2;

  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,zeroY); ctx.lineTo(w,zeroY); ctx.stroke();

  topVec.forEach((v,i)=>{
    ctx.fillStyle = sectorColors[sectorOf[i] % sectorColors.length];
    ctx.globalAlpha = 0.85;
    const barH = (Math.abs(v)/maxAbs) * (h/2-10);
    const y = v>=0 ? zeroY-barH : zeroY;
    ctx.fillRect(i*barW+0.5, y, Math.max(barW-1,0.6), barH);
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('asset 1', 4, h-4);
  ctx.fillText('asset '+N, w-46, h-4);
}

function drawEigenSpectrum(sortedValues, mpLo, mpHi, Q, N){
  const canvas = $('#corrSpectrumCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const maxLambda = Math.max(...sortedValues, mpHi) * 1.08;
  const X = v => 30 + (v/maxLambda)*(w-46);
  const bottom = h-24;

  const bins = Math.max(10, Math.min(24, N));
  const counts = new Array(bins).fill(0);
  sortedValues.forEach(v=>{
    const b = clamp(Math.floor((v/maxLambda)*bins), 0, bins-1);
    counts[b]++;
  });
  const maxC = Math.max(...counts,1);
  const barW = (w-46)/bins;
  const noiseVals = sortedValues.filter(v=> v<=mpHi);
  const signalVals = sortedValues.filter(v=> v>mpHi);

  // histogram bars, colored by whether the bin midpoint is signal or bulk
  counts.forEach((c,i)=>{
    const mid = ((i+0.5)/bins)*maxLambda;
    ctx.fillStyle = mid>mpHi ? getCSS('--crash') : getCSS('--ion');
    ctx.globalAlpha = 0.72;
    const bh = (c/maxC)*(bottom-20);
    ctx.fillRect(30+i*barW+1, bottom-bh, barW-2, bh);
  });
  ctx.globalAlpha = 1;

  // Marchenko-Pastur density curve (rescaled to histogram's max bar height for visual overlay)
  if(Q>=1){
    let maxDensity = 0;
    const densities = [];
    for(let px=0; px<=w; px+=2){
      const lambda = ((px-30)/(w-46))*maxLambda;
      const d = mpDensity(lambda, Q, mpLo, mpHi);
      densities.push([px,d]);
      if(d>maxDensity) maxDensity = d;
    }
    ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 2;
    ctx.beginPath();
    densities.forEach(([px,d],i)=>{
      const y = bottom - (d/(maxDensity||1))*(bottom-20)*0.92;
      i===0 ? ctx.moveTo(px,y) : ctx.lineTo(px,y);
    });
    ctx.stroke();
  }

  // lambda+ boundary
  ctx.strokeStyle = getCSS('--crash'); ctx.setLineDash([5,4]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(X(mpHi),0); ctx.lineTo(X(mpHi),bottom); ctx.stroke();
  ctx.setLineDash([]);

  // signal eigenvalues as dots above axis
  ctx.fillStyle = getCSS('--crash');
  signalVals.forEach(v=>{
    ctx.beginPath(); ctx.arc(X(v), 12, 3, 0, 7); ctx.fill();
  });

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('λ = 0', 4, h-6);
  ctx.fillText('λ = '+maxLambda.toFixed(1), w-56, h-6);
  ctx.fillStyle = getCSS('--crash');
  ctx.fillText('λ₊', clamp(X(mpHi)-8,0,w-20), h-6);
}

/* ---------- 13. FINANCIAL NETWORK ---------- */

/* --- graph generators: each returns {edges:[[i,j,weight]], role:[...]} --- */
function genRandomGraph(N, p){
  const edges = [];
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      if(Math.random() < p) edges.push([i,j, 0.4+Math.random()*1.6]);
    }
  }
  return {edges, role: new Array(N).fill('standard')};
}

function genScaleFreeGraph(N, m){
  m = clamp(m, 1, N-1);
  const edges = [];
  const degree = new Array(N).fill(0);
  const seed = m+1;
  for(let i=0;i<seed;i++){
    for(let j=i+1;j<seed;j++){
      edges.push([i,j, 0.4+Math.random()*1.6]);
      degree[i]++; degree[j]++;
    }
  }
  for(let i=seed;i<N;i++){
    const targets = new Set();
    const totalDeg = degree.reduce((a,b)=>a+b,0) || 1;
    let attempts = 0;
    while(targets.size < Math.min(m,i) && attempts < 200){
      attempts++;
      let r = Math.random()*totalDeg, acc=0, pick=0;
      for(let k=0;k<i;k++){ acc += degree[k]; if(acc>=r){ pick=k; break; } }
      if(!targets.has(pick)) targets.add(pick);
    }
    targets.forEach(t=>{
      edges.push([i,t, 0.4+Math.random()*1.6]);
      degree[i]++; degree[t]++;
    });
  }
  return {edges, role: new Array(N).fill('standard')};
}

function genCorePeripheryGraph(N, coreFrac, pCC, pCP, pPP){
  const coreSize = Math.max(2, Math.round(N*coreFrac));
  const role = Array.from({length:N}, (_,i)=> i<coreSize ? 'core' : 'periphery');
  const edges = [];
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      const bothCore = role[i]==='core' && role[j]==='core';
      const bothPeri = role[i]==='periphery' && role[j]==='periphery';
      const prob = bothCore ? pCC : (bothPeri ? pPP : pCP);
      if(Math.random() < prob) edges.push([i,j, 0.4+Math.random()*1.6]);
    }
  }
  return {edges, role};
}

function computeDegrees(N, edges){
  const deg = new Array(N).fill(0);
  const wdeg = new Array(N).fill(0);
  edges.forEach(([i,j,w])=>{ deg[i]++; deg[j]++; wdeg[i]+=w; wdeg[j]+=w; });
  return {deg, wdeg};
}

function buildAdjacencyMatrix(N, edges){
  const A = Array.from({length:N}, ()=> new Array(N).fill(0));
  edges.forEach(([i,j,w])=>{ A[i][j]=w; A[j][i]=w; });
  return A;
}

function avgClusteringCoefficient(N, edges){
  const adjSet = Array.from({length:N}, ()=> new Set());
  edges.forEach(([i,j])=>{ adjSet[i].add(j); adjSet[j].add(i); });
  let sum=0, counted=0;
  for(let i=0;i<N;i++){
    const neighbors = Array.from(adjSet[i]);
    const k = neighbors.length;
    if(k<2) continue;
    let links=0;
    for(let a=0;a<k;a++){
      for(let b=a+1;b<k;b++){
        if(adjSet[neighbors[a]].has(neighbors[b])) links++;
      }
    }
    sum += links/(k*(k-1)/2);
    counted++;
  }
  return counted>0 ? sum/counted : 0;
}

/* Fruchterman–Reingold force-directed layout */
function forceDirectedLayout(N, edges, width, height, iterations){
  iterations = iterations || 180;
  const pos = Array.from({length:N}, ()=> ({
    x: width/2 + (Math.random()-0.5)*width*0.7,
    y: height/2 + (Math.random()-0.5)*height*0.7
  }));
  if(N<=1) return pos;
  const k = Math.sqrt((width*height)/N) * 0.85;
  for(let iter=0; iter<iterations; iter++){
    const disp = Array.from({length:N}, ()=> ({x:0,y:0}));
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        let dx = pos[i].x-pos[j].x, dy = pos[i].y-pos[j].y;
        let dist = Math.sqrt(dx*dx+dy*dy) || 0.01;
        const force = (k*k)/dist;
        const fx = (dx/dist)*force, fy = (dy/dist)*force;
        disp[i].x += fx; disp[i].y += fy;
        disp[j].x -= fx; disp[j].y -= fy;
      }
    }
    edges.forEach(([i,j,wt])=>{
      let dx = pos[i].x-pos[j].x, dy = pos[i].y-pos[j].y;
      let dist = Math.sqrt(dx*dx+dy*dy) || 0.01;
      const force = (dist*dist)/k * (0.6+0.4*(wt||1));
      const fx = (dx/dist)*force, fy = (dy/dist)*force;
      disp[i].x -= fx; disp[i].y -= fy;
      disp[j].x += fx; disp[j].y += fy;
    });
    const temp = Math.max(0.02, 1 - iter/iterations) * k * 0.12;
    for(let i=0;i<N;i++){
      const dlen = Math.sqrt(disp[i].x**2 + disp[i].y**2) || 0.01;
      pos[i].x += (disp[i].x/dlen) * Math.min(dlen, temp);
      pos[i].y += (disp[i].y/dlen) * Math.min(dlen, temp);
      pos[i].x = clamp(pos[i].x, 16, width-16);
      pos[i].y = clamp(pos[i].y, 16, height-16);
    }
  }
  return pos;
}

function giantComponentSize(N, edges, removedSet){
  const adj = Array.from({length:N}, ()=>[]);
  edges.forEach(([i,j])=>{
    if(removedSet.has(i) || removedSet.has(j)) return;
    adj[i].push(j); adj[j].push(i);
  });
  const visited = new Array(N).fill(false);
  let maxComp = 0;
  for(let i=0;i<N;i++){
    if(visited[i] || removedSet.has(i)) continue;
    let size = 0;
    const stack = [i]; visited[i] = true;
    while(stack.length){
      const u = stack.pop(); size++;
      adj[u].forEach(v=>{ if(!visited[v]){ visited[v]=true; stack.push(v); } });
    }
    if(size>maxComp) maxComp = size;
  }
  return maxComp;
}

function computeRobustnessCurve(N, edges, deg, mode){
  let order;
  if(mode==='targeted'){
    order = Array.from({length:N},(_,i)=>i).sort((a,b)=> deg[b]-deg[a]);
  } else {
    order = Array.from({length:N},(_,i)=>i);
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  }
  const removed = new Set();
  const steps = 20;
  const curve = [giantComponentSize(N, edges, removed)/N];
  const perStep = Math.max(1, Math.ceil(N/steps));
  for(let s=0; s<steps; s++){
    for(let k=0;k<perStep && removed.size<N;k++){ removed.add(order[removed.size]); }
    curve.push(giantComponentSize(N, edges, removed)/N);
  }
  return curve;
}
function computeRobustnessCurveAvg(N, edges, deg, mode, trials){
  if(mode==='targeted') return computeRobustnessCurve(N, edges, deg, mode);
  trials = trials||8;
  let sumCurve = null;
  for(let t=0;t<trials;t++){
    const c = computeRobustnessCurve(N, edges, deg, mode);
    if(!sumCurve) sumCurve = c.slice();
    else c.forEach((v,i)=> sumCurve[i]+=v);
  }
  return sumCurve.map(v=> v/trials);
}

function nodeColor(role, degFrac){
  if(role==='core') return getCSS('--specie');
  if(role==='periphery') return getCSS('--ion');
  return mixColor(getCSS('--ion'), getCSS('--crash'), degFrac);
}
