function runNetworkSim(){
  const canvas = $('#netGraphCanvas');
  if(!canvas) return;

  const topology = $('#netTopology').value;
  const N = +$('#netN').value;
  const p = +$('#netP').value;
  const m = +$('#netM').value;
  const coreFrac = +$('#netCore').value;

  let graph;
  if(topology==='scalefree'){
    graph = genScaleFreeGraph(N, m);
  } else if(topology==='coreperiphery'){
    const pCC = clamp(p*6, 0.05, 0.9);
    const pCP = clamp(p*3, 0.02, 0.6);
    const pPP = clamp(p*0.35, 0.01, 0.4);
    graph = genCorePeripheryGraph(N, coreFrac, pCC, pCP, pPP);
  } else {
    graph = genRandomGraph(N, p);
  }
  const {edges, role} = graph;
  const {deg} = computeDegrees(N, edges);
  const E = edges.length;
  const maxPossible = N*(N-1)/2;
  const density = maxPossible>0 ? E/maxPossible : 0;
  const avgDeg = mean(deg);
  const maxDeg = Math.max(...deg, 0);
  const clustering = avgClusteringCoefficient(N, edges);

  $('#netStatN').textContent = N;
  $('#netStatE').textContent = E;
  $('#netStatAvgK').textContent = avgDeg.toFixed(2);
  $('#netStatDensity').textContent = (density*100).toFixed(1)+'%';
  $('#netStatMaxK').textContent = maxDeg;
  $('#netStatClustering').textContent = clustering.toFixed(3);

  let centrality = new Array(N).fill(1/N);
  if(E>0){
    const A = buildAdjacencyMatrix(N, edges);
    const {values, vectors} = jacobiEigenvalues(A, N);
    let bestIdx = 0;
    for(let i=1;i<N;i++){ if(values[i]>values[bestIdx]) bestIdx = i; }
    const vec = Array.from({length:N}, (_,i)=> vectors[i][bestIdx]);
    const maxAbs = Math.max(...vec.map(Math.abs), 1e-9);
    centrality = vec.map(v=> Math.abs(v)/maxAbs);
  }

  _netLastResult = {N, edges, deg, role, centrality};

  drawNetworkGraph(canvas, N, edges, deg, role);
  drawDegreeHist($('#netDegreeHistCanvas'), deg);
  drawCentralityBars($('#netCentralityCanvas'), centrality, role);

  const curveRandom = computeRobustnessCurveAvg(N, edges, deg, 'random', 8);
  const curveTargeted = computeRobustnessCurve(N, edges, deg, 'targeted');
  drawRobustnessCurve($('#netRobustnessCanvas'), curveRandom, curveTargeted);

  const steps = curveRandom.length-1;
  const fRandIdx = curveRandom.findIndex(v=> v<0.5);
  const fTargIdx = curveTargeted.findIndex(v=> v<0.5);
  $('#netRandThresh').textContent = fRandIdx>=0 ? (fRandIdx/steps).toFixed(2) : '> 1.00';
  $('#netTargThresh').textContent = fTargIdx>=0 ? (fTargIdx/steps).toFixed(2) : '> 1.00';
}

function drawNetworkGraph(canvas, N, edges, deg, role){
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  const positions = forceDirectedLayout(N, edges, w, h, 180);
  const maxDeg = Math.max(...deg, 1);

  ctx.lineCap = 'round';
  edges.forEach(([i,j,wt])=>{
    const p1 = positions[i], p2 = positions[j];
    ctx.strokeStyle = getCSS('--ion');
    ctx.globalAlpha = clamp(0.10 + 0.22*((wt||1)/2), 0.08, 0.5);
    ctx.lineWidth = clamp((wt||1)*0.8, 0.6, 2.6);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  positions.forEach((pt,i)=>{
    const degFrac = deg[i]/maxDeg;
    const r = 3 + degFrac*7;
    ctx.fillStyle = nodeColor(role[i], degFrac);
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = getCSS('--bg-alt'); ctx.lineWidth = 1; ctx.stroke();
  });
}

function drawDegreeHist(canvas, deg){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);
  const maxDeg = Math.max(...deg, 1);
  const bins = Math.max(4, Math.min(maxDeg+1, 20));
  const counts = new Array(bins).fill(0);
  deg.forEach(d=>{
    const b = clamp(Math.floor((d/(maxDeg+1))*bins), 0, bins-1);
    counts[b]++;
  });
  const maxC = Math.max(...counts, 1);
  const barW = w/bins;
  ctx.fillStyle = getCSS('--ion'); ctx.globalAlpha = 0.8;
  counts.forEach((c,i)=>{
    const bh = (c/maxC)*(h-24);
    ctx.fillRect(i*barW+1, h-20-bh, barW-2, bh);
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('k = 0', 4, h-4);
  ctx.fillText('k = '+maxDeg, w-40, h-4);
}

function drawCentralityBars(canvas, centrality, role){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);
  const N = centrality.length;
  const idx = centrality.map((v,i)=>i).sort((a,b)=> centrality[b]-centrality[a]);
  const maxC = Math.max(...centrality, 1e-9);
  const barW = w/N;
  idx.forEach((nodeIdx, rank)=>{
    const v = centrality[nodeIdx];
    const bh = (v/maxC)*(h-24);
    ctx.fillStyle = rank<3 ? getCSS('--crash') : (role[nodeIdx]==='core' ? getCSS('--specie') : getCSS('--ion'));
    ctx.globalAlpha = 0.85;
    ctx.fillRect(rank*barW+1, h-20-bh, Math.max(barW-2,0.6), bh);
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('most central →', 4, h-4);
  ctx.fillText('least central', w-72, h-4);
}

function drawRobustnessCurve(canvas, curveRandom, curveTargeted){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);
  const n = curveRandom.length;
  const X = i => (i/(n-1))*w;
  const Y = v => h-16 - v*(h-26);

  ctx.strokeStyle = getCSS('--muted-2'); ctx.setLineDash([4,4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,Y(0.5)); ctx.lineTo(w,Y(0.5)); ctx.stroke();
  ctx.setLineDash([]);

  function plot(curve, color){
    ctx.strokeStyle = color; ctx.lineWidth = 2.2;
    ctx.beginPath();
    curve.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
  }
  plot(curveRandom, getCSS('--ion'));
  plot(curveTargeted, getCSS('--crash'));

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('f = 0', 4, h-4);
  ctx.fillText('f = 1', w-30, h-4);
  ctx.fillText('S/N=0.5', 4, Y(0.5)-4);
}


/* ---------- 14. PERCOLATION & CONTAGION ---------- */

/* --- site-percolation lattice helpers --- */
function generateLatticeOccupancy(L, p){
  const occ = new Uint8Array(L*L);
  for(let i=0;i<L*L;i++) occ[i] = Math.random()<p ? 1 : 0;
  return occ;
}
function labelClusters(L, occ){
  const labels = new Int32Array(L*L).fill(-1);
  let numClusters = 0;
  const sizes = [];
  for(let idx=0; idx<L*L; idx++){
    if(occ[idx]===0 || labels[idx]!==-1) continue;
    let size = 0;
    const stack=[idx]; labels[idx]=numClusters;
    while(stack.length){
      const u = stack.pop(); size++;
      const x = u%L, y = Math.floor(u/L);
      const nb = [];
      if(x>0) nb.push(u-1);
      if(x<L-1) nb.push(u+1);
      if(y>0) nb.push(u-L);
      if(y<L-1) nb.push(u+L);
      nb.forEach(v=>{ if(occ[v]===1 && labels[v]===-1){ labels[v]=numClusters; stack.push(v); } });
    }
    sizes.push(size);
    numClusters++;
  }
  return {labels, sizes, numClusters};
}
function findSpanningCluster(L, labels, sizes){
  const top = new Set(), bottom = new Set();
  for(let x=0;x<L;x++){
    const t = labels[x]; if(t>=0) top.add(t);
    const b = labels[(L-1)*L+x]; if(b>=0) bottom.add(b);
  }
  let spanning = -1, spanSize = 0;
  top.forEach(t=>{ if(bottom.has(t) && sizes[t]>spanSize){ spanning=t; spanSize=sizes[t]; } });
  return spanning;
}
/* run trials at a given p, return {spanProb, meanLargestFrac} */
function percolationTrial(L, p, trials){
  let spanCount = 0, largestSum = 0;
  for(let t=0;t<trials;t++){
    const occ = generateLatticeOccupancy(L,p);
    const {labels, sizes} = labelClusters(L, occ);
    const spanning = findSpanningCluster(L, labels, sizes);
    if(spanning>=0) spanCount++;
    const largest = sizes.length ? Math.max(...sizes) : 0;
    largestSum += largest/(L*L);
  }
  return {spanProb: spanCount/trials, meanLargestFrac: largestSum/trials};
}

/* --- financial contagion cascade (threshold / DebtRank-style) --- */
function simulateContagionCascade(N, edges, capital, exposureFrac, shockIdx){
  const adj = Array.from({length:N}, ()=>[]);
  edges.forEach(([i,j,w])=>{ adj[i].push([j,w]); adj[j].push([i,w]); });
  const failed = new Uint8Array(N);
  const health = new Float64Array(N).fill(capital);
  failed[shockIdx] = 1; health[shockIdx] = 0;
  const roundsFailed = [1]; // count of newly-failed nodes per round (round 0 = initial shock)
  let changed = true, rounds = 0;
  while(changed && rounds<100){
    changed = false; rounds++;
    const newlyFailed = [];
    for(let i=0;i<N;i++){
      if(failed[i]) continue;
      let loss = 0;
      adj[i].forEach(([j,w])=>{ if(failed[j]) loss += w*exposureFrac; });
      if(loss >= health[i]) newlyFailed.push(i);
    }
    if(newlyFailed.length>0){
      newlyFailed.forEach(i=>{ failed[i]=1; health[i]=0; });
      roundsFailed.push(newlyFailed.length);
      changed = true;
    }
  }
  return {failed, roundsFailed, rounds};
}

/* ---- lattice percolation: run + draw ---- */
function runPercolationLattice(){
  const canvas = $('#percLatticeCanvas');
  if(!canvas) return;
  const L = +$('#percL').value;
  const p = +$('#percP').value;
  const occ = generateLatticeOccupancy(L,p);
  const {labels, sizes, numClusters} = labelClusters(L, occ);
  const spanning = findSpanningCluster(L, labels, sizes);
  const largest = sizes.length ? Math.max(...sizes) : 0;

  $('#percLargestFrac').textContent = (largest/(L*L)).toFixed(3);
  $('#percSpans').textContent = spanning>=0 ? 'Yes' : 'No';
  $('#percNumClusters').textContent = numClusters;

  _percLatticeState = {L, p, occ, labels, sizes, spanning};
  drawPercLattice(L, occ, labels, spanning);
  drawPercClusterDist(sizes);
}
function drawPercLattice(L, occ, labels, spanning){
  const canvas = $('#percLatticeCanvas');
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  const size = Math.min(w,h);
  const cell = size/L;
  const offsetX = (w-size)/2;
  const emptyColor = getCSS('--panel-2');
  const occColor = getCSS('--ion');
  const spanColor = getCSS('--specie');
  for(let y=0;y<L;y++){
    for(let x=0;x<L;x++){
      const idx = y*L+x;
      ctx.fillStyle = occ[idx]===0 ? emptyColor : (labels[idx]===spanning ? spanColor : occColor);
      ctx.fillRect(offsetX + x*cell, y*cell, Math.ceil(cell)+0.5, Math.ceil(cell)+0.5);
    }
  }
  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth = 1;
  ctx.strokeRect(offsetX, 0, size, size);
}
function drawPercClusterDist(sizes){
  const canvas = $('#percClusterDistCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);
  if(!sizes.length) return;

  const maxSize = Math.max(...sizes);
  const bins = Math.min(24, maxSize);
  const logMax = Math.log10(Math.max(maxSize,1)+1);
  const counts = new Array(bins).fill(0);
  sizes.forEach(s=>{
    const b = clamp(Math.floor((Math.log10(s+1)/logMax)*bins), 0, bins-1);
    counts[b]++;
  });
  const pts = [];
  counts.forEach((c,i)=>{
    if(c<=0) return;
    const logx = (i+0.5)/bins*logMax;
    pts.push([logx, Math.log10(c)]);
  });
  if(pts.length<1) return;
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const xlo=Math.min(...xs), xhi=Math.max(...xs,0.01), ylo=0, yhi=Math.max(...ys,1);
  const X = v => 30 + (v-xlo)/((xhi-xlo)||1)*(w-46);
  const Y = v => h-24 - (v-ylo)/((yhi-ylo)||1)*(h-36);

  ctx.fillStyle = getCSS('--crash');
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),3,0,7); ctx.fill(); });

  ctx.fillStyle = getCSS('--muted'); ctx.font='10px '+getCSS('--mono');
  ctx.fillText('log₁₀(size+1) →', w-100, h-6);
  ctx.save(); ctx.translate(12,20); ctx.fillText('log₁₀(count)', 0, 0); ctx.restore();
}

/* ---- p-sweep order-parameter curve ---- */
function runPercolationSweep(){

  const L = clamp(+$('#percL').value, 10, 50); // cap sweep lattice size for speed
  const numP = 26, trials = 6;

    const p = i/(numP-1);

}

function runContagionShock(){

  const capital = +$('#percCap').value;
  const phi = +$('#percPhi').value;

  const {failed, roundsFailed, rounds} = simulateContagionCascade(N, edges, capital, phi, shockIdx);
  const totalFailed = Array.from(failed).reduce((a,b)=>a+b,0);

  drawPercCascadeBars(roundsFailed);

function drawPercNetGraph(){
  const canvas = $('#percNetGraphCanvas');
  if(!canvas || !_percNetState) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  const {N, edges, deg, failed, shockIdx} = _percNetState;
  const positions = forceDirectedLayout(N, edges, w, h, 160);
  const maxDeg = Math.max(...deg, 1);

  ctx.lineCap = 'round';
  edges.forEach(([i,j,wt])=>{
    const p1 = positions[i], p2 = positions[j];
    const bothFailed = failed && failed[i] && failed[j];
    ctx.strokeStyle = bothFailed ? getCSS('--crash') : getCSS('--ion');
    ctx.globalAlpha = bothFailed ? 0.4 : clamp(0.08 + 0.2*((wt||1)/2), 0.06, 0.4);
    ctx.lineWidth = clamp((wt||1)*0.8, 0.6, 2.4);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  positions.forEach((pt,i)=>{
    const degFrac = deg[i]/maxDeg;
    const r = 3 + degFrac*7;
    const isFailed = failed && failed[i];
    const isShock = i===shockIdx;
    ctx.fillStyle = isShock ? getCSS('--specie') : (isFailed ? getCSS('--crash') : getCSS('--ion'));
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = getCSS('--bg-alt'); ctx.lineWidth = 1; ctx.stroke();
  });
}
function drawPercCascadeBars(roundsFailed){
  const canvas = $('#percCascadeCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);
  if(!roundsFailed || !roundsFailed.length) return;

  const maxC = Math.max(...roundsFailed, 1);
  const barW = w/roundsFailed.length;
  ctx.fillStyle = getCSS('--crash'); ctx.globalAlpha = 0.8;
  roundsFailed.forEach((c,i)=>{
    const bh = (c/maxC)*(h-24);
    ctx.fillRect(i*barW+1, h-20-bh, Math.max(barW-2,0.6), bh);
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('round 0 (shock)', 4, h-4);
  ctx.fillText('round '+(roundsFailed.length-1), w-90, h-4);
}

/* --- union-find, used by the Cont-Bouchaud percolation crash model --- */
function crUFFind(parent, x){
  while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; }
  return x;
}
function crUFUnion(parent, rank, x, y){
  const rx = crUFFind(parent,x), ry = crUFFind(parent,y);
  if(rx === ry) return;
  if(rank[rx] < rank[ry]) parent[rx] = ry;
  else if(rank[rx] > rank[ry]) parent[ry] = rx;
  else { parent[ry] = rx; rank[rx]++; }
}
function crMaxDrawdown(prices){
  let peak = prices[0], maxDD = 0;
  for(let i=1;i<prices.length;i++){
    if(prices[i] > peak) peak = prices[i];
    const dd = (peak - prices[i]) / peak;
    if(dd > maxDD) maxDD = dd;
  }
  return maxDD;
}

        <div class="eqn"><div class="eqn-label">Aggregate order imbalance &amp; return</div>$$r_t = \\frac{1}{\\lambda N}\\sum_{c\\,\\in\\,\\text{clusters}} \\phi_c\\,|c|, \\qquad \\phi_c=\\begin{cases}+1 & \\text{prob. } a\\\\ -1 & \\text{prob. } a\\\\ 0 & \\text{prob. } 1-2a\\end{cases}$$</div>
        <p style="margin-bottom:0">$|c|$ is cluster size, $a$ is each cluster's activity level, and $\\lambda$ is market liquidity (depth) — a big, illiquid market absorbs the same order imbalance with a smaller price move.</p>
      </div>

/* ---- main percolation-based crash simulation ---- */
function runCrashSim(){
  const canvas = $('#crashPriceCanvas');
  if(!canvas) return;

  const N = +$('#crN').value;
  const kAvg = +$('#crK').value;
  const a = +$('#crA').value;
  const lambda = +$('#crLambda').value;
  const T = +$('#crT').value;
  const numEdges = Math.round(kAvg*N/2);

  const prices = new Float64Array(T+1);
  prices[0] = 100;
  const returns = new Float64Array(T);
  const clusterFracHistory = new Float64Array(T);

  for(let t=0;t<T;t++){
    const parent = new Int32Array(N);
    for(let i=0;i<N;i++) parent[i] = i;
    const rank = new Uint8Array(N);
    for(let e=0;e<numEdges;e++){
      const i = Math.floor(Math.random()*N);
      let j = Math.floor(Math.random()*N);
      if(j===i) j = (j+1)%N;
      crUFUnion(parent, rank, i, j);
    }
    const clusterSizes = new Map();
    for(let i=0;i<N;i++){
      const r = crUFFind(parent,i);
      clusterSizes.set(r, (clusterSizes.get(r)||0)+1);
    }
    let orderImbalance = 0, largest = 0;
    clusterSizes.forEach(size=>{
      if(size>largest) largest = size;
      const roll = Math.random();
      let decision = 0;
      if(roll < a) decision = 1;
      else if(roll < 2*a) decision = -1;
      orderImbalance += decision*size;
    });
    const ret = orderImbalance/(lambda*N);
    returns[t] = ret;
    prices[t+1] = prices[t]*Math.exp(ret);
    clusterFracHistory[t] = largest/N;
  }

  const retArr = Array.from(returns);
  const sigma = std(retArr) || 1e-9;
  const threshold = 4*sigma;
  const crashEvents = [];
  for(let t=0;t<T;t++){ if(returns[t] < -threshold) crashEvents.push(t); }

  const maxDD = crMaxDrawdown(Array.from(prices));
  const worstReturn = Math.min(...retArr);

  $('#crMeanReturn').textContent = (mean(retArr)*100).toFixed(3)+'%';
  $('#crVolatility').textContent = (sigma*100).toFixed(3)+'%';
  $('#crCrashCount').textContent = crashEvents.length;
  $('#crMaxDrawdown').textContent = '-'+(maxDD*100).toFixed(2)+'%';
  $('#crWorstDay').textContent = (worstReturn*100).toFixed(2)+'%';

  _crashLastResult = {prices, returns, clusterFracHistory, crashEvents, T};
  drawCrashPricePath(prices, crashEvents, T);
  drawCrashClusterFrac(clusterFracHistory, T);
  drawCrashReturnHist(retArr);
}

function drawCrashPricePath(prices, crashEvents, T){
  const canvas = $('#crashPriceCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  const arr = Array.from(prices);
  const lo = Math.min(...arr), hi = Math.max(...arr);
  const pad = (hi-lo)*0.08 || 1;
  const X = t => (t/T)*w;
  const Y = v => h-10 - ((v-(lo-pad))/((hi+pad)-(lo-pad)))*(h-20);

  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 1.8;
  ctx.beginPath();
  arr.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = getCSS('--crash');
  crashEvents.forEach(t=>{
    ctx.beginPath(); ctx.arc(X(t+1), Y(arr[t+1]), 4, 0, Math.PI*2); ctx.fill();
  });

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-4);
  ctx.fillText('t = T', w-30, h-4);
}

function drawCrashClusterFrac(clusterFracHistory, T){
  const canvas = $('#crashClusterCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const arr = Array.from(clusterFracHistory);
  const maxV = Math.max(...arr, 0.05) * 1.1;
  const X = t => (t/T)*w;
  const Y = v => h-14 - (v/maxV)*(h-24);

  ctx.fillStyle = getCSS('--specie-dim');
  ctx.beginPath();
  ctx.moveTo(X(0), Y(0));
  arr.forEach((v,i)=>{ ctx.lineTo(X(i), Y(v)); });
  ctx.lineTo(X(arr.length-1), Y(0));
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 1.8;
  ctx.beginPath();
  arr.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-2);
  ctx.fillText('t = T', w-30, h-2);
}

function drawCrashReturnHist(returns){
  const canvas = $('#crashReturnHistCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const m = mean(returns), s = std(returns) || 1e-9;
  const lo = Math.min(...returns), hi = Math.max(...returns);
  const pad = (hi-lo)*0.05 || s;
  const range = [lo-pad, hi+pad];
  const bins = 40;
  const counts = new Array(bins).fill(0);
  returns.forEach(x=>{
    const b = clamp(Math.floor((x-range[0])/(range[1]-range[0])*bins), 0, bins-1);
    counts[b]++;
  });
  const binWidth = (range[1]-range[0])/bins;
  const density = counts.map(c=> c/returns.length/binWidth);
  const maxDensity = Math.max(...density, 1e-9);

  const X = i => (i/bins)*w;
  const Y = v => h-18 - (v/maxDensity)*(h-28);

  ctx.fillStyle = getCSS('--ion'); ctx.globalAlpha = 0.78;
  const barW = w/bins;
  density.forEach((v,i)=>{ ctx.fillRect(X(i)+1, Y(v), barW-2, h-18-Y(v)); });
  ctx.globalAlpha = 1;

  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 2;
  ctx.beginPath();
  for(let px=0; px<=w; px+=2){
    const x = range[0] + (px/w)*(range[1]-range[0]);
    const d = (1/(s*Math.sqrt(2*Math.PI))) * Math.exp(-((x-m)**2)/(2*s*s));
    const y = Y(d);
    px===0 ? ctx.moveTo(px,y) : ctx.lineTo(px,y);
  }
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText((range[0]*100).toFixed(1)+'%', 4, h-4);
  ctx.fillText((range[1]*100).toFixed(1)+'%', w-40, h-4);
}

/* ---- connectivity sweep: crash risk vs average degree ---- */
function runCrashPSweep(){
  const canvas = $('#crashPSweepCanvas');
  if(!canvas) return;
  const N = clamp(+$('#crN').value, 20, 300); // cap for sweep speed
  const numK = 26, trials = 10;
  const kMax = 5;
  const curve = [];
  for(let i=0;i<numK;i++){
    const kAvg = (i/(numK-1))*kMax;
    const numEdges = Math.round(kAvg*N/2);
    let sumFrac = 0;
    for(let tr=0;tr<trials;tr++){
      const parent = new Int32Array(N);
      for(let k=0;k<N;k++) parent[k]=k;
      const rank = new Uint8Array(N);
      for(let e=0;e<numEdges;e++){
        const a1 = Math.floor(Math.random()*N);
        let b1 = Math.floor(Math.random()*N);
        if(b1===a1) b1=(b1+1)%N;
        crUFUnion(parent, rank, a1, b1);
      }
      const sizes = new Map();
      for(let k=0;k<N;k++){ const r=crUFFind(parent,k); sizes.set(r,(sizes.get(r)||0)+1); }
      let largest=0; sizes.forEach(s=>{ if(s>largest) largest=s; });
      sumFrac += largest/N;
    }
    curve.push({k: kAvg, frac: sumFrac/trials});
  }
  _crashPSweepCurve = curve;
  drawCrashPSweep(curve);
}

function drawCrashPSweep(curve){
  const canvas = $('#crashPSweepCanvas');
  if(!canvas || !curve) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const kMax = curve[curve.length-1].k;
  const X = k => (k/kMax)*w;
  const Y = v => h-16 - v*(h-26);

  ctx.strokeStyle = getCSS('--crash'); ctx.setLineDash([5,4]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(X(1),0); ctx.lineTo(X(1),h-16); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 2.2;
  ctx.beginPath();
  curve.forEach((pt,i)=>{ const x=X(pt.k), y=Y(pt.frac); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('⟨k⟩ = 0', 4, h-4);
  ctx.fillText('⟨k⟩ = '+kMax.toFixed(0), w-46, h-4);
  ctx.fillStyle = getCSS('--crash');
  ctx.fillText('⟨k⟩ = 1', clamp(X(1)-16,0,w-50), 12);
}

/* ---- Sornette log-periodic power law bubble illustration ---- */
function drawLPPLDemo(){
  const canvas = $('#crashLPPLCanvas');
  if(!canvas) return;
  const m = +$('#crLpplM').value;
  const omega = +$('#crLpplOmega').value;
  const C = +$('#crLpplC').value;

  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  const T = 500;
  const tc = T*0.92;
  const A = 0, B = -1;
  const pts = [];
  for(let t=0; t<Math.floor(tc); t++){
    const dt = tc-t;
    const lnP = A + B*Math.pow(dt,m)*(1 + C*Math.cos(omega*Math.log(dt) - 1));
    pts.push([t, lnP]);
  }
  const preCrashLnP = pts[pts.length-1][1];
  const dropLnP = preCrashLnP - 0.35;
  for(let t=Math.floor(tc); t<=T; t++){
    const frac = (t-tc)/(T-tc);
    const recover = dropLnP + 0.05*Math.log(1+frac*5);
    pts.push([t, recover]);
  }

  const ys = pts.map(p=>p[1]);
  const ylo = Math.min(...ys), yhi = Math.max(...ys);
  const pad = (yhi-ylo)*0.08 || 0.05;
  const X = t => (t/T)*w;
  const Y = v => h-14 - ((v-(ylo-pad))/((yhi+pad)-(ylo-pad)))*(h-24);

  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 2;
  ctx.beginPath();
  pts.forEach((p,i)=>{ const x=X(p[0]), y=Y(p[1]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.strokeStyle = getCSS('--crash'); ctx.setLineDash([5,4]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(X(tc),0); ctx.lineTo(X(tc),h-14); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-2);
  ctx.fillText('t = T', w-30, h-2);
  ctx.fillStyle = getCSS('--crash');
  ctx.fillText('predicted t꜀', clamp(X(tc)-30,0,w-70), 12);
}


/* ---------- 16. ISING MARKET MODEL ---------- */

/* --- 2D Ising lattice, periodic boundaries, market-adapted spins --- */
function isingIndex(L,x,y){
  return (((y%L)+L)%L)*L + (((x%L)+L)%L);
}
function isingInitLattice(L, upFraction=0.5){
  const spins = new Int8Array(L*L);
  for(let i=0;i<L*L;i++) spins[i] = Math.random()<upFraction ? 1 : -1;
  return spins;
}
function isingLocalField(spins, L, x, y){
  return spins[isingIndex(L,x+1,y)] + spins[isingIndex(L,x-1,y)] +
         spins[isingIndex(L,x,y+1)] + spins[isingIndex(L,x,y-1)];
}
/* one Metropolis sweep ≈ N single-spin (trader) update attempts */
function isingSweep(spins, L, J, h, T){
  const N = L*L;
  for(let n=0;n<N;n++){
    const x = Math.floor(Math.random()*L), y = Math.floor(Math.random()*L);
    const idx = isingIndex(L,x,y);
    const s = spins[idx];
    const nbSum = isingLocalField(spins, L, x, y);
    const dE = 2*s*(J*nbSum + h);
    if(dE <= 0 || Math.random() < Math.exp(-dE/Math.max(T,1e-6))){
      spins[idx] = -s;
    }
  }
}
function isingMagnetization(spins){
  let sum=0;
  for(let i=0;i<spins.length;i++) sum += spins[i];
  return sum/spins.length;
}
function isingEnergyPerSpin(spins, L, J, h){
  let E=0;
  for(let y=0;y<L;y++){
    for(let x=0;x<L;x++){
      const idx = isingIndex(L,x,y);
      const s = spins[idx];
      // count each bond once (right + down neighbors only)
      const nbSum = spins[isingIndex(L,x+1,y)] + spins[isingIndex(L,x,y+1)];
      E += -J*s*nbSum - h*s;
    }
  }
  return E/(L*L);
}
/* Run a lattice to approximate equilibrium at (J,h,T), returning <M> and <M^2> for susceptibility */
function isingEquilibrate(L, J, h, T, burnIn, measureSweeps){
  const spins = isingInitLattice(L, 0.5);
  for(let s=0;s<burnIn;s++) isingSweep(spins, L, J, h, T);
  let sumM=0, sumM2=0;
  for(let s=0;s<measureSweeps;s++){
    isingSweep(spins, L, J, h, T);
    const m = isingMagnetization(spins);
    sumM += m; sumM2 += m*m;
  }
  return { meanM: sumM/measureSweeps, meanM2: sumM2/measureSweeps, spins };
}

function isingResetSim(){
  const L = +$('#isL').value;
  _isingL = L;
  _isingLattice = isingInitLattice(L, 0.5);
  _isingMagHistory = [isingMagnetization(_isingLattice)];
  _isingPriceHistory = [100];
  _isingSweepCount = 0;
  isingRedrawAll();
}

function isingAdvanceSim(){
  if(!_isingLattice) return isingResetSim();
  const J = +$('#isJ').value;
  const h = +$('#isH').value;
  const T = +$('#isT').value;
  const sweeps = +$('#isSweeps').value;
  const priceScale = 8; // converts ΔM into a return-like price shock

  for(let s=0;s<sweeps;s++){
    isingSweep(_isingLattice, _isingL, J, h, T);
    const m = isingMagnetization(_isingLattice);
    const prevM = _isingMagHistory[_isingMagHistory.length-1];
    _isingMagHistory.push(m);
    const lastPrice = _isingPriceHistory[_isingPriceHistory.length-1];
    _isingPriceHistory.push(lastPrice * Math.exp(priceScale*(m-prevM)/_isingL));
  }
  _isingSweepCount += sweeps;
  isingRedrawAll();
}

function isingRedrawAll(){
  if(!_isingLattice) return;
  const J = +$('#isJ').value, h = +$('#isH').value;
  const m = _isingMagHistory[_isingMagHistory.length-1];
  const E = isingEnergyPerSpin(_isingLattice, _isingL, J, h);

  $('#isSweepCount').textContent = _isingSweepCount;
  $('#isMagnetization').textContent = m.toFixed(3);
  $('#isEnergy').textContent = E.toFixed(3);
  $('#isRegime').textContent = Math.abs(m) > 0.5 ? 'Herd-dominated (ordered)' : 'Balanced (disordered)';

  isingDrawLattice(_isingLattice, _isingL);
  isingDrawTimeSeries(_isingMagHistory, _isingPriceHistory);
}

function isingDrawLattice(spins, L){
  const canvas = $('#isLatticeCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  const size = Math.min(w,h);
  const cell = size/L;
  const offsetX = (w-size)/2;
  const upColor = getCSS('--ion'), downColor = getCSS('--crash');
  for(let y=0;y<L;y++){
    for(let x=0;x<L;x++){
      ctx.fillStyle = spins[isingIndex(L,x,y)]>0 ? upColor : downColor;
      ctx.fillRect(offsetX + x*cell, y*cell, Math.ceil(cell)+0.5, Math.ceil(cell)+0.5);
    }
  }
  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth = 1;
  ctx.strokeRect(offsetX, 0, size, size);
}

function isingDrawTimeSeries(magHistory, priceHistory){
  const canvas = $('#isTimeSeriesCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  const n = magHistory.length;
  const halfH = h/2;
  const X = i => n<=1 ? 0 : (i/(n-1))*w;

  // top half: magnetization in [-1,1]
  const Ym = v => halfH*0.5 - (v/1)*(halfH*0.42);
  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,Ym(0)); ctx.lineTo(w,Ym(0)); ctx.stroke();
  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 1.8;
  ctx.beginPath();
  magHistory.forEach((v,i)=>{ const x=X(i), y=Ym(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  // bottom half: price
  const priceLo = Math.min(...priceHistory), priceHi = Math.max(...priceHistory);
  const pad = (priceHi-priceLo)*0.08 || 1;
  const Yp = v => halfH + halfH*0.5 - ((v-(priceLo-pad))/((priceHi+pad)-(priceLo-pad)))*(halfH*0.84) + halfH*0.42 - halfH*0.42;
  const Yp2 = v => h - 8 - ((v-(priceLo-pad))/((priceHi+pad)-(priceLo-pad)))*(halfH-16);
  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 1.8;
  ctx.beginPath();
  priceHistory.forEach((v,i)=>{ const x=X(i), y=Yp2(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,halfH); ctx.lineTo(w,halfH); ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('M = +1', 4, Ym(1)+3);
  ctx.fillText('M = −1', 4, Ym(-1)+3);
  ctx.fillText('sweep 0', 4, h-4);
  ctx.fillText('sweep '+_isingSweepCount, w-64, h-4);
}

/* ---- temperature sweep: magnetization & susceptibility ---- */
function isingRunTSweep(){
  const canvas = $('#isTSweepCanvas');
  if(!canvas) return;
  const L = +$('#isSweepL').value;
  const J = +$('#isJ').value;
  const numT = 24, burnIn = 60, measureSweeps = 60;
  const Tmin = 0.5, Tmax = 5.0;
  const curve = [];
  for(let i=0;i<numT;i++){
    const T = Tmin + (i/(numT-1))*(Tmax-Tmin);
    const {meanM, meanM2} = isingEquilibrate(L, J, 0, T, burnIn, measureSweeps);
    const chi = (meanM2 - meanM*meanM) * (L*L) / Math.max(T,1e-6);
    curve.push({T, absM: Math.abs(meanM), chi});
  }
  _isingTCurve = curve;
  isingDrawTSweep(curve);
}

function isingDrawTSweep(curve){
  const canvas = $('#isTSweepCanvas');
  if(!canvas || !curve) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const Tmin = curve[0].T, Tmax = curve[curve.length-1].T;
  const X = T => ((T-Tmin)/(Tmax-Tmin))*w;
  const Ym = v => h-16 - v*(h-26); // |M| in [0,1]
  const maxChi = Math.max(...curve.map(c=>c.chi), 1e-6);
  const Yc = v => h-16 - (v/maxChi)*(h-26);

  ctx.strokeStyle = getCSS('--crash'); ctx.setLineDash([5,4]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(X(ISING_TC),0); ctx.lineTo(X(ISING_TC),h-16); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 2.2;
  ctx.beginPath();
  curve.forEach((pt,i)=>{ const x=X(pt.T), y=Ym(pt.absM); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.strokeStyle = getCSS('--crash'); ctx.lineWidth = 2.2;
  ctx.beginPath();
  curve.forEach((pt,i)=>{ const x=X(pt.T), y=Yc(pt.chi); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('T = '+Tmin.toFixed(1), 4, h-4);
  ctx.fillText('T = '+Tmax.toFixed(1), w-40, h-4);
  ctx.fillStyle = getCSS('--crash');
  ctx.fillText('T꜀', clamp(X(ISING_TC)-8,0,w-16), 12);
}




/* ---------- 17. SELF-ORGANIZED CRITICALITY (SANDPILE MODEL) ---------- */

const SOC_THRESHOLD = 4; // standard 2D BTW toppling threshold

function socIndex(L,x,y){ return y*L+x; }

function socInitGrid(L, fillLevel){
  return new Int32Array(L*L).fill(fillLevel);
}

/** Drop one grain at (x,y) and let the resulting cascade fully settle.
 *  Boundary sites are open (grains that topple off the edge are lost —
 *  this dissipation is exactly what lets the pile self-organize instead
 *  of just filling up forever). Returns the avalanche size (# topplings). */
function socDropAndCascade(grid, L, x, y){
  grid[socIndex(L,x,y)]++;
  let size = 0;
  const stack = [[x,y]];
  while(stack.length){
    const [cx,cy] = stack.pop();
    const idx = socIndex(L,cx,cy);
    while(grid[idx] >= SOC_THRESHOLD){
      grid[idx] -= SOC_THRESHOLD;
      size++;
      const nbs = [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
      nbs.forEach(([nx,ny])=>{
        if(nx>=0 && nx<L && ny>=0 && ny<L){
          grid[socIndex(L,nx,ny)]++;
          stack.push([nx,ny]);
        }
        // else: grain falls off the edge — dissipated, not tracked
      });
    }
  }
  return size;
}

function socGridColor(level){
  // 0,1,2,3 are the only stable values once settled (threshold = 4)
  const t = clamp(level/(SOC_THRESHOLD-1), 0, 1);
  if(t < 0.5) return mixColor(getCSS('--panel-2'), getCSS('--ion'), t*2);
  return mixColor(getCSS('--ion'), getCSS('--crash'), (t-0.5)*2);
}

function socResetSim(){
  const L = +$('#socL').value;
  const fill = +$('#socFill').value;
  _socL = L;
  _socGrid = socInitGrid(L, fill);
  _socGrainsDropped = 0;
  _socAvalancheHistory = [];
  _socPriceHistory = [100];
  socRedrawAll();
}

function socDropOnce(redraw){
  if(!_socGrid) return socResetSim();
  const x = Math.floor(Math.random()*_socL);
  const y = Math.floor(Math.random()*_socL);
  const size = socDropAndCascade(_socGrid, _socL, x, y);
  _socGrainsDropped++;
  _socAvalancheHistory.push(size);

  const sign = Math.random()<0.5 ? -1 : 1;
  const lastPrice = _socPriceHistory[_socPriceHistory.length-1];
  const ret = sign * Math.log(1+size) * 0.02; // log-scaled so giant avalanches don't blow up the price axis
  _socPriceHistory.push(lastPrice*Math.exp(ret));

  if(redraw) socRedrawAll();
  return size;
}

function socAutoDrive(){
  if(!_socGrid) socResetSim();
  const n = +$('#socAutoN').value;
  for(let i=0;i<n;i++) socDropOnce(false);
  socRedrawAll();
}

function socRedrawAll(){
  if(!_socGrid) return;
  const sizes = _socAvalancheHistory;
  $('#socGrainCount').textContent = _socGrainsDropped;
  $('#socAvalancheCount').textContent = sizes.length;
  $('#socLargest').textContent = sizes.length ? Math.max(...sizes) : '—';
  $('#socMeanSize').textContent = sizes.length ? mean(sizes).toFixed(2) : '—';

  socDrawGrid(_socGrid, _socL);
  socDrawDist(sizes);
  socDrawTimeSeries(sizes);
  socDrawPrice(_socPriceHistory);
}

function socDrawGrid(grid, L){
  const canvas = $('#socGridCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  const size = Math.min(w,h);
  const cell = size/L;
  const offsetX = (w-size)/2;
  for(let y=0;y<L;y++){
    for(let x=0;x<L;x++){
      ctx.fillStyle = socGridColor(grid[socIndex(L,x,y)]);
      ctx.fillRect(offsetX + x*cell, y*cell, Math.ceil(cell)+0.5, Math.ceil(cell)+0.5);
    }
  }
  ctx.strokeStyle = getCSS('--line'); ctx.lineWidth = 1;
  ctx.strokeRect(offsetX, 0, size, size);
}

function socDrawDist(sizes){
  const canvas = $('#socDistCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);
  $('#socTauFit').textContent = '—';
  if(sizes.length < 5) return;

  // log-binned histogram, same technique as the Scaling Laws module
  const maxSize = Math.max(...sizes);
  const logMax = Math.log10(maxSize+1);
  const bins = Math.min(24, Math.max(6, Math.round(logMax*8)));
  const counts = new Array(bins).fill(0);
  sizes.forEach(s=>{
    const b = clamp(Math.floor((Math.log10(s+1)/logMax)*bins), 0, bins-1);
    counts[b]++;
  });
  const pts = [];
  counts.forEach((c,i)=>{
    if(c<=0) return;
    const x0 = Math.pow(10,(i/bins)*logMax)-1, x1 = Math.pow(10,((i+1)/bins)*logMax)-1;
    const logx = Math.log10(((x0+x1)/2)+1);
    const density = c/sizes.length/Math.max(x1-x0,1);
    if(density>0) pts.push([logx, Math.log10(density)]);
  });
  if(pts.length<2) return;

  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const xlo=Math.min(...xs), xhi=Math.max(...xs), ylo=Math.min(...ys), yhi=Math.max(...ys);
  const X = v => 30 + (v-xlo)/((xhi-xlo)||1)*(w-46);
  const Y = v => h-24 - (v-ylo)/((yhi-ylo)||1)*(h-36);

  ctx.fillStyle = getCSS('--ion');
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),2.6,0,7); ctx.fill(); });

  const mx = mean(pts.map(p=>p[0])), my = mean(pts.map(p=>p[1]));
  let num=0, den=0;
  pts.forEach(p=>{ num += (p[0]-mx)*(p[1]-my); den += (p[0]-mx)**2; });
  const slope = den!==0 ? num/den : 0;
  $('#socTauFit').textContent = (-slope).toFixed(2);

  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(X(xlo), Y(my+slope*(xlo-mx)));
  ctx.lineTo(X(xhi), Y(my+slope*(xhi-mx)));
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font='10px '+getCSS('--mono');
  ctx.fillText('log₁₀(size) →', w-80, h-6);
  ctx.save(); ctx.translate(12,20); ctx.fillText('log₁₀(density)', 0, 0); ctx.restore();
}

function socDrawTimeSeries(sizes){
  const canvas = $('#socTimeCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);
  if(!sizes.length) return;

  const maxSize = Math.max(...sizes);
  const n = sizes.length;
  const barW = Math.max(w/n, 0.6);
  const X = i => (i/n)*w;
  const Y = v => h-16 - (v/maxSize)*(h-24);

  sizes.forEach((s,i)=>{
    const frac = s/maxSize;
    ctx.fillStyle = frac>0.5 ? getCSS('--crash') : getCSS('--ion');
    ctx.globalAlpha = 0.85;
    ctx.fillRect(X(i), Y(s), barW, h-16-Y(s));
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('event 1', 4, h-4);
  ctx.fillText('event '+n, w-52, h-4);
  ctx.fillText('largest = '+maxSize, 4, 12);
}

function socDrawPrice(priceHistory){
  const canvas = $('#socPriceCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  const arr = priceHistory;
  const lo = Math.min(...arr), hi = Math.max(...arr);
  const pad = (hi-lo)*0.08 || 1;
  const X = i => (i/(arr.length-1||1))*w;
  const Y = v => h-10 - ((v-(lo-pad))/((hi+pad)-(lo-pad)))*(h-20);

  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 1.8;
  ctx.beginPath();
  arr.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('event 0', 4, h-4);
  ctx.fillText('event '+(arr.length-1), w-56, h-4);
}

/* z-scores for common one-tailed confidence levels (used by parametric VaR) */
const RISK_Z_SCORES = { '0.90':1.2816, '0.95':1.6449, '0.975':1.9600, '0.99':2.3263, '0.995':2.5758, '0.999':3.0902 };

/** Equicorrelated N-asset factor-model return generator (same technique as
 *  the Correlation Matrix module's simulateFactorReturns, specialized to a
 *  single common factor so every pairwise correlation equals rho exactly). */
function riskSimulateAssetReturns(N, T, muAnnual, volAnnual, rho, dt){
  const mu = muAnnual*dt, vol = volAnnual*Math.sqrt(dt);
  const X = Array.from({length:T}, ()=> new Array(N));
  for(let t=0;t<T;t++){
    const F = gauss(0,1);
    for(let i=0;i<N;i++){
      const idio = gauss(0,1);
      X[t][i] = mu + vol*(Math.sqrt(rho)*F + Math.sqrt(1-rho)*idio);
    }
  }
  return X;
}
function riskPortfolioReturns(assetReturns, weights){
  const T = assetReturns.length, N = weights.length;
  const out = new Float64Array(T);
  for(let t=0;t<T;t++){
    let s=0;
    for(let i=0;i<N;i++) s += assetReturns[t][i]*weights[i];
    out[t] = s;
  }
  return out;
}
function riskEquicorrPortfolioVol(volAnnual, rho, N, dt){
  const volDaily = volAnnual*Math.sqrt(dt);
  return volDaily*Math.sqrt(1/N + ((N-1)/N)*rho);
}
function riskParametricVaR(muDaily, sigmaDaily, z, horizonDays){
  const muH = muDaily*horizonDays;
  const sigmaH = sigmaDaily*Math.sqrt(horizonDays);
  return -(muH - z*sigmaH); // positive number = loss
}
function riskHistoricalVaR(returns, confLevel, horizonDays){
  // aggregate daily returns into non-overlapping horizon-day blocks, then take the empirical quantile
  const blocks = [];
  for(let i=0; i+horizonDays<=returns.length; i+=horizonDays){
    let s=0; for(let k=0;k<horizonDays;k++) s+=returns[i+k];
    blocks.push(s);
  }
  if(blocks.length < 5) return {var: NaN, cvar: NaN, blocks};
  blocks.sort((a,b)=>a-b);
  const idx = clamp(Math.floor((1-confLevel)*blocks.length), 0, blocks.length-1);
  const varLoss = -blocks[idx];
  const tail = blocks.slice(0, Math.max(1, idx+1));
  const cvarLoss = -mean(tail);
  return {var: varLoss, cvar: cvarLoss, blocks};
}
function riskMonteCarloVaR(muDaily, sigmaDaily, confLevel, horizonDays, nSims){
  const muH = muDaily*horizonDays, sigmaH = sigmaDaily*Math.sqrt(horizonDays);
  const sims = new Float64Array(nSims);
  for(let i=0;i<nSims;i++) sims[i] = muH + sigmaH*gauss(0,1);
  const sorted = Array.from(sims).sort((a,b)=>a-b);
  const idx = clamp(Math.floor((1-confLevel)*nSims), 0, nSims-1);
  const varLoss = -sorted[idx];
  const tail = sorted.slice(0, Math.max(1, idx+1));
  const cvarLoss = -mean(tail);
  return {var: varLoss, cvar: cvarLoss, sims: Array.from(sims)};
}
function riskEquityCurve(returns, start=100){
  const T = returns.length;
  const curve = new Float64Array(T+1);
  curve[0] = start;
  for(let t=0;t<T;t++) curve[t+1] = curve[t]*(1+returns[t]);
  return curve;
}
function riskDrawdownSeries(curve){
  const dd = new Float64Array(curve.length);
  let peak = curve[0];
  for(let i=0;i<curve.length;i++){
    if(curve[i]>peak) peak = curve[i];
    dd[i] = (curve[i]-peak)/peak; // <= 0
  }
  return dd;
}
function riskSharpe(returns, rfAnnual, dt){
  const rfDaily = rfAnnual*dt;
  const excess = Array.from(returns).map(r=> r-rfDaily);
  const m = mean(excess), s = std(excess) || 1e-9;
  return (m/s)*Math.sqrt(1/dt);
}
function riskSortino(returns, rfAnnual, dt){
  const rfDaily = rfAnnual*dt;
  const excess = Array.from(returns).map(r=> r-rfDaily);
  const m = mean(excess);
  const downside = excess.filter(r=> r<0);
  const downsideDev = downside.length ? Math.sqrt(mean(downside.map(r=>r*r))) : 1e-9;
  return (m/(downsideDev||1e-9))*Math.sqrt(1/dt);
}
function riskCalmar(returns, dt, maxDD){
  const annReturn = mean(returns)*(1/dt);
  return maxDD>0 ? annReturn/maxDD : NaN;
}

function runRiskSim(){
  const canvas = $('#riskDistCanvas');
  if(!canvas) return;

  const N = +$('#riskN').value;
  const rho = +$('#riskRho').value;
  const muAnnual = +$('#riskMu').value;
  const volAnnual = +$('#riskVol').value;
  const T = +$('#riskT').value;
  const confLevel = +$('#riskConf').value;
  const horizon = +$('#riskHorizon').value;
  const rfAnnual = +$('#riskRf').value;
  const dt = 1/252;
  const z = RISK_Z_SCORES[String(confLevel)] || 1.6449;

  const weights = new Array(N).fill(1/N);
  const assetReturns = riskSimulateAssetReturns(N, T, muAnnual, volAnnual, rho, dt);
  const portReturns = riskPortfolioReturns(assetReturns, weights);
  const portArr = Array.from(portReturns);

  const empVol = std(portArr);
  const theoVol = riskEquicorrPortfolioVol(volAnnual, rho, N, dt);
  const empMu = mean(portArr);
  const diversRatio = (volAnnual*Math.sqrt(dt)) / (empVol||1e-9);

  $('#riskVolEmp').textContent = empVol.toFixed(5);
  $('#riskVolTheo').textContent = theoVol.toFixed(5);
  $('#riskDivRatio').textContent = diversRatio.toFixed(2)+'×';

  const paramRes = { var: riskParametricVaR(empMu, empVol, z, horizon) };
  paramRes.cvar = paramRes.var + empVol*Math.sqrt(horizon)*( (Math.exp(-z*z/2)/Math.sqrt(2*Math.PI)) / (1-confLevel) );
  const histRes = riskHistoricalVaR(portArr, confLevel, horizon);
  const mcRes = riskMonteCarloVaR(empMu, empVol, confLevel, horizon, 50000);

  $('#riskParamVaR').textContent = (paramRes.var*100).toFixed(2)+'%';
  $('#riskParamCVaR').textContent = (paramRes.cvar*100).toFixed(2)+'%';
  $('#riskHistVaR').textContent = isFinite(histRes.var) ? (histRes.var*100).toFixed(2)+'%' : 'n/a (need more data)';
  $('#riskHistCVaR').textContent = isFinite(histRes.cvar) ? (histRes.cvar*100).toFixed(2)+'%' : 'n/a (need more data)';
  $('#riskMCVaR').textContent = (mcRes.var*100).toFixed(2)+'%';
  $('#riskMCCVaR').textContent = (mcRes.cvar*100).toFixed(2)+'%';

  const equityCurve = riskEquityCurve(portArr, 100);
  const ddSeries = riskDrawdownSeries(equityCurve);
  const maxDD = -Math.min(...ddSeries);

  const annReturn = empMu*252;
  const annVol = empVol*Math.sqrt(252);
  const sharpe = riskSharpe(portArr, rfAnnual, dt);
  const sortino = riskSortino(portArr, rfAnnual, dt);
  const calmar = riskCalmar(portArr, dt, maxDD);

  $('#riskAnnReturn').textContent = (annReturn*100).toFixed(2)+'%';
  $('#riskAnnVol').textContent = (annVol*100).toFixed(2)+'%';
  $('#riskSharpe').textContent = sharpe.toFixed(2);
  $('#riskSortino').textContent = sortino.toFixed(2);
  $('#riskMaxDD').textContent = '-'+(maxDD*100).toFixed(2)+'%';
  $('#riskCalmar').textContent = isFinite(calmar) ? calmar.toFixed(2) : '—';

  _riskLastResult = {portArr, paramRes, histRes, mcRes, empMu, empVol, horizon, equityCurve, ddSeries, N, rho, volAnnual, dt, confLevel, z};

  drawRiskDist(portArr, paramRes, histRes, mcRes, horizon);
  drawRiskEquity(equityCurve);
  drawRiskDrawdown(ddSeries);
}

function drawRiskDist(portArr, paramRes, histRes, mcRes, horizon){
  const canvas = $('#riskDistCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  const lo = Math.min(...portArr), hi = Math.max(...portArr);
  const pad = (hi-lo)*0.06 || 1e-4;
  const range = [lo-pad, hi+pad];
  const bins = 50;
  const counts = new Array(bins).fill(0);
  portArr.forEach(x=>{
    const b = clamp(Math.floor((x-range[0])/(range[1]-range[0])*bins), 0, bins-1);
    counts[b]++;
  });
  const maxC = Math.max(...counts,1);
  const barW = w/bins;
  const X = i => (i/bins)*w;
  const Y = c => h-24 - (c/maxC)*(h-34);

  ctx.fillStyle = getCSS('--ion'); ctx.globalAlpha = 0.78;
  counts.forEach((c,i)=>{ ctx.fillRect(X(i)+1, Y(c), barW-2, h-24-Y(c)); });
  ctx.globalAlpha = 1;

  // convert horizon-scaled loss thresholds back to a daily-return x-position for display on this daily histogram
  const toX = (lossHorizon) => {
    const dailyEquiv = -lossHorizon/Math.sqrt(horizon); // rescale by sqrt(h) so it lands sensibly on the daily axis
    const frac = (dailyEquiv-range[0])/(range[1]-range[0]);
    return clamp(frac,0,1)*w;
  };
  function vline(xpix, color, label){
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(xpix,0); ctx.lineTo(xpix,h-24); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.font = '10px '+getCSS('--mono');
    ctx.fillText(label, clamp(xpix-14,0,w-40), 12);
  }
  vline(toX(paramRes.var), getCSS('--specie'), 'P');
  vline(toX(mcRes.var), getCSS('--violet'), 'MC');
  if(isFinite(histRes.var)) vline(toX(histRes.var), getCSS('--crash'), 'H');

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText((range[0]*100).toFixed(2)+'%', 4, h-6);
  ctx.fillText((range[1]*100).toFixed(2)+'%', w-46, h-6);
}

function drawRiskEquity(curve){
  const canvas = $('#riskEquityCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  const arr = Array.from(curve);
  const lo = Math.min(...arr), hi = Math.max(...arr);
  const pad = (hi-lo)*0.06 || 1;
  const X = i => (i/(arr.length-1))*w;
  const Y = v => h-10 - ((v-(lo-pad))/((hi+pad)-(lo-pad)))*(h-20);

  ctx.strokeStyle = getCSS('--ion'); ctx.lineWidth = 1.8;
  ctx.beginPath();
  arr.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-4);
  ctx.fillText('t = T', w-30, h-4);
}

function drawRiskDrawdown(ddSeries){
  const canvas = $('#riskDrawdownCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,44);

  const arr = Array.from(ddSeries);
  const lo = Math.min(...arr, 0);
  const X = i => (i/(arr.length-1))*w;
  const Y = v => 10 + (v/lo||0)*(h-20); // lo is <=0, v<=0, so v/lo in [0,1]

  ctx.fillStyle = getCSS('--crash-dim');
  ctx.beginPath();
  ctx.moveTo(X(0), Y(0));
  arr.forEach((v,i)=>{ ctx.lineTo(X(i), Y(v)); });
  ctx.lineTo(X(arr.length-1), Y(0));
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = getCSS('--crash'); ctx.lineWidth = 1.8;
  ctx.beginPath();
  arr.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
  ctx.fillText('t = 0', 4, h-2);
  ctx.fillText('t = T', w-30, h-2);
  ctx.fillText((lo*100).toFixed(1)+'%', 4, h-12);
}

function runRiskStressTest(){
  if(!_riskLastResult){ runRiskSim(); if(!_riskLastResult) return; }
  const canvas = $('#riskStressCanvas');
  if(!canvas) return;

  const N = +$('#riskN').value;
  const volAnnual = +$('#riskVol').value;
  const confLevel = +$('#riskConf').value;
  const horizon = +$('#riskHorizon').value;
  const dt = 1/252;
  const z = RISK_Z_SCORES[String(confLevel)] || 1.6449;
  const baseRho = +$('#riskRho').value;

  const stressRho = +$('#riskStressRho').value;
  const stressVolMult = +$('#riskStressVolMult').value;

  const baseVol = riskEquicorrPortfolioVol(volAnnual, baseRho, N, dt);
  const stressVol = riskEquicorrPortfolioVol(volAnnual*stressVolMult, stressRho, N, dt);

  const baseVaR = riskParametricVaR(0, baseVol, z, horizon);
  const stressVaR = riskParametricVaR(0, stressVol, z, horizon);

  $('#riskStressBaseVol').textContent = baseVol.toFixed(5);
  $('#riskStressVol').textContent = stressVol.toFixed(5);
  $('#riskStressBaseVaR').textContent = (baseVaR*100).toFixed(2)+'%';
  $('#riskStressVaR').textContent = (stressVaR*100).toFixed(2)+'%';

  drawRiskStressBars(baseVol, stressVol, baseVaR, stressVaR);
}

function drawRiskStressBars(baseVol, stressVol, baseVaR, stressVaR){
  const canvas = $('#riskStressCanvas');
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const pairs = [
    {label:'Portfolio σ', base:baseVol, stress:stressVol},
    {label:'Parametric VaR', base:baseVaR, stress:stressVaR}
  ];
  const maxV = Math.max(...pairs.map(p=>p.stress)) * 1.15 || 1;
  const groupW = w/pairs.length;
  const barW = groupW*0.28;

  pairs.forEach((p,i)=>{
    const cx = i*groupW + groupW/2;
    const baseH = (p.base/maxV)*(h-30);
    const stressH = (p.stress/maxV)*(h-30);
    ctx.fillStyle = getCSS('--ion'); ctx.globalAlpha = 0.85;
    ctx.fillRect(cx-barW-4, h-20-baseH, barW, baseH);
    ctx.fillStyle = getCSS('--crash');
    ctx.fillRect(cx+4, h-20-stressH, barW, stressH);
    ctx.globalAlpha = 1;
    ctx.fillStyle = getCSS('--muted'); ctx.font = '10px '+getCSS('--mono');
    ctx.fillText(p.label, cx-34, h-6);
  });

  ctx.fillStyle = getCSS('--ion'); ctx.fillText('■ baseline', 6, 12);
  ctx.fillStyle = getCSS('--crash'); ctx.fillText('■ stressed', 90, 12);
}

/** Creates a TradingView widget inside the container with the given id.
 *  TradingView's embed scripts read their own <script> tag's text content
 *  as JSON config, so when injecting dynamically (innerHTML doesn't execute
 *  <script> tags) we build the script element with document.createElement
 *  and set its .text manually — the standard pattern for embedding
 *  TradingView widgets into a page rendered by JavaScript. */
function tvEmbed(containerId, scriptSrc, config){
  const el = document.getElementById(containerId);
  if(!el) return;

  el.innerHTML = '';

  // Outer container
  el.className = 'tradingview-widget-container';
  el.style.width = '100%';

  // Preserve HTML height (680px, 900px, etc.)
  if(!el.style.height){
    el.style.height = '600px';
  }

  // Inner widget
  const widgetDiv = document.createElement('div');
  widgetDiv.className = 'tradingview-widget-container__widget';
  widgetDiv.style.width = '100%';
  widgetDiv.style.height = '100%';
  el.appendChild(widgetDiv);

  const script = document.createElement('script');
  script.type = 'text/javascript';
  script.src = scriptSrc;
  script.async = true;
  script.text = JSON.stringify(config);
  el.appendChild(script);
}

}

function eqRenderCards(){
  const grid = $('#eqCardsGrid');
  if(!grid) return;
  const query = ($('#eqSearch') ? $('#eqSearch').value : '').toLowerCase().trim();
  const category = $('#eqCategory') ? $('#eqCategory').value : 'all';

  const filtered = EQUATION_DATABASE.filter(e=>{
    if(category!=='all' && e.cat!==category) return false;
    if(!query) return true;
    return (e.title+' '+e.src+' '+e.desc+' '+e.cat).toLowerCase().includes(query);
  });

  $('#eqShowingCount').textContent = filtered.length;
  $('#eqEmptyState').style.display = filtered.length===0 ? 'block' : 'none';

  const grouped = {};
  filtered.forEach(e=>{ (grouped[e.cat] = grouped[e.cat]||[]).push(e); });

  grid.innerHTML = Object.keys(grouped).map(cat=>`
    <h2>${cat}</h2>
    <div class="grid-2">
      ${grouped[cat].map(e=>`
        <div class="panel" style="margin-bottom:0;">
          <div class="panel-title"><h3 style="font-size:14.5px;">${e.title}</h3><span class="tag gold">${e.src}</span></div>
          <div class="eqn" style="margin:0 0 10px;">\\[${e.tex}\\]</div>
          <p style="margin-bottom:10px;">${e.desc}</p>
          <div style="padding-top:10px; border-top:1px dashed var(--line);">
            <div style="font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted-2); margin-bottom:6px;">Parameters</div>
            ${e.params.map(p=>`<div style="font-size:12px; color:var(--muted); margin-bottom:4px; line-height:1.5;">${p}</div>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');

  // MathJax only — this section intentionally bypasses the app-wide KaTeX pass.
  eqTypeset(grid);
}

function exRandRange(lo,hi,decimals){ const v = lo+Math.random()*(hi-lo); const f=Math.pow(10,decimals); return Math.round(v*f)/f; }

const EX_PROBLEM_DEFS = [
  { id:'logreturn', title:'Log Return',
    gen: ()=>{
      const P0 = exRandRange(80,180,2), P1 = exRandRange(80,180,2);
      return {P0,P1, answer: Math.log(P1/P0)};
    },
    prompt: p => `A stock moves from P₀ = ${p.P0.toFixed(2)} to P₁ = ${p.P1.toFixed(2)} over one period. Compute the log return r = ln(P₁/P₀).`,
    unit: '', tol: 0.001,
    solution: p => `r = ln(${p.P1.toFixed(2)} / ${p.P0.toFixed(2)}) = ln(${(p.P1/p.P0).toFixed(4)}) = ${p.answer.toFixed(4)}`
  },
  { id:'gini', title:'Gini Coefficient (5 Agents)',
    gen: ()=>{
      const w = Array.from({length:5}, ()=> Math.round(exRandRange(10,100,0))).sort((a,b)=>a-b);
      return { w, answer: computeGini(w) };
    },
    prompt: p => `Five agents hold wealth (sorted ascending): [${p.w.join(', ')}]. Compute the Gini coefficient using G = 2·Σ(i·wᵢ)/(n·Σwᵢ) − (n+1)/n.`,
    unit: '', tol: 0.01,
    solution: p => `Using the sorted-wealth formula on [${p.w.join(', ')}] gives G = ${p.answer.toFixed(3)}.`
  },
  { id:'varparam', title:'Parametric VaR',
    gen: ()=>{
      const mu = exRandRange(0,0.0005,5), sigma = exRandRange(0.01,0.03,4), z = 1.6449, horizon = Math.round(exRandRange(1,20,0));
      const answer = -(mu*horizon - z*sigma*Math.sqrt(horizon));
      return {mu, sigma, z, horizon, answer};
    },
    prompt: p => `Daily mean return μ = ${p.mu.toFixed(5)}, daily σ = ${p.sigma.toFixed(4)}, horizon h = ${p.horizon} days, 95% confidence (z = 1.6449). Compute parametric VaR = −(μh − zσ√h) as a decimal (e.g. 0.05 for 5%).`,
    unit: '', tol: 0.005,
    solution: p => `VaR = −(${p.mu.toFixed(5)}×${p.horizon} − 1.6449×${p.sigma.toFixed(4)}×√${p.horizon}) = ${p.answer.toFixed(4)}`
  },
  { id:'sharpe', title:'Sharpe Ratio',
    gen: ()=>{
      const meanExcess = exRandRange(0.0002,0.0012,5), sigma = exRandRange(0.008,0.025,4);
      const answer = (meanExcess/sigma)*Math.sqrt(252);
      return {meanExcess, sigma, answer};
    },
    prompt: p => `Daily mean excess return (r − r_f) = ${p.meanExcess.toFixed(5)}, daily σ = ${p.sigma.toFixed(4)}. Compute the annualized Sharpe ratio = (mean/σ)·√252.`,
    unit: '', tol: 0.1,
    solution: p => `Sharpe = (${p.meanExcess.toFixed(5)} / ${p.sigma.toFixed(4)}) × √252 = ${p.answer.toFixed(2)}`
  },
];

let _exSlopeData = null;   // {samples, trueAlpha}
let _exSlopeChecked = false;

function exGenerateSlopeChallenge(){
  const trueAlpha = exRandRange(1.3, 3.5, 2);
  const xmin = 1;
  const N = 1500;
  const samples = Array.from({length:N}, ()=>{
    const u = Math.random();
    return xmin * Math.pow(1-u, -1/(trueAlpha-1));
  });
  _exSlopeData = {samples, trueAlpha, xmin};
  _exSlopeChecked = false;
}

  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---- Part C: slope-fitting mini-game ---- */
function exResetSlopeStats(){
  $('#exSlopeYourGuess').textContent = '—';
  $('#exSlopeTrue').textContent = '—';
  $('#exSlopeError').textContent = '—';
}
function exRevealSlope(){
  if(!_exSlopeData) return;
  _exSlopeChecked = true;
  const guess = +$('#exSlopeGuess').value;
  const trueAlpha = _exSlopeData.trueAlpha;
  const err = Math.abs(guess - trueAlpha);

  $('#exSlopeYourGuess').textContent = guess.toFixed(2);
  $('#exSlopeTrue').textContent = trueAlpha.toFixed(2);
  $('#exSlopeError').textContent = err.toFixed(2) + (err<0.15 ? '  (excellent!)' : err<0.4 ? '  (close)' : '  (try again)');

  exDrawSlopeChallenge(true);
}
function exDrawSlopeChallenge(revealTrue){
  const canvas = $('#exSlopeCanvas');
  if(!canvas || !_exSlopeData) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,40);

  const {samples, xmin, trueAlpha} = _exSlopeData;
  const sorted = [...samples].sort((a,b)=>a-b);
  const N = sorted.length;
  const stride = Math.max(1, Math.floor(N/1200));
  const pts = [];
  for(let i=N-1; i>=0; i-=stride){
    const rank = N-i;
    const survival = rank/N;
    if(sorted[i]>0 && survival>0) pts.push([Math.log10(sorted[i]), Math.log10(survival)]);
  }
  if(pts.length<2) return;

  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const xlo=Math.min(...xs), xhi=Math.max(...xs), ylo=Math.min(...ys), yhi=Math.max(...ys);
  const X = v => 30 + (v-xlo)/((xhi-xlo)||1)*(w-46);
  const Y = v => h-24 - (v-ylo)/((yhi-ylo)||1)*(h-36);

  ctx.fillStyle = getCSS('--ion');
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),1.8,0,7); ctx.fill(); });

  // user's guess line: log10(S) = alpha*log10(xmin) - alpha*log10(x)
  const guessAlpha = +$('#exSlopeGuess').value;
  const guessY = lx => guessAlpha*Math.log10(xmin) - guessAlpha*lx;
  ctx.strokeStyle = getCSS('--specie'); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(X(xlo), Y(clamp(guessY(xlo), ylo, yhi)));
  ctx.lineTo(X(xhi), Y(clamp(guessY(xhi), ylo, yhi)));
  ctx.stroke();

  if(revealTrue){
    const trueY = lx => trueAlpha*Math.log10(xmin) - trueAlpha*lx;
    ctx.strokeStyle = getCSS('--crash'); ctx.lineWidth = 2; ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.moveTo(X(xlo), Y(clamp(trueY(xlo), ylo, yhi)));
    ctx.lineTo(X(xhi), Y(clamp(trueY(xhi), ylo, yhi)));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle = getCSS('--muted'); ctx.font='10px '+getCSS('--mono');
  ctx.fillText('log₁₀(x) →', w-70, h-6);
  ctx.save(); ctx.translate(12,20); ctx.fillText('log₁₀ P(X>x)', 0, 0); ctx.restore();
  ctx.fillStyle = getCSS('--specie'); ctx.fillText('■ your fit', 4, 12);
  if(revealTrue){ ctx.fillStyle = getCSS('--crash'); ctx.fillText('- - true α', 80, 12); }
}

function csRenderTimeline(sec, minYear, maxYear){
  const wrap = $('#csTimelineWrap', sec);
  const span = (maxYear - minYear) || 1;
  wrap.innerHTML = CASE_STUDIES.map(c=>{
    const frac = (c.year - minYear) / span;
    const left = 3 + frac*94; // percent, padded
    const color = csMechColor(c.mechanism);
    return `
      <div class="cs-node" data-id="${c.id}" title="${c.yearLabel} — ${c.title}"
           style="position:absolute; left:${left}%; top:50%; transform:translate(-50%,-50%); width:14px; height:14px;
                  border-radius:50%; background:${color}; border:2px solid var(--bg-alt); cursor:pointer; z-index:2;
                  box-shadow:0 0 0 1px var(--line);">
      </div>
      <div style="position:absolute; left:${left}%; top:calc(50% + 12px); transform:translateX(-50%); font-family:var(--mono); font-size:9.5px; color:var(--muted); white-space:nowrap;">
        ${c.year}
      </div>`;
  }).join('');

  $$('.cs-node', wrap).forEach(node=>{
    node.addEventListener('click', ()=> csFocusCase(node.dataset.id));
    node.addEventListener('mouseenter', ()=>{ node.style.transform='translate(-50%,-50%) scale(1.35)'; });
    node.addEventListener('mouseleave', ()=>{ node.style.transform='translate(-50%,-50%) scale(1)'; });
  });
}

function csRenderDecadeMarks(sec, minYear, maxYear, decades){
  const wrap = $('#csTimelineDecades', sec);
  const span = (maxYear - minYear) || 1;
  wrap.innerHTML = decades.map(d=>{
    const frac = (d - minYear) / span;
    const left = clamp(3 + frac*94, 0, 100);
    return `<div style="position:absolute; left:${left}%; transform:translateX(-50%); font-family:var(--mono); font-size:9px; color:var(--muted-2);">${d}s</div>`;
  }).join('');
}

function csRenderLegend(sec){
  const legend = $('#csMechLegend', sec);
  legend.innerHTML = Object.keys(CS_MECHANISMS).map(k=>
    `<span><i style="background:${csMechColor(k)}"></i>${CS_MECHANISMS[k].label}</span>`
  ).join('');
}

function csRenderCards(sec){
  const grid = $('#csCardsGrid', sec);
  grid.innerHTML = CASE_STUDIES.map(c=>{
    const color = csMechColor(c.mechanism);
    return `
    <div class="panel cs-card" id="cs-card-${c.id}" data-mechanism="${c.mechanism}" style="transition: box-shadow .3s ease, border-color .3s ease;">
      <div class="panel-title">
        <h3>${c.title}</h3>
        <span class="tag" style="color:${color}; background:${color}22;">${c.yearLabel}</span>
      </div>
      <p style="margin-bottom:10px;"><b>Mechanism:</b> ${CS_MECHANISMS[c.mechanism].label}</p>
      <div class="stat-row" style="margin-bottom:12px;">
        <div class="stat"><span class="k">Peak-to-Trough</span><span class="v red">-${c.declinePct}%</span></div>
        <div class="stat"><span class="k">Duration</span><span class="v ion">${c.durationLabel}</span></div>
        <div class="stat"><span class="k">Recovery</span><span class="v gold">${c.recoveryLabel}</span></div>
      </div>
      <p style="margin-bottom:8px;"><b>Trigger:</b> ${c.trigger}</p>
      <p style="margin-bottom:8px;">${c.description}</p>
      <p style="margin-bottom:0; font-size:12px; color:var(--muted-2);"><b>Econophysics lens:</b> ${c.lens.join(' · ')}</p>
    </div>`;
  }).join('');
}

function csApplyFilter(sec){
  $$('.cs-card', sec || document).forEach(card=>{
    const show = _csActiveFilter==='all' || card.dataset.mechanism === _csActiveFilter;
    card.style.display = show ? '' : 'none';
  });
}

function csFocusCase(id){
  const el = document.getElementById('cs-card-'+id);
  if(!el) return;
  // if currently filtered out, reset filter so the card is visible
  if(el.style.display === 'none'){
    _csActiveFilter = 'all';
    const filterSel = $('#csMechFilter');
    if(filterSel) filterSel.value = 'all';
    csApplyFilter();
  }
  el.scrollIntoView({behavior:'smooth', block:'center'});
  const originalBorder = el.style.borderColor;
  el.style.borderColor = 'var(--ion)';
  el.style.boxShadow = '0 0 0 1px var(--ion)';
  setTimeout(()=>{ el.style.borderColor = originalBorder; el.style.boxShadow = 'none'; }, 1400);
}

function csDrawCompareChart(){
  const canvas = $('#csCompareCanvas');
  if(!canvas) return;
  const metric = $('#csChartMetric') ? $('#csChartMetric').value : 'decline';
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);

  const rowH = h / CASE_STUDIES.length;
  const labelW = 150;
  const chartW = w - labelW - 60;

  let values, maxVal, formatVal;
  if(metric==='decline'){
    values = CASE_STUDIES.map(c=>c.declinePct);
    maxVal = Math.max(...values) * 1.08;
    formatVal = v => '-'+v.toFixed(0)+'%';
  } else {
    values = CASE_STUDIES.map(c=> Math.log10(c.durationDays+1));
    maxVal = Math.max(...values) * 1.08;
    formatVal = (v,i) => {
      const d = CASE_STUDIES[i].durationDays;
      return d < 1 ? (d*24*60).toFixed(0)+' min' : d < 2 ? d.toFixed(1)+' day' : Math.round(d)+' days';
    };
  }

  CASE_STUDIES.forEach((c,i)=>{
    const y = i*rowH;
    const barLen = (values[i]/maxVal) * chartW;
    const color = csMechColor(c.mechanism);

    ctx.fillStyle = getCSS('--muted');
    ctx.font = '10.5px '+getCSS('--mono');
    ctx.textBaseline = 'middle';
    ctx.fillText(c.yearLabel.split(' ')[0]+' '+c.title.slice(0,16)+(c.title.length>16?'…':''), 2, y+rowH/2);

    ctx.fillStyle = color;
    ctx.globalAlpha = 0.85;
    const barH = Math.max(rowH*0.55, 6);
    ctx.fillRect(labelW, y+(rowH-barH)/2, Math.max(barLen,2), barH);
    ctx.globalAlpha = 1;

    ctx.fillStyle = getCSS('--text');
    ctx.font = '10px '+getCSS('--mono');
    const label = metric==='decline' ? formatVal(values[i]) : formatVal(values[i], i);
    ctx.fillText(label, labelW + Math.max(barLen,2) + 6, y+rowH/2);
  });
  ctx.textBaseline = 'alphabetic';
}

  { term:'Feedback Loop', cat:'Foundations', module:'Complexity & Emergence',

/* ---- tooltip demo: a short paragraph with several glossary terms hoverable ---- */
const GL_DEMO_TERM_NAMES = [
  'Volatility Clustering', 'Fat Tails', 'Herding', 'Percolation', 'Gini Coefficient',
  'Power Law', 'Systemic Risk', 'Central Limit Theorem (CLT)'
];
function glBuildTooltipDemo(sec){
  const findTerm = name => GLOSSARY_TERMS.find(t=>t.term===name);
  const sentence = `When ${glTag('Herding')} takes hold, individually independent traders start acting as one, which is precisely the ingredient that turns ordinary noise into a ${glTag('Percolation')}-style cascade. The resulting price series shows textbook ${glTag('Volatility Clustering')} and ${glTag('Fat Tails')} rather than the smooth bell curve the ${glTag('Central Limit Theorem (CLT)')} would otherwise predict, and — if the cascade reaches far enough through a network of institutions — real ${glTag('Systemic Risk')}. None of this requires any single agent to behave irrationally; it emerges the same way a ${glTag('Power Law')} in the ${glTag('Gini Coefficient')} of a wealth distribution emerges from purely local, random trading rules.`;

  function glTag(name){
    return `<span class="gl-hover-term" data-term="${name}" style="border-bottom:1px dotted var(--ion); color:var(--ion); cursor:help; font-weight:500;">${name}</span>`;
  }
  $('#glDemoParagraph', sec).innerHTML = sentence;

  // one shared floating tooltip element, positioned on hover
  let tipEl = document.getElementById('glFloatingTip');
  if(!tipEl){
    tipEl = document.createElement('div');
    tipEl.id = 'glFloatingTip';
    tipEl.style.cssText = `
      position:fixed; z-index:999; max-width:280px; padding:10px 12px; border-radius:8px;
      background:var(--panel); border:1px solid var(--ion); color:var(--text); font-size:12.5px;
      line-height:1.5; pointer-events:none; opacity:0; transition:opacity .12s ease; box-shadow:0 8px 24px rgba(0,0,0,.35);
    `;
    document.body.appendChild(tipEl);
  }

  $$('.gl-hover-term', sec).forEach(el=>{
    el.addEventListener('mouseenter', (e)=>{
      const t = findTerm(el.dataset.term);
      if(!t) return;
      tipEl.innerHTML = `<b style="color:var(--ion);">${t.term}</b><br>${t.def}<br><span style="color:var(--muted-2); font-family:var(--mono); font-size:10.5px;">→ ${t.module}</span>`;
      tipEl.style.opacity = '1';
      glPositionTip(e, tipEl);
    });
    el.addEventListener('mousemove', (e)=> glPositionTip(e, tipEl));
    el.addEventListener('mouseleave', ()=>{ tipEl.style.opacity = '0'; });
  });
}
function glPositionTip(e, tipEl){
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const rectW = 280, rectH = 100;
  if(x + rectW > window.innerWidth) x = e.clientX - rectW - pad;
  if(y + rectH > window.innerHeight) y = e.clientY - rectH - pad;
  tipEl.style.left = x+'px';
  tipEl.style.top = y+'px';
}

/* ---- main glossary list render ---- */
function glRenderTerms(){
  const grid = $('#glTermsGrid');
  if(!grid) return;
  const query = ($('#glSearch') ? $('#glSearch').value : '').toLowerCase().trim();
  const category = $('#glCategory') ? $('#glCategory').value : 'all';

  const filtered = GLOSSARY_TERMS.filter(t=>{
    if(category!=='all' && t.cat!==category) return false;
    if(_glActiveLetter!=='all' && t.term[0].toUpperCase()!==_glActiveLetter) return false;
    if(!query) return true;
    return (t.term+' '+t.def+' '+t.cat+' '+t.module).toLowerCase().includes(query);
  }).sort((a,b)=> a.term.localeCompare(b.term));

  $('#glShowingCount').textContent = filtered.length;
  $('#glEmptyState').style.display = filtered.length===0 ? 'block' : 'none';

  // group alphabetically
  const grouped = {};
  filtered.forEach(t=>{
    const letter = t.term[0].toUpperCase();
    if(!grouped[letter]) grouped[letter] = [];
    grouped[letter].push(t);
  });

  grid.innerHTML = Object.keys(grouped).sort().map(letter=>`
    <h2>${letter}</h2>
    <div class="grid-2">
      ${grouped[letter].map(t=>`
        <div class="panel" style="margin-bottom:0;">
          <div class="panel-title"><h3 style="font-size:14.5px;">${t.term}</h3><span class="tag gold">${t.module}</span></div>
          <p style="margin-bottom:6px;">${t.def}</p>
          <p style="margin-bottom:0; font-size:11px; color:var(--muted-2); font-family:var(--mono);">${t.cat}</p>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function dbScoreVolatility(sigmaRatio){ return clamp((sigmaRatio-0.5)/2.5, 0, 1) * 100; } // sigma_t / sigma_LR
function dbScoreGini(gini){ return clamp(gini/0.75, 0, 1) * 100; }
function dbScoreNetwork(largestFrac){ return clamp(largestFrac, 0, 1) * 100; }
function dbScoreCorrelation(signalFrac){ return clamp(signalFrac/0.3, 0, 1) * 100; } // >30% signal eigenvalues = max
function dbScoreCrashCluster(frac){ return clamp(frac, 0, 1) * 100; }
function dbScoreTail(alpha){ return clamp((3.2-alpha)/2.2, 0, 1) * 100; } // lower alpha = heavier tail = riskier

function dbRiskLabel(score){
  if(score < 25) return {label:'Calm', color:'--ion'};
  if(score < 50) return {label:'Elevated', color:'--specie'};
  if(score < 75) return {label:'Stressed', color:'--specie'};
  return {label:'Critical', color:'--crash'};
}
