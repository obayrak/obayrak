      <div style="font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); margin-bottom:8px;">${g}</div>
      <div style="display:flex; flex-wrap:wrap; gap:7px;">
        ${groups[g].map(s=>`
          <button class="db-module-chip" data-target="${s.id}"
            style="all:unset; cursor:pointer; font-family:var(--body); font-size:12.5px; padding:7px 12px;
                   border-radius:20px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); transition:.15s;">
            ${s.title}${s.id==='dashboard' ? ' (you are here)' : ''}
          </button>`).join('')}
      </div>
    </div>
  `).join('');
  $$('.db-module-chip', grid).forEach(chip=>{
    chip.addEventListener('mouseenter', ()=>{ chip.style.borderColor='var(--ion)'; chip.style.color='var(--ion)'; });
    chip.addEventListener('mouseleave', ()=>{ chip.style.borderColor='var(--line)'; chip.style.color='var(--text)'; });
    chip.addEventListener('click', ()=> showSection(chip.dataset.target));
  });
}

/* ---- run all six mini-simulations and score the composite index ---- */
function dbRunFullSnapshot(){
  // 1. Volatility: short GARCH(1,1) run
  const sigmaLR = 0.015, alpha = 0.10, beta = 0.85, T = 200;
  const omega = sigmaLR*sigmaLR*(1-alpha-beta);
  const sigmas = new Float64Array(T);
  let sigma2 = sigmaLR*sigmaLR;
  for(let t=0;t<T;t++){
    sigmas[t] = Math.sqrt(sigma2);
    const r = sigmas[t]*gauss(0,1);
    sigma2 = omega + alpha*r*r + beta*sigma2;
  }
  const sigmaRatio = sigmas[T-1]/sigmaLR;

  // 2. Wealth exchange: 200 agents, 30 sweeps, lambda=0.3
  const NW = 200, lambda = 0.3, sweeps = 30;
  const wealth = new Float64Array(NW).fill(1);
  for(let s=0;s<sweeps;s++){
    for(let k=0;k<NW;k++){
      const i = Math.floor(Math.random()*NW);
      let j = Math.floor(Math.random()*NW);
      if(j===i) j=(j+1)%NW;
      const eps = Math.random();
      const pool = wealth[i]+wealth[j];
      wealth[i] = lambda*wealth[i] + eps*(1-lambda)*pool;
      wealth[j] = lambda*wealth[j] + (1-eps)*(1-lambda)*pool;
    }
  }
  const gini = computeGini(Array.from(wealth));

  // 3. Network: random graph, N=40, p=0.05
  const NN = 40, pConn = 0.05;
  const netGraph = genRandomGraph(NN, pConn);
  const largestNet = giantComponentSize(NN, netGraph.edges, new Set()) / NN;

  // 4. Correlation matrix: factor model, N=20, T=150
  const NC = 20, TC = 150, numSectors = 3;
  const sectorOf = Array.from({length:NC}, (_,i)=> i % numSectors);
  const Xc = simulateFactorReturns(NC, TC, 1.0, 0.6, sectorOf, numSectors);
  const Cc = correlationMatrix(Xc, TC, NC);
  const {values} = jacobiEigenvalues(Cc, NC);
  const Qc = TC/NC;
  const mpHiC = Math.pow(1+Math.sqrt(1/Qc), 2);
  const signalFrac = values.filter(v=> v>mpHiC).length / NC;

  // 5. Crash-cluster (Cont-Bouchaud percolation), N=300, k=1.2
  const NCr = 300, kAvg = 1.2;
  const numEdges = Math.round(kAvg*NCr/2);
  const parent = new Int32Array(NCr); for(let i=0;i<NCr;i++) parent[i]=i;
  const rank = new Uint8Array(NCr);
  for(let e=0;e<numEdges;e++){
    const i = Math.floor(Math.random()*NCr);
    let j = Math.floor(Math.random()*NCr);
    if(j===i) j=(j+1)%NCr;
    crUFUnion(parent, rank, i, j);
  }
  const clusterSizes = new Map();
  for(let i=0;i<NCr;i++){ const r=crUFFind(parent,i); clusterSizes.set(r,(clusterSizes.get(r)||0)+1); }
  let largestCrash = 0; clusterSizes.forEach(s=>{ if(s>largestCrash) largestCrash=s; });
  const crashFrac = largestCrash/NCr;

  // 6. Tail heaviness: Pareto sample + Hill estimator
  const trueAlpha = exRandRangeSafe(1.2, 3.0);
  const xm = 1, NP = 3000;
  const paretoArr = Array.from({length:NP}, ()=>{ const u=Math.random(); return xm/Math.pow(u,1/trueAlpha); });
  let sumLog = 0; paretoArr.forEach(x=> sumLog += Math.log(x/xm));
  const hillAlpha = NP/sumLog;

  const scores = {
    vol: dbScoreVolatility(sigmaRatio),
    gini: dbScoreGini(gini),
    net: dbScoreNetwork(largestNet),
    corr: dbScoreCorrelation(signalFrac),
    crash: dbScoreCrashCluster(crashFrac),
    tail: dbScoreTail(hillAlpha),
  };
  const composite = mean(Object.values(scores));

  _dbSnapshotData = {
    sigmas, sigmaLR, sigmaRatio,
    wealth: Array.from(wealth), gini,
    netGraph, largestNet, NN,
    corrMatrix: Cc, sectorOf: sectorOf, eigenvalues: values, mpHiC, signalFrac, NC,
    clusterSizes: Array.from(clusterSizes.values()), crashFrac,
    paretoArr, hillAlpha, trueAlpha,
    scores, composite,
    timestamp: new Date().toLocaleTimeString()
  };

  dbDrawAllPanels();
}
/* fallback local RNG helper in case exRandRange isn't in scope for this section */
function exRandRangeSafe(lo,hi){ return lo + Math.random()*(hi-lo); }

function dbDrawAllPanels(){
  const d = _dbSnapshotData;
  if(!d) return;

  $('#dbSnapshotCount').textContent = d.timestamp;
  $('#dbVolValue').textContent = d.sigmaRatio.toFixed(2)+'×';
  $('#dbWealthValue').textContent = d.gini.toFixed(3);
  $('#dbNetworkValue').textContent = (d.largestNet*100).toFixed(1)+'%';
  $('#dbCorrValue').textContent = (d.signalFrac*100).toFixed(1)+'%';
  $('#dbCrashValue').textContent = (d.crashFrac*100).toFixed(1)+'%';
  $('#dbTailValue').textContent = d.hillAlpha.toFixed(2);

  const risk = dbRiskLabel(d.composite);
  $('#dbRegimeLabel').textContent = risk.label + ' (' + d.composite.toFixed(0) + ' / 100)';
  $('#dbRegimeLabel').style.color = getCSS(risk.color);

  dbDrawGauge($('#dbGaugeCanvas'), d.composite);
  dbDrawSparkline($('#dbVolCanvas'), Array.from(d.sigmas), getCSS('--ion'), d.sigmaLR);
  dbDrawWealthMini($('#dbWealthCanvas'), d.wealth);
  dbDrawNetworkMini($('#dbNetworkCanvas'), d.NN, d.netGraph.edges);
  dbDrawCorrMini($('#dbCorrCanvas'), d.corrMatrix, d.NC, d.sectorOf);
  dbDrawClusterMini($('#dbCrashCanvas'), d.clusterSizes);
  dbDrawTailMini($('#dbTailCanvas'), d.paretoArr, d.hillAlpha);
}

/* ---- composite gauge: semi-circular dial ---- */
function dbDrawGauge(canvas, score){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  const cx = w/2, cy = h*0.88, r = Math.min(w*0.40, h*0.78);

  ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.strokeStyle = getCSS('--line');
  ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,2*Math.PI,false); ctx.stroke();

  const frac = clamp(score/100,0,1);
  const risk = dbRiskLabel(score);
  ctx.strokeStyle = getCSS(risk.color);
  ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,Math.PI+Math.PI*frac,false); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = getCSS('--text');
  ctx.font = "32px 'Space Grotesk', sans-serif";
  ctx.fillText(score.toFixed(0), cx, cy-14);
  ctx.font = "10px 'JetBrains Mono', monospace";
  ctx.fillStyle = getCSS('--muted');
  ctx.fillText('/ 100', cx, cy+4);
  ctx.textAlign = 'left';

  ctx.fillStyle = getCSS('--muted-2'); ctx.font = "10px 'JetBrains Mono', monospace";
  ctx.fillText('0 · Calm', cx-r-8, cy+16);
  ctx.textAlign='right'; ctx.fillText('100 · Critical', cx+r+8, cy+16); ctx.textAlign='left';
}

/* ---- six mini-panel drawers ---- */
function dbDrawSparkline(canvas, arr, color, refLine){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,30);
  const maxV = Math.max(...arr, refLine||0)*1.1;
  const X = i => (i/(arr.length-1))*w;
  const Y = v => h-6 - (v/maxV)*(h-12);
  if(refLine){
    ctx.strokeStyle = getCSS('--muted-2'); ctx.setLineDash([4,3]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,Y(refLine)); ctx.lineTo(w,Y(refLine)); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.strokeStyle = color; ctx.lineWidth = 1.8;
  ctx.beginPath();
  arr.forEach((v,i)=>{ const x=X(i), y=Y(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();
}
function dbDrawWealthMini(canvas, wealth){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,30);
  const hi = Math.max(...wealth,1e-6)*1.05;
  const bins = 24;
  const counts = new Array(bins).fill(0);
  wealth.forEach(x=>{ const b=clamp(Math.floor((x/hi)*bins),0,bins-1); counts[b]++; });
  const maxC = Math.max(...counts,1);
  const barW = w/bins;
  ctx.fillStyle = getCSS('--specie'); ctx.globalAlpha=0.8;
  counts.forEach((c,i)=>{ const bh=(c/maxC)*(h-14); ctx.fillRect(i*barW+1, h-10-bh, barW-2, bh); });
  ctx.globalAlpha=1;
}
function dbDrawNetworkMini(canvas, N, edges){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  const positions = forceDirectedLayout(N, edges, w, h, 100);
  ctx.strokeStyle = getCSS('--crash'); ctx.globalAlpha=0.18; ctx.lineWidth=1;
  edges.forEach(([i,j])=>{ ctx.beginPath(); ctx.moveTo(positions[i].x,positions[i].y); ctx.lineTo(positions[j].x,positions[j].y); ctx.stroke(); });
  ctx.globalAlpha=1;
  ctx.fillStyle = getCSS('--crash');
  positions.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,7); ctx.fill(); });
}
function dbDrawCorrMini(canvas, C, N, sectorOf){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  const size = Math.min(w,h);
  const cell = size/N, offsetX = (w-size)/2;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    ctx.fillStyle = corrColor(C[i][j]);
    ctx.fillRect(offsetX+j*cell, i*cell, Math.ceil(cell)+0.5, Math.ceil(cell)+0.5);
  }
}
function dbDrawClusterMini(canvas, sizes){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,30);
  const sorted = [...sizes].sort((a,b)=>b-a).slice(0,20);
  const maxS = Math.max(...sorted,1);
  const barW = w/sorted.length;
  ctx.fillStyle = getCSS('--gold') || getCSS('--specie'); ctx.globalAlpha=0.85;
  sorted.forEach((s,i)=>{ const bh=(s/maxS)*(h-14); ctx.fillStyle = i===0?getCSS('--crash'):getCSS('--specie'); ctx.fillRect(i*barW+1,h-10-bh,barW-2,bh); });
  ctx.globalAlpha=1;
}
function dbDrawTailMini(canvas, samples, hillAlpha){
  if(!canvas) return;
  const {ctx,w,h} = hidpi(canvas);
  ctx.clearRect(0,0,w,h);
  drawGrid(ctx,w,h,30);
  const sorted = [...samples].sort((a,b)=>a-b);
  const N = sorted.length;
  const stride = Math.max(1, Math.floor(N/400));
  const pts = [];
  for(let i=N-1;i>=0;i-=stride){
    const rank = N-i, survival = rank/N;
    if(sorted[i]>0 && survival>0) pts.push([Math.log10(sorted[i]), Math.log10(survival)]);
  }
  if(pts.length<2) return;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const xlo=Math.min(...xs),xhi=Math.max(...xs),ylo=Math.min(...ys),yhi=Math.max(...ys);
  const X=v=>4+(v-xlo)/((xhi-xlo)||1)*(w-8);
  const Y=v=>h-6-(v-ylo)/((yhi-ylo)||1)*(h-12);
  ctx.fillStyle = getCSS('--crash');
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),1.6,0,7); ctx.fill(); });
}
