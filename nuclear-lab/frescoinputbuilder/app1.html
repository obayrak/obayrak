/* Fill the card from EXFOR retrievals (native EXFOR unit/frame kept; conversion done by fdxParse). */
function fdxFromPoints(points,m,id,d){
  const S=FDX;
  const rp=d?exforReactionParts(d):null;
  if(rp&&rp.target&&rp.projectile){S.mp=rp.projectile.A;S.mt=rp.target.A;S.massSrc=`EXFOR reaction ${rp.projectile.label} + ${rp.target.label} (mass numbers)`;}
  else{S.mp='';S.mt='';S.massSrc='Reaction tab (EXFOR reaction not identified)';}
  const hasAng=points.some(p=>p.theta!=null),es=[...new Set(points.map(p=>p.E))];
  S.type=hasAng?'angular':'excitation';
  S.eFrame=m.eFrame||'lab';S.angFrame=m.angFrame||'lab';
  S.unit=FDX_UF[m.unit]!=null?m.unit:'mb';
  S.obs=S.unit==='ratio'?'ratio':'dsdo';S.errMode='abs';S.pe='all';
  if(hasAng&&es.length===1){S.fmt='thetaSigmaErr';S.singleE=String(es[0]);}
  else{S.fmt=hasAng?'EthetaSigmaErr':'ESigmaErr';}
  S.text=points.map(p=>hasAng?(es.length===1?[p.theta,p.y,p.err]:[p.E,p.theta,p.y,p.err]):[p.E,p.y,p.err]).map(a=>a.join(' ')).join('\n');
  S.note=m.fallback?`EXFOR ${id||''}: ⚠ units/frames NOT officially verified (assumed unit ${S.unit}, E ${S.eFrame}${hasAng?', θ '+S.angFrame:''}) — check the selectors.`
    :`EXFOR ${id||''}: unit ${S.unit}${hasAng&&m.differential?'/sr':''}, E ${S.eFrame}${hasAng?', θ '+S.angFrame:''} read from official EXFOR metadata.`;
  S.noteWarn=!!m.fallback;
  fdxParse();
}
/* Pool the whole library at E_lab / θ_lab in mb (same rules as the optical-model library load). */
function fdxFromLibrary(){
  if(!EXFOR_LIBRARY.length)return;
  const S=FDX;
  const s0=EXFOR_LIBRARY.find(e=>e.system);
  if(s0){S.mp=s0.system.mp;S.mt=s0.system.mt;S.massSrc=`EXFOR library entry ${s0.id} (mass numbers)`;}
  const sys=fdxSys(),tau=sys.tau;
  const counts={};EXFOR_LIBRARY.forEach(e=>counts[e.type]=(counts[e.type]||0)+e.points.length);
  const type=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const skipType=EXFOR_LIBRARY.filter(e=>e.type!==type);
  const use=EXFOR_LIBRARY.filter(e=>e.type===type&&e.unit!=='ratio'&&FDX_UF[e.unit]!=null);
  const skipRatio=EXFOR_LIBRARY.filter(e=>e.type===type&&!use.includes(e));
  const lines=[];
  use.forEach(e=>{
    const uf=FDX_UF[e.unit];
    e.points.forEach(pt=>{
      const Elab=e.eFrame==='cm'?(sys.ok?fdxCm2LabE(pt.E,sys):NaN):pt.E;
      let y=pt.y*uf,er=pt.err*uf;
      if(type==='angular'){
        if(pt.theta==null)return;
        let th=pt.theta;
        if(e.angFrame==='cm'){
          if(!sys.ok)return;
          th=fdxCm2LabAng(pt.theta,tau);
          if(e.differential){const J=fdxJac(pt.theta,tau);if(J>0){y/=J;er/=J;}}
        }
        if(![Elab,th,y,er].every(Number.isFinite)||th<=0||th>=180)return;
        lines.push(`${Elab} ${th} ${y} ${er}`);
      }else{
        if(![Elab,y,er].every(Number.isFinite))return;
        lines.push(`${Elab} ${y} ${er}`);
      }
    });
  });
  if(!lines.length){S.note='Library: no usable points could be pooled into Experimental Data (check reaction masses / units).';S.noteWarn=true;return;}
  Object.assign(S,{type,fmt:type==='angular'?'EthetaSigmaErr':'ESigmaErr',eFrame:'lab',angFrame:'lab',unit:'mb',errMode:'abs',obs:'dsdo',pe:'all',text:lines.join('\n')});
  const unver=use.filter(e=>e.fallback).map(e=>e.id),w=[];
  if(skipType.length)w.push(`skipped other data type: ${skipType.map(e=>e.id).join(', ')}`);
  if(skipRatio.length)w.push(`skipped ratio/unknown unit: ${skipRatio.map(e=>e.id).join(', ')}`);
  if(unver.length)w.push(`units NOT officially verified: ${unver.join(', ')}`);
  S.note=`Library pooled from ${use.length} dataset(s) (${use.map(e=>e.id).join(', ')}) at E_lab/θ_lab in mb${type==='angular'?'/sr':''}.${w.length?' ⚠ '+w.join('; ')+'.':''}`;
  S.noteWarn=w.length>0;
  fdxParse();
}

function exTheoryParseBlocks(text){
  const blocks=[],cur=[];
  const flush=()=>{if(cur.length)blocks.push(cur.splice(0,cur.length));};
  String(text||'').split(/\r?\n/).forEach(line=>{
    const t=line.trim();
    if(!t||/^[#!%]/.test(t)){flush();return;}
    const a=t.split(/[\s,;\t]+/).filter(Boolean).map(Number);
    if(a.length>=2&&a.every(Number.isFinite))cur.push(a); else flush();
  });
  flush();return blocks;
}
let exTheoryState={text:"",block:1,e:1,theta:2,sig:3,err:4,name:"FRESCO theory"};
let exTheoryData=[];

function exTheoryRead(){
  const blocks=exTheoryParseBlocks(exTheoryState.text),b=blocks[exTheoryState.block-1]||[];
  const ci=k=>+k>0?+k-1:-1, Ecol=ci(exTheoryState.e), Tcol=ci(exTheoryState.theta), Scol=ci(exTheoryState.sig), Dcol=ci(exTheoryState.err);
  const rows=[];
  b.forEach(r=>{
    const E=Ecol>=0?r[Ecol]:null,th=Tcol>=0?r[Tcol]:null,s=Scol>=0?r[Scol]:null,ds=Dcol>=0?r[Dcol]:null;
    if(Number.isFinite(th)&&Number.isFinite(s))rows.push({E:Number.isFinite(E)?E:null,th,s,ds:Number.isFinite(ds)?Math.abs(ds):null});
  });
  exTheoryData=rows;return {blocks,rows};
}
function exTheoryLoadFile(el){
  if(!el.files?.[0])return;
  const f=el.files[0],fr=new FileReader();
  fr.onload=()=>{exTheoryState.text=String(fr.result||'');exTheoryState.name=f.name.replace(/\.[^.]*$/,'')||'FRESCO theory';exTheoryRead();render();};
  fr.readAsText(f);el.value='';
}
/* Decide from the data itself which column is the independent variable.
   Constant angle + varying energy -> excitation function (x = E); varying angle at fixed energy(ies) -> angular distribution (x = θ).
   If both vary, the column that has several points per value of the other one is grouped, the other is the x-axis. */
/* Up to 20 datasets can be applied: 20 distinct colours (one per dataset) and several marker symbols (one per energy/angle group). */
const EX_PAL=['#e6194b','#3cb44b','#4f86f7','#f58231','#b56bd6','#2fc6c6','#e0c020','#f032a0','#9acd32','#a9745b','#00a878','#ff8fa3','#6b8cff','#c98a1b','#8dd3c7','#d95f02','#7fb3ff','#b5d86a','#c4a0e8','#e8e8e8'];
const EX_SYM=['circle','square','diamond','triangle-up','cross','x','triangle-down','star'];
function exAxisMode(rows){
  const cnt=k=>{const m=new Map();(rows||[]).forEach(r=>{const v=r[k];if(v==null||!Number.isFinite(+v))return;const key=+(+v).toFixed(6);m.set(key,(m.get(key)||0)+1);});return m;};
  const cT=cnt('th'),cE=cnt('E'),nT=cT.size,nE=cE.size;
  const med=m=>{const a=[...m.values()].sort((x,y)=>x-y);return a.length?a[a.length>>1]:0;};
  let mode='theta';
  if(nE>1&&nT<=1)mode='energy';
  else if(nT>1&&nE<=1)mode='theta';
  else if(nT>1&&nE>1){const gE=med(cE),gT=med(cT);mode=(gE>=2&&gE>=gT)?'theta':(gT>=2?'energy':(nE>nT?'energy':'theta'));}
  return {mode,nT,nE};
}
/* Experimental points for plot 5 come from the converted table of 1 · Experimental Data (E_cm, θ_cm, internal unit). */
function exExpSets(){
  const out=[]; /* only datasets switched on with Apply in the Datasets table are plotted */
  /* Datasets table (imported / EXFOR): those with Apply switched on are plotted too; E_lab is converted to E_cm (non-relativistic, as in the table) */
  const P=Model.p.reaction, fcm=P.targ.mass/(P.proj.mass+P.targ.mass);
  Model.p.data.forEach(d=>{ if(!d.plot5)return; const c=dsConv(d);
    const rows=c.rows.map(r=>({th:r.th,s:r.s,ds:r.ds,E:r.E,Elab:(c.eLab&&r.Eraw!=null)?r.Eraw:null}));
    out.push({name:d.name,lab:c.eLab,eK:c.raw?(d.eKind==="lab"?"lab":"cm"):"cm",axis:exAxisMode(rows),rows}); });
  return out;
}
let EX_THEORY_DS='all'; /* 'all' or index into exExpSets() */
function exTheoryEnergies(){

function drawExTheoryPlot(){

/* ===== SFRESCO SEARCH FILE (FRESCO 3.4 manual, "Input SFRESCO format": search file and Sfresco commands) =====
   Kept strictly separate from the FRESCO input: SFRESCO is a different program that reads
     'input_file' 'output_file' nvariables ndatasets
     &variable ... /   (nvariables times)
     &data ... /  + data lines + &   (ndatasets times)
   and then a list of commands on standard input. Potential-parameter and spectroscopic-amplitude
   variables are linked live to this project's Potentials (kp/pline/column) and to &cfp namelists
   kept verbatim from an imported input (rawBlocks); the nafrac↔&cfp indexing and the kind=2/5
   field layout follow the manual but were not cross-checked against a real SFRESCO run. */
const SF_KINDS={1:"Potential parameter",2:"Spectroscopic amplitude",5:"Dataset normalisation",0:"Raw / advanced"};
const SF_TYPES={0:"angular distribution at fixed energy",1:"excitation + angular double distribution"};
const SF_ISCALE={"-1":"dimensionless (ratio to Rutherford)",0:"fm^2/sr",1:"b/sr",2:"mb/sr",3:"microb/sr"};
const Sfresco={
  defaults(){ return {inFile:"input.in",outFile:"output.out",searchFile:"search.in",vars:[],sets:[],explicit:false,extra:""}; },
  // &POT records of potential kp in project (=file) order: pline = 1-based position among them
  comps(P){ const cnt={}, out=[]; (P.potentials||[]).forEach((v,idx)=>{ const kp=+v.kp; if(!isFinite(kp))return; cnt[kp]=(cnt[kp]||0)+1; out.push({idx,kp,pline:cnt[kp],type:v.kind==="coulomb"?0:(+v.type||0),rec:v}); }); return out; },
  find(P,kp,pline){ return Sfresco.comps(P).find(c=>c.kp===+kp&&c.pline===+pline); },
  colLabel(type,col){ const L=type===0?["P0","AT","AP","RC","AC","P5","P6","P7"]:["P0","V","r0","a","W","rW","aW","P7"]; return L[col]||("P"+col); },
  // &cfp namelists are kept verbatim (Model.p.rawBlocks) until a dedicated editor exists; nafrac indexes them in file order
  cfps(P){ return (P.rawBlocks||[]).filter(b=>b.name==="cfp"); },
  cfpVal(raw){ const m=/(?:^|\s)a\s*=\s*([+-]?[\d.]+(?:[eE][+-]?\d+)?)/.exec(raw||""); return m?parseFloat(m[1]):NaN; },
  cfpSet(b,x){ const s=isFinite(x)?String(+(+x).toPrecision(7)):"0"; if(/(?:^|\s)a\s*=\s*[+-]?[\d.]+(?:[eE][+-]?\d+)?/.test(b.raw))b.raw=b.raw.replace(/(^|\s)a\s*=\s*[+-]?[\d.]+(?:[eE][+-]?\d+)?/,`$1a=${s}`); else b.raw=(b.raw+` a=${s}`).trim(); },
  initial(P,v){
    if(v.kind===1){ const c=Sfresco.find(P,v.kp,v.pline); if(!c)return NaN;
      if(c.type===0){ const m={1:"at",2:"ap",3:"rc"}[v.col]; return m&&c.rec[m]!=null?+c.rec[m]:NaN; }
      const n=v.col-1; return (n>=0&&n<7&&c.rec.p)?+c.rec.p[n]:NaN; }
    if(v.kind===2){ const c=Sfresco.cfps(P)[v.nafrac-1]; return c?Sfresco.cfpVal(c.raw):NaN; }
    return NaN; },
  setInitial(P,v,x){
    if(v.kind===1){ const c=Sfresco.find(P,v.kp,v.pline); if(!c)return;
      if(c.type===0){ const m={1:"at",2:"ap",3:"rc"}[v.col]; if(m&&isFinite(x))c.rec[m]=x; }
      else { const n=v.col-1; if(n>=0&&n<7&&isFinite(x)&&c.rec.p)c.rec.p[n]=x; } }
    else if(v.kind===2){ const c=Sfresco.cfps(P)[v.nafrac-1]; if(c)Sfresco.cfpSet(c,x); } },
  newVar(kind){ return {name:"",kind,kp:1,pline:1,col:1,nafrac:1,dataset:1,step:0.01,valmin:0,valmax:0,fixed:false,raw:""}; },
  addComponent(P,kp,pline){   // one variable per standard column of a component not already listed
    const c=Sfresco.find(P,kp,pline), S=P.sfresco; if(!c)throw new Error("No such potential component.");

    return n; },
  datasetFromExp(P,d,type){
    if(!d||!d.rows.length)throw new Error("This dataset has no rows.");
    const rows=[]; d.rows.forEach(r=>{ if(type===1){ if(r.E!=null&&isFinite(r.E)&&isFinite(r.th)&&isFinite(r.s)&&r.ds)rows.push([r.E,r.th,r.s,r.ds]); } else { if(isFinite(r.th)&&isFinite(r.s)&&r.ds)rows.push([r.th,r.s,r.ds]); } });
    if(!rows.length)throw new Error(type===1?"No rows have an energy, angle, cross section AND an uncertainty (Δσ) — check the column mapping in Experimental Data.":"No rows have an angle, cross section AND an uncertainty (Δσ) — check the column mapping in Experimental Data.");
    const ratio=d.unit==="ratio";
    return {name:d.name||"data",type,lab:d.eKind==="lab"?"T":"F",idir:ratio?1:0,iscale:ratio?-1:({"mb/sr":2,"b/sr":1,"μb/sr":3}[d.unit]??2),abserr:"T",ic:1,ia:1,rows}; },
  validate(P){
    const S=P.sfresco, M=[], add=(sev,loc,msg)=>M.push({sev,loc,msg}), names=new Set();
    if(!S.vars.length)add("WARNING","variables","No search variable is defined.");
    if(!S.sets.length)add("WARNING","datasets","No data set is defined: SFRESCO needs experimental data to search against.");
    if(!/\S/.test(S.inFile)||!/\S/.test(S.outFile))add("ERROR","files","The FRESCO input and output file names must not be empty.");
    S.vars.forEach((v,i)=>{ const L=`variable ${i+1} (${v.name||"unnamed"})`;
      if(!v.name)add("ERROR",L,"The name is empty."); else if(v.name.length>10)add("ERROR",L,"The name is longer than 10 characters.");
      if(names.has(v.name))add("ERROR",L,"Duplicate name."); names.add(v.name);
      if(v.step<0)add("ERROR",L,"The step must be >= 0 (0 keeps the variable fixed).");
      if(v.valmin&&v.valmax&&v.valmin>=v.valmax)add("ERROR",L,"valmin must be smaller than valmax.");
      if(v.kind===1){ const c=Sfresco.find(P,v.kp,v.pline);
        if(!c)add("ERROR",L,`Potential kp=${v.kp} has no &POT namelist number ${v.pline} (Potentials tab).`);
        else { const x=Sfresco.initial(P,v); if(!isFinite(x))add("WARNING",L,`${Sfresco.colLabel(c.type,v.col)} is not set on that potential; the search would start from 0.`); else { if(v.valmin&&x<v.valmin)add("WARNING",L,"The starting value is below valmin."); if(v.valmax&&x>v.valmax)add("WARNING",L,"The starting value is above valmax."); } } }
      else if(v.kind===2){ const n=Sfresco.cfps(P).length; if(!(v.nafrac>=1&&v.nafrac<=n))add("ERROR",L,`nafrac=${v.nafrac}: ${n} &cfp namelist(s) found (imported/raw input).`); }
      else if(v.kind===5){ if(!(v.dataset>=1&&v.dataset<=S.sets.length))add("ERROR",L,`dataset=${v.dataset} does not exist (${S.sets.length} data set(s) below).`); }
      else add("WARNING",L,"Raw/advanced kind: fields are written as typed and are not checked here.");
    });
    S.sets.forEach((d,i)=>{ const L=`data set ${i+1} (${d.name})`; if(!d.rows.length)add("ERROR",L,"The data set has no rows."); });
    return M; },
  generate(P){
    const S=P.sfresco, f=x=>String(+(+x).toPrecision(9)), L=[`'${S.inFile}' '${S.outFile}' ${S.vars.length} ${S.sets.length}`];
    S.vars.forEach(v=>{ const t=[`kind=${v.kind}`,`name='${v.name}'`]; if(v.fixed)t.push("step=0.0"); else if(v.step!==0.01)t.push("step="+f(v.step)); if(v.valmin)t.push("valmin="+f(v.valmin)); if(v.valmax)t.push("valmax="+f(v.valmax));
      if(v.kind===1){ t.push(`kp=${v.kp}`,`pline=${v.pline}`,`col=${v.col}`); if(S.explicit){ const x=Sfresco.initial(P,v); if(isFinite(x))t.push("potential="+f(x)); } }
      else if(v.kind===2){ t.push(`nafrac=${v.nafrac}`); if(S.explicit){ const x=Sfresco.initial(P,v); if(isFinite(x))t.push("afrac="+f(x)); } }
      else if(v.kind===5){ if(v.dataset!==1)t.push(`dataset=${v.dataset}`); }
      if(v.raw&&v.raw.trim())t.push(v.raw.trim());
      L.push(" &variable "+t.join(" ")+" /"); });
    S.sets.forEach(d=>{ const t=[`type=${d.type}`,`iscale=${d.iscale}`,`idir=${d.idir}`,`lab=${d.lab}`,`abserr=${d.abserr}`]; if(d.ic!==1)t.push("ic="+d.ic); if(d.ia!==1)t.push("ia="+d.ia); L.push(" &data "+t.join(" ")+" /"); d.rows.forEach(r=>L.push(" "+r.map(x=>f(x)).join("  "))); L.push(" &"); });
    return L.join("\n")+"\n"; },
  commands(P,searchName){ const S=P.sfresco; return [searchName,"min"].concat((S.extra||"").split("\n").map(x=>x.trim()).filter(Boolean),["migrad","end","q","show","plot"]).join("\n")+"\n"; }
};

function acceptance(){ const R=[], t=(name,fn)=>{ try{ const r=fn(); R.push({name,ok:r===true||!!(r&&r.ok),detail:(r&&r.detail)||""}); }catch(e){ R.push({name,ok:false,detail:"exception: "+e.message}); } };

/* ---------- Transfer Wizard: direct one-step finite-range/zero-range transfer builder ----------
   Ported from the standalone Transfer Wizard module (structure taken from the FRESCO manual's CCBA
   test run): builds two partitions, four potentials, two KIND=0 overlaps (or one for zero-range),
   one KIND=7 (or KIND=5) coupling, and its &CFP amplitudes, directly into this project. */
const TransferWizard = {
  defaults(){
    const opt=()=>({V:50,r0:1.17,a:0.75,W:10,rW:1.32,aW:0.65,rc:1.25});
    return {
      pa:{name:'d',A:2,Z:1,spin:1,parity:1}, ta:{name:'40Ca',A:40,Z:20,spin:0,parity:1},
      pb:{name:'p',A:1,Z:1,spin:0.5,parity:1}, tb:{name:'41Ca',A:41,Z:20,spin:3.5,parity:-1},
      elab:20, Q:6.138, thmin:0, thmax:180, thinc:2,
      bp:{l:0,s:0.5,j:0.5,nr:0,BE:2.2246,V0:60,r0:1.25,a:0.65,Vso:0,rso:1.25,aso:0.65,rc:1.25,amp:1},
      bt:{l:3,s:0.5,j:3.5,nr:0,BE:8.363,V0:50,r0:1.25,a:0.65,Vso:6,rso:1.25,aso:0.65,rc:1.25,amp:1},
      o1:opt(), o2:opt(), form:'post', remnant:'none', kpcore:0, D0:0, fnrng:0,
      mx:{pa:0,ta:0,pb:0,tb:0}, replace:true, auto:true
    };
  },
  qFromExcess(T){ return (T.mx.pa+T.mx.ta)-(T.mx.pb+T.mx.tb); },
  derived(T){ const dA=T.pa.A-T.pb.A, dZ=T.pa.Z-T.pb.Z;
    return { xA:Math.abs(dA), xZ:Math.abs(dZ), stripping:dA>0, consA:T.pa.A+T.ta.A===T.pb.A+T.tb.A, consZ:T.pa.Z+T.ta.Z===T.pb.Z+T.tb.Z, coreP:Math.min(T.pa.A,T.pb.A), coreT:Math.min(T.ta.A,T.tb.A) }; },
  check(T){
    const e=[], d=TransferWizard.derived(T);
    if(!d.consA) e.push('Mass number is not conserved: A(a)+A(A) must equal A(b)+A(B).');
    if(!d.consZ) e.push('Charge is not conserved: Z(a)+Z(A) must equal Z(b)+Z(B).');
    if(d.xA===0) e.push('Projectile and ejectile have the same mass: nothing is transferred.');
    for(const [k,nm] of [['bp','projectile-side'],['bt','target-side']]){ const b=T[k];
      if(!(Number.isInteger(b.l)&&b.l>=0)) e.push(`${nm}: l must be a non-negative integer.`);
      if(!(b.j>=Math.abs(b.l-b.s)-1e-9 && b.j<=b.l+b.s+1e-9 && Math.abs((b.l+b.s-b.j)-Math.round(b.l+b.s-b.j))<1e-9)) e.push(`${nm}: j = ${b.j} is not allowed for l = ${b.l}, s = ${b.s}.`);
      if(!(Number.isInteger(b.nr)&&b.nr>=0)) e.push(`${nm}: radial nodes must be a non-negative integer.`);
      if(!(b.BE>0)) e.push(`${nm}: the binding energy must be positive.`); }
    for(const n of ['pa','ta','pb','tb']){ const x=T[n]; if(!(x.A>0)||x.Z<0||x.Z>x.A) e.push(`${n}: invalid mass or charge.`); }
    if(!(T.elab>0)) e.push('The laboratory energy must be positive.');
    if(T.form==='zero' && !(isFinite(T.D0)&&T.D0!==0)) e.push('Zero-range transfer needs the constant D0 (P1 of KIND 5); enter it, its value is not assumed here.');
    return e;
  },

  apply(P,T){
    const err=TransferWizard.check(T); if(err.length) throw new Error(err[0]);
    const f=x=>+(+x).toPrecision(7), D=TransferWizard.derived(T);
    const part=(p,t,cpot,qv)=>({ name:p.name, massp:f(p.A), zp:f(p.Z), namet:t.name, masst:f(t.A), zt:f(t.Z),
      qval:qv?f(qv):0, nex:1, x:{}, role:cpot===1?'entrance':'transfer',
      states:[{jp:f(p.spin), bp:p.parity<0?-1:1, ep:0, cpot, jt:f(t.spin), bt:t.parity<0?-1:1, et:0}] });
    const pots=[];
    const opt=(kp,o,at,ap)=>{ pots.push({label:'Coulomb',kind:'coulomb',kp,ap:f(ap),at:f(at),rc:f(o.rc),extra:''});
      const p=[f(o.V),f(o.r0),f(o.a),0,0,0,0]; if(o.W){ p[3]=f(o.W); p[4]=f(o.rW); p[5]=f(o.aW); }
      pots.push({label:'Volume WS',kind:'generic',kp,type:1,shape:0,p,extra:''}); };
    const bind=(kp,b,core)=>{ pots.push({label:'Coulomb (core)',kind:'coulomb',kp,ap:0,at:f(core),rc:f(b.rc),extra:''});
      pots.push({label:'Volume WS (bound state)',kind:'generic',kp,type:1,shape:0,p:[f(b.V0),f(b.r0),f(b.a),0,0,0,0],extra:''});
      if(b.Vso) pots.push({label:'Spin-orbit (bound state)',kind:'generic',kp,type:3,shape:0,p:[f(b.Vso),f(b.rso),f(b.aso),0,0,0,0],extra:''}); };
    const zero=T.form==='zero';
    opt(1,T.o1,T.ta.A,T.pa.A); opt(2,T.o2,T.tb.A,T.pb.A); if(!zero) bind(3,T.bp,D.coreP); bind(4,T.bt,D.coreT);
    const ov=(kn,inn,b,kp)=>({pairs:[['kn1',String(kn)],['ic1','1'],['ic2','2'],['in',String(inn)],['kind','0'],
      ['nn',String(b.nr+1)],['l',String(b.l)],['sn',String(f(b.s))],['j',String(f(b.j))],['kbpot',String(kp)],['be',String(f(b.BE))],['isc','1']]
      .map(([key,val])=>({key,val}))});
    const rem={none:0,real:1,complex:-1,nonorth:2}[T.remnant]||0;
    const cfpLines=[], coupling=zero
      ? {pairs:[['icto','2'],['icfrom','1'],['kind','5'],['p1',String(f(T.D0))],['p2',String(f(T.fnrng))]].map(([key,val])=>({key,val}))}
      : {pairs:[['icto','2'],['icfrom','1'],['kind','7'],['ip1',T.form==='prior'?'1':'0'],['ip2',String(rem)],['ip3',String(T.kpcore)]].map(([key,val])=>({key,val}))};
    if(zero) cfpLines.push(`in=2 ib=1 ia=1 kn=1 a=${f(T.bt.amp)}`);
    else { cfpLines.push(`in=1 ib=1 ia=1 kn=1 a=${f(T.bp.amp)}`); cfpLines.push(`in=2 ib=1 ia=1 kn=2 a=${f(T.bt.amp)}`); }
    if(T.replace){ P.partitions=[]; P.potentials=[]; P.overlaps=[]; P.couplings=[]; P.rawBlocks=(P.rawBlocks||[]).filter(b=>b.name!=='cfp'); }
    const n0=P.partitions.length; if(n0) throw new Error('The project already has partitions: enable "replace" to build the transfer structure.');
    P.partitions.push(part(T.pa,T.ta,1,0), part(T.pb,T.tb,2,T.Q)); P.potentials.push(...pots);
    if(zero) P.overlaps.push(ov(1,2,T.bt,4)); else P.overlaps.push(ov(1,1,T.bp,3), ov(2,2,T.bt,4));
    P.couplings.push(coupling); P.rawBlocks=P.rawBlocks||[]; cfpLines.forEach(raw=>P.rawBlocks.push({name:'cfp',raw}));
    P.reaction.proj={name:T.pa.name,mass:f(T.pa.A),Z:f(T.pa.Z),spin:f(T.pa.spin),parity:T.pa.parity};
    P.reaction.targ={name:T.ta.name,mass:f(T.ta.A),Z:f(T.ta.Z),spin:f(T.ta.spin),parity:T.ta.parity};
    P.reaction.eMode='lab'; P.reaction.eKind='single'; P.reaction.energy=f(T.elab);
    const ff=P.fresco.fields;
    Object.assign(ff,{hcm:0.1,rmatch:25.0,rintp:0.5,hnl:0.1,rnl:3.0,nnu:24,iter:1,chans:1,xstabl:1,jtmin:0.0,jtmax:40.0,
      thmin:f(T.thmin),thmax:f(T.thmax),thinc:f(T.thinc)});
    P.numerics.manual.hcm=0.1; P.numerics.manual.rmatch=25.0; P.numerics.manual.rintp=0.5; P.numerics.manual.jtmin=0.0; P.numerics.manual.jtmax=40.0;
    P.numerics.thmin=f(T.thmin); P.numerics.thmax=f(T.thmax); P.numerics.thinc=f(T.thinc);
    P.numerics.fx=P.numerics.fx||{}; P.numerics.fx.hnl=0.1; P.numerics.fx.rnl=3.0;
    if(T.auto){ const d=Physics.derive(P);
      Object.assign(ff,{hcm:d.hcm,rmatch:d.rmatch,rintp:d.rintp,rmin:d.rmin,jtmin:d.jtmin,jtmax:d.jtmax});
      Object.assign(P.numerics.manual,{hcm:d.hcm,rmatch:d.rmatch,rintp:d.rintp,rmin:d.rmin,jtmin:d.jtmin,jtmax:d.jtmax}); }
    P.meta.name=`${T.ta.name}(${T.pa.name},${T.pb.name})${T.tb.name}`;
    P.meta.notes=`Direct transfer ${P.meta.name}, ${zero?'zero':'finite'} range (built by the Transfer Wizard).`;

  }

  const g=e.target.closest("[data-goto]"); if(g){ if(g.dataset.goto==="frescoimport"){ $("#fFresco").click(); return; } cur=g.dataset.goto;render();return;}
  const n=e.target.closest("[data-mod]"); if(n){cur=n.dataset.mod;render();return;}

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.exdataset!==undefined){ EXFOR_SELECTED=+t.value; const q=EXFOR_DATASETS[EXFOR_SELECTED]; EXFOR_META={selected:`${datasetIdOf(q)||'—'}`}; const ob=document.getElementById('exOfficialBtn'); if(ob)ob.disabled=!datasetIdOf(q); exforRenderDatasetHint(q); exforRenderMeta(); return; }
  if(t.id==="file"){ const fr=new FileReader(); fr.onload=()=>{ try{ const j=JSON.parse(fr.result); change(()=>Model.load(j)); cur="project"; render(); }catch(err){ logDiag("Project import","file",err.message,"Choose a valid FRESCO JSON project file."); alert("Could not open project: "+err.message); } }; if(t.files[0])fr.readAsText(t.files[0]); t.value=""; return; }
  if(t.id==="outputFileInput"){ outputAddFiles(t.files); t.value=""; return; }
  if(t.dataset.outxaxis!==undefined){ outputXAxisChoice[String(t.dataset.outxaxis)]=t.value; render(); return; }
  if(t.id==="fFresco"){ const fr=new FileReader(); fr.onload=()=>{ try{ const r=parseFresco(String(fr.result)); if(r.kind==="cdcc"){ alert("This is CDCC-format input; use the CDCC Bins tab."); return; } const np=r.project; np.originalInput=String(fr.result); Model.load(np); lastImport={name:t.files[0]?t.files[0].name:"input",summary:r.summary,warns:r.warns}; cur="project"; render(); }catch(err){ logDiag("FRESCO import","fFresco",err.message,"Check that the selected file is a valid FRESCO namelist input."); alert("Could not import FRESCO input: "+err.message); } }; if(t.files[0])fr.readAsText(t.files[0]); t.value=""; return; }
  if(t.id==="prNamelist"){ prN=t.value; render(); return; }
  if(t.id==="presetSel"){ presetSel=t.value; return; }
  if(t.id==='p4preset')return;
  if(t.id==='p4kp'){P4.kp=+t.value;render();return}
  if(t.id==='p4defL'){p4DrawDeform();return}
  if(t.id==='p4rmax'){P4.rmax=Math.max(1,+t.value||15);P4Plot.draw();return}
  if(t.dataset.act==="p4plotdef"){p4DrawDeform();return;}
  if(t.dataset.p4plot){P4.show[t.dataset.p4plot]=t.checked;P4Plot.draw();return}
  if(t.dataset.p4type){const i=+t.dataset.p4type;change(()=>Model.p.potentials[i]=p4setType(Model.p.potentials[i],+t.value));return}
  if(t.dataset.p4shape){const i=+t.dataset.p4shape;change(()=>{if(Model.p.potentials[i].kind!=='coulomb')Model.p.potentials[i].shape=+t.value});return}

  if(t.id==="cmpFileA"||t.id==="cmpFileB"){ const fr=new FileReader(), w=t.id.slice(-1); fr.onload=()=>{ if(w==="A")cmpA=fr.result; else cmpB=fr.result; render(); }; if(t.files[0])fr.readAsText(t.files[0]); t.value=""; return; }

  if(t.dataset.dm!==undefined){ const k=t.dataset.dm; dm[k]=(t.type==="number")?(parseInt(t.value,10)||0):t.value; render(); return; }
  if(t.dataset.binsel!==undefined){ const i=+t.dataset.binsel, P=Model.p.bins, sel=P.sel||[]; P.sel=t.checked?[...new Set([...sel,i])]:sel.filter(x=>x!==i); BinPlot.drawAll(); return; }
  if(t.dataset.rsel!==undefined){ resSel=+t.dataset.rsel; render(); return; }
  if(t.dataset.bsel!==undefined){ const i=+t.dataset.bsel; boundSel=t.checked?[...boundSel,i]:boundSel.filter(x=>x!==i); Bplot.drawAll(); return; }
  if(t.dataset.plotkey){ PlotState.hide[t.dataset.plotkey]=!t.checked; Plot.draw(); return; }
  if(t.id==="infile"){ const fr=new FileReader(); fr.onload=()=>{ pasteBuf=fr.result; runImport(fr.result); }; if(t.files[0])fr.readAsText(t.files[0]); t.value=""; return; }
  if(!t.dataset.path)return;
  let v=t.value; const k=t.dataset.t||t.type; if(t.type==="checkbox")v=t.checked?1:0; if(k==="optnum")v=t.value.trim()===""?null:parseFloat(t.value); if(k==="opttext")v=t.value.trim()===""?null:t.value.trim(); if(k==="optnum"&&v!==null&&Number.isNaN(v)){ render(); return; }
  if(k==="number"||k==="num"){ v=parseFloat(v); if(Number.isNaN(v)){ render(); return; } }
  change(()=>Model.set(t.dataset.path,v));
});

  else if(["fresco.fields.thmin","fresco.fields.thmax","fresco.fields.thinc"].includes(t.dataset.path)){

    const gv=pp=>{ const el=$(`[data-path="${pp}"]`); return el?parseFloat(el.value):NaN; };
    const a=gv("reaction.eRange.start"), b=gv("reaction.eRange.stop"), st=gv("reaction.eRange.step");

(function(){
  const KEY="fresco-ui-theme";
  const btnNight=$("#thNight"), btnDay=$("#thDay");
  function apply(mode){
    document.documentElement.setAttribute("data-theme", mode==="day"?"light":"dark");
    if(btnNight) btnNight.classList.toggle("on", mode!=="day");
    if(btnDay) btnDay.classList.toggle("on", mode==="day");
    try{ localStorage.setItem(KEY, mode); }catch(_){}
  }
  let saved="night";
  try{ saved=localStorage.getItem(KEY)||"night"; }catch(_){}
  apply(saved);
  if(btnNight) btnNight.addEventListener("click",()=>apply("night"));
  if(btnDay) btnDay.addEventListener("click",()=>apply("day"));
})();
