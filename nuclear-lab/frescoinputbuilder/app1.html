<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a2029'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%236db3d6' stroke-width='4'/%3E%3Cpath d='M18 34c6-12 12-12 18 0s12 12 18 0' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23d9a441'/%3E%3C/svg%3E">
<title>FRESCO Input Builder — step 1 (skeleton)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--bg:#12161d;--panel:#1a2029;--panel2:#212936;--line:#2f3a4a;--ink:#dde4ee;--dim:#8d9bb0;--acc:#6db3d6;--ok:#7fbf8a;--warn:#d9a441;--err:#e06a5c;
--mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;--sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
html[data-theme="light"]{--bg:#f4f2ea;--panel:#ffffff;--panel2:#eceadf;--line:#c7c2ae;--ink:#1c1c1c;--dim:#5a5748;--acc:#0e3a73;--ok:#1f6b3a;--warn:#8a5a00;--err:#a3271c}
html[data-theme="light"] body{background:var(--bg)}
html[data-theme="light"] .drawer{box-shadow:0 4px 18px rgba(0,0,0,.12)}
html[data-theme="light"] button.pri{background:#0e3a73;border-color:#0a2c58;color:#f4f2ea}
.fresco-site-link{position:absolute;top:12px;right:82px;z-index:30;color:var(--acc);text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
.fresco-site-link:hover{text-decoration:underline}
.theme-toggle{position:absolute;top:6px;right:10px;display:flex;gap:4px;z-index:30}
.theme-toggle button{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:5px}
.theme-toggle button svg{width:16px;height:16px;stroke:var(--ink);fill:none}
.theme-toggle button.on{border-color:var(--acc);background:var(--panel2)}
.theme-toggle button.on svg{fill:var(--acc);stroke:var(--acc)}
.theme-toggle button:not(.on){opacity:.5}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:auto minmax(0,1fr) 460px;grid-template-areas:"h h h" "n m l" "s s s"}
header{grid-area:h;position:relative;display:flex;align-items:center;gap:6px;padding:8px 14px;padding-right:80px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 14px 0 0;font-weight:600}
nav{grid-area:n;width:210px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px 0}
nav.collapsed{width:0;padding:0;overflow:hidden;border:0}
nav a{display:block;padding:7px 16px;color:var(--ink);cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:var(--panel2)}nav a.on{background:var(--panel2);border-left-color:var(--acc)}
nav a small{color:var(--dim);margin-left:6px}
main{grid-area:m;overflow:auto;padding:16px 20px;min-width:0}
aside#live{grid-area:l;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
aside#live .lh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
aside#live pre{margin:0;padding:10px 12px;overflow:auto;flex:1;background:var(--bg);font:12.5px/1.5 var(--mono);white-space:pre;color:var(--ink)}
body.nolive aside#live{display:none}body.nolive{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"h h" "n m" "s s"}
footer{grid-area:s;display:flex;gap:18px;padding:5px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);flex-wrap:wrap}
button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 11px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
button.pri{background:#28506a;border-color:#3d7a9e}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 7px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
h2{font-size:18px;margin:0 0 4px}h3{font-size:14px;margin:0 0 8px;color:var(--acc);font-weight:600}
.sub{color:var(--dim);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.f label{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}.f label b{color:var(--ink);font-weight:600;font-family:var(--mono)}
.u{color:var(--dim);font-size:11px}
table{border-collapse:collapse;width:100%}th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--dim);font-weight:500}td input{min-width:70px}
.tw{overflow-x:auto}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font:13px/1.5 var(--mono);overflow:auto;margin:0;white-space:pre}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11.5px;border:1px solid}
.ERROR{color:var(--err);border-color:var(--err)}.WARNING{color:var(--warn);border-color:var(--warn)}.INFO{color:var(--acc);border-color:var(--acc)}.PASS{color:var(--ok);border-color:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 16px}.kv span:nth-child(odd){color:var(--dim)}.kv span:nth-child(even){font-family:var(--mono)}
.issue{border-left:3px solid var(--line);padding:6px 10px;margin-bottom:8px;background:var(--panel)}
.issue.ERROR{border-left-color:var(--err)}.issue.WARNING{border-left-color:var(--warn)}.issue.INFO{border-left-color:var(--acc)}
.issue div{color:var(--dim);font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:21;overflow:auto;padding:14px 16px;animation:dr .16s ease-out}
@keyframes dr{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer h3{margin-top:14px}.opt{display:block;width:100%;text-align:left;margin-bottom:6px;padding:7px 10px}
.opt.cur{border-color:var(--acc);background:#22394a}.opt small{display:block;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips button.cur{border-color:var(--acc);background:#22394a}
.todo{color:var(--dim)}.dis{color:var(--err);font-weight:600}.z{color:var(--line)}
@media(max-width:1100px){body{grid-template-columns:auto minmax(0,1fr) 380px}}

.vrow{display:grid;grid-template-columns:96px 150px 70px minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.vrow.radiorow{grid-template-columns:110px minmax(0,1fr);align-items:start}
.radios{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:4px}
.radios label{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.radios input{width:auto}
.customval{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.customval input{max-width:110px}
.vrow label{font-family:var(--mono);cursor:help}.vrow .d{color:var(--dim);font-size:12px;white-space:normal}
.vrow input,.vrow select{width:100%}.settings-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.settings-tools a{color:var(--acc)}details{border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:10px}
details summary{padding:8px 12px;cursor:pointer;font-weight:600}.settings-group{padding:4px 14px 10px}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"h" "m" "s"}nav{position:absolute;z-index:5;height:calc(100% - 90px);top:45px;left:0}aside#live{position:fixed;inset:45px 0 0 0;z-index:6;width:auto}body.nolive{grid-template-columns:1fr;grid-template-areas:"h" "m" "s"}}

/* 4.html-style Potentials tab */
.p4table{min-width:1180px}.p4table th{position:sticky;top:0;background:var(--panel);z-index:1}.p4table input,.p4table select{min-width:72px}.p4table .extra{min-width:180px}.p4sel td{background:#1d2a35}.p4plot{width:100%;height:360px;display:block;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.p4defgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.p4defgrid canvas,#p4defmap,#p4defff{width:100%;display:block;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
@media (max-width:760px){.p4defgrid{grid-template-columns:1fr}}.p4legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.p4legend label{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:12px}.p4legend input{width:auto}.p4formula{white-space:normal;line-height:1.45}

.page-symbol{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;margin-right:7px;vertical-align:-5px;border:1px solid var(--acc);border-radius:7px;background:var(--panel2)}.page-symbol svg{width:17px;height:17px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.page-symbol .dot{fill:var(--warn);stroke:none}

.outdrop-active{background:var(--panel2)!important;border-color:var(--ok)!important}.output-table th button{font-weight:600}
.output-allplot{width:100%;height:460px;display:block;border:1px solid var(--line);border-radius:4px;background:var(--bg);margin-top:10px}
#outputDrop input[type=file]{padding:8px}.output-analysis-card{margin-bottom:10px}

/* ─── EXFOR + Experimental-vs-Theory integration in FRESCO Experimental Data ─── */
.exfor-panel{border-left:3px solid var(--acc);background:linear-gradient(135deg,#18232d,#1b2732)}
.exfor-help{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin-bottom:10px}
.exfor-convention{color:var(--dim);font-size:12px;line-height:1.55}
.exfor-convention b{color:var(--acc)}
.exfor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.exfor-grid .f{min-width:0}
.exfor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.exfor-list{max-height:280px;overflow:auto;border:1px solid var(--line);margin-top:9px;background:var(--bg)}
.exfor-list table{margin:0}
.exfor-list th,.exfor-list td{font-size:12px}
.exfor-meta{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin-top:8px;font-size:12.5px;color:var(--ink);line-height:1.55}
.exfor-meta-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.exfor-meta-row:last-child{border-bottom:none}
.exfor-meta-label{color:var(--acc);font-weight:700;min-width:145px;font-family:var(--mono);font-size:11px}
.exfor-meta-value{color:var(--ink)}
.exfor-meta-value.ok{color:var(--ok);font-weight:600}
.exfor-dataset-hint{margin-top:7px;padding:7px 10px;border-left:3px solid var(--warn);background:rgba(217,164,65,.06);color:var(--ink);font-size:12px;line-height:1.5}
.exfor-dataset-hint b{color:var(--warn)}
.exfor-radio{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--acc);font-weight:600}
.exfor-radio input{width:auto}
.exfor-tag{display:inline-block;padding:2px 6px;margin:2px 4px 2px 0;border-radius:3px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:11px}
.exfor-lib{background:var(--panel2);border:1px solid var(--line);border-radius:5px;margin-top:10px;padding:10px 12px}
.exfor-lib-head{font-size:12.5px;color:var(--acc);font-weight:700;margin-bottom:6px}
.exfor-lib-rows{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.exfor-lib-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:12px;color:var(--ink)}
.exfor-lib-row button{flex-shrink:0}
.exfor-plot-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.exfor-plot-controls .u{white-space:nowrap}
.exfor-plot-controls select{width:auto;min-width:100px}
.exfor-scale-on{border-color:var(--acc)!important;background:var(--panel2)!important}
#exTheoryPlot{width:100%;height:560px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.exfor-plot-controls select{width:auto;min-width:100px}
@media(max-width:700px){.exfor-grid{grid-template-columns:1fr}.exfor-wide{grid-column:span 1}.exfor-meta-label{min-width:115px}}

</style><style id="output-display-controls-size">
.output-display-controls-head,
.output-display-controls-cell,
.output-display-controls-cell button,
.output-action-head,
.output-action-cell,
.output-action-cell button { font-size: 0.88em; }
</style>

<script>
"use strict";
/* ============================================================
   Step 1 skeleton. Flat, module-per-object layout.

            FrescoGenerator, ValidationEngine, UI.

const GROUPS=['Radial coordinates','Partial waves','Angular distributions','Coupled equations','Incident channel','Solving equations','R-matrix setup','Trace variables','Output details'];
const R=(g,n,t,u,d,b,def)=>({g,n,t,u,d,b:!!b,def:def===undefined?'':def});
const FRESCO_VARS=[
R(0,'hcm','r','fm','Radial step: wave functions are computed at multiples of HCM out to |RMATCH|.',1),
R(0,'rmatch','r','fm','Matching radius. If negative, coupled Coulomb wave functions (RASYM, ACCRCY, SWITCH, AJSWITCH) are used beyond |RMATCH|.',1),
R(0,'rintp','r','fm','Interval in R_f at which non-local kernels are calculated (rounded to a multiple of HCM).',1),
R(0,'hnl','r','fm','Step in the non-local range D_fi (rounded to a multiple or sub-multiple of HCM).'),
R(0,'rnl','r','fm','Range of the non-local coordinate D_fi, centred at CENTRE.'),
R(0,'centre','r','fm','Centre of the non-local range RNL.'),

R(0,'rsp','r','fm','Upper limit of state radius when folding single-particle states (bound states or bins) with KIND=3 or 4 couplings.'),
R(0,'cutl','r','','Radial points per l of the lower cutoff. CUTL>0 uses l=J, CUTL<0 uses l=L_in (better analyzing powers). Default -1.6.',0,'-1.6'),
R(0,'cutr','r','fm','Lower radial cutoff: Rmin=max(CUTL*l*HCM,CUTR). If CUTR<0 the cutoff sits |CUTR| fm beyond the point-Coulomb turning point.'),
R(0,'cutc','r','fm','Lower radial cutoff for off-diagonal couplings.'),
R(0,'rasym','r','fm / deg','Asymptotic radius for coupled Coulomb wave functions; if <0, chosen so classical trajectories reach |RASYM| degrees.'),

R(0,'ajswtch','r','','Coupled Coulomb wfns are matched to zero (Numerov omitted) for J>=AJSWTCH when closest approach is >4.5 fm outside |RMATCH|. Default 0.',0,'0'),

/* ---------- FrescoEgrid: parse/expand native FRESCO ELAB(i:j)=.. NLAB(i:j)=.. energy-grid syntax ----------
   FRESCO lets ELAB carry several anchor energies (via scalar, single-index or array-slice keys) and NLAB
   give, for each gap between consecutive anchors, the number of linear intervals FRESCO itself steps through
   (NLAB(i)=1 means no interpolation: just the two anchor values; NLAB(i)=n>1 inserts n-1 intermediate points).
   This lets the Reaction Setup / Observables "fresco format" energy type accept exactly the syntax used in
   real FRESCO decks, e.g.:
     elab(1:2)=0.1 6.0   nlab(1:1)=1000
     elab(1:3)=6.9 11.00 49.350  nlab(1:3)=1 1
*/
const FrescoEgrid = {
  // Pull every numeric token following each ELAB/NLAB keyword (scalar, (n) or (i:j) form), in document order.
  parse(text){
    const re=/(elab|nlab)\s*(?:\([^)]*\))?\s*=/gi;
    const hits=[]; let m;
    while((m=re.exec(text||""))) hits.push({kw:m[1].toLowerCase(), matchStart:m.index, valStart:re.lastIndex});
    const elab=[], nlab=[];
    hits.forEach((h,i)=>{
      const segEnd = i+1<hits.length ? hits[i+1].matchStart : (text||"").length;
      let seg=(text||"").slice(h.valStart, segEnd).replace(/\//g," ");
      seg.split(/[\s,]+/).filter(Boolean).forEach(tok=>{ const v=Number(tok); if(Number.isFinite(v)) (h.kw==="elab"?elab:nlab).push(v); });
    });
    return {elab,nlab};
  },
  // Expand anchors+interval-counts into the full list of lab energies FRESCO will run.
  grid(elab,nlab){
    if(!elab||!elab.length) return [];
    if(elab.length===1) return [elab[0]];
    const gaps=elab.length-1, out=[elab[0]];
    for(let i=0;i<gaps;i++){
      const n=(nlab&&nlab[i]>0)?Math.round(nlab[i]):1, a=elab[i], b=elab[i+1];
      for(let j=1;j<=n;j++) out.push(+(a+(b-a)*j/n).toPrecision(10));
    }
    return out;
  },
  energies(text){ const {elab,nlab}=this.parse(text); return this.grid(elab,nlab); }
};

/* ---------- Physics: kinematics + automatic numerical estimates ---------- */
const Physics = {
  derive(p){
    const R=p.reaction, mp=R.proj.mass, mt=R.targ.mass, Z1=R.proj.Z, Z2=R.targ.Z;
    const M=mp+mt;
    // Non-relativistic kinematics (stated explicitly in UI).
    const Elab = R.eMode==="lab" ? R.energy : R.energy*M/mt;
    const Ecm  = R.eMode==="cm"  ? R.energy : R.energy*mt/M;
    const mu   = mp*mt/M;                                   // amu
    const k    = Math.sqrt(Math.max(0,2*mu*C.amu*Ecm))/C.hbarc; // fm^-1
    const eta  = k>0 ? Z1*Z2*C.alpha*mu*C.amu/(C.hbarc*k) : 0;  // Sommerfeld parameter
    const vcm  = k>0 ? C.hbarc*k/(mu*C.amu) : 0;            // v/c (NR)
    const N=p.numerics, r0=N.r0, a=0.65;                     // a: typical surface diffuseness (fm)
    const Rn = r0*(Math.cbrt(mp)+Math.cbrt(mt));             // R = r0(Ap^1/3 + At^1/3)
    const Vc = Z1*Z2*C.e2/Rn;                                // Coulomb barrier at R
    const sub = Ecm<=Vc;
    // Grazing L with Coulomb-corrected radius: Lg = k R sqrt(1 - Vc/Ecm)
    const Lg = sub ? 0 : k*Rn*Math.sqrt(1-Vc/Ecm);
    // Safety margin: diffuse-edge tail exp(-dL/(k a)) ~ tol  =>  dL = k a ln(1/tol)
    const dL = Math.max(5, Math.ceil(k*a*Math.log(1/N.tol)));
    const lmax = Math.ceil(Lg+dL);
    const hcm = Math.min(0.1, Math.max(0.02, Math.round((2*Math.PI/Math.max(k,1e-6)/40)/0.005)*0.005)); // ~40 points/wavelength
    // Coulomb turning point for L=lmax: rt=(eta+sqrt(eta^2+L(L+1)))/k
    const rt = k>0 ? (eta+Math.sqrt(eta*eta+lmax*(lmax+1)))/k : 0;
    const rmatch = Math.ceil(Math.max(Rn+12, rt+8)/5)*5;
    const rintp = Math.min(0.5, Math.max(0.1, 2*hcm));
    const jtmax = lmax + Math.ceil(R.proj.spin+R.targ.spin);
    return {Elab,Ecm,mu,k,eta,vcm,Rn,Vc,sub,Lg,dL,lmax,hcm,rmatch,rintp,jtmax,jtmin:0,rmin:0};
  },
  // All lab energies to write to &FRESCO, converted from E_lab/E_cm mode; single value, a range, or a list.
  energies(p){ const R=p.reaction;
    // "fresco format" is written directly in ELAB/NLAB terms (already lab-frame energies), so it bypasses
    // the E_lab/E_cm toggle entirely: what the user typed is what gets expanded and written.
    if(R.eKind==="fresco") return FrescoEgrid.energies(R.eFrescoText||"");
    const M=R.proj.mass+R.targ.mass, toLab=e=>R.eMode==="lab"?e:e*M/R.targ.mass; let vals;
    if(R.eKind==="range"){ const {start,stop,step}=R.eRange; vals=[]; if(step>0&&stop>=start)for(let v=start;v<=stop+1e-9;v+=step)vals.push(+v.toPrecision(10)); }
    else if(R.eKind==="list"){ vals=(R.eListText||"").split(/[\s,;]+/).filter(Boolean).map(Number).filter(x=>Number.isFinite(x)); }
    else vals=[R.energy];
    return vals.map(toLab); },
  // Numerical values actually used for output (auto or manual)
  used(p){ const d=this.derive(p), m=p.numerics.manual;
    return p.numerics.mode==="auto"
      ? {hcm:d.hcm,rmatch:d.rmatch,rintp:d.rintp,rmin:d.rmin,jtmin:d.jtmin,jtmax:d.jtmax,maxl:d.lmax}
      : {hcm:m.hcm,rmatch:m.rmatch,rintp:m.rintp,rmin:m.rmin,jtmin:m.jtmin,jtmax:m.jtmax,maxl:d.lmax}; }
};

/* ---------- FrescoGenerator ---------- */
const Gen = {
  f(x){ return (+x).toPrecision(9).replace(/\.?0+$/,"").replace(/\.?0+e/,"e") || "0"; },
  q(s){ return "'"+String(s).replace(/'/g,"''")+"'"; },
  build(p, comments=(p.meta&&p.meta.comments===1)){
    const d=Physics.derive(p), u=Physics.used(p), f=this.f, L=[], N=p.numerics;
    L.push(p.meta.title||`${p.meta.name}: ${p.reaction.proj.name}+${p.reaction.targ.name}  E_lab=${f(d.Elab)} MeV`);
    L.push("NAMELIST");
    if(comments){ L.push(`! generated by FRESCO Input Builder; project=${p.meta.name}; author=${p.meta.author||"-"}; date=${p.meta.date}; target FRESCO ${p.meta.version}`);
      if(p.meta.notes)L.push("! notes: "+String(p.meta.notes).split("\n")[0]); if(p.meta.refs)L.push("! references: "+String(p.meta.refs).split("\n")[0]);
      L.push(`! E_lab=${f(d.Elab)} MeV  E_cm=${f(d.Ecm)} MeV (non-relativistic)`); }
    L.push("&FRESCO");
    // Emit the complete structured &FRESCO store. Managed ELAB/NLAB are written
    // by the Reaction view; every other documented variable is preserved here.
    const ff=(p.fresco&&p.fresco.fields)||{};
    const lines=[];
    FRESCO_VARS.filter(v=>v.t!=="m").forEach(v=>{
      const val=ff[v.n];
      if(val===undefined||val===null||String(val).trim()==="") return;
      if(v.t==="b"){
        const s=String(val).toLowerCase();
        lines.push(` ${v.n}=${(s==="1"||s==="true"||s==="t")?"T":"F"}`);
      } else {
        lines.push(` ${v.n}=${String(val).trim()}`);
      }
    });
    // Keep legacy verbatim extras, but do not duplicate variables already represented above.
    const fx=(p.frescoExtra||p.fresco&&p.fresco.extra||"").trim();
    if(fx) lines.push(" "+fx);
    if(p.reaction.eKind==="fresco"){
      // Written verbatim (FRESCO does its own NLAB interpolation at run time) rather than expanded,
      // so a 1000-interval grid doesn't turn into a thousand elab(i)= lines. Strip any trailing '/' the
      // user included — the closing '/' of this &FRESCO group is appended separately below.
      const raw=String(p.reaction.eFrescoText||"").trim().replace(/\/\s*$/,"");
      lines.push(raw?raw.split(/\n/).map(l=>" "+l.trim()).join("\n"):` elab(1)=${f(d.Elab)}`);
    } else {
      const Es=Physics.energies(p);
      if(Es.length<=1) lines.push(` elab(1)=${f(d.Elab)}`);
      else lines.push(Es.map((e,i)=>` elab(${i+1})=${f(e)}`).join("\n"));
    }
    L.push(lines.join("\n"));
    L.push("/");
    p.partitions.forEach(pt=>{
      L.push(`&PARTITION namep=${this.q(pt.name)} massp=${f(pt.massp)} zp=${f(pt.zp)} namet=${this.q(pt.namet)} masst=${f(pt.masst)} zt=${f(pt.zt)} qval=${f(pt.qval)} nex=${pt.states.length}`+["pwf","readstates","prmax","lpmax","mixpot"].filter(k=>pt.x&&pt.x[k]!=null&&pt.x[k]!=="").map(k=>` ${k}=${pt.x[k]}`).join("")+(pt.extra?" "+pt.extra:"")+" /");
      pt.states.forEach(s=>L.push(`&STATES jp=${f(s.jp)} bandp=${s.bp} ep=${f(s.ep)} cpot=${s.cpot} jt=${f(s.jt)} bandt=${s.bt} et=${f(s.et)}`+(s.extra?" "+s.extra:"")+" /"));
    });
    L.push("&partition /");
    p.potentials.forEach(v=>{
      if(v.kind==="coulomb") L.push(`&POT kp=${v.kp} ap=${f(v.ap)} at=${f(v.at)} rc=${f(v.rc)}`+(v.extra&&v.extra.trim()?" "+v.extra.trim():"")+" /");
      else { L.push(`&POT kp=${v.kp} type=${v.type} shape=${v.shape}`+v.p.map((x,n)=>(n<6||+x!==0)?` p${n+1}=${f(x)}`:"").join("")+(v.extra&&v.extra.trim()?" "+v.extra.trim():"")+" /");
        if(v.type>=12&&v.type<=17&&(v.steps||[]).length){ v.steps.forEach(st=>L.push(`&step ib=${st.ib} ia=${st.ia} k=${st.k} str=${f(st.str)} /`)); L.push("&step /"); } }
    });
    L.push("&pot /");
    const rb=p.rawBlocks||[], emit=n=>rb.filter(b=>b.name===n).forEach(b=>L.push(`&${b.name.toUpperCase()} ${b.raw} /`));
    const blk=(n,arr)=>(arr||[]).forEach(b=>L.push(`&${n} ${b.pairs.map(q=>q.key+"="+q.val).join(" ")} /`));
    blk("OVERLAP",p.overlaps); emit("overlap"); L.push("&overlap /"); emit("twont"); emit("twnt"); blk("COUPLING",p.couplings); emit("coupling"); L.push("&coupling /");
    if(rb.some(b=>b.name==="cfp")){ emit("cfp"); L.push("&cfp /"); }
    rb.filter(b=>!["overlap","twont","twnt","coupling","cfp"].includes(b.name)).forEach(b=>L.push(`&${b.name.toUpperCase()} ${b.raw} /`));
    return L.join("\n")+"\n";
  }
};

  num(v){ v=v.trim(); return /^[-+]?(\d+\.?\d*|\.\d+)([eEdD][-+]?\d+)?$/.test(v)?parseFloat(v.replace(/[dD]/,"e")):NaN; },
  str(v){ const m=v.trim().match(/^'((?:[^']|'')*)'$|^"((?:[^"]|"")*)"$/); return m?(m[1]!==undefined?m[1].replace(/''/g,"'"):m[2].replace(/""/g,'"')):null; },
  // "key = value(s)" pairs; quoted text is masked so '=' or '/' inside strings cannot split a pair
  pairs(raw){ const masked=raw.replace(/'(?:[^']|'')*'|"(?:[^"]|"")*"/g,m=>"x".repeat(m.length));
    const re=/([A-Za-z_][A-Za-z0-9_]*(?:\s*\([^)]*\))?)\s*=/g, hits=[]; let m;
    while((m=re.exec(masked)))hits.push({key:m[1].replace(/\s+/g,"").toLowerCase(),ks:m.index,vs:m.index+m[0].length});
    return hits.map((h,n)=>{ const end=n+1<hits.length?hits[n+1].ks:raw.length, cut=x=>x.trim().replace(/,\s*$/,"");

    return {n,edges,bad,comp:par.map((_,i)=>f(i))}; }
};

/* ---------- ValidationEngine: every message has level/location/problem/explanation/fix ---------- */
const Validator = {
  run(p){
    const out=[], add=(level,loc,problem,expl,fix)=>out.push({level,loc,problem,expl,fix});
    const R=p.reaction, d=Physics.derive(p), u=Physics.used(p);
    const halfInt=x=>Number.isFinite(x)&&Math.abs(2*x-Math.round(2*x))<1e-9&&x>=0;
    [["proj",R.proj],["targ",R.targ]].forEach(([k,o])=>{
      if(!(o.mass>0)) add("ERROR",`reaction.${k}`,"Mass must be positive",`mass = ${o.mass} amu`);
      if(!(o.Z>=0)||!Number.isInteger(o.Z)) add("ERROR",`reaction.${k}`,"Charge must be a non-negative integer",`Z = ${o.Z}`);
      if(!halfInt(o.spin)) add("ERROR",`reaction.${k}`,"Spin must be a non-negative integer or half-integer",`spin = ${o.spin} ħ`);
      if(Math.abs(o.parity)!==1) add("ERROR",`reaction.${k}`,"Parity must be +1 or −1","");
    });
    if(R.eKind==="single"){ if(!(R.energy>0)) add("ERROR","reaction.energy","Energy must be positive",`E = ${R.energy} MeV`); }
    else if(R.eKind==="range"){ const {start,stop,step}=R.eRange; if(!(start>0)) add("ERROR","reaction.eRange","Range start must be positive",""); if(!(stop>=start)) add("ERROR","reaction.eRange","Range stop must be ≥ start",""); if(!(step>0)) add("ERROR","reaction.eRange","Range step must be positive",""); else if(step>0&&stop>=start&&(stop-start)/step>200) add("ERROR","reaction.eRange","Too many energies (> 200)",""); }
    else if(R.eKind==="list"){ const vals=Physics.energies(p); if(!vals.length) add("ERROR","reaction.eListText","Energy list is empty or unreadable",""); else if(vals.some(v=>!(v>0))) add("ERROR","reaction.eListText","Every energy must be positive",""); else if(vals.length>200) add("ERROR","reaction.eListText","Too many energies (> 200)",""); }
    else if(R.eKind==="fresco"){ const vals=Physics.energies(p); if(!vals.length) add("ERROR","reaction.eFrescoText","Could not find any elab(...)= values in the fresco-format text",""); else if(vals.some(v=>!(v>0))) add("ERROR","reaction.eFrescoText","Every energy must be positive",""); else if(vals.length>2000) add("ERROR","reaction.eFrescoText","Too many energies (> 2000) — reduce the NLAB interval counts",""); }
    if(d.sub) add("INFO","reaction.energy","Sub-barrier energy",`E_cm=${Gen.f(d.Ecm)} MeV ≤ Coulomb barrier estimate ${Gen.f(d.Vc)} MeV; grazing L set to 0.`);
    if(u.rmin>=u.rmatch) add("ERROR","numerics","rmin ≥ rmatch",`rmin=${u.rmin}, rmatch=${u.rmatch} fm`,{label:`Set rmin = 0`,path:"numerics.manual.rmin",value:0});
    if(u.rmatch<d.Rn+5) add("WARNING","numerics.rmatch","rmatch is close to the nuclear radius",`R≈${Gen.f(d.Rn)} fm, rmatch=${u.rmatch} fm`,{label:`Use auto estimate ${d.rmatch} fm`,path:"numerics.manual.rmatch",value:d.rmatch});
    if(u.hcm*d.k>0.25) add("WARNING","numerics.hcm","hcm may be too large",`k·hcm=${Gen.f(u.hcm*d.k)} (want ≲0.25); wavelength 2π/k=${Gen.f(2*Math.PI/d.k)} fm`,{label:`Use auto estimate ${d.hcm} fm`,path:"numerics.manual.hcm",value:d.hcm});
    if(p.numerics.mode==="manual"&&u.jtmax<d.lmax) add("WARNING","numerics.jtmax","jtmax may be insufficient",`Estimated grazing L=${Gen.f(d.Lg)}; suggested Lmax≥${d.lmax}, current jtmax=${u.jtmax}`,{label:`Set jtmax = ${d.jtmax}`,path:"numerics.manual.jtmax",value:d.jtmax});
    { const FF=(p.fresco&&p.fresco.fields)||{}; if(!(+FF.thmax>+FF.thmin)||!(+FF.thinc>0)) add("ERROR","fresco.fields.angles","Invalid angular range","need thmax > thmin and thinc > 0"); }
    if(!p.partitions.length) add("ERROR","partitions","No partition defined","FRESCO needs at least one partition (entrance channel).");
    const kps=new Set(p.potentials.map(v=>v.kp));
    p.partitions.forEach((pt,i)=>{
      const loc=`partitions.${i}`;
      if(!(pt.massp>0&&pt.masst>0)) add("ERROR",loc,"Partition masses must be positive","");
      if(!pt.states.length) add("ERROR",loc,"Partition has no states","Add at least the ground state.");
      const seen=new Set();
      pt.states.forEach((s,j)=>{
        if(!halfInt(s.jp)||!halfInt(s.jt)) add("ERROR",`${loc}.states.${j}`,"Invalid spin","jp, jt must be non-negative (half-)integers");
        if(Math.abs(s.bp)!==1||Math.abs(s.bt)!==1) add("ERROR",`${loc}.states.${j}`,"Parity must be ±1","");
        if(s.ep<0) add("WARNING",`${loc}.states.${j}`,"Negative projectile excitation energy",`ep = ${s.ep} MeV; excitation energies are normally ≥ 0 MeV.`,{label:"Set ep = 0",path:`partitions.${i}.states.${j}.ep`,value:0});
        if(s.et<0) add("WARNING",`${loc}.states.${j}`,"Negative target excitation energy",`et = ${s.et} MeV; excitation energies are normally ≥ 0 MeV.`,{label:"Set et = 0",path:`partitions.${i}.states.${j}.et`,value:0});
        if(!kps.has(s.cpot)) add("ERROR",`${loc}.states.${j}`,`cpot=${s.cpot} refers to no potential set`,`Defined kp values: ${[...kps].join(", ")||"none"}`);
        const key=[s.jp,s.bp,s.ep,s.jt,s.bt,s.et].join("|"); if(seen.has(key)) add("WARNING",`${loc}.states.${j}`,"Duplicate state","Identical quantum numbers and energies as another state."); seen.add(key);
      });
    });
    if(!p.potentials.length) add("ERROR","potentials","No potentials defined","");
    { const n=p.partitions.length, G=Graph.build(p), seen=new Map();
      (p.overlaps||[]).forEach((b,i)=>{ const loc=`overlaps.${i}`;
        if(!b.pairs.length) add("WARNING",loc,"Empty &OVERLAP block","");
        { const kv=Graph.get(b,"kind"); if(kv!==undefined){ const km=Graph.int(kv); if(km===null) add("ERROR",loc,"kind is not an integer",`kind=${kv}`);
          else if(!OVERLAP_KIND[km]) add("INFO",loc,`kind=${km} is not one of the documented one/two-particle values (0–4, 6, 7, 9)`,"Written as given — check it against the FRESCO manual.");
          else if(OVERLAP_KIND[km].impl===false) add("WARNING",loc,`kind=${km} (${OVERLAP_KIND[km].name}) is documented as not yet implemented`,"The FRESCO manual marks transfers using this KIND as not yet implemented for transfers."); } }
        ["ic1","ic2"].forEach(k=>{ const v=Graph.get(b,k); if(v===undefined)return; const m=Graph.int(v);
          if(m===null) add("ERROR",loc,`${k} is not an integer`,`${k}=${v}`); else if(m<1||m>n) add("WARNING",loc,`${k}=${m} refers to no partition`,`${n} partition(s) defined`); });
        const kb=Graph.get(b,"kbpot"); if(kb!==undefined){ const m=Graph.int(kb); if(m!==null&&!p.potentials.some(v=>v.kp===m)) add("WARNING",loc,`kbpot=${m} matches no potential kp`,`kbpot normally references a &POT kp. Defined kp: ${[...new Set(p.potentials.map(v=>v.kp))].join(", ")||"none"}`); }
        const k1=Graph.get(b,"kn1"); if(k1!==undefined){ if(seen.has(k1)){ const used=new Set((p.overlaps||[]).map(o=>Graph.get(o,"kn1")).filter(x=>x!==undefined).map(Number)); let nv=1; while(used.has(nv))nv++;
          const pidx=b.pairs.findIndex(x=>x.key==="kn1"); add("WARNING",loc,`kn1=${k1} used by overlap ${seen.get(k1)+1} as well`,"If kn1 is the overlap index, the later block overwrites the earlier one.",pidx>=0?{label:`Renumber to kn1=${nv}`,path:`overlaps.${i}.pairs.${pidx}.val`,value:String(nv)}:undefined); } else seen.set(k1,i); } });
      (p.couplings||[]).forEach((b,i)=>{ const loc=`couplings.${i}`;
        if(!b.pairs.length) add("WARNING",loc,"Empty &COUPLING block","");
        { const kv=Graph.get(b,"kind"); if(kv!==undefined){ const km=Graph.int(kv); if(km===null) add("ERROR",loc,"kind is not an integer",`kind=${kv}`);
          else if(!COUPLING_KIND[km]) add("INFO",loc,`kind=${km} is not one of the documented values (1–8)`,"Written as given — check it against the FRESCO manual."); } }
        ["icto","icfrom"].forEach(k=>{ const v=Graph.get(b,k); if(v===undefined) return add("INFO",loc,`${k} not given`,"Partition references could not be read for this block."); const m=Graph.int(v);
          if(m===null) add("ERROR",loc,`${k} is not an integer`,`${k}=${v}`); else if(m>n||m===0) add("WARNING",loc,`${k}=${m} refers to no partition`,`${n} partition(s) defined`); }); });
      if(n>1){ if(G.bad.length) add("INFO","couplings","Connectivity not checked",`${G.bad.length} coupling block(s) have partition references that could not be read.`);
        else G.comp.forEach((c,k)=>{ if(k>0&&c!==G.comp[0]) add("WARNING",`partitions.${k}`,`Partition ${k+1} is not linked to partition 1 by any coupling`,"It cannot be populated from the entrance channel through the parsed couplings."); }); } }
    if((p.rawBlocks||[]).length) add("INFO","rawBlocks",`${p.rawBlocks.length} namelist block(s) preserved verbatim (${[...new Set(p.rawBlocks.map(b=>"&"+b.name.toUpperCase()))].join(", ")})`,"No editor yet; contents are written back unchanged and are not validated.");
    p.potentials.forEach((v,i)=>{ const loc=`potentials.${i}`;
      if(!Number.isInteger(v.kp)||v.kp<1) add("ERROR",loc,"kp must be a positive integer","kp labels the potential set referenced by cpot.");
      if(v.kind==="coulomb"){ if(!(v.ap>0&&v.at>0)) add("ERROR",loc,"Coulomb ap, at must be positive masses",""); if(!(v.rc>=0)) add("ERROR",loc,"rc must be ≥ 0 fm",""); return; }
      if(!Number.isInteger(v.type)||v.type<1) add("ERROR",loc,"type must be an integer ≥ 1 (type 0 is the Coulomb entry)","");
      if(!Number.isInteger(v.shape)||v.shape<0) add("ERROR",loc,"shape must be an integer ≥ 0","");
      if(v.type>=1&&v.type<=4&&v.shape<=1){
        if(!(v.p[2]>0)&&(v.p[0]!==0)) add("ERROR",loc,"Real diffuseness a must be positive",`p3 = ${v.p[2]} fm`);
        if(!(v.p[5]>0)&&v.p[3]!==0) add("ERROR",loc,"Imaginary diffuseness aW must be positive when W ≠ 0",`p6 = ${v.p[5]} fm`);
      }
      if(!POTTYPES[v.type]) add("INFO",loc,`type ${v.type} is not in the builder catalog`,"Values are written verbatim; check the manual for the meaning of p1–p7.");
    });
    return out;
  },
  checklist(p,issues){
    const n=k=>issues.some(i=>i.level==="ERROR"&&i.loc.startsWith(k));
    return [["Reaction defined",!n("reaction")],["Projectile defined",p.reaction.proj.name.trim()!==""&&p.reaction.proj.mass>0],["Target defined",p.reaction.targ.name.trim()!==""&&p.reaction.targ.mass>0],
            ["Partitions valid",p.partitions.length>0&&!n("partitions")],["States valid",p.partitions.every(pt=>pt.states.length>0)&&!issues.some(i=>i.level==="ERROR"&&/\.states\./.test(i.loc))],
            ["Potentials assigned",p.potentials.length>0&&!n("potentials")],["Couplings valid",!n("couplings")&&!n("overlaps")],
            ["Numerical parameters defined",!n("numerics")],["Output requested",!issues.some(i=>i.loc==="numerics.angles")],
            ["No syntax errors",true]];
  }
};

function outputRebuild(){

  // are especially useful because FRESCO uses them for results arranged by
  // incident energy. They can therefore supply the legend energy when the
  // plotted fort file itself does not repeat E_lab in its header.
  const related=[];
  outputFiles.forEach(f=>{
    const n=outFileHint(f.name).number;
    const es=(f.result&&f.result.energies)||[];
    const ei=(f.result&&f.result.energyInfo)||[];
    if(es.length) related.push({name:f.name,number:n,energies:es,energyInfo:ei});
  });
  const priority=related.filter(x=>x.number===39||x.number===40);
  const fallback=related.filter(x=>x.number!==39&&x.number!==40);
  const pools=[...priority,...fallback];
  outputDatasets.forEach(d=>{
    const own=(d.meta&&d.meta.energies)||[];
    if(own.length===1){d.meta.energy=own[0];return;}
    // If the dataset has a multi-energy source, map by its parsed block index.

    // for a multi-energy fort.39/40, match the dataset block index.

      const bi=Number.isInteger(d.meta?.blockIndex)?d.meta.blockIndex:-1;

function outputStats(d){
  if(!d||d.kind==="run"||!d.rows.length)return "";
  const nums=(key)=>d.rows.map(r=>+r[key]).filter(Number.isFinite);
  let x=[],y=[];
  if(d.kind==="cross"){x=d.rows.map(r=>+r.x);y=d.rows.map(r=>+r.y);}
  else if(d.kind==="potential"){x=d.rows.map(r=>+r.r);y=d.rows.map(r=>+r.real);}
  else if(d.kind==="wave"){x=d.rows.map(r=>+r.r);y=d.rows.map(r=>+r.abs);}
  else if(d.kind==="smatrix"){const hasJtot=outputSmatrixHasJtot(d),field=hasJtot?outputSmatrixXField(d):"L";x=d.rows.map(r=>+(hasJtot?r[field]:r.L));y=d.rows.map(r=>+r.re);}
  else if(d.kind==="phase"){x=d.rows.map(r=>+r.x);y=d.rows.map(r=>+r.phase);}
  else if(d.kind==="sfactor"){x=d.rows.map(r=>+r.energy);y=d.rows.map(r=>+r.S);}
  else if(d.kind==="reactionxs"){const c=d.columns;x=d.rows.map(r=>+r[c[0]]);y=d.rows.map(r=>+r[c[c.length-2]]);}
  else if(d.kind==="fusionxs"){const c=d.columns;x=d.rows.map(r=>+r[c[0]]);y=d.rows.map(r=>+r[c[1]]);}
  else return "";
  const yy=y.filter(Number.isFinite); if(!yy.length)return "";
  const mn=Math.min(...yy),mx=Math.max(...yy),mean=yy.reduce((a,b)=>a+b,0)/yy.length;
  const er=x.filter(Number.isFinite), xr=er.length?`${F(Math.min(...er))} – ${F(Math.max(...er))}`:"—";
  let extra="";
  if(d.kind==="cross"){
    const pairs=d.rows.filter(r=>Number.isFinite(+r.x)&&Number.isFinite(+r.y)).sort((a,b)=>a.x-b.x);
    if(pairs.length>=2 && /angle|theta/i.test(d.columns[0])){
      let integ=0;
      for(let i=1;i<pairs.length;i++){const a=pairs[i-1],b=pairs[i],fa=a.y*Math.sin(a.x*Math.PI/180),fb=b.y*Math.sin(b.x*Math.PI/180);integ+=0.5*(fa+fb)*(b.x-a.x)*Math.PI/180*2*Math.PI;}
      extra+=`<span>∫σ dΩ <b>${F(integ)} mb</b></span>`;
    }
    const imx=yy.indexOf(mx), peakx=er.length?d.rows.filter(r=>Number.isFinite(+r.y))[imx]?.x:null;
    if(peakx!=null)extra+=`<span>Peak <b>${F(peakx)}°</b> · ${F(mx)} mb/sr</span>`;
    const fw=d.rows.find(r=>Math.abs(+r.x)<1e-9&&Number.isFinite(+r.y)); if(fw)extra+=`<span>Forward <b>${F(fw.y)} mb/sr</b></span>`;
    const bw=d.rows.filter(r=>Number.isFinite(+r.x)&&Math.abs(+r.x-180)<1e-9&&Number.isFinite(+r.y))[0]; if(bw)extra+=`<span>Backward <b>${F(bw.y)} mb/sr</b></span>`;
  }
  if(d.kind==="reactionxs"){
    const c=d.columns;
    const sigA=d.rows.map(r=>+r[c[1]]).filter(Number.isFinite);
    const sigEl=d.rows.map(r=>+r[c[c.length-1]]).filter(Number.isFinite);
    if(sigA.length)extra+=`<span>\u03c3_A range <b>${F(Math.min(...sigA))} \u2013 ${F(Math.max(...sigA))} mb</b></span>`;
    if(sigEl.length)extra+=`<span>\u03c3_el range <b>${F(Math.min(...sigEl))} \u2013 ${F(Math.max(...sigEl))} mb</b></span>`;
    extra+=`<span>Min/Max/Mean above are for <b>\u03c3_tot</b></span>`;
  }
  if(d.kind==="fusionxs"){
    extra+=`<span>Min/Max/Mean above are for <b>\u03c3_f (fusion)</b></span>`;
    if((d.meta&&Number.isFinite(d.meta.ecm)))extra+=`<span>E_cm <b>${F(d.meta.ecm)} MeV</b></span>`;
  }
  return `<div class="kv"><span>Points</span><span>${d.rows.length}</span><span>Minimum</span><span>${F(mn)}</span><span>Maximum</span><span>${F(mx)}</span><span>Mean</span><span>${F(mean)}</span><span>Range</span><span>${xr}</span></div>${extra?`<div class="row" style="margin-top:8px">${extra}</div>`:""}`;
}

/* Google Sites / iframe-safe clipboard helper.
   navigator.clipboard is often unavailable inside embedded Google Sites frames.
   This helper first tries the modern API, then falls back to a temporary textarea
   and execCommand('copy'), which runs directly from the user's click gesture.
   No popup/alert is used. */
function copyToClipboard(text,label="Text"){
  text=String(text??"");
  const finish=(ok)=>{
    const el=document.createElement("div");
    el.textContent=ok?`${label} copied`:`Could not copy ${label.toLowerCase()} — select and copy the text manually.`;
    el.style.cssText="position:fixed;right:18px;bottom:48px;z-index:9999;padding:7px 11px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font:12px/1.3 var(--sans);box-shadow:0 4px 14px rgba(0,0,0,.25);";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1800);
  };
  const fallback=()=>{
    const ta=document.createElement("textarea");
    ta.value=text; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
    let ok=false;
    try{ ok=document.execCommand("copy"); }catch(_){ ok=false; }
    ta.remove();
    finish(ok);
    return ok;
  };
  try{
    if(navigator.clipboard&&typeof navigator.clipboard.writeText==="function"){
      const r=navigator.clipboard.writeText(text);
      if(r&&typeof r.then==="function") return r.then(()=>finish(true)).catch(fallback);
    }
  }catch(_){}
  fallback();
}

observables(){ const p=Model.p,FF=(p.fresco&&p.fresco.fields)||{}, thmin=+FF.thmin||0, thmax=+FF.thmax||0, thinc=+FF.thinc||0,

  const field=(v)=>{
    const path=`fresco.fields.${v.n}`, raw=val(v.n), t=v.t==="a"?"text":(v.t==="b"?"checkbox":(v.t==="i"||v.t==="r"?"number":"text"));

    return `<div class="vrow"><label title="${esc(v.n+": "+v.d+(v.def?" Default: "+v.def:""))}">${v.n}</label><input type="${t}" data-path="${path}" data-t="${t}" value="${esc(raw)}" ${v.t==="r"||v.t==="i"?'step="any"':""}><span class="u">${esc(v.u)}</span><span class="d">${esc(v.d)}${v.def?` <span class="u">Default: ${esc(v.def)}</span>`:""}</span></div>`;
  };

  const radioField=(v)=>{
    const opts=OBS_OPTIONS[v.n], path=`fresco.fields.${v.n}`, raw=val(v.n), name="rf_"+v.n;

   ${p.reaction.eKind==="single"?fld("reaction.energy",p.reaction.eMode==="lab"?"E_lab":"E_cm","MeV"):""}

   ${p.reaction.eKind==="fresco"?`<div class="f" style="margin-top:8px"><label><b>ELAB/NLAB (fresco format)</b> <span class="u">written verbatim into &amp;FRESCO; always lab-frame MeV</span></label><textarea rows="3" style="font-family:var(--mono,monospace);width:100%" data-t="text" data-path="reaction.eFrescoText" placeholder="elab(1:2)=0.1 6.0   nlab(1:1)=1000&#10;elab(1:3)=6.9 11.00 49.350  nlab(1:3)=1 1">${esc(p.reaction.eFrescoText)}</textarea><p class="u">NLAB(i) is the number of linear intervals FRESCO steps between anchor ELAB(i) and ELAB(i+1); NLAB=1 means no interpolation.</p></div>`:""}

// Add a potential or change the type/shape of an existing one; p1..p7 and kp are kept when both sides are generic.
function applyPotential(ds,t,sh){ const P=Model.p.potentials, R=Model.p.reaction;
  const name=t==="c"?"Coulomb":`${POTTYPES[t]||"type "+t}${POTSHAPES[sh]&&t<=4?" — "+POTSHAPES[sh]:""}`;
  const fresh=()=>t==="c"?{label:name,kind:"coulomb",kp:1,ap:R.proj.mass,at:R.targ.mass,rc:1.25,extra:""}
    :{label:name,kind:"generic",kp:1,type:t,shape:sh,p:t<=4?[t===3||t===4?6:50,1.2,0.65,0,1.2,0.65,0]:[0,0,0,0,0,0,0],extra:"",steps:(t>=12&&t<=17)?[]:undefined};
  if(ds.mode==="add"){ P.push(fresh()); return; }
  const old=P[ds.i], nw=fresh(); nw.kp=old.kp; nw.extra=old.extra||"";
  if(old.kind==="generic"&&nw.kind==="generic"){ nw.p=old.p; if(old.label&&!/^(Central|Spin-orbit|other|type )/.test(old.label)&&!/ — /.test(old.label))nw.label=old.label; }
  P[ds.i]=nw; }
function drawerHTML(){

  if(cur!=="potentials") return "";
  const ed=drawerState.mode==="edit", v=ed?Model.p.potentials[drawerState.i]:null;
  const isC=v&&v.kind==="coulomb", on=(t,sh)=>ed&&(t==="c"?isC:(!isC&&v.type===t&&(sh===undefined||v.shape===sh)))?" cur":"";
  const types=[1,2,3,4].map(t=>`<h3>${POTTYPES[t]} <span class="u">type ${t}</span></h3><div class="chips">${Object.entries(POTSHAPES).map(([sh,nm])=>`<button class="${on(t,+sh).trim()}" data-act="pick" data-type="${t}" data-shape="${sh}">${nm}</button>`).join("")}</div>`).join("");
  return `<div class="scrim" data-act="closedrawer"></div><aside class="drawer" role="dialog" aria-label="Select potential">

   <h3>Other (not in builder catalog)</h3>

   <p class="u">Written verbatim; parameters p1–p7 are then unlabelled.</p><button data-act="pickother">${ed?"Apply":"Add"}</button></aside>`; }
function runImport(text){
  if(!text.trim()){ lastImport={error:"Nothing to parse."}; cur="import"; render(); return; }
  try{ const r=Importer.run(text); pasteBuf=text; lastImport=r.report; cur="import"; change(()=>{ Model.p=r.project; }); }
  catch(err){ lastImport={error:err.message}; cur="import"; render(); } }
/* ---------- Potential plot ----------
   Assumed conventions (verify against the manual): R = r0(Ap^1/3+At^1/3) with Ap, At taken from the most recent Coulomb
   entry (initially the reaction masses); positive depth = attractive, V(r) = -V f(r); imaginary part likewise (-W f).
   Plotted: Coulomb (uniform sphere), type 1 and type 2 (surface, 4e^x/(1+e^x)^2) with shapes 0 (Woods-Saxon) and 1 (WS^2).
   Everything else is listed as "not plotted". */
const PlotState={rmin:0,rmax:15,step:0.05,hide:{}};
const PCOL=["#6db3d6","#d9a441","#7fbf8a","#c58ad6","#e06a5c","#9aa7b8"];
function niceTicks(a,b,n){ const span=b-a||1, s0=span/n, mag=Math.pow(10,Math.floor(Math.log10(s0))), r=s0/mag, st=(r<1.5?1:r<3?2:r<7?5:10)*mag, t=[]; for(let x=Math.ceil(a/st)*st;x<=b+1e-9;x+=st)t.push(+x.toPrecision(12)); return t; }
const Plot={ last:null, geom:null,
  series(p){ const P0=p.partitions[0], rs=[]; for(let i=0;i*PlotState.step+PlotState.rmin<=PlotState.rmax+1e-9;i++)rs.push(PlotState.rmin+i*PlotState.step);
    let ap=P0?P0.massp:p.reaction.proj.mass, at=P0?P0.masst:p.reaction.targ.mass; const Z=P0?P0.zp*P0.zt:p.reaction.proj.Z*p.reaction.targ.Z;
    const curves=[], skipped=[], sx=(r,R,a)=>Math.exp((r-R)/a);
    p.potentials.forEach((v,i)=>{ const key="p"+i;
      if(v.kind==="coulomb"){ ap=v.ap; at=v.at; const Rc=v.rc*(Math.cbrt(ap)+Math.cbrt(at));
        curves.push({key,label:v.label,re:rs.map(r=>Rc>0&&r<Rc?Z*C.e2/(2*Rc)*(3-r*r/(Rc*Rc)):Z*C.e2/Math.max(r,1e-9)),im:null}); return; }
      if((v.type===1||v.type===2)&&(v.shape===0||(v.shape===1&&v.type===1))){ const A=Math.cbrt(ap)+Math.cbrt(at), Rr=v.p[1]*A, Ri=v.p[4]*A;
        const f=(r,R,a)=>{ const x=1/(1+sx(r,R,a)); return v.type===1?(v.shape===1?x*x:x):4*sx(r,R,a)/Math.pow(1+sx(r,R,a),2); };
        curves.push({key,label:v.label,re:v.p[0]!==0?rs.map(r=>-v.p[0]*f(r,Rr,v.p[2])):rs.map(()=>0),im:v.p[3]!==0?rs.map(r=>-v.p[3]*f(r,Ri,v.p[5])):null}); return; }
      skipped.push(`${v.label} (type ${v.kind==="coulomb"?0:v.type}, shape ${v.shape??"-"})`); });
    if(curves.length>1){ curves.push({key:"total",label:"total",re:rs.map((_,k)=>curves.reduce((s,c)=>s+c.re[k],0)),im:curves.some(c=>c.im)?rs.map((_,k)=>curves.reduce((s,c)=>s+(c.im?c.im[k]:0),0)):null}); }
    curves.forEach((c,n)=>c.color=PCOL[n%PCOL.length]); return {rs,curves,skipped}; },
  draw(gx){ const cv=document.getElementById("potCanvas"); if(!cv)return; const S=this.series(Model.p); this.last=S;
    const dpr=window.devicePixelRatio||1, W=cv.parentElement.clientWidth||720, H=330; cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
    const g=cv.getContext("2d"); if(!g)return; g.setTransform(dpr,0,0,dpr,0,0);
    const css=getComputedStyle(document.documentElement), col=n=>css.getPropertyValue(n).trim()||"#888";
    const L=60,Rm=12,T=12,B=36, vis=S.curves.filter(c=>!PlotState.hide[c.key]);
    g.fillStyle=col("--bg"); g.fillRect(0,0,W,H); g.font="12px system-ui,sans-serif";
    const vals=[]; vis.forEach(c=>{ c.re.forEach(y=>isFinite(y)&&vals.push(y)); if(c.im)c.im.forEach(y=>isFinite(y)&&vals.push(y)); }); vals.sort((a,b)=>a-b);
    if(!vals.length){ g.fillStyle=col("--dim"); g.fillText("Nothing to plot (all components hidden or unsupported).",L,H/2); return; }
    const q=x=>vals[Math.min(vals.length-1,Math.max(0,Math.floor(x*(vals.length-1))))];
    let y0=Math.min(0,q(0.005)), y1=Math.max(0,q(0.995)); if(y1-y0<1e-9){y0-=1;y1+=1;} const pad=(y1-y0)*0.05; y0-=pad; y1+=pad;
    const X=r=>L+(r-PlotState.rmin)/(PlotState.rmax-PlotState.rmin)*(W-L-Rm), Y=y=>T+(y1-y)/(y1-y0)*(H-T-B);
    this.geom={L,Rm,W}; g.strokeStyle=col("--line"); g.fillStyle=col("--dim"); g.lineWidth=1;
    niceTicks(PlotState.rmin,PlotState.rmax,8).forEach(t=>{ g.beginPath(); g.moveTo(X(t),T); g.lineTo(X(t),H-B); g.stroke(); g.textAlign="center"; g.fillText(t,X(t),H-B+15); });
    niceTicks(y0,y1,6).forEach(t=>{ g.beginPath(); g.moveTo(L,Y(t)); g.lineTo(W-Rm,Y(t)); g.stroke(); g.textAlign="right"; g.fillText(t,L-6,Y(t)+4); });
    g.textAlign="center"; g.fillText("r (fm)",(L+W-Rm)/2,H-6); g.save(); g.translate(14,(T+H-B)/2); g.rotate(-Math.PI/2); g.fillText("V (MeV); dashed = imaginary",0,0); g.restore();
    g.strokeStyle=col("--dim"); g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(W-Rm,Y(0)); g.stroke();
    g.save(); g.beginPath(); g.rect(L,T,W-L-Rm,H-T-B); g.clip(); g.lineWidth=1.8;

/* ===== IAEA EXFOR capabilities copied into Experimental Data ===== */
function exforNorm(s){return String(s??'').toUpperCase().replace(/[µμ]/g,'MU-').replace(/\s+/g,'').replace(/_/g,'-');}
function exforUnitToken(s){
  const t=exforNorm(s).replace(/MILLI-BARNS?/g,'MB').replace(/MILLIBARNS?/g,'MB')
    .replace(/MICRO-BARNS?/g,'MU-B').replace(/MICROBARN[S]?/g,'MU-B')
    .replace(/NANO-BARNS?/g,'NB').replace(/NANOBARN[S]?/g,'NB')
    .replace(/PICO-BARNS?/g,'PB').replace(/PICOBARN[S]?/g,'PB');
  if(/^MU-?B(?:\/SR)?$/.test(t)||/^UB(?:\/SR)?$/.test(t))return 'ub';
  if(/^MB(?:\/SR)?$/.test(t))return 'mb';
  if(/^NB(?:\/SR)?$/.test(t))return 'nb';
  if(/^PB(?:\/SR)?$/.test(t))return 'pb';
  if(/^(?:B|BARN)(?:\/SR)?$/.test(t))return 'b';
  return null;
}
function exforUnitDimension(s){
  const t=exforNorm(s);
  const base=exforUnitToken(t);
  if(base)return {kind:'cross-section',unit:base,differential:/\/SR$/.test(t)};
  if(/^(?:NO-DIM|NODIM|DIMENSIONLESS|1)$/.test(t))return {kind:'dimensionless',unit:'ratio',differential:false};
  if(/^(?:PER-CENT|PERCENT|%)$/.test(t))return {kind:'percent',unit:'percent',differential:false};
  return null;
}
function exforEnergyUnitFromToken(s){const t=exforNorm(s);if(t==='GEV')return'GeV';if(t==='MEV')return'MeV';if(t==='KEV')return'keV';if(t==='EV')return'eV';return null;}
function exforAngleUnitFromToken(s){const t=exforNorm(s);if(/^(?:RAD|RADIAN|RADIANS)$/.test(t))return'rad';if(/^(?:DEG|DEGREE|DEGREES|ADEG)$/.test(t))return'deg';return null;}
function exforFrameFromHeading(h){
  const t=String(h||'').toUpperCase();
  if(/(?:-CM$|^CM-|CENT(?:RE|ER)[ -]?OF[ -]?MASS)/.test(t))return'cm';
  if(/(?:-LAB$|^LAB-|LABORATORY)/.test(t))return'lab';
  return null;
}
function exforField(o,names){
  if(!o||typeof o!=='object')return '';
  const keys=Object.keys(o);
  for(const n of names){const k=keys.find(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'')===n.toLowerCase().replace(/[^a-z0-9]/g,''));if(k!=null&&o[k]!=null)return o[k];}
  return '';
}
/* Robust EXFOR DatasetID resolver. EE-View/X4Pro responses have used several
   field spellings over time, so never assume a single JSON property name. */
function datasetIdOf(d){
  if(!d || typeof d!=='object') return '';
  const direct=exforField(d,[
    'DatasetID','DatasetId','datasetId','datasetID','dataset_id',
    'SubentryID','SubentryId','subentryId','subentryID','subentry_id',
    'SubentID','SubentId','subentId','subentID','subent_id',
    'id','ID'
  ]);
  if(direct!=null && String(direct).trim()) return String(direct).trim();
  /* Some responses nest the identifier under dataset/subentry metadata. */
  for(const key of ['dataset','Dataset','subentry','Subentry','subent','Subent','metadata','meta']){
    const v=d[key];
    if(v && typeof v==='object'){
      const nested=datasetIdOf(v);
      if(nested) return nested;
    }
    if(typeof v==='string' && /^\s*[A-Z0-9]{5,12}(?:[.]\d{1,3})?\s*$/i.test(v)) return v.trim();
  }
  /* Last-resort search of string fields, restricted to EXFOR-looking IDs. */
  for(const [k,v] of Object.entries(d)){
    if(typeof v!=='string') continue;
    if(!/(dataset|subent|subentry|id)/i.test(k)) continue;
    const m=v.match(/\b[A-Z0-9]{5,12}(?:[.]\d{1,3})?\b/i);
    if(m) return m[0];
  }
  return '';
}
function exforHeadingTexts(d){
  const out=[],seen=new Set();
  function walk(v,k='',dep=0){
    if(v==null||dep>7)return;
    if(typeof v==='string'){
      if(/(head|column|unit|quant|frame|axis|var|name|title|label)/i.test(k)||/(EN|ANG|COS|SIG|DA|DAP)[-_]?(CM|LAB)|MB\/SR|B\/SR|UB\/SR|NB\/SR|PB\/SR|MU-B\/SR|MEV|KEV|GEV|RADIAN|DEGREE/i.test(v))out.push(v);
      return;
    }
    if(typeof v==='number')return;
    if(Array.isArray(v)){v.forEach(x=>walk(x,k,dep+1));return;}
    if(typeof v==='object'&&!seen.has(v)){seen.add(v);Object.entries(v).forEach(([kk,x])=>walk(x,kk,dep+1));}
  }
  walk(d);return[...new Set(out)];
}

/* Parse the official EXFOR fixed-format COMMON/DATA heading + unit rows. */
function exforParseOfficialText(raw){
  /*
     IAEA X4Get returns the interpreted EXFOR subentry in the official
     fixed-format representation.  A DATA/COMMON heading record is followed
     immediately by its DATA-UNIT record, e.g.

       DATA        DATA-ERR    MONIT
       MB          MB          MB

     or

       ANG         DATA        DATA-ERR
       ADEG        MB/SR       MB/SR

     Do not infer units from numerical values.  We only accept a column when
     its unit is explicitly present in the corresponding EXFOR unit row.
  */
  const lines=String(raw||'').replace(/\r/g,'').split('\n');
  const blocks=[];
  const cleanLine=v=>String(v??'').replace(/[\\`]/g,'').trim();
  const isHeadingToken=t=>/^[A-Z][A-Z0-9+*]*(?:-[A-Z0-9+*]+)*(?:\.[A-Z0-9+*]+)*$/i.test(t);
  const isUnitToken=t=>{
    const u=String(t||'').toUpperCase();
    return !!(exforEnergyUnitFromToken(u)||exforAngleUnitFromToken(u)||exforUnitDimension(u)) ||
      /^(?:MEV\/A|KEV\/A|EV\/A|GEV\/A|NO-DIM|PER-CENT|ARB-UNITS|SEE-TEXT|CM|MM|FM|S|SEC|MIN|HR|M2|CM2|1\/S)$/i.test(u);
  };
  const headingLineInfo=line=>{
    let x=cleanLine(line);
    /* Remove EXFOR record labels/pointers that may precede a heading row. */
    /* X4sGetSubent fixed-format records commonly begin with an
       EXFOR record key such as X005500300012.  Remove that key first;
       otherwise DATA/ANG/EN are mistaken for ordinary tokens and the
       heading/unit pair cannot be recognized. */
    x=x.replace(/^[A-Z]\d{6,}\s+/,'').replace(/^\d+\s+/,'').replace(/^DATA\s+\d+\s*/i,'DATA ');
    const t=x.split(/\s+/).filter(Boolean);
    return t;
  };

  for(let i=0;i<lines.length-1;i++){
    const h=headingLineInfo(lines[i]);
    const u=cleanLine(lines[i+1]).split(/\s+/).filter(Boolean);
    if(!h.length||h.length!==u.length)continue;
    const section=/^COMMON\b/i.test(h[0])?'COMMON':/^DATA\b/i.test(h[0])?'DATA':null;
    let headings=h;
    if(section){
      headings=h.slice(1);
      /* In edited X4 output DATA may be followed by a record count. */
      if(headings.length!==u.length){
        const h2=h.slice(1).filter(x=>!/^\d+$/.test(x));
        if(h2.length===u.length)headings=h2;
      }
    }
    if(!headings.length||headings.length!==u.length)continue;
    if(!headings.every(isHeadingToken)||!u.every(isUnitToken))continue;
    blocks.push({section:section||'UNKNOWN',headings,units:u});
    i++;
  }

  /* Some X4Get variants place DATA/COMMON immediately before the heading
     row, while others omit the section marker in the rendered text.  Accept
     those heading/unit pairs as well, but never accept an unrecognized unit. */
  if(!blocks.length){
    for(let i=0;i<lines.length-1;i++){
      const h=cleanLine(lines[i]).split(/\s+/).filter(Boolean);
      const u=cleanLine(lines[i+1]).split(/\s+/).filter(Boolean);
      if(!h.length||h.length!==u.length||!h.every(isHeadingToken)||!u.every(isUnitToken))continue;
      if(h.some(x=>/^EN(?:-|$)/i.test(x))||h.some(x=>/^ANG(?:-|$)/i.test(x))||h.some(x=>/^DATA(?:-|$)/i.test(x)))
        blocks.push({section:'DATA',headings:h,units:u}),i++;
    }
  }

  const columns=[];
  blocks.forEach(b=>b.headings.forEach((h,j)=>columns.push({section:b.section,heading:h,unit:b.units[j]})));
  const data=blocks.filter(b=>b.section==='DATA');
  const all=data.concat(blocks.filter(b=>b.section!=='DATA'));
  const findCol=(pred)=>{for(const b of all){for(let j=0;j<b.headings.length;j++)if(pred(b.headings[j],b.units[j]))return {heading:b.headings[j],unit:b.units[j],section:b.section};}return null;};
  const e=findCol(h=>/^EN(?:-|$)/i.test(h)||/^E(?:-|$)/i.test(h));
  const a=findCol(h=>/^ANG(?:-|$)/i.test(h)||/^COS(?:-|$)/i.test(h));
  const y=findCol(h=>/^(?:DATA|SIG|SIGMA|DA|DAP)(?:-|$)/i.test(h));
  const err=findCol(h=>/(?:ERR|RERR|ERR-.*|DIG)$/.test(h)||/^ERR-/i.test(h));
  const eUnit=exforEnergyUnitFromToken(e?.unit)||null;
  const aUnit=exforAngleUnitFromToken(a?.unit)||null;
  const yd=exforUnitDimension(y?.unit||'');
  const observable=(y&&/^(?:DA|DAP)(?:-|$)/i.test(y.heading))||yd?.differential?'dsdo':(y?'sigma':null);
  const unit=y&&yd?.kind==='cross-section'?yd.unit:null;
  const differential=!!(y&&yd?.differential);
  return {blocks,columns,e,a,y,err,energyUnit:eUnit,angleUnit:aUnit,unit,observable,differential,raw:raw||''};
}

/* The EE-View JSON is only the numerical transport layer. It is never the
   authority for units once the official X4 subentry is available. */
/* Used ONLY when the official X4Get subentry could not be fetched/verified.
   The dataset is not blocked: units/frames are taken from whatever the EE-View
   JSON headings state, otherwise from EE-View/EXFOR defaults (eV, deg, barn,
   laboratory frame).  Every default is flagged in .assumed so the user is warned
   to check and adjust the units in Global Fit. */
function exforUnitText(u,diff){u=String(u??'');return diff&&!/\/SR$/i.test(u)?u+'/sr':u;}
function exforFallbackMetadata(d,partial){

function parseEXFOREESIG(d){
  const Ei=Array.isArray(d?.Ei)?d.Ei:[],y=Array.isArray(d?.y)?d.y:[],dy=Array.isArray(d?.dy)?d.dy:[],An=Array.isArray(d?.An)?d.An:[];
  const m=exforDetectMetadata(d),ef=exforEnergyFactor(m.energyUnit),af=m.angleUnit==='rad'?180/Math.PI:m.angleUnit==='deg'?1:NaN;
  if(!Number.isFinite(ef))return [];
  const n=Math.min(Ei.length,y.length),out=[];

    const E=Number(Ei[i])*ef,yy=Number(y[i]),er=Number(dy[i]);

const EXFOR_EEVIEW = 'https://www-nds.iaea.org/exfor/servlet/eesig';
const EXFOR_X4GET = 'https://www-nds.iaea.org/exfor/servlet/X4sGetSubent';
const EXFOR_UNIT_FACTORS = {b:1000, mb:1, ub:1e-3, nb:1e-6, pb:1e-9};

/* ═════════════════════════════════════════════════════════════════════
   FRESCO Experimental Data — IAEA EXFOR + multi-dataset integration
   EXFOR datasets are loaded into Model.p.data; no optical-model Global
   Fit dependency is used here. The accumulated library can be imported
   into the Experimental Data collection for SFRESCO / comparison work.
═════════════════════════════════════════════════════════════════════ */

function exforToFrescoDataset(points,m,d,label,id){
  const hasAng=points.some(p=>p.theta!=null);
  if(!hasAng) throw new Error('This EXFOR dataset is not an angular distribution; FRESCO Experimental Data currently stores angular-distribution rows.');
  if(m.unit==='ratio') throw new Error('Rutherford-ratio EXFOR data cannot be imported as an absolute mb/sr dataset.');
  const fac=EXFOR_UNIT_FACTORS[m.unit];
  if(!Number.isFinite(fac)) throw new Error(`Unsupported EXFOR cross-section unit: ${m.dataUnit||m.unit||'unknown'}`);
  const differential=!!m.differential;
  if(!differential) throw new Error('Selected EXFOR observable is not differential (dσ/dΩ); choose an angular differential dataset such as DA/DAP.');
  const rows=points.filter(p=>Number.isFinite(p.theta)&&Number.isFinite(p.y)).map(p=>({
    th:p.theta,
    s:p.y*fac,
    ds:Number.isFinite(p.err)?Math.abs(p.err*fac):null,
    E:Number.isFinite(p.E)?p.E:null
  }));
  if(!rows.length)throw new Error('No usable angular points were found.');
  return {
    name:`EXFOR ${id||label||'dataset'}`,
    unit:'mb/sr',
    eKind:m.eFrame==='cm'?'cm':'lab',
    rows,
    src:`IAEA EXFOR ${id||''}`.trim(),
    show:1,
    exfor:{datasetId:id||'',target:document.getElementById('exTarget')?.value.trim()||'',projectile:document.getElementById('exProjectile')?.value.trim()||'',emission:document.getElementById('exEmission')?.value.trim()||'',quantity:exforField(d,['Quantity','quantity'])||'',energyUnit:m.energyUnit||'',angleUnit:m.angleUnit||'',angleFrame:m.angFrame||'lab',dataUnit:m.dataUnit||m.unit,official:!!m.official,fallback:!!m.fallback}
  };
}

function loadEXFORIntoExperimentalData(){
  if(!EXFOR_POINTS.length){exforStatus('Retrieve a dataset first.','err');return;}
  const d=selectedEXFORDataset(),m=EXFOR_META.detected||exforDetectMetadata(d),id=datasetIdOf(d);
  try{
    const ds=exforToFrescoDataset(EXFOR_POINTS,m,d,document.getElementById('exTarget')?.value.trim(),id);
    fdxFromPoints(EXFOR_POINTS,m,id,d);
    const existing=Model.p.data.findIndex(x=>x.exfor&&x.exfor.datasetId===id);
    change(()=>{
      if(existing>=0)Model.p.data[existing]=ds;
      else Model.p.data.push(ds);
    });
    exforStatus(`✓ Loaded ${ds.rows.length} EXFOR points from ${id||'selected dataset'} into Experimental Data (${m.eFrame||'lab'} energy / ${m.angFrame||'lab'} angle, mb/sr).${m.fallback?' Units/frames were not officially verified.':''}`,m.fallback?'err':'ok');
  }catch(e){exforStatus('EXFOR load failed: '+e.message,'err');}
}

function exforLibraryLoadIntoData(){
  if(!EXFOR_LIBRARY.length){exforStatus('Library is empty — add at least one retrieved dataset first.','err');return;}
  let added=0, skipped=[];
  EXFOR_LIBRARY.forEach(e=>{
    try{
      const m={unit:e.unit,differential:e.differential,eFrame:e.eFrame,angFrame:e.angFrame,fallback:e.fallback,dataUnit:e.unit,energyUnit:'MeV',angleUnit:'deg',official:!e.fallback};
      const d={Quantity:e.differential?'DA':'SIG'};
      const ds=exforToFrescoDataset(e.points,m,d,e.label,e.id);
      ds.name=e.label?`EXFOR ${e.id} — ${e.label}`:`EXFOR ${e.id}`;
      const idx=Model.p.data.findIndex(x=>x.exfor&&x.exfor.datasetId===e.id);
      if(idx>=0)Model.p.data[idx]=ds; else Model.p.data.push(ds);
      added+=ds.rows.length;
    }catch(err){skipped.push(`${e.id}: ${err.message}`);}
  });
  fdxFromLibrary();
  render();
  exforStatus(`✓ Library imported: ${added} point(s) from ${EXFOR_LIBRARY.length-skipped.length} dataset(s) into Experimental Data.${skipped.length?' Skipped: '+skipped.join(' | '):''}`,skipped.length?'err':'ok');
}

/* FRESCO-specific replacement for the optical-model EXFOR retrieval tail. */
async function retrieveEXFORDataset(){
  const d=selectedEXFORDataset(),id=datasetIdOf(d);
  if(!d||!id){exforStatus('Select an EXFOR dataset first.','err');return;}
  EXFOR_POINTS=[];EXFOR_META.detected=null;EXFOR_META.official=null;EXFOR_META.officialValid=false;EXFOR_META.fallback=null;
  exforStatus(`Retrieving official EXFOR headings/units for DatasetID ${id} from IAEA X4Get…`);
  const officialOK=await retrieveOfficialEXFORMetadata(d);
  if(!officialOK){
    EXFOR_META.fallback=exforFallbackMetadata(d,EXFOR_META.official);
    EXFOR_META.detected=EXFOR_META.fallback;
  }
  EXFOR_POINTS=parseEXFOREESIG(d);
  if(!EXFOR_POINTS.length){exforStatus('Selected EXFOR dataset contains no compatible numeric Ei/y data.','err');return;}
  const s=exforDatasetStats(d),dm0=EXFOR_META.detected||exforDetectMetadata(d);
  EXFOR_META.retrieved=`${EXFOR_POINTS.length} point(s) from EE-View DatasetID ${id} · ${officialOK?'official unit audit passed':'⚠ units NOT verified (assumed)'} · E=${dm0.energyUnit}, angle=${dm0.angleUnit||'—'}, observable=${dm0.observable}, unit=${dm0.dataUnit}`;
  EXFOR_META.dataInfo=exforDataInfoLine(d)+` · ${s.missingErr?'missing/invalid uncertainty values remain in EE-View dy':'explicit EE-View uncertainties available'}`;
  exforRenderMeta();
  document.getElementById('exLoadBtn').disabled=false;
  const libAddBtn=document.getElementById('exLibAddBtn');if(libAddBtn)libAddBtn.disabled=false;
  if(officialOK)exforStatus(`✓ Dataset ${id}: ${EXFOR_POINTS.length} point(s) loaded. Official EXFOR headings/units verified from X4Get; no numerical unit inference.`);
  else exforStatus(`⚠ Dataset ${id}: ${EXFOR_POINTS.length} point(s) extracted, but official EXFOR units could NOT be verified. Assumed: ${exforFallbackSummary(dm0,EXFOR_POINTS.some(p=>p.theta!=null))}.`,'err');
  render();
}

function clearEXFOR(){
  EXFOR_DATASETS=[];EXFOR_RAW='';EXFOR_POINTS=[];EXFOR_META={};
  const ids=['exDatasetBox','exDatasetHint','exMeta'];
  ids.forEach(id=>{const e=document.getElementById(id);if(e){e.style.display='none';e.innerHTML='';}});
  ['exRetrieveBtn','exOfficialBtn','exLoadBtn','exLibAddBtn'].forEach(id=>{const e=document.getElementById(id);if(e)e.disabled=true;});
  exforStatus('No EXFOR search performed.');
}

/* ═════════════════════════════════════════════════════════════════════
   "1 · Experimental Data" card — ported from the optical-model Global Fit.
   Detects/records units and frames, converts to the internal representation
   (E_cm in MeV, θ_cm in deg, mb/sr | mb | ratio), validates, reports, plots.
   State lives in FDX so a full render() rebuilds the card unchanged.
═════════════════════════════════════════════════════════════════════ */
/* EXFOR nuclide notation → A,Z (ported from the optical-model Global Fit) */
const EXFOR_Z={H:1,He:2,Li:3,Be:4,B:5,C:6,N:7,O:8,F:9,Ne:10,Na:11,Mg:12,Al:13,Si:14,P:15,S:16,Cl:17,Ar:18,K:19,Ca:20,Sc:21,Ti:22,V:23,Cr:24,Mn:25,Fe:26,Co:27,Ni:28,Cu:29,Zn:30,Ga:31,Ge:32,As:33,Se:34,Br:35,Kr:36,Rb:37,Sr:38,Y:39,Zr:40,Nb:41,Mo:42,Tc:43,Ru:44,Rh:45,Pd:46,Ag:47,Cd:48,In:49,Sn:50,Sb:51,Te:52,I:53,Xe:54,Cs:55,Ba:56,La:57,Ce:58,Pr:59,Nd:60,Pm:61,Sm:62,Eu:63,Gd:64,Tb:65,Dy:66,Ho:67,Er:68,Tm:69,Yb:70,Lu:71,Hf:72,Ta:73,W:74,Re:75,Os:76,Ir:77,Pt:78,Au:79,Hg:80,Tl:81,Pb:82,Bi:83,Po:84,At:85,Rn:86,Fr:87,Ra:88,Ac:89,Th:90,Pa:91,U:92,Np:93,Pu:94,Am:95,Cm:96,Bk:97,Cf:98,Es:99,Fm:100,Md:101,No:102,Lr:103,Rf:104,Db:105,Sg:106,Bh:107,Hs:108,Mt:109,Ds:110,Rg:111,Cn:112,Nh:113,Fl:114,Mc:115,Lv:116,Ts:117,Og:118};
function exforParseNuclide(raw){
  let s=String(raw??'').trim().replace(/[\s_{}]/g,'');
  if(!s)return null;
  const low=s.toLowerCase();
  const al={p:[1,1],proton:[1,1],h1:[1,1],n:[1,0],neutron:[1,0],d:[2,1],deuteron:[2,1],t:[3,1],triton:[3,1],a:[4,2],alpha:[4,2],he4:[4,2],'4he':[4,2],he3:[3,2],'3he':[3,2]};
  if(al[low])return {A:al[low][0],Z:al[low][1],label:s};
  let m=s.match(/^(\d+)[-]([A-Za-z]{1,3})[-](\d+)$/);
  if(m){const Z=+m[1],A=+m[3],key=m[2].charAt(0).toUpperCase()+m[2].slice(1).toLowerCase();if(A>0&&Z>0&&EXFOR_Z[key]===Z)return {A,Z,label:s};}
  m=s.match(/^(\d+)[-]?(?:([A-Za-z]{1,3}))$/);
  if(!m)m=s.match(/^(?:([A-Za-z]{1,3})[-]?)(\d+)$/);
  if(m){const num=/^\d+$/.test(m[1]);const A=+(num?m[1]:m[2]),sym=num?m[2]:m[1],key=sym.charAt(0).toUpperCase()+sym.slice(1).toLowerCase();if(A>0&&EXFOR_Z[key])return {A,Z:EXFOR_Z[key],label:s};}
  return null;
}
function exforReactionParts(d){
  let t=exforParseNuclide(exforField(d,['Target','target','Targ','TargetNuclide','TargetNucleus']));
  let q=exforParseNuclide(exforField(d,['Projectile','projectile','Proj','ProjectileNuclide','ProjectileNucleus']));
  const reaction=String(exforReactionLabel(d)||'');
  if(!t||!q){
    const m=reaction.match(/(?:^|\b)((?:\d{1,3}[A-Za-z]{1,3})|(?:\d{1,3}-[A-Za-z]{1,3}-\d{1,3}))\s*\(\s*([^,()]+)\s*,/i);
    if(m){if(!t)t=exforParseNuclide(m[1]);if(!q)q=exforParseNuclide(m[2]);}
  }
  return {target:t,projectile:q,reaction};
}
const FDX_UF={mb:1,b:1000,ub:1e-3,nb:1e-6,pb:1e-9,ratio:1};
const FDX_ULAB={mb:'mb/sr',b:'b/sr',ub:'µb/sr',nb:'nb/sr',pb:'pb/sr',ratio:'σ/σ_R (dimensionless)'};
const FDX_ULAB_INT={mb:'mb',b:'b',ub:'µb',nb:'nb',pb:'pb'};
let FDX={type:'angular',fmt:'auto',singleE:'',obs:'dsdo',xsec:'elastic',unit:'mb',eFrame:'lab',angFrame:'lab',
  errMode:'abs',defPct:5,text:'',rows:[],rep:null,info:'No experimental data loaded.',warn:false,note:'',noteWarn:false,
  mp:'',mt:'',massSrc:''};
function fdxSys(){const R=(Model&&Model.p&&Model.p.reaction)||{},own=(+FDX.mp>0&&+FDX.mt>0);
  const mp=own?+FDX.mp:+(R.proj&&R.proj.mass),mt=own?+FDX.mt:+(R.targ&&R.targ.mass);
  return {mp,mt,own,ok:mp>0&&mt>0,tau:(mp>0&&mt>0)?mp/mt:NaN};}
const fdxLab2CmE=(E,s)=>E*s.mt/(s.mp+s.mt);
const fdxCm2LabE=(E,s)=>E*(s.mp+s.mt)/s.mt;
function fdxLab2CmAng(thDeg,tau){const tl=thDeg*Math.PI/180,a=tau*Math.sin(tl);if(!(Math.abs(a)<=1))return NaN;return (tl+Math.asin(a))*180/Math.PI;}
function fdxCm2LabAng(thDeg,tau){const tc=thDeg*Math.PI/180;let tl=Math.atan2(Math.sin(tc),Math.cos(tc)+tau)*180/Math.PI;if(tl<0)tl+=180;return tl;}
function fdxJac(thCmDeg,tau){const c=Math.cos(thCmDeg*Math.PI/180),d=1+tau*tau+2*tau*c;return d>0?Math.abs(1+tau*c)/Math.pow(d,1.5):NaN;}

function fdxSet(k,v){
  const S=FDX; S[k]=v;
  if(k==='type'){
    S.fmt='auto';
    if(v==='excitation'&&S.unit==='ratio')S.unit='mb';
  }
  if(k==='unit'){ if(v==='ratio')S.obs='ratio'; else if(S.obs==='ratio')S.obs='dsdo'; }
  if(k==='obs'){ if(v==='ratio')S.unit='ratio'; else if(S.unit==='ratio')S.unit='mb'; }
  if(k==='mp'||k==='mt'){S.massSrc='entered by hand';}
  if(S.text.trim())fdxParse();
  render();
}
function fdxAct(a){
  if(a==='import'){const f=document.getElementById('fdxFile');if(f)f.click();return;}
  if(a==='validate'){fdxParse();render();return;}
  if(a==='clear'){Object.assign(FDX,{text:'',rows:[],rep:null,info:'No experimental data loaded.',warn:false,note:'',noteWarn:false,pe:'all'});render();return;}
}
function fdxLoadFile(el){
  const f=el.files&&el.files[0];if(!f)return;
  const fr=new FileReader();fr.onload=()=>{FDX.text=String(fr.result||'');FDX.note=`Imported file ${f.name}.`;FDX.noteWarn=false;fdxParse();render();};
  fr.readAsText(f);
}

function fdxParse(){
  const S=FDX,sys=fdxSys(),tau=sys.tau,txt=S.text.trim();
  S.rows=[];S.rep=null;S.warn=false;
  if(!txt){S.info='No experimental data loaded.';return false;}
  const type=S.type,fmt=S.fmt,unit=S.unit,uFac=FDX_UF[unit]??1,errMode=S.errMode;
  const defPct=Math.max(0.01,+S.defPct||5),singleE=+S.singleE;
  const isRatio=(type==='angular'&&(unit==='ratio'||S.obs==='ratio'));
  const rows=[],errors=[];
  let nDefaultErr=0,nZeroErr=0,nNegErr=0,nDup=0;
  const seen=new Set(),lines=txt.split(/\r?\n/);
  if(!sys.ok&&(S.eFrame==='lab'||(type==='angular'&&S.angFrame==='lab')))
    errors.push('reaction masses (Reaction tab: projectile/target mass) are not set — lab→c.m. conversion impossible');
  for(let ln=0;ln<lines.length;ln++){
    let s=lines[ln].trim();
    if(!s||/^[#!*;%]/.test(s))continue;
    s=s.replace(/[#!].*$/,'').trim();if(!s)continue;
    s=s.replace(/([0-9])[dD]([+-]?[0-9])/g,'$1e$2');
    const a=s.replace(/[,;]/g,' ').split(/\s+/).filter(Boolean).map(Number);
    if(!a.length||a.some(x=>!Number.isFinite(x))){errors.push(`line ${ln+1}: non-numeric value ("${lines[ln].trim().slice(0,40)}")`);continue;}
    let E,theta,y,err,errGiven=true;
    if(type==='angular'){
      if(fmt==='EthetaSigmaErr'||(fmt==='auto'&&a.length>=4)){[E,theta,y,err]=a;}
      else if(fmt==='EthetaSigma'||(fmt==='auto'&&a.length===3&&!(singleE>0))){[E,theta,y]=a;err=undefined;errGiven=false;}
      else if(fmt==='thetaSigmaErr'||(fmt==='auto'&&a.length===3&&singleE>0)){[theta,y,err]=a;E=singleE;}
      else if(fmt==='thetaSigma'||(fmt==='auto'&&a.length===2)){[theta,y]=a;E=singleE;err=undefined;errGiven=false;}
      else{errors.push(`line ${ln+1}: unsupported number of columns (${a.length})`);continue;}
      if(!(E>0)){errors.push(`line ${ln+1}: energy must be > 0 (set "Single E" if there is no energy column)`);continue;}
      if(!(theta>0&&theta<180)){errors.push(`line ${ln+1}: angle ${theta} outside (0,180) deg`);continue;}
    }else{
      if(fmt==='ESigmaErr'||(fmt==='auto'&&a.length>=3)){[E,y,err]=a;}
      else if(fmt==='ESigma'||(fmt==='auto'&&a.length===2)){[E,y]=a;err=undefined;errGiven=false;}
      else{errors.push(`line ${ln+1}: expected  E  sigma  [error]`);continue;}
      theta=null;
      if(!(E>0)){errors.push(`line ${ln+1}: energy must be > 0`);continue;}
    }
    let errAbs;
    if(errGiven&&Number.isFinite(err)){
      if(err<0){nNegErr++;errAbs=NaN;}
      else if(err===0){nZeroErr++;errAbs=NaN;}
      else errAbs=(errMode==='percent')?Math.abs(y)*err/100:(errMode==='relative')?Math.abs(y)*err:err;
    }else errAbs=NaN;
    if(!(errAbs>0)){errAbs=Math.abs(y)*defPct/100;nDefaultErr++;}
    if(!(errAbs>0)){errors.push(`line ${ln+1}: cannot assign a positive uncertainty (σ = 0 and no error column)`);continue;}
    let yC=y*uFac,errC=errAbs*uFac;
    const Ecm=(S.eFrame==='lab')?(sys.ok?fdxLab2CmE(E,sys):NaN):E;
    let thCm=theta;
    if(type==='angular'&&S.angFrame==='lab'){
      thCm=sys.ok?fdxLab2CmAng(theta,tau):NaN;
      if(!Number.isFinite(thCm)){errors.push(`line ${ln+1}: θ_lab = ${theta}° not convertible (τ = m₁/m₂ = ${Number.isFinite(tau)?tau.toFixed(3):'n/a'})`);continue;}
      if(!isRatio){const J=fdxJac(thCm,tau);if(!(J>0)){errors.push(`line ${ln+1}: invalid lab→cm Jacobian`);continue;}yC*=J;errC*=J;}
    }
    if(!(Ecm>0)){errors.push(`line ${ln+1}: E_cm = ${Ecm} is not positive`);continue;}
    const key=`${Ecm.toFixed(9)}|${thCm==null?'x':thCm.toFixed(6)}`;
    if(seen.has(key))nDup++;else seen.add(key);
    rows.push({E:Ecm,theta:thCm,y:yC,err:errC,type:type==='angular'?'angular':'excitation',Eraw:E,thRaw:theta,yRaw:y,errRaw:errAbs});
  }
  S.rows=rows;
  const es=[...new Set(rows.map(d=>d.E))].sort((x,y2)=>x-y2),ths=rows.filter(d=>d.theta!=null).map(d=>d.theta);
  const ys=rows.map(d=>d.y),errs=rows.map(d=>d.err);
  const obsName=type==='angular'?(isRatio?'σ/σ_Rutherford':'dσ/dΩ'):(S.xsec==='reaction'?'σ_reaction':S.xsec==='nuclearTotal'?'σ_nuclear total':'σ_shape elastic');
  S.rep={n:rows.length,energies:es,Emin:es[0],Emax:es[es.length-1],
    thMin:ths.length?Math.min(...ths):null,thMax:ths.length?Math.max(...ths):null,
    errMin:errs.length?Math.min(...errs):null,errMax:errs.length?Math.max(...errs):null,
    yMin:ys.length?Math.min(...ys):null,yMax:ys.length?Math.max(...ys):null,
    obsName,internalUnit:type==='angular'?(isRatio?'dimensionless':'mb/sr'):'mb',
    inputUnit:type==='angular'?(FDX_ULAB[unit]||unit):(FDX_ULAB_INT[unit]||unit),
    mp:sys.mp,mt:sys.mt,eFrame:S.eFrame,angFrame:S.angFrame,tau,eFac:sys.ok?sys.mt/(sys.mp+sys.mt):NaN,unit,errMode,defPct,isRatio,type,
    skipped:errors.length,errors,nDefaultErr,nZeroErr,nNegErr,nDup};
  S.info=rows.length?`✓ ${rows.length} point(s) accepted; ${es.length} energy/energies.${errors.length?' '+errors.length+' line(s) rejected — see report.':''}`
    :`No valid rows found. ${type==='angular'?'Use  E θ σ [Δσ]  or  θ σ [Δσ]  with Single E.':'Use  E σ [Δσ].'}`;
  S.warn=!rows.length||errors.length>0;
  return rows.length>0;
}
