'<p>Reduced matrix elements follow \\(\\langle I_iM_i|\\mathcal{O}_{\\lambda\\mu}|I_jM_j\\rangle=\\langle I_jM_j\\lambda\\mu|I_iM_i\\rangle',
' \\langle I_i\\|\\mathcal{O}_\\lambda\\|I_j\\rangle/\\sqrt{2I_i+1}\\), so the monopole (identity) operator has',
' \\(\\langle I\\|\\mathcal{O}_0\\|I\\rangle=\\sqrt{2I+1}\\) in all three models. A validation test checks that, with all',
' deformations switched off, every state of every model sees exactly the bare central potential.</p>',
'</div>',

'<div class="card"><h3>D. Single-particle transfer (DWBA and CRC)</h3>',
'<p>One particle x (spin \\(s_x\\)) is transferred: stripping \\(a(=b+x)+A\\to b+B(=A+x)\\) or the reverse pickup.',
' The light composite is \\(l_c=c_l+x\\), the heavy one \\(h_c=c_h+x\\); the cores carry spins \\(S_{cl}, S_{ch}\\).',
' The overlaps are coupled as \\(|((\\ell\\, s_x)j, S_{\\rm core})J\\rangle\\) with parity \\(\\pi_{\\rm core}\\pi_x(-1)^\\ell\\);',
' each radial function is a bound state in a Woods-Saxon + Coulomb + Thomas spin-orbit well (the central depth is fitted to',
' the separation energy), computed on its own Lagrange mesh and continued by the exact Whittaker tail.',
' The binding interaction acting on the overlap is the radial function \\(V_c+V_C+\\langle\\ell\\cdot s\\rangle V_{so}\\). With \\(\\mathbf r_1\\) the x-\\(c_l\\) and',
' \\(\\mathbf r_2\\) the x-\\(c_h\\) coordinate,</p>',
'<p>$$\\mathbf r_1=c_1\\mathbf R_L+d_1\\mathbf R_H,\\qquad \\mathbf r_2=c_2\\mathbf R_L+d_2\\mathbf R_H,\\qquad',
' d^3r_2\\,d^3R_H=c_2^3\\,d^3R_L\\,d^3R_H$$</p>',
'<p>with \\(c_1=m_{lc}m_{ch}/(m_xM)\\), \\(d_1=-m_{lc}m_{hc}/(m_xM)\\), \\(c_2=m_{lc}m_{hc}/(m_xM)\\),',
' \\(d_2=-m_{cl}m_{hc}/(m_xM)\\). The non-local kernel</p>',
'<p>$$K_{L_HL_L}^J(R_H,R_L)=c_2^3R_HR_L\\int\\! d\\Omega\\;\\big[\\mathcal Y_{L_H}\\otimes\\phi_{l_b}(\\mathbf r_2)\\big]_J^{*}',
' \\,\\mathcal V\\,\\big[\\mathcal Y_{L_L}\\otimes\\phi_{l_a}(\\mathbf r_1)\\big]_J$$</p>',
'<p>is first evaluated for spinless overlaps at total orbital angular momentum \\(\\Lambda\\) (reduced analytically to a single angle between',
' \\(\\mathbf R_L\\) and \\(\\mathbf R_H\\)). The spins of x and both cores are spectators, so each channel',
' \\(((L,s_{\\rm proj})j,I)J\\) is recoupled with chains of 6j coefficients onto \\(((L\\ell)\\Lambda,((s_xS_{cl})S_1,S_{ch})S)J\\) and',
' \\(K^J=\\sum_{\\Lambda S_1S}C^H_{\\Lambda S_1S}C^L_{\\Lambda S_1S}K^\\Lambda_{\\rm orb}\\). The orbital kernel is',
' integrated by Gauss-Legendre',
' quadrature split at the forward peak. The interaction is post \\(\\mathcal V=V_{xc_l}(r_1)+U_{c_lc_h}-U_H(R_H)\\) or prior',
' \\(\\mathcal V=V_{xc_h}(r_2)+U_{c_lc_h}-U_L(R_L)\\); the remnant \\(U_{c_lc_h}-U\\) can be switched off.',
' The kernel enters the Bloch-augmented Lagrange-mesh Hamiltonian as an off-diagonal block, so <b>CRC</b>',
' is the same R-matrix solve as inelastic CC. <b>DWBA</b> uses the uncoupled distorted waves:',
' \\(S^{(1)}_{ba}=-2i\\,c_b^{T}K c_a\\) with flux-normalised mesh coefficients. Non-orthogonality terms are not',
' included unless NONO is selected (exact in DWBA).</p>',
'<p><b>Non-orthogonality (NONO).</b> Projecting \\((H-E)\\Psi=0\\) with \\(\\Psi=\\Phi_L\\chi_L+\\Phi_H\\chi_H\\) gives the off-diagonal',
' block \\(K_{\\rm post}+(H_H-E)N\\) or, equivalently, \\(K_{\\rm prior}+N(H_L-E)\\), where \\(N(R_H,R_L)\\) is the overlap kernel',
' \\(\\langle\\Phi_H|\\Phi_L\\rangle\\). Both forms are the same operator (exactly, with the full remnant), so with NONO post and prior',
' CRC agree; without it they do not. The symmetric problem \\((\\mathcal H-E\\mathcal N)c=F\\) with \\(\\mathcal N=1+N+N^T\\) is solved',
' directly at every J (slower than the pole expansion). On shell the term vanishes, so DWBA is unchanged; this cancellation',
' needs \\(N\\approx0\\) at the channel radius, which the program reports.</p>',
'<p>Checks in the test suite: kernel angular reduction against a brute-force 4-D orientation integral;',
' DWBA equals CRC at weak coupling; CRC unitarity and symmetry for real potentials; detailed balance between',
' stripping and the separately built reverse pickup (with spins and spin-orbit forces); post-prior equivalence of DWBA',
' with the full remnant; recoupling coefficients against explicit m-scheme sums; the spinful kernel against a brute-force',
' orientation integral with explicit spin projections; the exact spin sum rule \\(\\sigma_j=\\sigma_{\\rm spinless}(2j+1)/((2\\ell+1)(2s_x+1))\\)',
' when nothing depends on spin; CRC post = prior only with NONO.</p>',
'<p><b>Mesh density for transfer.</b> Because \\(\\mathbf r_1=c_1\\mathbf R_L+d_1\\mathbf R_H\\), the kernel is a ridge of',
' width about (overlap range)/\\(|c_1|\\) in the \\((R_H,R_L)\\) plane, so it needs a finer radial mesh than elastic',
' scattering. Post and prior agree only when this ridge (and, in the prior form with charged cores, the long-range',
' Coulomb remnant) is resolved: running both forms is the recommended convergence check. Example: for the neutral',
' test system with \\(|c_1|=4.4\\) the post-prior difference is 7% at N/a = 2.5 fm\\(^{-1}\\) and 0.3% at 4 fm\\(^{-1}\\).</p>',
'</div>',

'<div class="card"><h3>F. Several partitions and two-step (sequential) transfer</h3>',
'<p>Any number of partitions can be joined by one-particle transfer steps (Input tab, Multi-step transfer). In a step between',
' partitions L and H, x sits in the projectile of L (light composite \\(l_c=c_l+x\\), \\(c_l\\) = projectile of H) and in the',
' target of H (heavy composite \\(h_c=c_h+x\\), \\(c_h\\) = target of L). Each overlap connects a state i of L to a state k of H; its',
' binding follows from the thresholds, \\(\\varepsilon_{ik}=\\varepsilon_{l_c}-(E_{H,k}-E_{L,i})\\), so the Q-values of the chain are',
' consistent by construction. Kernels of all steps are recoupled as in section D and enter one Hamiltonian, so <b>CRC</b> couples',
' all partitions to all orders (with optional NONO per step).</p>',
'<p><b>Two-step DWBA</b> adds to the first-order amplitude the second-order term through every intermediate partition m:</p>',
'<p>$$S^{(2)}_{ba}=-2i\\,c_b^{T}K_{bm}\\,c^{(1)}_m,\\qquad c^{(1)}_m=-\\big(H_m+\\mathcal L(L^+)-E\\big)^{-1}K_{ma}c_a,$$</p>',
'<p>where \\(\\mathcal L(L^+)\\) is the Bloch operator carrying the outgoing logarithmic derivative \\(aH^{+\\prime}/H^+\\) of each',
' channel of m. This is the outgoing-wave Green function of the distorted intermediate partition on the Lagrange mesh, including',
' its closed channels and its own inelastic couplings. Checks: the scattered wave \\(c^{(1)}\\) reproduces the first-order',
' S-matrix through its outgoing amplitude at r = a; second-order DWBA equals CRC with all kernels scaled by \\(\\varepsilon\\) to',
' \\(O(\\varepsilon^2)\\); three-partition CRC is unitary; detailed balance holds against the reversed chain built independently.</p>',
'<p>Not included: simultaneous (correlated) two-particle transfer, the non-orthogonality between partitions that differ by two',
' particles, and the polarisation of the entrance channel through the intermediate partition in two-step DWBA.</p>',
'</div>',

'<div class="card"><h3>G. Simultaneous two-nucleon transfer (correlated pair form factor)</h3>',
'<p>The two nucleons are transferred as a cluster x = 2N (spin 0) whose internal state is the spin-singlet relative 0s state',
' \\(\\phi_{\\rm rel}(r)\\) of size \\(b_{\\rm rel}\\). On the heavy side the pair state built from the same single-particle orbitals as the',
' sequential path, \\(\\Psi=\\sum_c\\beta_c|(j_1j_2)J\\rangle_{\\rm as}\\), is recoupled jj to LS with a 9j symbol and projected:</p>',
'<p>$$\\Phi_J(R)\\,Y_{JM}(\\hat R)=\\int d^3r\\;\\phi_{\\rm rel}(r)Y_{00}(\\hat r)\\,\\langle\\chi_{S=0}|\\Psi(\\mathbf R+\\tfrac{\\mathbf r}{2},\\mathbf R-\\tfrac{\\mathbf r}{2})\\rangle,$$</p>',
'<p>with R the pair centre of mass relative to the core (L = J). The angular integral is reduced to one angle by putting R on the',
' z axis. \\(\\Phi_J\\) then plays the role of the heavy overlap in the one-particle kernel of section D, with the light-composite',
' binding interaction (the heavy side has no binding potential). Its norm, reported in the results, is the cluster spectroscopic',
' factor for this internal state.</p>',
'<p><b>Coherence.</b> Both paths must come from the same wave functions and one phase convention. For a J = 0 pair',
' \\(|(jj)0\\rangle\\) the sequential amplitude of B into core(j) + n is \\(-\\sqrt2\\,\\beta_j\\) in this program\'s coupling order',
' ((l s)j, S<sub>core</sub>)J. For the (0s)<sup>3</sup> triton, t into d + n has \\(-\\sqrt{3/2}\\) (S = 3/2) and t into p + (nn)<sub>0</sub> has 1',
' (computed by an explicit three-particle spin construction). The preset uses these values.</p>',
'<p>Checks: the form factor of an oscillator (0s)<sup>2</sup> pair equals the exact c.m. function; the reduced projection agrees with',
' a brute-force three-dimensional m-scheme projection with explicit spins; the coherent amplitude equals the sum of the separate',
' paths; unitarity and detailed balance hold with both paths coupled.</p>',
'<p>Not included: other internal states of the pair (relative p, d, ... waves and spin triplet), finite-range corrections in the',
' light composite beyond the cluster bound state, and the non-orthogonality between the two-nucleon and one-nucleon partitions.</p>',
'</div>',

'<div class="card"><h3>H. Richer pair states and a microscopic triton</h3>',
'<p><b>Pair basis.</b> The antisymmetrised pair \\(\\Psi_J(1,2)=\\sum_c\\beta_c|(a_cb_c)J\\rangle\\) of the heavy composite is expanded in a complete set of internal states ',
'\\(X_c=[\\phi_{n\\lambda}(r)Y_\\lambda(\\hat r)\\otimes\\chi_S(1,2)]_I\\) (oscillator radial functions of length \\(b_{rel}\\), \\(\\mathbf r=\\mathbf r_1-\\mathbf r_2\\)), ',
'with the c.m. form factors \\(\\Psi_J=\\sum_{c\\Lambda}\\Phi_{c\\Lambda}(R)[Y_\\Lambda(\\hat R)\\otimes X_c]_J\\). Each \\(jj\\) product is recoupled to ',
'\\((l_1l_2)L,(\\tfrac12\\tfrac12)S\\) with a 9j symbol; the spatial part is projected onto \\([\\phi_{n\\lambda}Y_\\lambda\\otimes Y_\\Lambda]_L\\) with R on the z axis ',
'(the \\(\\mu\\) components are separated by the orthogonality of \\(\\langle\\lambda\\mu L{-\\mu}|\\Lambda 0\\rangle\\)) and recoupled to \\((\\Lambda,(\\lambda S)I)J\\). ',
'Spin singlet and triplet are both kept. Parseval: \\(\\sum\\int|\\Phi_{c\\Lambda}|^2R^2dR\\to1\\); it is exactly 1 for oscillator orbitals once ',
'\\(2n+\\lambda\\) reaches the oscillator quanta of the pair (Talmi-Moshinsky closure, checked in the Tests tab).</p>',
'<p><b>Microscopic triton.</b> n n p with the Minnesota interaction (Thompson, LeMere and Tang 1977; Gaussian central force with spin and space ',
'exchange, mixture u) is solved in explicitly correlated Gaussians \\(e^{-\\frac12\\tilde x^TA\\tilde x}\\) of the Jacobi coordinates, two arrangements ',
'times two nn spin channels, antisymmetrised in the neutrons. Matrix elements are analytic. With 256 functions E = -8.384 MeV (literature -8.385 MeV); ',
'the Minnesota deuteron (-2.202 MeV) is solved in the same way. Note that with an antisymmetriser only the sums \\(V_{12}\\) and \\(V_{13}+V_{23}\\) have ',
'meaningful expectation values in the reduced matrix-element form; they are reported that way.</p>',
'<p><b>Light overlaps and vertices.</b> For each pair state c the triton gives, in the coupling order of the kernel ',
'\\(((\\Lambda I)j_a,\\tfrac12)\\tfrac12\\) with \\(\\Lambda=\\lambda\\) (L = 0 triton), the overlap \\(O_c(r)=\\langle X_c,p|t\\rangle\\) and the exact prior vertex ',
'\\(D_c(r)=\\langle X_c,p|V_{pn_1}+V_{pn_2}|t\\rangle\\), which replaces \\(V_{bind}\\phi\\) of a potential-model composite. For the sequential (d,t) step ',
'it gives \\(\\sqrt2\\langle[[Y_0\\chi_{n_2}]_{1/2}\\otimes d(n_1p)]_{1/2}|t\\rangle\\) and the vertex with \\(V_{n_2p}+V_{n_2n_1}\\). Checks: for a (0s)^3 triton the ',
'overlaps reproduce S(p+(nn)_0s) = 1 and S(d+n) = 3/2 with the sign of the potential-model amplitude; for the Minnesota triton the p+(nn) spectroscopic ',
'factors sum to 1 and \\(\\sum_c\\langle O_c|D_c\\rangle\\to\\langle V_{pn_1}+V_{pn_2}\\rangle\\) as the pair basis grows.</p>',
'<p><b>Transfer.</b> Each pair channel c (and each light component \\(j_a\\)) becomes one internal step with a cluster x of spin I and parity \\((-1)^\\lambda\\); ',
'all add coherently to the same partitions. For an L = 0 triton only \\(j_a=S\\) survives, so there is one step per pair channel. ',
'Select <i>light-composite model</i> = microscopic triton and set n_max, lam_max and the triplet switch of the 2N overlap; the Results tab lists the ',
'heavy and light norms of every channel. A selection rule worth knowing: the triplet p-wave pair (lam = 1, S = I = 1, Lam = 1) acts like ',
'\\(\\sigma\\cdot(\\mathbf R_L\\times\\mathbf R_H)\\) and vanishes between s waves (J = 1/2+), but contributes at higher J.</p>',
'</div>',
'<div class="card"><h3>I. Performance: what is computed once, what is split, what is cached</h3>',
'<ul><li><b>DWBA kernels only.</b> Two-step DWBA needs the transfer kernels but not a solve of the coupled system with them; that set-up ',
'(kernels without solver preparation) replaced a full tridiagonalisation of the coupled matrix at every J.</li>',
'<li><b>Block-diagonal distorted waves.</b> Without transfer kernels the channels split into uncoupled blocks (connected components of the coupling ',
'graph: partitions, and single channels when there is no inelastic coupling); the R-matrix preparation and the wave-function solves are done block by block.</li>',
'<li><b>Triton tables.</b> The wave function and the vertex are evaluated from the three scalar invariants x.x, x.y, y.y, for both M at once, with three ',
'exponential sums per grid point instead of ten.</li>',
'<li><b>J-parallel workers.</b> A single energy point is split into (J, parity) blocks distributed over hardwareConcurrency - 1 Web Workers; the results ',
'travel as plain data and are assembled by the ordinary energy loop, so cross sections, S-matrix, absorption and angular distributions are identical to a ',
'single-thread run (tested bit for bit). With microscopic light composites the few-body tables are prepared first on three workers (triton p + (nn), triton d + n, heavy side).</li>',
'<li><b>Few-body cache.</b> Triton solutions, projected overlaps and vertices, pair channels and fitted bound-state depths are stored by content (all inputs in the key) in the page ',
'and in localStorage, so a repeat run with the same triton and pair parameters skips them; the Options card shows the number of entries and can clear it. ',
'Kernel reuse across J was measured not to matter: the orbital kernels cost about 2 s of a 177 s run before these changes.</li>',
'<li>The Results tab shows the per-worker time split and an inclusive profile of the expensive components.</li>',
'<li><b>Dense kernels (Stage 12).</b> The complex LU is blocked (panel factorisation, triangular solve for U12, tiled rank-nb trailing update; same ',
'pivots and bit-identical factors as the unblocked version) and the triangular solves run along rows. The complex-symmetric Householder ',
'tridiagonalisation follows LAPACK DSYTRD/DLATRD: lower triangle and trailing part only, symmetric matrix-vector products, one rank-2nb update ',
'per panel, and columns that are already reduced are skipped (the old routine broke down on them and fell back to LU). Large complex problems ',
'(CRC with absorptive potentials) are now solved by one pivoted LU per energy, shared between the R-matrix and the wave functions of the ',
'absorption analysis; LU is also the more accurate route (R-matrix error ~1e-12 against an iteratively refined solution, against ~1e-8 to 1e-7 for ',
'the tridiagonal route, whose complex-orthogonal transforms are not unitary). The tridiagonal form is prepared only for complex-energy ',
'(pole and resonance) searches or long scans of one channel set.</li></ul>',
'</div>',
'<div class="card"><h3>J. CDCC: projectile breakup with a binned continuum</h3>',
'<ul><li><b>Model space.</b> The projectile is core + valence (core spin 0, valence spin s). Its internal Hamiltonian h = T<sub>r</sub> + V<sub>cv</sub>(r) ',
'(Woods-Saxon or Gaussian, optional Thomas spin-orbit, Coulomb when both fragments are charged) gives the bound state, whose depth is fitted to the ',
'binding energy with the required node count, and continuum states u<sub>k</sub>(r) normalised to F cos&delta; + G sin&delta;. Each bin is ',
'u<sub>bin</sub>(r) = sqrt(2/(&pi; &Delta;k)) &int; u<sub>k</sub>(r) dk, integrated over a uniform k interval with Gauss-Legendre points (the number grows with r<sub>max</sub>&Delta;k because u<sub>k</sub> oscillates in k).</li>',
'<li><b>Channels.</b> A state |(l s) j&gt; with energy e<sub>bin</sub> = &hbar;<sup>2</sup>(k<sub>1</sub><sup>2</sup>+k<sub>1</sub>k<sub>2</sub>+k<sub>2</sub><sup>2</sup>)/6&mu; above threshold is an excited state of spin I = j and parity (-1)<sup>l</sup> ',
'at E<sub>x</sub> = e<sub>bin</sub> + |&epsilon;<sub>b</sub>|; it couples with L to the total J like any inelastic channel, so the R-matrix solver, the Coulomb boundary conditions, ',
'the absorption analysis and the workers are used unchanged.</li>',
'<li><b>Couplings.</b> U(R, r) = U<sub>cT</sub>(|R - a<sub>v</sub> r|) + U<sub>vT</sub>(|R + a<sub>c</sub> r|) with a<sub>v</sub> = A<sub>v</sub>/A<sub>p</sub>, a<sub>c</sub> = A<sub>c</sub>/A<sub>p</sub> (nuclear and Coulomb, both central) is ',
'expanded in Legendre multipoles V<sub>Q</sub>(r, R) on a Gauss-Legendre grid in cos&theta;; the form factors F<sup>Q</sup><sub>ab</sub>(R) = &int; u<sub>a</sub> V<sub>Q</sub> u<sub>b</sub> dr ',
'are combined with (-1)<sup>L+I&#39;+J</sup> {L&#39; I&#39; J; I L Q} &lt;L&#39;||Y<sub>Q</sub>||L&gt; &lt;(l&#39;s)j&#39;||Y<sub>Q</sub>||(ls)j&gt; and 4&pi;/(2Q+1). The Q = 0 ',
'diagonal term of the ground state is the folded (Watanabe) potential; no separate entrance potential is used.</li>',
'<li><b>Tests.</b> A free l = 0 bin is the analytic sqrt(2/(&pi;&Delta;k))(cos k<sub>1</sub>r - cos k<sub>2</sub>r)/r; Numerov phase shifts agree with the Lagrange-mesh R-matrix; ',
'bins are orthogonal to the bound state and to each other, their norm tends to 1 as r<sub>max</sub> grows, and bound state + bins are complete for a test function; the coupling ',
'matrix (multipoles + 6j algebra, valence spin 1/2) equals a brute-force five-dimensional projection; with real fragment potentials S is unitary and symmetric, with absorptive ones ',
'the reaction cross section equals the absorption integral of the wave functions.</li>',
'<li><b>Convergence is the user&#39;s responsibility.</b> Breakup cross sections must be checked against the number and range of bins, Q<sub>max</sub>, the partial waves l, r<sub>max</sub>, ',
'the channel radius a (without the external-region solver of section K the couplings end at a; with it, R<sub>asym</sub> takes this role) and J<sub>max</sub>.</li>',
'<li><b>Measured for the d + 58Ni preset</b> (E<sub>cm</sub> = 20.874 MeV, illustrative nucleon potentials, total breakup in mb). Reference: s + d bins, 4 per l to 8 MeV, Q &le; 2, r<sub>max</sub> 60 fm, a = 20 fm, J &le; 30: 52.90. ',
'J &le; 40: 52.90; r<sub>max</sub> 100 fm: 52.78; a = 26 fm: 52.36; 6 bins per l: 53.40; Q &le; 4: 49.94; adding p bins: 87.28. With Q &le; 4: bins to 12 MeV (6 per l) 40.60, to 16 MeV (8 per l) 34.13; ',
'the 0-8 MeV bins kept and 2 per l added from 8 to 16 MeV: 34.09, of which 29.31 in 0-8 MeV. The upper continuum, through continuum-continuum couplings, is therefore the slowest parameter here, not the bin width.</li></ul>',
'</div>',
'<div class="card"><h3>K. Couplings beyond the channel radius (asymptotic Coulomb)</h3>',
'<ul><li><b>Why.</b> Coulomb multipole couplings fall off only as R<sup>-(&lambda;+1)</sup>. Cutting them at the channel radius a misses most of the excitation in sub-barrier heavy-ion ',
'Coulomb excitation and distorts Coulomb (dipole) breakup in CDCC.</li>',
'<li><b>Method.</b> The interior is solved on the Lagrange mesh as before and gives the R-matrix at a. The region a &lt; R &lt; R<sub>asym</sub> is cut into sectors of width ',
'd = min(d<sub>max</sub>, kd / k<sub>loc</sub>), with k<sub>loc</sub><sup>2</sup> = max<sub>c</sub>|E<sub>c</sub>|/(&hbar;<sup>2</sup>/2&mu;) + L<sub>max</sub>(L<sub>max</sub>+1)/R<sup>2</sup>. ',
'In each sector the coupled equations are solved on an N<sub>s</sub>-point Lagrange-Legendre mesh with Bloch operators at both ends, which gives the sector R-matrix ',
'u(x<sub>0</sub>) = -R<sub>11</sub>u&#39;(x<sub>0</sub>) + R<sub>12</sub>u&#39;(x<sub>1</sub>), u(x<sub>1</sub>) = -R<sub>21</sub>u&#39;(x<sub>0</sub>) + R<sub>22</sub>u&#39;(x<sub>1</sub>). ',
'The global R-matrix is propagated as R &larr; R<sub>22</sub> - R<sub>21</sub>(R + R<sub>11</sub>)<sup>-1</sup>R<sub>12</sub> and matched to Coulomb functions at R<sub>asym</sub>. ',
'The product of the maps T = (R + R<sub>11</sub>)<sup>-1</sup>R<sub>12</sub> carries u&#39;(R<sub>asym</sub>) of the physical solution back to u&#39;(a). That drives the interior wave function, and the sector ',
'solutions give the absorption beyond a, so the flux balance stays exact. Sectors with real couplings are solved in real arithmetic.</li>',
'<li><b>Couplings used outside a.</b> Collective models use the same local form factors as inside (nuclear tails and the Coulomb multipoles of the deformed charge). ',
'For CDCC the form factors are integrated numerically up to R<sub>x</sub> = max(a<sub>c</sub>, a<sub>v</sub>) r<sub>max</sub> + R<sub>cut</sub> (R<sub>cut</sub>: range of the fragment-target potentials). ',
'Beyond R<sub>x</sub> they are taken in the exact form [z<sub>c</sub>a<sub>v</sub><sup>Q</sup> + z<sub>v</sub>(-a<sub>c</sub>)<sup>Q</sup>] &lt;a|r<sup>Q</sup>|b&gt; / R<sup>Q+1</sup>. ',
'The bins must then be orthonormal (bound state projected out, Loewdin S<sup>-1/2</sup>), so that the monopole tends to Z<sub>p</sub>Z<sub>T</sub>e<sup>2</sup>/R &delta;<sub>ab</sub>. ',
'This is switched on automatically. Blocks (J, &pi;) without an entrance channel are now skipped; for a spinless projectile this halves the work.</li>',
'<li><b>Tests.</b> Single channel: propagating through Coulomb + centrifugal to 200 fm leaves S unchanged (4e-11). Rotor: two different sector meshes agree (1e-10), and with real potentials ',
'S is unitary and symmetric (1e-12). CDCC: the exact multipole tails equal the numerically folded F<sup>Q</sup> (1.7e-12), interior a = 20 fm + propagation equals one Lagrange mesh with a = 40 fm (5.6e-7, ',
'the interior mesh error), the flux balance including absorption beyond a holds to 2e-14, and with real potentials S is unitary and symmetric out to 150 fm.</li>',
'<li><b>Measured effect.</b> 16O + 152Sm at E<sub>cm</sub> = 55 MeV: &sigma;(2+) = 162 mb with the couplings cut at 15 fm, 2161 mb converged (R<sub>asym</sub> &ge; 240 fm). ',
'd + 58Ni CDCC with s, p, d bins (to 8 MeV, Q &le; 4, J &le; 30, r<sub>max</sub> 60 fm), total breakup in mb: raw bins and no external region 83.7; orthonormal bins 77.5; R<sub>asym</sub> 50 / 100 / 200 / 400 fm: ',
'67.5 / 67.2 / 67.7 / 67.8 (p-wave part 26.8 without the external region, 21.2 at 200 fm); R<sub>asym</sub> 200 fm with J &le; 50: 68.8 / 71.1 / 72.3 for r<sub>max</sub> 60 / 100 / 150 fm. ' +
'R<sub>asym</sub> converges by about 200 fm; r<sub>max</sub> (the extent of the bins, which also sets R<sub>x</sub>) converges more slowly.</li>',
'<li><b>Speed (Stage 15).</b> (1) CDCC multipoles: the point-Coulomb part is analytic (r<sub>&lt;</sub><sup>Q</sup>/r<sub>&gt;</sub><sup>Q+1</sup>). The short-range remainder (nuclear plus uniform-sphere correction) is integrated in the distance &rho; = |R - s| over its support only. ',
'Since P<sub>Q</sub>(&mu;(&rho;)) is a polynomial in &rho;<sup>2</sup>, the integral reduces to cumulative moment tables &int; &rho;<sup>2k+1</sup>U<sub>sr</sub> d&rho; when (R<sup>2</sup>+s<sup>2</sup>)/2Rs &le; 2; otherwise composite Gauss panels of 1 fm, split at the Coulomb radius, are used. ',
'This is about 6 times faster than the former 40-point Gauss rule in cos &theta;, and much more accurate: about 1e-8 MeV, against errors up to 2e-2 MeV at R = 20 fm and 0.17 MeV at R = 50 fm. Those errors sat in the bin tails; the Stage 13 preset breakup (49.9423 mb) is unchanged to the 4 decimals printed, the d + 58Ni R<sub>asym</sub> = 200 fm case by 1.4e-4. ',
'(2) Sector matrices are symmetric, so they are factorised as P A P<sup>T</sup> = L D L<sup>T</sup> (Bunch-Kaufman pivoting, real or complex symmetric), and R = Y<sup>T</sup>D<sup>-1</sup>Y with Y = L<sup>-1</sup>PF needs one triangular solve. ',
'The interior coefficients are formed only in sectors with absorption. (3) Default sector mesh N<sub>s</sub> = 12, k<sub>loc</sub>d = 5 (S unchanged to 4e-11 against N<sub>s</sub> = 16, kd = 7). ',
'(4) With the external region on, the channel radius only has to enclose the strong-coupling region. For d + 58Ni, a = 12 fm (N = 30) gives the cross sections of a = 20 fm (N = 50) to 6 digits, and the dense interior solve shrinks by (30/50)<sup>3</sup>. ',
'Measured (one thread, 13 CDCC states, J &le; 50, R<sub>asym</sub> = 200 fm, r<sub>max</sub> = 100 fm): 357.9 s with the Stage 14 settings, 241.4 s with (1)-(3), 145.2 s with a = 12 fm as well. ',
'Sector factorisations are not reused across J: the centrifugal terms and the coupling geometry change with J. The channel coupling matrix is dense (all off-diagonal channel pairs couple), so channel-block-sparse solves have nothing to exploit.</li>',
'<li><b>Energy scans (Stage 16).</b> A sector matrix depends on the energy only through -E 1. For several energies the run is organised J-outer, energy-inner: each (J, &pi;) block is prepared once, evaluated at every energy, and released. ',
'Real sectors are tridiagonalised (Householder) with the boundary matrix F transformed alongside, then diagonalised by implicit QL with the rotations applied to G = O<sup>T</sup>F, so R(E) = &Sigma;<sub>k</sub> g<sub>k</sub>g<sub>k</sub><sup>T</sup>/(&lambda;<sub>k</sub> - E). ',
'Absorptive (complex-symmetric) sectors keep the complex-symmetric tridiagonal form: Ft<sup>T</sup>(T - E)<sup>-1</sup>Ft with a pivoted tridiagonal solve, because complex-orthogonal eigenvectors can be ill-conditioned. ',
'One sector grid, built for the whole energy range, serves all energies. In scans the absorption beyond a is taken from the currents, &int; u<sup>+</sup>(-Im V)u = J(a) - J(R<sub>asym</sub>) with J = &Sigma;<sub>c</sub> &hbar;<sup>2</sup>/2&mu; Im(u<sub>c</sub>* u<sub>c</sub>&#39;). ',
'This equals the sector quadrature to 5e-12, but it is a total, not split by state. ',
'Measured (CDCC, 7 states, J &le; 12, a = 12 fm, R<sub>asym</sub> = 100 fm): the external part costs about 3 times less for 6 energies and 6 times less for 16. ',
'The interior then dominates: one dense solve per energy for the R-matrix and the absorption wave functions.</li>',
'<li><b>Interior in scans (Stage 17).</b> In energy scans the interior channel set is reduced once to complex-symmetric tridiagonal form T = Q<sup>T</sup>HQ, with Q<sup>T</sup> kept (the identity is carried along with F). ',
'The R-matrix needs (T - E)<sup>-1</sup>Q<sup>T</sup>F. The absorption wave functions use the same solve: c = (H - E)<sup>-1</sup>B with B = F diag(&radic;(&hbar;<sup>2</sup>a/2&mu;<sub>c</sub>)) u&#39;(a), so ',
'c = Q[(T - E)<sup>-1</sup>Q<sup>T</sup>F] diag(...) u&#39;(a), at n<sup>2</sup> operations per entrance column and no factorisation per energy. Large sets switch to this form at the first energy of a scan with at least 3 energies (Stage 19: Q is no longer accumulated; the reflectors are kept and applied to the few wave-function vectors, so a reduction costs about 1.5 LU instead of about 5). ',
'With real potentials the interior absorption is identically zero and no wave functions are computed. ',
'Measured (CDCC, 7 states, J &le; 12, a = 12 fm, R<sub>asym</sub> = 100 fm): 16 energies take 131.8 s one by one, 57.6 s as a scan with the interior LU, and 34.8 s with the tridiagonal interior; 6 energies take 51.9 / 56.3 / 35.1 s. ',
'The tridiagonal route agrees with the LU route to about 6e-10 in S and 3e-10 in the cross sections; its transforms are complex orthogonal, not unitary, so it is not as accurate as the LU route (Stage 12).</li>',
'<li><b>Spinful deuteron with a D state (Stage 18).</b> With the internal Hamiltonian set to Reid68, the p-n relative motion is solved with the Reid soft-core <sup>3</sup>S<sub>1</sub>-<sup>3</sup>D<sub>1</sub> potential ',
'(V<sub>C</sub>, V<sub>T</sub> S<sub>12</sub>, V<sub>LS</sub> L&middot;S, x = 0.7 r; &hbar;<sup>2</sup>/m = 41.47 MeV fm<sup>2</sup>) by a matrix Numerov integration. ',
'The 1/r cores of the Yukawa sums enter the start values exactly (u = r + c r<sup>2</sup>/(2 - l(l+1)), Y<sub>0</sub> = -(h<sup>2</sup>/12) c), and the columns are re-orthogonalised every 16 steps (&Phi; &rarr; &Phi;&Phi;(r)<sup>-1</sup>), ',
'without which the repulsive core aligns the regular solutions and the bound-state energy depends on the matching radius at the 1e-3 MeV level. ',
'Deuteron: B = 2.224602 MeV, P<sub>D</sub> = 6.4696 %, Q = 0.27964 fm<sup>2</sup>, A<sub>S</sub> = 0.87758 fm<sup>-1/2</sup>, &eta; = 0.02623, the published Reid soft-core values (tabulated: B 2.2246, P<sub>D</sub> 6.4696 %, Q 0.27964, A<sub>S</sub> 0.87758, &eta; 0.02622). ',
'Continuum states are Blatt-Biedenharn eigenchannels &psi;<sub>&alpha;</sub> &rarr; O<sub>&alpha;</sub> sin(kr - l&pi;/2 + &delta;<sub>&alpha;</sub>), from the matching at a rotated angle (K<sub>t</sub> = O tan(&delta; - t) O<sup>T</sup>, no tan &delta; &rarr; &infin; problem), ',
'tracked in k by eigenvector overlap and phase unwrapping; each eigenchannel gives one bin per k interval. The internal states are sums of orbital components, and every coupling, multipole moment and overlap sums over component pairs with ',
'&lang;(l\'S)j\'||Y<sub>Q</sub>||(lS)j&rang; for S = 1, the spectator pair spin. Checked against a brute-force 5-D integral with explicit spin-1 sums, and in the tensor-free limit against the single-component s = 1 model (2e-7). ',
'Reid68 is a T = 0 interaction: it is exact for 1+, an approximation for other even-parity sets, and odd-parity (T = 1) sets should use plane waves.</li>',
'<li><b>Scans for transfer and multi-partition problems (Stage 19).</b> Energy scans now cover every problem type: CRC over several partitions, DWBA and two-step DWBA, with or without the external region. ',
'The run is J-outer, energy-inner: each (J, &pi;) block builds its channels and transfer kernels once, is prepared once, is evaluated at all energies, and is released; the observables of each energy are assembled from the stored blocks as in the J-parallel assembly. ',
'Interior: the tridiagonal form with stored Householder reflectors (Q x = H<sub>0</sub>&hellip;H<sub>n-3</sub>x at O(n<sup>2</sup>) per wave-function vector). ',
'NONO: the generalised problem (H<sub>c</sub> - E N<sub>c</sub>)c = F with the real symmetric metric N<sub>c</sub> = 1 + N + N<sup>T</sup> is reduced once by the Cholesky factor N<sub>c</sub> = LL<sup>T</sup> (envelope storage; rows of L are skipped where the metric is trivial): ',
'H&#770; = L<sup>-1</sup>H<sub>c</sub>L<sup>-T</sup>, F&#770; = L<sup>-1</sup>F, then R = F&#770;<sup>T</sup>(H&#770; - E)<sup>-1</sup>F&#770; and c = L<sup>-T</sup>(H&#770; - E)<sup>-1</sup>L<sup>-1</sup>B. If N<sub>c</sub> is not positive definite the direct solve at every energy is kept. ',
'With workers, scans of such problems split the (J, &pi;) blocks over the workers and each worker scans all energies (option <i>energy scans with workers</i>), so kernels and reductions are not repeated per worker; the result equals the inline scan exactly. ',
'Measured (40Ca(d,p)41Ca preset, a = 22 fm, N = 60, J &le; 25, 6 energies, one thread): CRC 384.8 s energy by energy, 116.8 s as a scan; CRC + remnant + NONO 728.1 s energy by energy, 277.9 s as a scan (about 3 s of each block is the metric transform). ',
'The scan agrees with the per-energy solves to about 2e-8 in S and 2e-9 in the cross sections. DWBA scans are equal to the per-energy runs bit for bit and gain little (2.2 s per energy is mostly the distorted-wave solves).</li>',
'<li><b>Partial-wave Reid interactions (Stage 20).</b> Each j<sup>&pi;</sup> bin set of the np pair now takes its own interaction. ',
'<i>Reid68</i>: <sup>3</sup>S<sub>1</sub>-<sup>3</sup>D<sub>1</sub> (Reid 1968) and <sup>3</sup>D<sub>3</sub>-<sup>3</sup>G<sub>3</sub> from Day&#39;s 1981 extension (V<sub>C</sub> = -10.463Y - 103.4Y<sub>2</sub> - 419.6Y<sub>4</sub> + 9924.3Y<sub>6</sub>, tensor as in <sup>3</sup>S<sub>1</sub>, V<sub>LS</sub> = 650Y<sub>4</sub> - 5506Y<sub>6</sub>, x = 0.7r; quoted from Naghdi, arXiv:nucl-th/0702078). ',
'Reid&#39;s 1968 coefficients for <sup>3</sup>D<sub>2</sub> and the T = 1 waves are not implemented (no accessible source was available); the program refuses those waves for Reid68 rather than substituting. ',
'<i>Reid93</i> (Stoks, Klomp, Terheggen, de Swart, Phys. Rev. C 49, 2950 (1994)): every partial wave up to j = 9, transcribed line by line from the authors&#39; routine creid93 (NN-OnLine), with dipole-regularised Yukawa functions (&Lambda; = 8m<sub>&pi;</sub>), neutral- and charged-pion OPE (f<sup>2</sup> = 0.075), the np reduced mass in 2M<sub>r</sub>V/&hbar;<sup>2</sup>. ',
'Checked against the paper: the 108 np phase parameters of Table V (Reid93 rows, 1-350 MeV, relativistic k, Nijmegen bar phases) agree to 0.005&deg; (the table&#39;s rounding); the deuteron gives B = 2.224585 MeV (relativistic, fitted 2.224575), &eta; = 0.02514, A<sub>S</sub> = 0.88531 fm<sup>-1/2</sup>, P<sub>D</sub> = 5.699 %, Q = 0.27035 fm<sup>2</sup> (Table VI: 0.0251, 0.8853, 5.699, 0.2703). ',
'<i>Reid68 3S1-3D1 operator (approximation)</i> keeps the Stage 18 behaviour for any set. Odd-parity sets with Reid93 are the T = 1 np waves; plane waves remain available.</li>',
'<li><b>Analysing powers and breakup in the three-body frame (Stage 21).</b> The full amplitude matrix M<sub>(&nu;\'&mu;\'),(&nu;&mu;)</sub>(&theta;) of every final state is built from the S-matrix (quantisation along the beam, y = k<sub>in</sub> x k<sub>out</sub>, Madison convention). ',
'Beam analysing powers T<sub>kq</sub> = Tr(M &tau;<sub>kq</sub> M<sup>+</sup>)/Tr(M M<sup>+</sup>): A<sub>y</sub> for spin 1/2 (checked against the Legendre form 2Re(AB*)/(|A|<sup>2</sup>+|B|<sup>2</sup>)), iT<sub>11</sub>, T<sub>20</sub>, T<sub>21</sub>, T<sub>22</sub> and the Cartesian A<sub>y</sub>, A<sub>ij</sub> for spin 1; for CDCC the polarised spin is the deuteron state spin. ',
'For CDCC the bin amplitudes are recombined coherently into the three-body amplitude F<sub>&sigma;&mu;</sub>(k, K) with the exact overlap of each eigenchannel bin with the np scattering state, e<sup>i&delta;</sup>(-i)<sup>l</sup>O<sub>l&alpha;</sub>(k)Y<sub>lm</sub>(k)/(k&radic;&Delta;k) (L&ouml;wdin mixing applied for orthonormalised bins). ',
'Shown: d<sup>2</sup>&sigma;/(de d&Omega;<sub>K</sub>), the in-plane correlation d<sup>3</sup>&sigma;/(de d&Omega;<sub>k</sub> d&Omega;<sub>K</sub>), and the lab exclusive d<sup>5</sup>&sigma;/(d&Omega;<sub>p</sub> d&Omega;<sub>n</sub> dE<sub>p</sub>) on the kinematic locus (both branches) with exclusive T<sub>kq</sub>. ',
'Integrating over k returns the sum of bin cross sections exactly (interference integrates out); the lab Jacobian is checked against a 5x5 finite-difference determinant. Kinematics are nonrelativistic; the bin amplitude is constant across a bin, so the energy resolution is the bin width.</li>',
'<li><b>NONO metric from the partition blocks and DWBA distorted-wave reuse (Stage 22).</b> In NONO the metric N<sub>c</sub> = 1 + N + N<sup>T</sup> couples channels of different partitions only, so with B the partition holding most overlapping rows and s the overlapping rows of all others, N<sub>c</sub> - 1 has rank &le; 2s. ',
'A QR of the inter-partition overlap block and a (s + rank) eigenproblem give the exact symmetric inverse square root G = N<sub>c</sub><sup>-1/2</sup> = 1 + U f(&Lambda;) U<sup>T</sup>; the scan works with H^ = G H G, F^ = G F, c = G d at O(n m s) cost instead of dense Cholesky solves ',
'(40Ca(d,p), 6-energy NONO scan, separate processes: metric transform 120 s &rarr; 51 s over 51 blocks, scan 205 s &rarr; 166 s, same S to 1.3e-8; the tridiagonalisation is now the larger part; the Cholesky route remains selectable for cross-checks). Positive definiteness is decided from the same eigenvalues. ',
'At a single energy the LU of (H - E N<sub>c</sub>) is now shared by the R-matrix, the wave functions and the absorption sums (one factorisation per J block instead of two; 40Ca(d,p) at one energy 112 s &rarr; 61 s, bit-identical). ',
'DWBA: every uncoupled distorted-wave component (same channels, reduced widths and Hamiltonian block, compared exactly) is prepared once and shared by all (J, &pi;) blocks and all energies of a scan, with its LU kept per energy (40Ca(d,p): 1 energy 13.3 s &rarr; 10.4 s, bit-identical; a 6-energy scan gains only 5 %, 45.6 s &rarr; 43.3 s, because the scan already shared the kernels and the per-energy component solves remain). The remaining DWBA cost is the transfer kernels.</li>',
'<li><b>Blocked complex LDL<sup>T</sup> and faster tridiagonalisation (Stage 23).</b> Every interior per-energy factorisation of a complex-symmetric H - E (or H - E N<sub>c</sub> with NONO) now uses a blocked Bunch-Kaufman LDL<sup>T</sup> (LAPACK zsytrf/zlasyf organisation: W = L D kept within a panel of 32 columns, left-looking column updates with symmetric interchanges, one rank-32 update of the trailing triangle per panel) instead of the LU: n<sup>3</sup>/3 instead of 2n<sup>3</sup>/3 operations, ',
'same pivots as the unblocked routine, R = Y<sup>T</sup> D<sup>-1</sup> Y with Y = L<sup>-1</sup> P F. Matrices that are not symmetric to rounding fall back to the LU. Large absorptive sectors of the external region use the same routine. ',
'Both the LDL<sup>T</sup> and the tridiagonalisation use a register-blocked lower-triangle rank-k kernel (2 rows x 4 terms) and the tridiagonalisation a two-row symmetric matrix-vector product (40Ca(d,p), n = 780: LDL<sup>T</sup> 0.20-0.26 s vs LU 0.63-0.72 s; tridiagonalisation 0.80-1.13 s vs 1.18-1.32 s). ',
'Timings, 40Ca(d,p) preset, separate processes: CRC at one energy 44.6 &rarr; 23.2 s, CRC + NONO 50.0 &rarr; 26.8 s, 6-energy CRC scan 78.3 &rarr; 61.8 s, 6-energy NONO scan 122.6 &rarr; 106.3 s. ',
'Scans now switch to the tridiagonal form from 5 energies (NONO sets: 8, since the factorisation route needs no metric transform). The tridiagonal route is the less accurate one: its complex-orthogonal reflectors leave errors of 1e-11 to ~1e-7 in S (40Ca(d,p) at 17 MeV: 2.0e-8 with the new kernels, 2.8e-7 with the old ones, against LDL<sup>T</sup> = LU to 6e-11); set CCX.SCAN_TRI_MIN higher to keep the factorisation route.</li>',
'<li><b>Transfer kernels shared across (J, &pi;) blocks (Stage 24).</b> The orbital kernel K<sup>&Lambda;</sup><sub>L<sub>H</sub>L<sub>L</sub></sub>(R<sub>H</sub>, R<sub>L</sub>) of a transfer step depends on the overlap pair and on (&Lambda;, L<sub>H</sub>, L<sub>L</sub>) only; the J dependence is entirely in the recoupling coefficients. ',
'The kernels are kept with the transfer geometry and reused by every (J, &pi;) block (and every energy of a scan) that needs them, within a memory budget (CCX.ORB_CACHE_MB, default 256 MB; oldest kernels evicted first). The kernel loop was rewritten without per-point branches (same values to 1e-16). ',
'40Ca(d,p) preset, one energy: orbital kernels built 439 &rarr; 155; transfer-kernel time 8.5-12.6 s &rarr; 2.3-3.7 s (DWBA, CRC and CRC + NONO), results identical to rounding (DWBA bit for bit). CCX.noOrbCache restores per-J construction.</li>',
'<li><b>Not included.</b> Couplings beyond R<sub>asym</sub>, so check R<sub>asym</sub> and J<sub>max</sub> together. Non-local (transfer) kernels beyond a. Asymptotic (Gailitis-type) expansions are not used.</li></ul>',
'</div>',
'<div class="card"><h3>E. Complex scaling cross-check for resonances</h3>',
'<p>Independently of the Siegert-pole search, the Hamiltonian is rotated \\(r\\to re^{i\\theta}\\) and diagonalised on a',
' Laguerre mesh (complex-symmetric Hessenberg QR). Resonances are eigenvalues that do not move with \\(\\theta\\)',
' (computed at \\(\\theta\\) and \\(0.8\\theta\\)); the rotated continuum lies along \\(\\arg E=-2\\theta\\). The Woods-Saxon',
' analytic-continuation limit \\(\\theta<\\arctan(\\pi a/R)\\) is enforced. Restrictions: analytic potential shapes, first-order',
' (derivative) couplings and point-Coulomb multipoles; spin-orbit, tabulated, all-order deformed and transfer couplings',
' are rejected. Poles broader than the \\(-2\\theta\\) line are reported as not verifiable.</p>',
'</div>',

'<div class="card"><h3>Corrections made in Stage 6</h3>',
'<p>Defects found in the Stage 1-5 build and corrected, each now covered by a validation test:</p><ul>',
'<li>Inelastic angular amplitudes lacked the phase \\(i^{L-L\\prime}\\) (Born test).</li>',
'<li>The Coulomb phase \\(\\arg H^+_L\\) was known only modulo \\(\\pi\\), giving wrong off-diagonal S-matrix signs where',
' \\(G_L<0\\); it is now continuous (checked against mpmath).</li>',
'<li>The bound-state exterior-tail normalisation had the wrong sign and the tail was omitted from rms radii and ANCs',
' (analytic square-well test).</li>',
'<li>Complex-energy R-matrix pole sum used \\(E^{*}\\); all Siegert poles of real potentials were wrong (checked',
' against phase-shift slope and complex scaling). The Newton target is now holomorphic.</li>',
'<li>The monopole reduced matrix element was 0 in the vibrator model and 1 (instead of \\(\\sqrt{2I+1}\\)) in the general',
' model, so vibrator runs lacked the central nuclear potential and \\(I\\neq0\\) states of the general model saw a',
' reduced one.</li>',
'</ul></div>',

'<div class="card"><h3>Input field map to FRESCO</h3>',
'<table class="tbl"><thead><tr><th>FRESCO</th><th>this program</th><th>note</th></tr></thead><tbody>',
'<tr><td>hcm</td><td>grid.hcm</td><td>used by the Numerov comparison engine only</td></tr>',
'<tr><td>rmatch</td><td>grid.rmatch</td><td>external matching radius; the mesh uses the channel radius a</td></tr>',
'<tr><td>jtmin / jtmax</td><td>J min / J max</td><td>J max = 0 selects the automatic criterion</td></tr>',
'<tr><td>absend</td><td>ABSEND</td><td>partial-wave termination threshold</td></tr>',
'<tr><td>jump / jbord</td><td>JUMP</td><td>single jump block, linear interpolation</td></tr>',
'<tr><td>thmin/thmax/thinc</td><td>angle grid</td><td>centre-of-mass angles</td></tr>',
'<tr><td>elab</td><td>energy</td><td>lab or cm, MeV / keV / MeV per nucleon</td></tr>',
'<tr><td>&amp;PARTITION massp,zp,masst,zt</td><td>projectile/target</td><td>entrance partition; further partitions on the Transfer or Multi-step transfer card</td></tr>',
'<tr><td>&amp;STATES jt, et, ptyt</td><td>level list</td><td>jp sets the projectile spin</td></tr>',
'<tr><td>&amp;POT type=0</td><td>Coulomb (uniform sphere)</td><td>p2 = r_c</td></tr>',
'<tr><td>&amp;POT type=1 / 2</td><td>volume / surface central</td><td>p1..p6 = V,r0,a,W,r0i,ai</td></tr>',
'<tr><td>&amp;POT type=3,4</td><td>spin-orbit</td><td>Thomas form, diagonal in the channel basis</td></tr>',
'<tr><td>&amp;POT type=10,11</td><td>deformed projectile / target</td><td>p2,p3 read as beta2, beta4</td></tr>',
'<tr><td>&amp;STEP ia,ib,k,str</td><td>general coupling table</td><td>0-based indices in this program</td></tr>',
'<tr><td>SHAPE 0..5</td><td>WS, WS<sup>2</sup>, Gaussian, Yukawa, exponential, Reid soft core</td><td></td></tr>',
'</tbody></table></div>',

'<div class="card"><h3>Limitations - what is NOT implemented</h3>',
'<ul>',
'<li><b>Transfer</b>: one-step transfer of one particle between the ground state of the entrance partition and',
' single-particle states of each partition (any number of partitions and steps, see F); one (l, j) component per',
' overlap (no deuteron D-state, no tensor force); simultaneous two-nucleon transfer through a truncated pair basis (H; the heavy side assumes a spin-0 core, the triton is L = 0 with central Minnesota forces, the deuteron has no D state; Coulomb is not included in the triton). The remnant term uses the central',
' parts of the optical potentials. With NONO the direct solve costs O(n<sup>3</sup>) per J and energy.</li>',
'<li><b>CDCC</b> (section J): two-body projectiles only, core spin 0, central fragment-target potentials, couplings beyond the channel radius only with the external-region solver (section K), and never beyond R_asym; in deuteron breakup the nucleon spins and the deuteron D state are left out. Transfer into or out of the CDCC partition is not combined with breakup.</li>',
'<li><b>Potential types 5-9</b> (tensor, spin-spin, effective mass) are not implemented; they are ',
'rejected on import with a message.</li>',
'<li><b>Complex scaling</b> handles analytic shapes, first-order couplings and point Coulomb only (see E).</li>',
'<li><b>Double-double arithmetic</b> is not implemented. It is not needed for the energies tested: the ',
'logarithmic penetrability route keeps \\(\\ln P\\) exact in ordinary double precision down to 1 keV and ',
'beyond \\(\\eta=10^3\\).</li>',
'<li><b>Yennie-Ravenhall-Wilson amplitude acceleration</b> is not implemented. The nuclear partial-wave ',
'sum converges on its own because S-1 falls off beyond the grazing partial wave; increase J max if a ',
'small-angle distribution looks ragged.</li>',
'<li><b>Second-order (two-step) couplings</b> beyond those generated by the all-order numerical ',
'deformation of the potential are not added separately, and the Kermode-Rowley matrix construction ',
'(FRESCO TYPE 17) is not implemented as a distinct option.</li>',
'<li>Non-zero projectile spin is implemented through the standard 6j recoupling and is validated only ',
'against an explicit m-space summation of the spin-1/2 coupling matrix elements and by S-matrix symmetry/unitarity.</li>',
'<li>The Buttle correction uses the free (centrifugal-only) single-channel problem, which is the usual ',
'choice; it is exact for the free case and is checked by the N-convergence monitor.</li>',
'<li>The multi-start search is stochastic (no guarantee of the global minimum); lab kinematics are nonrelativistic and the angular resolution is not folded.</li>',
'</ul>',
'<p>Constants used: \\(\\hbar c=197.3269804\\) MeV fm, \\(e^2=1.439964548\\) MeV fm, ',
'\\(u=931.49410242\\) MeV/\\(c^2\\). FRESCO (www.fresco.org.uk) was used only as a reference for physics ',
'conventions, input names and example cases; no FRESCO code or algorithm is reproduced here.</p>',
'</div>',
'<div class="card"><h3>Comparison with data and least-squares fitting</h3>',
'<ul><li><b>Data.</b> Tables are pasted or loaded in the Cross sections tab (columns chosen freely, # comments ignored). Observables: ',
'd&sigma;/d&Omega;, ratio to Rutherford, A<sub>y</sub>, iT<sub>11</sub>, T<sub>20</sub>, T<sub>21</sub>, T<sub>22</sub>, &sigma;<sub>R</sub>(E) and integrated state cross sections. ',
'Points without a positive uncertainty are rejected; percentage or absolute errors and a percentage added in quadrature can be set per data set.</li>',
'<li><b>Theory at the data points.</b> Every evaluation builds the full model and solves each data energy; angular observables are computed at the exact data angles.</li>',
'<li><b>Lab frame.</b> With \\(\\gamma = (k/m_A)(m_b/k\')\\) (nonrelativistic, b the detected light particle) ',
'\\(\\theta_{cm} = \\theta_L + \\arcsin(\\gamma\\sin\\theta_L)\\) and ',
'\\(d\\sigma/d\\Omega_L = d\\sigma/d\\Omega_{cm}\\,(1+\\gamma^2+2\\gamma\\cos\\theta_{cm})^{3/2}/|1+\\gamma\\cos\\theta_{cm}|\\); lab data with \\(\\gamma\\ge 1\\) are refused (double valued).</li>',
'<li><b>&chi;<sup>2</sup>.</b> \\(\\chi^2=\\sum_i (N t_i-y_i)^2/e_i^2\\) per data set; N is fixed, free, or free with a Gaussian prior ',
'(adds \\(((N-N_0)/\\sigma_N)^2\\)). Free normalisations are profiled in closed form, which leaves the covariance of the other parameters exact (variable projection); ',
'\\(\\nu = n_{data} - n_{par} - n_{N,free}\\).</li>',
'<li><b>Minimiser.</b> Levenberg-Marquardt with Marquardt diagonal scaling, forward-difference Jacobian (relative step 10<sup>-4</sup> by default) and box bounds ',
'(parameters at a bound whose gradient points outward are frozen for the step and reported without an error). Errors are \\(\\sqrt{\\mathrm{diag}(J^TJ)^{-1}}\\) at the minimum, ',
'also shown rescaled by \\(\\sqrt{\\chi^2/\\nu}\\); the correlation matrix flags |r| &gt; 0.9. The Jacobian columns of an iteration are solved in parallel workers.</li>',
'<li><b>Checks.</b> In-app test: LM equals the normal-equation solution of a linear model, and V, W of the &alpha; + <sup>12</sup>C potential are recovered from synthetic c.m. and lab-frame data. ',
'Command-line tests also cover bounds, Rosenbrock, kinematic invariance of &int;d&sigma;, the analytic normalisation against a scan, and &chi;<sup>2</sup>/&nu; and pulls for data with 5 % Gaussian noise.</li>',
'<li><b>Global search.</b> Inside the bounded box: a Latin-hypercube screening (default 10 points per parameter, evaluated as one parallel batch), then local LM fits from the current point and the best mutually separated samples (5 % of the box apart), advanced side by side. ',
'Results are clustered into distinct minima (scaled distance 10<sup>-3</sup> of the box) with the number of starts reaching each. This is a stochastic search: more samples and starts raise the chance of finding the global minimum but do not guarantee it.</li>',
'<li><b>Profile likelihood.</b> For each parameter \\(\\chi^2_{prof}(p_j)=\\min_{p_{k\\ne j}}\\chi^2\\) on a grid of steps 0.5&sigma; (both sides in parallel, each point continued from its neighbour); the interval is where ',
'\\(\\Delta\\chi^2_{prof}=1\\) (or \\(\\chi^2/\\nu\\) when the scaling option is on), located with quadratic interpolation (exact for a parabola). Unequal &minus;/+ errors or a deviation &gt; 20 % from the covariance error mark a non-parabolic profile; ',
'a side that reaches a bound or the last grid point is reported as open; a lower &chi;<sup>2</sup> met on the way is reported (the fit was local).</li>',
'<li><b>Not included.</b> Angular resolution folding, correlated systematic errors other than one normalisation per set, relativistic kinematics, deterministic global optimisation, and Bayesian posteriors.</li></ul>',
'</div>',
].join('\n');

/* ============================================================================
 * 80-boot.js -- tab switching and start-up.
 * ==========================================================================*/
(function () {
  var TABS = [
    ['input', '1', 'Input'], ['potentials', '2', 'Potentials'], ['cross', '3', 'Cross sections'],
    ['reaction', '4', 'Reaction &amp; absorption'], ['smatrix', '5', 'S-matrix &amp; phases'],
    ['bound', '6', 'Bound &amp; quasi-bound'], ['wave', '7', 'Wave functions'],
    ['conv', '8', 'Convergence &amp; tests'], ['help', '9', 'Help']
  ];
  function showTab(id) {
    if (id === 'input' && window.MODELS) { showModel(window._curModel || MODELS.classOf(APP.state())); return; }
    if (window.MODELS) MODELS.drawer(false);
    var mp = document.getElementById('tab-model'); if (mp) mp.style.display = 'none';
    if (window.MODELS) MODELS.markModelBar(null);
    TABS.forEach(function (t) {
      var p = document.getElementById('tab-' + t[0]);
      var b = document.getElementById('tb-' + t[0]);
      if (p) p.style.display = (t[0] === id) ? '' : 'none';
      if (b) b.className = 'tabbtn' + ((t[0] === id) ? ' active' : '');
    });
    window._activeTab = id;
    try { localStorage.setItem('ccx-tab', id); } catch (e) { }
    if (id === 'potentials') renderPotentialsTab();
    if (id === 'cross') renderCrossTab();
    if (id === 'reaction') renderReactionTab();
    if (id === 'smatrix') renderSmatrixTab();
    if (id === 'bound') renderBoundTab();
    if (id === 'wave') renderWaveTab();
    if (id === 'conv') renderConvTab();
    if (id === 'help' && window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    if (window.MATH) MATH.mathify();
  }
  window.showTab = showTab;
  /* model-class page (preset gallery) */
  function showModel(id) {
    TABS.forEach(function (t) {
      var p = document.getElementById('tab-' + t[0]), bt = document.getElementById('tb-' + t[0]);
      if (p) p.style.display = 'none'; if (bt) bt.className = 'tabbtn';
    });
    var mp = document.getElementById('tab-model'); if (mp) mp.style.display = '';
    MODELS.renderModelPage(id); MODELS.markModelBar(id);
    window._activeTab = 'model:' + id;
    try { localStorage.setItem('ccx-tab', 'model:' + id); } catch (e) { }
    if (window.MATH) MATH.mathify();
    if (window.MathJax && MathJax.typesetPromise) try { MathJax.typesetPromise(); } catch (e) { }
  }
  window.showModel = showModel;
  function showAny(key) { if (key && key.indexOf('model:') === 0) showModel(key.slice(6)); else showTab(key || 'input'); }
  window.showAny = showAny;

  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.getElementById('tabbar'), nb = 0;
    TABS.forEach(function (t) {
      if (t[0] === 'input' && window.MODELS) return;          /* the input form lives in every model tab */
      var b = document.createElement('button');
      b.id = 'tb-' + t[0]; b.className = 'tabbtn'; b.innerHTML = '<span class="tabnum">' + (++nb) + '</span><span class="tablbl">' + t[2] + '</span>';
      b.onclick = function () { showTab(t[0]); };
      bar.appendChild(b);
    });
    try {
      var saved = localStorage.getItem('ccx-autosave');
      if (saved) {
        var s = JSON.parse(saved);
        if (s && s.proj && s.grid) {
          /* fill fields added in later versions from the defaults */
          var d = MODEL.defaults();
          for (var k in d) if (s[k] === undefined) s[k] = d[k];
          ['resSearch', 'options', 'transfer'].forEach(function (g) {
            for (var kk in d[g]) if (s[g][kk] === undefined) s[g][kk] = d[g][kk];
          });
          APP.setState(s);
        }
      }
    } catch (e) { }
    renderAll();
    if (window.MODELS) MODELS.buildBar();
    showAny(localStorage.getItem('ccx-tab') || ('model:' + (window.MODELS ? MODELS.classOf(APP.state()) : 'optical')));
    /* parameter labels: typeset with MathJax whenever tab content is (re)rendered */
    if (typeof MutationObserver !== 'undefined' && window.MATH) {
      var mo = new MutationObserver(function () { MATH.mathify(); });
      mo.observe(document.querySelector('main'), { childList: true, subtree: true });
    }
    document.getElementById('runBtn').onclick = APP.run;
    var fb = document.getElementById('filesBtn');
    if (fb && window.MODELS) {
      fb.onclick = function (e) { if (e && e.stopPropagation) e.stopPropagation(); MODELS.openFiles(!window._filesOpen); };
      var fpn = document.getElementById('filesPanel'); if (fpn) fpn.addEventListener('click', function (e) { if (e && e.stopPropagation) e.stopPropagation(); });
      document.addEventListener('click', function () { if (window._filesOpen) MODELS.closeFiles(); });
    }
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); APP.undo(); }
      if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); APP.redo(); }
      if (e.key === 'F9') { e.preventDefault(); APP.run(); }
      if (e.key === 'Escape' && window.MODELS) { MODELS.drawer(false); MODELS.closeFiles(); }
    });
    window.addEventListener('resize', function () {
      clearTimeout(window._rz);
      window._rz = setTimeout(function () { showAny(window._activeTab || 'input'); }, 180);
    });
  });
})();

</script>
</body>
</html>
