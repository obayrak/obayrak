<script>
/*site theme: follows the Night/Day choice stored in localStorage "siteTheme"*/
(function(){
  var K='siteTheme';
  function get(){ try{ return localStorage.getItem(K)||''; }catch(e){ return ''; } }
  function mode(){ return get()==='night'?'night':'day'; }
  function apply(){
    var m=mode(); document.documentElement.setAttribute('data-theme',m);
    try{ if(window.parent!==window && window.parent.__siteThemeSync) window.parent.__siteThemeSync(m); }catch(e){}
  }
  window.__siteTheme={ set:function(m){ try{ localStorage.setItem(K,m); }catch(e){} apply(); }, mode:mode };
  window.addEventListener('storage',function(e){ if(e.key===K) apply(); });
  apply();
})();
</script>
