<style>
  .link-buttons {
    --btn-font: 16px;
    --btn-pad-y: 11px;
    --btn-pad-x: 20px;
    display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0;
  }
  .link-btn {
    display: inline-block;
    padding: var(--btn-pad-y) var(--btn-pad-x);
    border-radius: 8px;
    font: 600 var(--btn-font)/1 system-ui, sans-serif;

  .link-btn.orcid   { background: #a6ce39; color: #1a1a1a; }
