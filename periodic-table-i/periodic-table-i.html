<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table of Elements</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c10;--surface:#111318;--card:#161920;--border:rgba(255,255,255,0.07);
  --text:#e2e8f0;--muted:#94a3b8;
  --mono:'DM Mono',monospace;--ui:'Outfit',sans-serif;
  --alkali:#ef4444;--alkaline:#f97316;--transition:#3b82f6;--post:#8b5cf6;
  --metalloid:#06b6d4;--nonmetal:#22c55e;--halogen:#84cc16;--noble:#ec4899;
  --lanthanide:#f59e0b;--actinide:#a78bfa;--unknown:#6b7280;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px}
body{font-family:var(--ui);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:auto;overflow-y:auto}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

header{padding:24px 40px 16px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;border-bottom:1px solid var(--border)}
.title-block h1{font-size:1.9rem;font-weight:800;letter-spacing:-0.03em;color:#fff;line-height:1}
.title-block p{font-family:var(--mono);font-size:13px;color:#cbd5e1;letter-spacing:0.12em;text-transform:uppercase;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.leg-item{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text);cursor:pointer;transition:color .15s;white-space:nowrap}
.leg-item:hover{color:#fff}
.leg-dot{width:13px;height:13px;border-radius:3px;flex-shrink:0}

.search-wrap{padding:14px 40px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-input{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 14px;color:var(--text);font-family:var(--ui);font-size:15px;width:260px;outline:none;transition:border-color .15s}
.search-input:focus{border-color:rgba(255,255,255,.25)}
.search-input::placeholder{color:var(--muted)}
.filter-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid;cursor:pointer;opacity:.7;transition:opacity .15s;white-space:nowrap}
.chip.active{opacity:1}

.table-wrap{padding:18px 40px 0;overflow-x:auto}
.table-inner{min-width:1620px;display:grid;grid-template-columns:28px repeat(18,1fr);grid-template-rows:24px repeat(7,80px);gap:4px}
.period-label,.group-label{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:500;color:#cbd5e1;pointer-events:none}
.period-label{justify-content:flex-end;padding-right:4px}

.el{background:var(--card);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:5px 6px 5px 7px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s,border-color .12s;min-width:0}
.el::before{content:'';position:absolute;inset:0;opacity:.16;border-radius:4px;background:currentColor}
.el>div{position:relative}
.el:hover{transform:scale(1.07);z-index:10;border-color:rgba(255,255,255,.45);box-shadow:0 4px 22px rgba(0,0,0,.55)}
.el.dimmed{opacity:.15}
.el-num{font-family:var(--mono);font-size:13px;font-weight:500;color:#e2e8f0;line-height:1.05}
.el-sym{font-size:25px;font-weight:700;line-height:1;letter-spacing:-.01em;color:#fff}
.el-name{font-size:13px;font-weight:500;color:#f1f5f9;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el-mass{font-family:var(--mono);font-size:13px;color:#cbd5e1;line-height:1.05}

.cat-alkali{color:var(--alkali)}.cat-alkaline{color:var(--alkaline)}.cat-transition{color:var(--transition)}
.cat-post{color:var(--post)}.cat-metalloid{color:var(--metalloid)}.cat-nonmetal{color:var(--nonmetal)}
.cat-halogen{color:var(--halogen)}.cat-noble{color:var(--noble)}.cat-lanthanide{color:var(--lanthanide)}
.cat-actinide{color:var(--actinide)}.cat-unknown{color:var(--unknown)}

.lan-act-wrap{padding:8px 40px 0;min-width:1700px}
.lan-act-row{display:grid;gap:4px;margin-bottom:4px}
.lan-act-row .el{height:80px}
.lan-label{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-family:var(--mono);font-size:14px;font-weight:600}

.stats-bar{padding:16px 40px 24px;display:flex;gap:32px;flex-wrap:wrap;margin-top:4px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .s-val{font-family:var(--mono);font-size:22px;font-weight:600;color:#fff}
.stat .s-lbl{font-size:13px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.08em}

/* ═══ DETAIL OVERLAY ═══ */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
.detail-overlay.open{display:flex}
.detail-card{background:#0f1218;border:1px solid rgba(255,255,255,.11);border-radius:14px;width:780px;max-width:98vw;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 28px 90px rgba(0,0,0,.75);animation:popIn .2s cubic-bezier(.22,.68,0,1.15)}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

/* ── header strip ── */
.dc-header{display:flex;gap:0;flex-shrink:0}
.dc-visual{width:200px;flex-shrink:0;position:relative;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center}
.dc-visual canvas{position:absolute;inset:0}
.dc-sym-overlay{position:relative;z-index:2;text-align:center}
.dc-sym-overlay .dcz{font-family:var(--mono);font-size:14px;color:#e2e8f0;line-height:1}
.dc-sym-overlay .dcs{font-size:3.6rem;font-weight:800;color:#fff;line-height:1;text-shadow:0 0 30px currentColor}
.dc-sym-overlay .dcn{font-size:16px;font-weight:600;color:#f1f5f9;margin-top:4px}
.dc-sym-overlay .dcc{font-size:13px;color:#cbd5e1;margin-top:2px}

.dc-info{flex:1;padding:22px 24px 18px;display:flex;flex-direction:column;gap:0;overflow:hidden}
.dc-name{font-size:1.8rem;font-weight:800;color:#fff;line-height:1;letter-spacing:-.02em}
.dc-cat{font-size:15px;font-weight:600;margin-top:6px}
.dc-conf{font-family:var(--mono);font-size:14px;color:#e2e8f0;margin-top:8px;line-height:1.6;background:rgba(255,255,255,.05);padding:7px 11px;border-radius:5px;border:1px solid rgba(255,255,255,.12)}

.dc-props-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:14px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.dc-prop{background:#0c1018;padding:10px 11px}
.dc-prop .pl{font-size:13px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.06em}
.dc-prop .pv{font-family:var(--mono);font-size:15px;color:#fff;margin-top:3px;font-weight:500}

.close-btn{position:absolute;top:14px;right:18px;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;z-index:10;transition:color .12s;line-height:1}
.close-btn:hover{color:#fff}

/* ── scroll body ── */
.dc-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0}

/* ── section tabs ── */
.dc-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:#0a0d14;padding:0 20px}
.dc-tab{padding:11px 16px;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;color:#cbd5e1;transition:all .15s;white-space:nowrap}
.dc-tab.on{color:#fff;border-bottom-color:currentColor}

.dc-section{display:none;padding:20px}
.dc-section.on{display:block}

/* ── Overview ── */
.prop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prop-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:7px;padding:12px 14px}
.prop-card .lbl{font-size:13px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.prop-card .val{font-family:var(--mono);font-size:15px;color:#fff;font-weight:500}
.prop-card .val.accent{font-size:18px;font-weight:700}
.prop-card .sub{font-size:13px;color:#cbd5e1;margin-top:2px}

/* ── Bar chart ── */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-lbl{font-size:14px;color:#e2e8f0;width:160px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:8px;background:rgba(255,255,255,.10);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-val{font-family:var(--mono);font-size:14px;color:#e2e8f0;width:76px;flex-shrink:0}

/* ── Reactivity ── */
.react-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:13px 16px;margin-bottom:8px}
.react-item h4{font-size:16px;font-weight:700;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.react-tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:10px;border:1px solid;margin-left:4px;font-weight:600}
.react-item p{font-size:15px;color:#e2e8f0;line-height:1.65}
.reaction-eq{font-family:var(--mono);background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:8px 12px;margin:6px 0;font-size:15px;color:#fff}

/* ── Uses ── */
.use-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.use-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.use-icon{font-size:1.6rem;line-height:1;flex-shrink:0;margin-top:2px}
.use-text h4{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px}
.use-text p{font-size:15px;color:#e2e8f0;line-height:1.6}

/* ── Characteristics ── */
.char-item{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;padding:11px 14px;background:rgba(255,255,255,.04);border-radius:7px;border:1px solid rgba(255,255,255,.12)}
.char-bullet{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:7px}
.char-text{font-size:15px;color:#e2e8f0;line-height:1.65}
.char-text strong{color:#fff}

/* ── Isotopes ── */
.iso-table{width:100%;border-collapse:collapse;font-size:15px}
.iso-table th{color:#cbd5e1;font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:.06em;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.14);text-align:left}
.iso-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.07);color:#fff;font-family:var(--mono)}
.iso-table tr:hover td{background:rgba(255,255,255,.04)}

.section-head{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#cbd5e1;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.14)}
</style>
<script src="../theme.js"></script>
</head>

      {text:'<strong>High electronegativity (3.44):</strong> Second only to fluorine—forms compounds with nearly all elements.'},
    ],
    isotopes:[{m:16,abund:'99.76%',spin:'0',halflife:'Stable'},{m:17,abund:'0.04%',spin:'5/2',halflife:'Stable'},{m:18,abund:'0.20%',spin:'0',halflife:'Stable'}],
  },
};

// Default extra data for elements without specific data
function getExtra(Z) {
  if (EXTRA[Z]) return EXTRA[Z];
  const [,sym, name,,cat] = byZ[Z];
  const catInfo = CATS[cat];
  return {
    reactions:[
      {title:`General ${catInfo?.label} Behavior`,tag:'Typical',color:catInfo?.color||'#6b7280',eq:`${sym} + environment → compounds`,desc:`${name} exhibits typical ${catInfo?.label} chemistry. Reacts according to its oxidation states and electron configuration.`},
    ],
    uses:[
      {icon:'🔬',title:'Research',desc:`Used in scientific research and specialized applications.`},
      {icon:'⚗️',title:'Industrial',desc:`Industrial and laboratory applications relevant to its chemical properties.`},
    ],
    chars:[
      {text:`<strong>Category:</strong> ${catInfo?.label}. Member of period ${byZ[Z][5]}, group ${byZ[Z][6]}.`},
      {text:`<strong>Electron configuration:</strong> ${byZ[Z][7]}.`},
    ],
    isotopes:[],
  };
}

let activeFilter = null, searchTerm = '';
const byZ = {};
ELEMENTS.forEach(e => byZ[e[0]] = e);

const LAYOUT = {};
ELEMENTS.forEach(e => {
  const [Z,,,,cat,period,group] = e;
  if (period <= 7) LAYOUT[`${period},${group}`] = Z;
});

/* ═════════════════════════════════════════
   CANVAS ELEMENT VISUALIZATION
═════════════════════════════════════════ */
function drawElementVisual(canvas, Z, color) {
  const [,sym, name, mass, cat,,,, phase] = byZ[Z];
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  // Background gradient
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
  bg.addColorStop(0, hexToRgba(color, 0.25));
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  if (phase === 'Gas' || cat === 'noble') {
    drawGasVisual(ctx, W, H, color);
  } else if (phase === 'Liquid') {
    drawLiquidVisual(ctx, W, H, color);
  } else if (cat === 'transition' || cat === 'post' || cat === 'alkali' || cat === 'alkaline') {
    drawMetalVisual(ctx, W, H, color);
  } else if (cat === 'metalloid') {
    drawMetalloidVisual(ctx, W, H, color);
  } else {
    drawCrystalVisual(ctx, W, H, color);
  }

  // Atomic number ring
  const n = parseInt(byZ[Z][7].replace(/[^0-9]/g,'').split('').slice(-2).join('')) || Z % 8;
  drawAtomDiagram(ctx, W/2, H/2 - 10, 52, color, Z);
}

function drawAtomDiagram(ctx, cx, cy, r, color, Z) {
  // Nucleus
  const ng = ctx.createRadialGradient(cx,cy,0,cx,cy,8);
  ng.addColorStop(0,'rgba(255,255,255,0.7)');
  ng.addColorStop(1, hexToRgba(color,0.5));
  ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2);
  ctx.fillStyle=ng; ctx.fill();

  // Electron shells (up to 3)
  const shells = [2,8,18];
  const maxShell = Z <= 2 ? 1 : Z <= 10 ? 2 : 3;
  for (let s = 0; s < Math.min(maxShell,3); s++) {
    const sr = r * (0.4 + s * 0.28);
    ctx.beginPath(); ctx.arc(cx,cy,sr,0,Math.PI*2);
    ctx.strokeStyle = hexToRgba(color, 0.22);
    ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    ctx.stroke(); ctx.setLineDash([]);

    // electrons on this shell
    const ne = Math.min(shells[s], Z - [0,2,10][s]);
    if (ne > 0) {
      for (let e = 0; e < ne; e++) {
        const angle = (e / ne) * Math.PI * 2 - Math.PI/2;
        const ex = cx + sr * Math.cos(angle);
        const ey = cy + sr * Math.sin(angle);
        ctx.beginPath(); ctx.arc(ex,ey,2.5,0,Math.PI*2);
        ctx.fillStyle = color;
        ctx.shadowColor = color; ctx.shadowBlur = 6;
        ctx.fill(); ctx.shadowBlur = 0;
      }
    }
  }
}

function drawGasVisual(ctx,W,H,color) {
  for (let i=0;i<18;i++) {
    const x=Math.random()*W, y=Math.random()*H, r=2+Math.random()*5;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = hexToRgba(color, 0.15+Math.random()*0.2);
    ctx.fill();
  }
}
function drawLiquidVisual(ctx,W,H,color) {
  ctx.beginPath();
  ctx.moveTo(0,H*0.55);
  for(let x=0;x<=W;x+=8) ctx.lineTo(x, H*0.55+Math.sin(x*0.08)*6);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
  ctx.fillStyle = hexToRgba(color,0.22); ctx.fill();
}
function drawMetalVisual(ctx,W,H,color) {
  for(let i=0;i<5;i++) for(let j=0;j<5;j++) {
    const x=W*0.1+i*(W*0.2), y=H*0.1+j*(H*0.2);
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle = hexToRgba(color,0.25);
    ctx.fill();
    if(i<4){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+W*0.2,y);ctx.strokeStyle=hexToRgba(color,0.1);ctx.lineWidth=1;ctx.stroke();}
    if(j<4){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+H*0.2);ctx.strokeStyle=hexToRgba(color,0.1);ctx.lineWidth=1;ctx.stroke();}
  }
}
function drawMetalloidVisual(ctx,W,H,color) {
  const pts=[[W*0.2,H*0.5],[W*0.5,H*0.2],[W*0.8,H*0.5],[W*0.5,H*0.8]];
  ctx.beginPath();
  pts.forEach((p,i)=>i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
  ctx.closePath();
  ctx.strokeStyle=hexToRgba(color,0.3);ctx.lineWidth=1.5;ctx.stroke();
  pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4,0,Math.PI*2);ctx.fillStyle=hexToRgba(color,0.4);ctx.fill();});
}
function drawCrystalVisual(ctx,W,H,color) {
  [[W*0.3,H*0.3],[W*0.7,H*0.3],[W*0.5,H*0.6],[W*0.3,H*0.7],[W*0.7,H*0.7]].forEach(([x,y])=>{
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle=hexToRgba(color,0.3);ctx.fill();
  });
}

function hexToRgba(hex, a) {
  if (!hex || hex[0] !== '#') return `rgba(100,100,100,${a})`;
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ═════════════════════════════════════════
   TABLE BUILD
═════════════════════════════════════════ */
function catCss(c){return CATS[c]?.cls||'cat-unknown'}
function catColor(c){return CATS[c]?.color||'#6b7280'}

function makeCellHTML(Z) {
  const [,sym,name,mass,cat]=byZ[Z];
  const col=catColor(cat);
  const m=typeof mass==='number'?mass.toFixed(mass%1===0?0:mass<10?3:2):mass;
  return `<div class="el ${catCss(cat)}" data-z="${Z}" style="color:${col}" onclick="openDetail(${Z})">
    <div class="el-num">${Z}</div>
    <div class="el-sym">${sym}</div>
    <div class="el-name">${name}</div>
    <div class="el-mass">${m}</div>
  </div>`;
}

function buildTable(){
  const g=document.getElementById('tableGrid');
  let h='';
  h+=`<div></div>`;
  for(let i=1;i<=18;i++) h+=`<div class="group-label">${i}</div>`;
  for(let p=1;p<=7;p++){
    h+=`<div class="period-label">${p}</div>`;
    for(let gr=1;gr<=18;gr++){
      const Z=LAYOUT[`${p},${gr}`];
      if(Z){h+=makeCellHTML(Z);}
      else if(p===6&&gr===3){h+=`<div class="el cat-lanthanide" style="color:${catColor('lanthanide')};opacity:.85;cursor:default"><div class="el-num">57-71</div><div class="el-sym" style="font-size:16px">La-Lu</div></div>`;}
      else if(p===7&&gr===3){h+=`<div class="el cat-actinide" style="color:${catColor('actinide')};opacity:.85;cursor:default"><div class="el-num">89-103</div><div class="el-sym" style="font-size:16px">Ac-Lr</div></div>`;}
      else h+=`<div></div>`;
    }
  }
  g.innerHTML=h;
}

function buildLanAct(){
  const wrap=document.getElementById('lanActWrap');
  let h='';
  ['lanthanide','actinide'].forEach((cat,ci)=>{
    const start=ci===0?57:89, end=ci===0?71:103;
    h+=`<div class="lan-act-row"><div class="lan-label" style="color:${catColor(cat)}">${ci===0?'Lan.':'Act.'}</div>`;
    for(let Z=start;Z<=end;Z++) h+=`<div>${makeCellHTML(Z)}</div>`;
    h+=`</div>`;
  });
  wrap.innerHTML=h;
}

function buildLegend(){
  const leg=document.getElementById('legend'), chips=document.getElementById('filterChips');
  let lh='',ch='';
  Object.entries(CATS).forEach(([k,c])=>{
    lh+=`<div class="leg-item" onclick="filterCat('${k}')"><div class="leg-dot" style="background:${c.color}"></div>${c.label}</div>`;
    ch+=`<div class="chip" data-cat="${k}" style="color:${c.color};border-color:${c.color}" onclick="filterCat('${k}')">${c.label}</div>`;
  });
  leg.innerHTML=lh; chips.innerHTML=ch;
}

function alignLanAct(){
  const g=document.getElementById('tableGrid');
  const rect=g.getBoundingClientRect();
  const colW=(rect.width-28)/18;
  document.querySelectorAll('.lan-act-row').forEach(r=>{
    r.style.gridTemplateColumns=`${28+colW*3}px repeat(15,${colW}px)`;
  });
}

/* ═════════════════════════════════════════
   FILTER / SEARCH
═════════════════════════════════════════ */
function filterCat(cat){
  activeFilter=activeFilter===cat?null:cat;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.cat===activeFilter));
  applyVis();
}
document.getElementById('searchInput').addEventListener('input',e=>{
  searchTerm=e.target.value.toLowerCase().trim(); applyVis();
});
function applyVis(){
  document.querySelectorAll('.el[data-z]').forEach(el=>{
    const Z=parseInt(el.dataset.z);
    const [,sym,name,,cat]=byZ[Z];
    const ms=!searchTerm||name.toLowerCase().includes(searchTerm)||sym.toLowerCase().includes(searchTerm)||String(Z).includes(searchTerm);
    const mc=!activeFilter||cat===activeFilter;
    el.classList.toggle('dimmed',!ms||!mc);
  });
}

/* ═════════════════════════════════════════
   DETAIL MODAL
═════════════════════════════════════════ */
let curTab = 'overview';
function openDetail(Z){
  const [z,sym,name,mass,cat,,, conf,phase,disc,en,density,melt,boil,ion1,atomR,oxStates,crystal]=byZ[Z];
  const color=catColor(cat);
  const catLabel=CATS[cat]?.label||cat;
  const extra=getExtra(Z);
  const fmt=v=>v!==null&&v!==undefined?v:'—';
  const fmtY=y=>y<0?`~${Math.abs(y)} BCE`:String(y);

  const propCards=[
    {lbl:'Atomic Mass',     val:mass+' u'},
    {lbl:'Phase (STP)',     val:fmt(phase)},
    {lbl:'Discovered',      val:disc?fmtY(disc):'Unknown'},
    {lbl:'Electronegativity (Pauling)',val:fmt(en)},
    {lbl:'Density',         val:density?density+' g/cm³':'—'},
    {lbl:'Melting Point',   val:melt!==null?melt+' °C':'—'},
    {lbl:'Boiling Point',   val:boil!==null?boil+' °C':'—'},
    {lbl:'Ionization Energy',val:ion1?ion1+' eV':'—'},
    {lbl:'Atomic Radius',   val:atomR?atomR+' pm':'—'},
    {lbl:'Oxidation States',val:fmt(oxStates)},
    {lbl:'Crystal Structure',val:fmt(crystal)},
    {lbl:'Period / Group',  val:`${byZ[Z][5]} / ${byZ[Z][6]}`},
  ];

  // EN bar compared to F (3.98 max)
  const enPct = en ? Math.round((en/3.98)*100) : 0;
  const ipPct = ion1 ? Math.round((ion1/24.59)*100) : 0;
  const rPct  = atomR ? Math.round((atomR/348)*100) : 0;
  const dPct  = density ? Math.min(100,Math.round((density/22.59)*100)) : 0;

  const reactHTML = extra.reactions.map(r=>`
    <div class="react-item">
      <h4 style="color:${r.color}">${r.title}<span class="react-tag" style="color:${r.color};border-color:${r.color}">${r.tag}</span></h4>
      <div class="reaction-eq">${r.eq}</div>
      <p>${r.desc}</p>
    </div>`).join('');

  const usesHTML = extra.uses.map(u=>`
    <div class="use-card">
      <div class="use-icon">${u.icon}</div>
      <div class="use-text"><h4>${u.title}</h4><p>${u.desc}</p></div>
    </div>`).join('');

  const charsHTML = extra.chars.map(c=>`
    <div class="char-item">
      <div class="char-bullet" style="background:${color}"></div>
      <div class="char-text">${c.text}</div>
    </div>`).join('');

  const isoHTML = extra.isotopes.length ? extra.isotopes.map(i=>`
    <tr><td>¹${i.m || ''}${sym}</td><td>${i.abund||'—'}</td><td>${i.spin||'—'}</td><td>${i.halflife||'Stable'}</td></tr>`).join('')
    : `<tr><td colspan="4" style="color:#cbd5e1;font-size:15px">Detailed isotope data not available</td></tr>`;

  document.getElementById('detailCard').innerHTML = `
    <button class="close-btn" onclick="closeDetail()">✕</button>

    <!-- TOP HEADER -->
    <div class="dc-header">
      <div class="dc-visual">
        <canvas id="elCanvas" width="200" height="200"></canvas>
        <div class="dc-sym-overlay">
          <div class="dcz">${z}</div>
          <div class="dcs" style="color:${color};text-shadow:0 0 30px ${color}">${sym}</div>
          <div class="dcn">${name}</div>
          <div class="dcc">${phase||'Solid'}</div>
        </div>
      </div>
      <div class="dc-info">
        <div class="dc-name">${name}</div>
        <div class="dc-cat" style="color:${color}">${catLabel}</div>
        <div class="dc-conf">${conf}</div>
        <div class="dc-props-row">
          ${[['Z',z],['Mass',mass+' u'],['Period',byZ[Z][5]],['Group',byZ[Z][6]]].map(([l,v])=>`
            <div class="dc-prop"><div class="pl">${l}</div><div class="pv">${v}</div></div>`).join('')}
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div class="dc-tabs">
      ${['Overview','Properties','Reactions','Uses','Characteristics','Isotopes'].map((t,i)=>`
        <div class="dc-tab${i===0?' on':''}" style="${i===0?'color:'+color+';border-bottom-color:'+color:''}" onclick="switchTab(this,'${t.toLowerCase()}','${color}')">${t}</div>`).join('')}
    </div>

    <!-- SECTIONS -->
    <div class="dc-body">

      <!-- OVERVIEW -->
      <div class="dc-section on" id="sec-overview">
        <div class="section-head">Key Properties</div>
        <div class="prop-grid">
          ${propCards.map(p=>`
            <div class="prop-card">
              <div class="lbl">${p.lbl}</div>
              <div class="val">${p.val}</div>
            </div>`).join('')}
        </div>
      </div>

      <!-- PROPERTIES (bar charts) -->
      <div class="dc-section" id="sec-properties">
        <div class="section-head">Relative Property Scale</div>
        ${[
          ['Electronegativity',enPct,en?(en+' (Pauling)'):'—'],
          ['1st Ionization Energy',ipPct,ion1?(ion1+' eV'):'—'],
          ['Atomic Radius',rPct,atomR?(atomR+' pm'):'—'],
          ['Density',dPct,density?(density+' g/cm³'):'—'],
        ].map(([l,p,v])=>`
          <div class="bar-row">
            <div class="bar-lbl">${l}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${color}"></div></div>
            <div class="bar-val">${v}</div>
          </div>`).join('')}
        <div style="margin-top:16px">
          <div class="section-head">Thermodynamic Data</div>
          ${[
            ['Melting Point', melt!==null?melt+' °C':'—'],
            ['Boiling Point', boil!==null?boil+' °C':'—'],
            ['Phase at STP',  phase||'—'],
            ['Crystal Structure', crystal||'—'],
          ].map(([l,v])=>`
            <div class="bar-row">
              <div class="bar-lbl">${l}</div>
              <div style="flex:1;font-family:var(--mono);font-size:15px;color:#fff">${v}</div>
            </div>`).join('')}
        </div>
      </div>

      <!-- REACTIONS -->
      <div class="dc-section" id="sec-reactions">
        <div class="section-head">Chemical Reactions</div>
        ${reactHTML}
      </div>

      <!-- USES -->
      <div class="dc-section" id="sec-uses">
        <div class="section-head">Applications & Uses</div>
        <div class="use-grid">${usesHTML}</div>
      </div>

      <!-- CHARACTERISTICS -->
      <div class="dc-section" id="sec-characteristics">
        <div class="section-head">Physical &amp; Chemical Characteristics</div>
        ${charsHTML}
      </div>

      <!-- ISOTOPES -->
      <div class="dc-section" id="sec-isotopes">
        <div class="section-head">Notable Isotopes</div>
        <table class="iso-table">
          <thead><tr><th>Isotope</th><th>Abundance</th><th>Spin</th><th>Half-life</th></tr></thead>
          <tbody>${isoHTML}</tbody>
        </table>
      </div>

    </div>
  `;

  document.getElementById('detailOverlay').classList.add('open');

  // Draw canvas visual
  requestAnimationFrame(()=>{
    const cv=document.getElementById('elCanvas');
    if(cv) drawElementVisual(cv, Z, color);
  });
}

function switchTab(el, sec, color){
  document.querySelectorAll('.dc-tab').forEach(t=>{ t.classList.remove('on'); t.style.color=''; t.style.borderBottomColor=''; });
  document.querySelectorAll('.dc-section').forEach(s=>s.classList.remove('on'));
  el.classList.add('on');
  el.style.color=color; el.style.borderBottomColor=color;
  document.getElementById('sec-'+sec)?.classList.add('on');
}

function closeDetail(e){
  if(!e||e.target===document.getElementById('detailOverlay'))
    document.getElementById('detailOverlay').classList.remove('open');
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });

/* ═════════════════════════════════════════
   INIT
═════════════════════════════════════════ */
buildLegend(); buildTable(); buildLanAct();
window.addEventListener('resize',alignLanAct);
requestAnimationFrame(()=>setTimeout(alignLanAct,80));
</script>
</body>
</html>
