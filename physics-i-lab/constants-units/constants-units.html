{id:'debye_heat_capacity_lowT', title:'Debye T³ Law (Low-Temperature Heat Capacity)', category:'Solid State Physics', eq:'C_V\\approx\\frac{12\\pi^4}{5}Nk_B\\left(\\frac{T}{\\Theta_D}\\right)^3', vars:[['C_V','heat capacity at constant volume'],['N','number of atoms'],['k_B','Boltzmann constant'],['T','temperature'],['\\Theta_D','Debye temperature']],
 derivation:'Low-temperature limit of the full Debye phonon heat capacity integral, where only long-wavelength acoustic phonons are thermally excited.', assumptions:'T ≪ Θ_D; linear (Debye) phonon dispersion at low frequencies.', units:'J/K', example:'Diamond has an unusually high Debye temperature (~2230 K), so its heat capacity remains far below the classical Dulong–Petit value at room temperature.'},
{id:'drude_conductivity', title:'Drude Model Conductivity', category:'Solid State Physics', eq:'\\sigma=\\frac{ne^2\\tau}{m}', vars:[['\\sigma','electrical conductivity'],['n','free electron density'],['e','elementary charge'],['\\tau','mean scattering (relaxation) time'],['m','electron effective mass']],
 derivation:'Derived from Newton\'s second law applied to a drifting electron subject to an electric field and a phenomenological scattering time.', assumptions:'Classical free-electron gas; relaxation-time approximation for scattering.', units:'siemens per metre (S/m)', example:'Copper\'s conductivity of about 5.9×10⁷ S/m corresponds to a scattering time τ ≈ 2.5×10⁻¹⁴ s.'},
{id:'hall_coefficient', title:'Hall Coefficient', category:'Solid State Physics', eq:'R_H=-\\frac{1}{ne}', vars:[['R_H','Hall coefficient'],['n','charge carrier density'],['e','elementary charge']],
 derivation:'Balances the transverse Lorentz force on drifting charge carriers against the resulting transverse (Hall) electric field in steady state.', assumptions:'Single-carrier-type conductor; simple Drude-like transport.', units:'m³/C', example:'The sign of R_H reveals whether the dominant charge carriers are electrons (negative) or holes (positive), as in many semiconductors.'},
{id:'bragg_law', title:"Bragg's Law", category:'Solid State Physics', eq:'n\\lambda=2d\\sin\\theta', vars:[['n','diffraction order (integer)'],['\\lambda','X-ray wavelength'],['d','interplanar (lattice) spacing'],['\\theta','glancing angle of incidence']],
 derivation:'Constructive interference condition for X-rays reflecting off successive parallel planes of atoms in a crystal.', assumptions:'Elastic (coherent) scattering; well-defined periodic lattice planes.', units:'metre (m) for λ and d', example:'X-ray diffraction using Bragg\'s law is the standard technique for determining crystal structures, including that of DNA.'},
{id:'effective_mass_dispersion', title:'Effective Mass Approximation', category:'Solid State Physics', eq:'E(k)\\approx E_c+\\frac{\\hbar^2k^2}{2m^*}', vars:[['E(k)','electron energy near a band edge'],['E_c','band-edge energy'],['\\hbar k','crystal momentum'],['m^*','effective mass']],
 derivation:'Taylor expansion of the exact band-structure dispersion E(k) about a band extremum, absorbing lattice effects into an effective mass.', assumptions:'Parabolic band approximation, valid near a band extremum (small k relative to the extremum).', units:'kilogram (kg) for m*', example:'GaAs has a conduction-band effective mass of only about 0.067mₑ, contributing to its high electron mobility.'},
{id:'phonon_optical_cutoff', title:'Optical Phonon Branch Cutoff (Diatomic Chain)', category:'Solid State Physics', eq:'\\omega_{max}^2=2K\\left(\\frac{1}{m_1}+\\frac{1}{m_2}\\right)', vars:[['\\omega_{max}','maximum optical-branch angular frequency'],['K','interatomic spring constant'],['m_1,m_2','the two atomic masses in the unit cell']],
 derivation:'Solves the coupled classical equations of motion for a 1D diatomic chain of alternating masses connected by identical springs, at the zone center.', assumptions:'Nearest-neighbor harmonic coupling; 1D diatomic lattice chain.', units:'rad/s', example:'The gap between acoustic and optical phonon branches in ionic crystals like NaCl allows strong infrared absorption near the optical-branch frequency.'},
{id:'bcs_gap', title:'BCS Superconducting Energy Gap', category:'Solid State Physics', eq:'\\Delta(0)\\approx1.764\\,k_BT_c', vars:[['\\Delta(0)','zero-temperature energy gap'],['k_B','Boltzmann constant'],['T_c','superconducting critical temperature']],
 derivation:'Follows from solving the BCS gap equation self-consistently in the weak-coupling limit of Bardeen–Cooper–Schrieffer theory.', assumptions:'Weak-coupling (BCS) superconductivity; isotropic s-wave pairing.', units:'joule (J) or meV', example:'Niobium (T_c ≈ 9.3 K) has a measured gap close to the BCS-predicted value of about 1.55 meV.'},
{id:'london_penetration', title:'London Penetration Depth', category:'Solid State Physics', eq:'\\lambda_L=\\sqrt{\\frac{m}{\\mu_0n_se^2}}', vars:[['\\lambda_L','London penetration depth'],['m','carrier (Cooper pair) mass'],['\\mu_0','vacuum permeability'],['n_s','superconducting carrier density'],['e','elementary charge']],
 derivation:'Derived from the London equations describing the electrodynamics of superconducting supercurrents, combined with Ampère\'s law.', assumptions:'London (local) electrodynamics; type-I or weakly type-II superconductor.', units:'metre (m)', example:'Typical London penetration depths are on the order of 20–500 nm, meaning magnetic fields are excluded except within a thin surface layer (the Meissner effect).'},
 {id:'dulong_petit_law', title:'Dulong–Petit Law', category:'Solid State Physics', eq:'C_V\\approx3Nk_B', vars:[['C_V','molar heat capacity at high temperature'],['N','number of atoms (Avogadro\'s number for one mole)'],['k_B','Boltzmann constant']],
 derivation:'Follows from the classical equipartition theorem, assigning \\frac12k_BT of energy to each of 6 quadratic degrees of freedom (3 kinetic + 3 potential) per atom in a solid.', assumptions:'High-temperature classical limit (T ≫ Θ_D); ignores quantum suppression of vibrational modes.', units:'J/(mol·K)', example:'Most solids approach the Dulong–Petit value of about 24.9 J/(mol·K) at room temperature, though light-atom solids like diamond deviate strongly due to quantum effects.'},
{id:'einstein_heat_capacity', title:'Einstein Model of Heat Capacity', category:'Solid State Physics', eq:'C_V=3Nk_B\\left(\\frac{\\Theta_E}{T}\\right)^2\\frac{e^{\\Theta_E/T}}{(e^{\\Theta_E/T}-1)^2}', vars:[['C_V','heat capacity'],['N','number of atoms'],['k_B','Boltzmann constant'],['\\Theta_E','Einstein temperature'],['T','absolute temperature']],
 derivation:'Models each atom as an independent 3D quantum harmonic oscillator of a single frequency, then computes the average thermal energy per oscillator using Bose–Einstein statistics.', assumptions:'All oscillators share the same frequency (a simplification the Debye model improves upon); non-interacting oscillators.', units:'J/(mol·K)', example:'The Einstein model correctly predicts that heat capacity vanishes as T→0, unlike the classical Dulong–Petit law, though it drops off faster than experiment at very low T.'},
{id:'debye_temperature_definition', title:'Debye Temperature', category:'Solid State Physics', eq:'\\Theta_D=\\frac{\\hbar\\omega_D}{k_B}', vars:[['\\Theta_D','Debye temperature'],['\\hbar','reduced Planck constant'],['\\omega_D','Debye cutoff frequency'],['k_B','Boltzmann constant']],
 derivation:'Defines a characteristic temperature scale from the maximum (cutoff) phonon frequency in the Debye model, above which classical equipartition roughly holds.', assumptions:'Debye approximation: linear phonon dispersion with a sharp frequency cutoff chosen to match the correct total number of vibrational modes.', units:'kelvin (K)', example:'Diamond has an unusually high Debye temperature (~2230 K) due to its light carbon atoms and very stiff bonds, so its heat capacity remains suppressed well above room temperature.'},
{id:'wiedemann_franz_law', title:'Wiedemann–Franz Law', category:'Solid State Physics', eq:'\\frac{\\kappa}{\\sigma}=LT', vars:[['\\kappa','thermal conductivity'],['\\sigma','electrical conductivity'],['L','Lorenz number'],['T','absolute temperature']],
 derivation:'Follows from treating both charge and heat transport in a metal as carried by the same free-electron gas, so both conductivities share the same electron scattering time.', assumptions:'Good metals where electronic (not phonon) conduction dominates both charge and heat transport; moderate temperatures.', units:'W·Ω/K²', example:'This law explains why good electrical conductors like copper and silver are also excellent thermal conductors.'},
{id:'plasma_frequency_metal', title:'Plasma Frequency', category:'Solid State Physics', eq:'\\omega_p=\\sqrt{\\frac{ne^2}{\\epsilon_0m}}', vars:[['\\omega_p','plasma frequency (rad/s)'],['n','free electron density'],['e','elementary charge'],['\\epsilon_0','vacuum permittivity'],['m','electron mass']],
 derivation:'Follows from treating the free-electron gas as a collective oscillator, where a small charge displacement creates a restoring electric field, giving simple harmonic oscillation of the electron density.', assumptions:'Free-electron model; collisionless, undamped oscillation.', units:'rad/s', example:'Metals are reflective below their plasma frequency (typically in the UV) and become transparent above it, since only then can light propagate through the electron gas.'},
{id:'dielectric_function_drude', title:'Drude Dielectric Function', category:'Solid State Physics', eq:'\\epsilon(\\omega)=1-\\frac{\\omega_p^2}{\\omega^2+i\\omega/\\tau}', vars:[['\\epsilon(\\omega)','complex dielectric function'],['\\omega_p','plasma frequency'],['\\omega','driving light frequency'],['\\tau','electron scattering time']],
 derivation:'Solves the classical equation of motion for a damped, driven free electron gas subject to an oscillating electric field.', assumptions:'Free-electron (Drude) model; no interband transitions or lattice effects included.', units:'dimensionless (complex)', example:'This model correctly captures the high reflectivity of metals at low frequencies and their transition to transparency above the plasma frequency.'},
{id:'seebeck_coefficient', title:'Seebeck Effect (Thermoelectric Voltage)', category:'Solid State Physics', eq:'\\Delta V=-S\\Delta T', vars:[['\\Delta V','induced thermoelectric voltage'],['S','Seebeck coefficient (material-specific)'],['\\Delta T','temperature difference across the material']],
 derivation:'An empirical linear-response relation describing how a temperature gradient drives charge carriers to diffuse, building up a compensating electric potential.', assumptions:'Small temperature gradient (linear-response regime); S roughly constant over the temperature range.', units:'volt (V), with S in V/K', example:'Thermocouples exploit the Seebeck effect, using the voltage difference between two dissimilar metal junctions at different temperatures to measure temperature.'},
{id:'curie_law_paramagnetism', title:"Curie's Law (Paramagnetism)", category:'Solid State Physics', eq:'\\chi=\\frac{C}{T}', vars:[['\\chi','magnetic susceptibility (dimensionless)'],['C','Curie constant (material-specific)'],['T','absolute temperature']],
 derivation:'Follows from the thermal (Boltzmann) averaging of non-interacting atomic magnetic moments in an applied field, in the high-temperature, weak-field limit.', assumptions:'Non-interacting magnetic moments (paramagnet); weak field, high temperature (k_BT ≫ magnetic energy).', units:'dimensionless (χ), K for T', example:'Curie\'s law explains why paramagnetic susceptibility increases as a material is cooled, since thermal agitation more strongly randomizes moments at higher T.'},
{id:'curie_weiss_law', title:'Curie–Weiss Law', category:'Solid State Physics', eq:'\\chi=\\frac{C}{T-T_C}', vars:[['\\chi','magnetic susceptibility'],['C','Curie constant'],['T','absolute temperature'],['T_C','Curie temperature (ferromagnetic transition)']],
 derivation:'Extends Curie\'s law with a mean-field correction accounting for the internal exchange field between neighboring magnetic moments, which effectively lowers the temperature scale at which thermal randomization dominates.', assumptions:'Mean-field (Weiss molecular field) approximation; valid above the Curie temperature (paramagnetic phase).', units:'dimensionless (χ), K for T and T_C', example:'Susceptibility diverges as T approaches T_C from above, signaling the onset of spontaneous ferromagnetic order below T_C.'},
{id:'exchange_energy_ferromagnet', title:'Exchange Interaction Energy (Heisenberg Model)', category:'Solid State Physics', eq:'E=-2J\\vec S_i\\cdot\\vec S_j', vars:[['E','exchange interaction energy between two spins'],['J','exchange coupling constant'],['\\vec S_i,\\vec S_j','spin angular momentum vectors of the two atoms']],
 derivation:'A phenomenological Hamiltonian term representing the quantum-mechanical exchange interaction that arises from the Pauli exclusion principle and Coulomb repulsion between electrons on neighboring atoms.', assumptions:'Nearest-neighbor (or specified-range) coupling; J>0 favors parallel (ferromagnetic) alignment, J<0 favors antiparallel (antiferromagnetic).', units:'joule (J)', example:'The sign and magnitude of J determines whether a material orders ferromagnetically, antiferromagnetically, or remains paramagnetic at low temperature.'},
{id:'quantum_hall_resistance', title:'Quantum Hall Resistance', category:'Solid State Physics', eq:'R_{xy}=\\frac{h}{\\nu e^2}', vars:[['R_{xy}','Hall resistance (transverse resistance)'],['h','Planck constant'],['\\nu','filling factor (integer or fractional)'],['e','elementary charge']],
 derivation:'Follows from the quantization of electron cyclotron orbits into discrete Landau levels in a strong perpendicular magnetic field at low temperature, each fully occupied level contributing exactly h/e² to the quantized resistance.', assumptions:'Strong magnetic field, low temperature, high-mobility 2D electron system; ν integer for the integer quantum Hall effect (fractional values arise from electron-electron interactions in the fractional QHE).', units:'ohm (Ω)', example:'The quantum Hall resistance is so precisely quantized that it is used as a metrological standard for the ohm.'},
{id:'josephson_current_relation', title:'DC Josephson Current', category:'Solid State Physics', eq:'I=I_c\\sin(\\Delta\\phi)', vars:[['I','supercurrent through the junction'],['I_c','critical (maximum) current'],['\\Delta\\phi','superconducting phase difference across the junction']],
 derivation:'Follows from the quantum tunneling of Cooper pairs across a thin insulating barrier between two superconductors, with the current depending sinusoidally on the relative phase of the two superconducting wavefunctions.', assumptions:'Weak coupling (thin tunnel barrier); DC (zero-voltage) Josephson effect.', units:'ampere (A)', example:'This dissipationless current flow with no applied voltage is the basis of superconducting qubits and highly sensitive SQUID magnetometers.'},
{id:'critical_magnetic_field_sc', title:'Critical Magnetic Field (Type-I Superconductor)', category:'Solid State Physics', eq:'H_c(T)=H_c(0)\\left[1-\\left(\\frac{T}{T_c}\\right)^2\\right]', vars:[['H_c(T)','critical field at temperature T'],['H_c(0)','critical field at absolute zero'],['T_c','superconducting critical temperature']],
 derivation:'An empirical parabolic fit describing how the magnetic field needed to destroy superconductivity decreases smoothly from its maximum at T=0 to zero at T_c.', assumptions:'Type-I superconductor; empirical (phenomenological) temperature dependence rather than derived from first principles.', units:'A/m or tesla (as B_c=\\mu_0H_c)', example:'Above H_c(T) at a given temperature, superconductivity is destroyed and the material reverts to its normal resistive state.'},
{id:'ginzburg_landau_coherence_length', title:'Ginzburg–Landau Coherence Length', category:'Solid State Physics', eq:'\\xi(T)=\\frac{\\xi(0)}{\\sqrt{1-T/T_c}}', vars:[['\\xi(T)','coherence length at temperature T'],['\\xi(0)','coherence length at absolute zero'],['T_c','superconducting critical temperature']],
 derivation:'Follows from the Ginzburg–Landau theory of superconductivity, describing the characteristic length scale over which the superconducting order parameter can vary.', assumptions:'Near the transition temperature T_c, where Ginzburg–Landau mean-field theory is most accurate.', units:'metre (m)', example:'The ratio of coherence length to penetration depth (the Ginzburg–Landau parameter κ) determines whether a superconductor is Type-I or Type-II.'},
{id:'band_gap_semiconductor_temp', title:'Semiconductor Band Gap Temperature Dependence (Varshni)', category:'Solid State Physics', eq:'E_g(T)=E_g(0)-\\frac{\\alpha T^2}{T+\\beta}', vars:[['E_g(T)','band gap at temperature T'],['E_g(0)','band gap at absolute zero'],['\\alpha,\\beta','material-specific empirical fitting constants']],
 derivation:'An empirical formula (the Varshni relation) fitted to describe how thermal expansion and electron-phonon coupling shrink a semiconductor\'s band gap as temperature rises.', assumptions:'Empirical fit; α and β are tabulated per material rather than derived from first principles.', units:'joule (J) or eV', example:'Silicon\'s band gap shrinks from about 1.17 eV at 0 K to about 1.12 eV at room temperature, affecting the performance of silicon-based devices.'},
{id:'intrinsic_carrier_concentration', title:'Intrinsic Carrier Concentration (Semiconductor)', category:'Solid State Physics', eq:'n_i=\\sqrt{N_cN_v}\\,e^{-E_g/2k_BT}', vars:[['n_i','intrinsic carrier concentration (electrons = holes)'],['N_c,N_v','effective density of states in the conduction and valence bands'],['E_g','band gap energy'],['k_B','Boltzmann constant'],['T','absolute temperature']],
 derivation:'Follows from applying Fermi–Dirac statistics (in the non-degenerate/Boltzmann limit) to the conduction and valence bands, requiring charge neutrality between thermally excited electrons and holes.', assumptions:'Non-degenerate semiconductor (Boltzmann approximation valid); intrinsic (undoped) material.', units:'m⁻³', example:'The exponential dependence on E_g/T is why intrinsic carrier concentration — and hence a semiconductor\'s conductivity — rises sharply with temperature.'},
{id:'carrier_mobility_conductivity', title:'Carrier Mobility and Conductivity (Semiconductor)', category:'Solid State Physics', eq:'\\sigma=e(n\\mu_n+p\\mu_p)', vars:[['\\sigma','electrical conductivity'],['e','elementary charge'],['n,p','electron and hole concentrations'],['\\mu_n,\\mu_p','electron and hole mobilities']],
 derivation:'Generalizes the simple Drude conductivity formula to account for two independent charge carrier types (electrons and holes) with different concentrations and mobilities.', assumptions:'Both carrier types contribute additively (no significant electron-hole scattering coupling); each carrier type has a well-defined mobility.', units:'S/m', example:'In an intrinsic semiconductor at a given temperature, both electron and hole contributions must be included since n=p=n_i.'},
{id:'work_function_photoemission', title:'Work Function (Photoemission Threshold)', category:'Solid State Physics', eq:'\\phi=h\\nu_{threshold}', vars:[['\\phi','work function of the material (J or eV)'],['h','Planck constant'],['\\nu_{threshold}','minimum (threshold) photon frequency for photoemission']],
 derivation:'Follows directly from the photoelectric effect equation, evaluated at the threshold condition where ejected electrons have exactly zero kinetic energy.', assumptions:'Single-photon absorption; well-defined material surface (work function varies by crystal face and surface condition).', units:'joule (J) or eV', example:'Cesium has an unusually low work function (~2.1 eV), making it useful in photocathodes sensitive to visible light.'},
{id:'exciton_binding_energy', title:'Exciton Binding Energy (Wannier Model)', category:'Solid State Physics', eq:'E_b=\\frac{\\mu e^4}{2(4\\pi\\epsilon_0\\epsilon_r\\hbar)^2}', vars:[['E_b','exciton binding energy'],['\\mu','reduced mass of the electron-hole pair'],['\\epsilon_r','relative dielectric constant of the semiconductor'],['\\hbar','reduced Planck constant']],
 derivation:'Applies the hydrogen-atom Bohr model to a bound electron-hole pair, replacing the electron mass with the reduced electron-hole mass and screening the Coulomb interaction by the material\'s dielectric constant.', assumptions:'Wannier (weakly bound, large-radius) exciton model, valid in semiconductors with high dielectric constant; parabolic bands.', units:'joule (J) or meV', example:'Because ε_r is large in semiconductors, exciton binding energies are typically just a few meV to tens of meV — far weaker than the 13.6 eV hydrogen binding energy.'},
{id:'piezoelectric_effect', title:'Piezoelectric Effect', category:'Solid State Physics', eq:'P_i=d_{ij}\\sigma_j', vars:[['P_i','induced polarization (electric dipole moment per volume)'],['d_{ij}','piezoelectric coefficient tensor'],['\\sigma_j','applied mechanical stress']],
 derivation:'A linear-response constitutive relation for materials lacking inversion symmetry, where applied mechanical stress displaces internal charge distributions asymmetrically, producing a net electric polarization.', assumptions:'Linear (small-stress) regime; non-centrosymmetric crystal structure (a necessary condition for piezoelectricity).', units:'C/m² (for P), with d in C/N', example:'Quartz crystal oscillators and many ultrasound transducers rely on the piezoelectric effect to convert between mechanical and electrical signals.'},
 
{id:'relativistic_kinematics_general', title:'Relativistic Energy–Momentum Relation (Particle)', category:'High-Energy Physics', eq:'E^2=(pc)^2+(mc^2)^2', vars:[['E','total relativistic energy'],['p','relativistic momentum'],['m','rest mass'],['c','speed of light']],
 derivation:'Follows from requiring the four-momentum to have an invariant (frame-independent) magnitude equal to mc under Lorentz transformations.', assumptions:'Special relativity, free (non-interacting) particle.', units:'joule (J)', example:'For a photon (m=0), this reduces exactly to E=pc, the massless-particle relation.'},
{id:'lorentz_factor', title:'Lorentz Factor', category:'High-Energy Physics', eq:'\\gamma=\\frac{1}{\\sqrt{1-\\beta^2}},\\quad \\beta=\\frac{v}{c}', vars:[['\\gamma','Lorentz factor'],['\\beta','speed as a fraction of light speed'],['v','particle speed'],['c','speed of light']],
 derivation:'Emerges directly from the Lorentz transformation between two inertial reference frames in special relativity.', assumptions:'Inertial (non-accelerating) reference frames; special relativity.', units:'dimensionless', example:'Protons at the LHC reach γ ≈ 7460, meaning their total energy is about 7460 times their rest-mass energy.'},
{id:'mandelstam_variables', title:'Mandelstam Variables (2→2 Scattering)', category:'High-Energy Physics', eq:'s=(p_1+p_2)^2,\\quad t=(p_1-p_3)^2,\\quad u=(p_1-p_4)^2', vars:[['s','squared center-of-mass energy'],['t','squared momentum transfer'],['u','squared crossed momentum transfer'],['p_1,p_2,p_3,p_4','four-momenta of the incoming/outgoing particles']],
 derivation:'Constructed as Lorentz-invariant combinations of the four-momenta of a two-to-two scattering process, using the metric signature convention.', assumptions:'Relativistic 2-to-2 particle scattering process.', units:'GeV² or (energy)² in natural units', example:'The relation s+t+u=Σm_i²c⁴ provides a useful consistency check in scattering-amplitude calculations.'},
{id:'fermi_golden_rule', title:"Fermi's Golden Rule", category:'High-Energy Physics', eq:'\\Gamma=\\frac{2\\pi}{\\hbar}|M|^2\\rho(E)', vars:[['\\Gamma','transition (decay) rate'],['M','transition matrix element'],['\\rho(E)','density of final states']],
 derivation:'Derived from time-dependent perturbation theory in the limit of long interaction times, giving a transition probability linear in time.', assumptions:'Weak perturbation (first-order time-dependent perturbation theory); long observation time compared to the interaction timescale.', units:'s⁻¹', example:'Fermi\'s golden rule underlies calculations of particle decay rates, scattering cross sections, and atomic transition rates alike.'},
{id:'breit_wigner', title:'Relativistic Breit–Wigner Resonance', category:'High-Energy Physics', eq:'\\sigma(E)\\propto\\frac{1}{(E^2-M^2c^4)^2+M^2c^4\\Gamma^2}', vars:[['\\sigma(E)','cross section as a function of collision energy'],['E','center-of-mass energy'],['M','resonance mass'],['\\Gamma','resonance decay width']],
 derivation:'Comes from the propagator of an unstable particle in relativistic quantum field theory, with the width Γ arising from the particle\'s finite lifetime.', assumptions:'Isolated, well-separated resonance; narrow-width approximation often applied.', units:'depends on cross section normalization', example:'The Z boson resonance peak measured at LEP has a width of about 2.5 GeV, corresponding to a lifetime of roughly 3×10⁻²⁵ s.'},
{id:'rutherford_cross_section', title:'Rutherford Scattering Cross Section', category:'High-Energy Physics', eq:'\\frac{d\\sigma}{d\\Omega}=\\left(\\frac{Z_1Z_2e^2}{16\\pi\\epsilon_0E}\\right)^2\\frac{1}{\\sin^4(\\theta/2)}', vars:[['d\\sigma/d\\Omega','differential cross section'],['Z_1,Z_2','charge numbers of the two particles'],['E','kinetic energy of the incoming particle'],['\\theta','scattering angle']],
 derivation:'Solves the classical (or first-Born-approximation quantum) scattering trajectory of a charged particle in a repulsive Coulomb potential.', assumptions:'Point-like nuclei; pure Coulomb (unscreened) interaction; non-relativistic incoming particle.', units:'m²/sr', example:'Rutherford\'s original 1911 gold-foil experiment used this formula to infer the existence of a small, dense atomic nucleus.'},
{id:'muon_lifetime_formula', title:'Muon Decay Rate (Fermi Theory)', category:'High-Energy Physics', eq:'\\frac{1}{\\tau_\\mu}=\\frac{G_F^2m_\\mu^5c^4}{192\\pi^3\\hbar^7}', vars:[['\\tau_\\mu','muon mean lifetime'],['G_F','Fermi coupling constant'],['m_\\mu','muon mass'],['\\hbar','reduced Planck constant']],
 derivation:'Computed from Fermi\'s effective four-fermion weak-interaction theory using Fermi\'s golden rule and phase-space integration over the decay products.', assumptions:'Point-like (contact) weak interaction; neglects the electron mass relative to the muon mass.', units:'s⁻¹', example:'This formula predicts a muon lifetime of about 2.2 µs, matching experiment and providing one of the most precise determinations of G_F.'},
{id:'relativistic_doppler', title:'Relativistic Doppler Shift', category:'High-Energy Physics', eq:'f_{obs}=f_{src}\\sqrt{\\frac{1-\\beta}{1+\\beta}}', vars:[['f_{obs}','observed frequency'],['f_{src}','source (rest-frame) frequency'],['\\beta','source speed as a fraction of light speed (receding case)']],
 derivation:'Combines the classical Doppler shift with the time-dilation effect from special relativity.', assumptions:'Source and observer in relative inertial motion along the line of sight; special relativity.', units:'Hz', example:'Relativistic Doppler shifts of spectral lines from fast-moving astrophysical jets reveal their velocities, sometimes appearing superluminal in projection.'},
{id:'luminosity_cross_section', title:'Collider Event Rate (Luminosity × Cross Section)', category:'High-Energy Physics', eq:'N=\\mathcal{L}\\,\\sigma', vars:[['N','expected number of events'],['\\mathcal{L}','integrated luminosity'],['\\sigma','process cross section']],
 derivation:'Follows directly from the definition of luminosity as the proportionality factor between event rate and interaction cross section.', assumptions:'Well-defined, steady-state beam collision conditions over the integration period.', units:'dimensionless (event count)', example:'With an integrated luminosity of 1 fb⁻¹ and a cross section of 1 pb, a collider experiment expects about 1000 events.'},
{id:'qcd_running_coupling', title:'QCD Running Coupling (One-Loop)', category:'High-Energy Physics', eq:'\\alpha_s(Q^2)=\\frac{1}{b_0\\ln(Q^2/\\Lambda_{QCD}^2)}', vars:[['\\alpha_s(Q^2)','strong coupling at momentum-transfer scale Q'],['b_0','one-loop QCD beta-function coefficient'],['\\Lambda_{QCD}','QCD scale parameter (~200 MeV)']],
 derivation:'Solves the renormalization group equation for the strong coupling at leading (one-loop) order in perturbative QCD.', assumptions:'Perturbative QCD regime (Q well above Λ_QCD); one-loop approximation.', units:'dimensionless', example:'This running explains asymptotic freedom: α_s shrinks at high energy (short distance) and grows at low energy, causing quark confinement.'},
{id:'higgs_mechanism_mass_gen', title:'Gauge Boson Mass from the Higgs Mechanism', category:'High-Energy Physics', eq:'M_W=\\frac12gv', vars:[['M_W','W boson mass'],['g','SU(2) gauge coupling constant'],['v','Higgs field vacuum expectation value']],
 derivation:'Follows from expanding the gauge-covariant kinetic term of the Higgs field around its non-zero vacuum expectation value, generating mass terms for the gauge bosons that couple to it.', assumptions:'Spontaneous electroweak symmetry breaking; unitary gauge.', units:'GeV/c² (mass units)', example:'The Higgs vacuum expectation value, v≈246 GeV, sets the overall mass scale for the W and Z bosons and, via Yukawa couplings, the fermions.'},
{id:'yukawa_coupling_fermion_mass', title:'Fermion Mass from Yukawa Coupling', category:'High-Energy Physics', eq:'m_f=\\frac{y_fv}{\\sqrt2}', vars:[['m_f','fermion mass'],['y_f','Yukawa coupling constant for that fermion'],['v','Higgs vacuum expectation value']],
 derivation:'Follows from the Yukawa interaction term coupling a fermion field to the Higgs field, which generates a mass term once the Higgs acquires its vacuum expectation value.', assumptions:'Standard Model electroweak symmetry breaking; a single Higgs doublet.', units:'GeV/c²', example:'The top quark\'s unusually large mass corresponds to a Yukawa coupling close to 1, notably larger than for any other Standard Model fermion.'},
{id:'decay_width_lifetime', title:'Particle Decay Width–Lifetime Relation', category:'High-Energy Physics', eq:'\\tau=\\frac{\\hbar}{\\Gamma}', vars:[['\\tau','mean lifetime of the particle'],['\\hbar','reduced Planck constant'],['\\Gamma','total decay width']],
 derivation:'Follows from the energy-time uncertainty relation applied to an unstable state: a finite lifetime implies a finite spread (width) in the particle\'s rest-mass energy.', assumptions:'Exponential decay (single dominant decay process, or Γ is the sum over all channels).', units:'second (s)', example:'The Z boson\'s width of about 2.5 GeV corresponds to an extremely short lifetime of roughly 3×10⁻²⁵ s.'},
{id:'branching_ratio_definition', title:'Branching Ratio', category:'High-Energy Physics', eq:'BR_i=\\frac{\\Gamma_i}{\\Gamma_{total}}', vars:[['BR_i','branching ratio for decay channel i'],['\\Gamma_i','partial decay width for channel i'],['\\Gamma_{total}','total decay width (sum over all channels)']],
 derivation:'Defined directly as the fraction of all decays that proceed through a specific channel, following from the additivity of independent decay rates.', assumptions:'All accessible decay channels included in Γ_total.', units:'dimensionless (0 to 1, or %)', example:'The Higgs boson decays to a pair of bottom quarks with a branching ratio of about 58%, its dominant decay channel.'},
{id:'invariant_mass_formula', title:'Invariant Mass (Two-Body)', category:'High-Energy Physics', eq:'M^2c^4=(E_1+E_2)^2-(\\vec p_1c+\\vec p_2c)^2', vars:[['M','invariant mass of the parent system'],['E_1,E_2','energies of the two decay/collision products'],['\\vec p_1,\\vec p_2','momenta of the two products']],
 derivation:'Follows from the Lorentz-invariant norm of the total four-momentum, which is conserved and frame-independent, unlike energy or momentum individually.', assumptions:'Special relativity; all four-momenta measured in a consistent reference frame.', units:'GeV/c² (mass units)', example:'Reconstructing invariant mass from detector-measured particle momenta is how experiments like ATLAS and CMS discovered the Higgs boson, by finding a resonant peak.'},
{id:'parton_momentum_fraction', title:'Parton Momentum Fraction (Deep Inelastic Scattering)', category:'High-Energy Physics', eq:'x=\\frac{Q^2}{2p\\cdot q}', vars:[['x','Bjorken scaling variable (parton momentum fraction, 0<x<1)'],['Q^2','negative squared four-momentum transfer'],['p','four-momentum of the target hadron'],['q','four-momentum transfer to the struck parton']],
 derivation:'Defined as a Lorentz-invariant kinematic variable in deep inelastic scattering, interpreted in the parton model as the fraction of the parent hadron\'s momentum carried by the struck quark.', assumptions:'Deep inelastic (high Q²) scattering regime; parton model (quasi-free quark approximation) valid.', units:'dimensionless', example:'Measuring the x-dependence of scattering cross sections revealed that protons are composed of point-like constituents (quarks), confirming the parton model.'},
{id:'inelasticity_variable', title:'Inelasticity Variable (Deep Inelastic Scattering)', category:'High-Energy Physics', eq:'y=\\frac{p\\cdot q}{p\\cdot k}', vars:[['y','inelasticity (fraction of lepton energy transferred, 0<y<1)'],['p','four-momentum of the target hadron'],['q','four-momentum transfer'],['k','four-momentum of the incident lepton']],
 derivation:'A second Lorentz-invariant kinematic variable (alongside x and Q²) used to fully describe deep inelastic lepton-hadron scattering kinematics.', assumptions:'Deep inelastic scattering process; defined in the target hadron\'s rest frame equivalently as the fractional lepton energy loss.', units:'dimensionless', example:'Together, x and y (or equivalently x and Q²) fully parametrize the kinematics of a deep inelastic scattering event.'},
{id:'unitarity_bound_ckm', title:'CKM Matrix Unitarity Condition', category:'High-Energy Physics', eq:'\\sum_i|V_{ij}|^2=1', vars:[['V_{ij}','Cabibbo–Kobayashi–Maskawa (CKM) matrix element'],['i','sum over quark generations']],
 derivation:'Follows from requiring the CKM matrix (which describes quark flavor mixing in weak interactions) to be unitary, a consequence of probability conservation in the Standard Model.', assumptions:'Exactly three generations of quarks in the Standard Model; no new physics contributions to flavor mixing.', units:'dimensionless', example:'Precision tests of CKM unitarity are a sensitive probe for physics beyond the Standard Model — any measured deviation would signal new particles or interactions.'},
{id:'weinberg_angle_relation', title:'Electroweak Coupling–Weinberg Angle Relation', category:'High-Energy Physics', eq:'e=g\\sin\\theta_W=g\'\\cos\\theta_W', vars:[['e','electromagnetic coupling (elementary charge)'],['g','SU(2) weak isospin coupling'],['g\'','U(1) hypercharge coupling'],['\\theta_W','Weinberg (weak mixing) angle']],
 derivation:'Follows from diagonalizing the electroweak gauge boson mass/kinetic mixing matrix, expressing the physical photon and Z boson as rotated combinations of the original SU(2)×U(1) gauge fields.', assumptions:'Standard Model electroweak unification (Glashow–Weinberg–Salam theory).', units:'dimensionless (each coupling)', example:'This relation ties together the electromagnetic and weak coupling strengths, showing they are not independent but unified within a single electroweak gauge theory.'},
{id:'parton_luminosity_cross_section', title:'Hadron Collider Cross Section (Parton Model)', category:'High-Energy Physics', eq:'\\sigma(pp\\to X)=\\sum_{i,j}\\int dx_1dx_2\\,f_i(x_1)f_j(x_2)\\,\\hat\\sigma_{ij}(x_1x_2s)', vars:[['\\sigma(pp\\to X)','total hadron-hadron cross section'],['f_i(x)','parton distribution function for parton flavor i'],['\\hat\\sigma_{ij}','hard-scattering partonic cross section'],['s','collider center-of-mass energy squared']],
 derivation:'The QCD factorization theorem separates the calculable, perturbative short-distance partonic scattering from the non-perturbative long-distance parton distribution functions, allowing the two to be convolved.', assumptions:'QCD factorization theorem valid (high momentum transfer processes); parton distribution functions determined experimentally or via QCD evolution equations.', units:'depends on the process (typically barns or pb)', example:'This factorized approach is how theorists predict production rates (e.g. for the Higgs boson) at colliders like the LHC.'},
{id:'asymptotic_freedom_beta_function', title:'QCD Beta Function (Asymptotic Freedom)', category:'High-Energy Physics', eq:'\\beta(g)=-b_0\\frac{g^3}{16\\pi^2},\\quad b_0=11-\\frac23n_f', vars:[['\\beta(g)','beta function governing the running of the QCD coupling g'],['b_0','one-loop beta function coefficient'],['n_f','number of active (light) quark flavors']],
 derivation:'Computed from one-loop renormalization group calculations in QCD, where the negative sign (for n_f<16.5) arises from the non-Abelian gluon self-interactions dominating over quark loop screening.', assumptions:'Perturbative one-loop QCD; n_f flavors treated as effectively massless at the relevant energy scale.', units:'dimensionless (beta function)', example:'The negative beta function is the mathematical origin of asymptotic freedom — quarks and gluons interact more weakly at short distances, in contrast to QED where the coupling grows.'},
{id:'chiral_perturbation_pion_mass', title:'Gell-Mann–Oakes–Renner Relation (Pion Mass)', category:'High-Energy Physics', eq:'m_\\pi^2f_\\pi^2\\approx-(m_u+m_d)\\langle\\bar qq\\rangle', vars:[['m_\\pi','pion mass'],['f_\\pi','pion decay constant'],['m_u,m_d','up and down quark masses'],['\\langle\\bar qq\\rangle','quark condensate (chiral order parameter)']],
 derivation:'Follows from chiral perturbation theory, relating the pion mass (as a pseudo-Goldstone boson of spontaneously broken chiral symmetry) to the small explicit chiral symmetry breaking from nonzero quark masses.', assumptions:'Chiral perturbation theory (low-energy QCD effective theory); pion treated as a near-massless Goldstone boson before explicit symmetry breaking.', units:'consistent with mass² × decay constant² (e.g. GeV⁴)', example:'This relation explains why pions are so much lighter than other hadrons: they are pseudo-Goldstone bosons whose mass vanishes if quark masses were exactly zero.'},
{id:'neutrino_oscillation_probability', title:'Neutrino Oscillation Probability (Two-Flavor)', category:'High-Energy Physics', eq:'P(\\nu_\\alpha\\to\\nu_\\beta)=\\sin^2(2\\theta)\\sin^2\\left(\\frac{1.27\\Delta m^2L}{E}\\right)', vars:[['P(\\nu_\\alpha\\to\\nu_\\beta)','probability of flavor conversion'],['\\theta','neutrino mixing angle'],['\\Delta m^2','squared mass difference (eV²) between mass eigenstates'],['L','baseline distance (km)'],['E','neutrino energy (GeV)']],
 derivation:'Follows from treating neutrino flavor states as quantum superpositions of mass eigenstates that propagate with different phases, since mass eigenstates have (slightly) different energies for a given momentum.', assumptions:'Two-flavor approximation (simplification of the full three-flavor PMNS mixing); ultra-relativistic neutrinos; vacuum oscillation (no matter effects).', units:'dimensionless (probability, 0 to 1)', example:'This oscillation phenomenon, confirmed by solar and atmospheric neutrino experiments, was the first direct evidence that neutrinos have nonzero mass.'},
{id:'cross_section_luminosity_differential', title:'Differential Cross Section (Angular Distribution)', category:'High-Energy Physics', eq:'\\sigma=\\int\\frac{d\\sigma}{d\\Omega}d\\Omega', vars:[['\\sigma','total cross section'],['d\\sigma/d\\Omega','differential cross section per unit solid angle'],['\\Omega','solid angle']],
 derivation:'The total cross section is defined as the integral of the differential (angle-resolved) scattering probability over all possible final-state directions.', assumptions:'Well-defined scattering process with an angularly-dependent cross section.', units:'m² (or barns) for σ; m²/sr for dσ/dΩ', example:'Measuring the angular distribution dσ/dΩ, rather than just the total cross section, reveals the underlying interaction mechanism — as in Rutherford\'s discovery of the atomic nucleus.'},
{id:'crossing_symmetry_amplitude', title:'Crossing Symmetry (s-t-u Channel Relation)', category:'High-Energy Physics', eq:'\\mathcal{M}(s,t,u)=\\mathcal{M}(u,t,s)', vars:[['\\mathcal{M}','scattering amplitude'],['s,t,u','Mandelstam variables']],
 derivation:'Follows from the analytic continuation of a single scattering amplitude function, where physical processes related by swapping incoming and outgoing particles with their antiparticles correspond to the same underlying analytic function evaluated in different kinematic regions.', assumptions:'Relativistic quantum field theory; the same underlying interaction (matrix element) governs all crossed channels.', units:'depends on the amplitude normalization', example:'Crossing symmetry relates processes like electron-positron annihilation (s-channel) to electron-electron scattering (t-channel) through the same fundamental amplitude.'},
{id:'unitarity_optical_theorem', title:'Optical Theorem', category:'High-Energy Physics', eq:'\\sigma_{total}=\\frac{4\\pi}{k}\\,\\text{Im}\\,f(0)', vars:[['\\sigma_{total}','total scattering cross section'],['k','incident particle wavenumber'],['f(0)','forward (zero-angle) scattering amplitude']],
 derivation:'Follows directly from unitarity of the quantum-mechanical S-matrix, requiring that probability is conserved between the incoming and outgoing scattering states.', assumptions:'Elastic and inelastic channels both included in σ_total; valid for any unitary quantum scattering theory.', units:'m² (or barns)', example:'The optical theorem is a powerful consistency check in scattering theory, connecting the total cross section (summed over all outcomes) to just the imaginary part of the forward-scattering amplitude.'},
{id:'running_mass_msbar', title:'Running Quark Mass (Renormalization Group)', category:'High-Energy Physics', eq:'m(\\mu)=m(\\mu_0)\\left[\\frac{\\alpha_s(\\mu)}{\\alpha_s(\\mu_0)}\\right]^{\\gamma_m/b_0}', vars:[['m(\\mu)','quark mass at renormalization scale μ'],['m(\\mu_0)','quark mass at reference scale μ_0'],['\\alpha_s','strong coupling constant'],['\\gamma_m','quark mass anomalous dimension'],['b_0','one-loop QCD beta function coefficient']],
 derivation:'Solves the renormalization group equation for the quark mass, which — like the coupling constant itself — is not a fixed number in quantum field theory but depends on the energy scale at which it is measured (in the MS-bar renormalization scheme).', assumptions:'Perturbative QCD; MS-bar renormalization scheme (mass values differ between renormalization schemes).', units:'GeV/c² (mass units)', example:'The top quark\'s "running mass" evaluated at its own mass scale differs measurably from its "pole mass" as extracted directly from collider kinematics, an important subtlety in precision Standard Model fits.'}, 
 
{id:'semi_empirical_mass', title:'Semi-Empirical Mass Formula (Weizsäcker)', category:'Nuclear Physics', eq:'B=a_VA-a_SA^{2/3}-a_C\\frac{Z(Z-1)}{A^{1/3}}-a_A\\frac{(A-2Z)^2}{A}+\\delta(A,Z)', vars:[['B','total nuclear binding energy'],['A','mass number'],['Z','proton number'],['a_V,a_S,a_C,a_A','volume, surface, Coulomb, and asymmetry coefficients'],['\\delta(A,Z)','pairing correction term']],
 derivation:'A liquid-drop model treating the nucleus as an incompressible charged fluid, with terms for bulk binding, surface tension, Coulomb repulsion, and the asymmetry/pairing effects of nucleon quantum statistics.', assumptions:'Nucleus modeled as a uniform charged liquid drop; ignores nuclear shell structure.', units:'MeV', example:'The formula correctly predicts the "valley of stability" and the general trend of the binding-energy-per-nucleon curve peaking near iron-56.'},
{id:'geiger_nuttall', title:'Geiger–Nuttall Law (Alpha Decay)', category:'Nuclear Physics', eq:'\\log_{10}\\lambda=A-\\frac{B}{\\sqrt{Q_\\alpha}}', vars:[['\\lambda','alpha-decay constant'],['Q_\\alpha','alpha-decay energy released'],['A,B','empirical constants depending on the decay chain']],
 derivation:'An empirical relationship later explained theoretically by quantum-mechanical tunneling (the Gamow factor) through the nuclear Coulomb barrier.', assumptions:'Alpha decay within a given isotopic series; Q_α not too small.', units:'depends (log of s⁻¹ vs. MeV⁻¹/²)', example:'The extreme sensitivity of λ to Q_α explains why alpha-emitter half-lives span more than 20 orders of magnitude.'},
{id:'q_value_reaction', title:'Nuclear Reaction Q-Value', category:'Nuclear Physics', eq:'Q=(m_i-m_f)c^2', vars:[['Q','energy released (or absorbed) in the reaction'],['m_i','total initial rest mass'],['m_f','total final rest mass']],
 derivation:'A direct application of mass-energy equivalence to the conservation of total relativistic energy in a nuclear reaction.', assumptions:'Isolated reaction; masses known precisely (typically from a nuclear mass table).', units:'joule (J) or MeV', example:'A positive Q-value (exothermic reaction) releases kinetic energy to the products, as in nuclear fission and most fusion reactions.'},
{id:'activity_formula', title:'Radioactive Activity', category:'Nuclear Physics', eq:'A(t)=\\lambda N(t)=\\lambda N_0e^{-\\lambda t}', vars:[['A(t)','activity (decays per second) at time t'],['\\lambda','decay constant'],['N(t)','number of undecayed nuclei at time t'],['N_0','initial number of nuclei']],
 derivation:'The time derivative of the exponential radioactive decay law, giving the instantaneous decay rate.', assumptions:'Large number of independent, identical radioactive nuclei; constant decay constant.', units:'becquerel (Bq), decays per second', example:'A 1 g sample of radium-226 (λ corresponding to a 1600-year half-life) has an activity of about 3.7×10¹⁰ Bq, historically the definition of the curie.'},

/* ---- Added batch: Quantum Physics (extended) ---- */
{id:'particle_box_energy', title:'Particle in a Box Energy Levels', category:'Quantum Physics', eq:'E_n=\\frac{n^2\\pi^2\\hbar^2}{2mL^2}', vars:[['E_n','energy of level n (J)'],['n','quantum number (positive integer)'],['\\hbar','reduced Planck constant'],['m','particle mass (kg)'],['L','box width (m)']],
 derivation:'Solves the time-independent Schrödinger equation for a particle confined to an infinite square well, applying the boundary condition that the wavefunction vanishes at the walls.', assumptions:'Infinite potential walls (impenetrable box); one-dimensional confinement.', units:'joule (J)', example:'An electron confined to a 1 nm box has a ground-state energy of about 0.376 eV.'},
{id:'qho_energy', title:'Quantum Harmonic Oscillator Energy Levels', category:'Quantum Physics', eq:'E_n=\\hbar\\omega\\left(n+\\frac12\\right)', vars:[['E_n','energy of level n (J)'],['\\hbar','reduced Planck constant'],['\\omega','classical angular frequency of the oscillator'],['n','quantum number (0,1,2,\\ldots)']],
 derivation:'Solves the Schrödinger equation for a quadratic potential either directly via Hermite polynomials or with raising/lowering ladder operators.', assumptions:'Ideal harmonic (parabolic) potential.', units:'joule (J)', example:'Unlike a classical oscillator, the quantum ground state (n=0) has a nonzero zero-point energy of ℏω/2.'},
{id:'compton_shift', title:'Compton Scattering Wavelength Shift', category:'Quantum Physics', eq:'\\Delta\\lambda=\\frac{h}{m_ec}(1-\\cos\\theta)', vars:[['\\Delta\\lambda','wavelength shift of the scattered photon (m)'],['h','Planck constant'],['m_e','electron mass'],['c','speed of light'],['\\theta','scattering angle']],
 derivation:'Applies conservation of relativistic energy and momentum to a photon scattering elastically off a free electron.', assumptions:'Free, initially stationary electron; single scattering event.', units:'metre (m)', example:'At θ=90°, the wavelength shift equals exactly h/(m_ec) ≈ 2.43 pm, the electron Compton wavelength.'},
{id:'photoelectric_effect', title:'Photoelectric Effect Equation', category:'Quantum Physics', eq:'K_{max}=h\\nu-\\phi', vars:[['K_{max}','maximum kinetic energy of ejected electrons (J)'],['h','Planck constant'],['\\nu','frequency of incident light'],['\\phi','work function of the material (J)']],
 derivation:'Follows from energy conservation, treating light as discrete photon quanta of energy hν, each absorbed by a single electron.', assumptions:'Single-photon absorption per electron; photon energy above the work-function threshold.', units:'joule (J) or electronvolt (eV)', example:'Einstein\'s explanation of this equation, which resolved the puzzling frequency-dependence (not intensity-dependence) of the effect, earned him the 1921 Nobel Prize.'},
{id:'commutator_xp', title:'Canonical Commutation Relation', category:'Quantum Physics', eq:'[\\hat x,\\hat p]=i\\hbar', vars:[['[\\hat x,\\hat p]','commutator of the position and momentum operators'],['i','imaginary unit'],['\\hbar','reduced Planck constant']],
 derivation:'Follows from representing momentum as the differential operator -iℏ∂/∂x acting on position-space wavefunctions.', assumptions:'Standard (Schrödinger-picture) position representation of quantum mechanics.', units:'joule·second (J·s)', example:'This nonzero commutator is the algebraic origin of the Heisenberg uncertainty principle between position and momentum.'},
{id:'tise', title:'Time-Independent Schrödinger Equation', category:'Quantum Physics', eq:'\\hat H\\psi=E\\psi', vars:[['\\hat H','Hamiltonian operator'],['\\psi','stationary-state wavefunction'],['E','energy eigenvalue']],
 derivation:'Obtained by separating variables in the time-dependent Schrödinger equation for a time-independent Hamiltonian, ψ(x,t)=ψ(x)e^{-iEt/ℏ}.', assumptions:'Time-independent potential (conservative system).', units:'depends on normalization', example:'Solving this eigenvalue equation for different potentials (box, oscillator, Coulomb) yields the allowed stationary-state energies of a quantum system.'},
{id:'tunneling_transmission', title:'Quantum Tunneling Transmission Coefficient', category:'Quantum Physics', eq:'T\\approx e^{-2\\kappa L},\\quad \\kappa=\\frac{\\sqrt{2m(V_0-E)}}{\\hbar}', vars:[['T','transmission probability through the barrier'],['\\kappa','decay constant inside the barrier'],['L','barrier width (m)'],['V_0','barrier height (J)'],['E','particle energy (J), with E<V_0']],
 derivation:'Approximate (thick-barrier) solution of the Schrödinger equation matching wavefunctions across a rectangular potential barrier.', assumptions:'Rectangular barrier; κL ≫ 1 (thick or high barrier, so the approximation holds).', units:'dimensionless (probability, 0 to 1)', example:'Tunneling explains phenomena from alpha decay to the operation of scanning tunneling microscopes.'},
{id:'orbital_ang_momentum_qm', title:'Orbital Angular Momentum Magnitude', category:'Quantum Physics', eq:'|\\vec L|=\\hbar\\sqrt{l(l+1)}', vars:[['|\\vec L|','magnitude of orbital angular momentum'],['\\hbar','reduced Planck constant'],['l','orbital angular momentum quantum number (0,1,2,\\ldots)']],
 derivation:'Follows from solving the eigenvalue equation of the angular momentum operator L² acting on spherical harmonics.', assumptions:'Central (spherically symmetric) potential.', units:'kg·m²/s', example:'A d-orbital electron (l=2) has an orbital angular momentum magnitude of ℏ√6 ≈ 2.45ℏ.'},
{id:'spin_magnetic_moment_qm', title:'Electron Spin Magnetic Moment', category:'Quantum Physics', eq:'\\mu_s=-g_s\\mu_B\\frac{S}{\\hbar}', vars:[['\\mu_s','spin magnetic moment'],['g_s','electron spin g-factor (≈2.0023)'],['\\mu_B','Bohr magneton'],['S','spin angular momentum']],
 derivation:'Follows from the relativistic Dirac equation, which predicts g_s=2 exactly, with small QED corrections giving the precisely measured value.', assumptions:'Single electron; non-relativistic spatial motion (spin itself is intrinsically relativistic in origin).', units:'J/T', example:'This intrinsic magnetic moment is what couples to external fields in electron spin resonance experiments.'},
{id:'ehrenfest_theorem', title:'Ehrenfest Theorem', category:'Quantum Physics', eq:'\\frac{d}{dt}\\langle p\\rangle=-\\left\\langle\\frac{\\partial V}{\\partial x}\\right\\rangle', vars:[['\\langle p\\rangle','expectation value of momentum'],['V','potential energy function'],['t','time']],
 derivation:'Follows from the time-dependent Schrödinger equation applied to the expectation value of an operator, using the general relation d⟨A⟩/dt=⟨[A,H]⟩/(iℏ).', assumptions:'Well-defined potential V(x); normalizable wavefunction.', units:'kg·m/s² (force-like, rate of change of momentum)', example:'Ehrenfest\'s theorem shows that quantum expectation values obey equations of motion closely analogous to Newton\'s second law.'},
{id:'energy_time_uncertainty', title:'Energy–Time Uncertainty Relation', category:'Quantum Physics', eq:'\\Delta E\\Delta t\\geq\\frac{\\hbar}{2}', vars:[['\\Delta E','energy uncertainty or spread'],['\\Delta t','characteristic timescale of the system\'s evolution']],
 derivation:'Unlike the position-momentum relation, this does not follow from a strict operator commutator, but from the relationship between a state\'s energy spread and how quickly its expectation values can change.', assumptions:'Δt is a timescale of significant change, not the uncertainty of a time observable (time is not an operator in standard quantum mechanics).', units:'joule·second (J·s)', example:'This relation explains the finite linewidth (energy spread) of excited atomic states with short lifetimes.'},
{id:'first_order_perturbation', title:'First-Order Perturbation Theory Energy Correction', category:'Quantum Physics', eq:'E_n^{(1)}=\\langle\\psi_n^{(0)}|\\hat H\'|\\psi_n^{(0)}\\rangle', vars:[['E_n^{(1)}','first-order energy correction'],['\\psi_n^{(0)}','unperturbed eigenstate'],['\\hat H\'','perturbing Hamiltonian term']],
 derivation:'Expands the perturbed Schrödinger equation in powers of a small parameter and collects the first-order terms, projecting onto the unperturbed eigenstate.', assumptions:'Perturbation small compared to unperturbed energy-level spacings; non-degenerate unperturbed state.', units:'joule (J)', example:'Used to compute the fine-structure and Zeeman-effect energy shifts as small corrections to the unperturbed hydrogen energy levels.'},
{id:'wkb_quantization', title:'WKB Quantization Condition', category:'Quantum Physics', eq:'\\oint p\\,dx=\\left(n+\\frac12\\right)h', vars:[['p','classical momentum as a function of position'],['n','quantum number (0,1,2,\\ldots)'],['h','Planck constant']],
 derivation:'Semiclassical (Wentzel–Kramers–Brillouin) approximation requiring the accumulated phase over one classical period to match a half-integer number of wavelengths, ensuring single-valuedness of the wavefunction.', assumptions:'Slowly varying potential on the scale of the local de Broglie wavelength (semiclassical validity).', units:'joule·second (J·s)', example:'The WKB method gives accurate approximate energy levels for smoothly varying potentials where the exact Schrödinger equation is not analytically solvable.'},
{id:'rabi_frequency', title:'Rabi Oscillation Frequency', category:'Quantum Physics', eq:'\\Omega_R=\\frac{\\mu E_0}{\\hbar}', vars:[['\\Omega_R','Rabi frequency (rad/s)'],['\\mu','transition dipole moment'],['E_0','driving field amplitude'],['\\hbar','reduced Planck constant']],
 derivation:'Follows from solving the time-dependent Schrödinger equation for a two-level system driven resonantly by an oscillating field, in the rotating-wave approximation.', assumptions:'Two-level system; resonant or near-resonant driving; rotating-wave approximation.', units:'rad/s', example:'Rabi oscillations — periodic population transfer between two quantum states — form the basis of qubit control pulses in many quantum computing platforms.'},
{id:'photon_momentum', title:'Photon Momentum', category:'Quantum Physics', eq:'p=\\frac{h}{\\lambda}=\\frac{E}{c}', vars:[['p','photon momentum (kg·m/s)'],['h','Planck constant'],['\\lambda','photon wavelength (m)'],['E','photon energy (J)'],['c','speed of light']],
 derivation:'Follows from the relativistic energy-momentum relation E²=(pc)²+(mc²)² applied to a massless photon (m=0), combined with E=hc/λ.', assumptions:'Photon treated as a massless relativistic particle.', units:'kg·m/s', example:'Photon momentum transfer is responsible for radiation pressure, used to propel solar sails.'},

/* ---- Added batch: Nuclear Physics (extended) ---- */
{id:'mass_defect_formula', title:'Nuclear Mass Defect', category:'Nuclear Physics', eq:'\\Delta m=Zm_p+Nm_n-M_{nucleus}', vars:[['\\Delta m','mass defect (kg)'],['Z','proton number'],['N','neutron number'],['m_p,m_n','proton and neutron masses'],['M_{nucleus}','actual measured nuclear mass']],
 derivation:'Directly compares the sum of the masses of the separated constituent nucleons to the measured mass of the bound nucleus.', assumptions:'Precisely known nucleon and nuclear masses.', units:'kg (or unified atomic mass units, u)', example:'The mass defect converts, via E=Δmc², into the nuclear binding energy that holds the nucleus together.'},
{id:'binding_energy_per_nucleon', title:'Binding Energy per Nucleon', category:'Nuclear Physics', eq:'\\frac{E_b}{A}', vars:[['E_b','total nuclear binding energy (MeV)'],['A','mass number (total nucleons)']],
 derivation:'A simple normalization of total binding energy by nucleon count, allowing direct comparison of nuclear stability across different elements.', assumptions:'Uses a precisely determined total binding energy E_b.', units:'MeV per nucleon', example:'Iron-56 and nickel-62 have the highest binding energy per nucleon (~8.8 MeV), making them the most stable nuclei and explaining why both fission of heavy nuclei and fusion of light nuclei release energy.'},
{id:'nuclear_radius_formula', title:'Nuclear Radius Formula', category:'Nuclear Physics', eq:'R=r_0A^{1/3}', vars:[['R','nuclear radius (m)'],['r_0','nuclear radius constant (≈1.2 fm)'],['A','mass number']],
 derivation:'Follows from the empirical observation that nuclear density is roughly constant, so nuclear volume (and hence R³) scales linearly with the number of nucleons A.', assumptions:'Nucleus approximated as a uniform-density sphere (liquid-drop model).', units:'metre (m) or femtometre (fm)', example:'A uranium-238 nucleus (A=238) has a predicted radius of about 7.4 fm, in good agreement with electron-scattering measurements.'},
{id:'half_life_relation', title:'Half-Life – Decay Constant Relation', category:'Nuclear Physics', eq:'t_{1/2}=\\frac{\\ln2}{\\lambda}', vars:[['t_{1/2}','half-life (s)'],['\\lambda','decay constant (s⁻¹)']],
 derivation:'Solves N(t)=N_0e^{-\\lambda t} for the time at which N(t)=N_0/2.', assumptions:'Constant decay constant; large number of independent nuclei (statistical decay law).', units:'second (s), or any convenient time unit', example:'Carbon-14\'s half-life of 5,730 years corresponds to a decay constant of about 3.84×10⁻¹² s⁻¹.'},
{id:'mean_lifetime_formula', title:'Mean Lifetime of a Radioactive Nucleus', category:'Nuclear Physics', eq:'\\tau=\\frac{1}{\\lambda}=\\frac{t_{1/2}}{\\ln2}', vars:[['\\tau','mean lifetime (s)'],['\\lambda','decay constant (s⁻¹)'],['t_{1/2}','half-life (s)']],
 derivation:'The mean lifetime is the expectation value of the decay time for an exponential (memoryless) decay distribution, ∫tλe^{-λt}dt.', assumptions:'Pure exponential decay law.', units:'second (s)', example:'The mean lifetime is always about 1.44 times longer than the half-life, since ln2≈0.693.'},
{id:'reaction_rate_formula', title:'Nuclear Reaction Rate', category:'Nuclear Physics', eq:'R=n\\sigma\\Phi', vars:[['R','reaction rate per target nucleus (s⁻¹)'],['n','target number density (m⁻³), or a single target count'],['\\sigma','reaction cross section (m²)'],['\\Phi','incident particle flux (m⁻²s⁻¹)']],
 derivation:'Defines the cross section σ as the effective interaction area, so the reaction rate is the product of flux and that effective target area.', assumptions:'Thin target (negligible flux attenuation); steady, uniform incident flux.', units:'s⁻¹ (per target nucleus)', example:'This relation is central to computing reactor neutron economics and particle-beam experiment yields.'},
{id:'fission_energy_release', title:'Nuclear Fission Energy Release', category:'Nuclear Physics', eq:'Q_{fission}=\\left[M_{parent}-\\textstyle\\sum M_{products}\\right]c^2', vars:[['Q_{fission}','energy released per fission event'],['M_{parent}','mass of the fissioning nucleus'],['\\sum M_{products}','summed masses of all fission fragments and released neutrons']],
 derivation:'A specific application of mass-energy equivalence (the general Q-value formula) to a nucleus splitting into two or more lighter fragments plus free neutrons.', assumptions:'All product masses precisely known; energy shared as kinetic energy of fragments, neutrons, and gamma rays.', units:'joule (J) or MeV', example:'Fission of uranium-235 releases about 200 MeV per event, the basis of nuclear reactor power generation.'},
{id:'fusion_energy_release', title:'Nuclear Fusion Energy Release (D–T)', category:'Nuclear Physics', eq:'^2H+\\,^3H\\rightarrow\\,^4He+n+17.6\\ \\text{MeV}', vars:[['^2H','deuterium nucleus'],['^3H','tritium nucleus'],['^4He','helium-4 nucleus (alpha particle)'],['n','free neutron']],
 derivation:'The energy release equals the mass difference between reactants and products (via E=Δmc²), since helium-4 is far more tightly bound per nucleon than deuterium or tritium.', assumptions:'Specific reaction channel shown; requires overcoming the Coulomb barrier between the two positively charged nuclei.', units:'MeV per reaction', example:'The deuterium-tritium reaction has the highest fusion cross section at achievable temperatures, making it the leading candidate for fusion power reactors like ITER.'},
{id:'coulomb_barrier_height', title:'Coulomb Barrier Height', category:'Nuclear Physics', eq:'V_C=\\frac{Z_1Z_2e^2}{4\\pi\\epsilon_0(R_1+R_2)}', vars:[['V_C','Coulomb barrier height (J)'],['Z_1,Z_2','charge numbers of the two nuclei'],['e','elementary charge'],['R_1,R_2','nuclear radii of the two nuclei']],
 derivation:'Evaluates the electrostatic (Coulomb) potential energy between two nuclear surfaces just touching, approximating each nucleus as a uniformly charged sphere.', assumptions:'Nuclei treated as touching uniformly charged spheres; ignores the short-range nuclear (strong-force) attraction that takes over once the barrier is crossed.', units:'joule (J) or MeV', example:'For light nuclei like deuterium and tritium the barrier is only about 0.1 MeV, but classical thermal energies alone still cannot overcome it — fusion in stars and reactors relies critically on quantum tunneling (the Gamow factor).'},
{id:'gamow_peak_energy', title:'Gamow Peak Energy (Stellar Fusion)', category:'Nuclear Physics', eq:'E_0=\\left(\\frac{b\\,k_BT}{2}\\right)^{2/3},\\quad b=\\pi\\sqrt{2m_r}\\frac{Z_1Z_2e^2}{4\\pi\\epsilon_0\\hbar}', vars:[['E_0','Gamow peak energy — the most probable fusion reaction energy'],['k_BT','thermal energy scale'],['m_r','reduced mass of the two reacting nuclei'],['Z_1,Z_2','charge numbers of the two nuclei']],
 derivation:'Found by multiplying the Maxwell–Boltzmann energy distribution (favoring low energy) by the Gamow tunneling probability (favoring high energy) and locating the product\'s maximum.', assumptions:'Non-relativistic, non-degenerate thermal plasma; WKB (Gamow) tunneling approximation for the Coulomb barrier.', units:'joule (J) or keV', example:'In the Sun\'s core (T≈15 million K), the Gamow peak for proton-proton fusion lies at only a few keV — far above the average thermal energy, but still accessible only via quantum tunneling.'},
{id:'specific_activity_formula', title:'Specific Activity', category:'Nuclear Physics', eq:'a=\\frac{A}{m}=\\frac{\\lambda N_A}{M}', vars:[['a','specific activity (Bq/kg)'],['A','total activity (Bq)'],['m','sample mass (kg)'],['\\lambda','decay constant'],['N_A','Avogadro constant'],['M','molar mass of the isotope']],
 derivation:'Combines the activity-decay constant relation A=λN with the number of atoms per unit mass, N/m=N_A/M, for a pure isotopic sample.', assumptions:'Pure, single-isotope sample; molar mass approximately equal to the isotope\'s mass number.', units:'becquerel per kilogram (Bq/kg), often quoted as Bq/g or Ci/g', example:'Isotopes with short half-lives have very high specific activity, since λ=ln2/t_{1/2} is large — a key factor in choosing medical radioisotopes.'},
{id:'nuclear_larmor_precession', title:'Nuclear Larmor Precession Frequency', category:'Nuclear Physics', eq:'\\omega_L=\\gamma B_0', vars:[['\\omega_L','Larmor precession angular frequency (rad/s)'],['\\gamma','nuclear gyromagnetic ratio'],['B_0','static external magnetic field strength (T)']],
 derivation:'Follows from the classical torque equation for a magnetic moment in a field, dL/dt=μ×B, applied to the nuclear spin angular momentum.', assumptions:'Static, uniform external magnetic field; classical precession picture of the nuclear spin.', units:'rad/s', example:'This is the resonance frequency exploited in both NMR spectroscopy and clinical MRI scanners.'},
{id:'neutron_separation_energy', title:'Neutron Separation Energy', category:'Nuclear Physics', eq:'S_n=[M(A-1,Z)+m_n-M(A,Z)]c^2', vars:[['S_n','neutron separation energy'],['M(A-1,Z)','mass of the nucleus with one fewer neutron'],['m_n','free neutron mass'],['M(A,Z)','mass of the original nucleus']],
 derivation:'A specific application of mass-energy equivalence, analogous to atomic ionization energy but for removing a single neutron from the nucleus.', assumptions:'Precisely known nuclear masses for both the parent and the (A-1) daughter nucleus.', units:'joule (J) or MeV', example:'Sudden drops in S_n between neighboring isotopes reveal nuclear shell structure, marking the location of "magic numbers".'},
{id:'nuclear_decay_energy_alpha', title:'Alpha Decay Energy Sharing', category:'Nuclear Physics', eq:'E_\\alpha=Q_\\alpha\\frac{A-4}{A}', vars:[['E_\\alpha','kinetic energy carried by the emitted alpha particle'],['Q_\\alpha','total energy released in the decay'],['A','mass number of the parent nucleus']],
 derivation:'Follows from conservation of momentum: the much lighter alpha particle recoils with most of the released kinetic energy, while the heavy daughter nucleus carries away only a small fraction.', assumptions:'Non-relativistic recoil; parent nucleus initially at rest.', units:'joule (J) or MeV', example:'For a heavy nucleus like uranium-238 (A=238), the alpha particle carries away about 98.3% of the total decay energy Q_α.'},
{id:'bateman_two_step', title:'Bateman Equation (Two-Step Decay Chain)', category:'Nuclear Physics', eq:'N_2(t)=\\frac{\\lambda_1N_{1,0}}{\\lambda_2-\\lambda_1}\\left(e^{-\\lambda_1t}-e^{-\\lambda_2t}\\right)', vars:[['N_2(t)','number of daughter nuclei at time t'],['\\lambda_1,\\lambda_2','decay constants of the parent and daughter'],['N_{1,0}','initial number of parent nuclei']],
 derivation:'Solves the coupled linear differential equations dN_1/dt=-\\lambda_1N_1 and dN_2/dt=\\lambda_1N_1-\\lambda_2N_2 describing a two-step sequential radioactive decay chain.', assumptions:'Pure parent sample at t=0 (no initial daughter nuclei); constant decay constants.', units:'depends on N (dimensionless count)', example:'This equation explains the classic "secular equilibrium" behavior seen in decay chains like uranium-238 to its daughter products, when λ_2 ≫ λ_1.'},

/* ---- Added batch: Quantum Physics (extended II) ---- */
{id:'free_particle_wavefunction', title:'Free Particle Plane Wave', category:'Quantum Physics', eq:'\\psi(x,t)=Ae^{i(kx-\\omega t)}', vars:[['\\psi(x,t)','wavefunction of a free particle'],['A','amplitude'],['k','wavenumber'],['\\omega','angular frequency']],
 derivation:'The simplest solution of the free-particle (V=0) time-dependent Schrödinger equation, found by direct substitution.', assumptions:'No potential (free particle); idealized, non-normalizable plane wave used as a building block for wave packets.', units:'depends on normalization', example:'A single plane wave has a perfectly defined momentum ℏk but is completely delocalized in position, illustrating the uncertainty principle in the extreme.'},
{id:'wave_packet_group_velocity', title:'Group Velocity of a Wave Packet', category:'Quantum Physics', eq:'v_g=\\frac{d\\omega}{dk}', vars:[['v_g','group velocity (m/s)'],['\\omega','angular frequency'],['k','wavenumber']],
 derivation:'Follows from analyzing the constructive-interference envelope of a superposition of plane waves with a narrow range of k values.', assumptions:'Narrow (quasi-monochromatic) spread of wavenumbers around a central k₀.', units:'m/s', example:'For a free quantum particle, the group velocity equals the classical particle velocity, v_g=p/m, unlike the phase velocity which differs.'},
{id:'probability_current', title:'Probability Current Density', category:'Quantum Physics', eq:'j=\\frac{\\hbar}{2mi}\\left(\\psi^*\\frac{\\partial\\psi}{\\partial x}-\\psi\\frac{\\partial\\psi^*}{\\partial x}\\right)', vars:[['j','probability current density'],['\\hbar','reduced Planck constant'],['m','particle mass'],['\\psi','wavefunction']],
 derivation:'Derived from the continuity equation for probability density, ∂|ψ|²/∂t+∂j/∂x=0, applied to the time-dependent Schrödinger equation.', assumptions:'Normalizable (or scattering-state) wavefunction with a well-defined spatial derivative.', units:'probability per unit time per unit area (1D: per unit time)', example:'Probability current is used to compute transmission and reflection coefficients in quantum scattering and tunneling problems.'},
{id:'expectation_value_general', title:'Expectation Value of an Observable', category:'Quantum Physics', eq:'\\langle A\\rangle=\\int\\psi^*\\hat A\\psi\\,dx', vars:[['\\langle A\\rangle','expectation value of observable A'],['\\psi','wavefunction'],['\\hat A','operator corresponding to the observable']],
 derivation:'Follows from the Born rule, weighting each possible measurement outcome (eigenvalue of Â) by its quantum-mechanical probability.', assumptions:'Normalized wavefunction; Hermitian operator Â representing a physical observable.', units:'depends on the observable', example:'This formula underlies essentially every prediction quantum mechanics makes about the outcome of repeated measurements on identically prepared systems.'},
{id:'variance_qm', title:'Quantum Mechanical Variance (Uncertainty)', category:'Quantum Physics', eq:'(\\Delta A)^2=\\langle A^2\\rangle-\\langle A\\rangle^2', vars:[['\\Delta A','standard deviation (uncertainty) of observable A'],['\\langle A^2\\rangle','expectation value of A²'],['\\langle A\\rangle','expectation value of A']],
 derivation:'The standard statistical definition of variance applied to the probability distribution of measurement outcomes predicted by quantum mechanics.', assumptions:'Well-defined expectation values for A and A² in the given state.', units:'depends on the observable', example:'Substituting position and momentum into this definition and applying the Cauchy–Schwarz inequality is one way to derive the Heisenberg uncertainty relation.'},
{id:'ladder_operator_qho', title:'Quantum Harmonic Oscillator Ladder Operators', category:'Quantum Physics', eq:'\\hat a|n\\rangle=\\sqrt{n}\\,|n-1\\rangle,\\quad \\hat a^\\dagger|n\\rangle=\\sqrt{n+1}\\,|n+1\\rangle', vars:[['\\hat a,\\hat a^\\dagger','lowering (annihilation) and raising (creation) operators'],['|n\\rangle','energy eigenstate with quantum number n']],
 derivation:'Constructed by factoring the harmonic oscillator Hamiltonian into products of linear combinations of position and momentum operators, chosen so [â,â†]=1.', assumptions:'Ideal quantum harmonic oscillator; states normalized.', units:'dimensionless (operator eigenvalue relations)', example:'Repeatedly applying â† to the ground state builds up the entire energy spectrum, avoiding the need to solve a differential equation directly.'},
{id:'lz_eigenvalue', title:'Magnetic Quantum Number (Lz Eigenvalue)', category:'Quantum Physics', eq:'\\hat L_z Y_l^m=m\\hbar Y_l^m,\\quad m=-l,\\ldots,+l', vars:[['\\hat L_z','z-component angular momentum operator'],['Y_l^m','spherical harmonic (angular wavefunction)'],['m','magnetic quantum number'],['l','orbital angular momentum quantum number']],
 derivation:'Follows from solving the eigenvalue equation of the L_z operator, which reduces to differentiation with respect to the azimuthal angle φ.', assumptions:'Central (spherically symmetric) potential; spherical harmonics used as angular eigenfunctions.', units:'kg·m²/s (for the eigenvalue mℏ)', example:'The (2l+1) values of m for a given l explain the orbital degeneracy split by the Zeeman effect in a magnetic field.'},
{id:'hydrogen_ground_state_wavefunction', title:'Hydrogen Atom Ground-State Wavefunction', category:'Quantum Physics', eq:'\\psi_{100}(r)=\\frac{1}{\\sqrt{\\pi a_0^3}}e^{-r/a_0}', vars:[['\\psi_{100}','ground-state (1s) wavefunction'],['a_0','Bohr radius'],['r','radial distance from the nucleus']],
 derivation:'The normalizable, nodeless solution of the radial Schrödinger equation for a Coulomb potential with n=1, l=0.', assumptions:'Non-relativistic hydrogen atom; infinite nuclear mass approximation (or a reduced-mass correction).', units:'m^{-3/2} (probability amplitude)', example:'The probability density |ψ₁₀₀|² peaks at the nucleus, but the radial probability r²|ψ₁₀₀|² peaks at exactly r=a₀, the Bohr radius.'},
{id:'time_evolution_operator', title:'Quantum Time Evolution Operator', category:'Quantum Physics', eq:'\\hat U(t)=e^{-i\\hat Ht/\\hbar}', vars:[['\\hat U(t)','unitary time-evolution operator'],['\\hat H','Hamiltonian operator'],['t','elapsed time']],
 derivation:'The formal solution of the time-dependent Schrödinger equation, iℏ∂|ψ⟩/∂t=Ĥ|ψ⟩, for a time-independent Hamiltonian.', assumptions:'Time-independent Hamiltonian (for time-dependent H this generalizes to a time-ordered exponential).', units:'dimensionless (unitary operator)', example:'Acting on any initial state, |ψ(t)⟩=Û(t)|ψ(0)⟩ propagates it forward in time while exactly preserving normalization.'},
{id:'electron_spin_larmor', title:'Electron Spin Larmor Precession Frequency', category:'Quantum Physics', eq:'\\omega_L=\\frac{g_s\\mu_BB}{\\hbar}', vars:[['\\omega_L','Larmor precession frequency (rad/s)'],['g_s','electron spin g-factor'],['\\mu_B','Bohr magneton'],['B','applied magnetic field (T)']],
 derivation:'Follows from the torque exerted by an external field on the electron\'s intrinsic spin magnetic moment, analogous to classical magnetic precession.', assumptions:'Uniform static magnetic field; electron spin treated as a classical precessing vector in this semiclassical picture.', units:'rad/s', example:'This precession frequency underlies electron spin resonance (ESR) spectroscopy, used to probe unpaired electrons in materials and radicals.'},
{id:'degeneracy_pressure', title:'Electron Degeneracy Pressure', category:'Quantum Physics', eq:'P\\approx\\frac{(3\\pi^2)^{2/3}}{5}\\frac{\\hbar^2}{m_e}n^{5/3}', vars:[['P','degeneracy pressure (Pa)'],['\\hbar','reduced Planck constant'],['m_e','electron mass'],['n','electron number density']],
 derivation:'Follows from the Pauli exclusion principle: filling the lowest available momentum states up to the Fermi momentum produces pressure even at zero temperature.', assumptions:'Non-relativistic, fully degenerate (T≈0) electron gas.', units:'pascal (Pa)', example:'Electron degeneracy pressure is what supports white dwarf stars against further gravitational collapse, up to the Chandrasekhar mass limit.'},
{id:'klein_gordon_eq', title:'Klein–Gordon Equation', category:'Quantum Physics', eq:'\\left(\\Box+\\frac{m^2c^2}{\\hbar^2}\\right)\\psi=0', vars:[['\\Box','d\'Alembertian operator, \\frac{1}{c^2}\\partial_t^2-\\nabla^2'],['m','particle rest mass'],['\\psi','relativistic scalar wavefunction']],
 derivation:'Obtained by directly quantizing the relativistic energy-momentum relation E²=(pc)²+(mc²)² using the operator substitutions E→iℏ∂_t, p→-iℏ∇.', assumptions:'Relativistic spin-0 (scalar) particle; second order in time, unlike the first-order Schrödinger equation.', units:'depends on normalization', example:'The Klein–Gordon equation correctly describes relativistic spin-0 bosons like the pion; its early negative-probability-density puzzle was later resolved by reinterpreting it as a field equation in quantum field theory.'},
{id:'dirac_eq', title:'Dirac Equation', category:'Quantum Physics', eq:'\\left(i\\hbar\\gamma^\\mu\\partial_\\mu-mc\\right)\\psi=0', vars:[['\\gamma^\\mu','Dirac gamma matrices'],['\\partial_\\mu','four-gradient (spacetime derivative)'],['m','particle rest mass'],['\\psi','four-component Dirac spinor']],
 derivation:'Constructed by Dirac as a relativistically covariant, first-order (in both space and time) wave equation whose square reproduces the Klein–Gordon equation.', assumptions:'Relativistic spin-1/2 particle (e.g. the electron).', units:'depends on normalization', example:'The Dirac equation naturally predicts electron spin and its correct magnetic moment (g≈2), and its negative-energy solutions led to the theoretical prediction of antimatter.'},
{id:'quantum_revival_time', title:'Quantum Wave Packet Revival Time', category:'Quantum Physics', eq:'T_{rev}\\approx\\frac{2\\pi\\hbar}{|E_n^{\\prime\\prime}|}', vars:[['T_{rev}','revival time — when the wave packet reconstructs its initial shape'],['\\hbar','reduced Planck constant'],['E_n^{\\prime\\prime}','second derivative of the energy spectrum with respect to quantum number n']],
 derivation:'Follows from requiring the phases of all superposed energy eigenstates to realign (modulo 2π) simultaneously, based on the quadratic term in a Taylor expansion of E_n around the packet\'s central quantum number.', assumptions:'Bound-state wave packet built from a narrow superposition of energy eigenstates (e.g. in an infinite square well).', units:'second (s)', example:'Wave-packet revivals have been directly observed in Rydberg atoms, where the electron wave packet periodically reforms after initially spreading out and appearing to lose coherence.'},
{id:'position_momentum_representation', title:'Momentum-Space Wavefunction (Fourier Transform)', category:'Quantum Physics', eq:'\\phi(p)=\\frac{1}{\\sqrt{2\\pi\\hbar}}\\int\\psi(x)e^{-ipx/\\hbar}dx', vars:[['\\phi(p)','momentum-space wavefunction'],['\\psi(x)','position-space wavefunction'],['p','momentum'],['\\hbar','reduced Planck constant']],
 derivation:'Follows from expanding the position-space wavefunction in the complete basis of momentum eigenstates (plane waves), which is mathematically a Fourier transform.', assumptions:'Square-integrable (normalizable) wavefunction in position space.', units:'depends on normalization', example:'The inverse relationship between the widths of ψ(x) and φ(p) under Fourier transformation is the mathematical root of the Heisenberg uncertainty principle.'},

/* ---- Added batch: Nuclear Physics (extended II) ---- */
{id:'gamma_ray_attenuation', title:'Gamma-Ray Attenuation Law', category:'Nuclear Physics', eq:'I(x)=I_0e^{-\\mu x}', vars:[['I(x)','transmitted intensity after thickness x'],['I_0','initial intensity'],['\\mu','linear attenuation coefficient (m⁻¹)'],['x','absorber thickness (m)']],
