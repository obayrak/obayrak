<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Constants &amp; Unit Converter Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
<style>
/* ============================================================
   SCIENTIFIC CONSTANTS & UNIT CONVERTER DASHBOARD
   Design tokens: instrument-panel dark theme, phosphor accents
   ============================================================ */
:root{
  --void:#0a0d13;
  --panel:#121722;
  --panel-2:#1a2130;
  --panel-3:#212a3d;
  --line:#242c3d;
  --line-soft:#1b2231;
  --cyan:#5eead4;
  --cyan-dim:#2c7a6f;
  --amber:#f0a94e;
  --amber-dim:#8a5f26;
  --danger:#ef6f6f;
  --good:#7ee0a3;
  --text:#e6eaf2;
  --text-dim:#8891a5;
  --text-faint:#5b6478;
  --radius:10px;
  --radius-lg:16px;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --shadow: 0 8px 30px -12px rgba(0,0,0,0.6);
  --grid-line: rgba(94,234,212,0.05);
}
html.light{
  --void:#f3f5fa;
  --panel:#ffffff;
  --panel-2:#eef1f7;
  --panel-3:#e4e9f2;
  --line:#dde3ee;
  --line-soft:#e8ecf4;
  --cyan:#0f8f7f;
  --cyan-dim:#0f8f7f;
  --amber:#b9770e;
  --amber-dim:#b9770e;
  --danger:#c73e3e;
  --good:#158a4d;
  --text:#161b26;
  --text-dim:#4c5567;
  --text-faint:#8891a5;
  --shadow: 0 8px 24px -14px rgba(20,30,50,0.25);
  --grid-line: rgba(15,143,127,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
    var(--void);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease, color .25s ease;
}
::selection{ background:var(--cyan); color:#04120f; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:var(--cyan-dim); }
a{color:inherit;}
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

.app{ display:flex; min-height:100vh; }

/* ---------------- SIDEBAR ---------------- */
.sidebar{
  width:250px; flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  transition:width .2s ease;
  z-index:40;
}
.sidebar.collapsed{ width:68px; }
.sidebar-head{
  display:flex; align-items:center; gap:10px;
  padding:18px 16px; border-bottom:1px solid var(--line);
  min-height:64px;
}
.sidebar-logo{
  width:34px; height:34px; border-radius:8px;
  background:linear-gradient(135deg, var(--cyan), var(--cyan-dim));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:700; color:#04120f; font-size:15px;
  flex-shrink:0;
}
.sidebar-title{ font-family:var(--mono); font-size:12.5px; font-weight:600; letter-spacing:.06em; line-height:1.25; white-space:nowrap; overflow:hidden; }
.sidebar-title small{ display:block; color:var(--text-faint); font-weight:400; font-size:10px; letter-spacing:.08em; margin-top:2px;}
.sidebar.collapsed .sidebar-title{ display:none; }
.collapse-btn{
  margin-left:auto; background:none; border:1px solid var(--line); color:var(--text-dim);
  width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.collapse-btn:hover{ color:var(--cyan); border-color:var(--cyan-dim); }
.sidebar.collapsed .sidebar-head{ padding:18px 0; justify-content:center; }
.sidebar.collapsed .collapse-btn{ margin-left:0; }

.nav{ flex:1; overflow-y:auto; padding:10px 10px; }
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 10px; border-radius:8px; margin-bottom:2px;
  color:var(--text-dim); font-size:13px; font-weight:500;
  border:1px solid transparent; white-space:nowrap; overflow:hidden;
}
.nav-item .ico{ width:17px; height:17px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.nav-item svg{ width:17px; height:17px; }
.nav-item:hover{ background:var(--panel-2); color:var(--text); }
.nav-item.active{ background:var(--panel-2); color:var(--cyan); border-color:var(--line); }
.nav-item.active .ico svg{ filter:drop-shadow(0 0 4px var(--cyan-dim)); }
.sidebar.collapsed .nav-item span.label{ display:none; }
.sidebar.collapsed .nav-item{ justify-content:center; }
.nav-divider{ font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--text-faint); padding:14px 10px 6px; }
.sidebar.collapsed .nav-divider{ display:none; }

.sidebar-foot{ padding:12px; border-top:1px solid var(--line); }
.theme-toggle{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 8px;
  width:100%; color:var(--text-dim); font-size:12px;
}
.sidebar.collapsed .theme-toggle span{ display:none; }
.sidebar.collapsed .theme-toggle{ justify-content:center; }

/* ---------------- MAIN ---------------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px;
  padding:12px 22px; border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--void) 88%, transparent);
  backdrop-filter:blur(10px);
}
.searchbox{
  flex:1; max-width:520px; position:relative;
}
.searchbox input{
  width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:9px 36px 9px 34px; border-radius:8px; font-size:13px;
}
.searchbox input::placeholder{ color:var(--text-faint); }
.searchbox .sico{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-faint); display:flex;}
.searchbox .kbd{ position:absolute; right:9px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:10px; color:var(--text-faint); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
.search-results{
  position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--panel); border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); max-height:420px; overflow-y:auto; display:none; z-index:60;
}
.search-results.show{ display:block; }
.sr-group-label{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--text-faint); padding:10px 14px 4px;}
.sr-item{ display:flex; align-items:center; justify-content:space-between; padding:8px 14px; font-size:13px; cursor:pointer; }
.sr-item:hover{ background:var(--panel-2); }
.sr-item .sr-sub{ color:var(--text-faint); font-size:11px; font-family:var(--mono); }
.sr-empty{ padding:18px; text-align:center; color:var(--text-faint); font-size:13px; }

.topbar-actions{ display:flex; gap:8px; align-items:center; margin-left:auto; }
.icon-btn{
  background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
  width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  position:relative;
}
.icon-btn:hover{ color:var(--cyan); border-color:var(--cyan-dim); }
.icon-btn svg{ width:16px; height:16px; }
.badge-dot{ position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background:var(--amber); border:2px solid var(--void); }

.content{ padding:26px 30px 60px; max-width:1400px; width:100%; margin:0 auto; }
.view{ display:none; animation:fadein .28s ease; }
.view.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.page-head{ margin-bottom:22px; }
.page-eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--cyan); margin:0 0 6px; text-transform:uppercase; }
.page-title{ font-size:26px; font-weight:700; margin:0 0 6px; letter-spacing:-.01em; }
.page-sub{ color:var(--text-dim); font-size:13.5px; margin:0; max-width:640px; line-height:1.5; }

/* ---------------- HERO / DASHBOARD ---------------- */
.hero{
  border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--panel);
  padding:26px 28px; margin-bottom:26px; position:relative; overflow:hidden;
  display:grid; grid-template-columns:1.1fr .9fr; gap:26px; align-items:center;
}
.hero::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 85% 20%, var(--grid-line), transparent 60%);
}
.hero-eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--amber); margin:0 0 10px; text-transform:uppercase;}
.hero h1{ font-size:28px; margin:0 0 10px; letter-spacing:-.01em; line-height:1.15; }
.hero p{ color:var(--text-dim); font-size:14px; line-height:1.6; margin:0 0 18px; max-width:480px; }
.hero-stats{ display:flex; gap:22px; flex-wrap:wrap; }
.hero-stat b{ display:block; font-family:var(--mono); font-size:19px; color:var(--cyan); }
.hero-stat span{ display:block; font-size:10.5px; color:var(--text-faint); letter-spacing:.05em; text-transform:uppercase; margin-top:2px;}

.readout{
  border:1px solid var(--line); border-radius:12px; background:var(--void);
  padding:20px; font-family:var(--mono); position:relative; overflow:hidden;
}
.readout::after{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px); pointer-events:none;}
.readout-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.readout-label{ font-size:10px; letter-spacing:.12em; color:var(--text-faint); text-transform:uppercase; }
.readout-dot{ width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 8px var(--good); animation:blink 1.6s infinite; }
@keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.readout-symbol{ font-size:13px; color:var(--amber); margin-bottom:4px; }
.readout-name{ font-size:13px; color:var(--text-dim); margin-bottom:14px; min-height:16px; }
.readout-value{ font-size:23px; color:var(--cyan); letter-spacing:.01em; word-break:break-all; text-shadow:0 0 18px var(--cyan-dim); min-height:30px;}
.readout-value .digit{ display:inline-block; }
.readout-unit{ font-size:12px; color:var(--text-dim); margin-top:6px; }
.readout-bottom{ display:flex; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:10.5px; color:var(--text-faint); }

/* ---------------- CARD GRID ---------------- */
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:16px; }
.dcard{
  border:1px solid var(--line); background:var(--panel); border-radius:var(--radius-lg);
  padding:20px; position:relative; overflow:hidden; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  display:flex; flex-direction:column; gap:10px; cursor:pointer;
}
.dcard:hover{ transform:translateY(-3px); border-color:var(--cyan-dim); box-shadow:var(--shadow); }
.dcard-icon{
  width:38px; height:38px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--cyan); transition:transform .25s ease;
}
.dcard:hover .dcard-icon{ transform:rotate(-6deg) scale(1.06); }
.dcard-icon svg{ width:19px; height:19px; }
.dcard h3{ font-size:15.5px; margin:0; }
.dcard p{ font-size:12.5px; color:var(--text-dim); margin:0; line-height:1.5; flex:1; }
.dcard-stats{ display:flex; gap:14px; font-family:var(--mono); font-size:11px; color:var(--text-faint); }
.dcard-stats b{ color:var(--text); }
.dcard-actions{ display:flex; gap:8px; margin-top:2px; }
.dcard-actions button{ font-size:11px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); }
.dcard-actions button:hover{ color:var(--cyan); border-color:var(--cyan-dim); }

/* ---------------- COMMON PANELS ---------------- */
.panel{ border:1px solid var(--line); background:var(--panel); border-radius:var(--radius-lg); padding:20px; }
.panel + .panel{ margin-top:16px; }
.toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-family:var(--mono); }
select, .input{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  padding:9px 10px; border-radius:8px; font-size:13px; min-width:140px;
}
input[type=text].input, input[type=number].input{ min-width:auto; }
.btn{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-size:12.5px; font-weight:500;
  padding:9px 14px; border-radius:8px; display:inline-flex; align-items:center; gap:7px;
}
.btn:hover{ border-color:var(--cyan-dim); color:var(--cyan); }
.btn.primary{ background:linear-gradient(135deg, var(--cyan), var(--cyan-dim)); color:#04120f; border:none; font-weight:600; }
.btn.primary:hover{ filter:brightness(1.08); color:#04120f; }
.btn.ghost{ background:transparent; }
.btn svg{ width:14px; height:14px; }
.chip{ font-family:var(--mono); font-size:10.5px; padding:4px 9px; border-radius:20px; border:1px solid var(--line); color:var(--text-dim); background:var(--panel-2); cursor:pointer; user-select:none;}
.chip.active{ color:var(--cyan); border-color:var(--cyan-dim); background:color-mix(in srgb, var(--cyan) 12%, var(--panel-2));}
.chiprow{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px;}

/* Constants list */
.const-list{ display:flex; flex-direction:column; gap:10px; }
.const-row{
  border:1px solid var(--line); background:var(--panel-2); border-radius:12px; padding:14px 16px;
}
.const-row-top{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.const-symbol{ font-family:var(--mono); font-size:17px; color:var(--amber); min-width:52px; }
.const-main{ flex:1; min-width:220px; }
.const-name{ font-size:14px; font-weight:600; }
.const-field{ font-size:10.5px; color:var(--text-faint); font-family:var(--mono); text-transform:uppercase; letter-spacing:.05em; }
.const-value{ font-family:var(--mono); font-size:15px; color:var(--cyan); text-align:right; }
.const-unit{ font-size:11px; color:var(--text-dim); text-align:right; }
.const-unc{ font-size:10px; color:var(--text-faint); text-align:right; font-family:var(--mono);}
.const-actions{ display:flex; gap:6px; }
.iconbtn-sm{
  width:28px; height:28px; border-radius:6px; border:1px solid var(--line); background:var(--panel);
  color:var(--text-dim); display:flex; align-items:center; justify-content:center;
}
.iconbtn-sm:hover{ color:var(--cyan); border-color:var(--cyan-dim); }
.iconbtn-sm.fav.active{ color:var(--amber); border-color:var(--amber-dim); }
.iconbtn-sm svg{ width:14px; height:14px; }
.const-detail{ display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
.const-detail.open{ display:block; }
.detail-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.detail-block h4{ margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--cyan); font-family:var(--mono); }
.detail-block p, .detail-block ul{ font-size:12.5px; color:var(--text-dim); line-height:1.55; margin:0; }
.detail-block ul{ padding-left:16px; }
.tag-row{ display:flex; flex-wrap:wrap; gap:6px; }
.tag{ font-size:11px; background:var(--panel-3); border:1px solid var(--line); padding:3px 9px; border-radius:20px; color:var(--text-dim); }
.related-link{ font-size:12px; color:var(--cyan); cursor:pointer; text-decoration:underline dotted; }

/* Converter */
.conv-wrap{ display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:end; }
.conv-swap{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--panel-2); color:var(--cyan); display:flex; align-items:center; justify-content:center; align-self:center; margin-bottom:2px;}
.conv-result{ margin-top:18px; padding:18px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); text-align:center; }
.conv-result .val{ font-family:var(--mono); font-size:26px; color:var(--cyan); word-break:break-all; }
.conv-result .expr{ font-size:12px; color:var(--text-faint); margin-top:6px; font-family:var(--mono); }
.hist-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; max-height:220px; overflow-y:auto;}
.hist-item{ font-family:var(--mono); font-size:11.5px; color:var(--text-dim); padding:7px 10px; background:var(--panel-2); border-radius:6px; border:1px solid var(--line); display:flex; justify-content:space-between; gap:10px;}

/* Calculator */
.calc-wrap{ display:grid; grid-template-columns:1fr 300px; gap:18px; }
.calc-screen{ background:var(--void); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px;}
.calc-expr{ color:var(--text-faint); font-family:var(--mono); font-size:12px; min-height:16px; text-align:right;}
.calc-out{ color:var(--cyan); font-family:var(--mono); font-size:28px; text-align:right; word-break:break-all;}
.calc-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.calc-key{ padding:12px 0; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-family:var(--mono); font-size:13.5px; text-align:center;}
.calc-key:hover{ border-color:var(--cyan-dim); color:var(--cyan); }
.calc-key.op{ color:var(--amber); }
.calc-key.eq{ background:linear-gradient(135deg, var(--cyan), var(--cyan-dim)); color:#04120f; font-weight:700; border:none;}
.calc-key.wide{ grid-column:span 2; }
.calc-mem{ display:flex; flex-direction:column; gap:6px; }
.calc-mem .btn{ justify-content:flex-start; }

/* Formula / quantity cards */
.formula-card, .qty-card{ border:1px solid var(--line); background:var(--panel-2); border-radius:12px; padding:16px; margin-bottom:12px; }
.formula-title{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.formula-title h4{ margin:0; font-size:14px; }
.formula-eq{ background:var(--void); border-radius:8px; padding:12px 14px; text-align:center; overflow-x:auto; margin-bottom:10px; border:1px solid var(--line-soft);}
.var-list{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
.var-chip{ font-family:var(--mono); font-size:11px; background:var(--panel-3); padding:3px 8px; border-radius:6px; border:1px solid var(--line);}
.var-chip b{ color:var(--amber); }

/* Facts */
.fact-card{ border:1px solid var(--line); background:var(--panel-2); border-radius:14px; padding:22px; text-align:center; max-width:640px; margin:0 auto;}
.fact-cat{ font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:var(--amber); text-transform:uppercase; margin-bottom:10px;}
.fact-text{ font-size:16px; line-height:1.6; margin-bottom:14px; }
.fact-refs{ font-size:11px; color:var(--text-faint); }

/* Dimensional analysis */
.dim-formula{ font-family:var(--mono); font-size:20px; text-align:center; padding:16px; background:var(--void); border-radius:10px; border:1px solid var(--line-soft); margin:14px 0; color:var(--cyan);}
.base-dim-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:8px; margin-bottom:14px;}
.base-dim{ text-align:center; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 4px;}
.base-dim b{ display:block; font-family:var(--mono); color:var(--amber); font-size:15px;}
.base-dim span{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.chain{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
.chain-item{ display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-family:var(--mono); font-size:12px;}
.chain-item button{ background:none; border:none; color:var(--danger); font-size:13px; }
.consistency-badge{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; font-size:12px; font-family:var(--mono); font-weight:600;}
.consistency-badge.ok{ background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good); border:1px solid var(--good);}
.consistency-badge.bad{ background:color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger); border:1px solid var(--danger);}

/* Sig figs */
.step-list{ list-style:none; padding:0; margin:14px 0 0; display:flex; flex-direction:column; gap:8px;}
.step-list li{ font-size:12.5px; color:var(--text-dim); background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:9px 12px;}
.step-list b{ color:var(--cyan); font-family:var(--mono);}

/* Prefix table */
.prefix-table{ width:100%; border-collapse:collapse; font-size:12.5px;}
.prefix-table th{ text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--line);}
.prefix-table td{ padding:8px 10px; border-bottom:1px solid var(--line-soft); font-family:var(--mono);}
.prefix-table tr:hover td{ background:var(--panel-2); }
.prefix-sym{ color:var(--amber); }

/* Empty state */
.empty{ text-align:center; padding:50px 20px; color:var(--text-faint); }
.empty svg{ width:40px; height:40px; margin-bottom:12px; opacity:.5;}
.empty p{ font-size:13px; }

/* Toast */
.toast-wrap{ position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200;}
.toast{
  background:var(--panel); border:1px solid var(--cyan-dim); color:var(--text); padding:11px 16px; border-radius:10px;
  font-size:12.5px; box-shadow:var(--shadow); display:flex; align-items:center; gap:9px; min-width:200px;
  animation:toastin .2s ease;
}
.toast svg{ width:15px; height:15px; color:var(--cyan); flex-shrink:0;}
@keyframes toastin{ from{ transform:translateX(20px); opacity:0;} to{transform:translateX(0); opacity:1;} }

/* tooltip */
[data-tip]{ position:relative; }
[data-tip]:hover::after{
  content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
  background:var(--panel-3); color:var(--text); font-size:11px; padding:5px 9px; border-radius:6px; white-space:nowrap;
  border:1px solid var(--line); z-index:80; pointer-events:none;
}

/* Settings */
.settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line-soft); gap:20px;}
.settings-row:last-child{ border:none; }
.settings-row .lbl{ font-size:13.5px; font-weight:500; }
.settings-row .desc{ font-size:11.5px; color:var(--text-faint); margin-top:2px;}
.switch{ width:42px; height:24px; border-radius:20px; background:var(--panel-3); border:1px solid var(--line); position:relative; flex-shrink:0;}
.switch.on{ background:var(--cyan-dim); }
.switch::after{ content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .18s ease;}
.switch.on::after{ left:20px; }

/* keyboard shortcuts overlay */
.kbd-tag{ font-family:var(--mono); font-size:10px; border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--text-dim);}

footer.about-foot{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line-soft); font-size:11.5px; color:var(--text-faint);}

@media (max-width: 900px){
  .sidebar{ position:fixed; left:-260px; z-index:100; box-shadow:var(--shadow); }
  .sidebar.mobile-open{ left:0; }
  .hero{ grid-template-columns:1fr; }
  .conv-wrap{ grid-template-columns:1fr; }
  .conv-swap{ justify-self:center; transform:rotate(90deg); }
  .calc-wrap{ grid-template-columns:1fr; }
  .content{ padding:18px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

{id:'length_contraction', title:'Length Contraction', category:'Relativity', eq:'L=L_0\\sqrt{1-v^2/c^2}', vars:[['L','contracted length measured by a moving observer'],['L_0','proper length (measured in the object\'s rest frame)'],['v','relative velocity'],['c','speed of light']],
 derivation:'Follows from the Lorentz transformation applied to the endpoints of an object, measured simultaneously in the frame in which the object is moving.', assumptions:'Special relativity; length measured along the direction of relative motion.', units:'metre (m)', example:'A spacecraft with a 100 m proper length moving at 0.8c appears contracted to just 60 m to a stationary observer.'},
{id:'relativistic_velocity_addition', title:'Relativistic Velocity Addition', category:'Relativity', eq:'u\'=\\frac{u+v}{1+\\frac{uv}{c^2}}', vars:[['u\'','velocity measured in the second reference frame'],['u','velocity measured in the first reference frame'],['v','relative velocity between the two frames'],['c','speed of light']],
 derivation:'Follows from applying the Lorentz transformation to the velocity components dx\'/dt\' between two inertial frames.', assumptions:'Special relativity; collinear (one-dimensional) motion.', units:'m/s', example:'Adding two velocities of 0.5c relativistically gives 0.8c, not 1.0c — velocities never combine to exceed the speed of light.'},
{id:'relativistic_momentum', title:'Relativistic Momentum', category:'Relativity', eq:'p=\\gamma mv=\\frac{mv}{\\sqrt{1-v^2/c^2}}', vars:[['p','relativistic momentum'],['\\gamma','Lorentz factor'],['m','rest mass'],['v','velocity']],
 derivation:'Modifies the Newtonian definition of momentum to remain consistent with conservation laws and Lorentz invariance at relativistic speeds.', assumptions:'Special relativity; m is the invariant rest mass.', units:'kg·m/s', example:'At v=0.9c, an object\'s momentum exceeds the naive Newtonian value (mv) by a factor of about 2.29, the Lorentz factor at that speed.'},
{id:'relativistic_kinetic_energy', title:'Relativistic Kinetic Energy', category:'Relativity', eq:'KE=(\\gamma-1)mc^2', vars:[['KE','relativistic kinetic energy'],['\\gamma','Lorentz factor'],['m','rest mass'],['c','speed of light']],
 derivation:'Follows from subtracting the rest energy mc² from the total relativistic energy γmc².', assumptions:'Special relativity.', units:'joule (J)', example:'At low speeds, a Taylor expansion of this formula reduces exactly to the familiar Newtonian kinetic energy, ½mv².'},
{id:'rest_energy_equivalence', title:'Rest Energy (Mass–Energy Equivalence)', category:'Relativity', eq:'E_0=mc^2', vars:[['E_0','rest energy'],['m','rest mass'],['c','speed of light']],
 derivation:'Follows from evaluating the relativistic energy–momentum relation E²=(pc)²+(mc²)² in an object\'s own rest frame, where p=0.', assumptions:'Object at rest in the frame considered.', units:'joule (J)', example:'Converting just 1 gram of matter entirely into energy would release about 9×10¹³ J — roughly the energy of a large nuclear explosion.'},
{id:'spacetime_interval', title:'Spacetime Interval', category:'Relativity', eq:'ds^2=-c^2dt^2+dx^2+dy^2+dz^2', vars:[['ds^2','invariant spacetime interval'],['c','speed of light'],['dt,dx,dy,dz','coordinate differences between two nearby events']],
 derivation:'Constructed to be invariant under Lorentz transformations, generalizing the Pythagorean distance formula into four-dimensional Minkowski spacetime.', assumptions:'Special relativity; flat spacetime; sign convention (−,+,+,+) shown here (some texts use the opposite signature).', units:'m² (or s², depending on convention)', example:'Events with a "timelike" separation (ds²<0 in this convention) can be causally connected; "spacelike" separated events cannot.'},
{id:'proper_time_relation', title:'Proper Time', category:'Relativity', eq:'d\\tau=dt\\sqrt{1-v^2/c^2}=\\frac{dt}{\\gamma}', vars:[['d\\tau','proper time interval (measured by the moving clock itself)'],['dt','coordinate time interval in the observer\'s frame'],['v','speed of the clock'],['\\gamma','Lorentz factor']],
 derivation:'Follows from evaluating the spacetime interval along a clock\'s own worldline, where by definition dx=dy=dz=0 in the clock\'s own rest frame.', assumptions:'Special relativity; v may vary along the path, requiring integration.', units:'second (s)', example:'A clock moving at high speed accumulates less proper time than a stationary one over the same coordinate time — the basis of the twin paradox.'},
{id:'transverse_doppler_relativistic', title:'Transverse Relativistic Doppler Effect', category:'Relativity', eq:'f_{obs}=\\frac{f_{src}}{\\gamma}', vars:[['f_{obs}','observed frequency'],['f_{src}','source (rest-frame) frequency'],['\\gamma','Lorentz factor']],
 derivation:'A purely relativistic time-dilation effect with no classical counterpart, occurring when a source moves perpendicular to the line of sight at the moment of closest approach.', assumptions:'Source velocity purely transverse to the line of sight at the instant of observation.', units:'hertz (Hz)', example:'First observed directly in the Ives–Stilwell experiment, this effect confirmed time dilation independently of the classical Doppler shift.'},
{id:'relativistic_aberration', title:'Relativistic Aberration of Light', category:'Relativity', eq:'\\cos\\theta\'=\\frac{\\cos\\theta+v/c}{1+(v/c)\\cos\\theta}', vars:[['\\theta\'','observed angle in the moving frame'],['\\theta','angle in the source\'s rest frame'],['v','relative velocity between the two frames'],['c','speed of light']],
 derivation:'Follows from applying the Lorentz transformation to the direction components of a light ray\'s wavevector.', assumptions:'Special relativity; one-dimensional relative motion between the two frames.', units:'dimensionless (angle relation)', example:'At high speeds this produces relativistic beaming — light from objects ahead of a fast-moving observer appears concentrated toward the forward direction.'},
{id:'gravitational_time_dilation', title:'Gravitational Time Dilation', category:'Relativity', eq:'d\\tau=dt\\sqrt{1-\\frac{2GM}{rc^2}}', vars:[['d\\tau','proper time at radius r'],['dt','coordinate time measured far from the mass'],['G','gravitational constant'],['M','mass of the gravitating body'],['r','radial coordinate'],['c','speed of light']],
 derivation:'Follows from the time component of the Schwarzschild metric, describing how clocks run slower deeper within a gravitational potential well.', assumptions:'Static, spherically symmetric mass (Schwarzschild spacetime); r greater than the Schwarzschild radius.', units:'second (s)', example:'GPS satellite clocks run measurably faster than ground clocks due to their weaker gravitational potential — a general-relativistic correction of about 45 microseconds per day.'},
{id:'gravitational_redshift', title:'Gravitational Redshift', category:'Relativity', eq:'\\frac{\\Delta\\lambda}{\\lambda}\\approx\\frac{GM}{rc^2}', vars:[['\\Delta\\lambda/\\lambda','fractional wavelength shift'],['G','gravitational constant'],['M','mass of the gravitating body'],['r','radial distance from the mass'],['c','speed of light']],
 derivation:'Follows from applying gravitational time dilation to photon emission and reception at different gravitational potentials, in the weak-field limit.', assumptions:'Weak gravitational field approximation.', units:'dimensionless', example:'The Pound–Rebka experiment (1959) measured Earth\'s tiny gravitational redshift over just a 22.5 m tower, confirming General Relativity\'s prediction to within about 1%.'},
{id:'schwarzschild_metric', title:'Schwarzschild Metric', category:'Relativity', eq:'ds^2=-\\left(1-\\frac{2GM}{rc^2}\\right)c^2dt^2+\\left(1-\\frac{2GM}{rc^2}\\right)^{-1}dr^2+r^2d\\Omega^2', vars:[['ds^2','spacetime interval'],['G','gravitational constant'],['M','mass'],['r','radial coordinate'],['c','speed of light'],['d\\Omega^2','solid-angle element, d\\theta^2+\\sin^2\\theta\\,d\\phi^2']],
 derivation:'The exact vacuum solution of Einstein\'s field equations outside a static, spherically symmetric, uncharged mass, found by Karl Schwarzschild in 1916.', assumptions:'Static, spherically symmetric, uncharged, non-rotating mass; vacuum region outside the mass.', units:'m² (or s², depending on convention)', example:'Setting the metric coefficient to zero defines the Schwarzschild radius r_s=2GM/c², the event horizon of a non-rotating black hole.'},
{id:'einstein_field_equations_rel', title:'Einstein Field Equations', category:'Relativity', eq:'G_{\\mu\\nu}=R_{\\mu\\nu}-\\frac12Rg_{\\mu\\nu}=\\frac{8\\pi G}{c^4}T_{\\mu\\nu}', vars:[['G_{\\mu\\nu}','Einstein tensor'],['R_{\\mu\\nu}','Ricci curvature tensor'],['R','Ricci scalar'],['g_{\\mu\\nu}','metric tensor'],['T_{\\mu\\nu}','stress-energy tensor']],
 derivation:'Constructed by Einstein to relate the curvature of spacetime directly to the local distribution of mass-energy and momentum, consistent with local energy-momentum conservation.', assumptions:'General relativity; classical (non-quantized) matter and geometry.', units:'m⁻² (curvature) on the left, matching units on the right via the coupling constant', example:'In the weak-field, low-velocity limit, these ten coupled nonlinear equations reduce to Newton\'s law of gravitation.'},
{id:'geodesic_equation_rel', title:'Geodesic Equation', category:'Relativity', eq:'\\frac{d^2x^\\mu}{d\\tau^2}+\\Gamma^\\mu_{\\alpha\\beta}\\frac{dx^\\alpha}{d\\tau}\\frac{dx^\\beta}{d\\tau}=0', vars:[['x^\\mu','spacetime coordinates'],['\\tau','proper time'],['\\Gamma^\\mu_{\\alpha\\beta}','Christoffel symbols (connection coefficients)']],
 derivation:'Follows from extremizing the proper-time path length between two spacetime events, or equivalently from parallel-transporting the four-velocity along itself.', assumptions:'Freely falling (non-accelerating, force-free) test particle; general relativity.', units:'consistent with inverse-length² units per term', example:'This equation describes how planets and light rays move through curved spacetime — gravity is reinterpreted as motion along geodesics, not a force.'},
{id:'perihelion_precession_gr', title:'Perihelion Precession (General Relativistic)', category:'Relativity', eq:'\\Delta\\phi=\\frac{6\\pi GM}{a(1-e^2)c^2}', vars:[['\\Delta\\phi','precession angle per orbit (rad)'],['G','gravitational constant'],['M','mass of the central body'],['a','orbital semi-major axis'],['e','orbital eccentricity'],['c','speed of light']],
 derivation:'Follows from solving the geodesic equation for a test particle in the Schwarzschild metric to first post-Newtonian order, beyond the pure inverse-square Newtonian orbit.', assumptions:'Weak-field, slow-orbit approximation; test particle orbiting a single dominant mass.', units:'radians per orbit', example:'This formula correctly predicts Mercury\'s anomalous perihelion precession of about 43 arcseconds per century — one of the first major confirmations of General Relativity.'},
{id:'gravitational_light_deflection', title:'Gravitational Light Deflection', category:'Relativity', eq:'\\delta\\phi=\\frac{4GM}{bc^2}', vars:[['\\delta\\phi','light deflection angle (rad)'],['G','gravitational constant'],['M','mass of the gravitating body'],['b','impact parameter (closest approach distance)'],['c','speed of light']],
 derivation:'Follows from solving the null-geodesic equation for a light ray in the Schwarzschild metric — notably exactly twice the (incorrect) Newtonian light-bending prediction.', assumptions:'Weak-field limit; light ray passing far outside the gravitating mass.', units:'radians', example:'Measured during the 1919 solar eclipse expedition led by Eddington, the deflection of starlight grazing the Sun (about 1.75 arcseconds) was the first major experimental confirmation of General Relativity.'},
{id:'shapiro_time_delay', title:'Shapiro Time Delay', category:'Relativity', eq:'\\Delta t=\\frac{4GM}{c^3}\\ln\\left(\\frac{4r_1r_2}{b^2}\\right)', vars:[['\\Delta t','extra light travel time delay'],['G','gravitational constant'],['M','mass of the gravitating body'],['r_1,r_2','distances from the mass to each endpoint of the light path'],['b','impact parameter'],['c','speed of light']],
 derivation:'Follows from integrating the coordinate light-travel time predicted by the Schwarzschild metric along a path passing near a massive body.', assumptions:'Weak-field limit; light path passing near but not through the gravitating mass.', units:'second (s)', example:'Radar signals bounced off Venus or Mercury, passing near the Sun, arrive measurably later than a flat-spacetime calculation predicts — a key test proposed by Irwin Shapiro in 1964.'},
{id:'hawking_temperature', title:'Hawking Temperature', category:'Relativity', eq:'T_H=\\frac{\\hbar c^3}{8\\pi GMk_B}', vars:[['T_H','Hawking temperature'],['\\hbar','reduced Planck constant'],['c','speed of light'],['G','gravitational constant'],['M','black hole mass'],['k_B','Boltzmann constant']],
 derivation:'Follows from a semiclassical quantum field theory calculation of particle pair production near a black hole\'s event horizon, combined with treating the black hole as a thermal blackbody emitter.', assumptions:'Semiclassical gravity (quantum fields on a fixed classical background); non-rotating, uncharged (Schwarzschild) black hole.', units:'kelvin (K)', example:'A solar-mass black hole has a Hawking temperature of only about 60 nanokelvin — far colder than the cosmic microwave background, so it currently absorbs far more than it emits.'},
{id:'bekenstein_hawking_entropy', title:'Bekenstein–Hawking Entropy', category:'Relativity', eq:'S_{BH}=\\frac{k_Bc^3A}{4G\\hbar}', vars:[['S_{BH}','black hole entropy'],['k_B','Boltzmann constant'],['c','speed of light'],['A','event horizon surface area'],['G','gravitational constant'],['\\hbar','reduced Planck constant']],
 derivation:'Derived by combining the classical area theorem for black hole horizons (which never decreases) with the thermodynamic identification of black holes as objects possessing both temperature and entropy.', assumptions:'Semiclassical gravity; applies to the total horizon area regardless of the black hole\'s detailed internal state.', units:'J/K', example:'A black hole\'s entropy scaling with horizon area rather than volume is a key clue underlying the holographic principle in theoretical physics.'},
{id:'lense_thirring_precession', title:'Lense–Thirring Precession (Frame Dragging)', category:'Relativity', eq:'\\Omega_{LT}=\\frac{2GJ}{c^2r^3}', vars:[['\\Omega_{LT}','frame-dragging precession rate'],['G','gravitational constant'],['J','angular momentum of the rotating central body'],['c','speed of light'],['r','radial distance']],
 derivation:'Follows from solving the linearized (weak-field) Einstein field equations for a slowly rotating mass, producing a gravitomagnetic field analogous to the magnetic field of a spinning charged sphere.', assumptions:'Weak-field, slow-rotation approximation.', units:'rad/s', example:'This frame-dragging effect was measured directly by the Gravity Probe B satellite, which detected gyroscopes precessing due to Earth\'s rotation exactly as General Relativity predicts.'},
{id:'gw_luminosity_binary', title:'Gravitational Wave Luminosity (Circular Binary)', category:'Relativity', eq:'L_{GW}=\\frac{32}{5}\\frac{G^4}{c^5}\\frac{(m_1m_2)^2(m_1+m_2)}{a^5}', vars:[['L_{GW}','gravitational wave power radiated'],['G','gravitational constant'],['c','speed of light'],['m_1,m_2','masses of the two orbiting bodies'],['a','orbital separation']],
 derivation:'Follows from the leading-order (quadrupole) approximation to the Einstein field equations applied to a binary system in a circular orbit.', assumptions:'Weak-field, slow-motion (post-Newtonian) approximation; circular orbit.', units:'watt (W)', example:'This formula predicts the orbital decay of binary pulsars like the Hulse–Taylor pulsar, whose observed inspiral rate matched General Relativity\'s prediction and earned the 1993 Nobel Prize in Physics.'},
{id:'kerr_horizon_radius', title:'Kerr Black Hole Horizon Radius', category:'Relativity', eq:'r_+=\\frac{GM}{c^2}+\\sqrt{\\left(\\frac{GM}{c^2}\\right)^2-a^2},\\quad a=\\frac{J}{Mc}', vars:[['r_+','outer event horizon radius'],['G','gravitational constant'],['M','black hole mass'],['c','speed of light'],['a','spin parameter (angular momentum per unit mass)'],['J','black hole angular momentum']],
 derivation:'Found by locating the outer root of the metric singularity in the Kerr solution to Einstein\'s field equations for a rotating, uncharged black hole.', assumptions:'Stationary, axisymmetric, uncharged rotating black hole (Kerr spacetime); requires a\\leq GM/c^2 for a horizon to exist.', units:'metre (m)', example:'A maximally spinning (extremal) black hole has a=GM/c², shrinking its horizon to exactly half the non-rotating Schwarzschild radius.'},
   
  {id:'bernoulli', title:"Bernoulli's Equation", category:'Fluid Mechanics', eq:'P+\\frac{1}{2}\\rho v^2+\\rho gh=\\text{const}', vars:[['P','pressure'],['\\rho','fluid density'],['v','flow speed'],['g','gravity'],['h','height']],

  {id:'reynolds', title:'Reynolds Number', category:'Fluid Mechanics', eq:'Re=\\frac{\\rho vL}{\\mu}', vars:[['\\rho','density'],['v','velocity'],['L','characteristic length'],['\\mu','dynamic viscosity']],

  {id:'arrhenius', title:'Arrhenius Equation', category:'Chemistry', eq:'k=Ae^{-E_a/RT}', vars:[['k','rate constant'],['A','pre-exponential factor'],['E_a','activation energy'],['R','gas constant'],['T','temperature']],

  {id:'kepler3', title:"Kepler's Third Law", category:'Astronomy', eq:'T^2=\\frac{4\\pi^2}{GM}a^3', vars:[['T','orbital period'],['G','gravitational constant'],['M','central mass'],['a','semi-major axis']],

  {id:'schwarzschild', title:'Schwarzschild Radius', category:'Astronomy', eq:'r_s=\\frac{2GM}{c^2}', vars:[['r_s','event horizon radius'],['G','gravitational constant'],['M','mass'],['c','speed of light']],
   derivation:'Derived from the Schwarzschild solution to Einstein\'s field equations for a spherically symmetric mass.', assumptions:'Non-rotating, uncharged (Schwarzschild) black hole.', units:'metre (m)', example:'The Schwarzschild radius of the Sun is about 3 km.'},
{id:'bohr_energy', title:'Bohr Model Energy Levels', category:'Atomic & Molecular Physics', eq:'E_n=-\\frac{m_ee^4}{8\\epsilon_0^2h^2n^2}=-\\frac{13.6\\ \\text{eV}}{n^2}', vars:[['E_n','energy of level n (J)'],['n','principal quantum number'],['m_e','electron mass'],['e','elementary charge']],
 derivation:'Balances the Coulomb attraction providing centripetal force against Bohr\'s postulate of quantized angular momentum, L=n\\hbar.', assumptions:'Hydrogen-like atom (single electron), circular orbits, non-relativistic.', units:'joule (J) or electronvolt (eV)', example:'The n=2 to n=1 transition in hydrogen releases 10.2 eV, the Lyman-alpha line.'},
{id:'bohr_radius_formula', title:'Bohr Radius (nth Orbit)', category:'Atomic & Molecular Physics', eq:'r_n=\\frac{4\\pi\\epsilon_0\\hbar^2n^2}{m_eZe^2}=\\frac{n^2}{Z}a_0', vars:[['r_n','orbital radius (m)'],['n','principal quantum number'],['Z','nuclear charge number'],['a_0','Bohr radius']],
 derivation:'Follows from setting the Coulomb force equal to the centripetal force required for a quantized circular orbit.', assumptions:'Hydrogen-like ion, circular Bohr orbit.', units:'metre (m)', example:'The n=2 orbit of hydrogen has a radius of 4a₀ ≈ 0.212 nm.'},
{id:'rydberg_formula', title:'Rydberg Formula (Spectral Lines)', category:'Atomic & Molecular Physics', eq:'\\frac{1}{\\lambda}=R_\\infty Z^2\\left(\\frac{1}{n_1^2}-\\frac{1}{n_2^2}\\right)', vars:[['\\lambda','emitted/absorbed wavelength (m)'],['R_\\infty','Rydberg constant'],['Z','nuclear charge number'],['n_1,n_2','initial/final principal quantum numbers']],

{id:'fine_structure_correction', title:'Fine-Structure Energy Correction', category:'Atomic & Molecular Physics', eq:'\\Delta E_{n,j}=E_n\\frac{\\alpha^2}{n^2}\\left(\\frac{n}{j+\\frac12}-\\frac34\\right)', vars:[['\\Delta E_{n,j}','fine-structure energy shift'],['\\alpha','fine-structure constant'],['n','principal quantum number'],['j','total angular momentum quantum number']],
 derivation:'Arises from relativistic kinetic-energy corrections and spin-orbit coupling treated via the Dirac equation or perturbation theory.', assumptions:'Hydrogen-like atom, weak relativistic/spin-orbit perturbation.', units:'joule (J) or eV', example:'Fine structure splits the hydrogen n=2 level by about 4.5×10⁻⁵ eV between j=1/2 and j=3/2.'},
{id:'selection_rule_e1', title:'Electric-Dipole Selection Rules', category:'Atomic & Molecular Physics', eq:'\\Delta l=\\pm1,\\quad \\Delta m_l=0,\\pm1', vars:[['\\Delta l','change in orbital angular momentum quantum number'],['\\Delta m_l','change in magnetic quantum number']],

{id:'term_symbol_energy', title:'Term Symbol Notation', category:'Atomic & Molecular Physics', eq:'^{2S+1}L_J', vars:[['S','total spin quantum number'],['L','total orbital angular momentum quantum number'],['J','total angular momentum quantum number']],
 derivation:'Follows from Russell–Saunders (LS) coupling, combining individual electron spins and orbital momenta into total S, L, then J.', assumptions:'LS (Russell–Saunders) coupling scheme, valid for light atoms.', units:'dimensionless (spectroscopic notation)', example:'The ground state of carbon is ³P₀, meaning S=1, L=1 (P), J=0.'},
{id:'rigid_rotor', title:'Rigid Rotor Rotational Energy', category:'Atomic & Molecular Physics', eq:'E_J=BJ(J+1),\\quad B=\\frac{\\hbar^2}{2I}', vars:[['E_J','rotational energy of level J'],['J','rotational quantum number'],['B','rotational constant'],['I','moment of inertia of the molecule']],
 derivation:'Solves the Schrödinger equation for a rigid diatomic molecule constrained to rotate about its center of mass.', assumptions:'Rigid, non-vibrating diatomic molecule (no centrifugal distortion).', units:'joule (J), or often expressed as B in cm⁻¹', example:'The CO molecule has B ≈ 1.93 cm⁻¹, giving a J=1→0 rotational transition near 115 GHz.'},
{id:'harmonic_vibration', title:'Molecular Vibrational Energy (Harmonic Oscillator)', category:'Atomic & Molecular Physics', eq:'E_v=\\hbar\\omega\\left(v+\\frac12\\right)', vars:[['E_v','vibrational energy of level v'],['v','vibrational quantum number'],['\\omega','angular vibrational frequency']],

{id:'morse_potential', title:'Morse Potential', category:'Atomic & Molecular Physics', eq:'V(r)=D_e\\left[1-e^{-a(r-r_e)}\\right]^2', vars:[['V(r)','potential energy at bond length r'],['D_e','dissociation energy from the potential minimum'],['a','width parameter'],['r_e','equilibrium bond length']],
 derivation:'An empirical anharmonic potential chosen because its Schrödinger equation is exactly solvable and it correctly allows bond dissociation.', assumptions:'Diatomic molecule; captures anharmonicity better than the harmonic approximation but is still an approximate model.', units:'joule (J)', example:'For H₂, D_e ≈ 4.75 eV, giving accurate vibrational spacing near the potential minimum but with anharmonic narrowing at high v.'},
{id:'franck_condon', title:'Franck–Condon Factor', category:'Atomic & Molecular Physics', eq:'q_{v^\\prime v^{\\prime\\prime}}=\\left|\\langle\\psi_{v^\\prime}|\\psi_{v^{\\prime\\prime}}\\rangle\\right|^2', vars:[['q_{v^\\prime v^{\\prime\\prime}}','transition intensity factor'],['\\psi_{v^\\prime}','vibrational wavefunction of the excited electronic state'],['\\psi_{v^{\\prime\\prime}}','vibrational wavefunction of the ground electronic state']],
 derivation:'Follows from the Born–Oppenheimer approximation and the Franck–Condon principle: electronic transitions occur much faster than nuclear motion.', assumptions:'Born–Oppenheimer separation of electronic and nuclear motion; vertical transitions.', units:'dimensionless (probability factor, 0 to 1)', example:'Franck–Condon factors explain the characteristic vibrational progressions seen in molecular electronic absorption/emission spectra.'},
{id:'zeeman_effect', title:'Zeeman Splitting (Weak Field)', category:'Atomic & Molecular Physics', eq:'\\Delta E=g_J\\mu_BBm_J', vars:[['\\Delta E','energy shift (J)'],['g_J','Landé g-factor'],['\\mu_B','Bohr magneton'],['B','magnetic field strength (T)'],['m_J','magnetic quantum number']],

{id:'stark_effect_linear', title:'Linear Stark Effect (Hydrogen)', category:'Atomic & Molecular Physics', eq:'\\Delta E=\\frac32n(n_1-n_2)ea_0F', vars:[['\\Delta E','energy shift (J)'],['n','principal quantum number'],['n_1,n_2','parabolic quantum numbers'],['a_0','Bohr radius'],['F','applied electric field strength']],

{id:'hyperfine_splitting', title:'Hyperfine Splitting Energy', category:'Atomic & Molecular Physics', eq:'E_{HF}=\\frac{A}{2}\\left[F(F+1)-I(I+1)-J(J+1)\\right]', vars:[['E_{HF}','hyperfine energy shift (J)'],['A','hyperfine coupling constant'],['F','total atomic angular momentum quantum number, F=I+J'],['I','nuclear spin quantum number'],['J','total electronic angular momentum quantum number']],

{id:'spin_orbit_coupling', title:'Spin–Orbit Coupling Energy', category:'Atomic & Molecular Physics', eq:'E_{SO}=\\frac{a}{2}\\left[J(J+1)-L(L+1)-S(S+1)\\right]', vars:[['E_{SO}','spin-orbit energy shift (J)'],['a','spin-orbit coupling constant'],['J','total angular momentum quantum number'],['L','orbital angular momentum quantum number'],['S','spin angular momentum quantum number']],
 derivation:'Follows from the expectation value of the \\xi(r)\\,\\vec L\\cdot\\vec S interaction operator, using \\vec L\\cdot\\vec S=\\frac12[J(J+1)-L(L+1)-S(S+1)]\\hbar^2.', assumptions:'Single valence electron; LS (Russell–Saunders) coupling regime; first-order perturbation theory.', units:'joule (J) or eV', example:'Spin-orbit coupling splits the sodium 3p level into the two components responsible for the famous yellow D1 and D2 spectral lines.'},
{id:'lande_g_factor', title:'Landé g-Factor', category:'Atomic & Molecular Physics', eq:'g_J=1+\\frac{J(J+1)+S(S+1)-L(L+1)}{2J(J+1)}', vars:[['g_J','Landé g-factor (dimensionless)'],['J','total angular momentum quantum number'],['S','spin angular momentum quantum number'],['L','orbital angular momentum quantum number']],
 derivation:'Derived by projecting the separate orbital and spin magnetic moments (with their different g-factors) onto the direction of the total angular momentum J using the vector model of the atom.', assumptions:'LS (Russell–Saunders) coupling regime; weak external field so J remains a good quantum number.', units:'dimensionless', example:'For a pure spin state (L=0, S=\\tfrac12, J=\\tfrac12), g_J=2, matching the free electron spin g-factor.'},
{id:'lande_interval_rule', title:'Landé Interval Rule', category:'Atomic & Molecular Physics', eq:'E_J-E_{J-1}=aJ', vars:[['E_J-E_{J-1}','energy spacing between adjacent fine-structure levels'],['a','spin-orbit coupling constant'],['J','total angular momentum quantum number of the upper level']],
 derivation:'Follows directly from the spin-orbit coupling energy formula: differencing E_J and E_{J-1} within the same L-S term causes most terms to cancel, leaving a spacing proportional to J.', assumptions:'LS coupling; a is the same coupling constant across the whole multiplet.', units:'joule (J) or eV', example:'Verifying that spacings within a spectral multiplet scale linearly with J is a standard experimental check for LS coupling.'},
{id:'quantum_defect_formula', title:'Quantum Defect (Rydberg) Formula', category:'Atomic & Molecular Physics', eq:'E_{n,l}=-\\frac{\\text{Ry}}{(n-\\delta_l)^2}', vars:[['E_{n,l}','energy of the valence electron level (J)'],['\\text{Ry}','Rydberg energy'],['n','principal quantum number'],['\\delta_l','quantum defect, depending on orbital angular momentum l']],
 derivation:'An empirical modification of the hydrogenic energy formula, replacing n with an effective quantum number n-\\delta_l to account for the valence electron partially penetrating the ionic core in alkali-like atoms.', assumptions:'Single valence electron outside a closed-shell ionic core (alkali-like atom); \\delta_l roughly constant across an l-series.', units:'joule (J) or eV', example:'Sodium\'s 3s quantum defect is large (\\delta\\approx1.35) because the s-electron penetrates the core strongly, while its d-electron defect (\\delta\\approx0.01) is nearly hydrogenic.'},
{id:'natural_linewidth', title:'Natural Linewidth', category:'Atomic & Molecular Physics', eq:'\\Delta\\nu_{nat}=\\frac{1}{2\\pi\\tau}', vars:[['\\Delta\\nu_{nat}','natural (Lorentzian) linewidth, FWHM (Hz)'],['\\tau','excited-state lifetime (s)']],
 derivation:'Follows from the energy-time uncertainty relation applied to a state with a finite lifetime, giving an exponentially decaying amplitude and hence a Lorentzian line shape.', assumptions:'Single exponential decay channel; no collisional, Doppler, or power broadening included.', units:'hertz (Hz)', example:'A 10 ns excited-state lifetime corresponds to a natural linewidth of about 16 MHz.'},
{id:'doppler_broadening', title:'Doppler Broadening of a Spectral Line', category:'Atomic & Molecular Physics', eq:'\\Delta\\nu_D=\\nu_0\\sqrt{\\frac{8k_BT\\ln2}{mc^2}}', vars:[['\\Delta\\nu_D','Doppler linewidth, FWHM (Hz)'],['\\nu_0','unperturbed transition frequency'],['k_B','Boltzmann constant'],['T','gas temperature (K)'],['m','mass of the emitting/absorbing atom']],
 derivation:'Convolves the natural transition frequency with the Maxwell–Boltzmann velocity distribution of the atoms, producing a Gaussian-broadened line profile.', assumptions:'Thermal equilibrium (Maxwell–Boltzmann velocity distribution); non-relativistic thermal speeds.', units:'hertz (Hz)', example:'Sodium vapor at a few hundred kelvin has a Doppler width of order 1 GHz for the D-lines, typically far exceeding the natural linewidth.'},
{id:'einstein_ab_relation', title:'Einstein A–B Coefficient Relation', category:'Atomic & Molecular Physics', eq:'A_{21}=\\frac{8\\pi h\\nu^3}{c^3}B_{21}', vars:[['A_{21}','spontaneous emission rate (s⁻¹)'],['B_{21}','stimulated emission coefficient'],['h','Planck constant'],['\\nu','transition frequency'],['c','speed of light']],
 derivation:'Derived by requiring detailed balance between absorption, stimulated emission, and spontaneous emission for two-level atoms in thermal equilibrium with blackbody radiation.', assumptions:'Two-level atomic system; thermal equilibrium with an ideal blackbody radiation field.', units:'s⁻¹ (for A_{21}, given B_{21} in matching units)', example:'The strong \\nu^3 scaling explains why spontaneous emission dominates at optical frequencies, while stimulated processes dominate at microwave frequencies, motivating the maser before the laser.'},
{id:'trk_sum_rule', title:'Thomas–Reiche–Kuhn Sum Rule', category:'Atomic & Molecular Physics', eq:'\\sum_kf_{0k}=Z', vars:[['f_{0k}','oscillator strength of the transition from the ground state to state k'],['Z','number of electrons in the atom']],
 derivation:'Follows from the canonical commutation relation [\\hat x,\\hat p]=i\\hbar summed over a complete set of atomic eigenstates using closure.', assumptions:'Complete set of atomic states; non-relativistic quantum mechanics.', units:'dimensionless', example:'For a one-electron atom like hydrogen (Z=1), the oscillator strengths of all allowed transitions out of the ground state sum to exactly 1.'},
{id:'saha_ionization', title:'Saha Ionization Equation', category:'Atomic & Molecular Physics', eq:'\\frac{n_{i+1}n_e}{n_i}=\\frac{2g_{i+1}}{g_i}\\left(\\frac{2\\pi m_ek_BT}{h^2}\\right)^{3/2}e^{-\\chi_i/k_BT}', vars:[['n_{i+1},n_i','number densities of the (i+1)-times and i-times ionized species'],['n_e','electron number density'],['g_{i+1},g_i','statistical weights of the two ionization states'],['\\chi_i','ionization energy from stage i to i+1']],
 derivation:'Combines the Boltzmann distribution with quantum statistical mechanics for the free-electron phase space to describe an ionization-recombination equilibrium.', assumptions:'Local thermodynamic equilibrium (LTE); classical, non-degenerate electron gas.', units:'m⁻³ (each side)', example:'The Saha equation explains why stellar spectral classification (O, B, A, F, G, K, M) tracks photospheric temperature so tightly.'},
{id:'isotope_shift_mass', title:'Isotope Shift (Normal Mass Shift)', category:'Atomic & Molecular Physics', eq:'\\Delta E_{iso}\\approx E_n\\left(\\frac{m_e}{M_1}-\\frac{m_e}{M_2}\\right)', vars:[['\\Delta E_{iso}','energy shift between the two isotopes\' spectral lines'],['E_n','unshifted (infinite-mass) transition energy'],['M_1,M_2','nuclear masses of the two isotopes']],
 derivation:'Arises from replacing the electron mass with the two-body reduced mass \\mu=m_eM/(m_e+M) in the hydrogenic energy formula, then comparing the result for two different nuclear masses.', assumptions:'Hydrogen-like or single-valence-electron atom; leading-order (normal) mass shift only, neglecting the specific mass shift from electron correlation.', units:'joule (J) or eV', example:'The isotope shift between hydrogen and deuterium spectral lines was decisive evidence confirming deuterium\'s discovery in 1932.'},
{id:'reduced_mass_bohr', title:'Reduced Mass Correction (Two-Body Bohr Model)', category:'Atomic & Molecular Physics', eq:'E_n=-\\frac{\\mu e^4}{8\\epsilon_0^2h^2n^2},\\quad \\mu=\\frac{m_eM}{m_e+M}', vars:[['E_n','energy of level n, corrected for nuclear recoil (J)'],['\\mu','reduced mass of the electron-nucleus system'],['m_e','electron mass'],['M','nuclear mass'],['n','principal quantum number']],
 derivation:'Replaces the electron mass in the one-body Bohr formula with the two-body reduced mass, exactly accounting for the finite (rather than infinite) nuclear mass.', assumptions:'Two-body Coulomb problem reduced to an equivalent one-body problem via the reduced mass; non-relativistic.', units:'joule (J) or eV', example:'Using the reduced mass instead of the bare electron mass shifts hydrogen\'s Rydberg energy by about one part in 1836 — small, but readily measurable spectroscopically.'},
{id:'lamb_shift', title:'Lamb Shift (QED Correction)', category:'Atomic & Molecular Physics', eq:'\\Delta E_{Lamb}\\propto\\alpha^5m_ec^2\\ln\\left(\\frac{1}{\\alpha}\\right)', vars:[['\\Delta E_{Lamb}','energy splitting between the hydrogen 2s_{1/2} and 2p_{1/2} levels'],['\\alpha','fine-structure constant'],['m_e','electron mass'],['c','speed of light']],
 derivation:'Arises from higher-order QED effects — electron self-energy and vacuum polarization — absent from the Dirac equation, which alone predicts these two levels to be exactly degenerate.', assumptions:'Order-of-magnitude scaling relation; the precise value requires full renormalized QED perturbation theory.', units:'joule (J) or eV, commonly quoted as a frequency (~1057 MHz for hydrogen 2s–2p)', example:'The 1947 measurement of the Lamb shift by Willis Lamb and Robert Retherford was pivotal in motivating the development of modern quantum electrodynamics.'},
{id:'anharmonic_vibrational_levels', title:'Anharmonic Vibrational Energy Levels (Morse Oscillator)', category:'Atomic & Molecular Physics', eq:'E_v=\\hbar\\omega_e\\left(v+\\frac12\\right)-\\hbar\\omega_ex_e\\left(v+\\frac12\\right)^2', vars:[['E_v','vibrational energy of level v'],['\\omega_e','harmonic vibrational frequency'],['x_e','anharmonicity constant (dimensionless)'],['v','vibrational quantum number']],
 derivation:'Solves the Schrödinger equation for the Morse potential exactly, yielding eigenvalues that include a quadratic anharmonic correction beyond the simple harmonic-oscillator spectrum.', assumptions:'Morse-potential diatomic molecule; expansion breaks down as v approaches the dissociation limit.', units:'joule (J), commonly expressed in wavenumbers (cm⁻¹)', example:'Unlike the harmonic oscillator, Morse energy levels converge as v increases, correctly predicting that a real molecule eventually dissociates.'},
{id:'centrifugal_distortion', title:'Centrifugal Distortion Correction', category:'Atomic & Molecular Physics', eq:'E_J=BJ(J+1)-DJ^2(J+1)^2', vars:[['E_J','rotational energy of level J, corrected for bond stretching'],['B','rotational constant'],['D','centrifugal distortion constant'],['J','rotational quantum number']],
 derivation:'Perturbatively corrects the rigid-rotor energy for the fact that a real molecular bond stretches slightly under the centrifugal force generated by rotation.', assumptions:'Small distortion (D \\ll B); a non-rigid, harmonically stretchable bond.', units:'joule (J), commonly expressed in wavenumbers (cm⁻¹)', example:'The centrifugal correction grows increasingly important at high J, where fast rotation measurably stretches the bond and lowers the energy relative to the rigid-rotor prediction.'},
{id:'rovibrational_coupling', title:'Vibration–Rotation Coupling (Rovibrational Constant)', category:'Atomic & Molecular Physics', eq:'B_v=B_e-\\alpha_e\\left(v+\\frac12\\right)', vars:[['B_v','effective rotational constant in vibrational level v'],['B_e','equilibrium rotational constant'],['\\alpha_e','vibration-rotation coupling constant'],['v','vibrational quantum number']],
 derivation:'Accounts for the fact that the average bond length — and hence the moment of inertia — increases slightly with vibrational excitation because of the anharmonicity of the real molecular potential.', assumptions:'Small coupling (\\alpha_e\\ll B_e); Morse-like anharmonic potential.', units:'same units as B_e, commonly cm⁻¹', example:'This coupling produces the characteristic band structure seen in high-resolution infrared rovibrational spectra of diatomic molecules like HCl.'},
{id:'paschen_back_effect', title:'Paschen–Back Effect (Strong-Field Limit)', category:'Atomic & Molecular Physics', eq:'\\Delta E=\\mu_BB(m_l+2m_s)', vars:[['\\Delta E','energy shift in a strong external field (J)'],['\\mu_B','Bohr magneton'],['B','external magnetic field strength (T)'],['m_l,m_s','orbital and spin magnetic quantum numbers']],
 derivation:'In the strong-field limit, the external field decouples L and S so they no longer combine into a well-defined J; their magnetic moments then interact independently and additively with the field.', assumptions:'Magnetic field strong enough that the Zeeman energy exceeds the spin-orbit coupling energy — the opposite limit from the weak-field (anomalous) Zeeman effect.', units:'joule (J)', example:'The Paschen–Back effect simplifies what would otherwise be a complicated anomalous Zeeman pattern into a simpler triplet-like structure, since L and S precess essentially independently about the strong field.'},
 /* ---- Added batch: Atomic & Molecular Physics (extended II) ---- */
{id:'ac_stark_shift', title:'AC/DC Stark Shift (Quadratic, Polarizability)', category:'Atomic & Molecular Physics', eq:'\\Delta E=-\\frac12\\alpha_0E^2', vars:[['\\Delta E','energy shift (J)'],['\\alpha_0','static (or dynamic) electric polarizability'],['E','applied electric field amplitude (V/m)']],
 derivation:'Second-order perturbation theory result for an atomic state with no permanent dipole moment, giving an energy shift quadratic in the applied field, unlike hydrogen\'s special linear Stark effect.', assumptions:'Non-degenerate atomic state (or non-hydrogenic atom) with zero permanent dipole moment; field weak enough for perturbation theory.', units:'joule (J)', example:'Alkali-atom Stark shifts used in optical dipole traps and atomic-clock light shifts are quadratic in field strength, in contrast to hydrogen\'s anomalous linear Stark effect.'},
{id:'breit_rabi_formula', title:'Breit–Rabi Formula', category:'Atomic & Molecular Physics', eq:'E_{F,m_F}=-\\frac{\\Delta E_{hfs}}{2(2I+1)}+g_I\\mu_Nm_FB\\pm\\frac{\\Delta E_{hfs}}{2}\\sqrt{1+\\frac{4m_Fx}{2I+1}+x^2}', vars:[['E_{F,m_F}','energy level as a function of magnetic field'],['\\Delta E_{hfs}','zero-field hyperfine splitting'],['I','nuclear spin quantum number'],['g_I','nuclear g-factor'],['x','dimensionless field parameter, x=(g_J\\mu_B+g_I\\mu_N)B/\\Delta E_{hfs}']],
 derivation:'Exact diagonalization of the combined hyperfine and Zeeman Hamiltonian for a J=1/2 atomic ground state in an external magnetic field, smoothly interpolating between the weak-field (Zeeman) and strong-field (Paschen–Back) limits.', assumptions:'Valid for J=1/2 ground states (e.g. alkali atoms); arbitrary magnetic field strength.', units:'joule (J)', example:'The Breit–Rabi formula is used to locate the field-insensitive "magic field" clock transition in cesium and rubidium atomic clocks.'},
{id:'photon_recoil_energy', title:'Photon Recoil Energy', category:'Atomic & Molecular Physics', eq:'E_r=\\frac{\\hbar^2k^2}{2m}', vars:[['E_r','recoil kinetic energy (J)'],['\\hbar k','photon momentum'],['m','atomic mass']],
 derivation:'Follows from conservation of momentum when an atom absorbs or emits a single photon, converting the photon\'s momentum ℏk into atomic recoil kinetic energy.', assumptions:'Single photon absorption/emission event; atom essentially at rest beforehand.', units:'joule (J)', example:'Cesium\'s recoil energy from a resonant 852 nm photon is only about 2×10⁻¹¹ eV, yet it sets a fundamental limit in laser cooling and atom interferometry.'},
{id:'doppler_cooling_limit', title:'Doppler Cooling Limit', category:'Atomic & Molecular Physics', eq:'T_D=\\frac{\\hbar\\Gamma}{2k_B}', vars:[['T_D','minimum Doppler-cooling temperature (K)'],['\\hbar\\Gamma','natural linewidth in energy units'],['k_B','Boltzmann constant']],
 derivation:'Balances the velocity-dependent Doppler cooling force against the random heating from spontaneous-emission recoil, minimized over laser detuning.', assumptions:'Two-level atom; red-detuned optical molasses; recoil-limited regime (sub-Doppler mechanisms not included).', units:'kelvin (K)', example:'For rubidium-87 (Γ/2π≈6 MHz), the Doppler limit is about 146 µK, though sub-Doppler techniques routinely cool well below this.'},
{id:'van_der_waals_c6', title:'Van der Waals Interaction (C₆ Coefficient)', category:'Atomic & Molecular Physics', eq:'U(R)=-\\frac{C_6}{R^6}', vars:[['U(R)','interaction potential energy between two atoms'],['C_6','dispersion coefficient'],['R','interatomic separation']],
 derivation:'Arises from second-order perturbation theory treating the instantaneous dipole–induced-dipole interaction between two atoms, summed over all virtual excited-state pairs.', assumptions:'Large separation R (much greater than atomic size, so a multipole expansion is valid); non-retarded (short-range) regime.', units:'joule (J)', example:'C₆ coefficients set the blockade radius in Rydberg-atom quantum computing platforms, since C₆ scales roughly as n¹¹ for highly excited Rydberg states.'},
{id:'rydberg_lifetime_scaling', title:'Rydberg Atom Radiative Lifetime Scaling', category:'Atomic & Molecular Physics', eq:'\\tau_n\\propto n^3', vars:[['\\tau_n','radiative lifetime of a Rydberg state'],['n','principal quantum number']],
 derivation:'Follows from combining the n-scaling of the dipole matrix element with the transition-frequency dependence in the Einstein A-coefficient formula for high-n hydrogenic states.', assumptions:'High-n hydrogenic (Rydberg) states; low orbital angular momentum l — circular (maximal-l) states instead scale closer to n⁵.', units:'dimensionless (scaling law)', example:'A Rydberg atom with n=50 has a radiative lifetime thousands of times longer than the same atom\'s low-lying excited states, useful for quantum information storage.'},
{id:'rydberg_polarizability_scaling', title:'Rydberg Atom Polarizability Scaling', category:'Atomic & Molecular Physics', eq:'\\alpha_0\\propto n^7', vars:[['\\alpha_0','static electric polarizability'],['n','principal quantum number']],
 derivation:'Follows from the n⁴ scaling of the Rydberg electron\'s orbital size combined with the n⁻³-scaled energy denominators appearing in second-order perturbation theory for the induced dipole response.', assumptions:'High-n hydrogenic Rydberg state; a scaling law rather than an exact numerical formula.', units:'dimensionless (scaling law)', example:'This extreme n⁷ sensitivity is why Rydberg atoms make exceptional electric-field sensors, used in precision microwave and terahertz metrology.'},
{id:'symmetric_top_energy', title:'Symmetric Top Rotational Energy', category:'Atomic & Molecular Physics', eq:'E_{J,K}=BJ(J+1)+(A-B)K^2', vars:[['E_{J,K}','rotational energy level'],['B','rotational constant about the two equal axes'],['A','rotational constant about the symmetry axis'],['J','total rotational quantum number'],['K','projection of J onto the symmetry axis, -J\\leq K\\leq J']],
 derivation:'Solves the rigid-rotor Schrödinger equation for a symmetric top (two equal principal moments of inertia), which factors cleanly into J and K quantum numbers due to the extra rotational symmetry.', assumptions:'Rigid symmetric-top molecule with exactly two equal principal moments of inertia.', units:'joule (J), commonly expressed in wavenumbers (cm⁻¹)', example:'Ammonia (NH₃) is a classic symmetric top whose rotational spectrum is analyzed with this formula, including the K-dependent splitting from its symmetry axis.'},
{id:'dissociation_energy_relation', title:'Dissociation Energy Relation (D₀ vs Dₑ)', category:'Atomic & Molecular Physics', eq:'D_0=D_e-\\frac12\\hbar\\omega_e', vars:[['D_0','dissociation energy measured from the ground vibrational level'],['D_e','dissociation energy measured from the potential minimum'],['\\hbar\\omega_e','zero-point vibrational energy']],
 derivation:'Accounts for the fact that a real molecule\'s lowest observable vibrational level (v=0) lies above the classical potential minimum by the zero-point energy, so less energy than the full well depth is needed to dissociate it.', assumptions:'Harmonic approximation for the zero-point energy correction.', units:'joule (J), commonly expressed in eV or cm⁻¹', example:'For H₂, D_e≈4.75 eV but the unusually large zero-point energy (~0.27 eV, due to hydrogen\'s light mass) gives D_0≈4.48 eV.'},
{id:'nuclear_quadrupole_interaction', title:'Nuclear Electric Quadrupole Interaction Energy', category:'Atomic & Molecular Physics', eq:'E_Q=\\frac{eQV_{zz}}{4I(2I-1)}\\left[3m_I^2-I(I+1)\\right]', vars:[['E_Q','quadrupole hyperfine energy shift'],['eQ','nuclear electric quadrupole moment'],['V_{zz}','electric field gradient at the nucleus'],['I','nuclear spin quantum number'],['m_I','nuclear magnetic quantum number']],
 derivation:'Follows from the electrostatic interaction between the nuclear charge quadrupole moment and the gradient of the electric field produced by the surrounding electrons, treated in first-order perturbation theory.', assumptions:'Nuclear spin I≥1 (a nucleus with I<1 has no quadrupole moment); axially symmetric field gradient assumed in this simplified form.', units:'joule (J)', example:'Nuclear quadrupole coupling adds extra hyperfine splitting in atoms/molecules with nuclei like ³⁵Cl or ¹⁴N, and underlies nuclear quadrupole resonance (NQR) spectroscopy.'},
{id:'oscillator_strength_definition', title:'Absorption Oscillator Strength', category:'Atomic & Molecular Physics', eq:'f_{ik}=\\frac{2m_e\\omega_{ik}}{3\\hbar}\\left|\\langle k|\\hat x|i\\rangle\\right|^2', vars:[['f_{ik}','dimensionless oscillator strength'],['m_e','electron mass'],['\\omega_{ik}','transition angular frequency'],['\\langle k|\\hat x|i\\rangle','electric-dipole matrix element']],
 derivation:'Defined so that a classical electron oscillator with this fractional "strength" reproduces the same absorption cross section as the actual quantum-mechanical transition, by matching quantum dipole transition rates to the classical Lorentz oscillator model.', assumptions:'Electric-dipole approximation; a single, well-defined transition between states i and k.', units:'dimensionless', example:'Strongly allowed atomic transitions typically have f close to 1, while forbidden or weak transitions have f≪1, consistent with the Thomas–Reiche–Kuhn sum rule.'},
{id:'resonant_scattering_cross_section', title:'Resonant Scattering Cross Section (Two-Level Atom)', category:'Atomic & Molecular Physics', eq:'\\sigma_0=\\frac{3\\lambda^2}{2\\pi}', vars:[['\\sigma_0','peak resonant scattering cross section'],['\\lambda','transition wavelength']],
 derivation:'Follows from expressing the maximum quantum-mechanical scattering cross section of a closed two-level atom on resonance, in the low-saturation limit, purely in terms of the transition wavelength.', assumptions:'Closed two-level atom; exactly on resonance (zero detuning); low saturation intensity (unsaturated regime).', units:'m² (or cm²)', example:'This is the largest cross section any atom can present to resonant light, a key benchmark for laser cooling and atom–photon coupling efficiency.'},
{id:'autler_townes_splitting', title:'Autler–Townes Splitting', category:'Atomic & Molecular Physics', eq:'\\Delta\\omega_{AT}=\\sqrt{\\Omega^2+\\delta^2}', vars:[['\\Delta\\omega_{AT}','splitting between the two dressed-state resonances'],['\\Omega','Rabi frequency of the strong coupling (dressing) field'],['\\delta','detuning of the dressing field from resonance']],
 derivation:'Follows from diagonalizing the atom-field Hamiltonian in the dressed-atom picture for a strong, coherent (near-)resonant coupling field.', assumptions:'Coherent, resonant or near-resonant strong driving field; rotating-wave approximation.', units:'rad/s', example:'Autler–Townes splitting is a hallmark signature of strong atom–light coupling, closely related to electromagnetically induced transparency (EIT) experiments.'},
{id:'voigt_profile_fwhm', title:'Voigt Profile FWHM (Approximation)', category:'Atomic & Molecular Physics', eq:'\\Delta\\nu_V\\approx0.5346\\,\\Delta\\nu_L+\\sqrt{0.2166\\,\\Delta\\nu_L^2+\\Delta\\nu_D^2}', vars:[['\\Delta\\nu_V','approximate Voigt profile full width at half maximum'],['\\Delta\\nu_L','Lorentzian (natural + collisional) FWHM'],['\\Delta\\nu_D','Gaussian (Doppler) FWHM']],
 derivation:'An empirical approximation (Olivero–Longbothum) to the FWHM of the convolution of a Lorentzian and a Gaussian profile, since no exact closed form exists for the Voigt FWHM.', assumptions:'Both component profiles are well characterized by their individual FWHM values; the approximation is accurate to better than about 0.02%.', units:'hertz (Hz)', example:'Real atomic spectral lines are usually Voigt profiles, combining Doppler (Gaussian) broadening from thermal motion with natural and pressure (Lorentzian) broadening.'},
{id:'ortho_para_statistical_weight', title:'Ortho/Para Hydrogen Statistical Weight Ratio', category:'Atomic & Molecular Physics', eq:'\\frac{g_{ortho}}{g_{para}}=3', vars:[['g_{ortho}','statistical weight of ortho-hydrogen (nuclear spin triplet, I=1)'],['g_{para}','statistical weight of para-hydrogen (nuclear spin singlet, I=0)']],
 derivation:'Follows from the Pauli exclusion principle requiring the total wavefunction of the two identical, spin-1/2 hydrogen nuclei to be antisymmetric under exchange, correlating allowed rotational J values with the nuclear-spin state.', assumptions:'Homonuclear diatomic molecule with identical spin-1/2 nuclei (H₂); ground electronic and vibrational state.', units:'dimensionless (ratio)', example:'This 3:1 ortho:para ratio is why room-temperature hydrogen gas is about 75% ortho-hydrogen, and why converting it to para-hydrogen typically requires a spin-flip catalyst.'},
{id:'quantum_beat_frequency', title:'Quantum Beat Frequency', category:'Atomic & Molecular Physics', eq:'\\omega_{beat}=\\frac{|E_1-E_2|}{\\hbar}', vars:[['\\omega_{beat}','observed quantum beat angular frequency'],['E_1,E_2','energies of the two coherently excited levels']],
 derivation:'Follows from the time evolution of a coherent superposition of two closely spaced energy eigenstates, whose interference in the emitted fluorescence oscillates at their difference frequency.', assumptions:'Coherent excitation of both levels (e.g. by a broadband short pulse); the two levels share a common lower or upper state for the emitted light to interfere.', units:'rad/s', example:'Quantum beat spectroscopy uses this effect to measure fine or hyperfine splittings too small to resolve directly in the frequency domain, by observing the beat period in the time domain instead.'},
 
{id:'bloch_theorem', title:"Bloch's Theorem", category:'Solid State Physics', eq:'\\psi_k(\\mathbf r)=e^{i\\mathbf k\\cdot\\mathbf r}u_k(\\mathbf r)', vars:[['\\psi_k(\\mathbf r)','electron wavefunction'],['\\mathbf k','crystal momentum wavevector'],['u_k(\\mathbf r)','function with the periodicity of the lattice']],
 derivation:'Follows from the translational symmetry of a periodic crystal potential and the properties of commuting translation operators.', assumptions:'Perfectly periodic crystal lattice, single-electron approximation.', units:'dimensionless (wavefunction, normalized separately)', example:'Bloch\'s theorem is the starting point for essentially all band-structure calculations in solid state physics.'},
{id:'fermi_energy_free_electron', title:'Fermi Energy (Free Electron Gas)', category:'Solid State Physics', eq:'E_F=\\frac{\\hbar^2}{2m}(3\\pi^2n)^{2/3}', vars:[['E_F','Fermi energy'],['m','electron mass'],['n','electron number density']],
 derivation:'Fills the free-electron energy states (a parabolic dispersion) up to the highest occupied level at absolute zero, using the 3D density of states.', assumptions:'Non-interacting free-electron (Sommerfeld) model, T=0 K.', units:'joule (J) or electronvolt (eV)', example:'Copper has a Fermi energy of about 7 eV, corresponding to a Fermi velocity near 1.6×10⁶ m/s.'},
{id:'density_of_states_3d', title:'3D Free-Electron Density of States', category:'Solid State Physics', eq:'g(E)=\\frac{1}{2\\pi^2}\\left(\\frac{2m}{\\hbar^2}\\right)^{3/2}\\sqrt{E}', vars:[['g(E)','density of states per unit volume per unit energy'],['m','electron mass'],['E','energy']],
 derivation:'Counts allowed k-states in a spherical shell in k-space for a free-electron parabolic dispersion, converted to an energy density.', assumptions:'Free-electron (parabolic) dispersion in three dimensions.', units:'J⁻¹·m⁻³', example:'The square-root energy dependence of g(E) is a hallmark of 3D free-electron systems, contrasting with the constant DOS of 2D systems.'},
{id:'fermi_dirac_dist', title:'Fermi–Dirac Distribution', category:'Solid State Physics', eq:'f(E)=\\frac{1}{e^{(E-\\mu)/k_BT}+1}', vars:[['f(E)','occupation probability of a state at energy E'],['\\mu','chemical potential (Fermi level at T=0)'],['k_B','Boltzmann constant'],['T','temperature']],
 derivation:'Derived from Fermi–Dirac quantum statistics for indistinguishable fermions obeying the Pauli exclusion principle.', assumptions:'Non-interacting fermions in thermal equilibrium.', units:'dimensionless (probability, 0 to 1)', example:'At T=0, f(E) is a sharp step function; at finite T, thermal smearing occurs over roughly ±k_BT around the Fermi level.'},
