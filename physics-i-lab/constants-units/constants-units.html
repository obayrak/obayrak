 derivation:'Follows from assuming a constant probability per unit path length that a photon is removed from the beam by absorption or scattering, giving an exponential decay in intensity.', assumptions:'Narrow-beam (good) geometry; monoenergetic photons; homogeneous absorbing material.', units:'same units as I_0 (intensity)', example:'Shielding design for reactors and medical imaging relies on this law, along with tabulated attenuation coefficients for different materials and photon energies.'},
{id:'radiation_intensity_inverse_square', title:'Inverse-Square Law for Radiation Intensity', category:'Nuclear Physics', eq:'I=\\frac{A}{4\\pi r^2}', vars:[['I','radiation intensity or flux at distance r'],['A','source activity or emission rate'],['r','distance from the point source']],
 derivation:'Follows from conservation of the total number of emitted particles or photons spreading isotropically over an expanding spherical surface of area 4πr².', assumptions:'Point source; isotropic emission; no absorption or scattering along the path (vacuum or thin medium).', units:'particles or photons per unit area per unit time', example:'Doubling your distance from a point radioactive source cuts the received radiation intensity to one quarter — a key principle of radiation safety.'},
{id:'nuclear_magnetic_moment_formula', title:'Nuclear Magnetic Moment', category:'Nuclear Physics', eq:'\\mu=g_I\\mu_N\\frac{I}{\\hbar}', vars:[['\\mu','nuclear magnetic moment'],['g_I','nuclear g-factor (isotope-specific)'],['\\mu_N','nuclear magneton'],['I','nuclear spin angular momentum']],
 derivation:'The nuclear analogue of the electron spin magnetic moment formula, using the nuclear magneton (based on the proton mass) as the natural unit scale.', assumptions:'Well-defined nuclear spin I and an empirically measured g-factor.', units:'J/T', example:'Nuclear magnetic moments, though about 1836 times smaller than electron magnetic moments, are precisely what NMR and MRI detect and manipulate.'},
{id:'gamma_decay_energy', title:'Gamma Decay Photon Energy', category:'Nuclear Physics', eq:'E_\\gamma=E_i-E_f', vars:[['E_\\gamma','emitted gamma-ray photon energy'],['E_i','initial (excited) nuclear energy level'],['E_f','final nuclear energy level']],
 derivation:'A direct statement of energy conservation for a nucleus relaxing from an excited state to a lower-energy state by emitting a single photon.', assumptions:'Negligible nuclear recoil energy correction (valid for light, fast-de-exciting nuclei; otherwise a small recoil correction applies).', units:'joule (J) or keV/MeV', example:'Gamma-ray spectroscopy uses the discrete E_γ values from nuclear transitions as a fingerprint to identify specific radioactive isotopes.'},
{id:'positron_emission_threshold', title:'Beta-Plus (Positron) Decay Energy Threshold', category:'Nuclear Physics', eq:'Q_{\\beta^+}=[M(A,Z)-M(A,Z-1)-2m_e]c^2', vars:[['Q_{\\beta^+}','energy released in positron decay'],['M(A,Z)','parent atomic mass'],['M(A,Z-1)','daughter atomic mass'],['m_e','electron mass']],
 derivation:'Accounts for atomic (not just nuclear) mass differences, including the extra electron mass needed since the daughter atom has one fewer proton but the same electron cloud, plus the emitted positron mass.', assumptions:'Uses tabulated neutral atomic masses; the process is only energetically allowed if Q_{β+}>0.', units:'joule (J) or MeV', example:'The extra 2m_ec² (≈1.022 MeV) threshold, absent in beta-minus decay, is why positron emission is energetically forbidden for some nuclei that instead decay purely by electron capture.'},
{id:'electron_capture_q_value', title:'Electron Capture Q-Value', category:'Nuclear Physics', eq:'Q_{EC}=[M(A,Z)-M(A,Z-1)]c^2-E_b', vars:[['Q_{EC}','energy released in electron capture'],['M(A,Z)','parent atomic mass'],['M(A,Z-1)','daughter atomic mass'],['E_b','binding energy of the captured (usually K-shell) electron']],
 derivation:'A nuclear proton absorbs an inner atomic electron, converting to a neutron and emitting a neutrino; the Q-value follows from atomic mass-energy conservation, with a small correction for the captured electron\'s binding energy.', assumptions:'Uses tabulated neutral atomic masses; the captured electron is typically from the innermost (K) shell.', units:'joule (J) or MeV', example:'Electron capture is often accompanied by characteristic X-ray emission as an outer electron fills the resulting inner-shell vacancy.'},
{id:'fissility_parameter', title:'Bohr–Wheeler Fissility Parameter', category:'Nuclear Physics', eq:'x=\\frac{Z^2/A}{(Z^2/A)_{crit}}\\approx\\frac{Z^2/A}{50}', vars:[['x','fissility parameter (dimensionless)'],['Z','proton number'],['A','mass number'],['(Z^2/A)_{crit}','critical value above which the fission barrier vanishes (≈50)']],
 derivation:'Compares the destabilizing Coulomb energy term (∝Z²/A^{1/3}) to the stabilizing surface-tension term (∝A^{2/3}) in the liquid-drop model, forming a dimensionless ratio that governs the height of the fission barrier.', assumptions:'Liquid-drop model of the nucleus; classical (non-quantum) fission-barrier picture.', units:'dimensionless', example:'Nuclei with x close to or above 1 (very heavy, proton-rich nuclei) have such a low or vanishing fission barrier that they undergo essentially instantaneous spontaneous fission.'},
{id:'neutron_multiplication_factor', title:'Neutron Multiplication Factor', category:'Nuclear Physics', eq:'k=\\frac{\\text{neutrons produced in one generation}}{\\text{neutrons produced in the preceding generation}}', vars:[['k','multiplication factor (dimensionless)']],
 derivation:'A bookkeeping ratio defined directly from neutron population balance across successive fission generations in a reactor or fissile core.', assumptions:'Well-defined discrete "generations" of neutrons in a chain-reacting medium.', units:'dimensionless', example:'k=1 (critical) sustains a steady chain reaction, k<1 (subcritical) dies out, and k>1 (supercritical) grows — the central design parameter of any nuclear reactor.'},
{id:'reactor_period_formula', title:'Reactor Period', category:'Nuclear Physics', eq:'n(t)=n_0e^{t/T}', vars:[['n(t)','neutron population (or reactor power) at time t'],['n_0','initial neutron population'],['T','reactor period — time for the population to change by a factor of e']],
 derivation:'The simplest exponential growth/decay model for reactor power following a step change in reactivity, analogous to radioactive decay but with a growth (or decay) exponent set by reactor kinetics rather than a fixed nuclear decay constant.', assumptions:'Point-kinetics approximation; constant reactivity/period over the interval considered (a simplification of the full delayed-neutron kinetics equations).', units:'second (s) for T', example:'A short (fast) reactor period signals rapidly changing power and is a key safety parameter actively monitored and limited in reactor operations.'},
{id:'critical_mass_diffusion', title:'Critical Mass (Bare Sphere, Diffusion Approximation)', category:'Nuclear Physics', eq:'R_c=\\pi\\sqrt{\\frac{D}{\\nu\\Sigma_f-\\Sigma_a}}', vars:[['R_c','critical radius of a bare spherical assembly'],['D','neutron diffusion coefficient'],['\\nu\\Sigma_f','neutron production rate coefficient (ν = neutrons per fission, Σ_f = macroscopic fission cross section)'],['\\Sigma_a','macroscopic neutron absorption cross section']],
 derivation:'Solves the one-group neutron diffusion equation for a bare sphere, requiring the neutron flux to vanish at an extrapolated boundary just past the physical surface.', assumptions:'One-group (single-energy) neutron diffusion theory; bare (unreflected), homogeneous spherical assembly.', units:'metre (m) for R_c', example:'Real critical-mass calculations for weapons and reactor cores require far more sophisticated multi-group transport calculations, but this diffusion estimate captures the essential size-dependence of criticality.'},
{id:'dose_equivalent_formula', title:'Radiation Dose Equivalent', category:'Nuclear Physics', eq:'H=DQ', vars:[['H','dose equivalent (Sv)'],['D','absorbed dose (Gy)'],['Q','radiation quality factor (dimensionless, radiation-type dependent)']],
 derivation:'Scales the physically absorbed energy per unit mass (absorbed dose) by an empirical quality factor accounting for the greater biological damage caused by densely ionizing radiation like alpha particles versus gamma rays.', assumptions:'Quality factor Q is an approximate, radiation-type-dependent weighting (Q≈1 for X-rays/gamma/beta, Q≈20 for alpha particles).', units:'sievert (Sv)', example:'The same absorbed dose (in Gy) from alpha particles is roughly 20 times more biologically damaging than from gamma rays, reflected directly in the dose equivalent.'},
{id:'neutron_flux_definition', title:'Neutron Flux', category:'Nuclear Physics', eq:'\\Phi=nv', vars:[['\\Phi','neutron flux (m⁻²s⁻¹)'],['n','neutron number density (m⁻³)'],['v','average neutron speed (m/s)']],
 derivation:'Defined as the total path length traveled by all neutrons per unit volume per unit time, which for a simplified monoenergetic, mono-directional population reduces to the density-speed product.', assumptions:'Simplified single-speed (monoenergetic) neutron population; more general treatments integrate over the full neutron energy spectrum.', units:'neutrons per square metre per second (m⁻²s⁻¹)', example:'Neutron flux is the key quantity multiplied by cross section to compute reaction rates throughout reactor physics.'},
{id:'nuclear_recoil_energy', title:'Nuclear Recoil Energy (Photon Emission)', category:'Nuclear Physics', eq:'E_R=\\frac{E_\\gamma^2}{2Mc^2}', vars:[['E_R','recoil kinetic energy of the emitting nucleus'],['E_\\gamma','emitted photon energy'],['M','mass of the recoiling nucleus'],['c','speed of light']],
 derivation:'Follows from conservation of momentum: the nucleus must recoil with momentum equal and opposite to the emitted photon\'s momentum, giving a small but nonzero recoil kinetic energy.', assumptions:'Non-relativistic recoil; free (unbound) emitting nucleus.', units:'joule (J) or eV', example:'This tiny recoil energy is what the Mössbauer effect famously eliminates by embedding the emitting nucleus in a rigid crystal lattice, enabling extraordinarily precise gamma-ray spectroscopy.'},
{id:'beta_decay_endpoint_energy', title:'Beta Decay Endpoint (Maximum) Energy', category:'Nuclear Physics', eq:'Q_\\beta=[M(A,Z)-M(A,Z+1)]c^2', vars:[['Q_\\beta','total energy released, shared between the beta particle, antineutrino, and recoil'],['M(A,Z)','parent atomic mass'],['M(A,Z+1)','daughter atomic mass']],
 derivation:'A direct application of mass-energy conservation using tabulated neutral atomic masses, valid because the emitted electron\'s mass is already accounted for in the daughter atom\'s extra orbital electron.', assumptions:'Uses tabulated neutral atomic masses (not bare nuclear masses); the antineutrino is treated as essentially massless.', units:'joule (J) or MeV', example:'Unlike alpha decay, beta decay produces a continuous energy spectrum up to this endpoint energy, since the released energy is shared unpredictably between the electron and the antineutrino.'},
{id:'weisskopf_estimate', title:'Weisskopf Single-Particle Gamma Decay Estimate', category:'Nuclear Physics', eq:'\\lambda(E1)\\approx1.0\\times10^{14}A^{2/3}\\left(\\frac{E_\\gamma}{\\text{MeV}}\\right)^3\\ \\text{s}^{-1}', vars:[['\\lambda(E1)','estimated electric-dipole gamma transition rate'],['A','mass number'],['E_\\gamma','transition photon energy (MeV)']],
 derivation:'An order-of-magnitude estimate derived by Weisskopf, assuming a single nucleon transitions within a uniform-density nuclear volume, used as a benchmark against which measured transition rates are compared.', assumptions:'Single-particle nuclear model; a crude estimate — actual transition rates for allowed transitions typically differ from this benchmark by factors of 10⁻³ to 10² depending on nuclear structure.', units:'s⁻¹', example:'Comparing a measured gamma transition rate to its Weisskopf estimate (giving a "Weisskopf unit") is a standard way nuclear physicists gauge how collective or single-particle a given nuclear transition is.'},

/* ---- Added batch: Mechanics ---- */
{id:'work_energy_theorem', title:"Work-Energy Theorem", category:'Mechanics', eq:'W_{net}=\\Delta KE=\\frac12mv_f^2-\\frac12mv_i^2', vars:[['W_{net}','net work done on the object (J)'],['v_f,v_i','final and initial speeds (m/s)'],['m','mass (kg)']],
 derivation:'Integrates Newton\'s second law, F=ma, over displacement using a=v\\,dv/dx, so ∫F dx = ∫mv dv.', assumptions:'Net force and displacement measured along the same line of motion.', units:'joule (J)', example:'A 2 kg object sped up from 3 m/s to 5 m/s by a net force has 16 J of work done on it.'},
{id:'shm_period_spring', title:'Period of a Mass-Spring Oscillator', category:'Mechanics', eq:'T=2\\pi\\sqrt{\\frac{m}{k}}', vars:[['T','period of oscillation (s)'],['m','mass (kg)'],['k','spring constant (N/m)']],
 derivation:'Solves the simple-harmonic-motion equation of motion, m\\ddot x=-kx, whose solutions oscillate at angular frequency ω=√(k/m).', assumptions:'Ideal (massless, linear) spring; no friction or damping.', units:'second (s)', example:'A 0.5 kg mass on a 200 N/m spring oscillates with a period of about 0.31 s.'},
{id:'pendulum_period', title:'Simple Pendulum Period (Small Angle)', category:'Mechanics', eq:'T=2\\pi\\sqrt{\\frac{L}{g}}', vars:[['T','period of oscillation (s)'],['L','pendulum length (m)'],['g','gravitational acceleration (m/s²)']],
 derivation:'Small-angle approximation (sinθ≈θ) linearizes the pendulum equation of motion into simple harmonic form.', assumptions:'Small oscillation amplitude; massless, inextensible string; no air resistance.', units:'second (s)', example:'A 1 m pendulum on Earth has a period of about 2.01 s.'},
{id:'centripetal_force', title:'Centripetal Force', category:'Mechanics', eq:'F_c=\\frac{mv^2}{r}=m\\omega^2r', vars:[['F_c','centripetal force (N)'],['m','mass (kg)'],['v','tangential speed (m/s)'],['\\omega','angular speed (rad/s)'],['r','radius of the circular path (m)']],
 derivation:'Follows from differentiating the position vector of uniform circular motion twice, showing the acceleration points inward with magnitude v²/r.', assumptions:'Uniform circular motion (constant speed).', units:'newton (N)', example:'A 1000 kg car turning at 15 m/s on a 50 m radius curve needs about 4500 N of centripetal force.'},
{id:'spring_pe', title:'Elastic Potential Energy (Spring)', category:'Mechanics', eq:'U=\\frac12kx^2', vars:[['U','stored elastic potential energy (J)'],['k','spring constant (N/m)'],['x','displacement from equilibrium (m)']],
 derivation:'Integrates the restoring force F=-kx (Hooke\'s law) over displacement, W=∫kx\\,dx.', assumptions:'Linear (Hookean) spring, within its elastic limit.', units:'joule (J)', example:'A spring with k=150 N/m stretched 0.2 m stores 3 J of elastic potential energy.'},
{id:'angular_momentum_general', title:'Angular Momentum', category:'Mechanics', eq:'L=I\\omega=mvr\\sin\\theta', vars:[['L','angular momentum (kg·m²/s)'],['I','moment of inertia (kg·m²)'],['\\omega','angular velocity (rad/s)'],['\\theta','angle between position and velocity vectors']],
 derivation:'Defined as the cross product of position and linear momentum, L=r×p; for a rigid body this reduces to L=Iω.', assumptions:'Rigid body rotation about a fixed axis, or a point particle with well-defined r and p.', units:'kg·m²/s', example:'A figure skater pulling in their arms reduces I and therefore spins faster to conserve L.'},
{id:'moment_of_inertia_shapes', title:'Moment of Inertia (Disk and Rod)', category:'Mechanics', eq:'I_{disk}=\\frac12MR^2,\\quad I_{rod}=\\frac{1}{12}ML^2', vars:[['I','moment of inertia (kg·m²)'],['M','total mass (kg)'],['R','disk radius (m)'],['L','rod length (m)']],
 derivation:'Integrates r² dm over the mass distribution of a uniform solid disk (about its central axis) and a uniform thin rod (about its center).', assumptions:'Uniform density, idealized rigid-body geometry.', units:'kg·m²', example:'A 2 kg, 0.3 m radius uniform disk has I = 0.5×2×0.3² = 0.09 kg·m².'},
{id:'elastic_collision_1d', title:'Elastic Collision (1D)', category:'Mechanics', eq:'v_{1f}=\\frac{(m_1-m_2)v_{1i}+2m_2v_{2i}}{m_1+m_2}', vars:[['v_{1f}','final velocity of body 1'],['v_{1i},v_{2i}','initial velocities of bodies 1 and 2'],['m_1,m_2','masses of the two bodies']],
 derivation:'Solves the simultaneous conservation of momentum and kinetic energy for a one-dimensional two-body elastic collision.', assumptions:'Perfectly elastic collision (kinetic energy conserved); motion confined to one dimension.', units:'m/s', example:'A moving ball striking an identical stationary ball (m₁=m₂) transfers all its velocity: v₁f = 0, v₂f = v₁i.'},

/* ---- Added batch: Mechanics (extended) ---- */
{id:'kinetic_energy', title:'Kinetic Energy', category:'Mechanics', eq:'KE=\\frac12mv^2', vars:[['KE','kinetic energy (J)'],['m','mass (kg)'],['v','speed (m/s)']],
 derivation:'Follows from integrating the work done accelerating a mass from rest to speed v under Newton\'s second law.', assumptions:'Non-relativistic speeds (v ≪ c).', units:'joule (J)', example:'A 1200 kg car moving at 25 m/s has a kinetic energy of 375 kJ.'},
{id:'newton_gravitation', title:"Newton's Law of Universal Gravitation", category:'Mechanics', eq:'F=\\frac{Gm_1m_2}{r^2}', vars:[['F','gravitational force (N)'],['G','gravitational constant'],['m_1,m_2','the two masses (kg)'],['r','separation between centers (m)']],
 derivation:'Proposed by Newton to explain both terrestrial gravity and Kepler\'s laws of planetary motion with a single inverse-square force law.', assumptions:'Point masses, or spherically symmetric bodies (by the shell theorem); Newtonian (non-relativistic) gravity.', units:'newton (N)', example:'Two 1000 kg masses 1 m apart attract each other with a force of only about 6.67×10⁻⁵ N — gravity is very weak at everyday scales.'},
{id:'projectile_range', title:'Projectile Range', category:'Mechanics', eq:'R=\\frac{v_0^2\\sin(2\\theta)}{g}', vars:[['R','horizontal range (m)'],['v_0','launch speed (m/s)'],['\\theta','launch angle above horizontal'],['g','gravitational acceleration (m/s²)']],
 derivation:'Solves the horizontal and vertical kinematic equations for projectile motion simultaneously, eliminating time at the point the projectile returns to launch height.', assumptions:'No air resistance; level launch and landing height; constant g.', units:'metre (m)', example:'A projectile launched at 20 m/s at 45° (the optimal angle for maximum range on level ground) travels about 40.8 m.'},
{id:'projectile_max_height', title:'Projectile Maximum Height', category:'Mechanics', eq:'H=\\frac{v_0^2\\sin^2\\theta}{2g}', vars:[['H','maximum height (m)'],['v_0','launch speed (m/s)'],['\\theta','launch angle above horizontal'],['g','gravitational acceleration (m/s²)']],
 derivation:'Found by setting the vertical velocity component to zero at the peak of the trajectory and applying the kinematic relation v²=v₀²−2gh.', assumptions:'No air resistance; constant g.', units:'metre (m)', example:'The same 20 m/s launch at 45° reaches a maximum height of about 10.2 m.'},
{id:'impulse_momentum', title:'Impulse–Momentum Theorem', category:'Mechanics', eq:'J=F\\Delta t=\\Delta p', vars:[['J','impulse (N·s)'],['F','applied force (N), assumed constant or average'],['\\Delta t','time interval (s)'],['\\Delta p','change in momentum (kg·m/s)']],
 derivation:'Integrates Newton\'s second law, F=dp/dt, over the time interval during which the force acts.', assumptions:'F may vary with time, in which case J is understood as ∫F dt (the average-force form shown here is the common special case).', units:'N·s (equivalent to kg·m/s)', example:'A bat exerting an average 500 N force on a ball for 0.01 s delivers an impulse of 5 N·s, i.e. a momentum change of 5 kg·m/s.'},
{id:'conservation_momentum', title:'Conservation of Linear Momentum', category:'Mechanics', eq:'m_1v_{1i}+m_2v_{2i}=m_1v_{1f}+m_2v_{2f}', vars:[['m_1,m_2','masses of the two bodies'],['v_{1i},v_{2i}','initial velocities'],['v_{1f},v_{2f}','final velocities']],
 derivation:'Follows from Newton\'s third law: the internal forces two colliding bodies exert on each other are equal and opposite, so their sum over the system is zero.', assumptions:'Isolated (closed) system — no net external force during the interaction.', units:'kg·m/s (each side)', example:'Momentum conservation holds in both elastic and inelastic collisions, even though kinetic energy is only conserved in the former.'},
{id:'inelastic_collision', title:'Perfectly Inelastic Collision', category:'Mechanics', eq:'v_f=\\frac{m_1v_{1i}+m_2v_{2i}}{m_1+m_2}', vars:[['v_f','common final velocity of the combined bodies'],['m_1,m_2','masses of the two bodies'],['v_{1i},v_{2i}','initial velocities']],
 derivation:'Applies conservation of momentum to the special case where the two bodies stick together and move with a single common final velocity.', assumptions:'The bodies coalesce into one after collision; kinetic energy is not conserved (some is lost to deformation, heat, sound).', units:'m/s', example:'A 1000 kg car at 20 m/s colliding with and sticking to an identical stationary car leaves both moving together at 10 m/s.'},
{id:'coefficient_restitution', title:'Coefficient of Restitution', category:'Mechanics', eq:'e=-\\frac{v_{1f}-v_{2f}}{v_{1i}-v_{2i}}', vars:[['e','coefficient of restitution (0 ≤ e ≤ 1)'],['v_{1i},v_{2i}','initial velocities'],['v_{1f},v_{2f}','final velocities']],
 derivation:'Defined as the ratio of the relative separation speed to the relative approach speed, quantifying how much kinetic energy is conserved in a collision.', assumptions:'One-dimensional collision; e is a property of the colliding materials, not purely of the objects\' masses.', units:'dimensionless', example:'e=1 corresponds to a perfectly elastic collision; e=0 corresponds to a perfectly inelastic (bodies stick together) collision.'},
{id:'torque_angular_accel', title:"Newton's Second Law for Rotation", category:'Mechanics', eq:'\\tau=I\\alpha', vars:[['\\tau','net torque (N·m)'],['I','moment of inertia (kg·m²)'],['\\alpha','angular acceleration (rad/s²)']],
 derivation:'The rotational analogue of F=ma, obtained by summing τ=r×F over all mass elements of a rigid body.', assumptions:'Rigid body rotating about a fixed axis; I computed about that same axis.', units:'N·m', example:'A flywheel with I=0.8 kg·m² needs 4 N·m of net torque to reach an angular acceleration of 5 rad/s².'},
{id:'mechanical_power', title:'Mechanical Power (Force and Velocity)', category:'Mechanics', eq:'P=\\vec F\\cdot\\vec v=Fv\\cos\\theta', vars:[['P','instantaneous power (W)'],['F','applied force (N)'],['v','velocity (m/s)'],['\\theta','angle between force and velocity vectors']],
 derivation:'Follows from P=dW/dt combined with dW=F\\cdot dr, giving power as the dot product of force and velocity.', assumptions:'Instantaneous relationship; for varying F or v, must be evaluated at each instant.', units:'watt (W)', example:'A car engine delivering 2000 N of thrust at 30 m/s produces 60 kW of mechanical power.'},
{id:'center_of_mass', title:'Center of Mass', category:'Mechanics', eq:'x_{cm}=\\frac{\\sum_im_ix_i}{\\sum_im_i}', vars:[['x_{cm}','center-of-mass position'],['m_i','mass of the ith particle'],['x_i','position of the ith particle']],
 derivation:'Defined as the mass-weighted average position of a system of particles, the point that moves as if all external forces acted there.', assumptions:'Discrete particle system (a continuous body replaces the sum with an integral, x_cm=∫x\\,dm/∫dm).', units:'metre (m)', example:'The center of mass of the Earth-Moon system lies about 4,670 km from Earth\'s center — actually inside the Earth.'},
{id:'parallel_axis_theorem', title:'Parallel Axis Theorem', category:'Mechanics', eq:'I=I_{cm}+Md^2', vars:[['I','moment of inertia about the new axis (kg·m²)'],['I_{cm}','moment of inertia about a parallel axis through the center of mass'],['M','total mass (kg)'],['d','distance between the two parallel axes (m)']],
 derivation:'Follows algebraically from expanding r²=(\\vec r_{cm}+\\vec d)² inside the moment-of-inertia integral and using the definition of center of mass.', assumptions:'The new axis must be parallel to the axis through the center of mass.', units:'kg·m²', example:'A rod pivoted at its end has I=I_{cm}+M(L/2)²=(1/12)ML²+(1/4)ML²=(1/3)ML², matching the direct calculation.'},
{id:'rolling_without_slipping_ke', title:'Kinetic Energy of Rolling Without Slipping', category:'Mechanics', eq:'KE=\\frac12mv^2+\\frac12I\\omega^2,\\quad v=\\omega r', vars:[['KE','total kinetic energy (J)'],['m','mass (kg)'],['v','translational speed of the center of mass (m/s)'],['I','moment of inertia about the center of mass (kg·m²)'],['\\omega','angular speed (rad/s)'],['r','rolling radius (m)']],
 derivation:'Sums the translational kinetic energy of the center of mass with the rotational kinetic energy about the center of mass, linked by the rolling constraint v=ωr.', assumptions:'Rolling without slipping (no relative sliding at the contact point); rigid, circular cross-section.', units:'joule (J)', example:'A solid cylinder rolling without slipping has total KE = (3/4)mv², since I=(1/2)mr² for a cylinder adds an extra (1/4)mv² beyond pure translation.'},
{id:'kinetic_friction_force', title:'Kinetic Friction Force', category:'Mechanics', eq:'f_k=\\mu_kN', vars:[['f_k','kinetic friction force (N)'],['\\mu_k','coefficient of kinetic friction (dimensionless)'],['N','normal force (N)']],
 derivation:'An empirical (Coulomb) friction model relating sliding friction force to the normal force pressing the surfaces together.', assumptions:'Friction is roughly independent of sliding speed and contact area, a good but approximate model for many dry surfaces.', units:'newton (N)', example:'A 10 kg box (N≈98 N) on a surface with μ_k=0.3 experiences about 29.4 N of kinetic friction while sliding.'},
{id:'terminal_velocity', title:'Terminal Velocity (Quadratic Drag)', category:'Mechanics', eq:'v_t=\\sqrt{\\frac{2mg}{\\rho AC_d}}', vars:[['v_t','terminal velocity (m/s)'],['m','mass (kg)'],['g','gravitational acceleration (m/s²)'],['\\rho','fluid (air) density (kg/m³)'],['A','cross-sectional area (m²)'],['C_d','drag coefficient (dimensionless)']],
 derivation:'Found by setting gravitational force equal to the quadratic aerodynamic drag force, F_d=\\frac12\\rho v^2AC_d, and solving for v.', assumptions:'High-Reynolds-number quadratic drag regime; constant air density and drag coefficient.', units:'m/s', example:'A skydiver in a belly-down orientation reaches a terminal velocity on the order of 55 m/s (about 200 km/h).'},
{id:'damped_shm', title:'Damped Harmonic Oscillator', category:'Mechanics', eq:'x(t)=Ae^{-\\gamma t}\\cos(\\omega t+\\varphi)', vars:[['x(t)','displacement at time t'],['A','initial amplitude'],['\\gamma','damping rate'],['\\omega','damped angular frequency'],['\\varphi','phase constant']],
 derivation:'Solves the equation of motion m\\ddot x+b\\dot x+kx=0 in the underdamped regime, where the damping term causes an exponentially decaying amplitude.', assumptions:'Underdamped regime (damping weaker than critical); linear (viscous) damping force proportional to velocity.', units:'metre (m), for a linear oscillator', example:'A car\'s suspension is deliberately designed to be close to critically damped, avoiding the prolonged oscillation of underdamping.'},
{id:'physical_pendulum_period', title:'Physical Pendulum Period', category:'Mechanics', eq:'T=2\\pi\\sqrt{\\frac{I}{mgd}}', vars:[['T','period of oscillation (s)'],['I','moment of inertia about the pivot (kg·m²)'],['m','total mass (kg)'],['g','gravitational acceleration (m/s²)'],['d','distance from pivot to center of mass (m)']],
 derivation:'Generalizes the simple pendulum by using the full moment of inertia about the pivot rather than assuming all mass is concentrated at one point.', assumptions:'Small-angle oscillation; rigid body swinging freely about a fixed horizontal pivot.', units:'second (s)', example:'A uniform 1 m rod pivoted at one end (I=(1/3)mL², d=L/2) has a period of about 1.64 s, longer than a simple pendulum of the same length.'},
{id:'angular_kinematics', title:'Angular Kinematic Equation (constant α)', category:'Mechanics', eq:'\\omega^2=\\omega_0^2+2\\alpha\\Delta\\theta', vars:[['\\omega','final angular velocity (rad/s)'],['\\omega_0','initial angular velocity (rad/s)'],['\\alpha','angular acceleration (rad/s²)'],['\\Delta\\theta','angular displacement (rad)']],
 derivation:'The direct rotational analogue of the linear kinematic equation v²=v₀²+2aΔx, obtained by the same time-elimination procedure.', assumptions:'Constant angular acceleration.', units:'rad/s', example:'A wheel starting from rest with α=2 rad/s² reaches ω≈6.32 rad/s after rotating through 10 radians.'},
{id:'static_equilibrium', title:'Conditions for Static Equilibrium', category:'Mechanics', eq:'\\sum\\vec F=0,\\qquad\\sum\\vec\\tau=0', vars:[['\\sum\\vec F','vector sum of all external forces'],['\\sum\\vec\\tau','vector sum of all external torques (about any single point)']],
 derivation:'Follows directly from Newton\'s second law for both translational and rotational motion, requiring zero net force and zero net torque for an object at rest to remain at rest.', assumptions:'Rigid body; "any single point" for torques is valid specifically because the net force is also zero.', units:'newton (N) and N·m respectively', example:'Analyzing a ladder leaning against a wall uses both equilibrium conditions together to solve for the friction and normal forces at each contact point.'},

/* ---- Added batch: Electricity & Magnetism ---- */
{id:'gauss_law_e', title:"Gauss's Law (Electric)", category:'Electricity', eq:'\\oint\\vec E\\cdot d\\vec A=\\frac{Q_{enc}}{\\epsilon_0}', vars:[['\\vec E','electric field (V/m)'],['Q_{enc}','net charge enclosed by the surface (C)'],['\\epsilon_0','vacuum permittivity']],
 derivation:'A direct consequence of Coulomb\'s law integrated over a closed surface, exploiting the inverse-square field falloff.', assumptions:'Static charges; a closed ("Gaussian") surface of any shape.', units:'V·m (flux) on the left side', example:'A uniformly charged sphere behaves, outside its surface, exactly like a point charge at its center.'},
{id:'faraday_induction', title:"Faraday's Law of Induction", category:'Electricity', eq:'\\mathcal{E}=-\\frac{d\\Phi_B}{dt}', vars:[['\\mathcal{E}','induced EMF (V)'],['\\Phi_B','magnetic flux through the circuit (Wb)']],
 derivation:'Empirically established by Faraday; later shown by Maxwell to follow from the curl form ∇×E=−∂B/∂t.', assumptions:'A well-defined circuit loop; the minus sign encodes Lenz\'s law (opposing flux change).', units:'volt (V)', example:'Moving a magnet through a coil of wire induces a momentary voltage that can be read on a voltmeter.'},
{id:'ampere_law', title:"Ampère's Law", category:'Electricity', eq:'\\oint\\vec B\\cdot d\\vec\\ell=\\mu_0I_{enc}', vars:[['\\vec B','magnetic field (T)'],['I_{enc}','current enclosed by the loop (A)'],['\\mu_0','vacuum permeability']],
 derivation:'Relates the circulation of the magnetic field around a closed loop to the current passing through it, one of Maxwell\'s equations in its static form.', assumptions:'Steady (time-independent) currents (no displacement-current correction needed).', units:'T·m on the left side', example:'Used to derive the magnetic field inside a long solenoid or around a straight current-carrying wire.'},
{id:'rc_charging', title:'RC Circuit Charging Curve', category:'Electricity', eq:'V(t)=V_0\\left(1-e^{-t/RC}\\right)', vars:[['V(t)','capacitor voltage at time t'],['V_0','supply voltage'],['R','resistance (Ω)'],['C','capacitance (F)']],
 derivation:'Solves the first-order differential equation from Kirchhoff\'s voltage law applied to a series resistor-capacitor loop.', assumptions:'Ideal resistor and capacitor; constant supply voltage; capacitor initially uncharged.', units:'volt (V)', example:'After one time constant (t=RC), the capacitor reaches about 63% of the supply voltage.'},
{id:'lc_resonance', title:'LC Circuit Resonant Frequency', category:'Electricity', eq:'f=\\frac{1}{2\\pi\\sqrt{LC}}', vars:[['f','resonant frequency (Hz)'],['L','inductance (H)'],['C','capacitance (F)']],
 derivation:'Follows from solving the undamped LC circuit differential equation, analogous to a mass-spring oscillator.', assumptions:'Ideal, lossless inductor and capacitor (no resistance).', units:'hertz (Hz)', example:'A 1 mH inductor with a 1 µF capacitor resonates at about 5.03 kHz, a common radio-tuning circuit configuration.'},
{id:'electric_power_dissipation', title:'Electrical Power Dissipation', category:'Electricity', eq:'P=IV=I^2R=\\frac{V^2}{R}', vars:[['P','power dissipated (W)'],['I','current (A)'],['V','voltage across the element (V)'],['R','resistance (Ω)']],
 derivation:'Combines the definition of electrical power, P=IV, with Ohm\'s law V=IR to give equivalent forms.', assumptions:'Ohmic (resistive) element.', units:'watt (W)', example:'A 60 Ω heating element with 2 A flowing through it dissipates 240 W.'},
{id:'force_on_wire', title:'Force on a Current-Carrying Wire', category:'Electricity', eq:'F=BIL\\sin\\theta', vars:[['F','force on the wire (N)'],['B','magnetic field strength (T)'],['I','current (A)'],['L','wire length in the field (m)'],['\\theta','angle between wire and field']],
 derivation:'Integrates the Lorentz force qv×B over the moving charge carriers in a straight current-carrying conductor.', assumptions:'Uniform magnetic field over the wire segment; straight wire.', units:'newton (N)', example:'This is the operating principle behind electric motors and loudspeakers.'},

/* ---- Added batch: Electricity (extended) ---- */
{id:'kirchhoff_voltage', title:"Kirchhoff's Voltage Law", category:'Electricity', eq:'\\sum_kV_k=0', vars:[['V_k','voltage rise or drop across the kth element in a closed loop']],
 derivation:'Follows from the conservative nature of the electrostatic field: the work done moving a charge around any closed loop is zero.', assumptions:'Circuit elements are lumped (no significant radiated fields); quasi-static conditions.', units:'volt (V)', example:'In a single-loop circuit with a battery and two resistors, the battery EMF exactly equals the sum of the two resistors\' voltage drops.'},
{id:'kirchhoff_current', title:"Kirchhoff's Current Law", category:'Electricity', eq:'\\sum_kI_k=0', vars:[['I_k','current flowing into (positive) or out of (negative) a given node']],
 derivation:'Follows from conservation of electric charge: charge cannot accumulate indefinitely at an ideal circuit node.', assumptions:'Steady-state or quasi-static conditions; no charge storage at the node itself.', units:'ampere (A)', example:'At a junction where two 2 A currents flow in, exactly 4 A must flow out through the remaining branches.'},
{id:'resistors_series_parallel', title:'Equivalent Resistance (Series and Parallel)', category:'Electricity', eq:'R_{series}=\\sum_iR_i,\\qquad\\frac{1}{R_{parallel}}=\\sum_i\\frac{1}{R_i}', vars:[['R_{series}','equivalent resistance of resistors in series'],['R_{parallel}','equivalent resistance of resistors in parallel'],['R_i','individual resistor values']],
 derivation:'Series follows from Kirchhoff\'s voltage law with a common current through each element; parallel follows from Kirchhoff\'s current law with a common voltage across each element.', assumptions:'Ideal (linear, ohmic) resistors.', units:'ohm (Ω)', example:'Two 100 Ω resistors give 200 Ω in series but only 50 Ω in parallel.'},
{id:'capacitors_series_parallel', title:'Equivalent Capacitance (Series and Parallel)', category:'Electricity', eq:'C_{parallel}=\\sum_iC_i,\\qquad\\frac{1}{C_{series}}=\\sum_i\\frac{1}{C_i}', vars:[['C_{parallel}','equivalent capacitance of capacitors in parallel'],['C_{series}','equivalent capacitance of capacitors in series'],['C_i','individual capacitor values']],
 derivation:'Parallel capacitors share the same voltage and add their stored charge directly; series capacitors share the same charge, so their voltages (and hence inverse capacitances) add.', assumptions:'Ideal (linear) capacitors.', units:'farad (F)', example:'Two 10 µF capacitors give 20 µF in parallel but only 5 µF in series — the opposite pattern from resistors.'},
{id:'electric_potential_point_charge', title:'Electric Potential of a Point Charge', category:'Electricity', eq:'V=\\frac{1}{4\\pi\\epsilon_0}\\frac{q}{r}=\\frac{k_eq}{r}', vars:[['V','electric potential (V)'],['q','source charge (C)'],['r','distance from the charge (m)'],['k_e','Coulomb constant']],
 derivation:'Integrates the electric field of a point charge, E=k_eq/r², along a radial path from infinity (V=0) to distance r.', assumptions:'Point charge in vacuum (or effective dielectric medium); potential referenced to zero at infinity.', units:'volt (V)', example:'A 1 µC point charge produces a potential of about 8988 V at a distance of 1 m.'},
{id:'parallel_plate_capacitance', title:'Parallel-Plate Capacitor', category:'Electricity', eq:'C=\\frac{\\epsilon_0A}{d}', vars:[['C','capacitance (F)'],['\\epsilon_0','vacuum permittivity'],['A','plate area (m²)'],['d','plate separation (m)']],
 derivation:'Follows from combining the uniform field between two charged plates, E=σ/ε₀, with the definitions of voltage (V=Ed) and capacitance (C=Q/V).', assumptions:'Plate separation small compared to plate dimensions (uniform field, negligible fringing).', units:'farad (F)', example:'Plates of 0.01 m² separated by 1 mm in vacuum give a capacitance of about 88.5 pF.'},
{id:'biot_savart_law', title:'Biot–Savart Law', category:'Electricity', eq:'d\\vec B=\\frac{\\mu_0}{4\\pi}\\frac{Id\\vec\\ell\\times\\hat r}{r^2}', vars:[['d\\vec B','differential magnetic field contribution'],['I','current (A)'],['d\\vec\\ell','differential current-element length vector'],['r','distance from the element to the field point']],
 derivation:'The magnetostatic analogue of Coulomb\'s law, established experimentally and later shown consistent with Ampère\'s law and Maxwell\'s equations.', assumptions:'Steady current; integrates over the full current path to find the total field.', units:'tesla (T)', example:'Integrating the Biot–Savart law over a full loop yields the on-axis field of a current loop, and over an infinite straight wire yields B=μ₀I/(2πr).'},
{id:'b_field_long_wire', title:'Magnetic Field of a Long Straight Wire', category:'Electricity', eq:'B=\\frac{\\mu_0I}{2\\pi r}', vars:[['B','magnetic field magnitude (T)'],['\\mu_0','vacuum permeability'],['I','current (A)'],['r','perpendicular distance from the wire (m)']],
 derivation:'The result of integrating the Biot–Savart law (or applying Ampère\'s law with a circular loop) around an infinitely long straight current-carrying wire.', assumptions:'Wire treated as infinitely long and thin; steady current.', units:'tesla (T)', example:'A wire carrying 10 A produces a field of about 40 µT at a distance of 5 cm, comparable to Earth\'s magnetic field.'},
{id:'b_field_solenoid', title:'Magnetic Field Inside a Solenoid', category:'Electricity', eq:'B=\\mu_0nI', vars:[['B','magnetic field magnitude inside the solenoid (T)'],['\\mu_0','vacuum permeability'],['n','turns per unit length (turns/m)'],['I','current (A)']],
 derivation:'Applies Ampère\'s law to a rectangular loop with one side inside the tightly wound solenoid and one side far outside, where the field is negligible.', assumptions:'Ideal, tightly wound, long solenoid (length ≫ radius); field outside taken as zero.', units:'tesla (T)', example:'A solenoid with 1000 turns/m carrying 2 A produces a field of about 2.5 mT inside.'},
{id:'magnetic_dipole_torque', title:'Torque on a Magnetic Dipole', category:'Electricity', eq:'\\tau=\\vec m\\times\\vec B=mB\\sin\\theta', vars:[['\\tau','torque on the dipole (N·m)'],['m','magnetic dipole moment (A·m²)'],['B','external magnetic field (T)'],['\\theta','angle between the dipole moment and the field']],
 derivation:'Follows from summing the forces on the current loop that constitutes the dipole, analogous to the torque on an electric dipole in an electric field.', assumptions:'Uniform external magnetic field; dipole approximation (loop small compared to field variation scale).', units:'N·m', example:'A compass needle experiences maximum torque when oriented perpendicular to a magnetic field, which is why it rotates to align with the field.'},
{id:'rl_circuit_current', title:'RL Circuit Current Growth', category:'Electricity', eq:'I(t)=\\frac{V_0}{R}\\left(1-e^{-tR/L}\\right),\\quad \\tau=\\frac{L}{R}', vars:[['I(t)','current at time t (A)'],['V_0','supply voltage (V)'],['R','resistance (Ω)'],['L','inductance (H)'],['\\tau','inductive time constant (s)']],
 derivation:'Solves the first-order differential equation from Kirchhoff\'s voltage law applied to a series resistor-inductor loop with a step voltage input.', assumptions:'Ideal resistor and inductor; switch closed at t=0 with zero initial current.', units:'ampere (A)', example:'A circuit with L=2 H and R=4 Ω has a time constant of 0.5 s, the time to reach about 63% of its final steady current.'},
{id:'ac_impedance_rlc', title:'Impedance of a Series RLC Circuit', category:'Electricity', eq:'Z=\\sqrt{R^2+(X_L-X_C)^2},\\quad X_L=\\omega L,\\ X_C=\\frac{1}{\\omega C}', vars:[['Z','total impedance magnitude (Ω)'],['R','resistance (Ω)'],['X_L,X_C','inductive and capacitive reactance (Ω)'],['\\omega','angular driving frequency (rad/s)']],
 derivation:'Represents each circuit element as a complex impedance (resistor real, inductor/capacitor imaginary and opposite in sign) and adds them as phasors for a series circuit.', assumptions:'Linear circuit elements; steady-state sinusoidal (AC) driving signal.', units:'ohm (Ω)', example:'A circuit with R=50 Ω, X_L=30 Ω and X_C=10 Ω has a total impedance of about 53.9 Ω.'},
{id:'ac_rms_values', title:'RMS Voltage and Current (Sinusoidal)', category:'Electricity', eq:'V_{rms}=\\frac{V_{peak}}{\\sqrt2},\\qquad I_{rms}=\\frac{I_{peak}}{\\sqrt2}', vars:[['V_{rms},I_{rms}','root-mean-square voltage and current'],['V_{peak},I_{peak}','peak (amplitude) voltage and current']],
 derivation:'The RMS value is defined so that a DC signal of the same value would dissipate the same average power; integrating sin²(ωt) over a full cycle gives the factor 1/√2.', assumptions:'Pure sinusoidal waveform.', units:'volt (V) or ampere (A)', example:'North American household mains has a peak voltage of about 170 V, corresponding to the familiar 120 V RMS rating.'},
{id:'drift_velocity_current', title:'Current in Terms of Drift Velocity', category:'Electricity', eq:'I=nqv_dA', vars:[['I','current (A)'],['n','charge carrier number density (m⁻³)'],['q','charge per carrier (C)'],['v_d','drift velocity (m/s)'],['A','conductor cross-sectional area (m²)']],
 derivation:'Counts the total charge passing a cross-section per unit time, given the density, charge, and average drift speed of the carriers.', assumptions:'Uniform current density across the cross-section; steady current.', units:'ampere (A)', example:'In a 1 mm² copper wire carrying 1 A, the actual electron drift velocity is only about 0.07 mm/s — dramatically slower than the near-instantaneous signal propagation speed.'},
{id:'poynting_vector', title:'Poynting Vector (EM Energy Flux)', category:'Electricity', eq:'\\vec S=\\frac{1}{\\mu_0}\\vec E\\times\\vec B', vars:[['\\vec S','power per unit area carried by the electromagnetic field (W/m²)'],['\\vec E','electric field (V/m)'],['\\vec B','magnetic field (T)'],['\\mu_0','vacuum permeability']],
 derivation:'Derived from Maxwell\'s equations via the electromagnetic energy conservation theorem, identifying S as the energy flux vector of the field.', assumptions:'Classical (non-quantum) electrodynamics in a linear medium.', units:'W/m²', example:'Integrating the Poynting vector over a sphere around the Sun gives its total radiated power (luminosity).'},

/* ---- Added batch: Optics ---- */
{id:'thin_lens_equation', title:'Thin Lens Equation', category:'Optics', eq:'\\frac{1}{f}=\\frac{1}{d_o}+\\frac{1}{d_i}', vars:[['f','focal length (m)'],['d_o','object distance (m)'],['d_i','image distance (m)']],
 derivation:'Follows from applying Snell\'s law in the paraxial (small-angle) approximation to a thin lens.', assumptions:'Thin lens, paraxial rays, sign convention consistently applied.', units:'metre (m)', example:'An object 30 cm from a 10 cm focal-length lens forms an image 15 cm on the far side.'},
{id:'optical_magnification', title:'Optical Magnification', category:'Optics', eq:'m=-\\frac{d_i}{d_o}=\\frac{h_i}{h_o}', vars:[['m','magnification (dimensionless)'],['d_i,d_o','image and object distances'],['h_i,h_o','image and object heights']],
 derivation:'Derived from similar triangles formed by the object, image, and lens/mirror axis in the paraxial approximation.', assumptions:'Thin lens or mirror; paraxial approximation.', units:'dimensionless', example:'A magnification of m=−2 means an image twice the object\'s size and inverted.'},
{id:'malus_law', title:"Malus's Law", category:'Optics', eq:'I=I_0\\cos^2\\theta', vars:[['I','transmitted intensity'],['I_0','incident intensity through the first polarizer'],['\\theta','angle between polarizer axes']],
 derivation:'Follows from projecting the electric field amplitude onto the transmission axis of a second polarizer and squaring for intensity.', assumptions:'Ideal linear polarizers; already-polarized incident light for I₀.', units:'same units as I_0 (e.g. W/m²)', example:'Crossed polarizers (θ=90°) transmit essentially no light through the second polarizer.'},
{id:'brewster_angle', title:"Brewster's Angle", category:'Optics', eq:'\\theta_B=\\arctan\\left(\\frac{n_2}{n_1}\\right)', vars:[['\\theta_B','Brewster (polarizing) angle'],['n_1,n_2','refractive indices of the two media']],
 derivation:'The angle at which reflected and refracted rays are perpendicular, so the reflected light contains no component polarized in the plane of incidence.', assumptions:'Unpolarized incident light; smooth dielectric interface.', units:'degrees or radians', example:'For light going from air (n=1) to glass (n=1.5), Brewster\'s angle is about 56.3°.'},
{id:'single_slit_min', title:'Single-Slit Diffraction Minima', category:'Optics', eq:'a\\sin\\theta=m\\lambda', vars:[['a','slit width (m)'],['\\theta','angle to the minimum'],['m','minimum order (nonzero integer)'],['\\lambda','wavelength (m)']],
 derivation:'Follows from destructive interference between wavelets from pairs of points across the slit, via Huygens\' principle.', assumptions:'Far-field (Fraunhofer) diffraction; monochromatic light.', units:'metre (m)', example:'A narrower slit produces a wider central diffraction maximum, illustrating the wave nature of light.'},

/* ---- Added batch: Optics (extended) ---- */
{id:'critical_angle', title:'Critical Angle for Total Internal Reflection', category:'Optics', eq:'\\sin\\theta_c=\\frac{n_2}{n_1}', vars:[['\\theta_c','critical angle'],['n_1','refractive index of the denser (incident) medium'],['n_2','refractive index of the less-dense medium, n_2<n_1']],
 derivation:'Found by setting the refraction angle in Snell\'s law to exactly 90°, the boundary case beyond which no transmitted ray exists.', assumptions:'Light travels from a higher-index medium toward a lower-index medium (n_1>n_2).', units:'degrees or radians', example:'Light in glass (n=1.5) hitting an air boundary beyond about 41.8° undergoes total internal reflection, the principle behind fiber-optic cables.'},
{id:'lensmaker_equation', title:"Lensmaker's Equation", category:'Optics', eq:'\\frac{1}{f}=(n-1)\\left(\\frac{1}{R_1}-\\frac{1}{R_2}\\right)', vars:[['f','focal length (m)'],['n','refractive index of the lens material'],['R_1,R_2','radii of curvature of the two lens surfaces']],
 derivation:'Applies Snell\'s law in the paraxial approximation at each of the lens\'s two curved surfaces in sequence.', assumptions:'Thin lens (thickness negligible compared to R_1, R_2); paraxial rays.', units:'metre (m)', example:'A symmetric biconvex lens (R_1=+20 cm, R_2=−20 cm) made of glass with n=1.5 has a focal length of exactly 20 cm.'},
{id:'young_double_slit', title:"Young's Double-Slit Fringe Spacing", category:'Optics', eq:'y=\\frac{m\\lambda L}{d}', vars:[['y','distance from center to the mth bright fringe (m)'],['m','fringe order (integer)'],['\\lambda','wavelength (m)'],['L','distance from slits to screen (m)'],['d','slit separation (m)']],
 derivation:'Follows from the small-angle approximation applied to the path-length-difference condition d\\sin\\theta=m\\lambda for constructive interference.', assumptions:'L ≫ d (far-field/small-angle regime); coherent, monochromatic light.', units:'metre (m)', example:'A 633 nm laser through slits 0.5 mm apart, viewed on a screen 1 m away, produces fringes spaced about 1.27 mm apart.'},
{id:'rayleigh_criterion', title:'Rayleigh Criterion (Angular Resolution)', category:'Optics', eq:'\\theta_{min}=1.22\\frac{\\lambda}{D}', vars:[['\\theta_{min}','minimum resolvable angular separation (rad)'],['\\lambda','wavelength (m)'],['D','aperture diameter (m)']],
 derivation:'Defines the diffraction-limited resolution as the angle at which the central maximum of one point source\'s Airy diffraction pattern falls on the first minimum of another\'s.', assumptions:'Circular aperture; diffraction-limited (no other aberrations); incoherent point sources.', units:'radian', example:'A 5 mm pupil viewing 550 nm light has a diffraction-limited resolution of roughly 28 arcseconds, one of several factors limiting visual acuity.'},
{id:'lens_power_diopters', title:'Optical Power of a Lens', category:'Optics', eq:'P=\\frac{1}{f}', vars:[['P','optical power (diopters, D)'],['f','focal length (m)']],
 derivation:'A direct restatement of the lens equation\'s focal length in reciprocal form, chosen because optical powers of thin lenses in contact simply add.', assumptions:'Focal length measured in metres.', units:'diopter (D = m⁻¹)', example:'Reading glasses with a focal length of 0.5 m have an optical power of +2.0 D.'},
{id:'numerical_aperture', title:'Numerical Aperture', category:'Optics', eq:'NA=n\\sin\\theta', vars:[['NA','numerical aperture (dimensionless)'],['n','refractive index of the medium in front of the lens/fiber'],['\\theta','half-angle of the maximum light cone accepted or emitted']],
 derivation:'Defined to characterize the light-gathering and resolving power of an optical system in a single dimensionless parameter.', assumptions:'Applies near the optical axis; θ is the marginal ray angle.', units:'dimensionless', example:'Optical fibers with a higher NA accept light over a wider cone angle, but typically at the cost of higher signal dispersion.'},
{id:'thin_film_interference', title:'Thin-Film Interference (Constructive)', category:'Optics', eq:'2nt=m\\lambda', vars:[['n','refractive index of the film'],['t','film thickness (m)'],['m','integer order'],['\\lambda','wavelength in vacuum (m)']],
 derivation:'Accounts for the extra path length light travels making a round trip through the film, expressed in terms of the wavelength inside the film (λ/n).', assumptions:'Normal incidence; no additional phase shift from reflection (case-dependent — an extra λ/2 shift is added if only one surface produces a phase-inverting reflection).', units:'metre (m) for thickness', example:'A 200 nm thick soap film (n≈1.33) constructively reflects light with a vacuum wavelength of about 532 nm — the green often seen in soap bubbles.'},
{id:'mirror_focal_radius', title:'Spherical Mirror Focal Length', category:'Optics', eq:'f=\\frac{R}{2}', vars:[['f','focal length (m)'],['R','radius of curvature of the mirror (m)']],
 derivation:'Follows from the paraxial-ray geometry of reflection off a spherical surface, where rays parallel to the axis converge at half the radius of curvature.', assumptions:'Paraxial (small-angle) rays; spherical mirror surface (an approximation to the ideal parabolic shape).', units:'metre (m)', example:'A concave mirror with a 40 cm radius of curvature has a focal length of 20 cm.'},
{id:'index_of_refraction', title:'Index of Refraction', category:'Optics', eq:'n=\\frac{c}{v}', vars:[['n','refractive index (dimensionless)'],['c','speed of light in vacuum'],['v','speed of light in the medium']],
 derivation:'Defined directly as the ratio by which a medium slows the phase velocity of light relative to vacuum.', assumptions:'Non-dispersive treatment (n may vary with wavelength in real materials — see dispersion).', units:'dimensionless', example:'Water\'s refractive index of about 1.33 means light travels roughly 33% slower in water than in vacuum.'},
{id:'optical_path_length', title:'Optical Path Length', category:'Optics', eq:'OPL=nd', vars:[['OPL','optical path length (m)'],['n','refractive index of the medium'],['d','physical (geometric) path length (m)']],
 derivation:'Defined so that the phase accumulated by light equals what it would accumulate traveling the same OPL in vacuum, since phase velocity scales as c/n.', assumptions:'Homogeneous medium along the path (otherwise OPL is an integral, ∫n\\,dl).', units:'metre (m)', example:'Light passing through 2 cm of glass (n=1.5) has the same optical path length, and thus phase delay, as traveling 3 cm in vacuum.'},

/* ---- Added batch: Thermodynamics ---- */
{id:'first_law_thermo', title:'First Law of Thermodynamics', category:'Thermodynamics', eq:'\\Delta U=Q-W', vars:[['\\Delta U','change in internal energy (J)'],['Q','heat added to the system (J)'],['W','work done by the system (J)']],
 derivation:'A statement of energy conservation applied to a thermodynamic system exchanging heat and work with its surroundings.', assumptions:'Closed system; consistent sign convention for Q and W.', units:'joule (J)', example:'A gas that absorbs 500 J of heat and does 200 J of work on its surroundings increases its internal energy by 300 J.'},
{id:'fourier_conduction', title:"Fourier's Law of Heat Conduction", category:'Thermodynamics', eq:'\\dot Q=-kA\\frac{dT}{dx}', vars:[['\\dot Q','rate of heat flow (W)'],['k','thermal conductivity (W/(m·K))'],['A','cross-sectional area (m²)'],['dT/dx','temperature gradient (K/m)']],
 derivation:'An empirical constitutive law stating that heat flux is proportional to the local temperature gradient, with the minus sign reflecting flow from hot to cold.', assumptions:'Isotropic material; steady-state or quasi-steady conduction.', units:'watt (W)', example:'A well-insulated wall has a low k, sharply reducing heat loss for a given temperature difference.'},
{id:'adiabatic_relation', title:'Adiabatic Process Relation', category:'Thermodynamics', eq:'PV^\\gamma=\\text{const}', vars:[['P','pressure (Pa)'],['V','volume (m³)'],['\\gamma','heat capacity ratio, C_P/C_V']],
 derivation:'Follows from combining the first law of thermodynamics (with Q=0) with the ideal gas law for a reversible adiabatic process.', assumptions:'Ideal gas; reversible (quasi-static) process; no heat exchange with surroundings.', units:'consistent pressure·volume^γ units', example:'Rapid compression of air in a diesel engine cylinder is approximately adiabatic, raising its temperature enough to ignite fuel.'},
{id:'van_der_waals_eq', title:'Van der Waals Equation of State', category:'Thermodynamics', eq:'\\left(P+\\frac{an^2}{V^2}\\right)(V-nb)=nRT', vars:[['P','pressure (Pa)'],['V','volume (m³)'],['n','amount of substance (mol)'],['a,b','gas-specific correction constants'],['T','temperature (K)']],
 derivation:'Modifies the ideal gas law by adding a pressure correction for intermolecular attraction and a volume correction for finite molecular size.', assumptions:'Approximate real-gas model; a and b are empirically fit per substance.', units:'consistent with P, V, T', example:'The Van der Waals equation qualitatively predicts liquid-gas phase transitions that the ideal gas law cannot.'},
{id:'entropy_change_reversible', title:'Entropy Change (Reversible Process)', category:'Thermodynamics', eq:'\\Delta S=\\int\\frac{dQ_{rev}}{T}', vars:[['\\Delta S','change in entropy (J/K)'],['dQ_{rev}','infinitesimal reversible heat transfer'],['T','absolute temperature (K)']],
 derivation:'The thermodynamic definition of entropy, integrated along any reversible path connecting the initial and final states.', assumptions:'The path used for integration must be reversible, though ΔS itself is a state function independent of path.', units:'J/K', example:'Melting ice at 0 °C absorbs latent heat reversibly, producing a calculable positive entropy change.'},

/* ---- Added batch: Thermodynamics (extended) ---- */
{id:'isothermal_work', title:'Isothermal Work Done by an Ideal Gas', category:'Thermodynamics', eq:'W=nRT\\ln\\left(\\frac{V_f}{V_i}\\right)', vars:[['W','work done by the gas (J)'],['n','amount of gas (mol)'],['R','gas constant'],['T','constant absolute temperature (K)'],['V_f,V_i','final and initial volumes']],
 derivation:'Integrates W=∫P\\,dV using the ideal gas law P=nRT/V at constant temperature.', assumptions:'Ideal gas; reversible isothermal (constant-T) process.', units:'joule (J)', example:'One mole of ideal gas at 300 K doubling its volume isothermally does about 1729 J of work on its surroundings.'},
{id:'mayer_relation', title:"Mayer's Relation (Heat Capacities)", category:'Thermodynamics', eq:'C_P-C_V=R', vars:[['C_P','molar heat capacity at constant pressure'],['C_V','molar heat capacity at constant volume'],['R','gas constant']],
 derivation:'Follows from applying the first law of thermodynamics to an ideal gas at constant pressure, where some added heat goes into P\\,dV expansion work rather than purely raising internal energy.', assumptions:'Ideal gas (for real gases this becomes only an approximate relation).', units:'J/(mol·K)', example:'For a monatomic ideal gas, C_V=\\frac32R and C_P=\\frac52R, consistent with Mayer\'s relation.'},
{id:'specific_heat_eq', title:'Specific Heat Equation', category:'Thermodynamics', eq:'Q=mc\\Delta T', vars:[['Q','heat added or removed (J)'],['m','mass (kg)'],['c','specific heat capacity (J/(kg·K))'],['\\Delta T','temperature change (K)']],
 derivation:'The empirical, macroscopic definition of specific heat capacity: the heat required per unit mass per unit temperature change.', assumptions:'No phase change occurs; c approximately constant over the temperature range considered.', units:'joule (J)', example:'Raising 1 kg of water by 10 °C requires about 41.9 kJ, since water\'s specific heat is about 4186 J/(kg·K).'},
{id:'latent_heat_eq', title:'Latent Heat', category:'Thermodynamics', eq:'Q=mL', vars:[['Q','heat absorbed or released during the phase change (J)'],['m','mass undergoing the phase change (kg)'],['L','specific latent heat of the substance/transition (J/kg)']],
 derivation:'Defines the latent heat as the (temperature-independent) heat required per unit mass to complete a phase transition at constant temperature and pressure.', assumptions:'Phase change occurs at constant temperature and pressure (e.g. boiling at 1 atm).', units:'joule (J)', example:'Vaporizing 1 kg of water at 100 °C requires about 2.26 MJ — far more energy than heating that same water from 0 °C to 100 °C.'},
{id:'stefan_boltzmann_formula', title:'Stefan–Boltzmann Law', category:'Thermodynamics', eq:'j=\\sigma T^4', vars:[['j','radiated power per unit surface area (W/m²)'],['\\sigma','Stefan–Boltzmann constant'],['T','absolute surface temperature (K)']],
 derivation:'Integrates Planck\'s blackbody spectral radiance over all wavelengths and emission angles.', assumptions:'Ideal blackbody emitter (emissivity = 1); real surfaces radiate less, scaled by their emissivity ε<1.', units:'W/m²', example:'Treated as a blackbody at 288 K (Earth\'s average surface temperature), a surface radiates about 390 W/m².'},
{id:'wien_law_formula', title:"Wien's Displacement Law", category:'Thermodynamics', eq:'\\lambda_{max}=\\frac{b}{T}', vars:[['\\lambda_{max}','wavelength of peak blackbody emission (m)'],['b','Wien displacement constant'],['T','absolute temperature (K)']],
 derivation:'Found by maximizing Planck\'s blackbody spectral radiance formula with respect to wavelength at fixed temperature.', assumptions:'Ideal blackbody spectrum.', units:'metre (m)', example:'The Sun\'s photosphere (~5778 K) peaks in emission near 502 nm, in the visible green — close to the peak sensitivity of the human eye.'},
{id:'clausius_clapeyron', title:'Clausius–Clapeyron Equation', category:'Thermodynamics', eq:'\\ln\\left(\\frac{P_2}{P_1}\\right)=-\\frac{\\Delta H_{vap}}{R}\\left(\\frac{1}{T_2}-\\frac{1}{T_1}\\right)', vars:[['P_1,P_2','vapor pressures at temperatures T_1, T_2'],['\\Delta H_{vap}','molar enthalpy of vaporization'],['R','gas constant']],
 derivation:'Integrates the differential Clausius–Clapeyron relation dP/dT=L/(TΔV) for a liquid-vapor equilibrium, approximating the vapor as an ideal gas and neglecting the liquid\'s molar volume.', assumptions:'ΔH_vap approximately constant over the temperature range; vapor behaves ideally.', units:'dimensionless (ratio of pressures)', example:'This relation explains why water boils at a lower temperature at high altitude, where atmospheric pressure is reduced.'},
{id:'engine_efficiency_general', title:'Heat Engine Efficiency (General)', category:'Thermodynamics', eq:'\\eta=\\frac{W}{Q_H}=1-\\frac{Q_C}{Q_H}', vars:[['\\eta','thermal efficiency (dimensionless)'],['W','net work output per cycle (J)'],['Q_H','heat absorbed from the hot reservoir (J)'],['Q_C','heat exhausted to the cold reservoir (J)']],
 derivation:'Follows from energy conservation over one full engine cycle, W=Q_H-Q_C, applied to the definition of efficiency as useful output over energy input.', assumptions:'Cyclic operation (engine returns to its initial state each cycle).', units:'dimensionless', example:'An engine drawing 1000 J from its hot reservoir and exhausting 600 J has a thermal efficiency of 40%.'},
{id:'coefficient_of_performance', title:'Coefficient of Performance (Refrigerator)', category:'Thermodynamics', eq:'COP=\\frac{Q_C}{W}', vars:[['COP','coefficient of performance (dimensionless, often >1)'],['Q_C','heat removed from the cold reservoir (J)'],['W','work input required (J)']],
 derivation:'Defines refrigerator/heat-pump performance as useful heat transfer per unit of work input, the reciprocal-flavored analogue of heat engine efficiency.', assumptions:'Cyclic operation; for a heat pump\'s heating COP, Q_H replaces Q_C in the numerator.', units:'dimensionless', example:'A refrigerator removing 200 J of heat from its interior using 50 J of work input has a COP of 4.'},
{id:'gibbs_free_energy', title:'Gibbs Free Energy', category:'Thermodynamics', eq:'\\Delta G=\\Delta H-T\\Delta S', vars:[['\\Delta G','change in Gibbs free energy (J)'],['\\Delta H','change in enthalpy (J)'],['T','absolute temperature (K)'],['\\Delta S','change in entropy (J/K)']],
 derivation:'Defined via a Legendre transform of internal energy to give the thermodynamic potential that is minimized at equilibrium for processes at constant temperature and pressure.', assumptions:'Constant temperature and pressure.', units:'joule (J)', example:'A reaction proceeds spontaneously (at constant T, P) when ΔG is negative, even if it is endothermic, provided the entropy increase is large enough.'},
{id:'rms_speed_gas', title:'Root-Mean-Square Molecular Speed', category:'Thermodynamics', eq:'v_{rms}=\\sqrt{\\frac{3RT}{M}}', vars:[['v_{rms}','root-mean-square molecular speed (m/s)'],['R','gas constant'],['T','absolute temperature (K)'],['M','molar mass of the gas (kg/mol)']],
 derivation:'Follows from equating the average translational kinetic energy per mole, \\frac32RT, to \\frac12Mv_{rms}^2 from the kinetic theory of gases.', assumptions:'Ideal gas; Maxwell–Boltzmann speed distribution.', units:'m/s', example:'Nitrogen gas (M≈0.028 kg/mol) at room temperature (300 K) has an RMS molecular speed of about 517 m/s.'},
{id:'thermal_expansion_linear', title:'Linear Thermal Expansion', category:'Thermodynamics', eq:'\\Delta L=\\alpha L_0\\Delta T', vars:[['\\Delta L','change in length (m)'],['\\alpha','coefficient of linear thermal expansion (K⁻¹)'],['L_0','original length (m)'],['\\Delta T','temperature change (K)']],
 derivation:'A first-order (linear) approximation to how interatomic spacing increases with temperature, valid for modest temperature changes.', assumptions:'ΔT small enough that α can be treated as constant; isotropic material.', units:'metre (m)', example:'A 10 m steel beam (α≈12×10⁻⁶ K⁻¹) warmed by 50 °C lengthens by about 6 mm — a key consideration in bridge and railway expansion joints.'},

/* ---- Added batch: Waves & Acoustics (new category) ---- */
{id:'wave_speed_relation', title:'Wave Speed Relation', category:'Waves & Acoustics', eq:'v=f\\lambda', vars:[['v','wave propagation speed (m/s)'],['f','frequency (Hz)'],['\\lambda','wavelength (m)']],
 derivation:'Follows directly from the definitions of frequency and wavelength: a wave advances one wavelength per period T=1/f.', assumptions:'Non-dispersive medium (speed independent of frequency), or a single frequency component.', units:'m/s', example:'A 440 Hz sound wave in air (v≈343 m/s) has a wavelength of about 0.78 m.'},
{id:'speed_of_sound_gas', title:'Speed of Sound in an Ideal Gas', category:'Waves & Acoustics', eq:'v=\\sqrt{\\frac{\\gamma RT}{M}}', vars:[['v','speed of sound (m/s)'],['\\gamma','heat capacity ratio'],['R','gas constant'],['T','absolute temperature (K)'],['M','molar mass (kg/mol)']],
 derivation:'Derived from the adiabatic compressibility of the gas combined with the ideal gas law, since sound compressions occur too fast for significant heat exchange.', assumptions:'Ideal gas; adiabatic (not isothermal) compression.', units:'m/s', example:'For dry air at 20 °C, this formula gives a speed of sound of about 343 m/s.'},
{id:'doppler_effect_sound', title:'Classical Doppler Effect (Sound)', category:'Waves & Acoustics', eq:'f_{obs}=f_{src}\\frac{v\\pm v_{obs}}{v\\mp v_{src}}', vars:[['f_{obs}','observed frequency'],['f_{src}','source frequency'],['v','speed of sound in the medium'],['v_{obs},v_{src}','observer and source speeds along the line of sight']],
 derivation:'Accounts for the relative motion of source and observer changing the effective wavelength or reception rate of successive wavefronts.', assumptions:'Motion occurs in a stationary medium (e.g. still air); speeds well below the speed of sound.', units:'hertz (Hz)', example:'An ambulance siren sounds higher-pitched approaching and lower-pitched receding — the classic Doppler shift.'},
{id:'standing_wave_string', title:'Standing Wave Frequencies (String)', category:'Waves & Acoustics', eq:'f_n=\\frac{n}{2L}\\sqrt{\\frac{T}{\\mu}}', vars:[['f_n','frequency of the nth harmonic (Hz)'],['n','harmonic number (positive integer)'],['L','string length (m)'],['T','string tension (N)'],['\\mu','linear mass density (kg/m)']],
 derivation:'Combines the wave speed on a stretched string, v=√(T/μ), with the boundary condition that both ends are fixed nodes, fixing allowed wavelengths.', assumptions:'Ideal, uniform, flexible string fixed at both ends; no damping.', units:'hertz (Hz)', example:'Tightening a guitar string (increasing T) raises the pitch of every harmonic it supports.'},
 
 {id:'standing_wave_pipe_open', title:'Standing Wave Frequencies (Pipe, Both Ends Open)', category:'Waves & Acoustics', eq:'f_n=\\frac{nv}{2L}', vars:[['f_n','frequency of the nth harmonic (Hz)'],['n','harmonic number (positive integer)'],['v','speed of sound in the medium'],['L','pipe length (m)']],
 derivation:'Follows from requiring both open ends of the pipe to be displacement antinodes (pressure nodes), fixing the allowed resonant wavelengths.', assumptions:'Ideal pipe open at both ends; end corrections neglected.', units:'hertz (Hz)', example:'An open organ pipe supports all integer harmonics (fundamental plus overtones at 2f, 3f, 4f...), unlike a closed pipe.'},
{id:'standing_wave_pipe_closed', title:'Standing Wave Frequencies (Pipe, One End Closed)', category:'Waves & Acoustics', eq:'f_n=\\frac{nv}{4L},\\quad n=1,3,5,\\ldots', vars:[['f_n','frequency of the nth harmonic (Hz)'],['n','odd harmonic number only'],['v','speed of sound in the medium'],['L','pipe length (m)']],
 derivation:'Follows from requiring the closed end to be a displacement node and the open end to be a displacement antinode, which only permits odd-numbered harmonics.', assumptions:'Ideal pipe closed at one end, open at the other; end corrections neglected.', units:'hertz (Hz)', example:'A closed pipe (like many woodwind instruments) produces only odd harmonics, giving it a characteristically different timbre from an open pipe of the same length.'},
{id:'beat_frequency', title:'Beat Frequency', category:'Waves & Acoustics', eq:'f_{beat}=|f_1-f_2|', vars:[['f_{beat}','frequency of the perceived amplitude oscillation (Hz)'],['f_1,f_2','frequencies of the two interfering waves (Hz)']],
 derivation:'Follows from the trigonometric sum of two close-frequency sinusoids, which combine into a single wave with an amplitude that itself oscillates at the difference frequency.', assumptions:'Two waves of similar frequency and comparable amplitude superposing in the same medium.', units:'hertz (Hz)', example:'Piano tuners use beat frequencies to precisely match a string\'s pitch to a reference tone — the beats slow down and vanish as the frequencies converge.'},
{id:'intensity_wave_general', title:'Wave Intensity', category:'Waves & Acoustics', eq:'I=\\frac12\\rho v\\omega^2A^2', vars:[['I','wave intensity (W/m²)'],['\\rho','medium density (kg/m³)'],['v','wave propagation speed (m/s)'],['\\omega','angular frequency (rad/s)'],['A','wave displacement amplitude (m)']],
 derivation:'Follows from computing the time-averaged rate of energy transport (kinetic plus potential energy density, times propagation speed) carried by a sinusoidal mechanical wave.', assumptions:'Linear (small-amplitude), non-dissipative wave propagation in a uniform medium.', units:'W/m²', example:'Intensity scales with the square of both frequency and amplitude, meaning a wave twice as loud in amplitude carries four times the energy flux.'},
{id:'sound_intensity_level_db', title:'Sound Intensity Level (Decibels)', category:'Waves & Acoustics', eq:'\\beta=10\\log_{10}\\left(\\frac{I}{I_0}\\right)', vars:[['\\beta','sound intensity level (dB)'],['I','sound intensity (W/m²)'],['I_0','reference intensity, 10⁻¹² W/m² (threshold of hearing)']],
 derivation:'A logarithmic scale defined to compress the enormous range of intensities the human ear can detect (many orders of magnitude) into a compact, perceptually meaningful range.', assumptions:'Reference intensity I_0 corresponds to the standard threshold of human hearing at 1 kHz.', units:'decibel (dB)', example:'Normal conversation is about 60 dB, corresponding to an intensity a million times greater than the threshold of hearing.'},
{id:'inverse_square_sound_intensity', title:'Inverse-Square Law for Sound Intensity', category:'Waves & Acoustics', eq:'I=\\frac{P}{4\\pi r^2}', vars:[['I','sound intensity at distance r (W/m²)'],['P','total acoustic power radiated by the source (W)'],['r','distance from the point source (m)']],
 derivation:'Follows from conservation of acoustic energy spreading isotropically over an expanding spherical wavefront of area 4πr².', assumptions:'Point source; isotropic (omnidirectional) radiation; free field (no reflections or absorption).', units:'W/m²', example:'Doubling your distance from a point sound source reduces intensity to one quarter, and sound level by about 6 dB.'},
{id:'acoustic_impedance', title:'Acoustic Impedance', category:'Waves & Acoustics', eq:'Z=\\rho v', vars:[['Z','characteristic acoustic impedance of the medium (Pa·s/m)'],['\\rho','medium density (kg/m³)'],['v','speed of sound in the medium (m/s)']],
 derivation:'Defined as the ratio of acoustic pressure to particle velocity for a plane traveling wave, analogous to electrical impedance relating voltage to current.', assumptions:'Plane wave propagation; homogeneous medium.', units:'Pa·s/m (rayl)', example:'A large acoustic impedance mismatch — such as between air and water — is why most sound is reflected rather than transmitted at that boundary.'},
{id:'transmission_reflection_coefficients_acoustic', title:'Acoustic Transmission and Reflection Coefficients', category:'Waves & Acoustics', eq:'R=\\left(\\frac{Z_2-Z_1}{Z_2+Z_1}\\right)^2,\\quad T=1-R', vars:[['R','fraction of intensity reflected at the boundary'],['T','fraction of intensity transmitted'],['Z_1,Z_2','acoustic impedances of the two media']],
 derivation:'Follows from matching acoustic pressure and particle velocity boundary conditions at the interface between two media, analogous to the Fresnel equations in optics.', assumptions:'Normal incidence on a flat interface between two semi-infinite media.', units:'dimensionless (fraction, 0 to 1)', example:'This large impedance mismatch is why medical ultrasound uses a coupling gel — to reduce reflection and improve transmission of sound into the body.'},
{id:'resonance_frequency_helmholtz', title:'Helmholtz Resonator Frequency', category:'Waves & Acoustics', eq:'f=\\frac{v}{2\\pi}\\sqrt{\\frac{A}{VL_{eff}}}', vars:[['f','resonant frequency (Hz)'],['v','speed of sound in the medium'],['A','cross-sectional area of the neck opening'],['V','volume of the cavity'],['L_{eff}','effective length of the neck (including end corrections)']],
 derivation:'Models the air in the neck as a lumped mass oscillating against the springlike compressibility of the air trapped in the cavity, forming a simple harmonic system.', assumptions:'Cavity dimensions small compared to the acoustic wavelength (lumped-element approximation); neck length includes an end-correction term for radiation effects.', units:'hertz (Hz)', example:'Blowing across the top of a glass bottle produces a Helmholtz resonance, with pitch depending on the bottle\'s neck geometry and remaining liquid volume.'},
{id:'sabine_reverberation_time', title:'Sabine Reverberation Time', category:'Waves & Acoustics', eq:'T_{60}=\\frac{0.161V}{A}', vars:[['T_{60}','reverberation time — time for sound to decay by 60 dB (s)'],['V','room volume (m³)'],['A','total absorption (sum of surface area × absorption coefficient, m²)']],
 derivation:'An empirical formula (derived by Wallace Sabine) modeling the statistical decay of sound energy in a room as a simple exponential process governed by the room\'s volume and total absorptive surface area.', assumptions:'Diffuse (statistically uniform) sound field; moderately reverberant room; the 0.161 constant assumes SI units (metres, seconds).', units:'second (s)', example:'Concert halls are acoustically designed around Sabine\'s formula, targeting a reverberation time of roughly 1.5–2 s for orchestral music.'},
{id:'shock_wave_mach_angle', title:'Mach Angle (Shock Wave Cone)', category:'Waves & Acoustics', eq:'\\sin\\theta=\\frac{1}{M}', vars:[['\\theta','Mach angle (half-angle of the shock cone)'],['M','Mach number of the moving source (M>1)']],
 derivation:'Follows from the geometric envelope of overlapping spherical sound wavefronts emitted by a source moving faster than the local speed of sound.', assumptions:'Source moving at constant supersonic speed in a uniform medium.', units:'degrees or radians', example:'A jet flying at Mach 2 produces a shock cone with a half-angle of 30°, the geometric basis of the audible "sonic boom."'},
{id:'longitudinal_wave_speed_solid', title:'Longitudinal Wave Speed in a Solid Rod', category:'Waves & Acoustics', eq:'v=\\sqrt{\\frac{E}{\\rho}}', vars:[['v','longitudinal wave speed (m/s)'],['E','Young\'s modulus of the material (Pa)'],['\\rho','material density (kg/m³)']],
 derivation:'Follows from applying Newton\'s second law to a small element of an elastic rod, using Hooke\'s law (stress proportional to strain) as the restoring force.', assumptions:'Thin rod (width small compared to wavelength); linear elastic (Hookean) material.', units:'m/s', example:'Steel, with a high Young\'s modulus, transmits sound at roughly 5900 m/s — about 17 times faster than sound travels through air.'},
{id:'transverse_wave_speed_string', title:'Transverse Wave Speed on a String', category:'Waves & Acoustics', eq:'v=\\sqrt{\\frac{T}{\\mu}}', vars:[['v','transverse wave speed (m/s)'],['T','string tension (N)'],['\\mu','linear mass density (kg/m)']],
 derivation:'Follows from applying Newton\'s second law to a small displaced segment of a stretched string, with tension providing the restoring force.', assumptions:'Ideal flexible string; small-amplitude transverse displacement.', units:'m/s', example:'Tightening a guitar string increases T and raises the wave speed, which raises the pitch of every harmonic the string supports.'},
{id:'group_velocity_dispersive_wave', title:'Group Velocity (Dispersive Medium)', category:'Waves & Acoustics', eq:'v_g=\\frac{d\\omega}{dk}', vars:[['v_g','group velocity — speed of the wave packet envelope'],['\\omega','angular frequency'],['k','wavenumber']],
 derivation:'Follows from analyzing the constructive-interference envelope formed by superposing a narrow band of wave components with slightly different frequencies and wavenumbers.', assumptions:'Narrow bandwidth (quasi-monochromatic wave packet); medium in which ω depends nonlinearly on k (dispersive medium).', units:'m/s', example:'In a dispersive medium, group velocity (the speed of a wave packet, and of the information/energy it carries) differs from phase velocity, which is why deep-water ocean waves spread out and separate by wavelength over time.'},
 
 

/* ---- Added batch: Fluid Mechanics ---- */
{id:'continuity_equation', title:'Continuity Equation (Incompressible Flow)', category:'Fluid Mechanics', eq:'A_1v_1=A_2v_2', vars:[['A_1,A_2','cross-sectional areas at two points'],['v_1,v_2','flow speeds at those points']],
 derivation:'Follows from conservation of mass for an incompressible fluid: the volumetric flow rate must be the same at every cross-section.', assumptions:'Incompressible, steady flow; no fluid sources or sinks between the two points.', units:'m³/s (volumetric flow rate) implied equal on both sides', example:'Water flowing from a wide pipe into a narrow one speeds up, as seen when a garden hose nozzle is narrowed.'},
{id:'poiseuille_law', title:"Poiseuille's Law", category:'Fluid Mechanics', eq:'Q=\\frac{\\pi r^4\\Delta P}{8\\eta L}', vars:[['Q','volumetric flow rate (m³/s)'],['r','pipe radius (m)'],['\\Delta P','pressure difference across the pipe (Pa)'],['\\eta','dynamic viscosity (Pa·s)'],['L','pipe length (m)']],
 derivation:'Integrates the parabolic velocity profile of steady laminar flow in a cylindrical pipe, obtained by solving the Navier–Stokes equations for this geometry.', assumptions:'Steady, laminar, incompressible Newtonian fluid flow in a rigid cylindrical pipe.', units:'m³/s', example:'The strong r⁴ dependence means halving a blood vessel\'s radius cuts flow to about 1/16, relevant in cardiovascular physiology.'},
{id:'torricelli_law', title:"Torricelli's Law", category:'Fluid Mechanics', eq:'v=\\sqrt{2gh}', vars:[['v','efflux speed of the fluid (m/s)'],['g','gravitational acceleration (m/s²)'],['h','height of fluid above the opening (m)']],
