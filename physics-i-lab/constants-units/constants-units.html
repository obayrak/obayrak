 derivation:'A special case of Bernoulli\'s equation applied between the free surface and the outlet, both open to atmospheric pressure.', assumptions:'Inviscid, incompressible flow; outlet small compared to the container; open to atmosphere.', units:'m/s', example:'Water draining from a hole 1.25 m below the surface of a tank exits at about 5 m/s.'},
{id:'archimedes_buoyancy', title:"Archimedes' Buoyancy Principle", category:'Fluid Mechanics', eq:'F_B=\\rho_{fluid}Vg', vars:[['F_B','buoyant force (N)'],['\\rho_{fluid}','density of the displaced fluid (kg/m³)'],['V','volume of fluid displaced (m³)'],['g','gravitational acceleration (m/s²)']],
 derivation:'Follows from the pressure difference between the top and bottom of a submerged object integrated over its surface, equivalent to the weight of displaced fluid.', assumptions:'Fluid in static equilibrium; object fully or partially submerged.', units:'newton (N)', example:'A ship floats because the weight of water it displaces equals its own weight.'},
/* ---- Added batch: Fluid Mechanics (extended) ---- */
{id:'navier_stokes_equation', title:'Navier–Stokes Equation (Incompressible)', category:'Fluid Mechanics', eq:'\\rho\\left(\\frac{\\partial\\vec v}{\\partial t}+\\vec v\\cdot\\nabla\\vec v\\right)=-\\nabla p+\\mu\\nabla^2\\vec v+\\rho\\vec g', vars:[['\\rho','fluid density (kg/m³)'],['\\vec v','velocity field'],['p','pressure field'],['\\mu','dynamic viscosity'],['\\vec g','body force per unit mass (e.g. gravity)']],
 derivation:'Applies Newton\'s second law to an infinitesimal fluid element, combining pressure gradient, viscous stress (via Stokes\' constitutive relation), and body forces with the material derivative of velocity.', assumptions:'Incompressible, Newtonian fluid; constant viscosity.', units:'N/m³ (force per unit volume, each term)', example:'This equation underlies nearly all of computational fluid dynamics, from weather forecasting to aircraft design, though it has no known general closed-form solution.'},
{id:'euler_equation_fluid', title:'Euler Equation (Inviscid Flow)', category:'Fluid Mechanics', eq:'\\rho\\left(\\frac{\\partial\\vec v}{\\partial t}+\\vec v\\cdot\\nabla\\vec v\\right)=-\\nabla p+\\rho\\vec g', vars:[['\\rho','fluid density'],['\\vec v','velocity field'],['p','pressure field'],['\\vec g','body force per unit mass']],
 derivation:'The Navier–Stokes equation with the viscous term dropped, valid when viscous forces are negligible compared to inertial and pressure forces.', assumptions:'Inviscid (zero-viscosity) fluid; a good approximation at high Reynolds number away from boundaries.', units:'N/m³ (force per unit volume, each term)', example:'Bernoulli\'s equation is a direct consequence of integrating the Euler equation along a streamline for steady, inviscid flow.'},
{id:'hydrostatic_pressure', title:'Hydrostatic Pressure', category:'Fluid Mechanics', eq:'P=P_0+\\rho gh', vars:[['P','pressure at depth h'],['P_0','pressure at the reference surface (e.g. atmospheric)'],['\\rho','fluid density (kg/m³)'],['g','gravitational acceleration (m/s²)'],['h','depth below the reference surface (m)']],
 derivation:'Follows from a force balance on a thin horizontal fluid slab, where the weight of fluid above must be supported by the pressure difference across the slab.', assumptions:'Static fluid in equilibrium; incompressible (constant ρ); uniform gravitational field.', units:'pascal (Pa)', example:'At 10 m depth in water, pressure is about 1 atm higher than at the surface — roughly doubling the total pressure experienced by a diver.'},
{id:'young_laplace_equation', title:'Young–Laplace Equation', category:'Fluid Mechanics', eq:'\\Delta P=\\gamma\\left(\\frac{1}{R_1}+\\frac{1}{R_2}\\right)', vars:[['\\Delta P','pressure difference across the curved interface'],['\\gamma','surface tension (N/m)'],['R_1,R_2','principal radii of curvature of the surface']],
 derivation:'Follows from minimizing the total surface energy of a curved interface subject to a pressure difference, balancing surface tension against the pressure jump.', assumptions:'Interface in mechanical equilibrium; surface tension uniform and isotropic.', units:'pascal (Pa)', example:'For a spherical soap bubble (two surfaces, R_1=R_2=r), this reduces to ΔP=4γ/r — twice the single-surface droplet result, since a bubble has both an inner and outer film.'},
{id:'capillary_rise_jurin', title:"Jurin's Law (Capillary Rise)", category:'Fluid Mechanics', eq:'h=\\frac{2\\gamma\\cos\\theta}{\\rho gr}', vars:[['h','height of capillary rise (m)'],['\\gamma','surface tension (N/m)'],['\\theta','contact angle between the liquid and tube wall'],['\\rho','liquid density (kg/m³)'],['g','gravitational acceleration (m/s²)'],['r','tube radius (m)']],
 derivation:'Balances the upward force from surface tension acting around the tube\'s circumference against the weight of the raised liquid column.', assumptions:'Narrow cylindrical tube; uniform contact angle around the meniscus.', units:'metre (m)', example:'Water in a 0.1 mm radius glass tube rises about 15 cm — the same effect that draws water up through narrow soil pores and plant xylem.'},
{id:'stokes_drag_law', title:"Stokes' Law (Drag on a Sphere)", category:'Fluid Mechanics', eq:'F_d=6\\pi\\mu rv', vars:[['F_d','drag force (N)'],['\\mu','dynamic viscosity (Pa·s)'],['r','sphere radius (m)'],['v','sphere velocity relative to the fluid (m/s)']],
 derivation:'Solves the Navier–Stokes equation exactly for a sphere moving slowly through a viscous fluid, in the limit where inertial forces are negligible compared to viscous forces.', assumptions:'Very low Reynolds number (Re≪1, creeping/laminar flow); rigid sphere; unbounded fluid.', units:'newton (N)', example:'Stokes\' law is the basis of the Millikan oil-drop experiment, which used the balance between gravity, buoyancy, and viscous drag to measure the elementary charge.'},
{id:'drag_force_general', title:'Drag Force (Quadratic Regime)', category:'Fluid Mechanics', eq:'F_d=\\frac12\\rho v^2C_dA', vars:[['F_d','drag force (N)'],['\\rho','fluid density (kg/m³)'],['v','relative flow speed (m/s)'],['C_d','drag coefficient (dimensionless, shape-dependent)'],['A','reference cross-sectional area (m²)']],
 derivation:'An empirical model for drag at high Reynolds number, where the force scales with the dynamic pressure (½ρv²) acting over the object\'s frontal area, scaled by a shape-dependent coefficient.', assumptions:'High Reynolds number (turbulent wake regime), in contrast to the linear-in-v Stokes drag valid at low Reynolds number.', units:'newton (N)', example:'A typical car has C_d≈0.3; halving that value at highway speed roughly halves the aerodynamic drag force and the power needed to overcome it.'},
{id:'darcy_weisbach_equation', title:'Darcy–Weisbach Equation', category:'Fluid Mechanics', eq:'h_f=f\\frac{L}{D}\\frac{v^2}{2g}', vars:[['h_f','head loss due to friction (m)'],['f','Darcy friction factor (dimensionless)'],['L','pipe length (m)'],['D','pipe diameter (m)'],['v','mean flow velocity (m/s)'],['g','gravitational acceleration (m/s²)']],
 derivation:'An empirical/semi-empirical relation for frictional energy loss in pipe flow, with f determined from the Moody chart or correlations depending on Reynolds number and pipe roughness.', assumptions:'Fully developed flow in a pipe of constant cross-section.', units:'metre (m), as an equivalent height of fluid column', example:'This equation is the standard tool for sizing pumps in water-distribution and HVAC piping systems, since it directly gives the pressure drop needed to overcome pipe friction.'},
{id:'froude_number', title:'Froude Number', category:'Fluid Mechanics', eq:'Fr=\\frac{v}{\\sqrt{gL}}', vars:[['Fr','Froude number (dimensionless)'],['v','characteristic flow velocity (m/s)'],['g','gravitational acceleration (m/s²)'],['L','characteristic length (e.g. depth or hull length)']],
 derivation:'A dimensionless ratio of inertial to gravitational forces, derived from dimensional analysis of free-surface and wave-influenced flows.', assumptions:'Relevant wherever gravity-driven surface waves matter (open channels, ship hulls).', units:'dimensionless', example:'A ship\'s hull speed limit in displacement mode corresponds roughly to Fr≈0.4, beyond which wave-making drag rises sharply.'},
{id:'mach_number', title:'Mach Number', category:'Fluid Mechanics', eq:'M=\\frac{v}{c}', vars:[['M','Mach number (dimensionless)'],['v','flow or object speed (m/s)'],['c','local speed of sound in the fluid (m/s)']],
 derivation:'A dimensionless ratio comparing flow speed to the local speed of sound, marking the threshold where compressibility effects become important.', assumptions:'c is evaluated locally, since the speed of sound depends on the fluid\'s temperature and composition.', units:'dimensionless', example:'Flow is generally treated as effectively incompressible below M≈0.3; above M=1 (supersonic), shock waves can form.'},
{id:'weber_number', title:'Weber Number', category:'Fluid Mechanics', eq:'We=\\frac{\\rho v^2L}{\\gamma}', vars:[['We','Weber number (dimensionless)'],['\\rho','fluid density (kg/m³)'],['v','characteristic velocity (m/s)'],['L','characteristic length (m)'],['\\gamma','surface tension (N/m)']],
 derivation:'A dimensionless ratio of inertial to surface-tension forces, obtained from dimensional analysis of flows where droplet or interface breakup is relevant.', assumptions:'Relevant for flows involving free liquid interfaces, such as sprays, jets, and droplet formation.', units:'dimensionless', example:'A high Weber number (inertia dominates) favors droplet breakup in a spray nozzle, while a low Weber number favors surface tension holding droplets intact.'},
{id:'womersley_number', title:'Womersley Number', category:'Fluid Mechanics', eq:'\\alpha=R\\sqrt{\\frac{\\omega\\rho}{\\mu}}', vars:[['\\alpha','Womersley number (dimensionless)'],['R','characteristic radius (e.g. vessel radius, m)'],['\\omega','angular frequency of the oscillating flow (rad/s)'],['\\rho','fluid density (kg/m³)'],['\\mu','dynamic viscosity (Pa·s)']],
 derivation:'A dimensionless ratio of transient (unsteady) inertial forces to viscous forces, arising in the analysis of pulsatile flow in a tube driven by an oscillating pressure gradient.', assumptions:'Oscillatory (periodic) flow in a rigid cylindrical tube.', units:'dimensionless', example:'The Womersley number is widely used in cardiovascular fluid dynamics to characterize how flat or parabolic the pulsatile blood-velocity profile is across large versus small vessels.'},
{id:'vorticity_definition', title:'Vorticity', category:'Fluid Mechanics', eq:'\\vec\\omega=\\nabla\\times\\vec v', vars:[['\\vec\\omega','vorticity vector'],['\\vec v','fluid velocity field']],
 derivation:'Defined directly as the curl of the velocity field, quantifying the local rotation rate of fluid elements.', assumptions:'Well-defined, differentiable velocity field.', units:'s⁻¹', example:'Vorticity is twice the local angular velocity of a fluid parcel, and its concentration into thin regions explains structures like tornadoes and aircraft wingtip vortices.'},
{id:'stream_function_2d', title:'Stream Function (2D Incompressible Flow)', category:'Fluid Mechanics', eq:'u=\\frac{\\partial\\psi}{\\partial y},\\quad v=-\\frac{\\partial\\psi}{\\partial x}', vars:[['u,v','velocity components in the x and y directions'],['\\psi','stream function']],
 derivation:'Defined so that the incompressibility (continuity) condition ∂u/∂x+∂v/∂y=0 is automatically satisfied for any smooth function ψ.', assumptions:'Two-dimensional, incompressible flow.', units:'m²/s', example:'Lines of constant ψ are streamlines of the flow, and the difference in ψ between two streamlines directly gives the volumetric flow rate between them.'},
{id:'velocity_potential_irrotational', title:'Velocity Potential (Irrotational Flow)', category:'Fluid Mechanics', eq:'\\vec v=\\nabla\\phi', vars:[['\\vec v','fluid velocity field'],['\\phi','velocity potential']],
 derivation:'Defined for irrotational flow (∇×v=0), which by a standard vector identity guarantees the velocity field can be written as the gradient of a scalar potential.', assumptions:'Irrotational (vorticity-free) flow.', units:'m²/s', example:'Combined with incompressibility, this reduces the entire flow problem to solving Laplace\'s equation ∇²φ=0, a technique known as potential flow theory.'},
{id:'kutta_joukowski_lift', title:'Kutta–Joukowski Lift Theorem', category:'Fluid Mechanics', eq:"L'=\\rho v\\Gamma", vars:[["L'",'lift force per unit span (N/m)'],['\\rho','fluid density (kg/m³)'],['v','free-stream flow speed (m/s)'],['\\Gamma','circulation around the airfoil (m²/s)']],
 derivation:'Follows from integrating the pressure distribution (via Bernoulli\'s equation) around a 2D airfoil in potential flow with circulation Γ.', assumptions:'Two-dimensional, inviscid, incompressible, irrotational flow outside a thin boundary layer.', units:'N/m (force per unit span)', example:'This theorem is the theoretical foundation for how wings generate lift, with the circulation Γ set physically by the Kutta condition at the trailing edge.'},
{id:'blasius_boundary_layer', title:'Blasius Boundary Layer Thickness', category:'Fluid Mechanics', eq:'\\delta\\approx\\frac{5x}{\\sqrt{Re_x}}', vars:[['\\delta','boundary layer thickness at position x'],['x','distance along the flow direction from the leading edge'],['Re_x','local Reynolds number, Re_x=vx/\\nu']],
 derivation:'An approximate similarity solution of the boundary-layer equations (a simplified form of Navier–Stokes) for steady laminar flow over a flat plate.', assumptions:'Laminar flow over a smooth, flat plate; zero pressure gradient.', units:'metre (m)', example:'This √x growth of the boundary layer explains why laminar skin-friction drag on a flat plate scales as 1/√Re rather than a simple inverse power of length.'},
{id:'manning_equation', title:"Manning's Equation (Open Channel Flow)", category:'Fluid Mechanics', eq:'v=\\frac{1}{n}R_h^{2/3}S^{1/2}', vars:[['v','mean flow velocity (m/s)'],['n','Manning roughness coefficient (empirical, channel-dependent)'],['R_h','hydraulic radius (cross-sectional area / wetted perimeter)'],['S','channel slope (dimensionless, rise/run)']],
 derivation:'An empirical formula for uniform, steady flow in an open channel, relating flow velocity to the channel geometry, slope, and surface roughness.', assumptions:'Uniform (steady, non-accelerating) open-channel flow; fully turbulent regime.', units:'m/s (SI form shown; a unit-dependent coefficient is needed in imperial units)', example:"Manning's equation is the standard tool civil engineers use to size rivers, canals, and storm drains for a target flow capacity."},
{id:'venturi_flow_rate', title:'Venturi Effect (Flow Rate from Pressure Drop)', category:'Fluid Mechanics', eq:'Q=A_2\\sqrt{\\frac{2(P_1-P_2)}{\\rho\\left[1-(A_2/A_1)^2\\right]}}', vars:[['Q','volumetric flow rate (m³/s)'],['A_1,A_2','cross-sectional areas at the wide and narrow sections'],['P_1,P_2','pressures at the wide and narrow sections'],['\\rho','fluid density (kg/m³)']],
 derivation:'Combines the continuity equation (A_1v_1=A_2v_2) with Bernoulli\'s equation between the two sections of a constricted pipe, then solves for the flow rate.', assumptions:'Steady, incompressible, inviscid flow; horizontal pipe (no elevation change).', units:'m³/s', example:'This is the working principle of the Venturi flow meter, which infers flow rate purely from a measured pressure drop across a pipe constriction.'},
{id:'stokes_einstein_relation', title:'Stokes–Einstein Relation', category:'Fluid Mechanics', eq:'D=\\frac{k_BT}{6\\pi\\mu r}', vars:[['D','diffusion coefficient (m²/s)'],['k_B','Boltzmann constant'],['T','absolute temperature (K)'],['\\mu','dynamic viscosity of the fluid (Pa·s)'],['r','radius of the diffusing particle (m)']],
 derivation:'Combines the Einstein relation between diffusion coefficient and particle mobility with Stokes\' law for the drag on a slowly moving sphere.', assumptions:'Spherical particle much larger than the surrounding fluid molecules; low Reynolds number (Stokes drag regime).', units:'m²/s', example:'This relation lets researchers determine the size of nanoparticles or proteins in solution from measurements of their diffusion rate, a technique used in dynamic light scattering.'},

/* ---- Added batch: Astronomy ---- */
{id:'escape_velocity', title:'Escape Velocity', category:'Astronomy', eq:'v_{esc}=\\sqrt{\\frac{2GM}{r}}', vars:[['v_{esc}','escape velocity (m/s)'],['G','gravitational constant'],['M','mass of the central body (kg)'],['r','distance from the center (m)']],
 derivation:'Found by setting the total mechanical energy (kinetic plus gravitational potential) equal to zero for a trajectory that just reaches infinity.', assumptions:'No atmospheric drag; only gravity from the central body considered.', units:'m/s', example:"Earth's surface escape velocity is about 11.2 km/s."},
{id:'orbital_velocity_circular', title:'Circular Orbital Velocity', category:'Astronomy', eq:'v=\\sqrt{\\frac{GM}{r}}', vars:[['v','orbital speed (m/s)'],['G','gravitational constant'],['M','mass of the central body (kg)'],['r','orbital radius (m)']],
 derivation:'Sets gravitational force equal to the required centripetal force for a circular orbit, GMm/r² = mv²/r.', assumptions:'Circular orbit; two-body problem with the central mass dominant.', units:'m/s', example:'The International Space Station orbits at roughly 7.66 km/s at an altitude of about 400 km.'},
{id:'cosmological_redshift', title:'Cosmological Redshift', category:'Astronomy', eq:'1+z=\\frac{\\lambda_{obs}}{\\lambda_{emit}}', vars:[['z','redshift (dimensionless)'],['\\lambda_{obs}','observed wavelength'],['\\lambda_{emit}','emitted (rest-frame) wavelength']],
 derivation:'Defined directly from the fractional stretching of light wavelengths due to the expansion of space between emission and observation.', assumptions:'Applies to cosmological (expansion-driven) redshift; distinct from Doppler or gravitational redshift, though all three share this defining ratio.', units:'dimensionless', example:'The most distant observed galaxies have redshifts z>10, meaning their light has been stretched more than tenfold.'},
 
 {id:'kepler_first_law', title:"Kepler's First Law (Orbit Equation)", category:'Astronomy', eq:'r=\\frac{a(1-e^2)}{1+e\\cos\\theta}', vars:[['r','distance from focus to orbiting body'],['a','semi-major axis'],['e','orbital eccentricity'],['\\theta','true anomaly (angle from periapsis)']],
 derivation:'Solves the two-body gravitational equation of motion, showing that a bound orbit traces a conic section (ellipse) with the central mass at one focus.', assumptions:'Two-body problem; no perturbing forces from other bodies.', units:'metre (m)', example:"This equation describes why planetary orbits are ellipses, not circles, with the Sun at one focus rather than the center."},
{id:'kepler_second_law', title:"Kepler's Second Law (Equal Areas)", category:'Astronomy', eq:'\\frac{dA}{dt}=\\frac{L}{2m}=\\text{const}', vars:[['dA/dt','rate of area swept by the radius vector'],['L','orbital angular momentum'],['m','orbiting body mass']],
 derivation:'Follows directly from conservation of angular momentum in a central-force (gravitational) field, since gravity exerts no torque about the focus.', assumptions:'Central force only (no external torque); two-body problem.', units:'m²/s', example:'A planet moves fastest at perihelion (closest approach) and slowest at aphelion, sweeping equal areas in equal times throughout its orbit.'},
{id:'vis_viva_equation', title:'Vis-Viva Equation', category:'Astronomy', eq:'v^2=GM\\left(\\frac{2}{r}-\\frac{1}{a}\\right)', vars:[['v','orbital speed at distance r'],['G','gravitational constant'],['M','central mass'],['r','current distance from the central body'],['a','semi-major axis of the orbit']],
 derivation:'Follows from combining conservation of energy and conservation of angular momentum for a two-body Keplerian orbit.', assumptions:'Two-body problem; elliptical, parabolic, or hyperbolic orbit (a is negative for hyperbolic orbits).', units:'m/s', example:'This single equation gives a spacecraft\'s speed anywhere along its orbit, and is fundamental to mission trajectory planning.'},
{id:'orbital_period_kepler3', title:"Kepler's Third Law (General Two-Body Form)", category:'Astronomy', eq:'T^2=\\frac{4\\pi^2a^3}{G(M_1+M_2)}', vars:[['T','orbital period'],['a','semi-major axis of the relative orbit'],['G','gravitational constant'],['M_1,M_2','masses of the two orbiting bodies']],
 derivation:'Generalizes the simple Kepler third-law formula to account for both masses via the reduced two-body problem, rather than assuming one mass dominates.', assumptions:'Isolated two-body system; Newtonian gravity.', units:'second (s)', example:'This form is essential for binary star systems, where neither star\'s mass can be neglected relative to the other.'},
{id:'stellar_parallax_distance', title:'Stellar Parallax Distance', category:'Astronomy', eq:'d(\\text{pc})=\\frac{1}{p(\\text{arcsec})}', vars:[['d','distance to the star in parsecs'],['p','measured parallax angle in arcseconds']],
 derivation:'Follows from the geometric definition of the parsec itself: the distance at which 1 AU subtends exactly 1 arcsecond.', assumptions:'Small-angle approximation (valid for all measurable stellar parallaxes); baseline is Earth\'s orbital diameter (1 AU radius).', units:'parsec (pc)', example:'The nearest star system, Alpha Centauri, has a parallax of about 0.75 arcsec, giving a distance of roughly 1.3 pc (4.24 ly).'},
{id:'distance_modulus', title:'Distance Modulus', category:'Astronomy', eq:'m-M=5\\log_{10}(d)-5', vars:[['m','apparent magnitude'],['M','absolute magnitude'],['d','distance in parsecs']],
 derivation:'Follows from the inverse-square law for light intensity combined with the logarithmic definition of the magnitude scale.', assumptions:'No interstellar extinction (dust absorption); d measured in parsecs.', units:'dimensionless (magnitudes) for m−M; parsec for d', example:'A distance modulus of 5 corresponds to a distance of exactly 100 pc.'},
{id:'apparent_magnitude_flux', title:'Apparent Magnitude from Flux Ratio', category:'Astronomy', eq:'m_1-m_2=-2.5\\log_{10}\\left(\\frac{F_1}{F_2}\\right)', vars:[['m_1,m_2','apparent magnitudes of two objects'],['F_1,F_2','observed flux (brightness) of the two objects']],
 derivation:'Defined so that a magnitude difference of 5 corresponds to exactly a factor of 100 in flux, matching the historical Pogson magnitude scale.', assumptions:'Same photometric band/filter for both objects.', units:'dimensionless (magnitudes)', example:'A star that is 100 times brighter than another has an apparent magnitude exactly 5 less (magnitudes run backwards — smaller/negative means brighter).'},
{id:'luminosity_flux_relation', title:'Luminosity–Flux Relation (Inverse Square Law)', category:'Astronomy', eq:'F=\\frac{L}{4\\pi d^2}', vars:[['F','observed flux (W/m²)'],['L','intrinsic luminosity of the source (W)'],['d','distance to the source (m)']],
 derivation:'Follows from conservation of energy: the total luminosity spreads isotropically over an expanding spherical shell of area 4πd².', assumptions:'Isotropic emission; no absorption or scattering along the line of sight.', units:'W/m²', example:'This relation lets astronomers infer a star\'s luminosity from its measured brightness and independently known distance, or vice versa.'},
{id:'stefan_boltzmann_stellar', title:'Stellar Luminosity (Stefan–Boltzmann)', category:'Astronomy', eq:'L=4\\pi R^2\\sigma T_{eff}^4', vars:[['L','stellar luminosity (W)'],['R','stellar radius (m)'],['\\sigma','Stefan–Boltzmann constant'],['T_{eff}','effective surface temperature (K)']],
 derivation:'Treats the star as a blackbody emitter, applying the Stefan–Boltzmann law to its total surface area.', assumptions:'Star approximated as a perfect blackbody emitter at a single effective temperature.', units:'watt (W)', example:'This relation underlies the Hertzsprung–Russell diagram, connecting a star\'s size, temperature, and luminosity.'},
{id:'jeans_mass_collapse', title:'Jeans Mass (Gravitational Collapse Criterion)', category:'Astronomy', eq:'M_J\\approx\\left(\\frac{5k_BT}{G\\mu m_H}\\right)^{3/2}\\left(\\frac{3}{4\\pi\\rho}\\right)^{1/2}', vars:[['M_J','Jeans mass — minimum mass for gravitational collapse'],['k_B','Boltzmann constant'],['T','gas temperature (K)'],['G','gravitational constant'],['\\mu','mean molecular weight'],['m_H','hydrogen atom mass'],['\\rho','gas cloud density']],
 derivation:'Balances the gravitational potential energy of a gas cloud against its internal thermal (pressure) energy, following the virial theorem, to find the critical mass above which collapse overwhelms pressure support.', assumptions:'Uniform-density, roughly spherical gas cloud; simplified virial argument (real star formation involves additional physics like rotation, magnetic fields, and turbulence).', units:'kilogram (kg), often expressed in solar masses', example:'Colder, denser molecular clouds have a lower Jeans mass, explaining why star formation is favored in cold, dense interstellar gas.'},
{id:'chandrasekhar_mass_limit', title:'Chandrasekhar Mass Limit', category:'Astronomy', eq:'M_{Ch}\\approx1.4\\,M_\\odot', vars:[['M_{Ch}','Chandrasekhar mass limit'],['M_\\odot','solar mass']],
 derivation:'Found by balancing electron degeneracy pressure against gravitational collapse for a relativistic degenerate electron gas, showing that above this mass, degeneracy pressure alone cannot support the star.', assumptions:'Non-rotating white dwarf; composition dominated by carbon-oxygen (affects the precise numerical value).', units:'solar masses (M_☉)', example:'White dwarfs approaching this limit, often via mass accretion from a companion star, can undergo a Type Ia supernova.'},
{id:'tolman_oppenheimer_volkoff', title:'Tolman–Oppenheimer–Volkoff (TOV) Mass Limit', category:'Astronomy', eq:'M_{TOV}\\approx2\\text{–}3\\,M_\\odot', vars:[['M_{TOV}','maximum neutron star mass before collapse to a black hole'],['M_\\odot','solar mass']],
 derivation:'Follows from solving the general-relativistic hydrostatic equilibrium (TOV) equation for a neutron star supported by neutron degeneracy pressure, analogous to the Chandrasekhar limit but requiring general relativity.', assumptions:'The exact value depends on the poorly-constrained neutron star equation of state, hence the quoted range.', units:'solar masses (M_☉)', example:'Neutron stars exceeding this mass cannot be supported by neutron degeneracy pressure and are expected to collapse into black holes.'},
{id:'eddington_luminosity', title:'Eddington Luminosity', category:'Astronomy', eq:'L_{Edd}=\\frac{4\\pi GMm_pc}{\\sigma_T}', vars:[['L_{Edd}','Eddington luminosity — maximum stable luminosity'],['G','gravitational constant'],['M','mass of the star or accreting object'],['m_p','proton mass'],['c','speed of light'],['\\sigma_T','Thomson scattering cross section']],
 derivation:'Found by balancing outward radiation pressure force on ionized gas (via Thomson scattering off free electrons, dragging protons along) against inward gravitational force.', assumptions:'Spherically symmetric, fully ionized hydrogen gas; radiation pressure dominated by electron (Thomson) scattering.', units:'watt (W)', example:'Accreting black holes and massive stars radiating near their Eddington luminosity drive strong outflows and winds, self-limiting further growth.'},
{id:'schwarzschild_radius_astro', title:'Schwarzschild Radius (Black Hole Event Horizon)', category:'Astronomy', eq:'r_s=\\frac{2GM}{c^2}', vars:[['r_s','Schwarzschild radius (event horizon radius)'],['G','gravitational constant'],['M','mass of the black hole'],['c','speed of light']],
 derivation:'Derived from the Schwarzschild solution to Einstein\'s field equations for a non-rotating, uncharged spherical mass.', assumptions:'Non-rotating, uncharged (Schwarzschild) black hole.', units:'metre (m)', example:'A black hole with the mass of the Sun has a Schwarzschild radius of only about 3 km.'},
{id:'habitable_zone_distance', title:'Habitable Zone Distance (Simplified)', category:'Astronomy', eq:'d=\\sqrt{\\frac{L}{L_\\odot}}\\,\\text{AU}', vars:[['d','approximate distance for Earth-like insolation (AU)'],['L','luminosity of the host star'],['L_\\odot','solar luminosity']],
 derivation:'Follows from the inverse-square law, scaling the 1 AU Earth-Sun reference distance by the square root of the star\'s luminosity relative to the Sun\'s.', assumptions:'Simplified single-parameter estimate; a real habitable zone calculation also accounts for stellar spectral type and atmospheric greenhouse effects.', units:'astronomical units (AU)', example:'A star with 4 times the Sun\'s luminosity would have its equivalent "Earth-like" orbital distance at 2 AU rather than 1 AU.'},
{id:'transit_depth_exoplanet', title:'Transit Depth (Exoplanet Detection)', category:'Astronomy', eq:'\\frac{\\Delta F}{F}=\\left(\\frac{R_p}{R_\\star}\\right)^2', vars:[['\\Delta F/F','fractional dip in observed stellar brightness'],['R_p','planet radius'],['R_\\star','star radius']],
 derivation:'Follows from the simple geometric blocking of stellar light by the planet\'s silhouette as it crosses in front of the star, as a fraction of the star\'s projected disk area.', assumptions:'Planet fully transits the stellar disk; uniform stellar brightness (ignoring limb darkening).', units:'dimensionless (fractional flux)', example:'Jupiter transiting the Sun would produce a brightness dip of about 1%, while Earth would produce only about 0.008%.'},
{id:'radial_velocity_semi_amplitude', title:'Radial Velocity Semi-Amplitude (Exoplanet Detection)', category:'Astronomy', eq:'K=\\left(\\frac{2\\pi G}{T}\\right)^{1/3}\\frac{m_p\\sin i}{(M_\\star+m_p)^{2/3}}\\frac{1}{\\sqrt{1-e^2}}', vars:[['K','radial velocity semi-amplitude of the star'],['T','orbital period'],['m_p','planet mass'],['i','orbital inclination'],['M_\\star','star mass'],['e','orbital eccentricity']],
 derivation:'Follows from the two-body orbital solution, projecting the star\'s reflex orbital velocity (due to the planet\'s gravitational pull) onto the observer\'s line of sight.', assumptions:'Two-body Keplerian orbit; m_p ≪ M_star (common approximation).', units:'m/s', example:'Jupiter induces a radial velocity wobble of about 12.5 m/s on the Sun, detectable with precision spectroscopy — the method used in many exoplanet discoveries.'},
{id:'hubble_law_distance', title:"Hubble's Law", category:'Astronomy', eq:'v=H_0d', vars:[['v','recession velocity of a distant galaxy'],['H_0','Hubble constant'],['d','proper distance to the galaxy']],
 derivation:'An empirical linear relationship discovered by Edwin Hubble between a galaxy\'s redshift-inferred recession velocity and its distance, later explained by the expansion of space in general relativity.', assumptions:'Valid at cosmological distances where local (peculiar) velocities are small compared to the Hubble flow.', units:'km/s for v (with H_0 in km/s/Mpc and d in Mpc)', example:'A galaxy 100 Mpc away, with H_0≈70 km/s/Mpc, recedes at roughly 7000 km/s due to cosmic expansion.'},
{id:'critical_density_universe', title:'Critical Density of the Universe', category:'Astronomy', eq:'\\rho_c=\\frac{3H_0^2}{8\\pi G}', vars:[['\\rho_c','critical density'],['H_0','Hubble constant'],['G','gravitational constant']],
 derivation:'Follows from setting the total energy of a homogeneous, isotropic expanding universe (in the Friedmann equation) to exactly zero — the boundary between eventual recollapse and unbounded expansion.', assumptions:'Homogeneous, isotropic universe (cosmological principle); Friedmann-Lemaître-Robertson-Walker (FLRW) metric.', units:'kg/m³', example:'Current measurements put the universe\'s actual density very close to ρ_c, consistent with a spatially flat universe.'},
{id:'age_of_universe_estimate', title:'Age of the Universe (Hubble Time Estimate)', category:'Astronomy', eq:'t_0\\approx\\frac{1}{H_0}', vars:[['t_0','approximate age of the universe (Hubble time)'],['H_0','Hubble constant']],
 derivation:'A simple order-of-magnitude estimate obtained by extrapolating the current expansion rate backward in time as if it were constant, ignoring the effects of matter, radiation, and dark energy on the expansion history.', assumptions:'Extremely simplified — assumes constant expansion rate; the real age requires integrating the full Friedmann equation with the universe\'s matter/energy content.', units:'second (s), commonly converted to billions of years', example:'For H_0≈70 km/s/Mpc, this rough estimate gives about 14 billion years, close to (but not exactly) the precisely modeled age of 13.8 billion years.'},
{id:'proper_motion_transverse_velocity', title:'Transverse Velocity from Proper Motion', category:'Astronomy', eq:'v_t=4.74\\,\\mu\\,d', vars:[['v_t','transverse velocity (km/s)'],['\\mu','proper motion (arcsec/year)'],['d','distance (parsecs)']],
 derivation:'Converts the angular rate of a star\'s motion across the sky into a physical velocity, using the geometric relationship between parsecs, arcseconds, and years, with 4.74 arising from unit conversion factors (km per AU per year per radian).', assumptions:'Known distance d; proper motion measured perpendicular to the line of sight.', units:'km/s', example:'Barnard\'s Star, with an unusually large proper motion, has a transverse velocity of about 90 km/s relative to the Sun.'},

/* ---- Added batch: Chemistry ---- */
{id:'ph_definition', title:'pH of a Solution', category:'Chemistry', eq:'pH=-\\log_{10}[H^+]', vars:[['pH','acidity measure (dimensionless)'],['[H^+]','hydrogen ion concentration (mol/L)']],
 derivation:'A logarithmic scale defined to compress the very wide range of hydrogen ion concentrations found in aqueous solutions into a manageable numeric range.', assumptions:'Dilute aqueous solution; ideal behavior (activity ≈ concentration).', units:'dimensionless', example:'Pure water at 25 °C has [H⁺]=10⁻⁷ mol/L, giving pH=7 (neutral).'},
{id:'henderson_hasselbalch', title:'Henderson–Hasselbalch Equation', category:'Chemistry', eq:'pH=pK_a+\\log_{10}\\frac{[A^-]}{[HA]}', vars:[['pH','solution acidity'],['pK_a','acid dissociation constant (−log₁₀Kₐ)'],['[A^-]','conjugate base concentration'],['[HA]','weak acid concentration']],
 derivation:'Rearranges the acid dissociation equilibrium expression Ka=[H⁺][A⁻]/[HA] and takes the base-10 logarithm of both sides.', assumptions:'Weak acid/conjugate base buffer system; dilute solution.', units:'dimensionless (pH units)', example:'A buffer with equal concentrations of acid and conjugate base has pH = pKₐ exactly.'},
{id:'nernst_equation', title:'Nernst Equation', category:'Chemistry', eq:'E=E^\\circ-\\frac{RT}{nF}\\ln Q', vars:[['E','cell potential under given conditions (V)'],['E^\\circ','standard cell potential (V)'],['n','number of electrons transferred'],['F','Faraday constant'],['Q','reaction quotient']],
 derivation:'Derived from the relationship between Gibbs free energy and cell potential, ΔG=−nFE, combined with the general expression for ΔG at non-standard conditions.', assumptions:'Electrochemical cell at a given temperature T; reaction quotient Q well defined.', units:'volt (V)', example:'The Nernst equation explains why battery voltage depends on the concentrations of reactants and products, not just their identities.'},
{id:'beer_lambert_law', title:'Beer–Lambert Law', category:'Chemistry', eq:'A=\\varepsilon c\\ell', vars:[['A','absorbance (dimensionless)'],['\\varepsilon','molar absorptivity (L/(mol·cm))'],['c','concentration (mol/L)'],['\\ell','path length through the sample (cm)']],
 derivation:'Follows from the exponential attenuation of light intensity passing through an absorbing medium, I=I_0 10^{-\\varepsilon c\\ell}, expressed logarithmically.', assumptions:'Dilute solution (no significant scattering or concentration-dependent interactions); monochromatic light.', units:'dimensionless (absorbance)', example:'Beer–Lambert absorbance measurements are the basis of routine spectrophotometric concentration determination in chemistry labs.'},
{id:'vant_hoff_equation', title:"van't Hoff Equation", category:'Chemistry', eq:'\\ln\\frac{K_2}{K_1}=-\\frac{\\Delta H^\\circ}{R}\\left(\\frac{1}{T_2}-\\frac{1}{T_1}\\right)', vars:[['K_1,K_2','equilibrium constants at temperatures T_1, T_2'],['\\Delta H^\\circ','standard reaction enthalpy'],['R','gas constant']],
 derivation:'Integrates the temperature dependence of the equilibrium constant, d(\\ln K)/dT = ΔH°/(RT²), between two temperatures assuming ΔH° is roughly constant over that range.', assumptions:'ΔH° approximately independent of temperature over the interval considered.', units:'dimensionless (ratio of K values)', example:'Used to predict how a reaction\'s equilibrium constant shifts with temperature, consistent with Le Chatelier\'s principle for exothermic/endothermic reactions.'},

{id:'molarity_concentration', title:'Molarity', category:'Chemistry', eq:'M=\\frac{n}{V}', vars:[['M','molarity (mol/L)'],['n','moles of solute (mol)'],['V','volume of solution (L)']],
 derivation:'Defined directly as the number of moles of solute per litre of solution.', assumptions:'Homogeneous solution; volume measured at a specified temperature (solution volume changes slightly with T).', units:'mol/L (M)', example:'Dissolving 2 mol of NaCl in 4 L of solution gives a 0.5 M solution.'},
{id:'dilution_equation', title:'Dilution Equation', category:'Chemistry', eq:'M_1V_1=M_2V_2', vars:[['M_1,V_1','initial concentration and volume'],['M_2,V_2','final concentration and volume']],
 derivation:'Follows from conservation of moles of solute: n=M_1V_1 before dilution equals n=M_2V_2 after, since only solvent is added.', assumptions:'No solute added or removed, only solvent; ideal mixing.', units:'consistent M and V units', example:'Diluting 50 mL of a 2 M stock solution to 4 M... solving for final volume: 200 mL yields 0.5 M.'},
{id:'mole_fraction', title:'Mole Fraction', category:'Chemistry', eq:'x_i=\\frac{n_i}{n_{total}}', vars:[['x_i','mole fraction of component i (dimensionless)'],['n_i','moles of component i'],['n_{total}','total moles of all components']],
 derivation:'Defined as the ratio of moles of one component to the total moles present in a mixture.', assumptions:'Well-mixed, homogeneous mixture; all mole fractions sum to 1.', units:'dimensionless', example:'A mixture of 2 mol N₂ and 8 mol O₂ has a mole fraction of N₂ equal to 0.2.'},
{id:'combined_gas_law', title:'Combined Gas Law', category:'Chemistry', eq:'\\frac{P_1V_1}{T_1}=\\frac{P_2V_2}{T_2}', vars:[['P_1,V_1,T_1','initial pressure, volume, temperature'],['P_2,V_2,T_2','final pressure, volume, temperature']],
 derivation:'Combines Boyle\'s, Charles\'s, and Gay-Lussac\'s laws into a single relation for a fixed amount of ideal gas.', assumptions:'Fixed amount of ideal gas (n constant); temperature in kelvin.', units:'consistent P, V, T units', example:'Heating a fixed gas sample from 300 K to 600 K at constant volume doubles its pressure.'},
{id:'daltons_law_partial_pressure', title:"Dalton's Law of Partial Pressures", category:'Chemistry', eq:'P_{total}=\\sum_iP_i', vars:[['P_{total}','total pressure of the gas mixture'],['P_i','partial pressure of component i']],
 derivation:'Follows from the ideal gas law applied to each component independently, since ideal gas molecules do not interact.', assumptions:'Ideal gas mixture; each gas behaves independently.', units:'pascal (Pa) or atm', example:'A mixture with O₂ at 0.3 atm and N₂ at 0.7 atm has a total pressure of 1.0 atm.'},
{id:'molar_mass_from_gas_density', title:'Molar Mass from Gas Density', category:'Chemistry', eq:'M=\\frac{dRT}{P}', vars:[['M','molar mass (kg/mol)'],['d','gas density (kg/m³)'],['R','gas constant'],['T','temperature (K)'],['P','pressure (Pa)']],
 derivation:'Substitutes n=m/M and ρ=m/V into the ideal gas law PV=nRT and rearranges for M.', assumptions:'Ideal gas behavior.', units:'kg/mol (or g/mol with consistent units)', example:'Measuring a gas\'s density at known T and P lets you identify an unknown gas by its molar mass.'},
{id:'grahams_law_effusion', title:"Graham's Law of Effusion", category:'Chemistry', eq:'\\frac{rate_1}{rate_2}=\\sqrt{\\frac{M_2}{M_1}}', vars:[['rate_1,rate_2','effusion rates of gases 1 and 2'],['M_1,M_2','molar masses of gases 1 and 2']],
 derivation:'Follows from kinetic molecular theory: at a given temperature, lighter molecules have higher average speeds, effusing faster.', assumptions:'Effusion through a small orifice; both gases at the same temperature and pressure.', units:'dimensionless (ratio)', example:'Helium (M=4) effuses about 2.7 times faster than CO₂ (M=44).'},
{id:'rate_law_general', title:'General Rate Law', category:'Chemistry', eq:'rate=k[A]^m[B]^n', vars:[['rate','reaction rate'],['k','rate constant'],['[A],[B]','reactant concentrations'],['m,n','reaction orders (determined experimentally)']],
 derivation:'An empirical expression relating reaction rate to reactant concentrations, with orders determined by experiment rather than stoichiometry.', assumptions:'m and n are not necessarily equal to the stoichiometric coefficients.', units:'depends on overall order', example:'For rate=k[A]²[B], the reaction is second order in A, first order in B, third order overall.'},
{id:'integrated_rate_law_zero_order', title:'Zero-Order Integrated Rate Law', category:'Chemistry', eq:'[A]=[A]_0-kt', vars:[['[A]','concentration at time t'],['[A]_0','initial concentration'],['k','rate constant'],['t','time']],
 derivation:'Integrates the zero-order differential rate law d[A]/dt=-k directly with respect to time.', assumptions:'Reaction rate independent of [A] (zero order).', units:'mol/(L·s) for k', example:'A plot of [A] vs. t is linear for a zero-order reaction, with slope -k.'},
{id:'integrated_rate_law_first_order', title:'First-Order Integrated Rate Law', category:'Chemistry', eq:'\\ln[A]=\\ln[A]_0-kt', vars:[['[A]','concentration at time t'],['[A]_0','initial concentration'],['k','rate constant (s⁻¹)'],['t','time']],
 derivation:'Integrates the first-order differential rate law d[A]/dt=-k[A] with respect to time.', assumptions:'Reaction rate directly proportional to [A] (first order).', units:'s⁻¹ for k', example:'Radioactive decay and many unimolecular reactions follow this exact form.'},
{id:'half_life_first_order_chem', title:'Half-Life (First-Order Reaction)', category:'Chemistry', eq:'t_{1/2}=\\frac{\\ln2}{k}', vars:[['t_{1/2}','half-life'],['k','rate constant (s⁻¹)']],
 derivation:'Solves the first-order integrated rate law for the time at which [A]=[A]_0/2.', assumptions:'First-order kinetics; unlike zero- or second-order reactions, t½ is independent of [A]_0.', units:'second (s)', example:'A reaction with k=0.02 s⁻¹ has a half-life of about 34.7 s.'},
{id:'integrated_rate_law_second_order', title:'Second-Order Integrated Rate Law', category:'Chemistry', eq:'\\frac{1}{[A]}=\\frac{1}{[A]_0}+kt', vars:[['[A]','concentration at time t'],['[A]_0','initial concentration'],['k','rate constant (L/(mol·s))'],['t','time']],
 derivation:'Integrates the second-order differential rate law d[A]/dt=-k[A]² with respect to time.', assumptions:'Reaction rate proportional to [A]² (second order in a single reactant).', units:'L/(mol·s) for k', example:'A plot of 1/[A] vs. t is linear for a second-order reaction, with slope k.'},
{id:'equilibrium_constant_kc', title:'Equilibrium Constant Expression', category:'Chemistry', eq:'K_c=\\frac{[C]^c[D]^d}{[A]^a[B]^b}', vars:[['K_c','equilibrium constant (concentration basis)'],['[A],[B],[C],[D]','equilibrium concentrations'],['a,b,c,d','stoichiometric coefficients']],
 derivation:'Follows from equating forward and reverse reaction rates at equilibrium for the general reaction aA+bB⇌cC+dD.', assumptions:'System at chemical equilibrium; dilute or ideal solution behavior.', units:'depends on reaction stoichiometry', example:'A large K_c favors products at equilibrium; a small K_c favors reactants.'},
{id:'gibbs_free_energy_equilibrium', title:'Gibbs Free Energy and Equilibrium Constant', category:'Chemistry', eq:'\\Delta G^\\circ=-RT\\ln K', vars:[['\\Delta G^\\circ','standard Gibbs free energy change'],['R','gas constant'],['T','absolute temperature (K)'],['K','equilibrium constant']],
 derivation:'Follows from the relationship between the standard reaction free energy and the reaction quotient at equilibrium, where ΔG=0.', assumptions:'Standard-state reference conditions; K is unitless (activity-based).', units:'joule (J) or kJ/mol', example:'A negative ΔG° (spontaneous under standard conditions) corresponds to K>1.'},
{id:'osmotic_pressure', title:'Osmotic Pressure (van\'t Hoff Equation for Solutions)', category:'Chemistry', eq:'\\Pi=iMRT', vars:[['\\Pi','osmotic pressure (atm or Pa)'],['i','van\'t Hoff factor (ions per formula unit)'],['M','molar concentration (mol/L)'],['R','gas constant'],['T','absolute temperature (K)']],
 derivation:'Derived by analogy with the ideal gas law, treating dissolved solute particles as behaving like an ideal gas confined by a semipermeable membrane.', assumptions:'Dilute (ideal) solution; i accounts for dissociation (e.g. i=2 for NaCl).', units:'atm or Pa', example:'A 0.1 M NaCl solution (i≈2) at 25°C has an osmotic pressure of about 4.9 atm.'},
{id:'freezing_point_depression', title:'Freezing Point Depression', category:'Chemistry', eq:'\\Delta T_f=iK_fm', vars:[['\\Delta T_f','freezing point depression (°C)'],['i','van\'t Hoff factor'],['K_f','molal freezing-point depression constant'],['m','molality (mol/kg)']],
 derivation:'A colligative property arising from the reduction of solvent chemical potential by dissolved solute, derived from solution thermodynamics.', assumptions:'Dilute (ideal) solution; K_f is solvent-specific.', units:'°C (or K)', example:'Salt lowers water\'s freezing point below 0°C, which is why it\'s used to de-ice roads.'},
{id:'boiling_point_elevation', title:'Boiling Point Elevation', category:'Chemistry', eq:'\\Delta T_b=iK_bm', vars:[['\\Delta T_b','boiling point elevation (°C)'],['i','van\'t Hoff factor'],['K_b','molal boiling-point elevation constant'],['m','molality (mol/kg)']],
 derivation:'A colligative property analogous to freezing-point depression, arising from the reduced vapor pressure of the solution.', assumptions:'Dilute (ideal) solution; K_b is solvent-specific.', units:'°C (or K)', example:'Adding solute to water raises its boiling point above 100°C, proportional to the solute\'s molality.'},
{id:'raoults_law', title:"Raoult's Law", category:'Chemistry', eq:'P_{solution}=X_{solvent}P^\\circ_{solvent}', vars:[['P_{solution}','vapor pressure of the solution'],['X_{solvent}','mole fraction of solvent'],['P^\\circ_{solvent}','vapor pressure of the pure solvent']],
 derivation:'Assumes the escaping tendency of solvent molecules is simply proportional to their mole fraction at the surface.', assumptions:'Ideal solution (solute-solvent interactions similar to solvent-solvent); non-volatile solute (simplest case).', units:'pascal (Pa) or atm', example:'Adding a non-volatile solute lowers a solvent\'s vapor pressure proportionally to its mole fraction.'},
{id:'percent_yield', title:'Percent Yield', category:'Chemistry', eq:'\\%\\,yield=\\frac{\\text{actual yield}}{\\text{theoretical yield}}\\times100', vars:[['actual yield','mass or moles of product actually obtained'],['theoretical yield','maximum possible product predicted by stoichiometry']],
 derivation:'A direct ratio comparing experimentally obtained product to the stoichiometrically predicted maximum, expressed as a percentage.', assumptions:'Theoretical yield calculated from the limiting reagent.', units:'% (dimensionless)', example:'Obtaining 8.5 g of product when 10 g was theoretically possible gives an 85% yield.'},
{id:'water_autoionization_kw', title:'Water Autoionization Constant', category:'Chemistry', eq:'K_w=[H^+][OH^-]=1.0\\times10^{-14}', vars:[['K_w','water autoionization constant (at 25°C)'],['[H^+]','hydrogen ion concentration (mol/L)'],['[OH^-]','hydroxide ion concentration (mol/L)']],
 derivation:'Follows from the equilibrium constant expression for the self-ionization reaction 2H₂O⇌H₃O⁺+OH⁻.', assumptions:'Pure water or dilute aqueous solution at 25°C (K_w varies with temperature).', units:'mol²/L² (dimensionless as commonly quoted)', example:'In neutral water, [H⁺]=[OH⁻]=1.0×10⁻⁷ M, giving pH=pOH=7.'},

let readoutTimer = null, readoutRotate = null;
function startReadoutAnimation(){
  clearInterval(readoutTimer); clearInterval(readoutRotate);
  let idx = CONSTANTS.indexOf(CONSTANTS.find(c=>document.getElementById('rSymbol') && document.getElementById('rSymbol').textContent===c.symbol));
  if(idx<0) idx = 0;
  function typeValue(){
    const cst = CONSTANTS[idx];
    const target = formatSci(cst.value);
    const valEl = document.getElementById('rValue');
    if(!valEl) return;
    let i=0;
    valEl.textContent='';
    clearInterval(readoutTimer);
    readoutTimer = setInterval(()=>{
      if(i>target.length){ clearInterval(readoutTimer); return; }
      valEl.textContent = target.slice(0,i) + (i<target.length? '▌':'');
      i++;
    }, 18);
  }
  typeValue();
  readoutRotate = setInterval(()=>{
    if(!document.getElementById('rSymbol')){ clearInterval(readoutRotate); return; }
    idx = (idx+1) % CONSTANTS.length;
    const cst = CONSTANTS[idx];
    document.getElementById('rSymbol').textContent = cst.symbol;
    document.getElementById('rName').textContent = cst.name;
    document.getElementById('rUnit').textContent = cst.unit;
    document.getElementById('rField').textContent = cst.field;
    typeValue();
  }, 3600);
}

function formatSci(v){
  if(v===0) return '0';
  const s = v.toExponential(6);
  const [mant, exp] = s.split('e');
  const expNum = parseInt(exp,10);
  return `${mant} × 10${toSuperscript(expNum)}`;
}
function toSuperscript(n){
  const map = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  return String(n).split('').map(ch=>map[ch]||ch).join('');
}

function paintConstants(){

    items = items.filter(c=> c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q) || c.field.toLowerCase().includes(q));
  }
  if(items.length===0){ list.innerHTML = emptyState('No constants match your search.'); return; }
  list.innerHTML = items.map(c=> constRowHTML(c)).join('');
  list.querySelectorAll('.const-row').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('.js-expand').addEventListener('click', ()=>{

    row.querySelector('.js-fav').addEventListener('click', (e)=>{

    }));
  });

function convertValue(catKey, value, fromS, toS){
  const cat = UNIT_CATEGORIES[catKey];
  if(cat.special && catKey==='temperature'){
    const toK = {'°C':(x)=>x+273.15,'K':(x)=>x,'°F':(x)=>(x-32)*5/9+273.15,'°R':(x)=>x*5/9};
    const fromK = {'°C':(x)=>x-273.15,'K':(x)=>x,'°F':(x)=>(x-273.15)*9/5+32,'°R':(x)=>x*9/5};
    const k = toK[fromS](value);
    return fromK[toS](k);
  }
  const fromUnit = cat.units.find(u=>u.s===fromS), toUnit = cat.units.find(u=>u.s===toS);
  if(!fromUnit||!toUnit) return NaN;
  if(fromUnit.f===-1 || toUnit.f===-1){
    // inverse relationship (e.g. L/100km)
    const base = fromUnit.f===-1 ? (100/value) : value*fromUnit.f;
    return toUnit.f===-1 ? (100/base) : base/toUnit.f;
  }
  const base = value * fromUnit.f;
  return base / toUnit.f;
}

function handleCalcKey(k){
  const exprEl = document.getElementById('calcExprEl'), outEl = document.getElementById('calcOutEl');
  if(k==='C'){ calcExpr=''; outEl.textContent='0'; exprEl.textContent='\u00a0'; return; }

  if(k==='MR'){ calcExpr += String(calcMemory); outEl.textContent = calcExpr; return; }
  if(k==='MS'){ calcMemory = safeEval(calcExpr)||0; toast('Stored to memory'); return; }
  if(k==='M+'){ calcMemory += safeEval(calcExpr)||0; toast('Added to memory'); return; }
  if(k==='M-'){ calcMemory -= safeEval(calcExpr)||0; toast('Subtracted from memory'); return; }
  if(k==='='){
    const val = safeEval(calcExpr);
    exprEl.textContent = calcExpr + ' =';
    outEl.textContent = Number.isFinite(val) ? trimNum(val) : 'Error';
    addHistory('calculation', `${calcExpr} = ${Number.isFinite(val)?trimNum(val):'Error'}`);
    calcExpr = Number.isFinite(val) ? String(val) : '';
    return;
  }
  const map = {'÷':'/', '×':'*', '−':'-', 'π':'PI', 'e':'E', '√':'sqrt(', 'x²':'^2', 'x^y':'^', 'n!':'!', '%':'/100'};
  let token = map[k] !== undefined ? map[k] : k;

  if(k==='rand') token = String(Math.random());
  calcExpr += token;
  outEl.textContent = calcExpr;
}
function safeEval(expr){
  if(!expr) return NaN;
  try{
    let e = expr.replace(/PI/g,'Math.PI').replace(/E/g,'Math.E')
      .replace(/\basin\(/g,'Math.asin(').replace(/\bacos\(/g,'Math.acos(').replace(/\batan\(/g,'Math.atan(')
      .replace(/\bsinh\(/g,'Math.sinh(').replace(/\bcosh\(/g,'Math.cosh(').replace(/\btanh\(/g,'Math.tanh(')
      .replace(/\bsin\(/g,'Math.sin(').replace(/\bcos\(/g,'Math.cos(').replace(/\btan\(/g,'Math.tan(')
      .replace(/\bln\(/g,'Math.log(').replace(/\blog\(/g,'Math.log10(').replace(/\bsqrt\(/g,'Math.sqrt(')
      .replace(/\^/g,'**');
    // handle factorial n!
    e = e.replace(/(\d+(\.\d+)?)!/g, (m,n)=> String(factorial(parseFloat(n))));
    // eslint-disable-next-line no-new-func
    const fn = new Function('return (' + e + ')');
    return fn();
  }catch(err){ return NaN; }
}
function factorial(n){ if(n<0||!Number.isInteger(n)) return NaN; let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
function parseComplex(s){ const m = s.replace(/\s/g,'').match(/^(-?\d*\.?\d*)?([+-]\d*\.?\d*)i$|^(-?\d*\.?\d+)$|^(-?\d*\.?\d*)i$/);
  // simplified parse: split on last + or - that precedes an i
  let re=0, im=0; const str = s.replace(/\s/g,'');
  const match = str.match(/^([+-]?\d*\.?\d+)?([+-]\d*\.?\d+)i$/) || str.match(/^([+-]?\d*\.?\d+)i$/);
  if(str.includes('i')){
    const mm = str.match(/^([+-]?\d*\.?\d*)?([+-]\d*\.?\d*)i$/);
    if(mm){ re = parseFloat(mm[1]||'0')||0; let imStr = mm[2]; if(imStr==='+'||imStr==='') imStr='1'; if(imStr==='-') imStr='-1'; im = parseFloat(imStr); }
    else { const mm2 = str.match(/^([+-]?\d*\.?\d*)i$/); if(mm2){ let imStr=mm2[1]; if(imStr===''||imStr==='+') imStr='1'; if(imStr==='-') imStr='-1'; im=parseFloat(imStr); } }
  } else { re = parseFloat(str)||0; }
  return {re, im};
}
function cxOp(op){
  const a = parseComplex(document.getElementById('cxA').value||'0');
  const b = parseComplex(document.getElementById('cxB').value||'0');
  let r;
  if(op==='+') r = {re:a.re+b.re, im:a.im+b.im};
  if(op==='-') r = {re:a.re-b.re, im:a.im-b.im};
  if(op==='*') r = {re:a.re*b.re-a.im*b.im, im:a.re*b.im+a.im*b.re};
  if(op==='/'){ const denom=b.re*b.re+b.im*b.im; r={re:(a.re*b.re+a.im*b.im)/denom, im:(a.im*b.re-a.re*b.im)/denom}; }
  document.getElementById('cxResult').textContent = `= ${trimNum(r.re)} ${r.im>=0?'+':'-'} ${trimNum(Math.abs(r.im))}i`;
}

function matInverse(){

function combinatorics(type){

}

function formatEngineering(v){
  if(v===0) return '0';

  const mant = v/Math.pow(10,exp);

}

function renderSigfigs(){
  const v = document.getElementById('view-sigfigs');
  v.innerHTML = `
    <div class="page-head">
      <p class="page-eyebrow">Module 07</p>
      <h1 class="page-title">Significant Figures Calculator</h1>
      <p class="page-sub">Count significant figures, round to n sig figs, and see each step explained.</p>
    </div>
    <div class="panel">
      <div class="toolbar">
        <div class="field"><label>Number</label><input class="input" id="sfInput" type="text" value="0.004205600"></div>
        <div class="field"><label>Round to (sig figs)</label><input class="input" id="sfRound" type="number" value="3" min="1"></div>
      </div>
      <ul class="step-list" id="sfSteps"></ul>
    </div>
    <div class="panel">
      <h4 style="margin:0 0 10px; font-size:13px; color:var(--text-dim);">Uncertainty propagation (A ± ΔA, B ± ΔB)</h4>
      <div class="toolbar">
        <div class="field"><label>A</label><input class="input" id="upA" type="number" value="10"></div>
        <div class="field"><label>ΔA</label><input class="input" id="upDA" type="number" value="0.2"></div>
        <div class="field"><label>B</label><input class="input" id="upB" type="number" value="5"></div>
        <div class="field"><label>ΔB</label><input class="input" id="upDB" type="number" value="0.1"></div>
        <div class="field"><label>Operation</label><select id="upOp"><option value="add">A + B</option><option value="sub">A − B</option><option value="mul">A × B</option><option value="div">A ÷ B</option></select></div>
      </div>
      <ul class="step-list" id="upSteps"></ul>
    </div>
  `;
  ['sfInput','sfRound'].forEach(id=> document.getElementById(id).addEventListener('input', paintSigfigs));
  ['upA','upDA','upB','upDB','upOp'].forEach(id=> document.getElementById(id).addEventListener('input', paintUncertainty));
  paintSigfigs(); paintUncertainty();
}
function countSigFigs(str){
  str = str.trim();
  if(!str || isNaN(parseFloat(str))) return {count:0, steps:['Not a valid number.']};
  let s = str.replace(/^[+-]/,'');
  const steps = [];
  if(s.includes('e') || s.includes('E')){
    const mant = s.split(/[eE]/)[0];
    const digits = mant.replace('.','').replace(/^0+/,'') || '0';
    steps.push(`Mantissa "${mant}" contributes ${digits.length} significant figure(s); the exponent does not count.`);
    return {count:digits.length, steps};
  }
  if(s.includes('.')){
    const noSign = s.replace(/^0+(?=\d)/,'');
    if(s.startsWith('0.')){
      const afterDecimal = s.split('.')[1];
      const trimmedLeading = afterDecimal.replace(/^0+/,'');
      steps.push('Leading zeros before the first non-zero digit are not significant.');
      steps.push(`Digits from the first non-zero digit onward: "${trimmedLeading}" → ${trimmedLeading.length} sig figs.`);
      return {count:trimmedLeading.length || 0, steps};
    } else {
      const digitsOnly = s.replace('.','').replace(/^0+/,'');
      steps.push('A decimal point is present, so all trailing zeros ARE significant.');
      steps.push(`Counting all digits from the first non-zero digit: ${digitsOnly.length} sig figs.`);
      return {count:digitsOnly.length, steps};
    }
  } else {
    const trimmedZeros = s.replace(/0+$/,'');
    steps.push('No decimal point: trailing zeros are ambiguous and conventionally treated as NOT significant.');
    steps.push(`Counting non-trailing-zero digits: "${trimmedZeros || s}" → ${(trimmedZeros||s).replace(/^0+/,'').length} sig figs.`);
    return {count:(trimmedZeros||s).replace(/^0+/,'').length, steps};
  }
}
function roundToSigFigs(num, n){
  if(num===0) return 0;
  const d = Math.ceil(Math.log10(Math.abs(num)));
  const power = n - d;
  const magnitude = Math.pow(10, power);
  return Math.round(num*magnitude)/magnitude;
}
function paintSigfigs(){
  const input = document.getElementById('sfInput').value;
  const n = parseInt(document.getElementById('sfRound').value,10)||1;
  const {count, steps} = countSigFigs(input);
  const num = parseFloat(input);
  const rounded = Number.isFinite(num) ? roundToSigFigs(num, n) : NaN;
  const list = [
    `<b>Input:</b> "${input}"`,
    ...steps,
    `<b>Total significant figures:</b> ${count}`,
    Number.isFinite(rounded) ? `<b>Rounded to ${n} sig fig(s):</b> ${formatSci(rounded)} (${rounded})` : ''
  ].filter(Boolean);
  document.getElementById('sfSteps').innerHTML = list.map(s=>`<li>${s}</li>`).join('');
}
function paintUncertainty(){
  const A=parseFloat(document.getElementById('upA').value)||0, dA=Math.abs(parseFloat(document.getElementById('upDA').value)||0);
  const B=parseFloat(document.getElementById('upB').value)||0, dB=Math.abs(parseFloat(document.getElementById('upDB').value)||0);
  const op = document.getElementById('upOp').value;
  let result, dResult, rule;
  if(op==='add'){ result=A+B; dResult=dA+dB; rule='Sums/differences: absolute uncertainties add: ΔR = ΔA + ΔB.'; }
  if(op==='sub'){ result=A-B; dResult=dA+dB; rule='Sums/differences: absolute uncertainties add: ΔR = ΔA + ΔB.'; }
  if(op==='mul'){ result=A*B; const relSum=(A?dA/Math.abs(A):0)+(B?dB/Math.abs(B):0); dResult=Math.abs(result)*relSum; rule='Products: relative uncertainties add: ΔR/|R| = ΔA/|A| + ΔB/|B|.'; }
  if(op==='div'){ result=B!==0?A/B:NaN; const relSum=(A?dA/Math.abs(A):0)+(B?dB/Math.abs(B):0); dResult=Number.isFinite(result)?Math.abs(result)*relSum:NaN; rule='Quotients: relative uncertainties add: ΔR/|R| = ΔA/|A| + ΔB/|B|.'; }
  document.getElementById('upSteps').innerHTML = `
    <li>${rule}</li>
    <li><b>Result:</b> R = ${trimNum(result)}</li>
    <li><b>Propagated uncertainty:</b> ΔR = ${Number.isFinite(dResult)?trimNum(dResult):'—'}</li>
    <li><b>Reported value:</b> R = ${trimNum(result)} ± ${Number.isFinite(dResult)?trimNum(dResult):'—'}</li>
  `;
}

/* ============================================================
   MODULE: SEARCH (global)
   ============================================================ */
function buildSearchIndex(){
  const idx = [];
  CONSTANTS.forEach(c=> idx.push({type:'Constant', label:`${c.symbol} — ${c.name}`, sub:c.field, go:()=>{ navigateTo('constants', {afterRender:()=>{
    constFilter={field:'All',query:''}; paintConstants();
    setTimeout(()=>{ const row=document.querySelector(`.const-row[data-id="${c.id}"]`); if(row){ row.scrollIntoView({behavior:'smooth',block:'center'}); row.querySelector('.js-expand').click(); } },80);
  }}); }}));
  Object.entries(UNIT_CATEGORIES).forEach(([k,cat])=> idx.push({type:'Unit category', label:cat.label, sub:`${cat.units.length} units`, go:()=>{ convState.cat=k; convState.from=cat.units[0].s; convState.to=cat.units[1]?cat.units[1].s:cat.units[0].s; navigateTo('converter'); }}));
  FORMULAS.forEach(f=> idx.push({type:'Formula', label:f.title, sub:f.category, go:()=> navigateTo('formulas', {afterRender:()=>{ formulaFilter={cat:'All',query:''}; paintFormulas(); }}) }));
  QUANTITIES.forEach(q=> idx.push({type:'Quantity', label:`${q.symbol} — ${q.name}`, sub:q.category, go:()=> navigateTo('quantities', {afterRender:()=>{ qtyFilter={cat:'All',query:''}; paintQuantities(); }}) }));
  return idx;
}
let SEARCH_INDEX = [];
function initSearch(){
  SEARCH_INDEX = buildSearchIndex();
  const input = document.getElementById('globalSearch'), results = document.getElementById('searchResults');
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.classList.remove('show'); return; }
    const matches = SEARCH_INDEX.filter(item=> item.label.toLowerCase().includes(q)).slice(0,30);
    if(!matches.length){ results.innerHTML = `<div class="sr-empty">No results for "${input.value}"</div>`; results.classList.add('show'); return; }
    const grouped = {};
    matches.forEach(m=>{ (grouped[m.type]=grouped[m.type]||[]).push(m); });
    results.innerHTML = Object.entries(grouped).map(([type,items])=>`
      <div class="sr-group-label">${type}</div>
      ${items.map(it=>`<div class="sr-item" data-idx="${SEARCH_INDEX.indexOf(it)}"><span>${it.label}</span><span class="sr-sub">${it.sub}</span></div>`).join('')}
    `).join('');
    results.classList.add('show');
    results.querySelectorAll('.sr-item').forEach(el=> el.addEventListener('click', ()=>{
      SEARCH_INDEX[parseInt(el.dataset.idx,10)].go(); results.classList.remove('show'); input.value=''; input.blur();
    }));
  });
  document.addEventListener('click', (e)=>{ if(!e.target.closest('.searchbox')) results.classList.remove('show'); });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){ e.preventDefault(); input.focus(); }
    if(e.key==='Escape'){ results.classList.remove('show'); input.blur(); }
  });
}

/* ============================================================
   MODULE: EXPORT (JSON / CSV / TXT)
   ============================================================ */
function exportData(data, filename, format){
  let content, mime, ext;
  if(format==='json'){ content = JSON.stringify(data, null, 2); mime='application/json'; ext='json'; }
  else if(format==='csv'){
    const arr = Array.isArray(data) ? data : [data];
    if(arr.length===0){ content=''; }
    else{
      const keys = Object.keys(arr[0]);
      content = keys.join(',') + '\n' + arr.map(row=> keys.map(k=> JSON.stringify(row[k]??'')).join(',')).join('\n');
    }
    mime='text/csv'; ext='csv';
  } else { content = String(data); mime='text/plain'; ext='txt'; }
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filename}.${ext}`; a.click();
  URL.revokeObjectURL(url);
  toast(`Exported ${filename}.${ext}`);
}
