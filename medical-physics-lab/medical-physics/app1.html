        });

        ctx.fillStyle = 'rgba(10,14,20,0.65)'; ctx.fillRect(padL, histTop, W-padL-padR, histH);
        ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
        ctx.strokeRect(padL+.5, histTop+.5, W-padL-padR-1, histH-1);
        let maxH = 1; for(let i = 0; i < rtAnimState.nmHist.length; i++) if(rtAnimState.nmHist[i] > maxH) maxH = rtAnimState.nmHist[i];
        const nb = rtAnimState.nmHist.length, bw = (W-padL-padR)/nb;
        for(let i = 0; i < nb; i++){
          const bh = (rtAnimState.nmHist[i]/maxH)*(histH-4);
          ctx.fillStyle = '#36c2d6'; ctx.globalAlpha = 0.35+0.5*(rtAnimState.nmHist[i]/maxH);
          ctx.fillRect(padL+i*bw, histTop+histH-bh, bw-0.5, bh);
        }
        ctx.globalAlpha = 1;

        ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.4;
        const totalForCurve = rtAnimState.nmDetTot*(fovCm/nb);
        for(let i = 0; i <= 80; i++){
          const cm = (i/80-0.5)*fovCm;
          const v = sigma > 1e-6 ? (totalForCurve/(sigma*Math.sqrt(2*Math.PI)))*Math.exp(-(cm*cm)/(2*sigma*sigma)) : 0;
          const px = padL + (cm/fovCm+0.5)*(W-padL-padR);
          const py = histTop+histH - (v/maxH)*(histH-4);
          i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
        }
        ctx.stroke();

        ctx.fillStyle = 'rgba(231,236,242,0.72)'; ctx.font = '10px "IBM Plex Mono",monospace';
        ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillText('FWHM(d)=' + FWHM.toFixed(2) + ' cm   g\u2248' + (100*g).toFixed(1) + '%', W-6, 4);
        ctx.fillText('detected ' + rtAnimState.nmDetTot + ' / ' + rtAnimState.nmEmitTot + ' emitted', W-6, 16);
      }

      rtAnimState.raf = requestAnimationFrame(step);
    }
    rtAnimState.raf = requestAnimationFrame(step);
  }
  
   
  
/* ─── Radiation Therapy: isodose map + TCP / NTCP / P+ ─────────────────── */
function rtRunSimRadiationTherapy(params, canvas, resultsEl, stage) {
  var E       = Math.max(4, params.rtEnergy);
  var N_B     = Math.max(2, Math.min(9, Math.round(params.rtNBeams)));
  var FS      = Math.max(2, Math.min(20, params.rtFS));
  var D_tot   = Math.max(1, params.rtDtotal);
  var N_frac  = Math.max(1, Math.round(params.rtNfrac));
  var AB_T    = Math.max(0.5, params.rtABtumor);
  var TD50    = Math.max(10, params.rtTD50);
  var d_frac  = D_tot / N_frac;

  var ALPHA_T = 0.30, beta_T  = ALPHA_T / AB_T;
  var AB_late = 3.0,  N0_tcp  = 1e7, m_ntcp = 0.28;
  var BED_T   = D_tot * (1 + d_frac / AB_T);
  var EQD2_T  = BED_T / (1 + 2 / AB_T);
  var BED_N   = D_tot * (1 + d_frac / AB_late);
  var EQD2_N  = BED_N / (1 + 2 / AB_late);

  var sized = rtSizeCanvas(canvas);
  var ctx = sized.ctx, W = sized.w, H = sized.h;
  ctx.clearRect(0, 0, W, H);

  /* ── Layout ── */
  var padT    = 22;
  var mapSide = H - padT - 6;
  var NG = 64, FOV = 30, R_p = 13;
  var mapOffX = 6, mapOffY = padT;
  var csz     = mapSide / NG;
  var curveX  = mapOffX + mapSide + 16;
  var curveW  = W - curveX - 6;

  if (curveW < 80) {
    ctx.fillStyle='rgba(231,236,242,0.4)'; ctx.font='11px "IBM Plex Mono",monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('Widen the panel to see both panels', W/2, H/2); return;
  }

  /* ── Beam model ── */
  var dmax  = 0.12 * E + 0.80;
  var muEff = 0.072 * Math.pow(E, -0.28);
  var sigma = FS / (2 * 2.355);

  /* ── Dose grid ── */
  var DOSE = new Float32Array(NG * NG);
  for (var gy = 0; gy < NG; gy++) {
    for (var gx = 0; gx < NG; gx++) {
      var Px = (gx/NG - 0.5)*FOV, Py = (0.5 - gy/NG)*FOV;
      if (Px*Px + Py*Py > R_p*R_p) continue;
      var dose = 0;
      for (var b = 0; b < N_B; b++) {
        var th = (2*Math.PI*b/N_B);
        var dX = Math.cos(th), dY = Math.sin(th);
        var depth = Px*dX + Py*dY + R_p;
        if (depth < 0) continue;
        var off   = Math.abs(-Px*dY + Py*dX);
        var build   = depth < dmax ? 0.20 + 0.80*(depth/dmax) : 1.0;
        var falloff = Math.exp(-muEff * Math.max(0, depth - dmax));
        var lat     = Math.exp(-0.5 * Math.pow(off/sigma, 2));
        dose += build * falloff * lat;
      }
      DOSE[gy*NG+gx] = dose;
    }
  }
  var dIso = DOSE[Math.floor(NG/2)*NG + Math.floor(NG/2)] || 1;
  for (var i = 0; i < DOSE.length; i++) DOSE[i] = (DOSE[i]/dIso)*100;

  /* ── Dose colour ── */
  function dCol(d) {
    var v = Math.max(0, Math.min(100, d));
    if (v < 10) { var t=v/10;     return [0,            Math.round(t*40),           Math.round(t*160)]; }
    if (v < 30) { var t=(v-10)/20; return [0,           Math.round(40+t*200),        Math.round(160+t*95)]; }
    if (v < 50) { var t=(v-30)/20; return [Math.round(t*50),    245,                 Math.round(255-t*255)]; }
    if (v < 75) { var t=(v-50)/25; return [Math.round(50+t*205),Math.round(245-t*95),0]; }
    var t=(v-75)/25; return [255, Math.round(150+t*105), Math.round(t*255)];
  }

  /* ── Draw heatmap ── */
  for (var gy = 0; gy < NG; gy++) {
    for (var gx = 0; gx < NG; gx++) {
      var Px=(gx/NG-0.5)*FOV, Py=(0.5-gy/NG)*FOV;
      var out = Px*Px+Py*Py > R_p*R_p;
      var rgb = out ? [8,14,26] : dCol(DOSE[gy*NG+gx]);
      ctx.fillStyle='rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
      ctx.fillRect(mapOffX+gx*csz, mapOffY+gy*csz, csz+0.5, csz+0.5);
    }
  }

  /* Phantom outline */
  var mx=mapOffX+mapSide/2, my=mapOffY+mapSide/2, rPx=(R_p/FOV)*mapSide;
  ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(mx,my,rPx,0,Math.PI*2); ctx.stroke();

  /* Isodose contours */
  function drawContour(level, color, lw) {
    ctx.strokeStyle=color; ctx.lineWidth=lw;
    for (var gy=0; gy<NG-1; gy++) {
      for (var gx=0; gx<NG-1; gx++) {
        var d00=DOSE[gy*NG+gx], d10=DOSE[gy*NG+gx+1];
        var d01=DOSE[(gy+1)*NG+gx], d11=DOSE[(gy+1)*NG+gx+1];
        var cnt=(d00>=level)+(d10>=level)+(d11>=level)+(d01>=level);
        if(cnt===0||cnt===4) continue;
        var bx=mapOffX+gx*csz, by=mapOffY+gy*csz, pts=[];
        function ci(x0,y0,v0,x1,y1,v1){var t=(level-v0)/(v1-v0);pts.push([x0+(x1-x0)*t,y0+(y1-y0)*t]);}
        if((d00>=level)!==(d10>=level)) ci(bx,by,d00,bx+csz,by,d10);
        if((d10>=level)!==(d11>=level)) ci(bx+csz,by,d10,bx+csz,by+csz,d11);
        if((d11>=level)!==(d01>=level)) ci(bx+csz,by+csz,d11,bx,by+csz,d01);
        if((d01>=level)!==(d00>=level)) ci(bx,by+csz,d01,bx,by,d00);
        if(pts.length>=2){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var p=1;p<pts.length;p++)ctx.lineTo(pts[p][0],pts[p][1]);ctx.stroke();}
      }
    }
  }
  drawContour(95,'rgba(255,255,255,0.90)',1.8);
  drawContour(80,'rgba(255,230,60,0.85)',1.4);
  drawContour(50,'rgba(50,230,130,0.80)',1.2);
  drawContour(20,'rgba(80,160,255,0.70)',1.0);

  /* Beam entry arrows */
  for (var b=0; b<N_B; b++) {
    var th=(2*Math.PI*b/N_B), dX=Math.cos(th), dY=Math.sin(th);
    ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(mx-dX*(rPx+13), my+dY*(rPx+13));
    ctx.lineTo(mx-dX*(rPx+2),  my+dY*(rPx+2));
    ctx.stroke();
  }

  /* Isocentre crosshair */
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(mx-7,my); ctx.lineTo(mx+7,my); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx,my-7); ctx.lineTo(mx,my+7); ctx.stroke();
  ctx.setLineDash([]);

  /* Map header & isodose legend */
  ctx.fillStyle='rgba(231,236,242,0.72)'; ctx.font='10px "IBM Plex Mono",monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(E+' MV  \u00b7  '+N_B+' beams  \u00b7  FS '+FS+' cm', mapOffX+2, 2);
  [{c:'rgba(255,255,255,0.90)',l:'95%'},{c:'rgba(255,230,60,0.85)',l:'80%'},
   {c:'rgba(50,230,130,0.80)',l:'50%'},{c:'rgba(80,160,255,0.80)',l:'20%'}]
    .forEach(function(o,i){
      var lY=mapOffY+4+i*12;
      ctx.strokeStyle=o.c; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(mapOffX+3,lY+4); ctx.lineTo(mapOffX+16,lY+4); ctx.stroke();
      ctx.fillStyle='rgba(231,236,242,0.55)'; ctx.font='8px "IBM Plex Mono",monospace';
      ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(o.l, mapOffX+19, lY);
    });

  /* ── TCP / NTCP / P+ panel ── */
  function erfA(x){var s=x<0?-1:1;x=Math.abs(x);var t=1/(1+0.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t)*Math.exp(-x*x));}
  function Phi(t){return 0.5*(1+erfA(t/Math.sqrt(2)));}
  function tcpFn(D){if(D<=0)return 0;var d=D/N_frac;return Math.exp(-N0_tcp*Math.exp(-N_frac*(ALPHA_T*d+beta_T*d*d)));}
  function ntcpFn(D){return Phi((D-TD50)/(m_ntcp*TD50));}
  function ppFn(D){return tcpFn(D)*(1-ntcpFn(D));}

  var maxD_c = Math.max(Math.ceil(Math.max(D_tot*1.45, TD50*1.45)/10)*10, 60);
  var cPL=42, cPR=8, cPT=26, cPB=56;
  var cpW=curveW-cPL-cPR, cpH=H-cPT-cPB;
  var COX=curveX+cPL, COY=cPT;

  function dPx(d){return COX+(d/maxD_c)*cpW;}
  function pPy(p){return COY+(1-p)*cpH;}

  var NP=300, pts=[];
  for(var i=0;i<=NP;i++){var d=(i/NP)*maxD_c;pts.push({d:d,tcp:tcpFn(d),ntcp:ntcpFn(d),pp:ppFn(d)});}

  /* Grid */
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
  var dStep=Math.max(10,Math.round(maxD_c/6/10)*10);
  for(var d=0;d<=maxD_c;d+=dStep){ctx.beginPath();ctx.moveTo(dPx(d)+.5,COY);ctx.lineTo(dPx(d)+.5,COY+cpH);ctx.stroke();}
  [0,.2,.4,.6,.8,1].forEach(function(p){ctx.beginPath();ctx.moveTo(COX,pPy(p)+.5);ctx.lineTo(COX+cpW,pPy(p)+.5);ctx.stroke();});

  /* Axes */
  ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(COX,COY);ctx.lineTo(COX,COY+cpH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(COX,COY+cpH);ctx.lineTo(COX+cpW,COY+cpH);ctx.stroke();

  /* Tick labels */
  ctx.fillStyle='rgba(231,236,242,0.52)'; ctx.font='9px "IBM Plex Mono",monospace';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(var d=0;d<=maxD_c;d+=dStep) ctx.fillText(d,dPx(d),COY+cpH+3);
  ctx.textAlign='right'; ctx.textBaseline='middle';
  [0,.2,.4,.6,.8,1].forEach(function(p){ctx.fillText((p*100).toFixed(0)+'%',COX-4,pPy(p));});
  ctx.fillStyle='rgba(231,236,242,0.35)'; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('Prescribed dose  (Gy)', COX+cpW/2, COY+cpH+17);
  ctx.save(); ctx.translate(curveX+10,COY+cpH/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('Probability', 0, 0); ctx.restore();

  /* Panel title */
  ctx.fillStyle='rgba(231,236,242,0.72)'; ctx.font='10px "IBM Plex Mono",monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('TCP  /  NTCP  /  P\u208a', curveX+cPL, 2);

  /* Therapeutic window fill */
  var winPts=pts.filter(function(pt){return pt.tcp>pt.ntcp;});
  if(winPts.length>1){
    ctx.beginPath();
    winPts.forEach(function(pt,i){i===0?ctx.moveTo(dPx(pt.d),pPy(pt.tcp)):ctx.lineTo(dPx(pt.d),pPy(pt.tcp));});
    for(var k=winPts.length-1;k>=0;k--) ctx.lineTo(dPx(winPts[k].d),pPy(winPts[k].ntcp));
    ctx.closePath(); ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fill();
    var mid=winPts[Math.floor(winPts.length/2)];
    ctx.fillStyle='rgba(255,255,255,0.20)'; ctx.font='8px "IBM Plex Mono",monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('therapeutic window', dPx(mid.d), (pPy(mid.tcp)+pPy(mid.ntcp))/2);
  }

  /* P+ dashed */
  ctx.beginPath();ctx.strokeStyle='rgba(160,195,225,0.72)';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);
  pts.forEach(function(pt,i){i===0?ctx.moveTo(dPx(pt.d),pPy(pt.pp)):ctx.lineTo(dPx(pt.d),pPy(pt.pp));});
  ctx.stroke(); ctx.setLineDash([]);
  /* NTCP */
  ctx.beginPath();ctx.strokeStyle='#e8a33d';ctx.lineWidth=2.0;
  pts.forEach(function(pt,i){i===0?ctx.moveTo(dPx(pt.d),pPy(pt.ntcp)):ctx.lineTo(dPx(pt.d),pPy(pt.ntcp));});
  ctx.stroke();
  /* TCP */
  ctx.beginPath();ctx.strokeStyle=stage.accent;ctx.lineWidth=2.0;
  pts.forEach(function(pt,i){i===0?ctx.moveTo(dPx(pt.d),pPy(pt.tcp)):ctx.lineTo(dPx(pt.d),pPy(pt.tcp));});
  ctx.stroke();

  /* TD50 marker on NTCP */
  if(TD50>0&&TD50<maxD_c){
    ctx.strokeStyle='rgba(232,163,61,0.38)';ctx.lineWidth=1;ctx.setLineDash([2,4]);
    ctx.beginPath();ctx.moveTo(dPx(TD50),COY+2);ctx.lineTo(dPx(TD50),pPy(0.5));ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#e8a33d';ctx.beginPath();ctx.arc(dPx(TD50),pPy(0.5),3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(231,236,242,0.52)';ctx.font='8px "IBM Plex Mono",monospace';
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('TD\u2085\u2080='+TD50+' Gy', dPx(TD50), pPy(0.5)-2);
  }

  /* Prescription dose marker + annotation box */
  if(D_tot>0&&D_tot<maxD_c){
    var px=dPx(D_tot);
    var tcp_rx=tcpFn(D_tot), ntcp_rx=ntcpFn(D_tot), pp_rx=ppFn(D_tot);
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1.4;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(px,COY+2);ctx.lineTo(px,COY+cpH);ctx.stroke();ctx.setLineDash([]);
    [{c:stage.accent,v:tcp_rx},{c:'#e8a33d',v:ntcp_rx},{c:'rgba(160,195,225,0.80)',v:pp_rx}]
      .forEach(function(o){ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(px,pPy(o.v),3.2,0,Math.PI*2);ctx.fill();});
    var ax=Math.min(px+5, COX+cpW-116);
    ctx.fillStyle='rgba(10,18,32,0.90)';ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=1;
    ctx.fillRect(ax-2,COY+4,112,50);ctx.strokeRect(ax-1.5,COY+4.5,111,49);
    ctx.font='9px "IBM Plex Mono",monospace';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillStyle='rgba(231,236,242,0.88)';ctx.fillText('D = '+D_tot.toFixed(0)+' Gy',ax+4,COY+7);
    ctx.fillStyle=stage.accent;ctx.fillText('TCP = '+(tcp_rx*100).toFixed(1)+'%',ax+4,COY+20);
    ctx.fillStyle='#e8a33d';ctx.fillText('NTCP = '+(ntcp_rx*100).toFixed(1)+'%',ax+4,COY+33);
    ctx.fillStyle='rgba(160,195,225,0.88)';ctx.fillText('P\u208a = '+(pp_rx*100).toFixed(1)+'%',ax+4,COY+46);
  }

  /* Legend */
  var lx=COX+4, ly=COY+cpH-40;
  [{c:stage.accent,l:'TCP',dash:false},{c:'#e8a33d',l:'NTCP (Lyman)',dash:false},
   {c:'rgba(160,195,225,0.72)',l:'P\u208a = TCP\u00d7(1\u2212NTCP)',dash:true}]
    .forEach(function(o,i){
      var yl=ly+i*13;
      ctx.strokeStyle=o.c;ctx.lineWidth=o.dash?1.4:1.8;if(o.dash)ctx.setLineDash([3,4]);
      ctx.beginPath();ctx.moveTo(lx,yl);ctx.lineTo(lx+16,yl);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='rgba(231,236,242,0.65)';ctx.font='8px "IBM Plex Mono",monospace';
      ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(o.l,lx+20,yl);
    });

  /* BED / EQD2 annotation rows below curve */
  var bY=COY+cpH+28;
  if(bY+22<H){
    ctx.fillStyle=stage.accent;ctx.font='9px "IBM Plex Mono",monospace';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('Tumour (\u03b1/\u03b2='+AB_T+'):  BED = '+BED_T.toFixed(1)+' Gy  \u00b7  EQD2 = '+EQD2_T.toFixed(1)+' Gy', COX, bY);
    ctx.fillStyle='#e8a33d';
    ctx.fillText('OAR (\u03b1/\u03b2='+AB_late+'):  BED = '+BED_N.toFixed(1)+' Gy  \u00b7  EQD2 = '+EQD2_N.toFixed(1)+' Gy', COX, bY+12);
  }

  resultsEl.innerHTML =
    '<b>RT  '+E+' MV  \u00b7  '+N_B+' beams  \u00b7  '+D_tot+' Gy in '+N_frac+' fx of '+d_frac.toFixed(2)+' Gy/fx</b>'+
    ' &nbsp;|&nbsp; '+
    '<span style="color:'+stage.accent+'">BED<sub>'+AB_T+'</sub> = '+BED_T.toFixed(1)+' Gy &nbsp;\u00b7&nbsp; EQD2 = '+EQD2_T.toFixed(1)+' Gy</span>'+
    ' &nbsp;\u00b7&nbsp; '+
    '<span style="color:#e8a33d">BED<sub>'+AB_late+'</sub> = '+BED_N.toFixed(1)+' Gy &nbsp;\u00b7&nbsp; EQD2 = '+EQD2_N.toFixed(1)+' Gy</span>'+
    ' &nbsp;|&nbsp; at D = '+D_tot+' Gy: '+
    'TCP = '+(tcpFn(D_tot)*100).toFixed(1)+'%  \u00b7  NTCP = '+(ntcpFn(D_tot)*100).toFixed(1)+'%  \u00b7  P<sub>+</sub> = '+(ppFn(D_tot)*100).toFixed(1)+'%';
}


/* ─── Radiation Therapy: VMAT arc animation ─────────────────────────────── */
function rtRunRadiationTherapyAnim(canvas, content, stage) {
  var NG = 56, FOV = 28, R_p = 11;
  var doseGrid = new Float32Array(NG * NG);
  var gantryDeg = 0, maxAcc = 1e-9, frameN = 0;
  var lastE = -1, lastFS = -1;

  function readParams() {
    var p = {};
    content.anim.params.forEach(function(def){
      var el = document.getElementById('p-' + def.id);
      p[def.id] = el ? parseFloat(el.value) : def.value;
    });
    return p;
  }

  function step() {
    if (!document.body.contains(canvas)) { rtStopAnim(); return; }

    var p      = readParams();
    var E      = Math.max(4, p.rtEnergy);
    var FS     = Math.max(2, Math.min(20, p.rtFS));
    var D_tot  = Math.max(1, p.rtDtotal);
    var N_frac = Math.max(1, Math.round(p.rtNfrac));
    var AB_T   = Math.max(0.5, p.rtABtumor);
    var speed  = Math.max(1, Math.round(p.rtSpeed));

    if (E !== lastE || FS !== lastFS) {
      for(var k=0;k<doseGrid.length;k++) doseGrid[k]=0;
      maxAcc=1e-9; gantryDeg=0; frameN=0; lastE=E; lastFS=FS;
    }

    var dmax    = 0.12*E + 0.80;
    var muEff   = 0.072*Math.pow(E,-0.28);
    var sigma   = FS/(2*2.355);
    var modFact = 0.4 + 0.6*Math.pow(Math.abs(Math.sin(gantryDeg*Math.PI/60)),0.7);
    var angleRad = gantryDeg*Math.PI/180;
    var dX=Math.cos(angleRad), dY=Math.sin(angleRad);

    /* Accumulate dose at current gantry angle */
    for (var gy=0; gy<NG; gy++) {
      for (var gx=0; gx<NG; gx++) {
        var Px=(gx/NG-0.5)*FOV, Py=(0.5-gy/NG)*FOV;
        if(Px*Px+Py*Py>R_p*R_p) continue;
        var depth=Px*dX+Py*dY+R_p;
        if(depth<0) continue;
        var off  =Math.abs(-Px*dY+Py*dX);
        var build  =depth<dmax?0.20+0.80*(depth/dmax):1.0;
        var falloff=Math.exp(-muEff*Math.max(0,depth-dmax));
        var lat    =Math.exp(-0.5*Math.pow(off/sigma,2));
        var contrib=build*falloff*lat*modFact;
        doseGrid[gy*NG+gx]+=contrib;
        if(doseGrid[gy*NG+gx]>maxAcc) maxAcc=doseGrid[gy*NG+gx];
      }
    }

    var sized=rtSizeCanvas(canvas);
    var ctx=sized.ctx, W=sized.w, H=sized.h;
    ctx.clearRect(0,0,W,H);

    var padT=26, padL=6;
    var mapSide=H-padT-6;
    var csz=mapSide/NG;
    var infoX=padL+mapSide+14;
    var infoW=W-infoX-6;

    /* Dose colour */
    function dCol(d){
      var v=Math.max(0,Math.min(100,d));
      if(v<10){var t=v/10;return [0,Math.round(t*40),Math.round(t*160)];}
      if(v<30){var t=(v-10)/20;return [0,Math.round(40+t*200),Math.round(160+t*95)];}
      if(v<50){var t=(v-30)/20;return [Math.round(t*50),245,Math.round(255-t*255)];}
      if(v<75){var t=(v-50)/25;return [Math.round(50+t*205),Math.round(245-t*95),0];}
      var t=(v-75)/25;return [255,Math.round(150+t*105),Math.round(t*255)];
    }

    /* Heatmap */
    for(var gy=0;gy<NG;gy++){
      for(var gx=0;gx<NG;gx++){
        var Px=(gx/NG-0.5)*FOV,Py=(0.5-gy/NG)*FOV;
        var out=Px*Px+Py*Py>R_p*R_p;
        var normD=maxAcc>0?doseGrid[gy*NG+gx]/maxAcc*100:0;
        var rgb=out?[6,12,22]:dCol(normD);
        ctx.fillStyle='rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
        ctx.fillRect(padL+gx*csz,padT+gy*csz,csz+0.5,csz+0.5);
      }
    }

    var cx=padL+mapSide/2, cy=padT+mapSide/2, rPx=(R_p/FOV)*mapSide;

    /* Patient outline */
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(cx,cy,rPx,0,Math.PI*2);ctx.stroke();

    /* Arc progress indicator */
    var arcEnd=-Math.PI/2+(gantryDeg/360)*2*Math.PI;
    ctx.strokeStyle='rgba(255,232,70,0.16)';ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(cx,cy,rPx+10,-Math.PI/2,arcEnd);ctx.stroke();
    ctx.strokeStyle='rgba(255,232,70,0.52)';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(cx,cy,rPx+10,-Math.PI/2,arcEnd);ctx.stroke();

    /* Current gantry angle dot */
    var dotA=-Math.PI/2+gantryDeg*Math.PI/180;
    ctx.fillStyle='rgba(255,232,70,0.90)';
    ctx.beginPath();ctx.arc(cx+Math.cos(dotA)*(rPx+10),cy+Math.sin(dotA)*(rPx+10),4,0,Math.PI*2);ctx.fill();

    /* Beam footprint (width = FS × modFact) */
    var bSX=cx-dX*(rPx+22), bSY=cy+dY*(rPx+22);
    var bEX=cx+dX*2, bEY=cy-dY*2;
    var halfFW=(FS/FOV)*mapSide*0.5*modFact;
    ctx.save();
    ctx.strokeStyle='rgba(255,232,70,'+(0.08+0.22*modFact)+')';
    ctx.lineWidth=halfFW*2; ctx.globalAlpha=0.55;
    ctx.beginPath();ctx.moveTo(bSX,bSY);ctx.lineTo(bEX,bEY);ctx.stroke();
    ctx.restore();

    /* Central axis */
    ctx.strokeStyle='rgba(255,232,70,'+(0.55+0.35*modFact)+')';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(bSX,bSY);ctx.lineTo(bEX,bEY);ctx.stroke();

    /* Arrowhead at phantom entry point */
    var entX=cx-dX*(rPx+2), entY=cy+dY*(rPx+2);
    var perpX=-dY, perpY=dX, ah=6;
    ctx.fillStyle='rgba(255,232,70,'+(0.70+0.25*modFact)+')';
    ctx.beginPath();
    ctx.moveTo(entX,entY);
    ctx.lineTo(entX+dX*ah+perpX*ah*0.5, entY-dY*ah-perpY*ah*0.5);
    ctx.lineTo(entX+dX*ah-perpX*ah*0.5, entY-dY*ah+perpY*ah*0.5);
    ctx.closePath();ctx.fill();

    /* Isocentre crosshair */
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1;ctx.setLineDash([2,3]);
    ctx.beginPath();ctx.moveTo(cx-7,cy);ctx.lineTo(cx+7,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy-7);ctx.lineTo(cx,cy+7);ctx.stroke();
    ctx.setLineDash([]);

    /* Info panel */
    var d_frac=D_tot/N_frac;
    var AB_late=3.0;
    var BED_T =D_tot*(1+d_frac/AB_T),  EQD2_T=BED_T/(1+2/AB_T);
    var BED_N =D_tot*(1+d_frac/AB_late), EQD2_N=BED_N/(1+2/AB_late);

    if(infoW>=70){
      ctx.fillStyle='rgba(10,14,22,0.86)';
      ctx.fillRect(infoX,padT,infoW,mapSide);
      ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=1;
      ctx.strokeRect(infoX+.5,padT+.5,infoW-1,mapSide-1);

      var IX=infoX+7;
      ctx.font='bold 10px "IBM Plex Mono",monospace';ctx.textAlign='left';ctx.textBaseline='top';
      ctx.fillStyle='rgba(255,232,70,0.92)';ctx.fillText('VMAT arc',IX,padT+7);

      var rows=[
        {l:'Gantry',  v:(gantryDeg%360).toFixed(0)+'\u00b0', c:'rgba(255,232,70,0.90)'},
        {l:'MLC',     v:(modFact*100).toFixed(0)+'%',         c:'rgba(255,232,70,0.55)'},
        {l:'Arc',     v:Math.floor(gantryDeg/360)+1+' cycle', c:'rgba(231,236,242,0.40)'},
        {l:'sep'},
        {l:'Energy',  v:E+' MV',      c:'rgba(231,236,242,0.65)'},
        {l:'Field',   v:FS+' cm',     c:'rgba(231,236,242,0.65)'},
        {l:'sep'},
        {l:'D',       v:D_tot+' Gy',  c:stage.accent},
        {l:'N',       v:N_frac+' fx', c:stage.accent},
        {l:'d',       v:d_frac.toFixed(2)+' Gy', c:stage.accent},
        {l:'\u03b1/\u03b2', v:AB_T.toFixed(1)+' Gy', c:stage.accent},
        {l:'sep'},
        {l:'BED\u2081\u2080', v:BED_T.toFixed(1)+' Gy',   c:stage.accent},
        {l:'EQD2\u2081\u2080',v:EQD2_T.toFixed(1)+' Gy',  c:stage.accent},
        {l:'BED\u2083',       v:BED_N.toFixed(1)+' Gy',    c:'#e8a33d'},
        {l:'EQD2\u2083',      v:EQD2_N.toFixed(1)+' Gy',   c:'#e8a33d'}
      ];

      rows.forEach(function(r,i){
        var ry=padT+24+i*12;
        if(r.l==='sep'){
          ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(infoX+5,ry+4);ctx.lineTo(infoX+infoW-5,ry+4);ctx.stroke();
          return;
        }
        ctx.fillStyle='rgba(231,236,242,0.28)';ctx.font='8px "IBM Plex Mono",monospace';
        ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(r.l,IX,ry);
        ctx.fillStyle=r.c;ctx.textAlign='right';
        ctx.fillText(r.v,infoX+infoW-5,ry);
      });
    }

    /* Frame header */
    ctx.fillStyle='rgba(231,236,242,0.70)';ctx.font='10px "IBM Plex Mono",monospace';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('VMAT  '+(gantryDeg%360).toFixed(0)+'\u00b0  | cycle '+(Math.floor(gantryDeg/360)+1),padL,4);

    gantryDeg+=speed; frameN++;
    rtAnimState.raf=requestAnimationFrame(step);
  }

  rtAnimState.raf=requestAnimationFrame(step);
}

    

  function rtRunSim(key){
    const content = RT_CONTENT[key];
    const stage = rtFindNode(key).stage;
    const params = {};
    content.sim.params.forEach(function(p){
      const el = document.getElementById('p-' + p.id);
      params[p.id] = el ? parseFloat(el.value) : p.value;
    });
    const canvas = document.getElementById('rtSimCanvas');
    const resultsEl = document.getElementById('rtSimResults');
    if(!canvas) return;
  
  if(key === 'dosimetry'){
      rtRunSimDosimetry(params, canvas, resultsEl, stage);
      return;
    }  
    
    
    if(key === 'attenuation'){
      rtRunSimAttenuation(params, canvas, resultsEl, stage);
      return;
    }

if(key === 'scattering'){
      rtRunSimScattering(params, canvas, resultsEl, stage);
      return;
    }
    if(key === 'absorption'){
      rtRunSimAbsorption(params, canvas, resultsEl, stage);
      return;
    }

       if(key === 'absorbed-dose'){
         rtRunSimAbsorbedDose(params, canvas, resultsEl, stage);
         return;
       }


if(key === 'equivalent-dose'){
      rtRunSimEquivalentDose(params, canvas, resultsEl, stage);
      return;
    }
    
    if(key === 'effective-dose'){
      rtRunSimEffectiveDose(params, canvas, resultsEl, stage);
      return;
    }

    if(key === 'radiation-biology'){
      rtRunSimRadiationBiology(params, canvas, resultsEl, stage);
      return;
    }

    if(key === 'dna-damage'){
      rtRunSimDnaDamage(params, canvas, resultsEl, stage);
      return;
    }


    if(key === 'cell-survival'){
      rtRunSimCellSurvival(params, canvas, resultsEl, stage);
      return;
    }

    if(key === 'tissue-response'){
      rtRunSimTissueResponse(params, canvas, resultsEl, stage);
      return;
    }
    
        if(key === 'radiation-therapy'){
      rtRunSimRadiationTherapy(params, canvas, resultsEl, stage);
      return;
    }
    
    
    if(key === 'medical-physics'){
      rtRunSimMedicalPhysics(params, canvas, resultsEl, stage);
      return;
    }
    
    
        if(key === 'nuclear-medicine'){
      rtRunSimNuclearMedicine(params, canvas, resultsEl, stage);
      return;
    }
    
    
     if(key === 'ct'){
      rtRunSimCT(params, canvas, resultsEl, stage);
      return;
    }   
    
    const sized = rtSizeCanvas(canvas);
    
    
    const ctx = sized.ctx, w = sized.w, h = sized.h;
    ctx.clearRect(0, 0, w, h);

    const sigmaT = params.sigmaT, scatFrac = params.scatFrac, L = params.thickness;
    const n = Math.max(1, Math.round(params.nParticles));

    const margin = 30;
    const xScale = (w - margin * 2) / (L * 1.3);
    const x0 = margin + xScale * (L * 0.15);
    function toPx(x){ return x0 + x * xScale; }

    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(toPx(0), 0, toPx(L) - toPx(0), h);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(toPx(0), 0); ctx.lineTo(toPx(0), h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(toPx(L), 0); ctx.lineTo(toPx(L), h); ctx.stroke();
    ctx.setLineDash([]);

    let transmitted = 0, absorbed = 0, reflected = 0;
    const colors = { transmitted:'#7be39a', absorbed: stage.accent, reflected:'#e8a33d' };

    for(let i=0; i<n; i++){
      let x = 0;
      const y = 6 + Math.random() * (h - 12);
      let dir = 1;
      const path = [[x,y]];
      let outcome = null;
      let guard = 0;
      while(guard++ < 500){
        const s = -Math.log(Math.random()) / sigmaT;
        x += dir * s;
        if(x >= L){ outcome = 'transmitted'; path.push([L,y]); break; }
        if(x <= 0){ outcome = 'reflected'; path.push([0,y]); break; }
        path.push([x,y]);
        if(Math.random() < scatFrac){
          dir = Math.random() < 0.5 ? 1 : -1;
        } else {
          outcome = 'absorbed'; break;
        }
      }
      if(!outcome) outcome = 'absorbed';
      if(outcome === 'transmitted') transmitted++;
      else if(outcome === 'absorbed') absorbed++;
      else reflected++;

      ctx.beginPath();
      ctx.strokeStyle = colors[outcome];
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 1;
      path.forEach(function(pt, idx){
        const px = toPx(pt[0]);
        if(idx === 0) ctx.moveTo(px, pt[1]); else ctx.lineTo(px, pt[1]);
      });
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    function pct(v){ return (100 * v / n).toFixed(1); }
    resultsEl.innerHTML =
      '<span style="color:' + colors.transmitted + '">Transmitted ' + pct(transmitted) + '%</span> &nbsp;\u00b7&nbsp; ' +
      '<span style="color:' + colors.reflected + '">Reflected ' + pct(reflected) + '%</span> &nbsp;\u00b7&nbsp; ' +
      '<span style="color:' + colors.absorbed + '">Absorbed ' + pct(absorbed) + '%</span>' +
      ' &nbsp; (N = ' + n + ')';
  }

/* ═══════════════════════════════════════════════════════════════════════
   PART C — Medical Physics Applications: three animation modes
   CT: rotating gantry fills sinogram row-by-row
   RT: beam particles deposit dose; isodose heatmap always visible
   NM: tracer particles circulate; live time-activity bars + MIRD tallies
   Insert immediately before:  function rtStopAnim(){
   ═══════════════════════════════════════════════════════════════════════ */

/* ── shared parameter reader ──────────────────────────────────────────── */
function rtMPReadParams(content) {
  const p = {};
  content.anim.params.forEach(function(def) {
    const el = document.getElementById('p-' + def.id);
    p[def.id] = el ? parseFloat(el.value) : def.value;
  });
  return p;
}

/* ══════════════════════════════════════════════════════════════════════
   CT ANIMATION
   A gantry dot rotates around the phantom; at each step the current
   projection is ray-marched and appended as one row to the sinogram.
   The phantom image is drawn once and never redrawn — only the
   sinogram and the gantry overlay change frame-to-frame.
   ══════════════════════════════════════════════════════════════════════ */
function rtMPAnimCT(canvas, content, stage) {
  /* ── build phantom grid once (64×64, FOV = 24 cm) ─────────────────── */
  const N = 64, FOV = 24, R_ph = 10; /* cm */
  const TIS = [
    /* [mu_rel, cx_cm, cy_cm, r_cm] */
    [1.00,  0.0,  0.0, R_ph],  /* soft tissue (fills outer circle) */
    [0.25, -3.5, -2.0,  3.2],  /* lung */
    [0.85,  2.0,  3.0,  2.4],  /* fat */
    [1.90,  2.5, -2.5,  1.4],  /* bone */
    [1.08, -1.5,  2.0,  0.7]   /* lesion */
  ];
  const TCOLS = ['#9ec8f0','#5abed8','#d8c878','#e0c050','#7ab8d8'];

  const MU = new Float32Array(N * N);
  for (let py = 0; py < N; py++) {
    for (let px = 0; px < N; px++) {
      const fx = (px / N - 0.5) * FOV;
      const fy = (0.5 - py / N) * FOV;
      let mr = 0;
      for (let t = 0; t < TIS.length; t++) {
        const dx = fx - TIS[t][1], dy = fy - TIS[t][2];
        if (dx * dx + dy * dy <= TIS[t][3] * TIS[t][3]) mr = TIS[t][0];
      }
      MU[py * N + px] = mr;
    }
  }

  /* sinogram buffer: 180 rows × N columns */
  const SIN_ROWS = 180;
  const sinData  = new Float32Array(SIN_ROWS * N);
  let sinMax     = 1e-9;
  let angleDeg   = 0;        /* current gantry angle, degrees */
  let rowsDone   = 0;        /* rows accumulated so far */

  /* ray-march one projection at angle theta (radians) */
  const N_SAMP = 80;
  function marchRow(theta) {
    const cosT = Math.cos(theta), sinT = Math.sin(theta);
    const row  = angleDeg % SIN_ROWS;
    for (let ri = 0; ri < N; ri++) {
      const s = (ri / N - 0.5) * FOV; /* detector offset (cm) */
      let li = 0;
      for (let k = 0; k < N_SAMP; k++) {
        const t2 = (k / N_SAMP - 0.5) * FOV * 1.5;
        const wx = s * cosT - t2 * sinT;
        const wy = s * sinT + t2 * cosT;
        const gpx = Math.floor((wx / FOV + 0.5) * N);
        const gpy = Math.floor((0.5 - wy / FOV) * N);
        if (gpx >= 0 && gpx < N && gpy >= 0 && gpy < N)
          li += MU[gpy * N + gpx];
      }
      li *= (FOV * 1.5) / N_SAMP;
      sinData[row * N + ri] = li;
      if (li > sinMax) sinMax = li;
    }
  }

  /* draw phantom image into an offscreen canvas once */
  function drawPhantomOffscreen(imgSz) {
    const oc  = document.createElement('canvas');
    oc.width  = imgSz;
    oc.height = imgSz;
    const octx = oc.getContext('2d');
    const csz  = imgSz / N;
    for (let py = 0; py < N; py++) {
      for (let px = 0; px < N; px++) {
        const mr  = MU[py * N + px];
        const HU  = mr === 0 ? -1000 : 1000 * (mr - 1);
        /* soft-tissue window W/L = 400/40 */
        const nrm = Math.max(0, Math.min(1, (HU - (-160)) / 400));
        const g   = Math.round(nrm * 255);
        octx.fillStyle = 'rgb(' + g + ',' + g + ',' + g + ')';
        octx.fillRect(px * csz, py * csz, csz + 0.5, csz + 0.5);
      }
    }
    /* tissue outlines */
    TIS.forEach(function(t, i) {
      if (i === 0) return;
      const cx = (t[1] / FOV + 0.5) * imgSz;
      const cy = (0.5 - t[2] / FOV) * imgSz;
      const r  = (t[3] / FOV) * imgSz;
      octx.strokeStyle = TCOLS[i]; octx.lineWidth = 1.1; octx.globalAlpha = 0.80;
      octx.beginPath(); octx.arc(cx, cy, r, 0, Math.PI * 2); octx.stroke();
      if (r > 8) {
        octx.fillStyle = TCOLS[i]; octx.globalAlpha = 0.90;
        octx.font = '8px "IBM Plex Mono",monospace';
        octx.textAlign = 'center'; octx.textBaseline = 'middle';
        octx.fillText(t[4] !== undefined ? ((t[4] >= 0 ? '+' : '') + t[4]) : '', cx, cy);
      }
      octx.globalAlpha = 1;
    });
    /* phantom boundary */
    octx.strokeStyle = 'rgba(255,255,255,0.28)'; octx.lineWidth = 1.2;
    octx.beginPath(); octx.arc(imgSz/2, imgSz/2, (R_ph/FOV)*imgSz, 0, Math.PI*2); octx.stroke();
    return oc;
  }

  let phantomOC   = null; /* cached offscreen canvas */
  let lastImgSz   = 0;

  function step() {
    if (!document.body.contains(canvas)) { rtStopAnim(); return; }
    const p     = rtMPReadParams(content);
    const kVp   = Math.max(60, Math.min(140, p.mpP1));
    const speed = Math.max(1, Math.min(10, Math.round(p.mpRate)));

    /* advance gantry */
    for (let f = 0; f < speed; f++) {
      marchRow(angleDeg * Math.PI / 180);
      angleDeg = (angleDeg + 1) % SIN_ROWS;
      rowsDone = Math.min(rowsDone + 1, SIN_ROWS);
    }

    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0, 0, W, H);

    /* layout */
    const padT = 24, padL = 8, gap = 10, padR = 8;
    const imgSz = Math.min(
      Math.floor((W - 2*padL - gap - padR) * 0.44),
      H - padT - 22
    );
    const sinX = padL + imgSz + gap;
    const sinW = W - sinX - padR;
    const sinH = imgSz;

    /* phantom image (rebuild offscreen only when size changes) */
    if (imgSz !== lastImgSz) {
      phantomOC = drawPhantomOffscreen(imgSz);
      lastImgSz = imgSz;
    }
    ctx.drawImage(phantomOC, padL, padT);

    /* gantry overlay */
    const gCX = padL + imgSz / 2;
    const gCY = padT + imgSz / 2;
    const gR  = (R_ph / FOV) * imgSz + 11;
    const th  = angleDeg * Math.PI / 180;
    const srcX = gCX - Math.cos(th) * gR, srcY = gCY + Math.sin(th) * gR;
    const detX = gCX + Math.cos(th) * gR, detY = gCY - Math.sin(th) * gR;

    /* beam fan (5 rays, translucent) */
    for (let i = -2; i <= 2; i++) {
      const off = i * imgSz * 0.09;
      const px = detX - Math.sin(th) * off;
      const py = detY - Math.cos(th) * off;
      ctx.strokeStyle = 'rgba(255,220,80,0.15)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(srcX, srcY); ctx.lineTo(px, py); ctx.stroke();
    }
    /* central ray */
    ctx.strokeStyle = 'rgba(255,220,80,0.72)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(srcX, srcY); ctx.lineTo(detX, detY); ctx.stroke();
    /* source dot */
    ctx.fillStyle = '#ffe040';
    ctx.beginPath(); ctx.arc(srcX, srcY, 5, 0, Math.PI * 2); ctx.fill();
    /* detector arc */
    ctx.strokeStyle = 'rgba(80,200,255,0.70)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(gCX, gCY, gR, th + Math.PI - 0.38, th + Math.PI + 0.38);
    ctx.stroke();

    /* live sinogram */
    ctx.fillStyle = '#000';
    ctx.fillRect(sinX, padT, sinW, sinH);
    const scW = sinW / N;
    const scH = sinH / SIN_ROWS;
    for (let a = 0; a < rowsDone; a++) {
      for (let ri = 0; ri < N; ri++) {
        const v = sinData[a * N + ri] / sinMax;
        const g = Math.round(v * 255);
        ctx.fillStyle = 'rgb(' + g + ',' + g + ',' + g + ')';
        ctx.fillRect(sinX + ri * scW, padT + a * scH, scW + 0.5, scH + 0.5);
      }
    }
    /* current-row indicator on sinogram */
    const curRow = angleDeg % SIN_ROWS;
    ctx.strokeStyle = 'rgba(255,220,80,0.80)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sinX, padT + curRow * scH);
    ctx.lineTo(sinX + sinW, padT + curRow * scH);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
    ctx.strokeRect(sinX + 0.5, padT + 0.5, sinW - 1, sinH - 1);

    /* tissue legend below sinogram */
    const legY = padT + sinH + 5;
    const TNAMES = ['Soft tissue','Lung','Fat','Bone','Lesion'];
    TNAMES.forEach(function(nm, i) {
      const xi = sinX + (i % 3) * Math.floor(sinW / 3);
      const yi = legY + Math.floor(i / 3) * 12;
      ctx.fillStyle = TCOLS[i]; ctx.fillRect(xi, yi, 7, 7);
      ctx.fillStyle = 'rgba(231,236,242,0.55)';
      ctx.font = '8px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(nm, xi + 9, yi);
    });

    /* HUD */
    ctx.fillStyle = 'rgba(231,236,242,0.70)';
    ctx.font = '10px "IBM Plex Mono",monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('CT phantom  (W/L = 400/40 HU)', padL, 4);
    ctx.fillText('Sinogram  (' + rowsDone + '/' + SIN_ROWS + ' projections)', sinX, 4);
    ctx.fillStyle = 'rgba(231,236,242,0.78)';
    ctx.font = '11px "IBM Plex Mono",monospace';
    ctx.textAlign = 'right';
    ctx.fillText(kVp + ' kVp  ·  gantry ' + angleDeg + '°', W - 6, 4);

    rtAnimState.raf = requestAnimationFrame(step);
  }

  /* initialise state */
  angleDeg = 0; rowsDone = 0; sinMax = 1e-9;
  sinData.fill(0);
  rtAnimState.particles = [];
  rtAnimState.raf = requestAnimationFrame(step);
}

/* ══════════════════════════════════════════════════════════════════════
   RT ANIMATION
   A pre-computed isodose heatmap is drawn every frame; beam particles
   stream in from each of the N equidistant gantry angles and travel
   toward isocentre, brightening in the high-dose region.
   ══════════════════════════════════════════════════════════════════════ */
function rtMPAnimRT(canvas, content, stage) {
  let doseGrid  = null;   /* Float32Array, NG×NG */
  let doseNG    = 0;
  let doseKey   = '';     /* "E_NB" — invalidates grid on param change */
  let beamCount = 0;

  /* pre-compute normalised dose grid (100 = isocentre) */
  function buildGrid(E, N_B) {
    const NG = 72, FOV = 30, R_p = 13;
    const dmax  = 0.12 * E + 0.80;
    const muEff = 0.072 * Math.pow(E, -0.28);
    const sigma = 10 / (2 * 2.355); /* FS fixed at 10 cm for the background map */
    const DOSE  = new Float32Array(NG * NG);
    for (let gy = 0; gy < NG; gy++) {
      for (let gx = 0; gx < NG; gx++) {
        const Px = (gx / NG - 0.5) * FOV;
        const Py = (0.5 - gy / NG) * FOV;
        if (Px * Px + Py * Py > R_p * R_p) continue;
        let d = 0;
        for (let b = 0; b < N_B; b++) {
          const alpha = (2 * Math.PI * b / N_B);
          const dirX  = Math.cos(alpha), dirY = Math.sin(alpha);
          const depth = Px * dirX + Py * dirY + R_p;
          if (depth < 0) continue;
          const off = Math.abs(-Px * dirY + Py * dirX);
          d += (depth < dmax ? 0.20 + 0.80 * (depth / dmax) : 1.0)
             * Math.exp(-muEff * Math.max(0, depth - dmax))
             * Math.exp(-0.5 * Math.pow(off / sigma, 2));
        }
        DOSE[gy * NG + gx] = d;
      }
    }
    const dIso = DOSE[Math.floor(NG / 2) * NG + Math.floor(NG / 2)] || 1;
    for (let i = 0; i < DOSE.length; i++) DOSE[i] = (DOSE[i] / dIso) * 100;
    return { DOSE: DOSE, NG: NG, FOV: FOV, R_p: R_p };
  }

  /* dose → RGB (0 black → blue → cyan → green → yellow → white 100) */
  function doseRGB(d) {
    const v = Math.max(0, Math.min(100, d));
    if (v < 10)  { const t = v/10;       return [0,                Math.round(t*40),      Math.round(t*160)  ]; }
    if (v < 30)  { const t = (v-10)/20;  return [0,                Math.round(40+t*200),  Math.round(160+t*95)]; }
    if (v < 50)  { const t = (v-30)/20;  return [Math.round(t*50), 245,                   Math.round(255-t*255)]; }
    if (v < 75)  { const t = (v-50)/25;  return [Math.round(50+t*205), Math.round(245-t*95), 0]; }
    const t = (v-75)/25; return [255, Math.round(150+t*105), Math.round(t*255)];
  }

  function step() {
    if (!document.body.contains(canvas)) { rtStopAnim(); return; }
    const p   = rtMPReadParams(content);
    const E   = Math.max(4, p.mpP1);
    const N_B = Math.max(2, Math.min(9, Math.round(p.mpP2)));
    const FS  = Math.max(2, Math.min(30, p.mpP3));
    const rate = Math.max(1, Math.round(p.mpRate));

    /* rebuild grid only when beam configuration changes */
    const key = Math.round(E) + '_' + N_B;
    if (key !== doseKey) {
      const g = buildGrid(E, N_B);
      doseGrid = g.DOSE; doseNG = g.NG;
      rtAnimState.rtFOV = g.FOV; rtAnimState.rtRp = g.R_p;
      doseKey = key; beamCount = 0;
      rtAnimState.particles = [];
    }

    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0, 0, W, H);

    const padT = 24, padL = 10;
    const mapSz = Math.min(W - padL - 112, H - padT - 4);
    const NG    = doseNG;
    const FOV   = rtAnimState.rtFOV;
    const R_p   = rtAnimState.rtRp;
    const csz   = mapSz / NG;

    /* heatmap */
    for (let gy = 0; gy < NG; gy++) {
      for (let gx = 0; gx < NG; gx++) {
        const Px = (gx/NG - 0.5)*FOV, Py = (0.5 - gy/NG)*FOV;
        if (Px*Px + Py*Py > R_p*R_p) {
          ctx.fillStyle = 'rgb(10,18,30)';
        } else {
          const rgb = doseRGB(doseGrid[gy*NG+gx]);
          ctx.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
        }
        ctx.fillRect(padL + gx*csz, padT + gy*csz, csz + 0.5, csz + 0.5);
      }
    }

    /* phantom outline */
    const cx0 = padL + mapSz / 2, cy0 = padT + mapSz / 2;
    const rPx  = (R_p / FOV) * mapSz;
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cx0, cy0, rPx, 0, Math.PI * 2); ctx.stroke();

    /* spawn beam particles from each gantry angle */
    for (let f = 0; f < rate; f++) {
      const b     = Math.floor(Math.random() * N_B);
      const alpha = (2 * Math.PI * b / N_B);
      /* direction: from entry point toward isocentre */
      const dX = Math.cos(alpha + Math.PI);
      const dY = -Math.sin(alpha + Math.PI); /* pixel y-flip */
      /* entry point: just outside phantom boundary */
      const fuzz = (Math.random() - 0.5) * (FS / FOV) * rPx * 0.9;
      const perpX = -Math.sin(alpha + Math.PI) * fuzz;
      const perpY = -Math.cos(alpha + Math.PI) * fuzz;
      const ex = cx0 + Math.cos(alpha) * (rPx + 4) + perpX;
      const ey = cy0 - Math.sin(alpha) * (rPx + 4) + perpY;
      rtAnimState.particles.push({
        x: ex, y: ey, vx: dX * 2.6, vy: dY * 2.6, alive: true
      });
      beamCount++;
    }

    /* advance and draw particles */
    rtAnimState.particles = rtAnimState.particles.filter(function(par) {
      par.x += par.vx; par.y += par.vy;
      const Px = (par.x - cx0) / mapSz * FOV;
      const Py = (cy0 - par.y) / mapSz * FOV;
      const gx = Math.floor((Px / FOV + 0.5) * NG);
      const gy = Math.floor((0.5 - Py / FOV) * NG);
      let d = 0;
      if (gx >= 0 && gx < NG && gy >= 0 && gy < NG) d = doseGrid[gy * NG + gx];
      const alp = 0.14 + 0.72 * (d / 100);
      ctx.fillStyle = stage.accent; ctx.globalAlpha = alp;
      ctx.beginPath(); ctx.arc(par.x, par.y, 1.8, 0, Math.PI * 2); ctx.fill();
      if (d > 70) {
        ctx.globalAlpha = alp * 0.20;
        ctx.beginPath(); ctx.arc(par.x, par.y, 4.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      const offX = par.x < padL - 10 || par.x > padL + mapSz + 10;
      const offY = par.y < padT - 10 || par.y > padT + mapSz + 10;
      return !(offX || offY);
    });

    /* isocentre crosshair */
    ctx.strokeStyle = 'rgba(255,255,255,0.58)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(cx0-10, cy0); ctx.lineTo(cx0+10, cy0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx0, cy0-10); ctx.lineTo(cx0, cy0+10); ctx.stroke();
    ctx.setLineDash([]);

    /* legend */
    const legX = padL + mapSz + 12;
    ctx.fillStyle = 'rgba(231,236,242,0.70)'; ctx.font = '10px "IBM Plex Mono",monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(E + ' MV  ' + N_B + ' beams  FS ' + FS + ' cm', legX, 4);
    [
      { v: 95, c: 'rgba(255,255,255,0.90)', l: '95% isodose' },
      { v: 50, c: 'rgba(50,230,130,0.85)', l: '50%' },
      { v: 20, c: 'rgba(80,160,255,0.80)', l: '20%' }
    ].forEach(function(lv, i) {
      const lY = padT + 18 + i * 16;
      ctx.strokeStyle = lv.c; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(legX, lY+5); ctx.lineTo(legX+18, lY+5); ctx.stroke();
      ctx.fillStyle = 'rgba(231,236,242,0.62)'; ctx.font = '9px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(lv.l, legX + 22, lY);
    });

    /* vertical colour-bar */
    const cbX = legX + 2, cbY = padT + 80;
    const cbH = Math.max(40, H - cbY - 20), cbW = 12;
    if (cbH > 30) {
      const cg = ctx.createLinearGradient(0, cbY, 0, cbY + cbH);
      cg.addColorStop(0,    'rgb(255,255,255)');
      cg.addColorStop(0.25, 'rgb(255,200,0)');
      cg.addColorStop(0.50, 'rgb(0,230,80)');
      cg.addColorStop(0.75, 'rgb(0,200,255)');
      cg.addColorStop(1,    'rgb(0,0,0)');
      ctx.fillStyle = cg; ctx.fillRect(cbX, cbY, cbW, cbH);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
      ctx.strokeRect(cbX + 0.5, cbY + 0.5, cbW - 1, cbH - 1);
      ctx.fillStyle = 'rgba(231,236,242,0.50)'; ctx.font = '8px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left';
      [[cbY,'top','100%'], [cbY+cbH/2,'middle','50%'], [cbY+cbH,'bottom','0%']].forEach(function(row) {
        ctx.textBaseline = row[1]; ctx.fillText(row[2], cbX + cbW + 3, row[0]);
      });
    }

    /* HUD */
    ctx.fillStyle = 'rgba(231,236,242,0.78)'; ctx.font = '11px "IBM Plex Mono",monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('beams delivered: ' + beamCount, W - 6, 4);

    rtAnimState.raf = requestAnimationFrame(step);
  }

  doseGrid = null; doseKey = ''; beamCount = 0;
  rtAnimState.particles = [];
  rtAnimState.raf = requestAnimationFrame(step);
}

/* ══════════════════════════════════════════════════════════════════════
   NM ANIMATION
   Tracer particles travel along bezier arcs between four body organs.
   Per-organ activity follows A(t) = A0·f·exp(−λ_eff·t).
   Four bar-chart rows update live; MIRD cumulative dose tallies
   in the bottom strip.
   ══════════════════════════════════════════════════════════════════════ */
function rtMPAnimNM(canvas, content, stage) {
  let nmTime   = 0;   /* simulated hours elapsed */
  let nmDecays = [0, 0, 0, 0]; /* cumulative particle arrivals per organ */

  /* four compartments */
  var COMP = [
    { name:'Target organ',  f:0.30, lbr:1.0, col:stage.accent, S:5.5e-3 },
    { name:'Liver',         f:0.20, lbr:2.0, col:'#e8a33d',    S:2.1e-3 },
    { name:'Normal tissue', f:0.10, lbr:4.0, col:'#a98ef0',    S:0.8e-3 },
    { name:'Blood/excr.',   f:0.40, lbr:6.0, col:'#e0556b',    S:0.3e-3 }
  ];

  /* organ display positions as fraction of body silhouette height */
  var ORG_POS = [
    { by:0.30, bx:0.50 },  /* target (chest) */
    { by:0.48, bx:0.60 },  /* liver */
    { by:0.62, bx:0.40 },  /* normal tissue (abdomen) */
    { by:0.18, bx:0.50 }   /* blood / heart */
  ];

  function activity(compIdx, t, lamPhys, lamBiol0) {
    const lam_eff = lamPhys + COMP[compIdx].lbr * lamBiol0;
    const rampT   = 0.15 * Math.LN2 / Math.max(1e-9, lam_eff);
    return COMP[compIdx].f * Math.min(1, t / Math.max(1e-9, rampT)) * Math.exp(-lam_eff * t);
  }

  /* cumulative Ã_S via trapezoidal running integral (updated each step) */
  var prevA  = [0, 0, 0, 0];
  var A_tild = [0, 0, 0, 0];  /* Bq·h (converted to Bq·s on display) */

  function step() {
    if (!document.body.contains(canvas)) { rtStopAnim(); return; }
    const p     = rtMPReadParams(content);
    const T_p   = Math.max(0.1, p.mpP1);  /* physical T½, h */
    const T_b   = Math.max(0.1, p.mpP2);  /* biological T½ (target), h */
    const rate  = Math.max(1, Math.round(p.mpRate));
    const A0    = Math.max(1, Math.min(500, p.mpP3));  /* MBq */

    const lamP  = Math.LN2 / T_p;
    const lamB0 = Math.LN2 / T_b;
    const dt    = 0.014 * rate;  /* simulated hours per frame */
    nmTime += dt;

    /* current activity (normalised to A0×f_i) */
    const A_now = COMP.map(function(_, i) {
      return A0 * activity(i, nmTime, lamP, lamB0);
    });
    /* running trapezoidal Ã_S */
    COMP.forEach(function(_, i) {
      A_tild[i] += 0.5 * (prevA[i] + A_now[i]) * dt;
      prevA[i]   = A_now[i];
    });
    const A_max = Math.max.apply(null, A_now.concat([1e-9]));

    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0, 0, W, H);

    /* ── layout ── */
    const padT  = 22;
    const bodyW = Math.min(130, Math.round(W * 0.28));
    const barX  = bodyW + 10;
    const barW  = W - barX - 6;
    const stripH = 28;  /* bottom MIRD tally strip */
    const barAreaH = H - padT - stripH - 6;

    /* ── body silhouette ── */
    const hCX = bodyW / 2, hCY = padT + 26, hR = Math.min(22, bodyW * 0.18);
    const torsoX = hCX - 18, torsoY = hCY + hR + 3;
    const torsoW = 36, torsoH = Math.min(90, H * 0.46);
    const pelY   = torsoY + torsoH, pelH = 26, pelW = 30;

    const bodyTopY    = hCY - hR;
    const bodyBotY    = pelY + pelH;
    const bodyTH      = bodyBotY - bodyTopY;

    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(hCX, hCY, hR, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeRect(torsoX + 0.5, torsoY + 0.5, torsoW - 1, torsoH - 1);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.strokeRect(hCX - pelW/2 + 0.5, pelY + 0.5, pelW - 1, pelH - 1);

    /* ── organ blobs ── */
    COMP.forEach(function(c, i) {
      const norm = A_now[i] / A_max;
      const cx   = hCX + (ORG_POS[i].bx - 0.50) * torsoW * 0.80;
      const cy   = bodyTopY + ORG_POS[i].by * bodyTH;
      const r    = 7 + norm * 9;
      ctx.fillStyle   = c.col;
      ctx.globalAlpha = 0.12 + norm * 0.52;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = c.col; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = c.col; ctx.globalAlpha = 0.82;
      ctx.font = '7px "IBM Plex Mono",monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(A_now[i].toFixed(1), cx, cy);
      ctx.globalAlpha = 1;
    });

    /* ── spawn tracer particles (bezier arcs from blood/heart to random organ) ── */
    const bloodIdx = 3;
    const bloodCX  = hCX + (ORG_POS[bloodIdx].bx - 0.50) * torsoW * 0.80;
    const bloodCY  = bodyTopY + ORG_POS[bloodIdx].by * bodyTH;

    for (let f = 0; f < rate; f++) {
      if (Math.random() > A_now[bloodIdx] / A0 * 3.5) continue;
      const ti   = Math.floor(Math.random() * 4);
      const tgCX = hCX + (ORG_POS[ti].bx - 0.50) * torsoW * 0.80;
      const tgCY = bodyTopY + ORG_POS[ti].by * bodyTH;
      /* control point for bezier curvature */
      const cpX  = (bloodCX + tgCX) / 2 + (Math.random() - 0.5) * 18;
      const cpY  = (bloodCY + tgCY) / 2 - 10 - Math.random() * 10;
      rtAnimState.particles.push({
        sx: bloodCX, sy: bloodCY,
        tx: tgCX,    ty: tgCY,
        cpX: cpX,    cpY: cpY,
        t: 0, col: COMP[ti].col, ti: ti, alive: true
      });
    }

    /* ── advance and draw particles along quadratic bezier ── */
    rtAnimState.particles = rtAnimState.particles.filter(function(par) {
      par.t = Math.min(1, par.t + 0.045);
      const u  = par.t;
      const u1 = 1 - u;
      const px = u1*u1*par.sx + 2*u1*u*par.cpX + u*u*par.tx;
      const py = u1*u1*par.sy + 2*u1*u*par.cpY + u*u*par.ty;
      if (par.t >= 1) {
        nmDecays[par.ti]++;
        /* arrival flash */
        ctx.strokeStyle = par.col; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.55;
        ctx.beginPath(); ctx.arc(par.tx, par.ty, 7, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
        return false;
      }
      ctx.fillStyle   = par.col;
      ctx.globalAlpha = 0.78;
      ctx.beginPath(); ctx.arc(px, py, 2.0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      return true;
    });

    /* ── activity bar chart ── */
    ctx.fillStyle = 'rgba(231,236,242,0.70)'; ctx.font = '10px "IBM Plex Mono",monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('Activity  A(t)  [MBq]', barX, padT);

    const nC   = COMP.length;
    const rowH = barAreaH / nC;
    const namW = 78, valW = 48;
    const bSt  = barX + namW, bMW = barW - namW - valW;

    COMP.forEach(function(c, i) {
      const yMid = padT + 14 + i * rowH + rowH / 2;
      const bH   = Math.max(6, Math.min(13, rowH * 0.46));
      const bw   = A_max > 0 ? (A_now[i] / A_max) * bMW : 0;

      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.015)';
        ctx.fillRect(barX, padT + 14 + i * rowH, barW, rowH);
      }
      ctx.fillStyle    = c.col;
      ctx.font         = 'bold 9px "IBM Plex Mono",monospace';
      ctx.textAlign    = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(c.name, barX + namW - 4, yMid);

      ctx.fillStyle   = c.col; ctx.globalAlpha = 0.72;
      ctx.fillRect(bSt, yMid - bH/2, Math.max(1, bw), bH);
      ctx.globalAlpha = 1;

      ctx.fillStyle    = c.col;
      ctx.font         = '9px "IBM Plex Mono",monospace';
      ctx.textAlign    = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(A_now[i].toFixed(2) + ' MBq', bSt + bw + 4, yMid);
    });

    /* ── MIRD tally strip ── */
    const sY = H - stripH;
    ctx.fillStyle = 'rgba(10,14,20,0.80)';
    ctx.fillRect(barX, sY, barW, stripH);

    const T_eff = T_p * T_b / (T_p + T_b);
    ctx.fillStyle = stage.accent; ctx.font = '9px "IBM Plex Mono",monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(
      't = ' + nmTime.toFixed(1) + ' h  ·  T½_eff = ' + T_eff.toFixed(1) + ' h  |  ' +
      COMP.map(function(c, i) {
        const D_mGy = c.S * (A_tild[i] * 3600e6) * 1e-3; /* Ã_S: Bq·s */
        return c.name.split('/')[0] + ': ' + D_mGy.toFixed(2) + ' mGy';
      }).join('  ·  '),
      barX + 5, sY + stripH / 2
    );

    /* HUD */
    ctx.fillStyle = 'rgba(231,236,242,0.78)'; ctx.font = '11px "IBM Plex Mono",monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('A₀ = ' + A0 + ' MBq  ·  T½_phys = ' + T_p.toFixed(1) + ' h  ·  T½_biol = ' + T_b.toFixed(1) + ' h', W - 6, 4);

    rtAnimState.raf = requestAnimationFrame(step);
  }

  /* initialise */
  nmTime   = 0;
  nmDecays = [0, 0, 0, 0];
  prevA    = [0, 0, 0, 0];
  A_tild   = [0, 0, 0, 0];
  rtAnimState.particles = [];
  rtAnimState.raf = requestAnimationFrame(step);
}

/* ══════════════════════════════════════════════════════════════════════
   MASTER DRIVER  —  dispatches to CT / RT / NM based on mpModality
   ══════════════════════════════════════════════════════════════════════ */
function rtRunMedicalPhysicsAnim(canvas, content, stage) {
  /* clean up any modality-specific cached state from a previous run */
  rtAnimState.ctMU       = null;
  rtAnimState.rtDoseKey  = null;
  rtAnimState.nmTime     = null;
  rtAnimState.particles  = [];

  const p   = rtMPReadParams(content);
  const mod = Math.min(2, Math.max(0, Math.round(p.mpModality)));

  if      (mod === 0) rtMPAnimCT(canvas, content, stage);
  else if (mod === 1) rtMPAnimRT(canvas, content, stage);
  else                rtMPAnimNM(canvas, content, stage);
}
 


  function rtStopAnim(){
    if(rtAnimState.raf){
      cancelAnimationFrame(rtAnimState.raf);
      rtAnimState.raf = null;
    }
    rtAnimState.particles = [];
    document.querySelectorAll('.rt-anim-toggle-btn').forEach(function(b){
      b.textContent = '▶ Play';
      b.setAttribute('data-state', 'paused');
    });
  }

  function rtDrawAnimIdle(canvas, color){
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, w = sized.w, h = sized.h;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.25;
    ctx.setLineDash([4,4]);
    ctx.strokeRect(8.5, 8.5, Math.max(0,w-17), Math.max(0,h-17));
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(231,236,242,0.4)';
    ctx.font = '12px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Press Play to start the beam', w/2, h/2);
  }


/* ─── Dosimetry: live depth-dose animation ──────────────────────────── */
  function rtRunDosimetryAnim(canvas, content, stage){
    var nBins = 80;
    rtAnimState.doseBins  = new Array(nBins).fill(0);
    rtAnimState.doseTotal = 0;
    var lastBeamType = -1; // -1 triggers a clean initialise on frame 1

    function readParams(){
      var p = {};
      content.anim.params.forEach(function(def){
        var el = document.getElementById('p-'+def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    /* ── Same parametric models as the simulation tab (0–1 range) ── */
    function photonPDD01(d, E, FS){
      var dmax   = 0.12*E + 0.80;
      var muEff  = 0.072*Math.pow(E, -0.28);
      var surf   = Math.max(0.12, 0.38 - 0.010*E);
      var fsCorr = 1 + 0.025*Math.log(Math.max(1, FS)/10);
      if(d <= 0) return surf;
      var build   = d < dmax ? surf + (1-surf)*Math.pow(d/dmax, 1.3) : 1.0;
      var falloff = Math.exp(-muEff*Math.max(0, d-dmax));
      return Math.min(1, build*falloff*fsCorr);
    }

    function electronPDD01(d, E, FS){
      var dmax = 0.25*E + 0.10;
      var Rp   = 0.52*E;
      var surf = Math.min(0.95, 0.60 + 0.020*E);
      var brem = 0.010*E;
      if(d <= 0) return surf;
      if(d <= dmax) return surf + (1-surf)*(d/dmax);
      if(d <= Rp)   return brem + (1-brem)*Math.pow(Math.max(0, (Rp-d)/(Rp-dmax)), 0.85);
      return Math.max(0, brem*Math.exp(-0.10*(d-Rp)));
    }

    function pdd01(d, isEl, E, FS){ return isEl ? electronPDD01(d,E,FS) : photonPDD01(d,E,FS); }

    function step(){
      if(!document.body.contains(canvas)){ rtStopAnim(); return; }
      var p        = readParams();
      var isEl     = p.beamType >= 0.5;
      var E        = p.energy;
      var FS       = p.fieldSize;

      /* reset histogram when beam type flips mid-play */
      if(p.beamType !== lastBeamType){
        rtAnimState.doseBins.fill(0);
        rtAnimState.doseTotal = 0;
        rtAnimState.particles = [];
        lastBeamType = p.beamType;
      }

      var sized = rtSizeCanvas(canvas);
      var ctx = sized.ctx, W = sized.w, H = sized.h;

      var maxD   = 30;                                // cm
      var padL   = 28, padR = 12;
      var phanW  = W - padL - padR;
      var histH  = Math.min(76, Math.round(H*0.33));
      var trackH = H - histH - 10;
      var pxPerCm = phanW / maxD;
      var bw     = phanW / nBins;
      var Rp     = isEl ? 0.52*E : maxD;

      /* ── Draw phantom background ── */
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(14,30,50,0.45)';
      ctx.fillRect(padL, 0, phanW, trackH);
      ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
      ctx.strokeRect(padL+.5, .5, phanW-1, trackH-1);

      /* depth tick marks */
      ctx.strokeStyle = 'rgba(255,255,255,0.09)';
      for(var d = 5; d < maxD; d += 5){
        var tx = padL + d*pxPerCm;
        ctx.beginPath(); ctx.moveTo(tx, trackH-8); ctx.lineTo(tx, trackH); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(231,236,242,0.28)'; ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('water phantom', padL+4, 3);

      /* depth cm labels */
      ctx.fillStyle = 'rgba(231,236,242,0.22)'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for(var dl = 5; dl <= 25; dl += 5){
        ctx.fillText(dl, padL+dl*pxPerCm, trackH-10);
      }

      /* ── Spawn new particles ── */
      var halfBeam = Math.min(trackH*0.38, (FS/maxD)*phanW*0.5);
      for(var i = 0; i < Math.round(p.rate); i++){
        var y0 = trackH/2 + (Math.random()-0.5)*halfBeam*2;
        rtAnimState.particles.push({ x:padL, y:y0, physD:0, alive:true });
        /* immediately record a full PDD profile for this particle into the histogram */
        for(var b = 0; b < nBins; b++){
          var bd = (b+0.5)/nBins * maxD;
          rtAnimState.doseBins[b] += pdd01(bd, isEl, E, FS);
        }
        rtAnimState.doseTotal++;
      }

      var speed = 1.8; // px per frame
      var lineColor = isEl ? '#7be39a' : stage.accent;

      /* ── Advance and draw particles ── */
      rtAnimState.particles = rtAnimState.particles.filter(function(par){
        if(!par.alive) return false;
        par.x    += speed;
        par.physD = (par.x - padL) / pxPerCm;
        var doseHere = pdd01(par.physD, isEl, E, FS);

        if(par.physD > Rp || par.x > padL+phanW+5){ par.alive = false; return false; }

        var r = 1.5 + 2.0*doseHere;
        ctx.fillStyle   = lineColor;
        ctx.globalAlpha = 0.25 + 0.68*doseHere;
        ctx.beginPath(); ctx.arc(par.x, par.y, r, 0, Math.PI*2); ctx.fill();
        if(doseHere > 0.80){                          // glow at high-dose region
          ctx.globalAlpha = 0.18;
          ctx.beginPath(); ctx.arc(par.x, par.y, r*2.8, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        return true;
      });

      /* ── Accumulated dose histogram ── */
      var maxBin = 1;
      rtAnimState.doseBins.forEach(function(v){ if(v > maxBin) maxBin = v; });

      var histTop = trackH + 10;
      ctx.fillStyle = 'rgba(10,14,20,0.70)';
      ctx.fillRect(padL, histTop, phanW, histH);
      ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
      ctx.strokeRect(padL+.5, histTop+.5, phanW-1, histH-1);

      for(var b = 0; b < nBins; b++){
        var frac = rtAnimState.doseBins[b] / maxBin;
        var bh   = Math.max(0, frac*(histH-6));
        ctx.fillStyle   = lineColor;
        ctx.globalAlpha = 0.42 + 0.40*frac;
        ctx.fillRect(padL+b*bw, histTop+histH-bh, bw+0.5, bh);
      }
      ctx.globalAlpha = 1;

      /* ── Theoretical PDD overlay on histogram ── */
      ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.42)'; ctx.lineWidth = 1.5;
      for(var b = 0; b < nBins; b++){
        var bd = (b+0.5)/nBins * maxD;
        var th = pdd01(bd, isEl, E, FS);
        var px = padL + (b+0.5)*bw;
        var py = histTop + histH - 3 - th*(histH-6);
        b === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();

      ctx.fillStyle = 'rgba(231,236,242,0.30)'; ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('depth-dose histogram  (white line = theory PDD)', padL+4, histTop+2);

      /* ── Electron R_p dashed marker on phantom ── */
      if(isEl && Rp < maxD){
        var rpPx = padL + Rp*pxPerCm;
        ctx.strokeStyle = 'rgba(123,227,154,0.48)'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
        ctx.beginPath(); ctx.moveTo(rpPx, 6); ctx.lineTo(rpPx, trackH-3); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(123,227,154,0.68)'; ctx.font = '9px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('Rp', rpPx, 6);
      }

      /* ── HUD ── */
      ctx.fillStyle = 'rgba(231,236,242,0.75)'; ctx.font = '11px "IBM Plex Mono", monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText(
        (isEl ? 'e\u207b '+E+' MeV' : '\u03b3 '+E+' MV')+
        '  \u2502  n = '+rtAnimState.doseTotal,
        W-5, 4
      );

      rtAnimState.raf = requestAnimationFrame(step);
    }
    rtAnimState.raf = requestAnimationFrame(step);
  }


function rtRunAttenuationAnim(canvas, content, stage){
    rtAnimState.incident = 0;
    rtAnimState.transmitted = 0;

    function readParams(){
      const p = {};
      content.anim.params.forEach(function(def){
        const el = document.getElementById('p-' + def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    function step(){
      if(!document.body.contains(canvas)){ rtStopAnim(); return; }
      const p = readParams();
      const sized = rtSizeCanvas(canvas);
      const ctx = sized.ctx, W = sized.w, H = sized.h;

      const margin = 24;
      const xScale = (W - margin * 2) / (p.thickness * 1.3);
      const x0 = margin + xScale * (p.thickness * 0.15);
      const slabStartPx = x0, slabEndPx = x0 + p.thickness * xScale;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(slabStartPx, 0, slabEndPx - slabStartPx, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(slabStartPx, 0); ctx.lineTo(slabStartPx, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(slabEndPx, 0); ctx.lineTo(slabEndPx, H); ctx.stroke();
      ctx.setLineDash([]);

      for(let i=0; i<Math.round(p.rate); i++){
        rtAnimState.particles.push({ x:0, y: 6 + Math.random() * (H - 12), alive:true, counted:false });
        rtAnimState.incident++;
      }

      const speedPxPerFrame = 2.4;
      const survive = Math.exp(-p.mu * (speedPxPerFrame / xScale));

      rtAnimState.particles = rtAnimState.particles.filter(function(particle){
        if(!particle.alive) return false;
        particle.x += speedPxPerFrame;
        const physX = (particle.x - x0) / xScale;
        const insideSlab = physX > 0 && physX < p.thickness;
        if(insideSlab && Math.random() > survive){
          if(Math.random() < p.geometry){
            particle.y += (Math.random()-0.5)*3;
          } else {
            particle.alive = false;
            ctx.fillStyle = stage.accent;
            ctx.globalAlpha = 0.6;
            ctx.beginPath(); ctx.arc(particle.x, particle.y, 4, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
            return false;
          }
        }
        if(particle.x > W + 5){
          if(!particle.counted){ rtAnimState.transmitted++; particle.counted = true; }
          return false;
        }
        ctx.fillStyle = (particle.x < slabStartPx || particle.x > slabEndPx) ? '#9fb3c8' : '#7be39a';
        ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(particle.x, particle.y, 2.6, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        return true;
      });

      const measured = rtAnimState.incident ? (100 * rtAnimState.transmitted / rtAnimState.incident) : 0;
      const theory = 100 * Math.exp(-p.mu * p.thickness);
      ctx.fillStyle = 'rgba(231,236,242,0.75)';
      ctx.font = '11px "IBM Plex Mono", monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText('transmitted ' + measured.toFixed(1) + '%  (theory ' + theory.toFixed(1) + '%)', W - 8, 8);

      rtAnimState.raf = requestAnimationFrame(step);
    }
    rtAnimState.raf = requestAnimationFrame(step);
  }

function rtRunScatteringAnim(canvas, content, stage){
    rtAnimState.scatterCount = 0;
    rtAnimState.angleSum = 0;
    const colorCompton = '#36c2d6', colorRayleigh = '#a98ef0';

    function readParams(){
      const p = {};
      content.anim.params.forEach(function(def){
        const el = document.getElementById('p-' + def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    function step(){
      if(!document.body.contains(canvas)){ rtStopAnim(); return; }
      const p = readParams();
      const alpha = p.photonEnergy / 511;
      const sized = rtSizeCanvas(canvas);
      const ctx = sized.ctx, W = sized.w, H = sized.h;

      const margin = 24;
      const foilX = margin + (W - margin * 2) * 0.3;

      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(foilX, 4); ctx.lineTo(foilX, H - 4); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(231,236,242,0.4)';
      ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('scattering foil', foilX, 4);

      const speed = 2.6;
      for(let i = 0; i < Math.round(p.rate); i++){
        rtAnimState.particles.push({ x: 0, y: H / 2 + (Math.random() - 0.5) * (H - 20), vx: speed, vy: 0, scattered: false });
      }

      rtAnimState.particles = rtAnimState.particles.filter(function(particle){
        particle.x += particle.vx;
        particle.y += particle.vy;

        if(!particle.scattered && particle.x >= foilX){
          const isCoherent = Math.random() < p.coherentFraction;
          const cosTheta = isCoherent ? rtSampleRayleighCosTheta(alpha) : rtSampleComptonCosTheta(alpha);
          const theta = Math.acos(cosTheta);
          const sign = Math.random() < 0.5 ? 1 : -1;
          const thetaSigned = theta * sign;
          particle.vx = speed * Math.cos(thetaSigned);
          particle.vy = speed * Math.sin(thetaSigned);
          particle.scattered = true;
          particle.color = isCoherent ? colorRayleigh : colorCompton;
          rtAnimState.scatterCount++;
          rtAnimState.angleSum += Math.abs(thetaSigned) * 180 / Math.PI;
        }

        if(particle.x > W + 5 || particle.x < -5 || particle.y < -5 || particle.y > H + 5) return false;

        ctx.fillStyle = particle.scattered ? particle.color : '#9fb3c8';
        ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(particle.x, particle.y, 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        return true;
      });

      const avgAngle = rtAnimState.scatterCount ? (rtAnimState.angleSum / rtAnimState.scatterCount).toFixed(1) : '0.0';
      ctx.fillStyle = 'rgba(231,236,242,0.75)';
      ctx.font = '11px "IBM Plex Mono", monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText('avg scatter angle ' + avgAngle + '°  (n=' + rtAnimState.scatterCount + ')', W - 8, 8);

      rtAnimState.raf = requestAnimationFrame(step);
    }
    rtAnimState.raf = requestAnimationFrame(step);
  }


function rtRunAbsorptionAnim(canvas, content, stage){
    rtAnimState.incidentCount = 0;
    rtAnimState.depositSum = 0;
    rtAnimState.bursts = [];
    const colorPE = stage.accent, colorCompton = '#36c2d6', colorPP = '#a98ef0';

    function readParams(){
      const p = {};
      content.anim.params.forEach(function(def){
        const el = document.getElementById('p-' + def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    function step(){
      if(!document.body.contains(canvas)){ rtStopAnim(); return; }
      const p = readParams();
      const alpha = p.photonEnergy / 511;
      const sized = rtSizeCanvas(canvas);
      const ctx = sized.ctx, W = sized.w, H = sized.h;

      const margin = 24;
      const absX = margin + (W - margin * 2) * 0.34;

      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(absX, 4); ctx.lineTo(absX, H - 4); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(231,236,242,0.4)';
      ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('absorber', absX, 4);

      const wPE = Math.pow(p.atomicNumber, 4.5) / Math.pow(p.photonEnergy, 3) * 24;
      const wCompton = p.atomicNumber / (1 + p.photonEnergy / 3000);
      const ppTerm = Math.max(0, p.photonEnergy - 1022) / 1000;
      const wPP = p.atomicNumber * p.atomicNumber * ppTerm * ppTerm * 0.00029;
      const wSum = wPE + wCompton + wPP || 1;
      const pPE = wPE / wSum, pCompton = wCompton / wSum;

      const speed = 2.6;
      for(let i = 0; i < Math.round(p.rate); i++){
        rtAnimState.particles.push({ x:0, y: H/2 + (Math.random()-0.5)*(H-20), vx:speed, vy:0, interacted:false, color:'#9fb3c8' });
      }

      const pending = [];

      rtAnimState.particles = rtAnimState.particles.filter(function(particle){
        particle.x += particle.vx;
        particle.y += particle.vy;

        if(!particle.interacted && !particle.mini && particle.x >= absX){
          particle.interacted = true;
          rtAnimState.incidentCount++;
          const r = Math.random();

          if(r < pPE){
            const Edep = p.photonEnergy;
            rtAnimState.depositSum += Edep / p.photonEnergy;
            rtAnimState.bursts.push({ x:particle.x, y:particle.y, radius:2, alpha:0.9, color:colorPE, max: 4 + 10 * Math.sqrt(Edep / p.photonEnergy) });
            return false;
          } else if(r < pPE + pCompton){
            const cosTheta = rtSampleComptonCosTheta(alpha);
            const Ep = p.photonEnergy / (1 + alpha * (1 - cosTheta));
            const Edep = p.photonEnergy - Ep;
            rtAnimState.depositSum += Edep / p.photonEnergy;
            rtAnimState.bursts.push({ x:particle.x, y:particle.y, radius:2, alpha:0.7, color:colorCompton, max: 3 + 6 * Math.sqrt(Edep / p.photonEnergy) });
            const theta = Math.acos(cosTheta) * (Math.random() < 0.5 ? 1 : -1);
            const ratio = Ep / p.photonEnergy;
            particle.vx = Math.max(0.4, speed * ratio * Math.cos(theta));
            particle.vy = speed * ratio * Math.sin(theta);
            particle.color = colorCompton;
          } else {
            const Edep = Math.max(0, p.photonEnergy - 1022);
            rtAnimState.depositSum += Edep / p.photonEnergy;
            rtAnimState.bursts.push({ x:particle.x, y:particle.y, radius:2, alpha:0.9, color:colorPP, max: 4 + 10 * Math.sqrt(Edep / p.photonEnergy) });
            const ang = Math.random() * Math.PI * 2;
            pending.push({ x:particle.x, y:particle.y, vx:1.1*Math.cos(ang), vy:1.1*Math.sin(ang), interacted:true, mini:true, color:colorPP, life:34 });
            pending.push({ x:particle.x, y:particle.y, vx:-1.1*Math.cos(ang), vy:-1.1*Math.sin(ang), interacted:true, mini:true, color:colorPP, life:34 });
            return false;
          }
        }

        if(particle.mini){
          particle.life--;
          if(particle.life <= 0) return false;
          ctx.fillStyle = particle.color;
          ctx.globalAlpha = Math.max(0, particle.life / 34) * 0.8;
          ctx.beginPath(); ctx.arc(particle.x, particle.y, 1.8, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
          return true;
        }

        if(particle.x > W + 5 || particle.x < -5 || particle.y < -5 || particle.y > H + 5) return false;
        ctx.fillStyle = particle.color;
        ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(particle.x, particle.y, 2.6, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        return true;
      });

      if(pending.length) rtAnimState.particles = rtAnimState.particles.concat(pending);

      rtAnimState.bursts = rtAnimState.bursts.filter(function(b){
        b.radius += (b.max - b.radius) * 0.25;
        b.alpha -= 0.045;
        if(b.alpha <= 0) return false;
        ctx.strokeStyle = b.color;
        ctx.globalAlpha = Math.max(0, b.alpha);
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
        return true;
      });

      const avgFrac = rtAnimState.incidentCount ? (100 * rtAnimState.depositSum / rtAnimState.incidentCount) : 0;
      ctx.fillStyle = 'rgba(231,236,242,0.75)';
      ctx.font = '11px "IBM Plex Mono", monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText('mean energy-transfer fraction \u2248 ' + avgFrac.toFixed(1) + '%  (n=' + rtAnimState.incidentCount + ')', W - 8, 8);

      rtAnimState.raf = requestAnimationFrame(step);
    }
    rtAnimState.raf = requestAnimationFrame(step);
  }

/* ─── Radiation Biology: live cell-population irradiation ──────────── */
  function rtRunRadiationBiologyAnim(canvas, content, stage){
    const COLS = 14, ROWS = 6, N_CELLS = COLS * ROWS;
    rtAnimState.cells = [];
    for(let i = 0; i < N_CELLS; i++) rtAnimState.cells.push({ alive:true, fade:1 });
    rtAnimState.rbDose = 0;
    rtAnimState.rbTrace = [];

    function readParams(){
      const p = {};
      content.anim.params.forEach(function(def){
        const el = document.getElementById('p-' + def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    function step(){
      if(!document.body.contains(canvas)){ rtStopAnim(); return; }
      const p = readParams();
      const alpha = p.rbAlpha, abRatio = p.rbABRatio, beta = alpha / abRatio, oer = p.rbOER;
      const maxDoseAnim = 12;

      function sfOf(d){
        const x = d / oer;
        return Math.exp(-(alpha * x + beta * x * x));
      }

      rtAnimState.rbDose += p.rbRate;
      if(rtAnimState.rbDose > maxDoseAnim){
        rtAnimState.rbDose = 0;
        rtAnimState.cells.forEach(function(c){ c.alive = true; c.fade = 1; });
        rtAnimState.rbTrace = [];
      }
      const D = rtAnimState.rbDose;
      const targetAlive = Math.round(sfOf(D) * N_CELLS);
      let aliveCount = 0;
      rtAnimState.cells.forEach(function(c){ if(c.alive) aliveCount++; });
      while(aliveCount > targetAlive){
        const idx = Math.floor(Math.random() * N_CELLS);
        if(rtAnimState.cells[idx].alive){ rtAnimState.cells[idx].alive = false; aliveCount--; }
      }
      rtAnimState.rbTrace.push({ d:D, sf: aliveCount / N_CELLS });

      const sized = rtSizeCanvas(canvas);
      const ctx = sized.ctx, W = sized.w, H = sized.h;
      ctx.clearRect(0, 0, W, H);

      /* Cell field */
      const fieldH = Math.round(H * 0.58);
      const cellPad = 8;
      const cw = (W - cellPad*2) / COLS, ch = (fieldH - cellPad*2) / ROWS;
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(0, 0, W, fieldH);
      rtAnimState.cells.forEach(function(c, i){
        const col = i % COLS, row = Math.floor(i / COLS);
        const cx = cellPad + col*cw + cw/2;
        const cy = cellPad + row*ch + ch/2;
        const r = Math.min(cw, ch) * 0.32;
        if(c.alive){
          ctx.fillStyle = stage.accent; ctx.globalAlpha = 0.85;
        } else {
          c.fade = Math.max(0.18, c.fade - 0.04);
          ctx.fillStyle = '#5a6472'; ctx.globalAlpha = c.fade;
        }
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;

      /* Survival curve trace */
      const curveTop = fieldH + 8, curveH = H - fieldH - 12;
      ctx.fillStyle = 'rgba(10,14,20,0.7)';
      ctx.fillRect(0, curveTop, W, curveH);
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.strokeRect(0.5, curveTop+.5, W-1, curveH-1);

      function dPx(d){ return 6 + (d / maxDoseAnim) * (W - 12); }
      function sfPy(sf){
        const clamped = Math.max(1e-4, Math.min(1, sf));
        const frac = (Math.log10(clamped) + 4) / 4;
        return curveTop + (1 - frac) * (curveH - 4) + 2;
      }

      ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
      for(let i = 0; i <= 100; i++){
        const d = (i/100) * maxDoseAnim;
        const y = sfPy(sfOf(d));
        i === 0 ? ctx.moveTo(dPx(d), y) : ctx.lineTo(dPx(d), y);
      }
      ctx.stroke();

      ctx.beginPath(); ctx.strokeStyle = stage.accent; ctx.lineWidth = 2;
      rtAnimState.rbTrace.forEach(function(pt, i){
        const y = sfPy(pt.sf);
        i === 0 ? ctx.moveTo(dPx(pt.d), y) : ctx.lineTo(dPx(pt.d), y);
      });
      ctx.stroke();

      ctx.fillStyle = 'rgba(231,236,242,0.75)'; ctx.font = '11px "IBM Plex Mono", monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
