<!DOCTYPE html>

<title>Radiation Transport — Interactive Concept Map</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0e14;
    --panel:#121822;
    --panel-2:#161d29;
    --border:#232b38;
    --text:#e7ecf2;
    --text-dim:#cdd5df;
    --muted:#8993a3;
    --display:'Space Grotesk','Segoe UI',sans-serif;
    --body:'Inter','Segoe UI',sans-serif;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --amber:#e8a33d;
    --cyan:#36c2d6;
    --crimson:#e0556b;
    --violet:#a98ef0;
    --accent:#36c2d6;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size:26px 26px;
    color:var(--text);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  :focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:3px;}

  .rt-app{max-width:1400px;margin:0 auto;padding:32px 28px 56px;}

  /* ---------- Header ---------- */
  .rt-header{margin-bottom:22px;}
  .rt-eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:14px;display:flex;gap:10px;align-items:center;
  }
  .rt-eyebrow .dot{
    width:7px;height:7px;border-radius:50%;flex:none;
    background:linear-gradient(90deg,var(--amber),var(--cyan),var(--crimson),var(--violet));
  }
  .rt-title{
    font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,44px);
    letter-spacing:-0.01em;margin:0 0 10px;
  }
  .rt-subtitle{color:var(--muted);font-size:15px;max-width:660px;line-height:1.55;margin:0 0 22px;}

  .rt-tabs-primary{display:flex;gap:10px;flex-wrap:wrap;}
  .rt-tab-primary{
    display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--border);border-radius:999px;
    padding:9px 16px 9px 12px;font-family:var(--mono);font-size:12.5px;color:var(--muted);
    cursor:pointer;transition:border-color .15s,color .15s,background .15s;
  }
  .rt-tab-primary .swatch{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;}
  .rt-tab-primary .code{color:var(--accent);font-weight:600;}
  .rt-tab-primary:hover{border-color:var(--accent);color:var(--text);}
  .rt-tab-primary.active{
    background:color-mix(in srgb, var(--accent) 14%, var(--panel));
    border-color:var(--accent);color:var(--text);
  }
  .rt-tab-primary.active .swatch{box-shadow:0 0 9px 1px var(--accent);}

  /* ---------- Main layout ---------- */
  .rt-main{display:grid;grid-template-columns:440px 1fr;gap:22px;align-items:start;}
  @media (max-width:980px){ .rt-main{grid-template-columns:1fr;} }

  .rt-diagram-panel{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:18px 14px;position:sticky;top:20px;
    max-height:calc(100vh - 40px);overflow:auto;
  }
  @media (max-width:980px){ .rt-diagram-panel{position:static;max-height:560px;} }
  .rt-diagram-panel::-webkit-scrollbar{width:8px;}
  .rt-diagram-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .rt-diagram-panel::-webkit-scrollbar-track{background:transparent;}
  .rt-diagram-panel svg{width:100%;display:block;}

  /* ---------- SVG diagram ---------- */
  .rt-node{cursor:pointer;}
  .rt-node rect.box{
    fill:var(--panel-2);stroke:var(--accent);stroke-width:1.3;
    transition:stroke-width .15s, filter .15s, fill .15s;
  }
  .rt-node:hover rect.box,.rt-node.active rect.box{
    stroke-width:2.2;filter:drop-shadow(0 0 6px var(--accent));
  }
  .rt-node.active rect.box{fill:color-mix(in srgb, var(--accent) 16%, var(--panel-2));}
  .rt-bracket{fill:none;stroke:var(--accent);stroke-width:1.3;opacity:.85;pointer-events:none;transition:stroke-width .15s;}
  .rt-node:hover .rt-bracket,.rt-node.active .rt-bracket{stroke-width:2;}
  .rt-code{font-family:var(--mono);font-size:9.5px;fill:var(--accent);letter-spacing:.04em;}
  .rt-label{font-family:var(--display);font-size:12.5px;font-weight:600;fill:var(--text);}
  .rt-node-parent .rt-label{font-size:14px;}

  .rt-line{stroke-width:1.3;}
  .rt-line-flow{stroke-dasharray:4 7;opacity:.55;animation:rtFlow 3.2s linear infinite;}
  @keyframes rtFlow{ to{ stroke-dashoffset:-44; } }
  @media (prefers-reduced-motion:reduce){ .rt-line-flow{animation:none;} }

  /* ---------- Detail panel ---------- */
  .rt-detail-panel{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    min-height:520px;
  }
  .rt-tabs-secondary{
    display:flex;gap:0;flex-wrap:wrap;padding:14px 20px 0;border-bottom:1px solid var(--border);
  }
  .rt-tab-secondary{
    font-family:var(--mono);font-size:12px;color:var(--muted);background:transparent;border:none;
    border-bottom:2px solid transparent;padding:8px 4px 12px;margin-right:18px;cursor:pointer;
    transition:color .15s,border-color .15s;
  }
  .rt-tab-secondary .rt-tab-code{color:var(--muted);margin-right:5px;}
  .rt-tab-secondary:hover{color:var(--text);}
  .rt-tab-secondary.active{color:var(--accent);border-color:var(--accent);}
  .rt-tab-secondary.active .rt-tab-code{color:var(--accent);}

  .rt-content{padding:26px 30px 34px;}
  .rt-breadcrumb{
    font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:12px;
  }
  .rt-breadcrumb .code{color:var(--accent);font-weight:600;margin-right:8px;}
  .rt-content h2{font-family:var(--display);font-size:27px;margin:0 0 6px;letter-spacing:-0.01em;}
  .rt-tagline{color:var(--accent);font-size:14px;font-style:italic;margin:0 0 20px;font-family:var(--body);}
  .rt-overview p{line-height:1.65;color:var(--text-dim);margin:0 0 14px;font-size:15px;}
  .rt-section-label{
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--muted);margin:26px 0 12px;display:flex;align-items:center;gap:10px;
  }
  .rt-section-label::after{content:'';flex:1;height:1px;background:var(--border);}
  .rt-bullets{margin:0;padding:0;list-style:none;display:grid;gap:9px;}
  .rt-bullets li{padding-left:18px;position:relative;line-height:1.5;color:var(--text-dim);font-size:14.5px;}
  .rt-bullets li::before{
    content:'';position:absolute;left:0;top:6px;width:7px;height:7px;
    background:var(--accent);border-radius:1px;transform:rotate(45deg);
  }
  .rt-eq-box{
    background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:6px;padding:18px 20px 14px;margin:8px 0 4px;overflow-x:auto;
  }
  .rt-eq-box .MathJax{font-size:1.05em;}
  .rt-eq-note{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:10px;}
  .rt-viz{margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel-2);}
  .rt-viz-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);}
  .rt-viz-head span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;}
  .rt-run-btn{
    font-family:var(--mono);font-size:11.5px;color:var(--text);background:transparent;
    border:1px solid var(--accent);border-radius:5px;padding:6px 12px;cursor:pointer;
    transition:background .15s;
  }
  .rt-run-btn:hover{background:color-mix(in srgb, var(--accent) 18%, transparent);}
  .rt-canvas-wrap{height:170px;}
  .rt-canvas-wrap canvas{width:100%;height:100%;display:block;}
  .rt-todo{
    margin-top:24px;border:1px dashed var(--border);border-radius:8px;padding:13px 15px;
    font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.55;
    display:flex;gap:10px;align-items:flex-start;
  }
  .rt-todo span{flex:1;}

  .rt-footer{margin-top:26px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11.5px;}

  .rt-toast{
    position:fixed;bottom:26px;left:50%;transform:translate(-50%,12px);
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:11px 18px;font-family:var(--mono);font-size:12.5px;color:var(--text);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    box-shadow:0 8px 30px rgba(0,0,0,.45);z-index:50;max-width:90vw;text-align:center;
  }
  .rt-toast.show{opacity:1;transform:translate(-50%,0);}

  .rt-subtabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .rt-subtab{
    font-family:var(--mono);font-size:12.5px;color:var(--muted);background:transparent;border:none;
    border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;transition:color .15s,border-color .15s;
  }
  .rt-subtab:hover{color:var(--text);}
  .rt-subtab.active{color:var(--accent);border-color:var(--accent);}
  .rt-subtab-content{padding-top:18px;}
  .rt-sim-desc{color:var(--text-dim);font-size:14px;line-height:1.55;margin:0 0 4px;}
  .rt-params{display:grid;gap:14px;margin:14px 0 18px;}
  .rt-param-row{display:grid;grid-template-columns:170px 1fr 70px;align-items:center;gap:12px;}
  .rt-param-row label{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .rt-param-val{font-family:var(--mono);font-size:12px;color:var(--text);text-align:right;}
  .rt-param-slider{width:100%;accent-color:var(--accent);}
  .rt-sim-canvas-wrap{height:230px;}
  .rt-anim-canvas-wrap{height:230px;}
  .rt-sim-results{padding:10px 14px;font-family:var(--mono);font-size:12.5px;color:var(--text-dim);border-top:1px solid var(--border);}
  @media (max-width:480px){
    .rt-param-row{grid-template-columns:1fr;gap:4px;}
    .rt-param-val{text-align:left;}
  }
</style>

  </header>

  <main class="rt-main">
    <section class="rt-diagram-panel" aria-label="Concept map diagram">
      <svg id="rtSvg" viewBox="0 0 640 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Radiation transport concept map: Radiation Transport branches into Attenuation, Scattering and Absorption, leading to Dosimetry, which branches into Absorbed, Equivalent and Effective Dose, leading to Radiation Biology, which branches into DNA Damage, Cell Survival and Tissue Response, leading to Medical Physics Applications, which branches into CT, Radiation Therapy and Nuclear Medicine."></svg>
    </section>

    <section class="rt-detail-panel" aria-label="Module detail">

      <div class="rt-content" id="rtContent"></div>

<script>
(function(){
  'use strict';

  /* =====================================================================
     DATA — the schema. Each stage has a parent (overview) node and three
     children. Codes (1, 1.1, 1.2 ...) are real sequence references, used
     consistently across the diagram, tabs and breadcrumbs.
     ===================================================================== */

  const RT_STAGES = [
    { key:'radiation-transport', label:'Radiation Transport', code:'1', accent:'#e8a33d',
      children:[
        { key:'attenuation', label:'Attenuation', code:'1.1' },
        { key:'scattering',  label:'Scattering',  code:'1.2' },
        { key:'absorption',  label:'Absorption',  code:'1.3' }
      ]},
    { key:'dosimetry', label:'Dosimetry', code:'2', accent:'#36c2d6',
      children:[
        { key:'absorbed-dose',   label:'Absorbed Dose',   code:'2.1' },
        { key:'equivalent-dose', label:'Equivalent Dose', code:'2.2' },
        { key:'effective-dose',  label:'Effective Dose',  code:'2.3' }
      ]},
    { key:'radiation-biology', label:'Radiation Biology', code:'3', accent:'#e0556b',
      children:[
        { key:'dna-damage',      label:'DNA Damage',      code:'3.1' },
        { key:'cell-survival',   label:'Cell Survival',   code:'3.2' },
        { key:'tissue-response', label:'Tissue Response', code:'3.3' }
      ]},
    { key:'medical-physics', label:'Medical Physics Applications', code:'4', accent:'#a98ef0',
      children:[
        { key:'ct',                 label:'CT',                 code:'4.1' },
        { key:'radiation-therapy',  label:'Radiation Therapy',  code:'4.2' },
        { key:'nuclear-medicine',   label:'Nuclear Medicine',   code:'4.3' }
      ]}
  ];

  const RT_CONTENT = {

    'radiation-transport': {
      tagline:`How particles and photons move energy through matter`,
      detailed:true,
      fundamentals:{
        overview:[
          `Radiation transport tracks how a population of particles or photons moves through a medium: streaming freely between interactions, then being scattered, absorbed, or multiplied at each interaction point. The governing relationships are the same whether the carrier is a photon, neutron, electron, or heavy charged particle — only the cross-sections and interaction types change.`,
          `Two ingredients fully describe the problem at a given energy: the macroscopic cross-section Sigma_t, which sets how often an interaction happens per unit path length, and the differential cross-section, which sets what kind of interaction happens and in what direction. Mean free path, attenuation, buildup, and dose all follow from these two ingredients integrated over the geometry.`,
          `Two complementary solution strategies are used in practice. Deterministic methods (discrete ordinates, diffusion) discretize the transport equation directly over angle, energy and space. Monte Carlo methods instead simulate individual particle histories: sampling a free path length, sampling an interaction type, sampling a new direction and energy, and repeating until the particle is absorbed or leaves the problem.`
        ],
        bullets:[
          `Macroscopic cross-section Sigma_t = n sigma_t (units 1/cm) sets the interaction rate per unit path length`,
          `Mean free path lambda = 1/Sigma_t is the average distance between interactions`,
          `Path length to the next interaction is exponentially distributed: P(x) = exp(-Sigma_t x)`,
          `Monte Carlo samples a free path by inverting that exponential CDF with a uniform random number`,
          `The linear Boltzmann transport equation is the exact statement of particle balance — streaming plus removal equals scattering-in plus source`
        ],
        eqs:[
          { tex:`\\Sigma_t = n\\,\\sigma_t`, note:`Macroscopic cross-section: number density times microscopic cross-section` },
          { tex:`\\lambda = \\frac{1}{\\Sigma_t}`, note:`Mean free path between interactions` },
          { tex:`P(x) = e^{-\\Sigma_t x}`, note:`Probability of travelling a distance x with no interaction` },
          { tex:`s = -\\frac{\\ln(\\xi)}{\\Sigma_t},\\quad \\xi \\sim U(0,1)`, note:`Monte Carlo sampling of the next free-path length` },
          { tex:`\\vec{\\Omega}\\cdot\\nabla\\psi + \\Sigma_t\\psi = \\int \\Sigma_s(\\vec{\\Omega}'\\to\\vec{\\Omega})\\,\\psi'\\,d\\Omega' + S`, note:`Linear Boltzmann transport equation (steady state, schematic)` }
        ]
      },
      sim:{
        description:`Each particle below samples its own path length from the exponential law above, then either scatters (random new direction) or is absorbed, until it transmits through the slab, backscatters out the front, or is absorbed inside.`,
        params:[
          { id:'sigmaT', label:'Total cross-section Σt', min:0.05, max:1.2, step:0.01, value:0.25, unit:'cm⁻¹' },
          { id:'scatFrac', label:'Scatter fraction Σs/Σt', min:0, max:1, step:0.01, value:0.6, unit:'' },
          { id:'thickness', label:'Slab thickness L', min:2, max:20, step:0.5, value:10, unit:'cm' },
          { id:'nParticles', label:'Particles', min:50, max:1500, step:50, value:400, unit:'' }
        ]
      },
      anim:{
        description:`A continuous beam enters the slab from the left. Adjust the parameters while playing — the animation reads them live, every frame.`,
        params:[
          { id:'sigmaT', label:'Total cross-section Σt', min:0.05, max:1.2, step:0.01, value:0.25, unit:'cm⁻¹' },
          { id:'scatFrac', label:'Scatter fraction Σs/Σt', min:0, max:1, step:0.01, value:0.6, unit:'' },
          { id:'thickness', label:'Slab thickness L', min:2, max:20, step:0.5, value:10, unit:'cm' },
          { id:'rate', label:'Beam intensity', min:1, max:10, step:1, value:4, unit:'/frame' }
        ]
      }
    },

'attenuation': {
      tagline:`Beam intensity falls as the radiation field thins with depth`,
      detailed:true,
      fundamentals:{
        overview:[
          `Attenuation is the net removal of photons from a collimated beam as it passes through matter. In the idealized "narrow-beam" (good) geometry, every photon that undergoes any interaction — photoelectric absorption, Compton scattering, Rayleigh scattering or pair production — is considered lost from the beam, so the surviving, uninteracted intensity falls off exponentially with depth.`,
          `The rate of that fall-off is set by the linear attenuation coefficient mu, which is simply the sum of the linear coefficients of every interaction mechanism active at that photon energy. Dividing by density gives the mass attenuation coefficient mu/rho, which depends only on composition and photon energy, not on whether the material is solid, liquid or gas — which is why tabulated mu/rho values combine additively across a compound's elements (Bragg's rule).`,
          `Real shielding geometries are rarely narrow-beam. In "broad-beam" geometry the detector or patient subtends a large enough solid angle that some scattered photons re-enter the measured beam, partially compensating for the loss predicted by the simple exponential. This is captured by a multiplicative buildup factor applied on top of the narrow-beam law.`
        ],
        bullets:[
          `mu sums the linear coefficients of every active mechanism: mu = mu_PE + mu_Compton + mu_Rayleigh + mu_PP`,
          `mu/rho (mass attenuation coefficient, cm^2/g) removes density dependence and is additive over a compound's elements`,
          `Half-value layer (HVL) and tenth-value layer (TVL) translate mu into practical shielding thicknesses`,
          `Narrow-beam (good) geometry removes every interacting photon; broad-beam geometry needs a buildup factor B >= 1`,
          `mu generally falls with increasing photon energy, except for sharp jumps at each element's absorption edges`
        ],
        eqs:[
          { tex:`\\mu = \\mu_{PE} + \\mu_{Compton} + \\mu_{Rayleigh} + \\mu_{PP}`, note:`Total linear attenuation coefficient: the sum of the linear coefficients of every interaction mechanism active at the photon energy in question.` },
          { tex:`I(x) = I_0\\,e^{-\\mu x}`, note:`Narrow-beam exponential attenuation law. I_0: incident (unattenuated) intensity. I(x): transmitted, uninteracted intensity after thickness x. mu: linear attenuation coefficient (cm⁻¹).` },
          { tex:`\\frac{\\mu}{\\rho}`, note:`Mass attenuation coefficient (cm²/g): mu divided by density rho. Depends only on composition and photon energy, so one tabulated value applies whether the material is solid, liquid or gas.` },
          { tex:`\\left(\\frac{\\mu}{\\rho}\\right)_{mix} = \\sum_i w_i \\left(\\frac{\\mu}{\\rho}\\right)_i`, note:`Bragg's additivity rule for a compound or mixture. w_i: mass fraction of element i. (mu/rho)_i: mass attenuation coefficient of that element alone.` },
          { tex:`HVL = \\frac{\\ln 2}{\\mu},\\qquad TVL = \\frac{\\ln 10}{\\mu}`, note:`Half-value and tenth-value layer: absorber thicknesses that reduce the narrow-beam intensity by factors of 2 and 10. After n HVLs, intensity falls by 2^{-n}.` },
          { tex:`I(x) = B(x)\\,I_0\\,e^{-\\mu x}`, note:`Broad-beam attenuation law. B(x): buildup factor (B ≥ 1) accounting for scattered photons that still reach a large-area detector or patient. B → 1 as the geometry approaches an ideal narrow, well-collimated beam.` }
        ]
      },
      sim:{
        description:`Each photon below is fired through an absorber of thickness L with linear attenuation coefficient μ. Every interaction removes the photon from a narrow (collimated) beam; drag "Beam geometry" toward broad to let a fraction of interacted photons still count as detected, reproducing the buildup seen in real broad-beam shielding measurements.`,
        params:[
          { id:'mu', label:'Linear atten. coeff. μ', min:0.02, max:1.0, step:0.01, value:0.15, unit:'cm⁻¹' },
          { id:'thickness', label:'Absorber thickness L', min:1, max:30, step:0.5, value:15, unit:'cm' },
          { id:'geometry', label:'Beam geometry (0=narrow,1=broad)', min:0, max:1, step:0.05, value:0, unit:'' },
          { id:'nParticles', label:'Photon histories', min:100, max:3000, step:100, value:800, unit:'' }
        ]
      },
      anim:{
        description:`A continuous photon beam streams into the absorber from the left. The live transmitted-fraction readout (top right of the canvas) should track I(x) = I0 e^(-μx) once enough photons have passed — adjust μ, thickness or geometry while playing and watch the readout respond immediately.`,
        params:[
          { id:'mu', label:'Linear atten. coeff. μ', min:0.02, max:1.0, step:0.01, value:0.15, unit:'cm⁻¹' },
          { id:'thickness', label:'Absorber thickness L', min:1, max:30, step:0.5, value:15, unit:'cm' },
          { id:'geometry', label:'Beam geometry (0=narrow,1=broad)', min:0, max:1, step:0.05, value:0, unit:'' },
          { id:'rate', label:'Beam intensity', min:1, max:10, step:1, value:4, unit:'/frame' }
        ]
      }
    },

'scattering': {
      tagline:`Interactions that redirect a particle without necessarily removing it`,
      detailed:true,
      fundamentals:{
        overview:[
          `Scattering events redirect a photon's path without necessarily removing it from the radiation field, unlike the absorption-dominated mechanisms below. Two distinct processes are responsible. Incoherent (Compton) scattering treats the interaction as a collision between the photon and a single, essentially free electron: the photon transfers part of its energy and momentum to that electron and emerges in a new direction with lower energy. Coherent (Rayleigh) scattering instead involves the photon interacting with the bound electron cloud of an entire atom acting in concert, so the atom as a whole recoils — its mass is so large that the photon loses essentially no energy.`,
          `Compton kinematics fixes a one-to-one relationship between scattering angle and energy loss: a photon scattered straight forward keeps essentially all its energy, while one backscattered through 180 degrees loses the most. The angular distribution of Compton-scattered photons follows the Klein-Nishina differential cross-section, which depends on photon energy through the same ratio E'/E set by the Compton formula. At low energy this reduces to the classical, energy-independent Thomson distribution, symmetric between forward and backward scattering; as energy rises, the distribution becomes increasingly forward-peaked.`,
          `Rayleigh scattering, by contrast, never changes the photon's energy. Its angular distribution is even more strongly forward-peaked than Compton's, and that peaking sharpens further with increasing photon energy and atomic number, since the atomic form factor that governs it suppresses large-angle scattering more strongly under those conditions. Rayleigh scattering is most significant at low photon energy and high Z — exactly the regime where the photoelectric effect also dominates — and is a relatively minor contributor at the energies where Compton scattering is strongest.`
        ],
        bullets:[
          `Compton scattering treats the photon-electron interaction as a free-electron collision; Rayleigh treats it as a coherent interaction with the whole bound atom`,
          `Compton angle and energy loss are locked together: forward scatter (θ→0) loses no energy, backscatter (θ=180°) loses the most`,
          `The Klein-Nishina differential cross-section becomes increasingly forward-peaked as photon energy rises, reducing to the symmetric Thomson distribution at low energy`,
          `Rayleigh scattering causes no energy loss and is more sharply forward-peaked than Compton, especially at high Z and high energy`,
          `Single-event angular distributions compound over many interactions to broaden a beam and produce the buildup seen in shielding calculations (see Attenuation)`
        ],
        eqs:[
          { tex:`E' = \\dfrac{E}{1+\\alpha(1-\\cos\\theta)},\\qquad \\alpha=\\dfrac{E}{m_ec^2}`, note:`Compton scattering formula. E: incident photon energy. E': scattered photon energy. θ: angle between incident and scattered photon directions. m_ec^2 = 511 keV: electron rest energy. α: incident energy expressed in units of the electron rest energy.` },
          { tex:`\\Delta\\lambda = \\lambda_C(1-\\cos\\theta),\\qquad \\lambda_C=\\dfrac{h}{m_ec}=2.426\\times10^{-3}\\,\\text{nm}`, note:`Classic wavelength-shift form of the Compton formula. Δλ: increase in photon wavelength after scattering. λ_C: Compton wavelength, a fixed physical constant.` },
          { tex:`T_e = E-E' = E\\,\\dfrac{\\alpha(1-\\cos\\theta)}{1+\\alpha(1-\\cos\\theta)}`, note:`Recoil electron kinetic energy. T_e: energy transferred to the struck electron — this is the energy that ultimately contributes to absorbed dose via the absorption pathway.` },
          { tex:`\\dfrac{d\\sigma_{KN}}{d\\Omega} = \\dfrac{r_e^2}{2}\\left(\\dfrac{E'}{E}\\right)^2\\left(\\dfrac{E'}{E}+\\dfrac{E}{E'}-\\sin^2\\theta\\right)`, note:`Klein-Nishina differential cross-section: the angular distribution of Compton-scattered photons. r_e = 2.818 fm: classical electron radius. The ratio E'/E (set by the Compton formula above) is what makes this distribution energy-dependent.` },
          { tex:`\\dfrac{d\\sigma_{Th}}{d\\Omega} = \\dfrac{r_e^2}{2}\\left(1+\\cos^2\\theta\\right)`, note:`Thomson scattering: the classical, energy-independent low-energy limit of Klein-Nishina (α→0). Symmetric front-to-back, with a minimum at θ=90°.` },
          { tex:`\\dfrac{d\\sigma_{R}}{d\\Omega} \\propto \\big[F(q,Z)\\big]^2\\,\\dfrac{d\\sigma_{Th}}{d\\Omega}`, note:`Rayleigh (coherent) scattering, schematic form. F(q,Z): atomic form factor, depending on momentum transfer q and atomic number Z, which sharply suppresses large-angle scattering — more so as q and Z increase. E'=E always for this process.` }
        ]
      },
      sim:{
        description:`Each photon below starts at energy E and, on every history, is randomly assigned to coherent (Rayleigh) or incoherent (Compton) scattering according to the coherent fraction below. Compton angles are sampled from the true Klein-Nishina distribution; Rayleigh angles are sampled from a forward-peaked distribution that sharpens with energy. Each dot marks one photon's exit direction — density along the ring is the angular distribution.`,
        params:[
          { id:'photonEnergy', label:'Photon energy E', min:10, max:2000, step:10, value:140, unit:'keV' },
          { id:'coherentFraction', label:'Coherent (Rayleigh) fraction', min:0, max:1, step:0.01, value:0.15, unit:'' },
          { id:'nParticles', label:'Photon histories', min:100, max:3000, step:100, value:800, unit:'' }
        ]
      },
      anim:{
        description:`A continuous photon beam travels left to right and strikes a thin scattering foil. Each photon that reaches the foil scatters once, at an angle sampled the same way as in the simulation tab, then continues in its new direction — watch the beam fan out downstream as you change the energy and coherent fraction.`,
        params:[
          { id:'photonEnergy', label:'Photon energy E', min:10, max:2000, step:10, value:140, unit:'keV' },
          { id:'coherentFraction', label:'Coherent (Rayleigh) fraction', min:0, max:1, step:0.01, value:0.15, unit:'' },
          { id:'rate', label:'Beam intensity', min:1, max:10, step:1, value:4, unit:'/frame' }
        ]
      }

'absorption': {
      tagline:`Where transported energy is actually deposited in the medium`,
      detailed:true,
      fundamentals:{
        overview:[
          `Absorption is the bookkeeping step between an interaction happening (covered under Attenuation) and energy actually ending up as dose. The photoelectric effect and pair production are absorption-dominated processes: in each, essentially all of the photon's energy is converted into the kinetic energy of charged particles at the interaction site. Compton scattering, by contrast, is only partly absorptive — the recoil electron deposits its kinetic energy locally, but the scattered photon carries the rest away to interact somewhere else (or escape entirely). Rayleigh scattering, covered under Scattering, contributes essentially nothing here, since it transfers no energy at all.`,
          `In the photoelectric effect, the absorbed photon ejects a bound electron with kinetic energy equal to the photon energy minus the (usually small) binding energy; that electron then deposits its energy over a short range, while the resulting inner-shell vacancy is filled by characteristic X-rays or Auger electrons — a fluorescence cascade ignored here for simplicity but real in detailed dosimetry. Because the cross-section falls steeply with energy and rises steeply with Z, the photoelectric effect dominates absorption only at low photon energy and in high-Z media — exactly the regime exploited by lead shielding and iodine- or barium-based contrast agents.`,
          `Pair production instead requires the photon to convert into an electron-positron pair in the field of a nucleus, which is only possible above the 1.022 MeV rest-mass threshold of the pair; the cross-section grows roughly with Z² above that threshold. The created positron eventually annihilates, producing two 511 keV photons that typically escape the local point — energy that was transferred to charged particles locally is not all absorbed there. This same distinction, between energy transferred (kerma) and energy locally absorbed (dose), is also why a charged particle's radiative losses (bremsstrahlung) must be subtracted out to get from mu_tr to mu_en.`
        ],
        bullets:[
          `Photoelectric and pair production are absorption-dominated; Compton transfers only part of its energy locally — the rest leaves with the scattered photon`,
          `sigma_PE scales roughly as Z^(4–5)/E^3: the strongest energy dependence of any photon interaction, dominant at low energy and high Z`,
          `Pair production requires hv ≥ 2 m_e c² = 1.022 MeV and grows roughly with Z² above that threshold`,
          `mu_tr (energy transfer) and mu_en (energy absorption) differ by the mean radiative-loss fraction g-bar — bremsstrahlung as charged particles slow, or annihilation photons in pair production`,
          `Charged-particle equilibrium (CPE) is the condition under which collision kerma and absorbed dose become numerically equal`
        ],
        eqs:[
          { tex:`\\sigma_{PE} \\propto \\dfrac{Z^{n}}{E^3},\\quad n\\approx 4\\text{–}5`, note:`Approximate photoelectric cross-section scaling. Z: atomic number of the absorber. E (or hν): photon energy. The steep E⁻³ falloff and high power of Z explain why photoelectric absorption matters only at low energy and high Z.` },
          { tex:`\\sigma_{PP} = 0\\ \\ (h\\nu < 2m_ec^2), \\qquad \\sigma_{PP}\\propto Z^{2}\\ \\ (h\\nu \\ge 2m_ec^2)`, note:`Pair-production threshold and scaling. hν: photon energy. 2m_ec² = 1.022 MeV: rest-mass energy of the electron-positron pair. Z: atomic number — the nucleus supplies recoil momentum, giving the roughly Z² dependence.` },
          { tex:`T_+ + T_- = h\\nu - 2m_ec^2`, note:`Energy balance for pair production. T₊, T₋: kinetic energies of the created positron and electron — their sum is the energy available for local deposition. The 1.022 MeV "spent" on rest mass later reappears as two 511 keV annihilation photons when the positron annihilates.` },
          { tex:`\\dfrac{\\mu_{tr}}{\\rho} = \\sum_i \\dfrac{\\mu_i}{\\rho}\\,\\dfrac{\\bar{E}_{tr,i}}{h\\nu}`, note:`Mass energy-transfer coefficient as a weighted average over interaction types i. mu_i/rho: mass attenuation coefficient for mechanism i alone. Ē_tr,i: mean energy transferred to charged particles per interaction of that type (≈hν for photoelectric, T_e for Compton, hν−1.022 MeV for pair production) — exactly what the simulation below tracks photon by photon.` },
          { tex:`\\mu_{en} = \\mu_{tr}\\,(1-\\bar{g})`, note:`Mass energy-absorption coefficient. mu_en: what eventually stays as local dose. mu_tr: what is handed to charged particles at the interaction. g-bar: mean fraction of that transferred energy subsequently radiated away (bremsstrahlung) as the charged particle slows — small for low-Z, low-energy electrons; larger for high-Z, high-energy ones.` },
          { tex:`K = \\Phi\\,\\dfrac{\\mu_{tr}}{\\rho}\\,h\\nu, \\qquad D = K_{col}\\ \\text{(under CPE)}`, note:`Kerma K: energy transferred to charged particles per unit mass, from photon fluence Φ and the energy-transfer coefficient. K_col: the "collision" part of kerma, excluding radiative losses. Under charged-particle equilibrium, absorbed dose D equals collision kerma exactly.` }
        ]
      },
      sim:{
        description:`Each photon at energy E strikes the medium (effective atomic number Z) and is classified — photoelectric, Compton, or pair production — using the relative scaling laws above. Each vertical bar is one photon's energy ledger: the solid lower segment is energy deposited locally; the dashed upper segment is energy that escapes (the scattered photon, or the annihilation photons from pair production).`,
        params:[
          { id:'photonEnergy', label:'Photon energy E', min:10, max:10000, step:10, value:140, unit:'keV' },
          { id:'atomicNumber', label:'Absorber atomic number Z', min:1, max:92, step:1, value:50, unit:'' },
          { id:'nParticles', label:'Photon histories', min:100, max:3000, step:100, value:800, unit:'' }
        ]
      },
      anim:{
        description:`A continuous photon beam strikes a thin absorber. Each photon interacts once: photoelectric and pair-production events deposit a flash of energy and vanish (pair production also emits two small annihilation photons); Compton events deposit a smaller flash and continue onward at reduced energy. Raise the photon energy past 1022 keV to watch pair production switch on.`,
        params:[
          { id:'photonEnergy', label:'Photon energy E', min:10, max:10000, step:10, value:140, unit:'keV' },
          { id:'atomicNumber', label:'Absorber atomic number Z', min:1, max:92, step:1, value:50, unit:'' },
          { id:'rate', label:'Beam intensity', min:1, max:10, step:1, value:4, unit:'/frame' }
        ]
      }
    },

'dosimetry': {
      tagline:`Turning deposited energy into a quantity that predicts biological effect`,
      detailed:true,
      fundamentals:{
        overview:[
          `Dosimetry is the quantitative science of measuring and calculating the energy deposited by ionizing radiation in matter — the indispensable bridge between the physical interaction processes of radiation transport and the biological consequences that determine clinical outcomes and radiation-protection limits. Three hierarchical quantities each build on the last by adding weighting factors: absorbed dose (the fundamental physical definition), equivalent dose (correcting for radiation quality), and effective dose (correcting for tissue sensitivity).`,
          `Absorbed dose D is defined as the mean energy imparted dε̄ per unit mass dm, with SI unit the gray (1 Gy = 1 J kg⁻¹). The closely related quantity kerma (kinetic energy released per unit mass) describes how much energy is transferred from uncharged radiation to charged particles at an interaction site, rather than how much is ultimately deposited locally. The link between the two is charged-particle equilibrium (CPE): when every charged particle leaving a small volume is exactly replaced by an identical one entering, collision kerma and absorbed dose become numerically equal — the foundation of ionisation-chamber dosimetry.`,
          `In practice, absorbed dose is inferred from a detector (usually an air-filled ionisation chamber) placed in the medium of interest. Bragg-Gray cavity theory provides the conversion: if the cavity is small enough not to perturb the charged-particle fluence, the dose in the surrounding medium equals the dose in the cavity gas multiplied by the ratio of mass stopping powers medium-to-gas, averaged over the electron spectrum. Equivalent and effective dose then layer biological meaning on top of this physical foundation. The percentage depth dose (PDD) curve, which describes how absorbed dose varies along a beam axis in a water phantom, is the quantity most directly used in treatment planning and quality assurance.`
        ],
        bullets:[
          `Absorbed dose D = dε̄/dm; SI unit gray (Gy = J kg⁻¹); older unit rad = 0.01 Gy`,
          `Kerma K = Φ hν (μ_tr/ρ): energy transferred to charged particles per unit mass from photon fluence Φ`,
          `Collision kerma K_col = K(1 − ḡ) excludes bremsstrahlung losses; equals D under charged-particle equilibrium (CPE)`,
          `Bragg-Gray cavity theory: D_med = D_gas × s̄_med,gas, where s̄ is the mean mass stopping-power ratio averaged over the electron spectrum`,
          `Equivalent dose H_T = Σ_R w_R D_{T,R} [Sv]: weights absorbed dose by radiation quality (w_R = 1 for photons, 20 for alpha particles)`,
          `Effective dose E = Σ_T w_T H_T [Sv]: sums equivalent doses weighted by relative tissue sensitivity; all w_T sum to exactly 1`,
          `Percentage depth dose (PDD) curve describes dose vs. depth in a phantom — rises through a buildup region, peaks at d_max, then falls with depth`
        ],
        eqs:[
          {
            tex:`D = \\frac{d\\bar{\\varepsilon}}{dm} \\quad [\\text{Gy} = \\text{J\\,kg}^{-1}]`,
            note:`Defining relation for absorbed dose. D: absorbed dose (gray). dε̄: mean energy imparted to the mass element by all ionising particles traversing it. dm: mass of the element. 1 Gy = 1 J kg⁻¹ is the SI unit; 1 rad (older unit) = 0.01 Gy.`
          },
          {
            tex:`K = \\Phi \\cdot h\\nu \\cdot \\frac{\\mu_{tr}}{\\rho} \\quad [\\text{Gy}]`,
            note:`Kerma (kinetic energy released per unit mass). Φ: photon fluence (photons m⁻²). hν: photon energy. μ_tr/ρ: mass energy-transfer coefficient of the medium (m² kg⁻¹), which counts how much energy is handed off to secondary electrons per unit mass. Kerma describes energy transfer at the interaction point, not local absorption.`
          },
          {
            tex:`D = K_{col} = K(1 - \\bar{g}) \\quad (\\text{under CPE})`,
            note:`Under charged-particle equilibrium (CPE), absorbed dose equals collision kerma K_col. ḡ: mean fraction of the transferred energy subsequently radiated away as bremsstrahlung before the charged particle stops. For megavoltage photon beams in tissue-equivalent materials, ḡ is small (typically < 2%), so D ≈ K to good approximation.`
          },
          {
            tex:`\\frac{D_{\\rm med}}{D_{\\rm gas}} = \\bar{s}_{\\rm med,gas}`,
            note:`Bragg-Gray cavity theory. D_med: absorbed dose in the surrounding medium of interest (e.g. water). D_gas: absorbed dose in the detector cavity gas (proportional to measured ionisation charge). s̄_med,gas: mean ratio of mass collision stopping powers of medium to gas, averaged over the secondary electron energy spectrum at the measurement point. This ratio converts a chamber reading to dose in water.`
          },
          {
            tex:`H_T = \\sum_R w_R\\,D_{T,R} \\quad [\\text{Sv}]`,
            note:`Equivalent dose to tissue T. w_R: radiation weighting factor — 1 for photons, electrons and muons; 2–20 for neutrons (energy-dependent); 20 for alpha particles and heavy ions. D_{T,R}: mean absorbed dose delivered to tissue T by radiation type R. The sievert (Sv) is numerically equal to the gray when w_R = 1.`
          },
          {
            tex:`E = \\sum_T w_T\\,H_T \\quad [\\text{Sv}]`,
            note:`Effective dose (ICRP 103). w_T: tissue weighting factor encoding relative stochastic sensitivity — e.g. 0.12 each for colon, lung, stomach, breast and red bone marrow; 0.08 for gonads; 0.01 for bone surface and salivary glands. All w_T values sum to exactly 1.00. E is a population-level protection quantity; it should not be used to predict an individual patient's cancer risk from a specific procedure.`
          }
        ]
      },
      sim:{
        description:`The plot shows the percentage depth dose (PDD) curve in a water phantom for a megavoltage photon or electron beam, using parametric models that capture the key physics: a low surface dose and dose build-up region (secondary electrons from photon interactions have finite range before depositing dose), a dose maximum at d_max, an exponential fall-off for photons, or a sharp drop at the practical range R_p for electrons. Toggle beam type and adjust energy, field size and SSD — watch how d_max, surface dose and the falloff rate respond.`,
        params:[
          { id:'beamType',  label:'Beam type  (0 = photon · 1 = electron)', min:0,  max:1,   step:1, value:0,   unit:'' },
          { id:'energy',    label:'Energy  (MV for photon / MeV for e⁻)',   min:4,  max:25,  step:1, value:6,   unit:'' },
          { id:'fieldSize', label:'Field size',                              min:5,  max:40,  step:1, value:10,  unit:'cm' },
          { id:'ssd',       label:'SSD (source-to-surface distance)',        min:80, max:120, step:5, value:100, unit:'cm' }
        ]
      },
      anim:{
        description:`A pulsed beam enters the water phantom from the left. Each particle dot brightens where local dose is high and fades where dose is low — electron beams stop abruptly at R_p, photon beams decay exponentially. The bar histogram (lower panel) accumulates the dose profile of every particle and converges toward the theoretical PDD curve (white overlay line). Change beam type or energy while playing to watch the histogram reset and rebuild.`,
        params:[
          { id:'beamType',  label:'Beam type  (0 = photon · 1 = electron)', min:0, max:1,  step:1, value:0,  unit:'' },
          { id:'energy',    label:'Energy  (MV / MeV)',                      min:4, max:25, step:1, value:6,  unit:'' },
          { id:'fieldSize', label:'Field size',                              min:5, max:40, step:5, value:10, unit:'cm' },
          { id:'rate',      label:'Beam intensity',                          min:1, max:10, step:1, value:4,  unit:'/frame' }
        ]
      }
    },


    'absorbed-dose': {
      tagline:`Energy imparted per unit mass — the bedrock of every dosimetric chain`,
      detailed:true,
      fundamentals:{
        overview:[
          `Absorbed dose D is the mean energy imparted dε̄ by ionising radiation to a mass element dm of any material, with SI unit the gray (1 Gy = 1 J kg⁻¹). It applies equally to photons, electrons, neutrons and heavy ions, and is the physical quantity from which every derived protection and clinical quantity — equivalent dose, effective dose, biologically effective dose — is constructed. The closely related quantity kerma K (kinetic energy released per unit mass) counts energy transferred from uncharged radiation to secondary charged particles at the interaction site, rather than energy actually deposited locally. The two quantities are equal only when the production rate of secondary charged particles is exactly balanced by their local stopping — a condition called charged-particle equilibrium (CPE).`,
          `CPE is the key link between kerma and dose. At any point where CPE holds, every secondary electron leaving a small volume is exactly replaced by an identical one entering, so no net energy escapes via charged particles. In a megavoltage photon beam entering a water phantom, CPE is absent at the very surface: forward-directed Compton electrons need a finite range to build up from upstream interactions. This produces the dose-buildup region — a steadily rising dose from 0 to d_max cm. Once full CPE is established beyond d_max, the dose profile tracks the exponentially attenuated kerma, spatially offset by roughly one mean electron range. The simulation tab below lets you watch this separation directly.`,
          `Practical absorbed dose is measured with an ionisation chamber whose air-filled cavity collects ionisation from secondary electrons crossing it. Bragg-Gray cavity theory converts the air-cavity dose to dose in the surrounding medium: D_med = D_gas × s̄_med,gas, where s̄ is the mean ratio of mass collision stopping powers (medium to gas), averaged over the electron energy spectrum at the measurement point. Spencer-Attix theory refines this by replacing total stopping power with a restricted stopping power L_Δ/ρ that excludes delta rays energetic enough to leave the cavity. Clinical reference dosimetry (IAEA TRS-398, AAPM TG-51) builds directly on these foundations, adding chamber calibration factors N_D,w and beam-quality correction factors k_Q to give traceable absorbed-dose-to-water values at clinical beam qualities.`
        ],
        bullets:[
          `D = dε̄/dm [Gy = J/kg]; 1 rad (older CGS unit still used clinically) = 0.01 Gy = 1 cGy`,
          `Kerma K = Φ hν (μ_tr/ρ): energy handed to charged particles per unit mass from photon fluence Φ — produced at the interaction site, not necessarily deposited there`,
          `Collision kerma K_col = K(1 − ḡ) subtracts the bremsstrahlung fraction; under CPE, K_col = D exactly`,
          `Dose build-up region: dose rises from a low surface value to 100% at d_max as forward-directed secondary electrons establish CPE over the first ~reCsda cm`,
          `Bragg-Gray: D_med = D_gas × s̄_med,gas — mean stopping-power ratio converts ionisation-chamber signal to dose in the medium of interest`,
          `Spencer-Attix refinement: replaces S_col with restricted stopping power L_Δ/ρ, correctly handling energetic delta rays that escape the cavity`,
          `Clinical reference dosimetry (TRS-398 / TG-51): D_w = M · N_D,w · k_Q, with N_D,w from a standards laboratory at ⁶⁰Co and k_Q tabulated per chamber model`
        ],
        eqs:[
          {
            tex:`D = \\frac{d\\bar{\\varepsilon}}{dm} \\quad [\\text{Gy} = \\text{J}\\,\\text{kg}^{-1}]`,
            note:`Defining relation for absorbed dose. D: absorbed dose in gray. dε̄: mean energy imparted to the mass element by all ionising particles traversing it — including any secondary particles they set in motion. dm: mass of the element. 1 Gy = 100 rad; 1 cGy = 1 rad (the older unit still used in clinical prescriptions).`
          },
          {
            tex:`K = \\Phi \\cdot h\\nu \\cdot \\frac{\\mu_{tr}}{\\rho} \\quad [\\text{Gy}]`,
            note:`Kerma from a photon fluence. Φ: photon fluence (photons m⁻²). hν: photon energy. μ_tr/ρ: mass energy-transfer coefficient (m² kg⁻¹) — the fraction of photon energy transferred to secondary electrons per unit mass traversed. Kerma records where energy leaves the photon beam, not where it is finally deposited as dose.`
          },
          {
            tex:`K_{col} = K(1-\\bar{g}),\\qquad D = K_{col} \\quad (\\text{under CPE})`,
            note:`Collision kerma K_col excludes the fraction ḡ of transferred energy subsequently radiated away as bremsstrahlung. For megavoltage photon beams in tissue-equivalent materials ḡ ≈ 0.3–2%, so D ≈ K to good approximation. Exact equality D = K_col holds only under charged-particle equilibrium; near surfaces or interfaces, CPE breaks down and the two diverge.`
          },
          {
            tex:`D = \\Phi_e \\cdot \\frac{S_{col}}{\\rho} \\quad [\\text{Gy}]`,
            note:`Dose from a charged-particle (electron) fluence Φ_e (m⁻²). S_col/ρ: mass collision stopping power (J m² kg⁻¹) — energy deposited through inelastic ionising collisions per unit mass traversed, excluding radiative (bremsstrahlung) losses. This is the direct dose equation for an electron beam; for photons, kerma bridges the gap between fluence and this stopping-power step.`
          },
          {
            tex:`\\frac{D_{\\rm med}}{D_{\\rm gas}} = \\bar{s}_{\\rm med,gas} \\equiv \\frac{\\displaystyle\\int_0^{E_{\\max}}\\Phi_e(E)\\left(\\frac{S_{col}}{\\rho}\\right)_{\\!\\rm med}dE}{\\displaystyle\\int_0^{E_{\\max}}\\Phi_e(E)\\left(\\frac{S_{col}}{\\rho}\\right)_{\\!\\rm gas}dE}`,
            note:`Bragg-Gray cavity theory. D_med: dose in the surrounding medium (e.g. water). D_gas: dose in the cavity gas (air), proportional to measured ionisation charge Q. s̄_med,gas: mean stopping-power ratio of medium to gas, weighted by the secondary electron fluence spectrum Φ_e(E) at the measurement depth. For water/air with a ⁶⁰Co beam, s̄ ≈ 1.134. Spencer-Attix theory replaces S_col/ρ with the restricted stopping power L_Δ/ρ (excluding delta rays above a cutoff Δ) for a more accurate result at high energies.`
          },
          {
            tex:`D_w = M \\cdot N_{D,w} \\cdot k_Q`,
            note:`Clinical reference dosimetry (IAEA TRS-398 / AAPM TG-51). D_w: absorbed dose to water at the reference depth (e.g. 10 cm for photons). M: electrometer reading, corrected for temperature, pressure, ion recombination, and polarity effect. N_D,w: absorbed-dose-to-water calibration factor from a primary standards laboratory, established at reference quality ⁶⁰Co. k_Q: beam-quality correction factor accounting for the difference between the clinical beam quality Q and the ⁶⁰Co reference — tabulated per chamber model in the protocol.`
          }
        ]
      },
      sim:{
        description:`The plot computes kerma K(x) and absorbed dose D(x) profiles in a water-equivalent phantom. N photon histories are sampled: each interacts at a depth drawn from the exponential survival law, producing an instantaneous kerma spike. The secondary electron carries that energy forward, depositing it exponentially with mean free path d_max (the approximate CSDA range scaled to match the d_max model). Watch the dose curve build up behind the kerma curve, then converge onto it beyond d_max where CPE is established. Toggle the kerma profile on and off to isolate the dose shape.`,
        params:[
          { id:'energy',     label:'Beam energy',                               min:2,   max:25,   step:1,  value:6,    unit:'MV' },
          { id:'medium',     label:'Medium  (0 = water  ·  1 = tissue  ·  2 = bone)', min:0, max:2, step:1, value:0, unit:'' },
          { id:'showKerma',  label:'Show kerma  (0 = off  ·  1 = on)',            min:0,   max:1,    step:1,  value:1,    unit:'' },
          { id:'nHistories', label:'Photon histories',                             min:500, max:8000, step:500,value:3000, unit:'' }
        ]
      },
      anim:{
        description:`Photons (cyan) stream into the phantom from the left. Each interaction spawns a secondary electron (amber) that carries energy forward over its approximate CSDA range. The histogram below accumulates the dose profile D(x) (cyan bars) from all electron positions, overlaid by the kerma profile K(x) (dashed amber line) from all photon interaction points. The CPE region begins beyond d_max, where the two profiles converge.`,
        params:[
          { id:'energy',  label:'Beam energy',                                min:2, max:25, step:1, value:6, unit:'MV'    },
          { id:'medium',  label:'Medium  (0 = water  ·  1 = tissue  ·  2 = bone)', min:0, max:2, step:1, value:0, unit:'' },
          { id:'rate',    label:'Beam intensity',                             min:1, max:10, step:1, value:3, unit:'/frame' }
        ]
      }
    },
    
    
    
    
'equivalent-dose': {
  tagline: `Absorbed dose weighted for the biological harm of each radiation type`,
  detailed: true,
  fundamentals: {
    overview: [
      `Equivalent dose H_T converts the physical absorbed dose D (in gray) into a biologically meaningful quantity by multiplying by a radiation weighting factor w_R that reflects how efficiently each radiation type damages DNA per unit energy deposited. The result is expressed in sievert. A photon beam and an alpha-particle beam that deliver identical absorbed doses to the same tissue are not equally harmful: the alpha beam, whose dense ionisation track is far more likely to sever both strands of a DNA double helix simultaneously, is roughly 20 times more damaging per gray — and that ratio is exactly what w_R encodes.`,
      `The physical root of w_R is linear energy transfer (LET): the mean energy a charged particle deposits per unit track length through tissue, measured in keV/μm. Low-LET radiation (photons, electrons) produces sparse, widely-spaced ionisation events; cells can efficiently repair the resulting single-strand breaks. High-LET radiation (alpha particles, heavy ions, neutron-induced recoil protons) packs ionisation events so tightly that both DNA strands are often broken by a single particle transit — a double-strand break that is far harder to repair correctly and far more likely to be lethal or mutagenic. LET therefore correlates directly with biological effectiveness and with w_R.`,
      `For most particle types w_R is a single fixed number set by ICRP 103: 1 for photons and electrons (at all energies), 2 for protons, and 20 for alpha particles and heavy ions. Neutrons are the exception: their w_R follows a continuous energy-dependent function that peaks near 0.5 MeV — where elastic-scattering recoil protons have the highest LET and biological efficiency — and falls toward 2.5 at both very low and very high neutron energies. Equivalent dose is strictly an organ-averaged radiation-protection quantity; it should not be used to predict deterministic clinical outcomes, which require the full dose distribution, not a tissue-mean.`
    ],
    bullets: [
      `H_T = Σ_R w_R D_{T,R}: equivalent dose is the sum over all radiation types R of the weighting factor times the mean absorbed dose to tissue T from that radiation`,
      `SI unit is the sievert (Sv); 1 Sv ≡ 1 J kg⁻¹ × w_R — numerically equal to the gray only when w_R = 1 (photons, electrons)`,
      `w_R = 1 for photons and electrons at all energies; w_R = 2 for protons; w_R = 20 for alpha particles, fission fragments, and heavy ions`,
      `Neutron w_R peaks at ≈ 20 near 0.5 MeV and falls to ≈ 2.5 at very low and very high energies, following the ICRP 103 continuous formula`,
      `LET is the physical correlate of w_R: low-LET (< 10 keV/μm) gives w_R ≈ 1; high-LET (> 100 keV/μm) gives w_R = 20`,
      `Relative biological effectiveness (RBE) is the experimentally measured ratio w_R approximates: the dose of reference radiation (250 kVp X-rays) giving the same biological effect as unit dose of the test radiation`,
      `Equivalent dose is organ-specific: the same w_R applies across all tissues, but D_{T,R} varies organ by organ with the exposure geometry`
    ],
    eqs: [
      {
        tex: `H_T = \\sum_R w_R\\,D_{T,R} \\quad [\\text{Sv}]`,
        note: `Defining relation for equivalent dose. H_T: equivalent dose to tissue T in sievert. w_R: dimensionless radiation weighting factor for radiation type R — encodes biological effectiveness per unit absorbed dose. D_{T,R}: mean absorbed dose (Gy) delivered to tissue T by radiation type R, averaged uniformly over the tissue mass. The sum runs over all radiation types R simultaneously present in a mixed radiation field.`
      },
      {
        tex: `w_R^{\\rm n}(E_n) = 2.5 + 17.5\\,\\exp\\!\\left(-\\frac{\\bigl[\\ln(2E_n)\\bigr]^2}{6}\\right), \\quad E_n \\text{ in MeV}`,
        note: `ICRP 103 continuous neutron weighting factor. E_n: neutron kinetic energy in MeV. The function peaks at E_n = 0.5 MeV (where ln(2×0.5)=0, giving w_R = 20), because at this energy elastic scattering produces recoil protons with the highest LET and greatest biological efficiency. It falls symmetrically (on a log-energy scale) to a plateau of ≈ 2.5 at very low energies (thermal capture reactions are low-LET) and at very high energies (recoil protons become forward-directed and lower-LET).`
      },
      {
        tex: `\\mathrm{LET} = -\\frac{dE}{dl} \\quad [\\mathrm{keV\\,\\mu m^{-1}}]`,
        note: `Linear energy transfer: the mean energy −dE lost by a charged particle per unit path length dl through the medium. LET is the physical quantity that drives the biological effectiveness encoded in w_R. Low-LET (< 10 keV/μm): photons and electrons — sparse ionisation events, primarily single-strand DNA breaks, efficient cellular repair. High-LET (> 100 keV/μm): alpha particles and heavy ions — dense ionisation clusters along the track, high probability of simultaneous double-strand breaks within one or two helical turns, largely irreparable.`
      },
      {
        tex: `\\mathrm{RBE} = \\frac{D_{\\rm ref}}{D_{\\rm test}}\\Bigg|_{\\rm same\\;effect}, \\qquad w_R \\approx \\mathrm{RBE}_{\\rm low\\text{-}dose}`,
        note: `Relative biological effectiveness. D_ref: dose of the reference radiation (250 kVp X-rays by convention) required to produce a given biological endpoint. D_test: dose of the test radiation type to produce the same endpoint. RBE varies with cell type, biological endpoint, dose level and dose rate, so the ICRP sets a single, round, conservative value w_R that approximates the low-dose RBE plateau — the regime relevant to stochastic protection quantities.`
      },
      {
        tex: `\\begin{array}{l|c|l} \\textbf{Radiation type} & \\boldsymbol{w_R} & \\textbf{LET range (keV/\\mu m)} \\\\ \\hline \\text{Photons (all }E\\text{)} & 1 & 0.2\\text{–}2 \\\\ \\text{Electrons} & 1 & 0.1\\text{–}1 \\\\ \\text{Protons} & 2 & 0.5\\text{–}8 \\\\ \\text{Neutrons} & 2.5\\text{–}20 & 15\\text{–}100^{\\,\\dagger} \\\\ \\text{Alpha particles} & 20 & 80\\text{–}200 \\\\ \\text{Heavy ions} & 20 & {>}200 \\end{array}`,
        note: `ICRP 103 radiation weighting factors and approximate LET ranges in tissue. Neutron w_R is the value from the energy-dependent formula above; the LET range shown refers to the secondary recoil protons (†) that are actually responsible for the biological damage — neutrons themselves are uncharged and do not directly ionise. Heavy-ion LET can reach several thousand keV/μm for slow, high-Z fragments near the Bragg peak.`
      }
    ]
  },
  sim: {
    description: `Each horizontal bar shows the equivalent dose H_T = w_R × D (coloured) for that radiation type, given the absorbed dose D set by the top slider (the dashed vertical line marks D for reference). The neutron bar is live — drag the neutron energy slider to sweep w_R through the full ICRP 103 curve, peaking near 0.5 MeV. The LET column on the right explains why the bars differ in length.`,

    params: [

    ]
