  /* =====================================================================
     DIAGRAM GEOMETRY
     Each "stage" repeats the same vertical pattern: parent box -> fork ->
     three child boxes -> join -> next parent box. Only the last stage
     skips the join (it is a terminal layer).
     ===================================================================== */

  const RT_GEOM = { colX:[90,320,550], parentW:260, parentH:64, childW:156, childH:64, startTop:30, stageH:224 };

  function rtStageY(i){
    const top = RT_GEOM.startTop + i * RT_GEOM.stageH;
    return {
      parentTop: top,
      parentBottom: top + RT_GEOM.parentH,
      forkY: top + RT_GEOM.parentH + 24,
      childTop: top + RT_GEOM.parentH + 24 + 24,
      childBottom: top + RT_GEOM.parentH + 24 + 24 + RT_GEOM.childH,
      joinY: top + RT_GEOM.parentH + 24 + 24 + RT_GEOM.childH + 24,
      nextParentTop: top + RT_GEOM.stageH
    };
  }

  function rtWrapLines(label, maxLen){
    if(label.length <= maxLen) return [label];
    const words = label.split(' ');
    if(words.length === 1) return [label];
    let best = 1, bestDiff = Infinity;
    for(let i=1; i<words.length; i++){
      const l1 = words.slice(0,i).join(' ').length;
      const l2 = words.slice(i).join(' ').length;
      const diff = Math.abs(l1-l2);
      if(diff < bestDiff){ bestDiff = diff; best = i; }
    }
    return [words.slice(0,best).join(' '), words.slice(best).join(' ')];
  }

  const SVG_NS = 'http://www.w3.org/2000/svg';
  function rtEl(tag){ return document.createElementNS(SVG_NS, tag); }

  function rtMakeNode(opts){
    const { key, label, code, x, y, w, h, accent, isParent } = opts;
    const g = rtEl('g');
    g.setAttribute('class', 'rt-node' + (isParent ? ' rt-node-parent' : ' rt-node-child'));
    g.setAttribute('data-key', key);
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'button');
    g.setAttribute('aria-label', label);
    g.style.setProperty('--accent', accent);

    const rect = rtEl('rect');
    rect.setAttribute('class', 'box');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', 4);
    g.appendChild(rect);

    const codeText = rtEl('text');
    codeText.setAttribute('class', 'rt-code');
    codeText.setAttribute('x', x + 10);
    codeText.setAttribute('y', y + 15);
    codeText.textContent = code;
    g.appendChild(codeText);

    const lines = rtWrapLines(label, isParent ? 22 : 16);
    const labelText = rtEl('text');
    labelText.setAttribute('class', 'rt-label');
    labelText.setAttribute('text-anchor', 'middle');
    labelText.setAttribute('x', x + w/2);
    if(lines.length === 1){
      labelText.setAttribute('y', y + h/2 + 5);
      labelText.textContent = lines[0];
    } else {
      const ts1 = rtEl('tspan');
      ts1.setAttribute('x', x + w/2); ts1.setAttribute('y', y + h/2 - 3);
      ts1.textContent = lines[0];
      const ts2 = rtEl('tspan');
      ts2.setAttribute('x', x + w/2); ts2.setAttribute('y', y + h/2 + 15);
      ts2.textContent = lines[1];
      labelText.appendChild(ts1);
      labelText.appendChild(ts2);
    }
    g.appendChild(labelText);
    return g;
  }

  function rtLine(group, x1,y1,x2,y2, color, opts){
    opts = opts || {};
    const line = rtEl('line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', 'rt-line');
    line.setAttribute('stroke', color);
    if(opts.marker) line.setAttribute('marker-end', 'url(#' + opts.marker + ')');
    group.appendChild(line);
    if(opts.flow){
      const flow = rtEl('line');
      flow.setAttribute('x1', x1); flow.setAttribute('y1', y1);
      flow.setAttribute('x2', x2); flow.setAttribute('y2', y2);
      flow.setAttribute('class', 'rt-line rt-line-flow');
      flow.setAttribute('stroke', color);
      group.appendChild(flow);
    }
  }

  function rtMakeMarker(defs, id, color){
    const marker = rtEl('marker');
    marker.setAttribute('id', id);
    marker.setAttribute('viewBox', '0 0 10 10');
    marker.setAttribute('refX', '6'); marker.setAttribute('refY', '5');
    marker.setAttribute('markerWidth', '6'); marker.setAttribute('markerHeight', '6');
    marker.setAttribute('orient', 'auto-start-reverse');
    const path = rtEl('path');
    path.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
    path.setAttribute('fill', color);
    marker.appendChild(path);
    defs.appendChild(marker);
  }

  function rtAddCornerBrackets(svg){
    const len = 8;
    svg.querySelectorAll('.rt-node').forEach(function(g){
      const rect = g.querySelector('rect.box');
      const x = parseFloat(rect.getAttribute('x'));
      const y = parseFloat(rect.getAttribute('y'));
      const w = parseFloat(rect.getAttribute('width'));
      const h = parseFloat(rect.getAttribute('height'));
      const corners = [ [x,y,1,1], [x+w,y,-1,1], [x,y+h,1,-1], [x+w,y+h,-1,-1] ];
      corners.forEach(function(c){
        const cx=c[0], cy=c[1], dx=c[2], dy=c[3];
        const p = rtEl('path');
        p.setAttribute('class', 'rt-bracket');
        p.setAttribute('d', 'M ' + (cx+dx*len) + ' ' + cy + ' L ' + cx + ' ' + cy + ' L ' + cx + ' ' + (cy+dy*len));
        g.appendChild(p);
      });
    });
  }

  function rtBuildDiagram(){
    const svg = document.getElementById('rtSvg');
    const defs = rtEl('defs');
    svg.appendChild(defs);
    const linesLayer = rtEl('g'); linesLayer.setAttribute('class','rt-lines');
    const nodesLayer = rtEl('g'); nodesLayer.setAttribute('class','rt-nodes');
    svg.appendChild(linesLayer);
    svg.appendChild(nodesLayer);

    RT_STAGES.forEach(function(stage, i){
      const Y = rtStageY(i);
      const isLast = i === RT_STAGES.length - 1;
      const markerId = 'rtArrow-' + stage.key;
      rtMakeMarker(defs, markerId, stage.accent);

      nodesLayer.appendChild(rtMakeNode({
        key: stage.key, label: stage.label, code: stage.code,
        x: RT_GEOM.colX[1] - RT_GEOM.parentW/2, y: Y.parentTop,
        w: RT_GEOM.parentW, h: RT_GEOM.parentH, accent: stage.accent, isParent: true
      }));

      rtLine(linesLayer, RT_GEOM.colX[1], Y.parentBottom, RT_GEOM.colX[1], Y.forkY, stage.accent, {});
      rtLine(linesLayer, RT_GEOM.colX[0], Y.forkY, RT_GEOM.colX[2], Y.forkY, stage.accent, {});
      RT_GEOM.colX.forEach(function(x){
        rtLine(linesLayer, x, Y.forkY, x, Y.childTop - 3, stage.accent, { flow:true, marker:markerId });
      });

      stage.children.forEach(function(child, ci){
        nodesLayer.appendChild(rtMakeNode({
          key: child.key, label: child.label, code: child.code,
          x: RT_GEOM.colX[ci] - RT_GEOM.childW/2, y: Y.childTop,
          w: RT_GEOM.childW, h: RT_GEOM.childH, accent: stage.accent, isParent: false
        }));
      });

      if(!isLast){
        RT_GEOM.colX.forEach(function(x){
          rtLine(linesLayer, x, Y.childBottom, x, Y.joinY, stage.accent, {});
        });
        rtLine(linesLayer, RT_GEOM.colX[0], Y.joinY, RT_GEOM.colX[2], Y.joinY, stage.accent, {});
        rtLine(linesLayer, RT_GEOM.colX[1], Y.joinY, RT_GEOM.colX[1], Y.nextParentTop - 3, stage.accent, { flow:true, marker:markerId });
      } else {
        RT_GEOM.colX.forEach(function(x){
          rtLine(linesLayer, x, Y.childBottom, x, Y.childBottom + 12, stage.accent, {});
          rtLine(linesLayer, x-9, Y.childBottom + 12, x+9, Y.childBottom + 12, stage.accent, {});
        });
      }
    });

    rtAddCornerBrackets(svg);
  }

  function rtSizeCanvas(canvas){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    canvas.width = w * ratio;
    canvas.height = h * ratio;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    return { ctx:ctx, w:w, h:h };
  }

  function rtDrawPlaceholder(canvas, color){
    if(!canvas) return;
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, w = sized.w, h = sized.h;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    const step = 22;
    for(let x=0; x<=w; x+=step){ ctx.beginPath(); ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,h); ctx.stroke(); }
    for(let y=0; y<=h; y+=step){ ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(w,y+0.5); ctx.stroke(); }
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(8.5, 8.5, Math.max(0,w-17), Math.max(0,h-17));
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(231,236,242,0.4)';
    ctx.font = '12px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('VISUALIZATION MODULE — PENDING', w/2, h/2);
  }

/* ─── Dosimetry: PDD curve plotter ─────────────────────────────────── */
  function rtRunSimDosimetry(params, canvas, resultsEl, stage){
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0, 0, W, H);

    const isElectron = params.beamType >= 0.5;
    const E  = params.energy;
    const FS = params.fieldSize;
    const SSD = params.ssd;
    const maxD = 30; // cm — display range

    const padL = 54, padR = 14, padT = 28, padB = 40;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    function dPx(d)   { return padL + (d / maxD) * plotW; }
    function pPy(pct) { return padT + (1 - pct / 100) * plotH; }

    /* ── Parametric PDD models ─────────────────────────────────────────
       These are analytic approximations tuned to reproduce the main
       clinical physics: buildup region, d_max shift with energy,
       exponential falloff (photons) or sharp Bragg-like drop (electrons).
    ──────────────────────────────────────────────────────────────────── */
    function photonPDD(d){
      const dmax   = 0.12 * E + 0.80;                     // cm; rises with MV
      const muEff  = 0.072 * Math.pow(E, -0.28);          // effective μ_eff (cm⁻¹); falls with MV
      const surf   = Math.max(0.12, 0.38 - 0.010 * E);   // surface-dose fraction (falls with MV)
      const fsCorr = 1 + 0.025 * Math.log(Math.max(1, FS) / 10); // field-size output factor
      if(d <= 0) return surf * 100;
      const build   = d < dmax ? surf + (1 - surf) * Math.pow(d / dmax, 1.3) : 1.0;
      const falloff = Math.exp(-muEff * Math.max(0, d - dmax));
      return Math.min(100, 100 * build * falloff * fsCorr);
    }

    function electronPDD(d){
      const dmax = 0.25 * E + 0.10;                        // cm — depth of dose maximum
      const Rp   = 0.52 * E;                               // practical range (cm)
      const surf = Math.min(0.95, 0.60 + 0.020 * E);      // surface dose fraction (rises with MeV)
      const brem = 0.010 * E;                              // bremsstrahlung tail fraction
      if(d <= 0) return surf * 100;
      if(d <= dmax) return (surf + (1 - surf) * (d / dmax)) * 100;
      if(d <= Rp)   return (brem + (1 - brem) * Math.pow(Math.max(0, (Rp - d) / (Rp - dmax)), 0.85)) * 100;
      return Math.max(0, brem * Math.exp(-0.10 * (d - Rp)) * 100);
    }

    function pdd(d){ return isElectron ? electronPDD(d) : photonPDD(d); }

    /* ── Grid ── */
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
    for(let d = 0; d <= maxD; d += 5){
      ctx.beginPath(); ctx.moveTo(dPx(d)+.5, padT); ctx.lineTo(dPx(d)+.5, padT+plotH); ctx.stroke();
    }
    for(let p = 0; p <= 100; p += 20){
      ctx.beginPath(); ctx.moveTo(padL, pPy(p)+.5); ctx.lineTo(padL+plotW, pPy(p)+.5); ctx.stroke();
    }

    /* ── Axes ── */
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT+plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, padT+plotH); ctx.lineTo(padL+plotW, padT+plotH); ctx.stroke();

    /* ── Tick labels ── */
    ctx.fillStyle = 'rgba(231,236,242,0.55)';
    ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for(let d = 0; d <= maxD; d += 5) ctx.fillText(d, dPx(d), padT+plotH+3);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for(let p = 0; p <= 100; p += 20) ctx.fillText(p+'%', padL-4, pPy(p));

    /* ── Axis titles ── */
    ctx.fillStyle = 'rgba(231,236,242,0.42)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('Depth in water phantom  (cm)', padL+plotW/2, padT+plotH+22);
    ctx.save(); ctx.translate(12, padT+plotH/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('Percentage Depth Dose  (%)', 0, 0); ctx.restore();

    /* ── Compute curve points ── */
    const NP = 500;
    const pts = [];
    for(let i = 0; i <= NP; i++){
      const d = (i / NP) * maxD;
      pts.push({ d: d, v: pdd(d) });
    }

    /* ── Area fill under curve ── */
    const fillRgb = isElectron ? '123,227,154' : '54,194,214';
    const grad = ctx.createLinearGradient(padL, 0, padL+plotW, 0);
    grad.addColorStop(0,   'rgba('+fillRgb+',0.05)');
    grad.addColorStop(0.25,'rgba('+fillRgb+',0.18)');
    grad.addColorStop(0.60,'rgba('+fillRgb+',0.08)');
    grad.addColorStop(1,   'rgba('+fillRgb+',0.01)');
    ctx.beginPath();
    ctx.moveTo(dPx(0), pPy(0));
    pts.forEach(function(pt){ ctx.lineTo(dPx(pt.d), pPy(pt.v)); });
    ctx.lineTo(dPx(maxD), pPy(0)); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    /* ── PDD curve line ── */
    const lineColor = isElectron ? '#7be39a' : stage.accent;
    ctx.beginPath(); ctx.strokeStyle = lineColor; ctx.lineWidth = 2.2;
    pts.forEach(function(pt, i){
      i === 0 ? ctx.moveTo(dPx(pt.d), pPy(pt.v)) : ctx.lineTo(dPx(pt.d), pPy(pt.v));
    });
    ctx.stroke();

    /* ── Locate d_max ── */
    var dmaxD = 0, dmaxV = 0;
    pts.forEach(function(pt){ if(pt.v > dmaxV){ dmaxV = pt.v; dmaxD = pt.d; } });

    /* ── d_max marker ── */
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(dPx(dmaxD), padT+2); ctx.lineTo(dPx(dmaxD), pPy(100)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = lineColor;
    ctx.beginPath(); ctx.arc(dPx(dmaxD), pPy(100), 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(231,236,242,0.80)';
    ctx.font = '9px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('dmax = '+dmaxD.toFixed(1)+' cm', dPx(dmaxD), padT-1);

    /* ── Locate D50 (first crossing after d_max) ── */
    var d50 = null;
    for(var i = 1; i < pts.length; i++){
      if(pts[i].d > dmaxD && pts[i-1].v >= 50 && pts[i].v < 50){
        var t = (50 - pts[i-1].v) / (pts[i].v - pts[i-1].v);
        d50 = pts[i-1].d + t * (pts[i].d - pts[i-1].d);
        break;
      }
    }
    if(d50 !== null && d50 < maxD * 0.97){
      ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1; ctx.setLineDash([2,4]);
      ctx.beginPath(); ctx.moveTo(dPx(d50), pPy(50)); ctx.lineTo(dPx(d50), padT+plotH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(padL, pPy(50)); ctx.lineTo(dPx(d50), pPy(50)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = lineColor; ctx.beginPath(); ctx.arc(dPx(d50), pPy(50), 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(231,236,242,0.60)'; ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('D50 = '+d50.toFixed(1)+' cm', dPx(d50)+4, pPy(50)-2);
    }

    /* ── Electron R_p marker ── */
    if(isElectron){
      var Rp = 0.52 * E;
      if(Rp < maxD){
        ctx.strokeStyle = 'rgba(123,227,154,0.40)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(dPx(Rp), padT+2); ctx.lineTo(dPx(Rp), padT+plotH); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(231,236,242,0.60)'; ctx.font = '9px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('Rp = '+Rp.toFixed(1)+' cm', dPx(Rp), padT+2);
      }
    }

    /* ── Surface-dose annotation ── */
    var surfV = pdd(0);
    ctx.fillStyle = 'rgba(231,236,242,0.50)'; ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('Surface: '+surfV.toFixed(0)+'%', padL+4, pPy(surfV));

    /* ── Results bar ── */
    var pdd10 = pdd(10).toFixed(1);
    var extra = isElectron
      ? ' &nbsp;&middot;&nbsp; R<sub>p</sub> &asymp; '+(0.52*E).toFixed(1)+' cm'
      : ' &nbsp;&middot;&nbsp; SSD = '+SSD+' cm &nbsp;&middot;&nbsp; FS = '+FS+' cm';
    resultsEl.innerHTML =
      '<b>'+(isElectron ? 'e<sup>&minus;</sup> '+E+' MeV' : '&gamma; '+E+' MV')+'</b>'+
      ' &nbsp;&middot;&nbsp; d<sub>max</sub> = '+dmaxD.toFixed(1)+' cm'+
      ' &nbsp;&middot;&nbsp; PDD(10 cm) = '+pdd10+'%'+
      (d50 !== null ? ' &nbsp;&middot;&nbsp; D<sub>50</sub> = '+d50.toFixed(1)+' cm' : '')+
      extra;
  }  

function rtRunSimAttenuation(params, canvas, resultsEl, stage){
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, w = sized.w, h = sized.h;
    ctx.clearRect(0, 0, w, h);

    const mu = params.mu, L = params.thickness, geometry = params.geometry;
    const n = Math.max(1, Math.round(params.nParticles));

    const margin = 30;
    const xScale = (w - margin * 2) / (L * 1.3);
    const x0 = margin + xScale * (L * 0.15);
    function toPx(x){ return x0 + x * xScale; }

    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(toPx(0), 0, toPx(L) - toPx(0), h);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(toPx(0), 0); ctx.lineTo(toPx(0), h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(toPx(L), 0); ctx.lineTo(toPx(L), h); ctx.stroke();

    const hvl = Math.log(2) / mu;
    [1,2,3].forEach(function(k){
      const xPos = hvl * k;
      if(xPos < L){
        ctx.setLineDash([2,3]);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath(); ctx.moveTo(toPx(xPos), 0); ctx.lineTo(toPx(xPos), h); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.font = '9px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(k + ' HVL', toPx(xPos), 2);
      }
    });
    ctx.setLineDash([]);

    let direct = 0, buildup = 0, removed = 0;
    const colors = { direct:'#7be39a', buildup:'#e8a33d', removed: stage.accent };

    for(let i=0; i<n; i++){
      const y = 6 + Math.random() * (h - 12);
      const s = -Math.log(Math.random()) / mu;
      let outcome, interactX;
      if(s >= L){
        outcome = 'direct'; interactX = L;
      } else {
        interactX = s;
        outcome = (Math.random() < geometry) ? 'buildup' : 'removed';
      }
      if(outcome === 'direct') direct++;
      else if(outcome === 'buildup') buildup++;
      else removed++;

      ctx.beginPath();
      ctx.strokeStyle = colors[outcome];
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 1;
      ctx.moveTo(toPx(0), y);
      ctx.lineTo(toPx(interactX), y);
      if(outcome !== 'removed'){
        ctx.lineTo(toPx(L), y + (outcome === 'buildup' ? (Math.random()-0.5)*10 : 0));
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    function pct(v){ return (100 * v / n).toFixed(1); }
    const theoryPct = (100 * Math.exp(-mu * L)).toFixed(1);
    const measuredPct = (100 * (direct + buildup) / n).toFixed(1);
    resultsEl.innerHTML =
      '<span style="color:' + colors.direct + '">Direct ' + pct(direct) + '%</span> &nbsp;\u00b7&nbsp; ' +
      '<span style="color:' + colors.buildup + '">Buildup ' + pct(buildup) + '%</span> &nbsp;\u00b7&nbsp; ' +
      '<span style="color:' + colors.removed + '">Removed ' + pct(removed) + '%</span>' +
      ' &nbsp; (N = ' + n + ') &nbsp;|&nbsp; transmitted ' + measuredPct + '% — narrow-beam theory exp(-\u03bcL) = ' + theoryPct + '%';
  }

function rtSampleComptonCosTheta(alpha){
    let cosTheta = 0, weight = 0, guard = 0;
    do{
      cosTheta = 2 * Math.random() - 1;
      const Eratio = 1 / (1 + alpha * (1 - cosTheta));
      const sin2 = 1 - cosTheta * cosTheta;
      weight = Eratio * Eratio * (Eratio + 1 / Eratio - sin2);
      guard++;
    } while(Math.random() * 2 > weight && guard < 200);
    return cosTheta;
  }

  function rtSampleRayleighCosTheta(alpha){
    const sharpness = 2 + 9 * Math.min(alpha, 3);
    const u = Math.random();
    let cosTheta = 1 - 2 * Math.pow(u, sharpness);
    return Math.max(-1, Math.min(1, cosTheta));
  }

  function rtRunSimScattering(params, canvas, resultsEl, stage){
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, w = sized.w, h = sized.h;
    ctx.clearRect(0, 0, w, h);

    const E = params.photonEnergy, coherentFrac = params.coherentFraction;
    const n = Math.max(1, Math.round(params.nParticles));
    const alpha = E / 511;

    const originX = 24 + (w - 48) * 0.32;
    const originY = h / 2;
    const R = Math.max(36, Math.min(w, h) * 0.36);

    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(originX, originY, R, 0, Math.PI * 2); ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.moveTo(6, originY); ctx.lineTo(originX, originY); ctx.stroke();
    ctx.fillStyle = '#9fb3c8';
    ctx.beginPath(); ctx.arc(originX, originY, 3, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(231,236,242,0.4)';
    ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('0° fwd', originX + R + 4, originY);
    ctx.textAlign = 'right';
    ctx.fillText('180° back', Math.max(2, originX - R - 4), originY);

    let nCoherent = 0, nIncoherent = 0, angleSumC = 0, angleSumR = 0, lossSum = 0;
    const colorCompton = '#36c2d6', colorRayleigh = '#a98ef0';

    for(let i = 0; i < n; i++){
      const isCoherent = Math.random() < coherentFrac;
      let cosTheta, Ep;
      if(isCoherent){
        cosTheta = rtSampleRayleighCosTheta(alpha);
        Ep = E;
        nCoherent++;
        angleSumR += Math.acos(cosTheta) * 180 / Math.PI;
      } else {
        cosTheta = rtSampleComptonCosTheta(alpha);
        Ep = E / (1 + alpha * (1 - cosTheta));
        nIncoherent++;
        angleSumC += Math.acos(cosTheta) * 180 / Math.PI;
        lossSum += (E - Ep) / E;
      }

      const theta = Math.acos(cosTheta);
      const sign = Math.random() < 0.5 ? 1 : -1;
      const thetaSigned = theta * sign;
      const r = R * (0.75 + 0.5 * Math.random());
      const px = originX + r * Math.cos(thetaSigned);
      const py = originY + r * Math.sin(thetaSigned);
      const color = isCoherent ? colorRayleigh : colorCompton;

      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.18;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(px, py); ctx.stroke();

      ctx.globalAlpha = 0.8;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(px, py, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    function pct(v){ return (100 * v / n).toFixed(1); }
    const avgAngleC = nIncoherent ? (angleSumC / nIncoherent).toFixed(1) : '—';
    const avgAngleR = nCoherent ? (angleSumR / nCoherent).toFixed(1) : '—';
    const avgLoss = nIncoherent ? (100 * lossSum / nIncoherent).toFixed(1) : '—';
    resultsEl.innerHTML =
      '<span style="color:' + colorCompton + '">Compton ' + pct(nIncoherent) + '% (avg θ ' + avgAngleC + '°, avg ΔE/E ' + avgLoss + '%)</span> &nbsp;\u00b7&nbsp; ' +
      '<span style="color:' + colorRayleigh + '">Rayleigh ' + pct(nCoherent) + '% (avg θ ' + avgAngleR + '°, no energy loss)</span>' +
      ' &nbsp; (N = ' + n + ')';
  }
  

function rtRunSimAbsorption(params, canvas, resultsEl, stage){
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, w = sized.w, h = sized.h;
    ctx.clearRect(0, 0, w, h);

    const E = params.photonEnergy, Z = params.atomicNumber;
    const n = Math.max(1, Math.round(params.nParticles));
    const alpha = E / 511;

    const wPE = Math.pow(Z, 4.5) / Math.pow(E, 3) * 24;
    const wCompton = Z / (1 + E / 3000);
    const ppTerm = Math.max(0, E - 1022) / 1000;
    const wPP = Z * Z * ppTerm * ppTerm * 0.00029;
    const wSum = wPE + wCompton + wPP || 1;
    const pPE = wPE / wSum, pCompton = wCompton / wSum;

    const padL = 36, padTB = 12;
    function toY(val){ return h - padTB - (val / E) * (h - padTB * 2); }

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, toY(0)); ctx.lineTo(padL, toY(E)); ctx.stroke();
    ctx.fillStyle = 'rgba(231,236,242,0.45)';
    ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('0', padL - 4, toY(0));
    ctx.fillText(Math.round(E) + ' keV', padL - 4, toY(E));

    if(E > 1022){
      const yThresh = toY(1022);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(padL, yThresh); ctx.lineTo(w - 4, yThresh); ctx.stroke();
      ctx.setLineDash([]);
      ctx.textAlign = 'left';
      ctx.fillText('2m\u2091c\u00b2 = 1022 keV', padL + 4, yThresh - 7);
    }

    let nPE = 0, nCompton = 0, nPP = 0, fracSum = 0;
    const colorPE = stage.accent, colorCompton = '#36c2d6', colorPP = '#a98ef0';

    for(let i = 0; i < n; i++){
      const x = padL + 10 + Math.random() * (w - padL - 20);
      const r = Math.random();
      let Edep, color;
      if(r < pPE){
        Edep = E; color = colorPE; nPE++;
      } else if(r < pPE + pCompton){
        const cosTheta = rtSampleComptonCosTheta(alpha);
        const Ep = E / (1 + alpha * (1 - cosTheta));
        Edep = E - Ep; color = colorCompton; nCompton++;
      } else {
        Edep = Math.max(0, E - 1022); color = colorPP; nPP++;
      }
      fracSum += Edep / E;

      const y0 = toY(0), yE = toY(E), yDep = toY(Edep);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, yDep); ctx.stroke();

      ctx.globalAlpha = 0.28;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([2,2]);
      ctx.beginPath(); ctx.moveTo(x, yDep); ctx.lineTo(x, yE); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = 1;

    function pct(v){ return (100 * v / n).toFixed(1); }
    const avgFrac = (100 * fracSum / n).toFixed(1);
    resultsEl.innerHTML =
      '<span style="color:' + colorPE + '">Photoelectric ' + pct(nPE) + '%</span> &nbsp;\u00b7&nbsp; ' +
      '<span style="color:' + colorCompton + '">Compton ' + pct(nCompton) + '%</span> &nbsp;\u00b7&nbsp; ' +
      '<span style="color:' + colorPP + '">Pair production ' + pct(nPP) + '%</span>' +
      ' &nbsp; (N = ' + n + ') &nbsp;|&nbsp; mean energy-transfer fraction (\u03bc_tr/\u03bc) \u2248 ' + avgFrac + '%';
  }  

/* ─── Absorbed Dose: kerma vs dose / CPE simulation ─────────────────── */
  function rtRunSimAbsorbedDose(params, canvas, resultsEl, stage){
    var sized = rtSizeCanvas(canvas);
    var ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0, 0, W, H);

    var E         = params.energy;
    var medIdx    = Math.min(2, Math.max(0, Math.round(params.medium)));
    var showKerma = params.showKerma >= 0.5;
    var n         = Math.max(1, Math.round(params.nHistories));

    /* Medium properties ─────────────────────────────────────────────── */
    var MEDIA = [
      { name:'Water',  mu:0.0720*Math.pow(E,-0.28), sLabel:'s\u0305_w,air \u2248 1.134' },
      { name:'Tissue', mu:0.0685*Math.pow(E,-0.27), sLabel:'s\u0305_t,air \u2248 1.061' },
      { name:'Bone',   mu:0.1050*Math.pow(E,-0.25), sLabel:'s\u0305_b,air \u2248 1.064' }
    ];
    var med      = MEDIA[medIdx];
    var mu       = med.mu;                          // cm⁻¹

    /* Electron range parameters ─────────────────────────────────────
       reCsda  : approximate CSDA range (cm)
       depScale: mean deposition distance from interaction = d_max
                 (kept identical to the dosimetry tab's d_max formula
                  so the curves are directly comparable)               */
    var reCsda   = 0.30*E + 2.0;                   // cm
    var depScale = 0.12*E + 0.80;                  // cm  ≡  d_max

    var maxD  = Math.min(30, Math.max(22, reCsda*3.5));
    var nBins = 200;
    var kermaBins = new Float32Array(nBins);
    var doseBins  = new Float32Array(nBins);

    /* Monte Carlo transport ────────────────────────────────────────── */
    for(var i=0; i<n; i++){
      var xi = -Math.log(Math.random())/mu;         // photon interaction depth
      if(xi >= maxD) continue;

      /* Kerma: energy transferred at the interaction site */
      var kb = Math.min(nBins-1, Math.floor(xi/maxD*nBins));
      kermaBins[kb] += 1;

      /* Dose: electron carries energy forward; exponential deposition
         with mean = depScale (= d_max), capped at CSDA range          */
      for(var j=0; j<40; j++){
        var fwd = depScale*(-Math.log(Math.random()));
        if(fwd > reCsda) continue;
        var xDep = xi + fwd;
        if(xDep >= maxD) continue;
        var db = Math.floor(xDep/maxD*nBins);
        if(db >= 0 && db < nBins) doseBins[db] += 1/40;
      }
    }

    /* Normalise both profiles to peak = 100 ─────────────────────────*/
    var maxK=1, maxDv=1;
    for(var b=0; b<nBins; b++){
      if(kermaBins[b] > maxK)  maxK  = kermaBins[b];
      if(doseBins[b]  > maxDv) maxDv = doseBins[b];
    }

    /* Layout ─────────────────────────────────────────────────────────*/
    var padL=54, padR=14, padT=26, padB=38;
    var plotW=W-padL-padR, plotH=H-padT-padB;

    function dPx(d)  { return padL + (d/maxD)*plotW; }
    function vPy(pct){ return padT + (1-pct/100)*plotH; }

    /* Grid ───────────────────────────────────────────────────────────*/
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
    for(var d=0; d<=maxD; d+=5){
      ctx.beginPath(); ctx.moveTo(dPx(d)+.5,padT); ctx.lineTo(dPx(d)+.5,padT+plotH); ctx.stroke();
    }
    for(var p=0; p<=100; p+=20){
      ctx.beginPath(); ctx.moveTo(padL,vPy(p)+.5); ctx.lineTo(padL+plotW,vPy(p)+.5); ctx.stroke();
    }

    /* Axes ───────────────────────────────────────────────────────────*/
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,padT);       ctx.lineTo(padL,padT+plotH);       ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL,padT+plotH); ctx.lineTo(padL+plotW,padT+plotH); ctx.stroke();

    /* Tick labels ────────────────────────────────────────────────────*/
    ctx.fillStyle='rgba(231,236,242,0.55)'; ctx.font='9px "IBM Plex Mono",monospace';
    ctx.textAlign='center'; ctx.textBaseline='top';
    for(var d=0; d<=maxD; d+=5) ctx.fillText(d, dPx(d), padT+plotH+3);
    ctx.textAlign='right'; ctx.textBaseline='middle';
    for(var p=0; p<=100; p+=20) ctx.fillText(p+'%', padL-4, vPy(p));

    ctx.fillStyle='rgba(231,236,242,0.40)'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('Depth in phantom  (cm)', padL+plotW/2, padT+plotH+20);
    ctx.save(); ctx.translate(13, padT+plotH/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('Relative dose / kerma  (%)', 0, 0); ctx.restore();

    /* CPE region shading (beyond theoretical d_max) ─────────────────*/
    var cpePx = dPx(depScale);
    ctx.fillStyle='rgba(54,194,214,0.05)';
    ctx.fillRect(cpePx, padT, Math.max(0, padL+plotW-cpePx), plotH);

    if(cpePx < padL+plotW-70){
      ctx.fillStyle='rgba(54,194,214,0.36)'; ctx.font='9px "IBM Plex Mono",monospace';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('CPE region \u2192 D \u2248 K_col', cpePx+4, padT+5);
    }

    /* Kerma curve  ─ dashed amber ─────────────────────────────────── */
    if(showKerma){
      ctx.beginPath(); ctx.strokeStyle='#e8a33d'; ctx.lineWidth=1.8; ctx.setLineDash([5,4]);
      for(var b=0; b<nBins; b++){
        var d=(b+0.5)/nBins*maxD, v=100*kermaBins[b]/maxK;
        b===0 ? ctx.moveTo(dPx(d),vPy(v)) : ctx.lineTo(dPx(d),vPy(v));
      }
      ctx.stroke(); ctx.setLineDash([]);
    }

    /* Dose curve  ─ solid cyan with area fill ───────────────────────*/
    var grad=ctx.createLinearGradient(padL,0,padL+plotW,0);
    grad.addColorStop(0,   'rgba(54,194,214,0.02)');
    grad.addColorStop(0.25,'rgba(54,194,214,0.18)');
    grad.addColorStop(0.65,'rgba(54,194,214,0.08)');
    grad.addColorStop(1,   'rgba(54,194,214,0.01)');
    ctx.beginPath(); ctx.moveTo(dPx(0),vPy(0));
    for(var b=0; b<nBins; b++){
      ctx.lineTo(dPx((b+0.5)/nBins*maxD), vPy(100*doseBins[b]/maxDv));
    }
    ctx.lineTo(dPx(maxD),vPy(0)); ctx.closePath();
    ctx.fillStyle=grad; ctx.fill();

    ctx.beginPath(); ctx.strokeStyle=stage.accent; ctx.lineWidth=2.2;
    for(var b=0; b<nBins; b++){
      var d=(b+0.5)/nBins*maxD, v=100*doseBins[b]/maxDv;
      b===0 ? ctx.moveTo(dPx(d),vPy(v)) : ctx.lineTo(dPx(d),vPy(v));
    }
    ctx.stroke();

    /* Find MC d_max ──────────────────────────────────────────────────*/
    var dmaxBin=0;
    for(var b=1; b<nBins; b++) if(doseBins[b]>doseBins[dmaxBin]) dmaxBin=b;
    var dmaxD=(dmaxBin+0.5)/nBins*maxD;

    /* d_max marker ───────────────────────────────────────────────────*/
    ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(dPx(dmaxD),padT+2); ctx.lineTo(dPx(dmaxD),vPy(100)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=stage.accent;
    ctx.beginPath(); ctx.arc(dPx(dmaxD),vPy(100),4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(231,236,242,0.82)'; ctx.font='9px "IBM Plex Mono",monospace';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText('d_max = '+dmaxD.toFixed(1)+' cm', dPx(dmaxD), padT-1);

    /* Surface-dose annotation ────────────────────────────────────────*/
    var surfPct = doseBins[0]>0 ? (100*doseBins[0]/maxDv).toFixed(0) : '0';
    ctx.fillStyle='rgba(231,236,242,0.48)'; ctx.font='9px "IBM Plex Mono",monospace';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('Surface: '+surfPct+'%', padL+4, vPy(parseFloat(surfPct) || 0));

    /* Legend ─────────────────────────────────────────────────────────*/
    var lx=padL+plotW-148, ly=padT+11;
    ctx.strokeStyle=stage.accent; ctx.lineWidth=2.2; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+22,ly); ctx.stroke();
    ctx.fillStyle='rgba(231,236,242,0.76)'; ctx.font='9px "IBM Plex Mono",monospace';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('Absorbed dose D(x)', lx+26, ly);
    if(showKerma){
      ctx.strokeStyle='#e8a33d'; ctx.lineWidth=1.8; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(lx,ly+14); ctx.lineTo(lx+22,ly+14); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(231,236,242,0.76)';
      ctx.fillText('Kerma K(x)', lx+26, ly+14);
    }

    /* Results bar ────────────────────────────────────────────────────*/
    var b10 = Math.floor(10/maxD*nBins);
    var pdd10 = b10<nBins ? (100*doseBins[b10]/maxDv).toFixed(1) : '\u2014';
    resultsEl.innerHTML =
      '<b>'+med.name+'  &middot;  '+E+' MV</b>'+
      ' &nbsp;&middot;&nbsp; d<sub>max</sub> = '+dmaxD.toFixed(1)+' cm'+
      ' &nbsp;&middot;&nbsp; Surface dose &asymp; '+surfPct+'%'+
      ' &nbsp;&middot;&nbsp; D(10 cm) = '+pdd10+'%'+
      ' &nbsp;&middot;&nbsp; r<sub>e,CSDA</sub> &asymp; '+reCsda.toFixed(1)+' cm'+
      ' &nbsp;&middot;&nbsp; '+med.sLabel+
      ' &nbsp; (N = '+n+')';
  }


/* ─── Equivalent Dose: wR bar-chart comparator ─────────────────────── */
  function rtRunSimEquivalentDose(params, canvas, resultsEl, stage) {
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0, 0, W, H);

    const D       = params.eqD;
    const En      = Math.max(1e-4, params.eqEn);
    const showLET = params.eqLET >= 0.5;

    /* ICRP 103 neutron wR */
    const lnT  = Math.log(2 * En);
    const wR_n = 2.5 + 17.5 * Math.exp(-(lnT * lnT) / 6);

    const TYPES = [
      { name:'γ / X-ray',   wR:1,     LET:'0.2–2',     color:'#36c2d6' },
      { name:'Electron e⁻', wR:1,     LET:'0.1–1',     color:'#7be39a' },
      { name:'Neutron n',   wR:wR_n,  LET:'15–100 †',  color:'#e8a33d' },
      { name:'Proton p',    wR:2,     LET:'0.5–8',     color:'#f0c060' },
      { name:'Alpha α',     wR:20,    LET:'80–200',    color:'#e0556b' },
      { name:'Heavy ion',   wR:20,    LET:'>200',      color:'#a98ef0' }
    ];

    const N    = TYPES.length;
    const padL = 118, padR = showLET ? 110 : 70, padT = 34, padB = 22;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const rowH  = plotH / N;

    /* Scale to the largest H value */
    let maxH = 1;
    TYPES.forEach(t => { if (t.wR * D > maxH) maxH = t.wR * D; });

    /* Grid lines */
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    [0.25, 0.5, 0.75, 1].forEach(f => {
      const gx = padL + f * plotW;
      ctx.beginPath(); ctx.moveTo(gx + .5, padT - 4); ctx.lineTo(gx + .5, padT + plotH); ctx.stroke();
    });

    /* Axes */
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, padT - 4); ctx.lineTo(padL, padT + plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH); ctx.stroke();

    /* x-axis tick labels */
    ctx.fillStyle = 'rgba(231,236,242,0.45)'; ctx.font = '9px "IBM Plex Mono",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    [0, 0.25, 0.5, 0.75, 1].forEach(f => {
      const v = f * maxH;
      ctx.fillText(v.toFixed(v < 10 ? 1 : 0), padL + f * plotW, padT + plotH + 3);
    });
    ctx.fillStyle = 'rgba(231,236,242,0.32)'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('Equivalent dose H_T  (mSv)', padL + plotW / 2, padT + plotH + 15);

    /* Page title */
    ctx.fillStyle = 'rgba(231,236,242,0.68)'; ctx.font = '10px "IBM Plex Mono",monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('H_T = w_R × D   for D = ' + D + ' mGy', padL + 2, 2);

    /* Vertical reference line at D */
    const dRefX = padL + (D / maxH) * plotW;
    ctx.save();
    ctx.strokeStyle = 'rgba(200,215,230,0.40)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(dRefX, padT - 6); ctx.lineTo(dRefX, padT + plotH); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(200,215,230,0.55)'; ctx.font = '9px "IBM Plex Mono",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('D = ' + D + ' mGy', dRefX, padT - 7);

    /* LET column header */
    if (showLET) {
      ctx.fillStyle = 'rgba(231,236,242,0.40)'; ctx.font = '9px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('LET (keV/μm)', padL + plotW + 6, padT - 4);
    }

    /* Rows */
    const barH = Math.max(8, rowH * 0.46);

    TYPES.forEach((t, i) => {
      const H_eq = t.wR * D;
      const bw   = (H_eq / maxH) * plotW;
      const yMid = padT + i * rowH + rowH / 2;
      const yTop = yMid - barH / 2;

      /* Alternating stripe */
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.012)';
        ctx.fillRect(0, padT + i * rowH, W, rowH);
      }

      /* Type label */
      ctx.fillStyle = t.color; ctx.font = 'bold 11px "IBM Plex Mono",monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(t.name, padL - 8, yMid - 6);

      /* w_R sub-label */
      const wRStr = (i === 2) ? 'w_R = ' + t.wR.toFixed(1) : 'w_R = ' + t.wR;
      ctx.fillStyle = 'rgba(231,236,242,0.38)'; ctx.font = '9px "IBM Plex Mono",monospace';
      ctx.fillText(wRStr, padL - 8, yMid + 7);

      /* Bar */
      ctx.globalAlpha = 0.78;
      ctx.fillStyle = t.color;
      ctx.fillRect(padL, yTop, Math.max(1, bw), barH);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = t.color; ctx.lineWidth = 1;
      ctx.strokeRect(padL + .5, yTop + .5, Math.max(0, bw - 1), barH - 1);

      /* Value label */
      ctx.fillStyle = t.color; ctx.font = '10px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(H_eq.toFixed(H_eq >= 100 ? 0 : 1) + ' mSv', padL + bw + 5, yMid);

      /* LET annotation */
      if (showLET) {
        ctx.fillStyle = 'rgba(231,236,242,0.28)'; ctx.font = '9px "IBM Plex Mono",monospace';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(t.LET, padL + plotW + 6, yMid);
      }
    });

    /* Neutron live callout */
    const nRowY = padT + 2 * rowH + rowH / 2;
    ctx.fillStyle = 'rgba(232,163,61,0.85)'; ctx.font = '9px "IBM Plex Mono",monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(
      'E_n = ' + En.toFixed(2) + ' MeV  →  w_R = ' + wR_n.toFixed(2),
      padL + 4, nRowY + barH / 2 + 2
    );

    /* LET footnote */
    if (showLET) {
      ctx.fillStyle = 'rgba(231,236,242,0.25)'; ctx.font = '8px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('† LET of secondary recoil protons, not neutrons directly', padL + plotW + 6, padT + plotH);
    }

    /* Results bar */
    resultsEl.innerHTML =
      '<b>D = ' + D + ' mGy</b> &nbsp;|&nbsp; ' +
      TYPES.map((t, i) => {
        const label = (i === 2)
          ? 'n (w<sub>R</sub>=' + t.wR.toFixed(1) + ')'
          : t.name.split(' ')[0] + ' (w<sub>R</sub>=' + t.wR + ')';
        return '<span style="color:' + t.color + '">' + label + ' → ' + (t.wR * D).toFixed(0) + ' mSv</span>';
      }).join(' &nbsp;·&nbsp; ');
  }


/* ─── Radiation Biology: LQ cell-survival curve plotter ─────────────── */
  function rtRunSimRadiationBiology(params, canvas, resultsEl, stage){
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0, 0, W, H);

    const alpha   = params.rbAlpha;
    const abRatio = params.rbABRatio;
    const beta    = alpha / abRatio;
    const maxDose = params.rbMaxDose;
    const oer     = params.rbOER;
    const nFrac   = Math.max(1, Math.round(params.rbFractions));

    const padL = 50, padR = 14, padT = 24, padB = 36;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const yDecades = 4; // SF from 1 down to 1e-4

    function dPx(d){ return padL + (d / maxDose) * plotW; }
    function sfPy(sf){
      const clamped = Math.max(Math.pow(10, -yDecades), Math.min(1, sf));
      const frac = (Math.log10(clamped) + yDecades) / yDecades;
      return padT + (1 - frac) * plotH;
    }
    function sfOf(d, N){
      const x = d / oer;
      return Math.exp(-(alpha * x + (beta / N) * x * x));
    }

    /* Grid */
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
    for(let dec = 0; dec <= yDecades; dec++){
      const y = sfPy(Math.pow(10, -dec));
      ctx.beginPath(); ctx.moveTo(padL, y+.5); ctx.lineTo(padL+plotW, y+.5); ctx.stroke();
    }
    const dStep = Math.max(1, Math.round(maxDose/10));
    for(let d = 0; d <= maxDose; d += dStep){
      ctx.beginPath(); ctx.moveTo(dPx(d)+.5, padT); ctx.lineTo(dPx(d)+.5, padT+plotH); ctx.stroke();
    }

    /* Axes */
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT+plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, padT+plotH); ctx.lineTo(padL+plotW, padT+plotH); ctx.stroke();

    /* Tick labels */
    ctx.fillStyle = 'rgba(231,236,242,0.55)'; ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for(let dec = 0; dec <= yDecades; dec++){
      ctx.fillText(dec === 0 ? '1' : '1e-' + dec, padL - 5, sfPy(Math.pow(10, -dec)));
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for(let d = 0; d <= maxDose; d += dStep) ctx.fillText(d, dPx(d), padT+plotH+3);

    ctx.fillStyle = 'rgba(231,236,242,0.40)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('Dose  (Gy)', padL+plotW/2, padT+plotH+17);
    ctx.save(); ctx.translate(13, padT+plotH/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('Surviving fraction  SF(D)', 0, 0); ctx.restore();

    /* Reference single-acute-dose curve (only if fractionated) */
    if(nFrac > 1){
      const NP = 300;
      ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.lineWidth = 1.4; ctx.setLineDash([3,4]);
      for(let i = 0; i <= NP; i++){
        const d = (i/NP) * maxDose;
        const y = sfPy(sfOf(d, 1));
        i === 0 ? ctx.moveTo(dPx(d), y) : ctx.lineTo(dPx(d), y);
      }
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(231,236,242,0.45)'; ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('single acute dose (N=1)', padL+6, padT+12);
    }

    /* Main LQ curve */
    const NP = 300;
    ctx.beginPath(); ctx.strokeStyle = stage.accent; ctx.lineWidth = 2.2;
    for(let i = 0; i <= NP; i++){
      const d = (i/NP) * maxDose;
      const y = sfPy(sfOf(d, nFrac));
      i === 0 ? ctx.moveTo(dPx(d), y) : ctx.lineTo(dPx(d), y);
    }
    ctx.stroke();

    /* D10 marker (dose for 10% survival) */
    const ln10 = Math.LN10;
    const bEff = beta / nFrac;
    const xD10 = bEff > 1e-9
      ? (-alpha + Math.sqrt(alpha*alpha + 4*bEff*ln10)) / (2*bEff)
      : ln10/alpha;
    const D10 = xD10 * oer;
    if(D10 > 0 && D10 < maxDose){
      const px = dPx(D10), py = sfPy(0.1);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, padT+plotH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(padL, py); ctx.lineTo(px, py); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = stage.accent;
      ctx.beginPath(); ctx.arc(px, py, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(231,236,242,0.7)'; ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('D10 = ' + D10.toFixed(1) + ' Gy', px+4, py-3);
    }

    /* Results bar */
    const dFrac = maxDose / nFrac;
    const bed = maxDose * (1 + dFrac / abRatio);
    const sfMax = sfOf(maxDose, nFrac);
    resultsEl.innerHTML =
      '<b>\u03b1 = ' + alpha.toFixed(2) + ' Gy\u207b\u00b9</b>' +
      ' &nbsp;\u00b7&nbsp; \u03b2 = ' + beta.toFixed(3) + ' Gy\u207b\u00b2' +
      ' &nbsp;\u00b7&nbsp; \u03b1/\u03b2 = ' + abRatio.toFixed(1) + ' Gy' +
      ' &nbsp;\u00b7&nbsp; OER = ' + oer.toFixed(1) +
      ' &nbsp;\u00b7&nbsp; D10 = ' + D10.toFixed(1) + ' Gy' +
      ' &nbsp;\u00b7&nbsp; SF(' + maxDose + ' Gy) = ' + sfMax.toExponential(2) +
      ' &nbsp;\u00b7&nbsp; BED (' + nFrac + ' fx of ' + dFrac.toFixed(1) + ' Gy) \u2248 ' + bed.toFixed(1) + ' Gy';
  }


/* ─── DNA Damage: track-structure SSB/DSB classifier ────────────────── */
  function rtRunSimDnaDamage(params, canvas, resultsEl, stage){
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0, 0, W, H);

    const LET      = params.ddLET;             // keV/μm
    const D        = params.ddDose;            // Gy
    const windowBP = Math.max(1, Math.round(params.ddWindow));
    const fieldBP  = Math.max(200, Math.round(params.ddFieldBP));

    const W_ionpair = 0.033;                   // keV per ion pair (W-value, water)
    const sNM = W_ionpair / LET * 1000;        // mean ionization spacing, nm  (s = W/LET)
    const sBP = Math.max(0.05, sNM / 0.34);    // nm -> bp  (rise ≈ 0.34 nm/bp)

    const tracksPerGy = 3;                     // illustrative display scaling
    const nTracks = Math.max(1, Math.min(16, Math.round(D * tracksPerGy)));

    const padL = 14, padR = 14, padT = 10, padB = 22;
    const rowH = Math.max(14, (H - padT - padB) / nTracks);
    const plotW = W - padL - padR;
    function xPx(bp){ return padL + (bp / fieldBP) * plotW; }

    let totalSSB = 0, totalDSB = 0, totalHits = 0;
    const colorSSB = '#36c2d6', colorDSB = '#e0556b', colorStrand = 'rgba(255,255,255,0.18)';

    for(let t = 0; t < nTracks; t++){
      const rowTop = padT + t * rowH;
      const yTop = rowTop + rowH * 0.32;
      const yBot = rowTop + rowH * 0.68;

      ctx.strokeStyle = colorStrand; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, yTop); ctx.lineTo(padL + plotW, yTop); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(padL, yBot); ctx.lineTo(padL + plotW, yBot); ctx.stroke();

      const hits = [];
      let pos = -Math.log(Math.random()) * sBP;
      while(pos < fieldBP){
        hits.push({ bp: pos, strand: Math.random() < 0.5 ? 0 : 1, used:false });
        pos += -Math.log(Math.random()) * sBP;
      }
      totalHits += hits.length;

      for(let i = 0; i < hits.length; i++){
        if(hits[i].used) continue;
        let pairedJ = -1;
        for(let j = i+1; j < hits.length; j++){
          if(hits[j].bp - hits[i].bp > windowBP) break;
          if(!hits[j].used && hits[j].strand !== hits[i].strand){ pairedJ = j; break; }
        }
        const y = hits[i].strand === 0 ? yTop : yBot;
        if(pairedJ >= 0){
          hits[i].used = true; hits[pairedJ].used = true;
          const xMid = xPx((hits[i].bp + hits[pairedJ].bp) / 2);
          ctx.strokeStyle = colorDSB; ctx.lineWidth = 2; ctx.globalAlpha = 0.85;
          ctx.beginPath(); ctx.moveTo(xPx(hits[i].bp), yTop); ctx.lineTo(xPx(hits[pairedJ].bp), yBot); ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillStyle = colorDSB;
          ctx.beginPath(); ctx.arc(xMid, (yTop+yBot)/2, 3.4, 0, Math.PI*2); ctx.fill();
          totalDSB++;
        } else {
          ctx.fillStyle = colorSSB; ctx.globalAlpha = 0.85;
          ctx.beginPath(); ctx.arc(xPx(hits[i].bp), y, 2.2, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
          totalSSB++;
        }
      }
    }

    ctx.fillStyle = 'rgba(231,236,242,0.35)';
    ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(nTracks + ' tracks \u00d7 ' + fieldBP + ' bp field  \u00b7  mean spacing s \u2248 ' + sNM.toFixed(2) + ' nm (' + sBP.toFixed(1) + ' bp)', padL, H - padB + 6);

    const ratio = totalDSB > 0 ? (totalSSB / totalDSB).toFixed(1) : '\u2014';
    resultsEl.innerHTML =
      '<span style="color:' + colorSSB + '">SSB: ' + totalSSB + '</span> &nbsp;\u00b7&nbsp; ' +
      '<span style="color:' + colorDSB + '">DSB: ' + totalDSB + '</span>' +
      ' &nbsp;\u00b7&nbsp; SSB:DSB \u2248 ' + ratio +
      ' &nbsp;\u00b7&nbsp; s = W/LET = ' + sNM.toFixed(2) + ' nm' +
      ' &nbsp;\u00b7&nbsp; (' + nTracks + ' tracks, ' + fieldBP + ' bp, D = ' + D + ' Gy)';
  }
  


/* ─── Absorbed Dose: live CPE animation ─────────────────────────────── */
  function rtRunAbsorbedDoseAnim(canvas, content, stage){
    var nBins = 100;
    rtAnimState.kermaBins = new Float32Array(nBins);
    rtAnimState.doseBins  = new Float32Array(nBins);
    rtAnimState.adN       = 0;

    function readParams(){
      var p={};
      content.anim.params.forEach(function(def){
        var el=document.getElementById('p-'+def.id);
        p[def.id]=el?parseFloat(el.value):def.value;
      });
      return p;
    }

    function step(){
      if(!document.body.contains(canvas)){ rtStopAnim(); return; }
      var p = readParams();
      var E = p.energy;
      var medIdx = Math.min(2,Math.max(0,Math.round(p.medium)));

      var MU=[0.0720,0.0685,0.1050];
      var mu       = MU[medIdx]*Math.pow(E,-0.28+(medIdx===1?0.01:medIdx===2?0.03:0));
      var reCsda   = 0.30*E + 2.0;
      var depScale = 0.12*E + 0.80;

      var sized = rtSizeCanvas(canvas);
      var ctx=sized.ctx, W=sized.w, H=sized.h;

      var maxD    = Math.min(30, Math.max(22, reCsda*3.5));
      var padL    = 26, padR=10;
      var phanW   = W-padL-padR;
      var pxPerCm = phanW/maxD;
      var histH   = Math.min(72, Math.round(H*0.30));
      var trackH  = H-histH-8;
      var binW    = phanW/nBins;

      ctx.clearRect(0,0,W,H);

      /* Phantom ────────────────────────────────────────────────────── */
      ctx.fillStyle='rgba(14,30,50,0.45)';
      ctx.fillRect(padL,0,phanW,trackH);
      ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1;
      ctx.strokeRect(padL+.5,.5,phanW-1,trackH-1);

      /* CPE zone shading ───────────────────────────────────────────── */
      var cpePx = padL+depScale*pxPerCm;
      ctx.fillStyle='rgba(54,194,214,0.05)';
      ctx.fillRect(cpePx,0,Math.max(0,padL+phanW-cpePx),trackH);

      /* Depth ticks ────────────────────────────────────────────────── */
      ctx.strokeStyle='rgba(255,255,255,0.09)';
      for(var d=5;d<maxD;d+=5){
        var tx=padL+d*pxPerCm;
        ctx.beginPath(); ctx.moveTo(tx,trackH-8); ctx.lineTo(tx,trackH); ctx.stroke();
      }
      ctx.fillStyle='rgba(231,236,242,0.22)'; ctx.font='9px "IBM Plex Mono",monospace';
      ctx.textAlign='center'; ctx.textBaseline='top';
      for(var d=5;d<=Math.min(25,maxD-1);d+=5)
        ctx.fillText(d, padL+d*pxPerCm, trackH-10);

      /* Spawn photons ─────────────────────────────────────────────── */
      var photonSpeedCm = 2.6/pxPerCm;
      var survivePF = Math.exp(-mu*photonSpeedCm);
      var eRangePx  = reCsda*pxPerCm;
      var newPars   = [];

      for(var i=0;i<Math.round(p.rate);i++){
        rtAnimState.particles.push({
          type:'photon', x:padL,
          y:6+Math.random()*(trackH-12), vx:2.6, alive:true
        });
        rtAnimState.adN++;
      }

      /* Advance & draw ────────────────────────────────────────────── */
      rtAnimState.particles = rtAnimState.particles.filter(function(par){
        if(!par.alive) return false;

        if(par.type==='photon'){
          par.x+=par.vx;
          var physD=(par.x-padL)/pxPerCm;
          if(physD>0 && Math.random()>survivePF){
            /* Interaction: kerma deposited here, electron spawned */
            var kb=Math.min(nBins-1,Math.floor((par.x-padL)/phanW*nBins));
            if(kb>=0) rtAnimState.kermaBins[kb]+=1;
            newPars.push({
              type:'electron',
              x:par.x, y:par.y+(Math.random()-0.5)*3,
              vx:1.5, alive:true,
              rangePx:eRangePx, travelledPx:0
            });
            return false;
          }
          if(par.x>W+5) return false;
          ctx.fillStyle='#36c2d6'; ctx.globalAlpha=0.82;
          ctx.beginPath(); ctx.arc(par.x,par.y,2.2,0,Math.PI*2); ctx.fill();
          ctx.globalAlpha=1;
          return true;

        } else {
          /* Electron */
          par.x+=par.vx;
          par.travelledPx+=par.vx;
          var db=Math.min(nBins-1,Math.floor((par.x-padL)/phanW*nBins));
          if(db>=0) rtAnimState.doseBins[db]+=0.10;
          if(par.travelledPx>=par.rangePx||par.x>W+5){ par.alive=false; return false; }
          var fade=Math.max(0.06,1-par.travelledPx/par.rangePx);
          ctx.fillStyle='#e8a33d'; ctx.globalAlpha=0.78*fade;
          ctx.beginPath(); ctx.arc(par.x,par.y,1.8,0,Math.PI*2); ctx.fill();
          ctx.globalAlpha=1;
          return true;
        }
      });
      rtAnimState.particles=rtAnimState.particles.concat(newPars);

      /* Histogram ─────────────────────────────────────────────────── */
      var histTop=trackH+8;
      ctx.fillStyle='rgba(10,14,20,0.70)';
      ctx.fillRect(padL,histTop,phanW,histH);
      ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1;
      ctx.strokeRect(padL+.5,histTop+.5,phanW-1,histH-1);

      var maxK=1, maxDv=1;
      for(var b=0;b<nBins;b++){
        if(rtAnimState.kermaBins[b]>maxK)  maxK  =rtAnimState.kermaBins[b];
        if(rtAnimState.doseBins[b] >maxDv) maxDv =rtAnimState.doseBins[b];
      }

      /* Dose bars */
      for(var b=0;b<nBins;b++){
        var fr=rtAnimState.doseBins[b]/maxDv;
        var bh=Math.max(0,fr*(histH-5));
        ctx.fillStyle='#36c2d6'; ctx.globalAlpha=0.30+0.55*fr;
        ctx.fillRect(padL+b*binW, histTop+histH-bh, binW+0.5, bh);
      }
      ctx.globalAlpha=1;

      /* Kerma dashed overlay */
      ctx.beginPath(); ctx.strokeStyle='#e8a33d'; ctx.lineWidth=1.4; ctx.setLineDash([3,3]);
      for(var b=0;b<nBins;b++){
        var fr=rtAnimState.kermaBins[b]/maxK;
        var py=histTop+histH-2-fr*(histH-5);
        var px=padL+(b+0.5)*binW;
        b===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke(); ctx.setLineDash([]);

      /* Phantom labels */
      ctx.fillStyle='rgba(231,236,242,0.30)'; ctx.font='9px "IBM Plex Mono",monospace';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('D(x) \u2014 cyan bars    K(x) \u2014 amber dashed', padL+4, histTop+2);

      if(cpePx<padL+phanW-50){
        ctx.fillStyle='rgba(54,194,214,0.40)';
        ctx.fillText('CPE \u2192', cpePx+3, 3);
      }

      ctx.fillStyle='#36c2d6'; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.arc(padL+8,10,2.2,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle='rgba(231,236,242,0.55)'; ctx.textBaseline='middle';
      ctx.fillText('\u03b3 photon', padL+14, 10);

      ctx.fillStyle='#e8a33d'; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.arc(padL+68,10,1.8,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle='rgba(231,236,242,0.55)';
      ctx.fillText('e\u207b (2\u00b0)', padL+74, 10);

      ctx.fillStyle='rgba(231,236,242,0.72)'; ctx.font='11px "IBM Plex Mono",monospace';
      ctx.textAlign='right'; ctx.textBaseline='top';
      ctx.fillText(E+' MV  |  r_e \u2248 '+reCsda.toFixed(1)+' cm  |  n = '+rtAnimState.adN, W-5, 4);

      rtAnimState.raf=requestAnimationFrame(step);
    }
    rtAnimState.raf=requestAnimationFrame(step);
  }


/* ─── Equivalent Dose: ionisation track-structure animation ─────────── */
  function rtRunEquivalentDoseAnim(canvas, content, stage) {
    const GRID_RES = 6;
    let gW = 0, gH = 0, ionGrid = null;
    let lastType = -1, hitCount = 0;
    const ions = [];   /* global ion-event list (avoids per-particle arrays) */

    /* ionSpacing: mean pixels between ionisation events along the track.
       cluster: extra nearby events per primary hit (models dense DSB clusters). */
    const RAD = [
      { name:'γ photon',    wR:1,  ionSpacing:42,  cluster:0, color:'#36c2d6', letStr:'0.2–2'   },
      { name:'Electron e⁻', wR:1,  ionSpacing:58,  cluster:0, color:'#7be39a', letStr:'0.1–1'   },
      { name:'Neutron n',   wR:0,  ionSpacing:5.5, cluster:2, color:'#e8a33d', letStr:'15–100†' },
      { name:'Proton p',    wR:2,  ionSpacing:12,  cluster:1, color:'#f0c060', letStr:'0.5–8'   },
      { name:'Alpha α',     wR:20, ionSpacing:2.5, cluster:3, color:'#e0556b', letStr:'80–200'  },
      { name:'Heavy ion',   wR:20, ionSpacing:1.0, cluster:7, color:'#a98ef0', letStr:'>200'    }
    ];

    function readParams() {
      const p = {};
      content.anim.params.forEach(def => {
        const el = document.getElementById('p-' + def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    function step() {
      if (!document.body.contains(canvas)) { rtStopAnim(); return; }

      const p       = readParams();
      const typeIdx = Math.min(5, Math.max(0, Math.round(p.eqType)));
      const En      = Math.max(1e-4, p.eqEn);
      const rate    = Math.round(p.eqRate);

      /* Live neutron wR */
      const lnT  = Math.log(2 * En);
      RAD[2].wR  = 2.5 + 17.5 * Math.exp(-(lnT * lnT) / 6);

      /* Reset on type change */
      if (typeIdx !== lastType) {
        ionGrid  = null;
        hitCount = 0;
        ions.length = 0;
        rtAnimState.particles = [];
        lastType = typeIdx;
      }

      const rt = RAD[typeIdx];
      const sized = rtSizeCanvas(canvas);
      const ctx = sized.ctx, W = sized.w, H = sized.h;

      const padL = 12, padR = 12, padT = 42, padB = 10;
      const tW = W - padL - padR;
      const tH = H - padT - padB;

      /* Init / resize grid */
      const newGW = Math.ceil(tW / GRID_RES);
      const newGH = Math.ceil(tH / GRID_RES);
      if (!ionGrid || gW !== newGW || gH !== newGH) {
        gW = newGW; gH = newGH;
        ionGrid = new Float32Array(gW * gH);
      }

      /* ── Background ── */
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(10,18,32,0.93)';
      ctx.fillRect(padL, padT, tW, tH);

      /* Subtle cell grid */
      const cellPx = 18;
      ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
      for (let cx = padL; cx <= padL + tW; cx += cellPx) {
        ctx.beginPath(); ctx.moveTo(cx + .5, padT); ctx.lineTo(cx + .5, padT + tH); ctx.stroke();
      }
      for (let cy = padT; cy <= padT + tH; cy += cellPx) {
        ctx.beginPath(); ctx.moveTo(padL, cy + .5); ctx.lineTo(padL + tW, cy + .5); ctx.stroke();
      }

      /* Ionisation heat-map from accumulated grid */
      let maxG = 0;
      for (let k = 0; k < ionGrid.length; k++) if (ionGrid[k] > maxG) maxG = ionGrid[k];
      if (maxG > 0) {
        for (let gy = 0; gy < gH; gy++) {
          for (let gx = 0; gx < gW; gx++) {
            const v = ionGrid[gy * gW + gx] / maxG;
            if (v < 0.03) continue;
            ctx.fillStyle = rt.color;
            ctx.globalAlpha = v * 0.28;
            ctx.fillRect(padL + gx * GRID_RES, padT + gy * GRID_RES, GRID_RES, GRID_RES);
          }
        }
        ctx.globalAlpha = 1;
      }

      /* Tissue border */
      ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
      ctx.strokeRect(padL + .5, padT + .5, tW - 1, tH - 1);

      /* ── Spawn new track particles ── */
      const speed = 3.5, sub = 6;
      const subPx = speed / sub;

      for (let i = 0; i < rate; i++) {
        rtAnimState.particles.push({
          x: padL - 3,
          y: padT + 4 + Math.random() * (tH - 8),
          angle: (Math.random() - 0.5) * 0.07,
          alive: true
        });
      }

      /* ── Advance particles ── */
      rtAnimState.particles = rtAnimState.particles.filter(par => {
        if (!par.alive) return false;

        for (let s = 0; s < sub; s++) {
          par.x += subPx * Math.cos(par.angle);
          par.y += subPx * Math.sin(par.angle);

          const inT = par.x >= padL && par.x <= padL + tW &&
                      par.y >= padT && par.y <= padT + tH;
          if (!inT) continue;

          /* Poisson-sample ionisation events for this sub-step */
          const mean = subPx / rt.ionSpacing;
          let nIons  = Math.floor(mean) + (Math.random() < (mean % 1) ? 1 : 0);
          nIons = Math.min(nIons, 10); // cap per sub-step for performance

          for (let ni = 0; ni < nIons; ni++) {
            if (ions.length < 1800) {    /* cap total live events */
              ions.push({ x: par.x, y: par.y, age: 0 });
              hitCount++;

              /* Accumulate in grid */
              const igx = Math.floor((par.x - padL) / GRID_RES);
              const igy = Math.floor((par.y - padT) / GRID_RES);
              if (igx >= 0 && igx < gW && igy >= 0 && igy < gH)
                ionGrid[igy * gW + igx] += 1;

              /* Cluster events for high-LET (models δ-ray penumbra / DSB cluster) */
              for (let c = 0; c < rt.cluster; c++) {
                const cx = par.x + (Math.random() - 0.5) * 6;
                const cy = par.y + (Math.random() - 0.5) * 6;
                const cgx = Math.floor((cx - padL) / GRID_RES);
                const cgy = Math.floor((cy - padT) / GRID_RES);
                if (cgx >= 0 && cgx < gW && cgy >= 0 && cgy < gH)
                  ionGrid[cgy * gW + cgx] += 0.45;
              }
            }
          }
        }

        /* Draw incoming dot (outside tissue) */
        if (par.x < padL + 4) {
          ctx.fillStyle = rt.color; ctx.globalAlpha = 0.85;
          ctx.beginPath(); ctx.arc(par.x, par.y, 2.2, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }

        /* Remove if off-canvas */
        return !(par.x > padL + tW + 8 || par.y < padT - 8 || par.y > padT + tH + 8);
      });

      /* ── Draw & age ion events ── */
      const ionLifetime = 52;
      const ionRadius   = typeIdx >= 4 ? 2.0 : 1.3;
      for (let k = ions.length - 1; k >= 0; k--) {
        const ion = ions[k];
        ion.age++;
        if (ion.age > ionLifetime) { ions.splice(k, 1); continue; }
        ctx.fillStyle = rt.color;
        ctx.globalAlpha = Math.max(0, 1 - ion.age / ionLifetime) * 0.88;
        ctx.beginPath(); ctx.arc(ion.x, ion.y, ionRadius, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      /* ── HUD ── */
      const wRdisp = (typeIdx === 2) ? RAD[2].wR.toFixed(1) : rt.wR;
      ctx.fillStyle = rt.color; ctx.font = 'bold 12px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(rt.name, padL + 3, 2);

      ctx.fillStyle = 'rgba(231,236,242,0.72)'; ctx.font = '11px "IBM Plex Mono",monospace';
      ctx.fillText('w_R = ' + wRdisp + '   →   H / D = ' + wRdisp + ' Sv/Gy', padL + 3, 17);

      ctx.fillStyle = 'rgba(231,236,242,0.40)'; ctx.font = '9px "IBM Plex Mono",monospace';
      ctx.fillText('LET ≈ ' + rt.letStr + ' keV/μm' + (typeIdx === 2 ? '  (recoil p†)' : ''), padL + 3, 31);

      if (typeIdx === 2) {
        ctx.fillStyle = 'rgba(232,163,61,0.78)'; ctx.font = '9px "IBM Plex Mono",monospace';
        ctx.textAlign = 'right';
        ctx.fillText('E_n = ' + En.toFixed(2) + ' MeV  →  w_R = ' + RAD[2].wR.toFixed(2) + '  (ICRP 103)', W - padR, 31);
        ctx.textAlign = 'left';
      }

      ctx.fillStyle = 'rgba(231,236,242,0.62)'; ctx.font = '10px "IBM Plex Mono",monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText('ionisation events: ' + hitCount, W - padR, 2);
      ctx.fillStyle = 'rgba(231,236,242,0.28)'; ctx.font = '9px "IBM Plex Mono",monospace';
      ctx.fillText('live dots: ' + ions.length, W - padR, 16);

      ctx.fillStyle = 'rgba(231,236,242,0.18)'; ctx.font = '9px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('tissue cross-section  ·  ionisation density map', padL + 4, padT + tH - 3);

      rtAnimState.raf = requestAnimationFrame(step);
    }

    rtAnimState.raf = requestAnimationFrame(step);
  }


/* ─── Cell Survival: dual LQ curve plotter ──────────────────────────── */
  function rtRunSimCellSurvival(params, canvas, resultsEl, stage) {
    const sized = rtSizeCanvas(canvas);
    const ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0, 0, W, H);

    const a1     = params.csAlpha1,  ab1 = params.csAB1,  b1 = a1 / ab1;
    const a2     = params.csAlpha2,  ab2 = params.csAB2,  b2 = a2 / ab2;
    const N      = Math.max(1, Math.round(params.csFracs));
    const maxD   = params.csMaxDose;
    const yDec   = 4; // four log-decades (SF 1 → 1e-4)

    const padL = 52, padR = 16, padT = 22, padB = 36;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    function dPx(d)  { return padL + (d / maxD) * plotW; }
    function sfPy(sf) {
      const c = Math.max(Math.pow(10, -yDec), Math.min(1, sf));
      return padT + (1 - (Math.log10(c) + yDec) / yDec) * plotH;
    }
    /* Acute SF */
    function sfAcute(a, b, d) { return Math.exp(-(a * d + b * d * d)); }
    /* Fractionated SF: N fractions of d_frac each, total = D */
    function sfFrac(a, b, d, n) {
      const df = d / n;
      return Math.exp(-n * (a * df + b * df * df));
    }

    /* ── Grid ── */
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    for (let dec = 0; dec <= yDec; dec++) {
      const y = sfPy(Math.pow(10, -dec));
      ctx.beginPath(); ctx.moveTo(padL, y + .5); ctx.lineTo(padL + plotW, y + .5); ctx.stroke();
    }
    const dStep = Math.max(1, Math.round(maxD / 10));
    for (let d = 0; d <= maxD; d += dStep) {
      ctx.beginPath(); ctx.moveTo(dPx(d) + .5, padT); ctx.lineTo(dPx(d) + .5, padT + plotH); ctx.stroke();
    }

    /* ── Axes ── */
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH); ctx.stroke();

    /* ── Tick labels ── */
    ctx.fillStyle = 'rgba(231,236,242,0.55)'; ctx.font = '9px "IBM Plex Mono",monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let dec = 0; dec <= yDec; dec++)
      ctx.fillText(dec === 0 ? '1' : '10⁻' + dec, padL - 5, sfPy(Math.pow(10, -dec)));
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let d = 0; d <= maxD; d += dStep) ctx.fillText(d, dPx(d), padT + plotH + 3);
    ctx.fillStyle = 'rgba(231,236,242,0.38)';
    ctx.fillText('Dose  (Gy)', padL + plotW / 2, padT + plotH + 18);
    ctx.save(); ctx.translate(14, padT + plotH / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText('Surviving fraction  SF(D)', 0, 0); ctx.restore();

    const NP = 400;

    /* Helper: draw one curve */
    function drawCurve(a, b, color, dash, label, useN) {
      ctx.beginPath();
      ctx.strokeStyle = color; ctx.lineWidth = dash ? 1.8 : 2.2;
      if (dash) ctx.setLineDash([5, 4]);
      for (let i = 0; i <= NP; i++) {
        const d = (i / NP) * maxD;
        const sf = useN > 1 ? sfFrac(a, b, d, useN) : sfAcute(a, b, d);
        i === 0 ? ctx.moveTo(dPx(d), sfPy(sf)) : ctx.lineTo(dPx(d), sfPy(sf));
      }
      ctx.stroke(); ctx.setLineDash([]);
    }

    /* ── Fractionated overlay (N > 1): ghost acute curve first ── */
    if (N > 1) {
      drawCurve(a1, b1, 'rgba(255,255,255,0.22)', true, '', 1);
      ctx.fillStyle = 'rgba(231,236,242,0.32)'; ctx.font = '9px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('acute (N=1)', padL + 6, padT + 10);
    }

    /* ── Main curves ── */
    drawCurve(a1, b1, stage.accent, false, '1', N);
    drawCurve(a2, b2, '#e8a33d',    true,  '2', N);

    /* ── Marker helper ── */
    function markSF(a, b, targetSF, color, label, useN) {
      // binary search for dose giving targetSF
      let lo = 0, hi = maxD;
      for (let k = 0; k < 60; k++) {
        const mid = (lo + hi) / 2;
        const sf = useN > 1 ? sfFrac(a, b, mid, useN) : sfAcute(a, b, mid);
        sf > targetSF ? (lo = mid) : (hi = mid);
      }
      const dMark = (lo + hi) / 2;
      if (dMark >= maxD * 0.98) return null;
      const px = dPx(dMark), py = sfPy(targetSF);
      ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, padT + plotH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(padL, py); ctx.lineTo(px, py); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(px, py, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(231,236,242,0.72)'; ctx.font = '9px "IBM Plex Mono",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(label + ' = ' + dMark.toFixed(2) + ' Gy', px + 4, py - 2);
      return dMark;
    }

    const d10_1  = markSF(a1, b1, 0.10, stage.accent, 'D₁₀ (L1)', N);
    const d50_1  = markSF(a1, b1, 0.50, stage.accent, 'D₅₀ (L1)', N);
    const d10_2  = markSF(a2, b2, 0.10, '#e8a33d',    'D₁₀ (L2)', N);

    /* ── Quasi-threshold Dq for line 1 (acute only, meaningful for shoulder) ── */
    if (N === 1 && b1 > 1e-6) {
      const Dq = (Math.log(1 + a1 / (2 * b1)) * 2 * b1 / a1); // approximation
      const DqTrue = Math.log(1 + a1 * a1 / (2 * b1)) / a1;    // exact
      if (DqTrue > 0.05 && DqTrue < maxD * 0.9) {
        const px = dPx(DqTrue);
        ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1; ctx.setLineDash([1, 3]);
        ctx.beginPath(); ctx.moveTo(padL, sfPy(1)); ctx.lineTo(padL + plotW, sfPy(1)); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath(); ctx.moveTo(px, sfPy(1)); ctx.lineTo(px, sfPy(sfAcute(a1, b1, DqTrue))); ctx.stroke();
        ctx.fillStyle = 'rgba(231,236,242,0.45)'; ctx.font = '9px "IBM Plex Mono",monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText('Dq≈' + DqTrue.toFixed(2) + ' Gy', px, sfPy(1) - 3);
      }
    }

    /* ── Legend ── */
    const lx = padL + plotW - 195, ly = padT + 8;
    const lineLen = 22;
    ctx.strokeStyle = stage.accent; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + lineLen, ly); ctx.stroke();
    ctx.fillStyle = 'rgba(231,236,242,0.78)'; ctx.font = '9px "IBM Plex Mono",monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('Line 1  α=' + a1.toFixed(2) + '  α/β=' + ab1.toFixed(1) + ' Gy', lx + lineLen + 5, ly);

    ctx.strokeStyle = '#e8a33d'; ctx.lineWidth = 1.8; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(lx, ly + 14); ctx.lineTo(lx + lineLen, ly + 14); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(231,236,242,0.78)';
    ctx.fillText('Line 2  α=' + a2.toFixed(2) + '  α/β=' + ab2.toFixed(1) + ' Gy', lx + lineLen + 5, ly + 14);

    if (N > 1) {
      ctx.fillStyle = 'rgba(231,236,242,0.50)';
      ctx.fillText(N + ' fractions of ' + (maxD / N).toFixed(2) + ' Gy  (full inter-fx repair)', lx, ly + 28);
    }

    /* ── BED / EQD2 results bar ── */
    const dFrac  = maxD / N;
    const bed1   = maxD * (1 + dFrac / ab1);
    const eqd2_1 = bed1 / (1 + 2 / ab1);
    const bed2   = maxD * (1 + dFrac / ab2);
    const eqd2_2 = bed2 / (1 + 2 / ab2);

    resultsEl.innerHTML =
      '<b>D_total = ' + maxD + ' Gy  in ' + N + ' fx of ' + dFrac.toFixed(2) + ' Gy</b>' +
      ' &nbsp;|&nbsp; ' +
      '<span style="color:' + stage.accent + '">' +
        'BED<sub>' + ab1.toFixed(0) + '</sub> = ' + bed1.toFixed(1) + ' Gy' +
        ' &nbsp;&middot;&nbsp; EQD2 = ' + eqd2_1.toFixed(1) + ' Gy' +
        (d10_1 !== null ? ' &nbsp;&middot;&nbsp; D10 = ' + d10_1.toFixed(2) + ' Gy' : '') +
      '</span>' +
      ' &nbsp;|&nbsp; ' +
      '<span style="color:#e8a33d">' +
        'BED<sub>' + ab2.toFixed(0) + '</sub> = ' + bed2.toFixed(1) + ' Gy' +
        ' &nbsp;&middot;&nbsp; EQD2 = ' + eqd2_2.toFixed(1) + ' Gy' +
        (d10_2 !== null ? ' &nbsp;&middot;&nbsp; D10 = ' + d10_2.toFixed(2) + ' Gy' : '') +
      '</span>';
  }
  

/* ─── Cell Survival: live clonogenic cell-killing animation ─────────── */
  function rtRunCellSurvivalAnim(canvas, content, stage) {
    const COLS = 16, ROWS = 7, N_CELLS = COLS * ROWS;
    const maxDoseAnim = 14; // Gy

    /* Build two independent cell grids: line-1 (stage colour) and line-2 (amber) */
    function makePop() {
      const cells = [];
      for (let i = 0; i < N_CELLS; i++) cells.push({ alive: true, fade: 1.0 });
      return cells;
    }

    rtAnimState.csPop1   = makePop();
    rtAnimState.csPop2   = makePop();
    rtAnimState.csDose   = 0;
    rtAnimState.csTrace1 = [];   // { d, sf }
    rtAnimState.csTrace2 = [];

    function readParams() {
      const p = {};
      content.anim.params.forEach(function (def) {
        const el = document.getElementById('p-' + def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    function sfOf(a, b, d) { return Math.exp(-(a * d + b * d * d)); }

    function killTo(pop, targetAlive) {
      let alive = pop.filter(c => c.alive).length;
      let guard = 0;
      while (alive > targetAlive && guard++ < N_CELLS * 4) {
        const idx = Math.floor(Math.random() * N_CELLS);
        if (pop[idx].alive) { pop[idx].alive = false; alive--; }
      }
    }

    function drawPop(ctx, pop, cx, cy, cw, ch, color) {
      const padCell = 5;
      const cellR   = Math.max(3, Math.min(cw, ch) * 0.30);
      pop.forEach(function (cell, i) {
        const col = i % COLS, row = Math.floor(i / COLS);
        const px = cx + padCell + col * cw + cw / 2;
        const py = cy + padCell + row * ch + ch / 2;
        if (cell.alive) {
          ctx.fillStyle   = color;
          ctx.globalAlpha = 0.88;
        } else {
          cell.fade = Math.max(0.12, cell.fade - 0.035);
          ctx.fillStyle   = '#3a4452';
          ctx.globalAlpha = cell.fade;
        }
        ctx.beginPath(); ctx.arc(px, py, cellR, 0, Math.PI * 2); ctx.fill();
        /* nucleus dot on live cells */
        if (cell.alive) {
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.beginPath(); ctx.arc(px, py, cellR * 0.38, 0, Math.PI * 2); ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
    }

    function step() {
      if (!document.body.contains(canvas)) { rtStopAnim(); return; }

      const p    = readParams();
      const a1   = p.csAlpha1, ab1 = p.csAB1, b1 = a1 / ab1;
      /* line 2 defaults — fixed representative late-responding tissue */
      const a2   = 0.10, ab2 = 2.5, b2 = a2 / ab2;
      const rate = p.csRate;

      rtAnimState.csDose += rate;
      if (rtAnimState.csDose > maxDoseAnim) {
        rtAnimState.csPop1   = makePop();
        rtAnimState.csPop2   = makePop();
        rtAnimState.csDose   = 0;
        rtAnimState.csTrace1 = [];
        rtAnimState.csTrace2 = [];
      }

      const D  = rtAnimState.csDose;
      const target1 = Math.round(sfOf(a1, b1, D) * N_CELLS);
      const target2 = Math.round(sfOf(a2, b2, D) * N_CELLS);
      killTo(rtAnimState.csPop1, target1);
      killTo(rtAnimState.csPop2, target2);

      const alive1 = rtAnimState.csPop1.filter(c => c.alive).length;
      const alive2 = rtAnimState.csPop2.filter(c => c.alive).length;
      rtAnimState.csTrace1.push({ d: D, sf: alive1 / N_CELLS });
      rtAnimState.csTrace2.push({ d: D, sf: alive2 / N_CELLS });

      /* ── Layout ── */
      const sized = rtSizeCanvas(canvas);
      const ctx = sized.ctx, W = sized.w, H = sized.h;
      ctx.clearRect(0, 0, W, H);

      const fieldH  = Math.round(H * 0.54);
      const curveH  = H - fieldH - 10;
      const halfW   = Math.floor(W / 2) - 3;
      const cellW   = (halfW - 10) / COLS;
      const cellHt  = (fieldH - 10) / ROWS;
      const divX    = halfW + 3;

      /* Cell field backgrounds */
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.fillRect(0, 0, halfW, fieldH);
      ctx.fillRect(divX, 0, W - divX, fieldH);
      ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, halfW - 1, fieldH - 1);
      ctx.strokeRect(divX + 0.5, 0.5, W - divX - 1, fieldH - 1);

      /* Field labels */
      ctx.font = '9px "IBM Plex Mono",monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = stage.accent;
      ctx.fillText('Line 1  α=' + a1.toFixed(2) + '  α/β=' + ab1.toFixed(1) + ' Gy', halfW / 2, 3);
      ctx.fillStyle = '#e8a33d';
      ctx.fillText('Line 2  α=' + a2.toFixed(2) + '  α/β=' + ab2.toFixed(1) + ' Gy', divX + (W - divX) / 2, 3);

      /* Draw both populations */
      drawPop(ctx, rtAnimState.csPop1, 0,    14, cellW, cellHt - 2, stage.accent);
      drawPop(ctx, rtAnimState.csPop2, divX, 14, cellW, cellHt - 2, '#e8a33d');

      /* Surviving-fraction readout per field */
      ctx.font = '11px "IBM Plex Mono",monospace'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = stage.accent; ctx.textAlign = 'right';
      ctx.fillText('SF = ' + (alive1 / N_CELLS).toExponential(2), halfW - 4, fieldH - 3);
      ctx.fillStyle = '#e8a33d'; ctx.textAlign = 'left';
      ctx.fillText('SF = ' + (alive2 / N_CELLS).toExponential(2), divX + 4, fieldH - 3);

      /* ── Dual SF curve panel ── */
      const curveTop = fieldH + 10;
      const padL = 48, padR = 10, padT = 4, padB = 18;
      const plotW = W - padL - padR, plotH = curveH - padT - padB;
      const yDec  = 4;

      ctx.fillStyle = 'rgba(10,14,20,0.72)';
      ctx.fillRect(0, curveTop, W, curveH);
