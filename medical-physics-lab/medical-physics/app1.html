'effective-dose': {
      tagline: `A single whole-body number representing stochastic risk from non-uniform exposure`,
      detailed: true,
      fundamentals: {
        overview: [
          `Effective dose E reduces a complex, non-uniform 3-D dose distribution to a single sievert value by summing each organ's equivalent dose H_T, weighted by a dimensionless tissue weighting factor w_T. The value of w_T for each organ or tissue encodes its relative share of the total stochastic radiation detriment — a composite measure of fatal cancer risk, weighted non-fatal cancer incidence, and heritable effects — estimated from Life Span Study epidemiology and radiobiological modelling and averaged across a reference population of equal numbers of adult males and females. Because all w_T values sum to exactly 1.00, a 1 Sv uniform whole-body exposure gives E = 1 Sv by construction: effective dose is normalised to be numerically equal to the uniform whole-body photon dose that would produce the same total stochastic detriment in the reference population.`,
          `ICRP 103 (2007) assigns named w_T values to thirteen tissue groups plus a remainder category of fourteen additional organs. Five tissues each carry the highest individual weight of 0.12 — red bone marrow, breast, colon, lung and stomach — together accounting for 60% of the total detriment weight; these organs therefore dominate effective dose in most clinical irradiation geometries. Gonads carry 0.08, reflecting their contribution to heritable effects. Four organs carry 0.04 each (bladder, oesophagus, liver, thyroid), and four tissues of individually low sensitivity share 0.01 each (bone surface, brain, salivary glands and skin). The fourteen remainder tissues are averaged arithmetically and weighted collectively as 0.12 — an approach that prevents any single heavily-irradiated remainder organ from dominating the sum, replacing the ICRP 60 rule that used only the most exposed remainder organ.`,
          `Effective dose is a population protection quantity, not a patient risk estimator. It assumes a sex-averaged reference person (ICRP Publication 110 adult voxel phantoms), uses population-average cancer mortality rates integrated over a lifetime, and ignores age at exposure, genetic susceptibility and the true spatial dose distribution within each organ mass. ICRP 103 explicitly states that E must not be used to estimate the stochastic risk of a named individual from a specific clinical procedure — organ dose combined with age- and sex-specific risk models is needed for that. Where effective dose is legitimately applied: verifying that occupational or public doses satisfy regulatory limits (20 mSv yr⁻¹ and 1 mSv yr⁻¹ respectively), comparing the relative detriment of different imaging protocols or irradiation geometries, and supporting dose-constraint and reference-level frameworks where population-level risk comparisons are appropriate.`
        ],
        bullets: [
          `E = Σ_T w_T H_T [Sv]; all ICRP 103 w_T values sum to exactly 1.00 across all listed organs and the remainder group`,
          `Five tissues at w_T = 0.12 each: red bone marrow, breast, colon, lung, stomach — combined weight 0.60 means these organs dominate effective dose in most clinical geometries`,
          `Gonads: w_T = 0.08; bladder, oesophagus, liver, thyroid: 0.04 each; bone surface, brain, salivary glands, skin: 0.01 each`,
          `Remainder (14 organs): H_rem = arithmetic mean of the 14 individual equivalent doses × 0.12 collectively — avoids the ICRP 60 problem of one high-dose organ inflating the remainder term`,
          `Occupational dose limit (ICRP 103): E ≤ 20 mSv yr⁻¹ averaged over any consecutive 5-year period, with no single year exceeding 50 mSv`,
          `Public dose limit (ICRP 103): E ≤ 1 mSv yr⁻¹ from controlled artificial sources; natural background and medical exposures are excluded from this limit`,
          `Nominal stochastic risk coefficient: r ≈ 5.5 × 10⁻² Sv⁻¹ for the general population — valid only for population-level risk estimation, never for predicting a named patient's cancer risk`,
          `Clinical reference values: chest X-ray (AP) ≈ 0.1 mSv; chest CT ≈ 5–7 mSv; abdominal CT ≈ 7–10 mSv; annual natural background ≈ 2–3 mSv`
        ],
        eqs: [
          {
            tex: `E = \\sum_T w_T\\,H_T \\quad [\\text{Sv}]`,
            note: `Defining relation for effective dose (ICRP 103). E: effective dose in sievert. w_T: dimensionless tissue weighting factor for organ or tissue T — encodes that organ's relative contribution to the total stochastic radiation detriment (fatal cancer + weighted non-fatal cancer + heritable effects) per unit equivalent dose, derived from Life Span Study data and radiobiological judgement. H_T: mean equivalent dose to tissue T in sievert, averaged uniformly over the entire tissue mass (not just the most-irradiated sub-volume). The sum runs over all ICRP 103 tissues, including the remainder group; all w_T sum to 1.00.`
          },
          {
            tex: `\\begin{array}{l\\;c\\;|\\;l\\;c}
              \\textbf{Tissue} & \\boldsymbol{w_T} & \\textbf{Tissue} & \\boldsymbol{w_T}\\\\
              \\hline
              \\text{Red bone marrow} & 0.12 & \\text{Gonads}      & 0.08\\\\
              \\text{Breast}          & 0.12 & \\text{Bladder}     & 0.04\\\\
              \\text{Colon}           & 0.12 & \\text{Oesophagus}  & 0.04\\\\
              \\text{Lung}            & 0.12 & \\text{Liver}       & 0.04\\\\
              \\text{Stomach}         & 0.12 & \\text{Thyroid}     & 0.04\\\\
              \\text{Remainder (14)}  & 0.12 & \\text{Bone surface}& 0.01\\\\
                                      &      & \\text{Brain}       & 0.01\\\\
                                      &      & \\text{Salivary gl.}& 0.01\\\\
                                      &      & \\text{Skin}        & 0.01\\\\
              \\hline
              & & \\boldsymbol{\\Sigma} & \\boldsymbol{1.00}
            \\end{array}`,
            note: `ICRP 103 tissue weighting factors. The "Remainder (14)" entry covers: adrenals, extrathoracic (ET) region, gall bladder, heart, kidneys, lymphatic nodes, muscle, oral mucosa, pancreas, prostate (or uterus/cervix), small intestine, spleen, and thymus. Their equivalent doses are first averaged arithmetically across all 14 organs, then the mean is multiplied by the collective remainder weighting factor 0.12. This arithmetic-mean rule prevents a single heavily-irradiated remainder organ from dominating E, a drawback of the ICRP 60 approach.`
          },
          {
            tex: `H_{\\mathrm{rem}} = \\frac{0.12}{n_R}\\sum_{i=1}^{n_R} H_{T_i},\\qquad n_R = 14`,
            note: `Remainder tissues contribution to effective dose. n_R = 14: number of named remainder tissues in ICRP 103. H_{T_i}: equivalent dose (Sv) to the i-th remainder tissue, averaged over its mass. The arithmetic mean of all 14 equivalent doses is computed first, then multiplied by the collective remainder weighting factor 0.12. This gives the remainder's contribution to the effective dose sum on the same footing as each of the five high-weight tissues: if all 14 remainder organs receive the same dose as, say, the stomach, their collective contribution 0.12 equals the stomach's contribution — no single remainder organ can dominate.`
          },
          {
            tex: `E_{\\mathrm{occ}} \\le 20\\,\\mathrm{mSv\\,yr^{-1}}\\,(\\text{5-yr avg}),\\qquad E_{\\mathrm{pub}} \\le 1\\,\\mathrm{mSv\\,yr^{-1}}`,
            note: `ICRP 103 dose limits for planned exposure situations. E_occ: occupational limit — effective dose must not exceed 100 mSv over any consecutive 5-year period (equivalent to 20 mSv yr⁻¹ average), with a subsidiary single-year ceiling of 50 mSv. E_pub: public exposure limit from artificial sources — 1 mSv yr⁻¹; natural background radiation and medical exposures received as a patient are excluded from this limit. These are maximum permitted values. The ALARA principle (As Low As Reasonably Achievable) requires doses to be kept well below them; many national regulators set operational dose levels at a fraction of these limits as an additional safety margin.`
          },
          {
            tex: `r_{\\mathrm{stoch}} \\approx 5.5\\times10^{-2}\\,\\mathrm{Sv^{-1}}\\quad(\\text{whole population, all cancer types})`,
            note: `ICRP 103 nominal stochastic risk coefficient: approximately 5.5 additional fatal-cancer-equivalent cases per 100 person-sievert of collective effective dose, delivered to the general population at low dose rates over a lifetime. The value is lower for adult workers (≈ 4.1 × 10⁻² Sv⁻¹) because the reference adult working population excludes the more radiosensitive young children and elderly included in the general population average. This coefficient applies strictly to population-level, collective-dose risk estimation — it must never be multiplied by an individual patient's effective dose to compute that person's cancer probability, for which age- and sex-specific organ-dose risk models (BEIR VII methodology) are required.`
          }
        ]
      },
      sim: {
        description: `The left panel places each ICRP 103 organ on a schematic body outline; colour intensity scales with that organ's contribution w_T × H_T to the total effective dose. The right panel sorts all organ contributions from largest to smallest, with the total E and the μ_eff used displayed at the bottom. Sweep Geometry from AP → PA → LAT → Uniform to watch how beam direction redistributes the dominant organs: breast and stomach lead in AP (shallow entrance depth); colon and gonads gain in PA (rear-entrance geometry); raising photon energy flattens the attenuation gradient and reduces geometry dependence. Toggle "Show remainder group" to include the collective 0.12-weighted remainder term.`,
        params: [
          { id:'efGeom',      label:'Geometry  (0=AP · 1=PA · 2=LAT · 3=Uniform)', min:0,   max:3,   step:1,   value:0,  unit:''    },
          { id:'efDose',      label:'Entrance air kerma / CTDIvol',                 min:0.5, max:50,  step:0.5, value:5,  unit:'mGy' },
          { id:'efEnergy',    label:'Photon energy',                                min:30,  max:150, step:5,   value:80, unit:'keV' },
          { id:'efRemainder', label:'Show remainder group  (0=off · 1=on)',         min:0,   max:1,   step:1,   value:0,  unit:''    }
        ]
      },
      anim: {
        description: `Photons stream into the body outline from the direction set by Geometry. As each particle passes through an organ's position it triggers a hit-flash and increments that organ's accumulated dose counter; the live bar chart on the right shows each organ's running w_T × D_T contribution rate, sorted in real time. The E/D₀ ratio below the chart converges to a stable value (mSv per mGy of entrance kerma) that depends on photon energy and geometry — switch geometry or energy mid-play to watch it shift and a new accumulation build from zero.`,
        params: [
          { id:'efGeom',   label:'Geometry  (0=AP · 1=PA · 2=LAT · 3=Uniform)', min:0,   max:3,   step:1, value:0,  unit:''       },
          { id:'efEnergy', label:'Photon energy',                                 min:30,  max:150, step:5, value:80, unit:'keV'    },
          { id:'efRate',   label:'Beam intensity',                                min:1,   max:10,  step:1, value:4,  unit:'/frame' }
        ]
      }
    },

'radiation-biology': {
      tagline:`From energy deposition to molecular, cellular and tissue-level response`,
      detailed:true,
      fundamentals:{
        overview:[
          `Radiation biology is the causal chain that turns the physical quantity calculated under Dosimetry into the clinical and protection outcomes that actually matter: cell killing, mutation, tissue reaction, and cancer risk. The same absorbed dose, delivered to the same tissue, can produce very different biological consequences depending on dose rate, fractionation, oxygenation, and the radiation's LET — which is why dose alone is never the whole story.`,
          `The chain unfolds across a remarkable span of timescales. Physical energy deposition (ionization and excitation) is essentially instantaneous, occurring over roughly 10^-18 to 10^-15 seconds. Chemical damage follows almost as fast: water radiolysis produces short-lived free radicals — chiefly the hydroxyl radical OH• — that diffuse and react with DNA within about 10^-6 seconds of the initial track. Biological expression of that chemical damage then plays out over a vastly longer and more variable timescale: enzymatic repair within minutes to hours, cell death or division within hours to days, and tissue reactions or cancer over months to decades.`,
          `Two mechanisms deliver the initial chemical damage. Direct action is ionization of the DNA molecule itself by a passing charged particle. Indirect action is ionization of a nearby water molecule, producing a radical that subsequently diffuses to and reacts with DNA. For sparsely-ionizing, low-LET radiation such as photons and electrons, indirect action — overwhelmingly through OH• — accounts for roughly two-thirds of the biological damage; for densely-ionizing, high-LET radiation such as alpha particles, direct action dominates instead, because the ionization density along the track is high enough to damage DNA without needing a diffusing intermediary.`
        ],
        bullets:[
          `Three-stage timescale cascade: physical (~10⁻¹⁸–10⁻¹⁵ s) → chemical/radical (~10⁻⁶ s) → biological (minutes to decades)`,
          `Indirect action via OH• radicals dominates for low-LET radiation (~2/3 of damage); direct action dominates for high-LET radiation`,
          `The DNA double-strand break (DSB) is the lesion most closely correlated with cell killing and mutagenesis`,
          `The "Four Rs" govern the response to fractionated dose: Repair, Reassortment (redistribution across the cell cycle), Repopulation, Reoxygenation`,
          `Oxygen enhancement ratio (OER) of ~2.5–3 for low-LET radiation reflects radical fixation of damage by molecular oxygen; OER → 1 for high-LET radiation`,
          `Deterministic (tissue-reaction) effects have a practical threshold and increase in severity with dose; stochastic effects (cancer, heritable disease) have no assumed threshold and increase only in probability`,
          `The linear-quadratic (LQ) survival model is the standard quantitative bridge from absorbed dose to cell killing, and underlies both the OER and the biologically effective dose (BED) used in fractionation planning`
        ],
        eqs:[
          {
            tex:`\\text{H}_2\\text{O} \\;\\underset{\\text{ionizing radiation}}{\\longrightarrow}\\; e^-_{aq} + \\text{H}^{\\bullet} + \\text{OH}^{\\bullet} + \\text{H}_2 + \\text{H}_2\\text{O}_2`,
            note:`Schematic radiolysis of water — the source of the indirect-action damage pathway. OH•: hydroxyl radical, the dominant DNA-damaging species for low-LET radiation. e⁻_aq: hydrated (solvated) electron. These species have lifetimes on the order of microseconds before reacting with a nearby biomolecule or recombining.`
          },
          {
            tex:`SF(D) = e^{-(\\alpha D + \\beta D^2)}`,
            note:`Linear-quadratic (LQ) cell survival model. SF: surviving fraction of an irradiated cell population. D: absorbed dose (Gy). α (Gy⁻¹): single-track ("one-hit") lethal damage component — dominant at low dose. β (Gy⁻²): double-track ("two-hit") lethal damage component, requiring two independent sub-lethal events to combine into one lethal lesion — dominant at high dose. The α/β ratio (Gy) sets the curvature of the semi-log survival curve and underlies fractionation sensitivity (see Cell Survival).`
          },
          {
            tex:`\\mathrm{OER} = \\frac{D_{\\rm hypoxic}}{D_{\\rm aerobic}}\\Bigg|_{\\rm same\\;effect}`,
            note:`Oxygen enhancement ratio. D_hypoxic, D_aerobic: doses required under hypoxic and aerobic conditions to produce the same biological endpoint (e.g. a given surviving fraction). OER ≈ 2.5–3 for X-rays and other low-LET radiation — oxygen "fixes" otherwise-repairable free-radical damage into a permanent chemical lesion. OER → 1 for high-LET radiation such as alpha particles, since direct action dominates and is largely oxygen-independent.`
          },
          {
            tex:`\\mathrm{RBE} = \\frac{D_{\\rm ref}}{D_{\\rm test}}\\Bigg|_{\\rm same\\;effect}`,
            note:`Relative biological effectiveness — the experimentally measured ratio that the radiation weighting factor w_R (see Equivalent Dose) approximates with a single rounded value for radiation-protection purposes. D_ref: dose of a reference radiation (conventionally 250 kVp X-rays) producing a given effect. D_test: dose of the radiation under study producing the same effect.`
          },
          {
            tex:`BED = nd\\left(1+\\frac{d}{\\alpha/\\beta}\\right)`,
            note:`Biologically effective dose, the LQ-derived quantity that allows different fractionation regimens to be compared on a common biological scale (see Radiation Therapy for clinical use). n: number of fractions. d: dose per fraction (Gy). α/β: the tissue- or tumor-specific ratio from the LQ model above. Low α/β tissues (most late-responding normal tissues) are disproportionately spared as d is reduced — the physical basis for fractionation.`
          },
          {
            tex:`SF(D) = e^{-\\alpha D - G\\beta D^2}, \\qquad 0 < G \\le 1`,
            note:`Lea-Catcheside protraction correction for the dose-rate effect. G: a factor (≤1) that discounts the quadratic (β) term when dose is delivered slowly or in widely-spaced fractions, because sub-lethal damage has time to repair between the two "hits" needed to form a lethal lesion. G → 1 for acute, high-dose-rate delivery (no time to repair); G → 0 for very protracted delivery — the molecular basis of the "Repair" R.`
          }
        ]
      },
      sim:{
        description:`The plot is the linear-quadratic cell survival curve SF(D) = exp[-(αD + βD²)] on a semi-log axis — the standard way to display radiobiological survival data, since it turns the single-track (α) component into a straight initial slope and reveals the curving "shoulder" produced by the two-track (β) component. Toggle hypoxic conditions to see the curve shift by the oxygen enhancement ratio, and switch on fractionation to compare delivering the same total dose in N equal fractions (with full inter-fraction repair assumed) against a single acute exposure.`,
        params:[
          { id:'rbAlpha',     label:'α  (single-track component)',          min:0.02, max:0.80, step:0.01, value:0.30, unit:'Gy⁻¹' },
          { id:'rbABRatio',   label:'α/β ratio',                             min:1,    max:20,   step:0.5,  value:10,   unit:'Gy'   },
          { id:'rbMaxDose',   label:'Max dose shown',                        min:2,    max:20,   step:1,    value:10,   unit:'Gy'   },
          { id:'rbOER',       label:'OER  (1 = aerobic)',                     min:1,    max:3,    step:0.1,  value:1,    unit:''     },
          { id:'rbFractions', label:'Fractions N  (1 = single acute dose)',   min:1,    max:30,   step:1,    value:1,    unit:''     }
        ]
      },
      anim:{
        description:`A simplified cell population (each dot one cell) is irradiated continuously. Every cell shares the α, β and OER set above; as dose accumulates, the population's instantaneous survival probability follows the LQ model, and cells are "killed" (fading to grey) stochastically at the matching rate. The live survival fraction — the same quantity plotted analytically in the Interactive Simulation tab — is traced out as a growing curve below, against the theoretical SF(D) line, so you can watch simulated cell killing converge onto theory.`,
        params:[
          { id:'rbAlpha',   label:'α  (single-track component)', min:0.02, max:0.80, step:0.01, value:0.30, unit:'Gy⁻¹' },
          { id:'rbABRatio', label:'α/β ratio',                    min:1,    max:20,   step:0.5,  value:10,   unit:'Gy'   },
          { id:'rbOER',     label:'OER  (1 = aerobic)',            min:1,    max:3,    step:0.1,  value:1,    unit:''     },
          { id:'rbRate',    label:'Dose rate',                     min:0.01, max:0.20, step:0.01, value:0.05, unit:'Gy/frame' }
        ]
      }
    },

'dna-damage': {
      tagline:`The molecular lesion that begins the chain to cell death or mutation`,
      detailed:true,
      fundamentals:{
        overview:[
          `Ionizing radiation damages DNA through two distinct routes. Direct action is ionization of the DNA molecule itself by a passing charged particle — the dominant route for densely-ionizing, high-LET radiation such as alpha particles and heavy ions, where the track runs close enough to the helix to hit it outright. Indirect action instead begins with ionization of a nearby water molecule: radiolysis splits the water into reactive radicals — chiefly the hydroxyl radical OH• — which then diffuse a short distance and attack the DNA chemically. For sparsely-ionizing, low-LET radiation such as photons and electrons, indirect action accounts for roughly two-thirds of the resulting DNA damage.`,
          `A single track deposits energy as a string of discrete ionization events along its path, spaced on average by s = W/LET, where W ≈ 33 eV is the mean energy needed to form one ion pair in water-like tissue. At low LET (photons, electrons) this spacing is tens of nanometres — far larger than the ~2 nm diameter of the DNA double helix — so most ionizations land far from any DNA and only occasionally produce a lesion. At high LET (alpha particles, heavy ions) the spacing shrinks to a fraction of a nanometre, so ionizations cluster densely along the few-nanometre stretch of one helical turn, making it far more likely that both strands are hit close together in space and time.`,
          `This spatial clustering is what determines the type of lesion produced. An isolated ionization event typically yields a single-strand break (SSB) or an oxidized/damaged base — both abundant, but individually repaired quickly and with high fidelity using the intact opposite strand as a template. A double-strand break (DSB), where both strands are broken within roughly one helical turn (about 10 base pairs, 3.4 nm) of each other, has no intact template nearby and is consequently far more likely to be misrepaired or left unrepaired — making the DSB the lesion most closely correlated with cell killing, chromosome aberrations and mutagenesis, even though it is produced far less often than an SSB.`
        ],
        bullets:[
          `Direct action ionizes DNA itself; indirect action ionizes nearby water, producing OH• and other radicals that diffuse to and attack DNA`,
          `Indirect action (via OH•) supplies roughly 2/3 of the damage for low-LET radiation; direct action dominates for high-LET radiation`,
          `Mean ionization spacing along a track scales as s = W/LET — tens of nm at low LET, sub-nm at high LET`,
          `Typical low-LET yields per Gy per mammalian cell: ~1000 SSB, ~1000–3000 damaged bases, but only ~20–40 DSB`,
          `A DSB forms when both strands break within about one helical turn (~10 bp, 3.4 nm) of each other — too close together for the intact-strand repair template used for an SSB`,
          `DSBs are repaired mainly by non-homologous end joining (NHEJ, fast, available in all cell-cycle phases, somewhat error-prone) and homologous recombination (HR, slower, restricted to S/G2 phase, higher fidelity)`,
          `Misrepaired or unrepaired DSBs drive both reproductive cell death and the mutations and chromosome aberrations that underlie carcinogenesis — the molecular root of the α-term in the linear-quadratic model (see Cell Survival)`
        ],
        eqs:[
          {
            tex:`D = D_{\\text{direct}} + D_{\\text{indirect}}`,
            note:`Schematic partition of absorbed dose by damage pathway. D_direct: energy depositions that ionize DNA directly. D_indirect: energy depositions that ionize surrounding water, whose radical products subsequently attack DNA. For low-LET radiation (photons, electrons), D_indirect ≈ 2 × D_direct; this ratio shifts toward direct action as LET rises.`
          },
          {
            tex:`s = \\dfrac{W}{\\mathrm{LET}}`,
            note:`Mean spacing between successive ionization events along a track. W ≈ 33 eV: mean energy required to produce one ion pair in water/soft tissue (the "W-value"). LET in keV/μm. This sets how densely a track's ionizations cluster relative to the ~2 nm diameter of the DNA double helix — the physical root of the LET-dependence of biological damage, and the quantity driving the simulation below.`
          },
          {
            tex:`r_{\\text{diff}} = \\sqrt{2D_{\\text{diff}}\\,t}`,
            note:`Characteristic diffusion distance of a water radical before it decays or recombines. D_diff: diffusion coefficient of OH• in water (≈ 2×10⁻⁹ m²/s). t: radical lifetime (≈ 1–10 ns under cellular conditions, limited by scavenging). The result, a few nanometres, is comparable to the helix diameter — explaining why only radiolysis events very close to DNA contribute to indirect-action damage.`
          },
          {
            tex:`N_{\\text{lesion}} = k_{\\text{lesion}}\\,D`,
            note:`Lesion yield is approximately linear with absorbed dose D (Gy) at the induction stage, before any repair. k_lesion: yield constant per Gy per cell, with approximate low-LET values k_SSB ≈ 1000 Gy⁻¹, k_base ≈ 1000–3000 Gy⁻¹, k_DSB ≈ 20–40 Gy⁻¹ for a mammalian cell. Downstream biological effect is not linear in dose even though initial lesion induction is — the linear-quadratic survival curve (see Radiation Biology, Cell Survival) arises from how lesions combine and misrepair, not from this induction step.`
          },
          {
            tex:`P_{\\text{DSB}}(s,b) \\approx \\tfrac{1}{2}\\left(1-e^{-b/s}\\right)`,
            note:`Approximate probability that a given ionization has a partner ionization within a critical window of b ≈ 10 bp (one helical turn) along the track, with the leading factor of ½ reflecting the roughly even chance that the partner falls on the opposite strand (required for a DSB rather than two SSBs on the same strand). s: mean ionization spacing from the equation above. As LET rises, s falls, b/s grows, and P_DSB climbs toward 1 — the basis of the simulation below.`
          },
          {
            tex:`N(t) = N_f\\,e^{-t/\\tau_f} + N_s\\,e^{-t/\\tau_s}`,
            note:`Biexponential DSB repair kinetics. N(t): unrepaired DSBs remaining at time t after irradiation. N_f, τ_f: fast component (mainly NHEJ), τ_f of order 10–30 minutes. N_s, τ_s: slow component (mainly HR and repair of complex, clustered damage), τ_s of order several hours. DSBs still unrepaired after roughly 24 hours correlate strongly with eventual cell death — the basis of γ-H2AX foci assays used to measure repair kinetics experimentally.`
          }
        ]
      },
      sim:{
        description:`Each row simulates one radiation track crossing a short stretch of double-stranded DNA (drawn as two parallel strand lines). Ionization events are sampled along the track with mean spacing s = W/LET and assigned at random to one strand or the other. Two events landing on opposite strands within the critical window set below are classified as a double-strand break (crimson, with a connecting line); isolated events are classified as single-strand breaks (cyan). Raise the LET to watch the ionizations crowd together and the DSB count climb — the same clustering effect that makes high-LET radiation more biologically damaging per gray.`,

'cell-survival': {
  tagline: `The fraction of irradiated cells that retain clonogenic capacity`,
  detailed: true,
  fundamentals: {
    overview: [
      `Cell survival in radiobiology is defined in the clonogenic sense: a cell "survives" only if it retains the capacity to divide indefinitely and form a macroscopic colony. Cells that are physically intact but have lost this capacity — typically because of unrepaired or misrepaired DNA double-strand breaks that prevent subsequent mitoses — are scored as dead. The clonogenic assay (plating irradiated cells in culture, waiting ten to fourteen days, and counting colonies that exceed fifty cells) translates this definition into a measured surviving fraction SF, which is then plotted on a semi-logarithmic axis against dose to produce the cell survival curve.`,
      `The linear-quadratic (LQ) model is the dominant empirical framework for those curves. It partitions lethal damage into two additive components. The α-term, linear in dose, represents damage from a single radiation track severe enough to kill the cell outright — most importantly, a complex double-strand break or a tight cluster of lesions produced by one particle transit. The β-term, quadratic in dose, represents damage assembled from two independent sub-lethal events (typically two single-strand breaks on opposite strands, each from separate tracks) that combine into a lethal lesion. At low dose, single-track events dominate and the survival curve is nearly straight on a log-linear plot; at high dose, the two-track term curves the surviving fraction downward faster than a pure exponential, producing the characteristic "shoulder." The ratio α/β (in Gy) locates the dose at which these two contributions are equal and quantifies the curvature: a high α/β ratio (typically 8–12 Gy, early-responding tissues and many tumors) means the shoulder is modest and the curve stays nearly linear; a low α/β ratio (typically 1–4 Gy, late-responding normal tissues) means the shoulder is prominent and the two-track term becomes important even at moderate doses.`,
      `This curvature has a direct clinical consequence. If a total dose D is delivered in N equal fractions of size d = D/N, with full repair of sub-lethal damage between fractions, the surviving fraction is SF = exp[−N(αd + βd²)] instead of exp[−(αD + βD²)] for a single acute exposure. Late-responding, low-α/β tissues benefit more from this splitting — their β-term is relatively large, so reducing d reduces the quadratic term disproportionately, sparing them relative to the tumor. This biological advantage of small fractions is captured quantitatively by the biologically effective dose BED = nd(1 + d/(α/β)) and its clinical equivalent EQD2 (the dose in 2-Gy fractions producing the same BED), which are the standard tools for comparing or converting between radiotherapy fractionation schedules.`
    ],
    bullets: [
      `Clonogenic survival: a cell "survives" only if it retains the ability to form a macroscopic colony — physical viability is irrelevant`,
      `LQ model: SF(D) = exp[−(αD + βD²)]; α (Gy⁻¹) is the single-track coefficient, β (Gy⁻²) is the two-track coefficient`,
      `α/β ratio (Gy): dose at which single-track and two-track killing are equal; high α/β (≈10 Gy) in early-responding tissue; low α/β (≈2–3 Gy) in late-responding tissue`,
      `Shoulder on the survival curve is the graphical signature of the β-term: prominent for low-α/β tissues, small for high-α/β tissues`,
      `Fractionation: N fractions of dose d give SF = exp[−N(αd + βd²)] — late-responding (low-α/β) tissues are spared more than early-responding ones as d decreases`,
      `BED = nd(1 + d/(α/β)): the biologically effective dose collapses any fractionation schedule to a single number on a tissue-specific scale`,
      `EQD2 = BED / (1 + 2/(α/β)): converts BED to the isoeffective dose in standard 2-Gy fractions — the lingua franca of clinical radiotherapy plan comparison`,
      `Extrapolation number n = exp(βD_q²) and quasi-threshold dose D_q are older parameters from the multi-target model, occasionally still cited in older literature`,
      `The Lea-Catcheside factor G (0 < G ≤ 1) discounts β when dose is fractionated or protracted — approaching 0 for very low dose-rate, recovering to 1 for acute delivery`
    ],
    eqs: [
      {
        tex: `SF(D) = e^{-(\\alpha D\\; +\\; \\beta D^2)}`,
        note: `Linear-quadratic cell survival model. SF: surviving (clonogenic) fraction. D: absorbed dose (Gy). α (Gy⁻¹): coefficient of the dose-linear (single-track) term — dominant at low dose. β (Gy⁻²): coefficient of the dose-squared (two-track) term — dominant at high dose; produces the downward curvature of the semi-log survival curve ("shoulder"). At the dose D = α/β the two terms contribute equally to the exponent.`
      },
      {
        tex: `\\frac{\\alpha}{\\beta} \\;[\\text{Gy}]:\\quad \\alpha D = \\beta D^2 \\;\\Leftrightarrow\\; D = \\frac{\\alpha}{\\beta}`,
        note: `Definition of the α/β ratio: the dose at which single-track (α) and two-track (β) lethal events are numerically equal. Tissue values: early-responding tissues and most tumors α/β ≈ 8–12 Gy (relatively resistant to hypofractionation); late-responding normal tissues α/β ≈ 1–4 Gy (disproportionately spared by small fractions). Prostate cancer is a well-known exception with α/β ≈ 1.5–3 Gy, motivating hypofractionation schedules.`
      },
      {
        tex: `SF(N,d) = e^{-N(\\alpha d + \\beta d^2)},\\qquad D_{\\rm total} = Nd`,
        note: `Fractionated LQ survival for N equal fractions of dose d (Gy), with full sub-lethal damage repair between fractions. N: number of fractions. d: dose per fraction. D_total: prescribed total dose. The quadratic (β) term scales as d² per fraction but only as d to the first power after N fractions of constant total dose, so reducing d preferentially reduces the two-track component — the biological basis of conventional fractionation protecting late-responding tissue.`
      },
      {
        tex: `BED = Nd\\left(1 + \\frac{d}{\\alpha/\\beta}\\right) = D_{\\rm total}\\left(1 + \\frac{d}{\\alpha/\\beta}\\right)`,
        note: `Biologically effective dose (BED). Converts any fractionation schedule (N fractions of size d) to a single number on the tissue-specific log-kill axis, without assuming a reference fraction size. BED has units of Gy but is tissue-specific — a BED for tumor (high α/β) does not equal a BED for late-responding tissue (low α/β) unless the α/β values happen to be the same. BED must always be labelled with its α/β value: e.g. BED₁₀ for α/β = 10 Gy (tumor) or BED₃ for α/β = 3 Gy (late tissue).`
      },
      {
        tex: `EQD_2 = \\frac{BED}{1 + \\dfrac{2}{\\alpha/\\beta}} = D_{\\rm total}\\cdot\\frac{d + (\\alpha/\\beta)}{2 + (\\alpha/\\beta)}`,
        note: `Equivalent dose in 2-Gy fractions (EQD2): the total dose, given in standard 2-Gy fractions, that produces the same BED as the actual schedule. EQD2 is the single most widely used quantity for comparing radiotherapy plans, documenting cumulative retreatment risk, and reporting NTCP data in the literature, because 2-Gy fractions are the historical standard and the α/β values used in NTCP models are calibrated to them.`
      },
      {
        tex: `SF(D,\\dot{D}) = e^{-\\alpha D - G\\,\\beta D^2},\\quad G = \\frac{2}{\\mu D}\\!\\left[1 - \\frac{1-e^{-\\mu t}}{\\mu t}\\right]`,
        note: `Lea-Catcheside dose-protraction factor G. μ: repair rate constant (= ln 2 / t_{1/2,repair}). t: irradiation time. G → 1 for acute delivery (no time to repair between the two sub-lethal hits required for the β term); G → 0 for very prolonged or very low dose-rate delivery (sub-lethal damage repaired before a second hit can arrive). The formula above is for a constant dose rate; G is smaller for brachytherapy and continuous LDR irradiation than for acute external-beam delivery at the same total dose.`
      }
    ]
  },
  sim: {
    description: `The main panel plots two LQ clonogenic survival curves on a four-decade semi-log axis — one for a reference cell line (solid, stage-coloured) and one for a comparison line (dashed, amber). BED and EQD2 annotations are recomputed live. Toggle "Show fractionated" to overlay the fractionated-delivery curve (N equal fractions of d = D/n with full inter-fraction repair) against the single-acute-dose curve, so you can see the sparing advantage directly. The D10 and D50 intercepts, and the shoulder width D_q, are marked automatically.`,
    params: [
      { id:'csAlpha1',  label:'α  (line 1)',            min:0.05, max:0.80, step:0.01, value:0.30, unit:'Gy⁻¹' },
      { id:'csAB1',     label:'α/β  (line 1)',          min:1,    max:20,   step:0.5,  value:10,   unit:'Gy'   },
      { id:'csAlpha2',  label:'α  (line 2, dashed)',    min:0.05, max:0.80, step:0.01, value:0.15, unit:'Gy⁻¹' },
      { id:'csAB2',     label:'α/β  (line 2, dashed)',  min:1,    max:20,   step:0.5,  value:3,    unit:'Gy'   },
      { id:'csFracs',   label:'Fractions N  (1 = acute)',min:1,   max:30,   step:1,    value:1,    unit:''     },
      { id:'csMaxDose', label:'Max dose shown',          min:2,    max:20,   step:1,    value:10,   unit:'Gy'   }
    ]
  },
  anim: {
    description: `A simulated clonogenic assay: each coloured circle is one cell. Dose accumulates continuously at the rate set below; at each frame, cells are stochastically "killed" at the rate the LQ model predicts, fading to grey. When dose reaches the maximum, the assay resets. The live survival-fraction curve (bottom panel) traces the simulated colony count against the theoretical SF(D) line — watch them converge as the population grows large enough.`,
    params: [
      { id:'csAlpha1',  label:'α',       min:0.05, max:0.80, step:0.01, value:0.30, unit:'Gy⁻¹'    },
      { id:'csAB1',     label:'α/β',     min:1,    max:20,   step:0.5,  value:10,   unit:'Gy'       },

'tissue-response': {
  tagline: `Integrating cellular outcomes into whole-organ and whole-body effects`,
  detailed: true,
  fundamentals: {
    overview: [
      `Tissue and organ responses to radiation integrate the outcomes of many individual cells — killed, damaged and repaired, or unaffected — together with vascular and inflammatory signals, repopulation from surviving stem cells, and the mechanical or functional consequences of cell loss in architecturally organised structures. The result is not a single dose–response relationship but a family of them, distinguished most sharply between two mechanistically and clinically distinct categories: deterministic (tissue-reaction) effects and stochastic effects.`,
      `Deterministic effects — also called tissue reactions by ICRP 103 — have a practical threshold dose below which they essentially never occur, because enough stem cells survive to maintain structural integrity. Above that threshold, severity increases progressively with dose. Examples include skin erythema and moist desquamation, radiation pneumonitis, mucositis, and haematopoietic depression. The quantitative language of these effects is the TD₅₀ (tolerance dose giving a 50% complication probability under defined conditions), the slope m of the dose–response sigmoid, and whether the organ is architecturally serial (spinal cord, optic nerve — where loss of any one critical functional sub-unit causes failure of the whole organ, making the maximum dose the binding constraint) or parallel (lung, liver, kidney — where function is distributed and can tolerate partial loss, making mean dose or the volume fraction exceeding a threshold the more relevant constraint).`,
      `Stochastic effects — principally radiation-induced cancer and heritable disease — have no assumed threshold in the standard linear no-threshold (LNT) model: each dose increment adds a small, fixed probability to the background risk. Their mechanistic root is the rare misrepair of a DNA double-strand break into a carcinogenic mutation or chromosome aberration. In therapeutic radiobiology the quantitative tools for stochastic outcomes are the Normal Tissue Complication Probability (NTCP) and Tumour Control Probability (TCP) models. NTCP estimates the probability of a specific endpoint given a dose–volume histogram; TCP estimates the probability that every last clonogen in the tumour has been sterilised. The therapeutic window — the dose range where TCP is high and NTCP is acceptably low — is the central design constraint of radiation therapy, and the curve P₊ = TCP × (1 − NTCP) identifies the dose that maximises uncomplicated tumour control.`
    ],
    bullets: [
      `Deterministic (tissue-reaction) effects have a practical threshold: below it, stem-cell repopulation prevents clinical injury; above it, severity increases progressively with dose`,
      `Stochastic effects (cancer induction, heritable disease) have no assumed threshold under the LNT model — each dose increment raises probability, not severity`,
      `Early-responding tissues (skin, oral mucosa, bone marrow): high α/β ≈ 10 Gy, damage manifest within days–weeks; generally not dose-limiting in conventional fractionated RT`,
      `Late-responding tissues (spinal cord, lung parenchyma, kidney, rectum, salivary glands): low α/β ≈ 1–4 Gy, damage manifest months–years later — the clinically dose-limiting endpoint in curative radiotherapy`,
      `Serial organs (spinal cord, optic nerve, bowel): functional failure if any critical sub-unit is destroyed; maximum point dose (Dmax) is the binding plan constraint regardless of irradiated volume`,
      `Parallel organs (lung, liver, kidney, parotid): distributed function; mean dose and volume exceeding a threshold (e.g. V₂₀ for lung) are the relevant constraints; partial irradiation is well tolerated`,
      `NTCP Lyman probit model: two clinical parameters TD₅₀ and m convert a dose to a complication probability; the Lyman–Kutcher–Burman (LKB) extension uses gEUD to handle non-uniform DVHs`,
      `TCP Poisson clonogen model: TCP = exp(−N₀ × SF(D)) — tumour control requires sterilisation of every one of the N₀ initial clonogens; steep dose–response arises from the near-zero SF needed at clinically used doses`,
      `Uncomplicated tumour control probability P₊ = TCP × (1 − NTCP) defines the therapeutic window and is maximised at the ideal prescription dose`
    ],
    eqs: [
      {
        tex: `t(D)=\\frac{D-TD_{50}}{m\\cdot TD_{50}},\\qquad \\mathrm{NTCP}(D)=\\Phi(t)=\\frac{1}{\\sqrt{2\\pi}}\\int_{-\\infty}^{t}e^{-x^2/2}\\,dx`,
        note: `Lyman probit NTCP model. TD₅₀: the uniform whole-organ dose causing the specified endpoint in 50% of the population (tabulated per organ and endpoint by Emami et al. 1991 and QUANTEC 2010). m: slope parameter — smaller m gives a steeper, more cliff-like sigmoid; larger m gives a shallower, more gradual rise. Φ(t): the standard normal cumulative distribution function, producing the familiar S-shaped dose–response curve. Both TD₅₀ and m are extracted from clinical complication data and are specific to the endpoint, fractionation schedule, and patient population.`
      },
      {
        tex: `TD_{50}(v)=\\frac{TD_{50}(1)}{v^{\\,n}},\\qquad \\mathrm{gEUD}=\\left(\\sum_i v_i\\,D_i^{\\,a}\\right)^{\\!1/a}`,
        note: `Volume effect in the Lyman model. v: fraction of the organ irradiated uniformly; n: volume-effect exponent (n→1 for parallel organs with a strong volume effect; n→0 for serial organs where TD₅₀ is independent of irradiated volume). The Lyman–Kutcher–Burman (LKB) extension handles non-uniform dose distributions by first reducing the DVH to a generalised equivalent uniform dose (gEUD; Niemierko 1997): vᵢ is the volume fraction receiving dose Dᵢ, and a is the organ-specific parameter (a→+∞ for serial; a = 1 gives mean dose; a→−∞ for TCP, giving weight to the minimum dose). gEUD is then used as the input dose D to the Lyman sigmoid above.`
      },
      {
        tex: `\\mathrm{TCP}=\\exp\\!\\bigl(-N_0\\cdot SF(D,N)\\bigr),\\quad SF=e^{-N\\bigl(\\alpha d+\\beta d^2\\bigr)},\\quad d=D/N`,
        note: `Poisson TCP model (uniform dose). N₀: initial number of clonogenic tumour cells — typically 10⁶–10⁹ for a macroscopic tumour. SF(D,N): the LQ clonogenic surviving fraction for N fractions of size d = D/N (see Cell Survival). The Poisson derivation gives the probability that the number of surviving clonogens is exactly zero — i.e., the tumour is sterilised. The extremely steep dose–response of TCP (often only 5–10 Gy wide) arises because: at the prescription dose the surviving fraction SF ≈ 1/N₀ ≪ 1, so even a small dose change shifts N₀ × SF from >> 1 (TCP ≈ 0) to << 1 (TCP ≈ 1).`
      },
      {
        tex: `P_+=\\mathrm{TCP}\\times(1-\\mathrm{NTCP})`,
        note: `Probability of uncomplicated tumour control. P₊ is the probability that the tumour is controlled AND no major complication occurs, assuming statistical independence. P₊ is zero at both very low doses (TCP → 0) and very high doses (NTCP → 1), and peaks at an intermediate "optimum dose" that balances tumour control against normal tissue damage — the figure of merit for treatment plan comparison and dose prescription. For multiple simultaneously irradiated organs at risk, the expression generalises to P₊ = TCP × ∏ᵢ(1 − NTCPᵢ).`
      },
      {
        tex: `\\underbrace{\\text{Early-responding}}_{{\\alpha/\\beta\\approx 10\\,\\text{Gy}}}\\!:\\;SF=e^{-(\\alpha D+\\beta D^2)}\\qquad\\underbrace{\\text{Late-responding}}_{{\\alpha/\\beta\\approx 1\\text{–}4\\,\\text{Gy}}}\\!:\\;SF=e^{-(\\alpha D+\\beta D^2)}`,
        note: `The same LQ model applies to both early- and late-responding tissues, but with very different α/β ratios. High α/β (≈10 Gy, early and tumour): the linear α-term dominates; dose per fraction matters relatively little; survival curve has a small shoulder. Low α/β (≈2–3 Gy, late-responding): the quadratic β-term is proportionally larger; reducing fraction size d preferentially spares these tissues relative to high-α/β tumours — the radiobiological justification for conventional fractionation (and conversely, for hypofractionation when tumour α/β < normal-tissue α/β, as in prostate cancer). BED = Nd(1 + d/(α/β)) and EQD2 are the clinical translation tools (see Cell Survival).`
      }
    ]
  },
  sim: {
    description: `The plot shows the Lyman probit NTCP curve (amber) for a dose-limiting late-responding normal tissue and the Poisson-LQ TCP curve (crimson) for the tumour, as functions of prescribed dose. The shaded region between the two curves marks the therapeutic window — the dose range where tumour control probability is high while the complication probability remains low. The dashed grey curve is P₊ = TCP × (1 − NTCP), which peaks at the "optimum dose". Adjust TD₅₀ and slope m to shift or steepen the normal tissue response; adjust log N₀ and α/β to move the TCP sigmoid. Annotated callouts show TD₅₀, TCD₅₀, and the NTCP at the dose giving 90% tumour control.`,
    params: [
      { id:'trTD50',  label:'Normal tissue  TD₅₀',          min:20,   max:80,  step:1,   value:55,  unit:'Gy'  },
      { id:'trM',     label:'NTCP slope  m',                 min:0.05, max:0.70,step:0.01,value:0.28, unit:''   },
      { id:'trLogN0', label:'Tumour clonogens  log₁₀(N₀)', min:4,    max:10,  step:0.1, value:7,   unit:''    },
      { id:'trAB',    label:'Tumour  α/β',                   min:1,    max:20,  step:0.5, value:10,  unit:'Gy'  },
      { id:'trN',     label:'Fractions  N',                  min:1,    max:40,  step:1,   value:25,  unit:''    }
    ]
  },
  anim: {
    description: `Two cell populations are irradiated simultaneously as dose accumulates. Amber cells (left) represent a late-responding normal tissue (α=0.08 Gy⁻¹, α/β=3 Gy); crimson cells (right) represent a tumour (α=0.40 Gy⁻¹, α/β adjustable). Cell brightness encodes log₁₀ SF — tumour cells dim faster because high α means more single-track lethality, and high α/β means the LQ curve has less protective curvature. The TCP and NTCP gauges update live; watch the therapeutic window open as tumour cells are sterilised while normal tissue SF remains comparatively high. Adjust fractions to see how reducing dose per fraction widens the window for late-responding tissue.`,
    params: [
      { id:'trTD50', label:'Normal tissue  TD₅₀',  min:20,  max:80,  step:1,   value:55,  unit:'Gy'      },
      { id:'trAB',   label:'Tumour  α/β',           min:1,   max:20,  step:0.5, value:10,  unit:'Gy'      },
      { id:'trN',    label:'Fractions  N',           min:1,   max:15,  step:1,   value:5,   unit:''        },
      { id:'trRate', label:'Dose rate',              min:0.05,max:1.5, step:0.05,value:0.25,unit:'Gy/frame'}
    ]

'medical-physics': {
  tagline: `Radiation transport, dosimetry and biology applied in the clinic`,
  detailed: true,
  fundamentals: {
    overview: [
      `Medical physics applications translate the three preceding stages into clinical tool-sets. Computed tomography (CT) exploits differential photon attenuation to reconstruct cross-sectional maps of the linear attenuation coefficient μ — the same quantity that governs Stage 1.1. Radiation therapy (RT) shapes a precisely calculated absorbed-dose distribution to sterilise tumour clonogens while keeping normal-tissue complication probability acceptably low — the direct clinical implementation of Stages 2 and 3. Nuclear medicine (NM) introduces radiolabelled tracers whose biodistribution is imaged (SPECT, PET) or whose decay deposits a therapeutic dose inside targeted tissues, marrying Stage 1 transport physics with the internal dosimetry formalism of Stage 2.`,
      `All three modalities share the same photon-interaction cross-sections but span different energy ranges and intents. Diagnostic CT operates at 60–140 kVp, where differential photoelectric and Compton attenuation coefficients between soft tissue, fat, bone and air produce the tissue contrast encoded as Hounsfield units. Megavoltage therapy beams (4–25 MV photons, 4–25 MeV electrons, or protons up to 250 MeV/u) are chosen to maximise depth penetration and exploit the dose-buildup region for skin-sparing. Nuclear medicine radionuclides emit at characteristic energies — gamma emitters at 70–360 keV for imaging, beta and alpha emitters at 0.1–10 MeV for therapy — chosen to traverse tissue to external detectors or to deposit dose over short ranges inside target tissues.`,
      `All three share the mathematical structure of an inverse problem: CT reconstruction inverts the Radon transform of measured projection data; treatment planning optimises beam weights and angles to match a prescribed 3-D dose distribution; SPECT/PET reconstruction inverts the emission-detection geometry. In every case the forward model — photon attenuation, dose deposition, or radioactive decay — is exactly the physics of Stages 1–3, and clinical output quality is limited by how accurately that forward model is computed. All three therefore demand rigorous dosimetric quality assurance traceable to primary absorbed-dose standards, and all three apply the ALARA principle and effective-dose framework (Stage 2.3) to exposures they impose on patients, staff and the public.`
    ],
    bullets: [

'ct': {
      tagline:`Reconstructing a cross-sectional attenuation map from many projection measurements`,
      detailed:true,
      fundamentals:{
        overview:[
          `Computed tomography reconstructs a cross-sectional map of the linear attenuation coefficient μ(x,y) from many one-dimensional projections of a polychromatic x-ray beam. Each projection is a line integral of μ along one ray; collecting projections at many angles θ around the patient fills out the full set of data — the sinogram — needed to invert the problem and recover the 2-D image. The reconstructed values are reported as Hounsfield units (HU), a scale anchored so that water reads exactly 0 and air reads -1000, with soft tissue, fat and bone falling at characteristic positions in between.`,
          `Mathematically, the sinogram is the Radon transform of the attenuation map. Filtered backprojection (FBP) inverts it in two steps: each 1-D projection is filtered in the Fourier domain by a ramp filter |ω| (the Ram-Lak filter), which sharpens the otherwise blurred result of plain backprojection, and the filtered projections are then summed back across the image at every angle. Skipping the filtering step — pure backprojection — still converges toward the right image as more angles are added, but only after passing through a characteristic blurred, star-shaped intermediate stage, which is exactly what the live animation below shows frame by frame.`,
          `Two physical effects complicate the simple picture. Because the clinical beam is polychromatic rather than monochromatic, low-energy photons in the spectrum are preferentially absorbed as the beam traverses tissue, so the beam's effective energy rises and its effective attenuation coefficient falls with depth — beam hardening, which produces a "cupping" artifact (centre reading falsely low) unless corrected. Separately, image noise is fundamentally governed by the number of photons detected: fewer photons (lower tube current, lower kVp, thinner slices) means a noisier image at the same spatial resolution, which is the central dose-versus-quality trade-off that automatic exposure control and iterative/model-based reconstruction are designed to manage.`
        ],
        bullets:[
          `HU = 1000(μ−μ_water)/μ_water, anchored at water = 0 HU and air ≈ −1000 HU; window width/level (W/L) maps a chosen slice of this scale to an 8-bit greyscale for display`,
          `The sinogram p(s,θ) is the Radon transform of μ(x,y), built from projections at every gantry angle θ ∈ [0,π); the number of projections sets angular sampling density and controls streak artifacts from undersampling`,
          `Filtered backprojection (FBP) applies a Fourier-domain ramp filter |ω| to each projection before summing them back across the image; without that filter, backprojection alone produces a blurred, low-frequency-biased reconstruction`,
          `Beam hardening: a polychromatic spectrum loses its low-energy photons fastest, so μ_eff falls with path length through tissue — producing cupping artifacts that dual-energy and calibration-based corrections target`,
          `CTDIvol and dose-length product (DLP) are the standard scanner dose-output metrics; effective dose is approximated as E ≈ k × DLP using a region-specific conversion factor k`,
          `Image noise scales as 1/√(mAs): halving tube current doubles the HU standard deviation, trading dose for noise — the trade-off that automatic exposure control and iterative/MBIR reconstruction exploit to recover quality at lower dose`
        ],
        eqs:[
          {
            tex:`HU = 1000\\,\\frac{\\mu - \\mu_{\\text{water}}}{\\mu_{\\text{water}}}`,
            note:`Hounsfield unit definition. μ: linear attenuation coefficient of the voxel at the effective photon energy of the beam (cm⁻¹) — itself a function of the tube voltage (kVp), since a higher kVp produces a harder spectrum with a different effective energy. μ_water: attenuation of water at that same effective energy. Clinical anchors: air ≈ −1000 HU, fat ≈ −100 HU, soft tissue ≈ +20 to +80 HU, bone ≈ +400 to +1000 HU. Window width (W) and window level (L) — the two display sliders below — select the sub-range [L−W/2, L+W/2] of this scale and stretch it linearly to black-to-white display contrast.`
          },
          {
            tex:`p(s,\\theta) = \\int_{-\\infty}^{+\\infty}\\!\\int_{-\\infty}^{+\\infty} f(x,y)\\,\\delta(x\\cos\\theta + y\\sin\\theta - s)\\,dx\\,dy`,
            note:`Radon transform: the quantity actually measured by the scanner. p(s,θ): the log-attenuation measured along the ray at detector offset s and gantry angle θ — one pixel of the sinogram. f(x,y): the unknown 2-D map of linear attenuation coefficients (the image to be reconstructed). Sweeping θ over [0,π) and collecting a row of p(s,θ) at every angle fills the sinogram; the "number of projections" parameter below sets how many such rows are collected.`
          },
          {
            tex:`f(x,y) = \\int_0^{\\pi} q(s,\\theta)\\,d\\theta,\\quad s = x\\cos\\theta+y\\sin\\theta,\\quad q(s,\\theta) = \\int_{-\\infty}^{\\infty} P(\\omega,\\theta)\\,|\\omega|\\,e^{i2\\pi\\omega s}\\,d\\omega`,
            note:`Filtered backprojection (FBP). P(ω,θ): the 1-D Fourier transform of the raw projection p(s,θ). |ω|: the ramp filter, which boosts high spatial frequencies to cancel the natural 1/r blurring of plain backprojection. q(s,θ): the filtered projection, summed ("backprojected") across the image at every angle θ to recover f(x,y). The live animation accumulates *unfiltered* backprojections (q without the |ω| weighting) so you can see directly why the ramp filter is needed: the unfiltered sum converges slowly, through a blurred, star-shaped intermediate image.`
          },
          {
            tex:`I(d) = \\int_0^{E_{max}} S_0(E)\\,e^{-\\mu(E)\\,d}\\,dE`,
            note:`Polychromatic beam transmission — the source of beam hardening. S_0(E): the incident photon spectrum at the detector, shaped by tube voltage (kVp); a higher kVp shifts S_0(E) toward higher energies and increases penetration. μ(E): the (energy-dependent) attenuation coefficient — falls steeply with E. d: path length through tissue. Because low-energy photons in S_0(E) are absorbed fastest, the beam's *effective* energy — and hence its effective μ — rises and falls, respectively, as d increases, producing the cupping artifact a monochromatic model (Equation 1 above) cannot predict.`
          },
          {
            tex:`CTDI_{vol} = \\frac{CTDI_w}{\\text{pitch}},\\qquad DLP = CTDI_{vol}\\times L,\\qquad E \\approx k\\times DLP`,
            note:`CT dose metrics. CTDI_w: weighted CT dose index, (1/3) the central-axis measurement plus (2/3) the average peripheral measurement in a standard dosimetry phantom — both at fixed mAs and kVp. Pitch: table feed per rotation divided by beam width. CTDI_vol (mGy): the scanner's standardised output number for a given protocol. L: total scan length (cm). DLP (mGy·cm): scales CTDI_vol by scan length. E: effective dose estimate, using a region-specific conversion factor k (mSv per mGy·cm) — the same effective-dose framework introduced in Stage 2.3.`
          },
          {
            tex:`\\sigma_{HU} \\propto \\frac{1}{\\sqrt{N_{photons}}} \\propto \\frac{1}{\\sqrt{\\text{mAs}}}`,
            note:`Image noise. σ_HU: standard deviation of HU values in a uniform region — the quantum-noise floor of the image. N_photons: number of photons detected per ray, proportional to the tube current–time product (mAs). Halving mAs (or tube current) doubles σ_HU at fixed resolution: this is the direct physical link between dose and image quality. The "tube current proxy" slider in the live animation below injects noise into each simulated projection at a level set by exactly this 1/√(rate) relationship.`
          }
        ]
      },
      sim:{
        description:`Ray-traces a polychromatic x-ray beam through a five-tissue phantom (soft-tissue background containing lung, fat, bone and a small lesion insert) at the tube voltage set below, computing the sinogram p(s,θ) by numerical line integration at each projection angle, then displaying both the raw sinogram and the resulting HU-windowed image. Lower the projection count to see streak artifacts emerge from angular undersampling; sweep window width/level to step through lung, soft-tissue and bone display windows.`,
        params:[

          { id:'ctProjections', label:'Number of projections',  min:4,    max:180,  step:2,  value:60,  unit:''    },

          { id:'ctWindowLevel', label:'Window level (L)',       min:-1000,max:1000, step:10, value:40,  unit:'HU'  }

      anim:{
        description:`The gantry rotates continuously around the same phantom: each new angle adds one row to the live sinogram (right) while an unfiltered backprojection accumulates into a reconstructed image (left) — watch the blurred, star-like intermediate stage that motivates the ramp filter in true FBP. Tube voltage shifts contrast; gantry speed sets how many projection rows are added per frame; the tube-current proxy controls how much photon noise is injected into each projection, illustrating the dose-noise trade-off directly.`,
        params:[
          { id:'ctKvp',         label:'Tube voltage (kVp)',          min:60, max:140, step:5, value:100, unit:'kVp'    },
          { id:'ctGantrySpeed', label:'Gantry rotation speed',       min:1,  max:30,  step:1, value:6,   unit:'°/frame'},
          { id:'rate',          label:'Tube current proxy (mA)',     min:1,  max:10,  step:1, value:5,   unit:''       }
        ]

'radiation-therapy': {
  tagline: `Exploiting differential cell survival between tumour and normal tissue`,
  detailed: true,
  fundamentals: {
    overview: [
      `Radiation therapy (RT) delivers a shaped, three-dimensional absorbed-dose distribution to a tumour, exploiting the difference in cellular response between tumour and normal tissue — quantified by the linear-quadratic (LQ) model — to sterilise every clonogenic cell while keeping dose to surrounding organs at risk (OARs) within their complication thresholds. The physical task is to produce a dose distribution that conforms tightly to the planning target volume (PTV) and falls steeply outside it; the biological task is to choose a total dose and fractionation scheme that maximises tumour control probability (TCP) while keeping normal-tissue complication probability (NTCP) acceptably low.`,
      `The biologically effective dose (BED) is the central fractionation currency of the LQ model: BED = Nd(1 + d/(α/β)), where N is the number of fractions and d the dose per fraction. BED collapses any schedule onto a tissue-specific biological scale — but because it carries a different value for every α/β ratio, it must always be labelled (BED₁₀ for tumour at α/β = 10 Gy; BED₃ for late-responding OAR at α/β = 3 Gy). The equivalent dose in 2-Gy fractions (EQD2) converts BED to the standard fraction size, giving a single dose value that can be compared across trials, used to index NTCP parameters, and summed across re-treatment courses.`,
      `Inverse treatment planning optimises the beam-weight vector that minimises a cost function penalising deviations from prescribed tumour dose and exceedances of OAR tolerance doses. In intensity-modulated RT (IMRT), thousands of independently-weighted beamlets are optimised; in volumetric-modulated arc therapy (VMAT), gantry rotation, dose rate and multi-leaf collimator (MLC) aperture are co-optimised across a continuous arc. Proton and carbon-ion beams add a Bragg peak depth as a fourth lever — depositing the majority of dose within the target and virtually none beyond it, fundamentally improving the dose-bath trade-off relative to photon techniques.`
    ],
    bullets: [
      `BED = Nd(1 + d/(α/β)) [Gy]: biologically effective dose — tissue-specific; always label with α/β value (BED₁₀ for tumour, BED₃ for late OAR)`,
      `EQD2 = D_total × (d + α/β)/(2 + α/β) [Gy]: isoeffective total dose in standard 2-Gy fractions — the universal comparison currency for plan comparison and toxicity databasing`,
      `Conventional fractionation (1.8–2.0 Gy/fx) preferentially spares late-responding OARs (low α/β ≈ 2–3 Gy) relative to tumour (high α/β ≈ 8–10 Gy) — the radiobiological basis of the standard fractionation schedule`,
      `Hypofractionation (d > 2 Gy): beneficial when tumour α/β < normal-tissue α/β (e.g. prostate α/β ≈ 1.5–3 Gy); shortens treatment but demands careful OAR EQD2 monitoring`,
      `SBRT / SABR: 1–5 fractions of 6–20+ Gy; ablative intent; relies on steep dose gradients and high-precision delivery (image guidance, motion management)`,
      `TCP = exp(−N₀ × SF(D,N)): Poisson probability all N₀ clonogens are sterilised; steep sigmoid because SF must reach ≈ 1/N₀ ≪ 1`,
      `NTCP (Lyman probit): Φ((D − TD₅₀)/(m × TD₅₀)); TD₅₀ and slope m are organ- and endpoint-specific from Emami 1991 and QUANTEC 2010`,
      `P₊ = TCP × (1 − NTCP): uncomplicated tumour control probability — peaks at the optimum prescription dose defining the therapeutic window`,
      `IMRT: thousands of beamlet weights optimised; VMAT: arc-modulated delivery; proton Bragg peak: zero exit dose — three complementary strategies widening the therapeutic window`,
      `DVH (dose-volume histogram) and its reduced metrics (V₂₀, D₉₅, gEUD) are the standard tools for plan evaluation and OAR constraint specification`
    ],
    eqs: [
      {
        tex: `BED = Nd\\left(1+\\frac{d}{\\alpha/\\beta}\\right) = D_{\\rm total}\\left(1+\\frac{d}{\\alpha/\\beta}\\right)`,
        note: `Biologically effective dose. N: fractions. d: dose per fraction (Gy). D_total = Nd. α/β: tissue ratio (Gy) — typically 8–12 Gy for tumours and early-responding tissue; 1–4 Gy for late-responding normal tissue. BED must always be labelled: BED₁₀ (tumour) or BED₃ (late OAR). Full sub-lethal damage repair between fractions is assumed.`
      },
      {
        tex: `EQD_2 = D_{\\rm total}\\cdot\\frac{d + (\\alpha/\\beta)}{2 + (\\alpha/\\beta)} = \\frac{BED}{1 + \\dfrac{2}{\\alpha/\\beta}}`,
        note: `Equivalent dose in 2-Gy fractions. Converts any schedule (N fractions of d Gy) to the isoeffective total dose in standard 2-Gy fractions. EQD2 is the universal currency for cross-trial comparison, cumulative OAR dose accounting across re-treatment courses, and indexing NTCP model parameters — which are calibrated to 2-Gy-fraction clinical experience.`
      },
      {
        tex: `\\mathrm{TCP} = \\exp\\!\\bigl(-N_0\\cdot SF(D,N)\\bigr),\\quad SF = e^{-N(\\alpha d+\\beta d^2)},\\; d=D/N`,
        note: `Poisson TCP model. N₀: initial clonogen count (typically 10⁶–10⁹). SF(D,N): LQ fractionated surviving fraction. The extremely steep dose–response (often only 5–10 Gy wide) arises because at the prescription dose SF ≈ 1/N₀, so a small dose change shifts N₀×SF from ≫1 (TCP ≈ 0) to ≪1 (TCP ≈ 1).`
      },
      {
        tex: `\\mathrm{NTCP}(D) = \\Phi\\!\\left(\\frac{D-TD_{50}}{m\\cdot TD_{50}}\\right),\\quad \\Phi(t)=\\frac{1}{\\sqrt{2\\pi}}\\int_{-\\infty}^{t}e^{-x^2/2}dx`,
        note: `Lyman probit NTCP. TD₅₀: dose producing the endpoint in 50% of patients (organ- and endpoint-specific). m: slope — smaller m gives a steeper sigmoid. The Lyman–Kutcher–Burman (LKB) extension handles non-uniform dose distributions by first reducing the DVH to a generalised equivalent uniform dose (gEUD) before applying this formula.`
      },
      {
        tex: `P_+ = \\mathrm{TCP}\\times(1-\\mathrm{NTCP})`,
        note: `Probability of uncomplicated tumour control. P₊ is zero at very low dose (TCP → 0) and very high dose (NTCP → 1), peaking at the "optimum dose" that defines the therapeutic window. For multiple OARs: P₊ = TCP × ∏ᵢ(1 − NTCPᵢ). Maximising P₊ is the biological rationale for IMRT, VMAT, and proton therapy.`
      },
      {
        tex: `\\min_{\\mathbf{w}\\ge0}\\sum_T w_T[\\bar{D}_T-D_T^{\\rm presc}]^2 + \\sum_{\\rm OAR}w_{\\rm OAR}[\\max(0,\\bar{D}_{\\rm OAR}-D_{\\rm OAR}^{\\rm tol})]^2`,
        note: `IMRT/VMAT inverse-planning objective (schematic). w: beamlet fluence weights ≥ 0. w_T, w_OAR: planner importance weights. D̄_T: PTV dose metric (mean dose or D₉₅). D̄_OAR: OAR dose metric (mean dose, Dmax, or DVH percentile). D_presc, D_tol: prescription and tolerance values. Solved by constrained quadratic programming over thousands of beamlet weights; the resulting fluence maps are realised by dynamic MLC motion.`
      }
    ]
  },

'nuclear-medicine': {
      tagline:`Imaging biodistribution or delivering dose with radioactivity placed inside the body`,
      detailed:true,
      fundamentals:{
        overview:[
          `Nuclear medicine differs fundamentally from CT and external-beam radiation therapy in where the source sits: instead of aiming a beam from outside, a radiopharmaceutical carrying a radionuclide is introduced into the body and either imaged from outside (SPECT, PET) or simply left to deposit its dose locally (radionuclide therapy). Every aspect of the modality — achievable image statistics, the available imaging time window, and the cumulated absorbed dose — is governed by the same exponential decay law that describes any radioactive source.`,
          `PET and SPECT solve the "which direction did this photon come from" problem in two completely different ways. PET exploits the unique signature of positron-electron annihilation: the two photons it produces are emitted in (nearly) exactly opposite directions at a known fixed energy, 511 keV, so detecting both within a narrow electronic coincidence timing window at two points on a detector ring defines a line of response (LOR) without any mechanical collimation. SPECT instead detects ordinary single gamma photons (from isotopes like Tc-99m or I-131) and is forced to discard every photon not travelling within a narrow angular acceptance set mechanically by a lead parallel-hole collimator — a brute-force but predictable method that trades sensitivity for resolution.`,
          `That difference in detection mechanism produces opposite failure modes. PET's electronic coincidence detection becomes contaminated by random coincidences — two unrelated single photons arriving within the timing window purely by chance — at a rate that grows with the *square* of the injected activity, so pushing activity ever higher eventually degrades rather than improves image quality. SPECT's collimator instead degrades gracefully and predictably with depth: spatial resolution worsens linearly with source-to-collimator distance, while geometric sensitivity stays nearly constant with that same distance. Once a distribution of activity is known (imaged or simply estimated), internal dosimetry via the MIRD formalism converts it into organ absorbed doses using the same time-integrated-activity and S-value machinery introduced at the parent Medical Physics Applications stage.`
        ],
        bullets:[
          `Activity decays exponentially, A(t) = A₀e^(−λt); λ = ln2/T½ sets both the imaging time window and the rate of dose accumulation`,
          `PET: positron-electron annihilation produces two ≈511 keV photons emitted back-to-back (collinear to within ≈0.25°); a coincidence timing window τ defines the line of response (LOR) joining the two detector hits`,
          `Positron range (isotope-dependent — ≈0.6 mm mean for F-18, ≈2.9 mm for Ga-68) and photon non-collinearity set an irreducible floor on PET spatial resolution that no detector improvement can remove`,
          `True coincidence rate scales linearly with activity; random coincidence rate scales with the square of the singles rate — so the random fraction grows disproportionately at high injected activity or wide τ, the classic "randoms problem" that limits how much activity usefully helps`,
          `SPECT substitutes a lead parallel-hole collimator for coincidence electronics: only photons travelling nearly parallel to the holes reach the crystal, discarding the large majority of emitted photons`,
          `Collimator spatial resolution degrades linearly with source-to-collimator distance d; geometric sensitivity is, to first order, independent of d — improving one (smaller hole-diameter-to-length ratio) always costs the other`,
          `MIRD internal dosimetry sums S-value × time-integrated activity over every source organ; the effective half-life T½,eff = T½,phys·T½,biol/(T½,phys+T½,biol) is always shorter than either component half-life alone`,
          `Theranostics pairs a diagnostic radionuclide (e.g. ⁶⁸Ga, PET) with a therapeutic one (e.g. ¹⁷⁷Lu, β⁻) on an identical targeting molecule, so the diagnostic scan directly predicts the therapeutic dose distribution`
        ],
        eqs:[
          {
            tex:`A(t) = A_0\\,e^{-\\lambda t},\\qquad \\lambda = \\frac{\\ln 2}{T_{1/2}}`,
            note:`Radioactive decay law. A(t): activity at time t (Bq, or clinically MBq/mCi). A₀: administered or initial activity. λ: decay constant (s⁻¹). T½: physical half-life of the radionuclide — fixed for a given isotope (e.g. ⁹⁹ᵐTc: 6.0 h; ¹⁸F: 110 min; ¹⁷⁷Lu: 6.6 d). This single law governs both how fast the available imaging signal fades and how fast dose accumulates in radionuclide therapy.`
          },
          {
            tex:`e^- + e^+ \\rightarrow \\gamma_1 + \\gamma_2,\\qquad E_{\\gamma1}=E_{\\gamma2}=m_ec^2=511\\,\\text{keV},\\qquad \\theta \\approx 180^\\circ \\pm 0.25^\\circ`,
            note:`Positron-electron annihilation — the physical basis of PET. After a positron-emitting radionuclide decays, the emitted positron travels a short distance, slows, and annihilates with an ordinary electron, converting both rest masses into two photons of fixed energy 511 keV emitted in (very nearly) opposite directions. θ: the angle between the two photon paths — deviates from exactly 180° by a small "acollinearity" (≈0.25° FWHM) because the annihilating pair retains a small residual momentum. Detecting both photons in coincidence is what defines a line of response without mechanical collimation.`
          },
          {
            tex:`FWHM_{PET}^2 \\approx FWHM_{det}^2 + \\left(\\frac{R_+}{2}\\right)^2 + (0.0022\\,D_{ring})^2`,
            note:`Approximate PET spatial-resolution budget (terms added in quadrature). FWHM_det: intrinsic detector-element resolution. R₊: mean positron range before annihilation — isotope-dependent (larger for higher-energy positron emitters like Ga-68 than for F-18), contributing roughly half its value to the blur. D_ring: detector ring diameter; the 0.0022 factor encodes the ≈0.25° photon non-collinearity FWHM contribution, which scales with ring size. This sets a resolution floor that exists regardless of detector electronics — the exact weighting of each term varies by detector design and reconstruction method, so treat this as an order-of-magnitude budget.`
          },
          {
            tex:`R_{random} = 2\\tau\\,S_1 S_2 \\approx 2\\tau S^2,\\qquad R_{true}\\approx \\varepsilon\\,A`,
            note:`Coincidence counting rates. τ: electronic coincidence timing window (ns) — two singles events arriving within this window are recorded as one coincidence, true or not. S₁, S₂: singles (single-photon) count rates at the two detector elements, each roughly proportional to the injected activity A; for a uniform ring S₁≈S₂≈S. ε: combined geometric and detection efficiency for a true annihilation pair. Because R_random grows with the *square* of activity while R_true grows only linearly, randoms eventually dominate at high A or wide τ. (The constants used in the simulation and animation below are illustrative, chosen to show this qualitative scaling rather than to match a specific scanner.)`
          },
          {
            tex:`f_{random} = \\frac{R_{random}}{R_{true}+R_{random}}`,
            note:`Random fraction of all detected coincidences. As f_random rises, lines-of-response increasingly connect detector pairs that did not share a common annihilation event, adding background noise and reducing image contrast and quantitative accuracy — exactly what the simulation and animation below trace out live as you sweep activity and coincidence window.`
          },

            note:`Parallel-hole collimator resolution and sensitivity. D: hole diameter. L_eff: effective septal (hole) length. d: source-to-collimator distance. K: a constant depending on hole shape and septal thickness. Resolution degrades linearly with distance d; geometric sensitivity g is, to first order, independent of d — the defining trade-off of collimator design (a more "open" collimator — larger D/L_eff — raises sensitivity at the cost of resolution, and vice versa). The simulation below holds L_eff fixed and varies only the ratio D/L_eff directly, so FWHM(d) = (D/L_eff)×(L_eff+d).`
          },

            tex:`D_T \\approx \\frac{A_0}{\\lambda_{eff}}\\,S(T\\!\\leftarrow\\!T),\\qquad T_{1/2,eff}=\\frac{T_{1/2,phys}\\,T_{1/2,biol}}{T_{1/2,phys}+T_{1/2,biol}}`,
            note:`MIRD self-dose approximation (the usually dominant term in the full multi-organ sum introduced at the parent Medical Physics stage). A₀: administered activity. λ_eff = λ_phys + λ_biol: effective decay constant, combining physical decay with biological clearance from the organ. S(T←T): self S-value (Gy/Bq·s) for organ T. T½,eff: effective half-life, always shorter than either the physical or the biological half-life alone — the faster of the two processes dominates clearance.`
          }
