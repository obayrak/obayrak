      ctx.fillText('D = ' + D.toFixed(2) + ' Gy   SF = ' + (aliveCount/N_CELLS).toExponential(2), W-6, 4);

      rtAnimState.raf = requestAnimationFrame(step);
    }
    rtAnimState.raf = requestAnimationFrame(step);
  }


/* ─── DNA Damage: live scanning-track SSB/DSB classifier ────────────── */
  function rtRunDnaDamageAnim(canvas, content, stage){
    rtAnimState.ddHits = [];
    rtAnimState.ddSSB = 0;
    rtAnimState.ddDSB = 0;
    rtAnimState.ddNextHitBP = 0;
    rtAnimState.ddScanBP = 0;

    function readParams(){
      const p = {};
      content.anim.params.forEach(function(def){
        const el = document.getElementById('p-' + def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    function step(){
      if(!document.body.contains(canvas)){ rtStopAnim(); return; }
      const p = readParams();
      const LET = p.ddLET, windowBP = Math.max(1, Math.round(p.ddWindow)), rate = p.ddRate;
      const fieldBP = Math.max(200, Math.round(p.ddFieldBP));

      const W_ionpair = 0.033;
      const sNM = W_ionpair / LET * 1000;
      const sBP = Math.max(0.05, sNM / 0.34);

      const sized = rtSizeCanvas(canvas);
      const ctx = sized.ctx, W = sized.w, H = sized.h;
      ctx.clearRect(0, 0, W, H);

      const padL = 14, padR = 14;
      const plotW = W - padL - padR;
      const yTop = H * 0.38, yBot = H * 0.62;

      const bpPerFrame = rate * fieldBP * 0.6;
      rtAnimState.ddScanBP += bpPerFrame;

      while(rtAnimState.ddNextHitBP < rtAnimState.ddScanBP){
        rtAnimState.ddHits.push({ bp: rtAnimState.ddNextHitBP, strand: Math.random() < 0.5 ? 0 : 1, used:false, type:null });
        rtAnimState.ddNextHitBP += -Math.log(Math.random()) * sBP;
      }

      const hits = rtAnimState.ddHits;
      for(let i = 0; i < hits.length; i++){
        if(hits[i].used) continue;
        let pairedJ = -1;
        for(let j = i+1; j < hits.length; j++){
          if(hits[j].bp - hits[i].bp > windowBP) break;
          if(!hits[j].used && hits[j].strand !== hits[i].strand){ pairedJ = j; break; }
        }
        if(pairedJ >= 0){
          hits[i].used = true; hits[pairedJ].used = true;
          hits[i].type = 'dsb'; hits[pairedJ].type = 'dsb';
          rtAnimState.ddDSB++;
        } else if((rtAnimState.ddScanBP - hits[i].bp) > windowBP){
          hits[i].used = true; hits[i].type = 'ssb';
          rtAnimState.ddSSB++;
        }
      }

      const viewStart = rtAnimState.ddScanBP - fieldBP;
      rtAnimState.ddHits = hits.filter(function(h){ return h.bp > viewStart; });
      if(rtAnimState.ddHits.length > 3000) rtAnimState.ddHits = rtAnimState.ddHits.slice(-3000);

      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, yTop); ctx.lineTo(padL+plotW, yTop); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(padL, yBot); ctx.lineTo(padL+plotW, yBot); ctx.stroke();

      function xPx(bp){ return padL + ((bp - viewStart) / fieldBP) * plotW; }

      rtAnimState.ddHits.forEach(function(h){
        const x = xPx(h.bp);
        if(x < padL - 4 || x > padL + plotW + 4) return;
        const y = h.strand === 0 ? yTop : yBot;
        if(h.type === 'dsb'){
          ctx.fillStyle = '#e0556b'; ctx.globalAlpha = 0.9;
          ctx.beginPath(); ctx.arc(x, (yTop+yBot)/2, 3.2, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#e0556b'; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.5;
          ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBot); ctx.stroke();
          ctx.globalAlpha = 1;
        } else if(h.type === 'ssb'){
          ctx.fillStyle = '#36c2d6'; ctx.globalAlpha = 0.8;
          ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = 'rgba(231,236,242,0.55)'; ctx.globalAlpha = 0.7;
          ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        }
      });

      ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.setLineDash([2,3]);
      const scanX = xPx(rtAnimState.ddScanBP);
      ctx.beginPath(); ctx.moveTo(scanX, 4); ctx.lineTo(scanX, H-4); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(231,236,242,0.75)';
      ctx.font = '11px "IBM Plex Mono", monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText('SSB: ' + rtAnimState.ddSSB + '   DSB: ' + rtAnimState.ddDSB + '   s\u2248' + sNM.toFixed(2) + ' nm', W-6, 4);

      rtAnimState.raf = requestAnimationFrame(step);
    }
    rtAnimState.raf = requestAnimationFrame(step);
  }


/* ─── Tissue Response: live cell-population / TCP-NTCP animation ─────── */
function rtRunTissueResponseAnim(canvas, content, stage) {
  var COLS = 8, ROWS = 7, N_CELLS = COLS * ROWS;
  /* Illustrative α values exaggerated to show differential killing within
     a short dose range (labelled as illustrative in the UI description). */
  var ALPHA_T = 0.40, ALPHA_N = 0.08, AB_N = 3.0;
  var MAX_D = 20;   // Gy display range — short so cells show dynamics
  var LOG_DECADES = 5;

  var dose = 0;
  var tumorCells  = Array.from({length:N_CELLS}, function(){return {fade:1};});
  var normalCells = Array.from({length:N_CELLS}, function(){return {fade:1};});
  var tcpTrace = [], ntcpTrace = [], ppTrace = [];

  function erfA(x) {
    var s = x<0?-1:1; x=Math.abs(x);
    var t=1/(1+0.3275911*x);
    return s*(1-(((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t)*Math.exp(-x*x));
  }
  function Phi(t) { return 0.5*(1+erfA(t/Math.sqrt(2))); }

  function readParams() {
    var p={};
    content.anim.params.forEach(function(def){
      var el=document.getElementById('p-'+def.id);
      p[def.id]=el?parseFloat(el.value):def.value;
    });
    return p;
  }

  function drawCells(ctx, cells, x0, y0, cw, ch, color) {
    cells.forEach(function(c, i) {
      var col=i%COLS, row=Math.floor(i/COLS);
      var cx=x0+col*cw+cw/2, cy=y0+row*ch+ch/2;
      var r=Math.min(cw,ch)*0.30;
      ctx.fillStyle=color; ctx.globalAlpha=Math.max(0.06, c.fade)*0.88;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      if(c.fade>0.5){
        ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.globalAlpha=c.fade*0.6;
        ctx.beginPath(); ctx.arc(cx,cy,r*0.32,0,Math.PI*2); ctx.fill();
      }
    });
    ctx.globalAlpha=1;
  }

  function updateFade(cells, sfLog) {
    /* Map log10(SF) → [0,1] brightness; all cells fade together (illustrative). */
    var logSF = Math.max(-LOG_DECADES, sfLog);
    var brightness = (logSF + LOG_DECADES) / LOG_DECADES;
    cells.forEach(function(c){ c.fade = Math.max(0.05, brightness); });
  }

  function step() {
    if (!document.body.contains(canvas)) { rtStopAnim(); return; }
    var p = readParams();
    var TD50 = p.trTD50, m = 0.28;
    var abT  = Math.max(0.1, p.trAB);
    var N    = Math.max(1, Math.round(p.trN));
    var rate = p.trRate;
    var betaT = ALPHA_T/abT, betaN = ALPHA_N/AB_N;

    dose += rate;
    if (dose > MAX_D) {
      dose=0; tcpTrace=[]; ntcpTrace=[]; ppTrace=[];
      tumorCells.forEach(function(c){c.fade=1;});
      normalCells.forEach(function(c){c.fade=1;});
    }

    var dfrac = dose/N;
    var sfT = Math.exp(-N*(ALPHA_T*dfrac+betaT*dfrac*dfrac));
    var sfN = Math.exp(-N*(ALPHA_N*dfrac+betaN*dfrac*dfrac));
    var tcp  = Math.exp(-1e4*sfT);         // N0=10^4 for visual range
    var ntcp = Phi((dose-TD50)/(m*TD50));
    var pp   = tcp*(1-ntcp);

    updateFade(tumorCells,  Math.log10(Math.max(1e-6, sfT)));
    updateFade(normalCells, Math.log10(Math.max(1e-6, sfN)));
    tcpTrace.push({d:dose,v:tcp}); ntcpTrace.push({d:dose,v:ntcp}); ppTrace.push({d:dose,v:pp});

    var sized = rtSizeCanvas(canvas);
    var ctx = sized.ctx, W = sized.w, H = sized.h;
    ctx.clearRect(0,0,W,H);

    /* ── Cell fields ───────────────────────────────────────────────── */
    var fieldH=Math.round(H*0.42), halfW=Math.floor(W/2)-2, divX=halfW+4;
    var padC=10, cw=(halfW-padC*2)/COLS, ch=(fieldH-padC*2-14)/ROWS;

    ctx.fillStyle='rgba(255,255,255,0.025)';
    ctx.fillRect(0,0,halfW,fieldH); ctx.fillRect(divX,0,W-divX,fieldH);
    ctx.strokeStyle='rgba(255,255,255,0.09)'; ctx.lineWidth=1;
    ctx.strokeRect(.5,.5,halfW-1,fieldH-1); ctx.strokeRect(divX+.5,.5,W-divX-1,fieldH-1);

    ctx.font='9px "IBM Plex Mono",monospace'; ctx.textBaseline='top'; ctx.textAlign='center';
    ctx.fillStyle='#e8a33d';
    ctx.fillText('Normal  \u03b1/\u03b2='+AB_N+' Gy (late)', halfW/2, 3);
    ctx.fillStyle=stage.accent;
    ctx.fillText('Tumour  \u03b1/\u03b2='+abT.toFixed(1)+' Gy', divX+(W-divX)/2, 3);

    drawCells(ctx, normalCells, padC,       14, cw, ch, '#e8a33d');
    drawCells(ctx, tumorCells,  divX+padC,  14, cw, ch, stage.accent);

    /* SF readout */
    ctx.font='9px "IBM Plex Mono",monospace'; ctx.textBaseline='bottom';
    ctx.fillStyle='#e8a33d'; ctx.textAlign='right';
    ctx.fillText('log\u2081\u2080 SF = '+Math.log10(Math.max(1e-9,sfN)).toFixed(1), halfW-4, fieldH-3);
    ctx.fillStyle=stage.accent; ctx.textAlign='left';
    ctx.fillText('log\u2081\u2080 SF = '+Math.log10(Math.max(1e-9,sfT)).toFixed(1), divX+4, fieldH-3);

    /* ── Gauges ─────────────────────────────────────────────────────── */
    var gTop=fieldH+8, gH=22, gPadL=56, gPadR=14, gW=W-gPadL-gPadR;
    [ {label:'TCP', val:tcp, color:stage.accent},
      {label:'NTCP',val:ntcp,color:'#e8a33d'},
      {label:'P\u208a', val:pp,  color:'rgba(160,195,225,0.85)'}
    ].forEach(function(g, i) {
      var gy=gTop+i*(gH+5), bw=Math.max(0,Math.min(gW,g.val*gW));
      ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(gPadL,gy,gW,gH);
      ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1;
      ctx.strokeRect(gPadL+.5,gy+.5,gW-1,gH-1);
      ctx.fillStyle=g.color; ctx.globalAlpha=0.72;
      ctx.fillRect(gPadL,gy,bw,gH); ctx.globalAlpha=1;
      ctx.fillStyle='rgba(231,236,242,0.78)'; ctx.font='10px "IBM Plex Mono",monospace';
      ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.fillText(g.label, gPadL-4, gy+gH/2);
      ctx.textAlign='left';
      ctx.fillText((g.val*100).toFixed(1)+'%', gPadL+bw+5, gy+gH/2);
    });

    /* ── HUD ─────────────────────────────────────────────────────────── */
    var hudY = gTop+3*(gH+5)+5;
    ctx.fillStyle='rgba(231,236,242,0.62)'; ctx.font='10px "IBM Plex Mono",monospace';
    ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillText('D = '+dose.toFixed(1)+' Gy  |  '+N+' fx  |  '+rate.toFixed(2)+' Gy/frame', W-6, hudY);
    ctx.fillStyle='rgba(231,236,242,0.28)'; ctx.font='8px "IBM Plex Mono",monospace';
    ctx.textAlign='left';
    ctx.fillText('\u03b1 values illustrative (tumour=0.40, normal=0.08 Gy\u207b\u00b9)  \u00b7  N\u2080=10\u2074', 6, hudY);

    /* ── Trace curve panel ─────────────────────────────────────────── */
    var cTop=hudY+20, cH=H-cTop-6;
    if(cH<24){rtAnimState.raf=requestAnimationFrame(step);return;}
    var cPL=46,cPR=10,pW=W-cPL-cPR,pH=cH-4;

    ctx.fillStyle='rgba(10,14,20,0.70)'; ctx.fillRect(0,cTop,W,cH);
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
    ctx.strokeRect(cPL+.5,cTop+.5,pW-1,pH-1);

    function txD(d){return cPL+(d/MAX_D)*pW;}
    function tyP(v){return cTop+(1-v)*pH;}

    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
    [0.5,1].forEach(function(v){ctx.beginPath();ctx.moveTo(cPL,tyP(v));ctx.lineTo(cPL+pW,tyP(v));ctx.stroke();});
    ctx.fillStyle='rgba(231,236,242,0.30)'; ctx.font='8px "IBM Plex Mono",monospace';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ['100%','50%','0%'].forEach(function(s,i){ctx.fillText(s,cPL-3,tyP([1,0.5,0][i]));});

    [ {trace:tcpTrace, color:stage.accent},
      {trace:ntcpTrace,color:'#e8a33d'},
      {trace:ppTrace,  color:'rgba(160,195,225,0.70)'}
    ].forEach(function(tp){
      if(tp.trace.length<2)return;
      ctx.beginPath(); ctx.strokeStyle=tp.color; ctx.lineWidth=1.8;
      tp.trace.forEach(function(pt,i){i===0?ctx.moveTo(txD(pt.d),tyP(pt.v)):ctx.lineTo(txD(pt.d),tyP(pt.v));});
      ctx.stroke();
    });

    ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(txD(dose),cTop); ctx.lineTo(txD(dose),cTop+pH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(231,236,242,0.24)'; ctx.font='8px "IBM Plex Mono",monospace';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText('Dose (Gy)', cPL+pW/2, cTop+pH+14);

    rtAnimState.raf=requestAnimationFrame(step);
  }
  rtAnimState.raf=requestAnimationFrame(step);
}

/* ─── Effective Dose: live body-dose animation ──────────────────────────── */
  function rtRunEffectiveDoseAnim(canvas, content, stage) {
    var accum       = {};     /* organ name → accumulated w_T × D_T */
    var frameN      = 0;
    var lastGeom    = -1;
    var lastEnergy  = -1;

    var ORGANS = [
      { name:'Red Bone Marrow', wT:0.12, dAP: 8, dPA:12, dLAT:10, by:0.47, bx:0.50, br:0.92, col:'#e05060' },
      { name:'Breast',          wT:0.12, dAP: 2, dPA:18, dLAT: 4, by:0.27, bx:0.42, br:0.68, col:'#f090a0' },
      { name:'Colon',           wT:0.12, dAP:11, dPA: 9, dLAT:10, by:0.60, bx:0.52, br:0.66, col:'#70c070' },
      { name:'Lung',            wT:0.12, dAP: 5, dPA:15, dLAT: 7, by:0.31, bx:0.44, br:0.76, col:'#70a0d8' },
      { name:'Stomach',         wT:0.12, dAP: 9, dPA:11, dLAT:10, by:0.44, bx:0.46, br:0.64, col:'#d0b848' },
      { name:'Gonads',          wT:0.08, dAP:14, dPA: 6, dLAT: 9, by:0.74, bx:0.50, br:0.56, col:'#b870d8' },
      { name:'Bladder',         wT:0.04, dAP:13, dPA: 7, dLAT: 9, by:0.68, bx:0.50, br:0.46, col:'#5898c8' },
      { name:'Oesophagus',      wT:0.04, dAP: 8, dPA:12, dLAT: 8, by:0.22, bx:0.50, br:0.36, col:'#b0b0b0' },
      { name:'Liver',           wT:0.04, dAP: 7, dPA:13, dLAT: 7, by:0.40, bx:0.57, br:0.60, col:'#b86830' },
      { name:'Thyroid',         wT:0.04, dAP: 3, dPA:17, dLAT: 7, by:0.15, bx:0.50, br:0.36, col:'#50c8a0' },
      { name:'Bone Surface',    wT:0.01, dAP: 3, dPA:17, dLAT: 5, by:0.56, bx:0.50, br:0.28, col:'#c8c8a0' },
      { name:'Brain',           wT:0.01, dAP: 4, dPA:10, dLAT: 7, by:0.06, bx:0.50, br:0.48, col:'#e8c858' }
    ];

    ORGANS.forEach(function(o){ accum[o.name] = 0; });

    function readParams() {
      var p = {};
      content.anim.params.forEach(function(def){
        var el = document.getElementById('p-' + def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    function step() {
      if (!document.body.contains(canvas)) { rtStopAnim(); return; }

      var p       = readParams();
      var geom    = Math.min(3, Math.max(0, Math.round(p.efGeom)));
      var E_keV   = Math.max(30, p.efEnergy);
      var rate    = Math.max(1, Math.round(p.efRate));
      var mu      = 0.190 * Math.pow(E_keV / 80, -0.52);

      /* Reset accum when geometry or energy changes */
      if (geom !== lastGeom || E_keV !== lastEnergy) {
        ORGANS.forEach(function(o){ accum[o.name] = 0; });
        rtAnimState.particles = [];
        frameN = 0;
        lastGeom = geom; lastEnergy = E_keV;
      }

      var sized   = rtSizeCanvas(canvas);
      var ctx     = sized.ctx, W = sized.w, H = sized.h;

      var BODY_W  = Math.min(Math.round(W * 0.30), 145);
      var CHART_X = BODY_W + 6;
      var CHART_W = W - CHART_X - 4;

      ctx.clearRect(0, 0, W, H);

      /* ── Body geometry helpers ── */
      var bMrg    = 5, tW = BODY_W - bMrg * 2;
      var headR   = Math.min(tW * 0.22, H * 0.105);
      var headCX  = bMrg + tW / 2;
      var headCY  = headR + 4;
      var neckW   = tW * 0.17, neckH = H * 0.038;
      var neckTop = headCY + headR;
      var shldH   = H * 0.028;
      var torsoW  = tW * 0.82, torsoX = bMrg + (tW - torsoW) / 2;
      var torsoTop = neckTop + neckH + shldH;
      var torsoH  = H * 0.430;
      var pelH    = H * 0.155, pelTop = torsoTop + torsoH;
      var pelW    = torsoW * 0.88, pelX = bMrg + (tW - pelW) / 2;
      var bodyTopY    = headCY - headR;
      var bodyBottomY = pelTop + pelH;
      var bodyTH      = bodyBottomY - bodyTopY;

      /* ── Body silhouette ── */
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(headCX, headCY, headR, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeRect(headCX - neckW/2, neckTop, neckW, neckH);
      var shldW = torsoW * 1.06, shldX = bMrg + (tW - shldW) / 2;
      ctx.beginPath();
      ctx.moveTo(shldX, neckTop+neckH); ctx.lineTo(shldX+shldW, neckTop+neckH);
      ctx.moveTo(shldX, neckTop+neckH); ctx.lineTo(torsoX, torsoTop);
      ctx.moveTo(shldX+shldW, neckTop+neckH); ctx.lineTo(torsoX+torsoW, torsoTop);
      ctx.stroke();
      ctx.strokeRect(torsoX, torsoTop, torsoW, torsoH);
      ctx.strokeStyle='rgba(255,255,255,0.10)';
      ctx.strokeRect(pelX, pelTop, pelW, pelH);

      /* Map organ grid positions to canvas coords */
      function organXY(o){
        return {
          cx: headCX + (o.bx - 0.50) * torsoW * 0.75,
          cy: bodyTopY + o.by * bodyTH,
          r:  Math.max(4, headR * 0.38 * o.br)
        };
      }

      /* Draw organ heat map from accumulated counts */
      var maxAcc = 1e-9;
      ORGANS.forEach(function(o){ if(accum[o.name] > maxAcc) maxAcc = accum[o.name]; });
      ORGANS.forEach(function(o){
        var pos  = organXY(o);
        var norm = accum[o.name] / maxAcc;
        if (norm > 0.05) {
          ctx.fillStyle = o.col; ctx.globalAlpha = norm * 0.22;
          ctx.beginPath(); ctx.arc(pos.cx, pos.cy, pos.r*1.8, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = o.col; ctx.globalAlpha = 0.18 + norm * 0.65;
        ctx.beginPath(); ctx.arc(pos.cx, pos.cy, pos.r, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = o.col; ctx.lineWidth = 0.7; ctx.globalAlpha = 0.45;
        ctx.beginPath(); ctx.arc(pos.cx, pos.cy, pos.r, 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      });

      /* ── Spawn photon particles ── */
      var midY = torsoTop + torsoH * 0.32;
      var speed = 3.0;
      for (var i = 0; i < rate; i++) {
        var py = (geom < 3)
          ? midY + (Math.random() - 0.5) * torsoH * 0.8
          : bodyTopY + Math.random() * bodyTH;
        var vx, vy, startX, startY;
        if (geom === 0) {
          startX = 0; startY = py; vx = speed; vy = 0;
        } else if (geom === 1) {
          startX = BODY_W + 4; startY = py; vx = -speed; vy = 0;
        } else if (geom === 2) {
          startX = 0; startY = py + (Math.random() - 0.5) * 20; vx = speed; vy = (Math.random()-0.5)*0.4;
        } else {
          var ang = Math.random() * Math.PI * 2;
          var R   = Math.max(torsoW, torsoH) * 0.75;
          startX  = headCX + R * Math.cos(ang);
          startY  = midY   + R * Math.sin(ang);
          vx = -Math.cos(ang) * speed; vy = -Math.sin(ang) * speed;
        }
        rtAnimState.particles.push({ x:startX, y:startY, vx:vx, vy:vy, alive:true });
      }

      /* ── Compute per-organ dose rate for this frame ─────────────────── */
      function organDoseRate(o){
        var d = (geom===0)?o.dAP:(geom===1)?o.dPA:(geom===2)?o.dLAT:(o.dAP+o.dPA)/2;
        return Math.exp(-mu*d)*0.5/rate;   /* normalised photon-fluence proxy */
      }

      /* ── Advance particles, detect organ hits, draw ─────────────────── */
      rtAnimState.particles = rtAnimState.particles.filter(function(par){
        if (!par.alive) return false;
        par.x += par.vx; par.y += par.vy;

        /* Test against every organ circle */
        ORGANS.forEach(function(o){
          var pos  = organXY(o);
          var dx   = par.x - pos.cx, dy = par.y - pos.cy;
          if (Math.sqrt(dx*dx+dy*dy) < pos.r + 2){
            /* Flash burst */
            rtAnimState.particles.push({
              x:pos.cx, y:pos.cy, vx:0, vy:0, alive:true,
              burst:true, life:8, maxLife:8, r:pos.r*0.6, col:o.col
            });
            accum[o.name] += o.wT * organDoseRate(o);
            par.alive = false;
          }
        });
        if (!par.alive) return false;

        /* Draw ordinary photon dot */
        if (!par.burst) {
          var inside = par.x >= 0 && par.x <= BODY_W && par.y >= bodyTopY && par.y <= bodyBottomY;
          ctx.fillStyle   = inside ? '#9fb3c8' : 'rgba(255,248,120,0.8)';
          ctx.globalAlpha = inside ? 0.70 : 0.55;
          ctx.beginPath(); ctx.arc(par.x, par.y, inside ? 2 : 2.2, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
          var offLeft  = par.x < -8, offRight = par.x > BODY_W + 8;
          var offTop   = par.y < bodyTopY - 8, offBot = par.y > bodyBottomY + 8;
          return !(offLeft || offRight || offTop || offBot);
        }
        return true;
      });

      /* ── Draw burst flashes and age them ── */
      rtAnimState.particles = rtAnimState.particles.filter(function(par){
        if (!par.burst) return true;
        par.life--;
        if (par.life <= 0) return false;
        var t = par.life / par.maxLife;
        ctx.strokeStyle = par.col; ctx.lineWidth = 1.5;
        ctx.globalAlpha = t * 0.85;
        ctx.beginPath(); ctx.arc(par.x, par.y, par.r*(1.1 + (1-t)*1.2), 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
        return true;
      });

      /* ── Live bar chart ────────────────────────────────────────────── */
      var sorted  = ORGANS.slice().sort(function(a,b){ return accum[b.name]-accum[a.name]; });
      var N       = sorted.length;
      var cPadT   = 14, cPadB = 22;
      var cPlotH  = H - cPadT - cPadB;
      var rowH    = cPlotH / N;
      var barH    = Math.max(5, Math.min(11, rowH * 0.48));
      var nameCW  = 74, valCW = 48;
      var barSt   = CHART_X + nameCW;
      var barMW   = CHART_W - nameCW - valCW;
      var maxAcc2 = 1e-9;
      sorted.forEach(function(o){ if(accum[o.name]>maxAcc2) maxAcc2=accum[o.name]; });

      ctx.fillStyle='rgba(231,236,242,0.28)'; ctx.font='9px "IBM Plex Mono",monospace';
      ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText('w_T \u00d7 dose rate (arb.)', barSt, cPadT-1);

      sorted.forEach(function(o, i){
        var val  = accum[o.name];
        var bw   = (maxAcc2 > 0) ? (val / maxAcc2) * barMW : 0;
        var yMid = cPadT + i*rowH + rowH/2;
        var yTop = yMid - barH/2;

        if (i%2===0){ ctx.fillStyle='rgba(255,255,255,0.012)'; ctx.fillRect(CHART_X, cPadT+i*rowH, CHART_W, rowH); }

        var sn = o.name.length > 13 ? o.name.slice(0,12)+'\u2026' : o.name;
        ctx.fillStyle=o.col; ctx.font='bold 9px "IBM Plex Mono",monospace';
        ctx.textAlign='right'; ctx.textBaseline='middle';
        ctx.fillText(sn, CHART_X+nameCW-3, yMid);

        ctx.fillStyle=o.col; ctx.globalAlpha=0.72;
        ctx.fillRect(barSt, yTop, Math.max(1,bw), barH);
        ctx.globalAlpha=1;

        if (val > maxAcc2 * 0.04){
          ctx.fillStyle=o.col; ctx.font='9px "IBM Plex Mono",monospace';
          ctx.textAlign='left'; ctx.textBaseline='middle';
          ctx.fillText(val.toFixed(3), barSt+bw+3, yMid);
        }
      });

      /* ── Totals / HUD ─────────────────────────────────────────────── */
      var Etot = 0; ORGANS.forEach(function(o){ Etot+=accum[o.name]; });
      ctx.fillStyle='rgba(10,14,20,0.80)'; ctx.fillRect(CHART_X, H-cPadB, CHART_W, cPadB);
      ctx.fillStyle=stage.accent; ctx.font='10px "IBM Plex Mono",monospace';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(
        'E/D\u2080 \u2248 '+Etot.toFixed(3)+' (arb.)   |   '+
        ['AP','PA','LAT','Uniform'][geom]+'   '+E_keV+' keV   |   n='+frameN,
        CHART_X+4, H-cPadB/2
      );

      frameN += rate;
      rtAnimState.raf = requestAnimationFrame(step);
    }

    rtAnimState.raf = requestAnimationFrame(step);
  }

  function rtToggleAnim(key, btn){
    if(rtAnimState.raf){
      rtStopAnim();
      return;
    }
    const content = RT_CONTENT[key];
    const stage = rtFindNode(key).stage;
    const canvas = document.getElementById('rtAnimCanvas');
    if(!canvas) return;
    btn.textContent = '⏸ Pause';
    btn.setAttribute('data-state', 'playing');
    rtAnimState.particles = [];
    rtAnimState.color = stage.accent;
    if(key === 'attenuation'){
      rtRunAttenuationAnim(canvas, content, stage);
      return;
    }
    
    
    if(key === 'scattering'){
      rtRunScatteringAnim(canvas, content, stage);
      return;
    }
    
        if(key === 'dosimetry'){
      rtRunDosimetryAnim(canvas, content, stage);
      return;
    }
    
    if(key === 'absorption'){
      rtRunAbsorptionAnim(canvas, content, stage);
      return;
    }

       if(key === 'absorbed-dose'){
         rtRunAbsorbedDoseAnim(canvas, content, stage);
         return;
       }    

    if(key === 'equivalent-dose'){
      rtRunEquivalentDoseAnim(canvas, content, stage);
      return;
    }
    
        if(key === 'effective-dose'){
      rtRunEffectiveDoseAnim(canvas, content, stage);
      return;
    }

    if(key === 'radiation-biology'){
      rtRunRadiationBiologyAnim(canvas, content, stage);
      return;
    }

    if(key === 'dna-damage'){
      rtRunDnaDamageAnim(canvas, content, stage);
      return;
    }

    if(key === 'cell-survival'){
      rtRunCellSurvivalAnim(canvas, content, stage);
      return;
    }
    
       if(key === 'tissue-response'){
      rtRunTissueResponseAnim(canvas, content, stage);
      return;
    }



    if(key === 'medical-physics'){
      rtRunMedicalPhysicsAnim(canvas, content, stage);
      return;
    }

    if(key === 'radiation-therapy'){
      rtRunRadiationTherapyAnim(canvas, content, stage);
      return;
    }

    if(key === 'nuclear-medicine'){
      rtRunNuclearMedicineAnim(canvas, content, stage);
      return;
    }


    if(key === 'ct'){
      rtRunCTAnim(canvas, content, stage);
      return;
    }
    
        
    
    function readParams(){
      const p = {};
      content.anim.params.forEach(function(def){
        const el = document.getElementById('p-' + def.id);
        p[def.id] = el ? parseFloat(el.value) : def.value;
      });
      return p;
    }

    function step(){
      if(!document.body.contains(canvas)){ rtStopAnim(); return; }
      const p = readParams();
      const sized = rtSizeCanvas(canvas);
      const ctx = sized.ctx, W = sized.w, H = sized.h;

      const margin = 24;
      const xScale = (W - margin * 2) / (p.thickness * 1.3);
      const x0 = margin + xScale * (p.thickness * 0.15);
      const slabStartPx = x0, slabEndPx = x0 + p.thickness * xScale;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(slabStartPx, 0, slabEndPx - slabStartPx, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(slabStartPx, 0); ctx.lineTo(slabStartPx, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(slabEndPx, 0); ctx.lineTo(slabEndPx, H); ctx.stroke();
      ctx.setLineDash([]);

      for(let i=0; i<Math.round(p.rate); i++){
        rtAnimState.particles.push({ x:0, y: 6 + Math.random() * (H - 12), dir:1, alive:true });
      }

      const speedPxPerFrame = 2.4;
      const survive = Math.exp(-p.sigmaT * (speedPxPerFrame / xScale));

      rtAnimState.particles = rtAnimState.particles.filter(function(particle){
        if(!particle.alive) return false;
        particle.x += particle.dir * speedPxPerFrame;
        const physX = (particle.x - x0) / xScale;
        const insideSlab = physX > 0 && physX < p.thickness;
        if(insideSlab && Math.random() > survive){
          if(Math.random() < p.scatFrac){
            particle.dir = Math.random() < 0.5 ? 1 : -1;
          } else {
            particle.alive = false;
            ctx.fillStyle = rtAnimState.color;
            ctx.globalAlpha = 0.6;
            ctx.beginPath(); ctx.arc(particle.x, particle.y, 4, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
            return false;
          }
        }
        if(particle.x > W + 5 || particle.x < -5) return false;
        ctx.fillStyle = (particle.x < slabStartPx || particle.x > slabEndPx) ? '#9fb3c8' : rtAnimState.color;
        ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(particle.x, particle.y, 2.6, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        return true;
      });

      rtAnimState.raf = requestAnimationFrame(step);
    }
    rtAnimState.raf = requestAnimationFrame(step);
  }

  function rtRenderDetail(key){
    const info = rtFindNode(key);
    if(!info) return;
    const content = RT_CONTENT[key];
    const stage = info.stage;
    const node = info.node;
    const container = document.getElementById('rtContent');
    container.style.setProperty('--accent', stage.accent);
    rtStopAnim();

    if(content.detailed){
      const breadcrumbHtml = '<span class="code">' + node.code + '</span>' + stage.label + (info.isOverview ? '' : ' › ' + node.label);
      container.innerHTML =
        '<div class="rt-breadcrumb">' + breadcrumbHtml + '</div>' +
        '<h2>' + node.label + '</h2>' +
        '<p class="rt-tagline">' + content.tagline + '</p>' +
        rtSubTabsHTML(rtSubTab);
      rtRenderSubTab(key, rtSubTab);
      return;
    }

    const bulletsHtml = content.bullets.map(function(b){ return '<li>' + b + '</li>'; }).join('');
    const overviewHtml = content.overview.map(function(p){ return '<p>' + p + '</p>'; }).join('');
    const eqHtml = content.eq ? (
      '<div class="rt-section-label">Reference equation</div>' +
      '<div class="rt-eq-box"><div id="rtEqTarget"></div><div class="rt-eq-note">' + content.eq.note + '</div></div>'
    ) : '';
    const breadcrumbHtml = '<span class="code">' + node.code + '</span>' + stage.label + (info.isOverview ? '' : ' › ' + node.label);

    container.innerHTML =
      '<div class="rt-breadcrumb">' + breadcrumbHtml + '</div>' +
      '<h2>' + node.label + '</h2>' +
      '<p class="rt-tagline">' + content.tagline + '</p>' +
      '<div class="rt-overview">' + overviewHtml + '</div>' +
      '<div class="rt-section-label">Key concepts</div>' +
      '<ul class="rt-bullets">' + bulletsHtml + '</ul>' +
      eqHtml +
      '<div class="rt-section-label">Visualization</div>' +
      '<div class="rt-viz">' +
        '<div class="rt-viz-head"><span>Module ' + node.code + '</span>' +
        '<button class="rt-run-btn" type="button" data-key="' + key + '">▶ Run Simulation</button></div>' +
        '<div class="rt-canvas-wrap"><canvas id="rtCanvas"></canvas></div>' +
      '</div>' +
      '<div class="rt-todo">📝 <span>Placeholder module — overview only. Full derivation, additional equations and an interactive simulation are pending for this section.</span></div>';

    if(content.eq){
      const eqTarget = document.getElementById('rtEqTarget');
      rtRenderEq(eqTarget, content.eq.tex);
    }

    const canvas = container.querySelector('#rtCanvas');
    if(rtCurrentRO){ try{ rtCurrentRO.disconnect(); }catch(e){} rtCurrentRO = null; }
    if(canvas){
      rtDrawPlaceholder(canvas, stage.accent);
      rtCurrentRO = new ResizeObserver(function(){ rtDrawPlaceholder(canvas, stage.accent); });
      rtCurrentRO.observe(canvas);
    }
  }

  function rtPrefersReducedMotion(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function rtSelect(key, opts){
    opts = opts || {};
    rtActiveKey = key;
    rtSubTab = 'fundamentals';
    document.querySelectorAll('.rt-node').forEach(function(n){
      n.classList.toggle('active', n.getAttribute('data-key') === key);
    });
    const info = rtFindNode(key);
    if(!info) return;
    rtUpdatePrimaryActive(info.stage.key);
    rtRenderSecondaryTabs(info.stage);
    rtRenderDetail(key);
    if(opts.scroll && window.innerWidth <= 980){
      const panel = document.querySelector('.rt-detail-panel');
      if(panel) panel.scrollIntoView({ behavior: rtPrefersReducedMotion() ? 'auto' : 'smooth', block:'start' });
    }
  }

  let rtToastTimer = null;
  function rtToast(msg){
    const el = document.getElementById('rtToast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(rtToastTimer);
    rtToastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  /* =====================================================================
     INIT — no simulation or animation starts on its own; only the
     diagram is drawn and the default overview tab is shown.
     ===================================================================== */

  function rtInit(){
    rtBuildDiagram();
    rtRenderPrimaryTabs();
    rtSelect(RT_STAGES[0].key);

    document.getElementById('rtSvg').addEventListener('click', function(e){
      const node = e.target.closest('.rt-node');
      if(node) rtSelect(node.getAttribute('data-key'), { scroll:true });
    });
    document.getElementById('rtSvg').addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        const node = e.target.closest('.rt-node');
        if(node){ e.preventDefault(); rtSelect(node.getAttribute('data-key'), { scroll:true }); }
      }
    });
    document.getElementById('rtPrimaryTabs').addEventListener('click', function(e){
      const btn = e.target.closest('.rt-tab-primary');
      if(btn) rtSelect(btn.getAttribute('data-key'), { scroll:false });
    });
    document.getElementById('rtSecondaryTabs').addEventListener('click', function(e){
      const btn = e.target.closest('.rt-tab-secondary');
      if(btn) rtSelect(btn.getAttribute('data-key'), { scroll:false });
    });
    document.getElementById('rtContent').addEventListener('click', function(e){
      const subtabBtn = e.target.closest('.rt-subtab');
      if(subtabBtn){
        rtSubTab = subtabBtn.getAttribute('data-subtab');
        rtRenderSubTab(rtActiveKey, rtSubTab);
        document.querySelectorAll('.rt-subtab').forEach(function(b){
          b.classList.toggle('active', b === subtabBtn);
        });
        return;
      }
      const simBtn = e.target.closest('.rt-sim-run-btn');
      if(simBtn){ rtRunSim(rtActiveKey); return; }
      const animBtn = e.target.closest('.rt-anim-toggle-btn');
      if(animBtn){ rtToggleAnim(rtActiveKey, animBtn); return; }
      const btn = e.target.closest('.rt-run-btn');
      if(!btn) return;
      const info = rtFindNode(btn.getAttribute('data-key') || rtActiveKey);
      const title = info ? info.node.label : 'This module';
      rtToast('🚧 ' + title + ' simulation module — coming soon');
    });
    document.getElementById('rtContent').addEventListener('input', function(e){
      if(!e.target.classList.contains('rt-param-slider')) return;
      const valEl = document.querySelector('.rt-param-val[data-for="' + e.target.id + '"]');
      if(valEl){
        const unit = e.target.dataset.unit || '';
        valEl.textContent = e.target.value + (unit ? ' ' + unit : '');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', rtInit);
  
})();
</script>
